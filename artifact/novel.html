 اللوح","b":"\u003cp>في صباح اليوم الثاني والعشرين بعد المئة، دخلت شين يان المطبخ وهي تحمل لوحًا خشبيًا صغيرًا. كانت قد غسلت طرفه، لكن آثار السخام ظلت عند الحواف. وضعته على الطاولة بجانب دفتر الحصص.\u003c/p>\u003cp>سألها لين: «من أين أخذته؟»\u003c/p>\u003cp>«من خشب فائض عند يانغ. لم أطلب منه أن يصنعه. سألت عن قطعة لا يحتاج إليها.»\u003c/p>\u003cp>رفعت هو سانيانغ اللوح، وقلبته. «ليس عليه علامة.»\u003c/p>\u003cp>قالت شين يان: «نكتب الاسم عليه بعد أن يوافق الكاتب. لن نعلقه قبل أن يثبت في السجل.»\u003c/p>\u003cp>أخرجت من جيبها ورقة مطوية، وفتحتها على الموضع الذي تركت فيه خانة المهنة. كتبت بقلم رفيع: «بيت الحجر الأزرق». لم تزد كلمة طاحونة ولا ورشة ولا شركة. تركت مسافة في الأسفل للختم.\u003c/p>\u003cp>قرأ لين الاسم بصوت منخفض. لم يكن غريبًا على القرية؛ الحجر الأزرق هو الاسم الذي أطلقه بعض الزبائن على الدقيق الذي خرج من طاحونة جياو، بعدما رآوا غباره البارد يلمع تحت الضوء. لكنه لم يعد مجرد وصف لطعام. صار اسمًا يمكن أن يربط العمل بأشخاص، أو يوهم من يقرأه أن لهم أكثر مما يملكون.\u003c/p>\u003cp>قالت هو سانيانغ: «لماذا بيت؟»\u003c/p>\u003cp>أجابت شين يان: «لأن الكاتب يسجل بيوت العمل. لم أكتب أسرة ولا ملكية.»\u003c/p>\u003cp>«والحجر الأزرق؟»\u003c/p>\u003cp>«اسم الدقيق الذي يعرفه الناس. لا أدعي أنه ملك لنا.»\u003c/p>\u003cp>قال لين: «إن كتبنا طاحونة جياو وحدها، سيبدو أننا مجرد عاملين فيها. وإن كتبنا ورشة، سيحسب الناس أن لدينا حدادة وعمّالًا.»\u003c/p>\u003cp>أشارت هو سانيانغ إلى السطر. «هذا الاسم لا يضيف حصتي ولا يحذفها.»\u003c/p>\u003cp>«أريد أن يبقى العقد هو الذي يحدد الحصص.»\u003c/p>\u003cp>«إذن قل هذا للكاتب.»\u003c/p>\u003cp>وضعت شين يان الورقة في الغلاف، ثم رتبت أربع نحاسات في كيس صغير. لم تخلطها بما بقي من النقد، ولم تضعها بين صفحات دفتر الدين. قالت: «الرسم أربع نحاسات. لا جباية اليوم.»\u003c/p>\u003cp>«نعرف ذلك»، قالت هو سانيانغ. «لكن خذوا الإيصال قبل أن تخرجوا من المجلس.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الطريق إلى المجلس، مروا من جانب الطاحونة. كان تشانغ هناك يضبط الوتد الذي يتصل بمقبض حجر الطحن. لم تكن الطاحونة تعمل في تلك الساعة؛ يوم الوعد، ولا زبائن عند الباب. وضع لوحًا رفيعًا تحت الوتد ليثبت موضعه، ثم ضربه مرة بمطرقة صغيرة.\u003c/p>\u003cp>قال لين: «أنتظرناك لنمشي معًا.»\u003c/p>\u003cp>«هذا الوتد لا ينتظر.» أخرج الحجر بحركة قصيرة، ثم أعاد تركيبه. «لن أذهب حتى أجربه.»\u003c/p>\u003cp>رفعت شين يان اللوح الذي أحضرته. «هل تعرف هذا الخشب؟»\u003c/p>\u003cp>أخذه منها، مرر ظفره على سطحه، وشمه. «زان قديم. لا يصلح لجزء يحمل الوزن، لكنه يصلح للكتابة إذا لم تتركيه قرب الموقد.»\u003c/p>\u003cp>«هل تستطيع أن تثبت أسفلَه عارضة صغيرة؟»\u003c/p>\u003cp>«أستطيع. لكني لا أوقع على شيء اسمه ورشة.»\u003c/p>\u003cp>قال لين: «لم يطلب أحد ذلك.»\u003c/p>\u003cp>«إذا صار لي اسم في سجلهم، سيطلبون مني صنع حديد لبيت ليو بثمن يختارونه. أريد أن أعرف ما كتبه وو قبل أن أضع يدي على أي ورقة.»\u003c/p>\u003cp>قالت شين يان: «اسم الحرفة لا يجعلك موظفًا. لن نضيف اسمك إلا بقرار منك.»\u003c/p>\u003cp>«جيد.» أعاد اللوح إليها. «خذوا نسخة أولًا.»\u003c/p>\u003cp>مضوا نحو المجلس. في الساحة كان الكاتب وو قد أخرج سجل الحرفيين إلى الطاولة الكبيرة. وضع فوقه حجرًا يمنع الصفحة من الانطواء، وأمامه ثلاثة إيصالات خالية. حين رأى الورقة قال:\u003c/p>\u003cp>«هل وجدتما الاسم؟»\u003c/p>\u003cp>قالت شين يان: «بيت الحجر الأزرق.»\u003c/p>\u003cp>كرر وو الكلمات، ثم نظر إلى لين. «هل توافق؟»\u003c/p>\u003cp>قال: «بشرط أن يثبت تحت الاسم أن المورد هو طاحونة جياو المستأجرة، وأنه لا يغير ملكية الأرض ولا حصص العقد.»\u003c/p>\u003cp>«هذا مفهوم من السجل.»\u003c/p>\u003cp>قالت هو سانيانغ: «ليس عند كل من يقرأه.»\u003c/p>\u003cp>أخرج وو قلمًا. «أكتب أن الاسم تعريف لمورد الرزق، ولا ينشئ ملكًا في الآلة ولا الأرض ولا اسم العلامة. هل يكفي؟»\u003c/p>\u003cp>قالت شين يان: «اكتب أن حصص الشركاء تبقى في ملحق العقد، ولا يستبدلها السجل.»\u003c/p>\u003cp>أضافها. ثم أشار إلى الخانة الفارغة في نسخة التسجيل. «إذا أقر الجميع، أكتب الاسم الآن.»\u003c/p>\u003cp>قالت هو سانيانغ: «أنا لا أملك الاسم. أنا أقر بأن عقدي لا يتغير.»\u003c/p>\u003cp>قرأ وو العبارة عليها. «هل هذا صحيح؟»\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>قال تشانغ: «حضرنا كلنا، لكنني لا أقبل أن يكتب أني حداد السجل إن لم أسجل نفسي. أنا شاهد على الحصة، لا صاحب هذا البيت.»\u003c/p>\u003cp>قال وو: «سأثبت أنك شاهد، ولا أضيفك إلى أصحاب الحرفة.»\u003c/p>\u003cp>وقعت هو سانيانغ عند طرف الملحق. وضع لين بصمته تحت اسمه، وكتبت شين يان الاسمين بحروف واضحة. ثم سألها وو أين تريد أن يضع اسم البيت.\u003c/p>\u003cp>«في خانة مورد الرزق المشترك. لا فوق اسم أي شخص.»\u003c/p>\u003cp>أمال الدفتر حتى استطاعت أن ترى الخانة. كتب: «بيت الحجر الأزرق — تشغيل طاحونة جياو المستأجرة وإصلاح أجزائها الخشبية.» ثم أضاف أن العقد هو المرجع في الحصص والإيجار، وأن السجل لا يثبت ملكية للآلة أو للأرض. ترك خانة المنشأ على حالها: «غير مثبت».\u003c/p>\u003cp>قرأت شين يان السطرين. توقفت عند «إصلاح أجزائها الخشبية». قالت: «لا نصلح الحديد وحدنا. تشانغ هو من يعمل فيه.»\u003c/p>\u003cp>نظر وو إلى الحداد. «أثبت ذلك؟»\u003c/p>\u003cp>قال تشانغ: «اكتب أن أعمال الحديد على حسب اتفاق مستقل.»\u003c/p>\u003cp>كتب وو العبارة، ثم وضع دائرة على التعديل ليظهر في النسخة المنقولة. طلب من لين أن يوقع مرة أخرى قربها. لم يتعجل أحد. حين انتهوا، فصل الصفحة عن سجل النسخ بخط رفيع، ثم وضع علامة المجلس عند الطرف.\u003c/p>\u003cp>سأل لين: «هل يجيء أحد للتفتيش بعد تسجيلنا؟»\u003c/p>\u003cp>«إذا جاءت شكوى، أو احتاج المجلس إلى معرفة حال الطريق والمجرى. لا أرسل رجلًا يعد أكياسكم كل صباح.»\u003c/p>\u003cp>قالت شين يان: «ومن يسجل الشكوى؟»\u003c/p>\u003cp>«من يحملها إلى الباب. لا أعد بأن كل شكوى صحيحة، لكني أسجل مقدمها وموضوعها.»\u003c/p>\u003cp>«وهل نرى ما كُتب عنا؟»\u003c/p>\u003cp>«يمكنكما قراءة ما يخصكما في هذا السجل أمامي. لا تخرجان الدفتر من المجلس.»\u003c/p>\u003cp>أشارت إلى سطر الحصص. «هذا ليس من سجلنا، أليس كذلك؟»\u003c/p>\u003cp>«لا. هذا موضع مورد رزق، لا حساب الشركاء.»\u003c/p>\u003cp>كان ذلك الفصل مهمًا لها. لم ترد أن يصبح السجل العام دفترًا ثانيًا يضيف ديونًا أو نسبًا على ما كتبه أهل الطاحونة بأنفسهم. أما هو سانيانغ، فسألت إن كان المجلس سيبلغها إذا طلب الكاتب حضور الكفيل. أجاب وو بالإيجاب، بشرط أن يظل عنوانها في السجل كما هو. قالت: «النزل معروف. لا حاجة إلى وصف غرفتي.»\u003c/p>\u003cp>لم يصر. كتب اسم النزل فقط في خانة الكفيل، ثم راجع كل واحد منهم السطر الذي يخصه. لم تكن لهجة وو حادة، لكن يد شين يان ظلت على طرف الصفحة حتى انتهى من القراءة. تركت إصبعها قرب العبارة التي تفصل السجل عن عقد الإيجار.\u003c/p>\u003cp>قال وو: «هل هذا يكفي؟»\u003c/p>\u003cp>أجابت هو سانيانغ: «يكفي لهذا اليوم.»\u003c/p>\u003cp>قال: «الرسم أربع نحاسات.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخرج لين الكيس الصغير. عد أربع نحاسات أمام وو، ودفعها له واحدة واحدة. لم يضعها الكاتب في درج مفتوح؛ أخرج صندوقًا خشبيًا صغيرًا، أدخلها فيه، ثم أقفله. بعد ذلك ملأ إيصالين: واحدًا باسم لين وشين يان، وآخر في سجل المجلس. كتب على كليهما «رسم التسجيل» وذكر التاريخ، ثم ختمهما.\u003c/p>\u003cp>لم تمد شين يان يدها إلى الإيصال حتى قرأت المبلغ. كان الرقم واضحًا، والعبارة قصيرة. طوته من غير أن تطويه فوق الحبر، وأدخلته في جيب الدفتر الخاص بالمصاريف. قال وو إن موعد أول جباية في اليوم التالي، وأشار إلى تاريخها في ورقة مستقلة. ثم أوضح أن كل دفعة بعدها تأتي بعد تسعة أيام.\u003c/p>\u003cp>قال لين: «هل يتغير التاريخ إذا عملنا يوم الوعد ولم نأخذ أجرة؟»\u003c/p>\u003cp>«لا. الجباية على تسجيل البيت في هذه المدة، لا على كل كيس ولا على دخل كل يوم.»\u003c/p>\u003cp>«وإذا توقفت الطاحونة؟»\u003c/p>\u003cp>«يُنظر في وضع التسجيل. لا أعدك بإلغاء الرسم بعد أن دفعتموه.»\u003c/p>\u003cp>قالت هو سانيانغ: «ولا نطلبه.»\u003c/p>\u003cp>سلمهم وو نسختهم المختومة، ثم نظر إلى تشانغ. «هل لديك طلب تسجيل منفصل؟»\u003c/p>\u003cp>«ليس اليوم.»\u003c/p>\u003cp>«حسنًا. لا أضيف اسمك بغير إذن.»\u003c/p>\u003cp>أخرج نسخة مختصرة من الدفتر، وكتب عليها أن مورد رزقهما صار مسجلًا وأن المنشأ غير مثبت. طواها وسلمها إلى مساعده. «خذها إلى البوابة وعلقها تحت جدول الدور. لا تضع معها البيان.» ثم أوضح أن المقصود أن يعرف الناس أين يعملان، لا أن يعلن المجلس تصديقهما في كل ما قالاه. قالت شين يان: «اكتب وقت التثبيت أيضًا.» أضافه وو إلى الهامش، ثم أرسل الرجل.\u003c/p>\u003cp>خرجوا من المجلس ومعهم الورقة والإيصال. لم يتغير الثلج، ولم تختفِ الإشاعة عند البوابة. لكن في السجل لم يعودوا اسمين بلا عمل معلوم. لم يكن الاسم حماية كاملة؛ لم يمنحهم أرضًا، ولم يضمن أن يدفع الزبائن، ولم يجعل حصة هو سانيانغ أقل.\u003c/p>\u003cp>على الطريق، توقفت شين يان أمام لوح خشبي عُلقت عليه إعلانات السوق. لم يكن هناك مكان لإضافة اسم جديد، فلفت نظرها المساحة الفارغة أسفل ورقة الكاتب. قالت: «نحتاج إلى كتابة الاسم على اللوح عند الطاحونة، لا نقل أصل السجل.»\u003c/p>\u003cp>قال لين: «لو كتبنا اسم البيت هناك، قد يظن الناس أننا نبيع.»\u003c/p>\u003cp>«سنكتب فقط أيام العمل والسعر حين نتفق عليه. لا نكتب ما لا نعرفه.»\u003c/p>\u003cp>قالت هو سانيانغ: «اكتبوا أن يوم الوعد لا أجر فيه. لا أريد خصومة على باب المجرى.»\u003c/p>\u003cp>«ونكتب أن الطاحونة مؤجرة؟» سألت شين يان.\u003c/p>\u003cp>قالت العمة: «ليس على لوح العمل. هذا في السجل. اكتبوا الاسم وما يلزم الزبون فقط.»\u003c/p>\u003cp>لم يقرروا السعر في الطريق. لم يكن لديهم دقيق يباع في تلك الساعة، ولا يعرفون من سيأتي بعد تجمد النهر. أعاد لين الورقة إلى غلافها، ومرر إصبعه على الختم ليتأكد من جفافه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عادوا إلى الطاحونة قبل الظهر. كان تشانغ قد انتهى من الوتد. عند المدخل وقف فلاح من القرية الشرقية، يحمل كيسًا صغيرًا من الدخن على ظهره. لم يكن من أصحاب الرقع؛ لم يأتِ من قبل، ولم يحمل قطعة طين مختومة.\u003c/p>\u003cp>قال: «سمعت أنكم تقبلون الطحن بأجر. كم تأخذون؟»\u003c/p>\u003cp>نظرت هو سانيانغ إلى شين يان. لم تتكلم شين يان نيابة عنها. قالت العمة: «أنتظر أن أعرف وزن الكيس وحال الحبوب. ارفعه عن كتفك، ولا تفتحه فوق الجليد.»\u003c/p>\u003cp>أنزل الرجل حمله، ومسح كتفه. أخرجت شين يان ميزانها الخشبي، وتحسست الرباط الذي يثبت كفتيه. قالت: «نزن أولًا. إذا كان يوم وعد، فلك دورك المسجل. وإذا كان يوم أجر، نوضح مقدار الأجر قبل أن نفتح الكيس.»\u003c/p>\u003cp>قال الرجل: «أحتاج دقيقًا قبل المساء.»\u003c/p>\u003cp>قال لين: «نطحن بعد أن نعرف الدور والوزن.»\u003c/p>\u003cp>ظل الرجل واقفًا، ثم قال: «لا أستطيع أن أترك الكيس هنا يومًا كاملًا. لدي طفل مريض في البيت.»\u003c/p>\u003cp>قالت هو سانيانغ: «لم أطلب منك أن تتركه. سأخبرك بدورك قبل أن تمضي.»\u003c/p>\u003cp>سأل: «وإن جاء قبلي رجل معه رقعة؟»\u003c/p>\u003cp>أجابت: «يأتي في يومه. لا أغير الترتيب لواحد ولا أعدك أن أغيره لك.»\u003c/p>\u003cp>لم يبد مرتاحًا. فك رباط الكيس قليلًا، فظهرت حبات دخن متربة، بعضها رطب عند القاع. أخذت شين يان حفنة ومررتها بين أصابعها، ثم قالت إن البلل قد يسد الحجر ويجعل الدقيق أثقل. لم ترفض الحبوب، لكنها أخبرته أن يفرشها في بيته على قماش جاف قبل الطحن. قال إنه لم يكن يعرف ذلك. بقي لين قربه حتى أعاد ربط الكيس.\u003c/p>\u003cp>كان السؤال عن الأجرة قد صار سؤالًا عن الوقت والرطوبة والدور. لم يستطع الاسم الجديد أن يضمن له أن الحجر سيطحن قبل المساء. أشار لين إلى موضع جاف قرب الجدار، وقال إن بوسعه أن يضع الكيس هناك حتى يسمع منهم، لكن الرجل يظل مسؤولًا عن الحبوب. نظر الفلاح إلى المكان ثم هز رأسه. «لا أريد أن تضيع مني حبة.»\u003c/p>\u003cp>قالت هو سانيانغ: «إذن احمله إلى بيتك، وجففه. ارجع قبل أن تغيب الشمس، ونزن مرة أخرى.»\u003c/p>\u003cp>لم يكن ذلك بيعًا، ولا وعدًا بالطحن. حمل الرجل الكيس مجددًا، وأخبرهم باسمه: وانغ تشن. كتبته شين يان في ورقة صغيرة تحت كلمة «سؤال»، لا تحت سجل الزبائن ولا تحت الدين. قال لين: «إذا عدت، نبدأ من الوزن.»\u003c/p>\u003cp>قال وانغ: «سأعود قبل الغروب.» ثم ابتعد ببطء كي لا يميل الكيس نحو ساقه.\u003c/p>\u003cp>توقف وانغ عند اللوح الذي جلبته شين يان. «هذا اسمكم؟»\u003c/p>\u003cp>قالت: «اسم عملنا في السجل. ليس اسم الطاحونة.»\u003c/p>\u003cp>قال: «أنا لا أريد اسمًا. أريد أن أعرف كم آخذ معي.»\u003c/p>\u003cp>قال لين: «أخبرناك. نزن حين تعود بحبوب جافة، ثم نحدد الأجر قبل أن نطحن.»\u003c/p>\u003cp>نظر وانغ إلى الكيس على كتفه، ثم إلى الطريق. «سأرجع قبل الغروب.»\u003c/p>\u003cp>أومأت هو سانيانغ، ولم تكتب اسمه في سجل الزبائن. بقيت شين يان تضع إشارة في ورقة الأسئلة، لا أكثر. لم يكن وعده بالدخول محسومًا، ولم تكن حاجته إلى الدقيق كافية كي يتجاوزوا ترتيب الدور.\u003c/p>\u003cp>بعد أن غادر، أعطت شياو دو اللوح. كتب عليه «بيت الحجر الأزرق» بخطه الواضح، ثم وقف يقرأه قبل أن يجف الحبر. لم يضف «طاحونة» ولم يكتب اسم عائلة ليو. ثبّت لين اللوح عند المدخل الداخلي، حيث يراه من يقف في الدور ولا يظنه إعلانًا عن ملك جديد. ختم التسجيل بقي في جيب شين يان، واللوح صار يحمل الاسم الذي أقره وو. الأول في السجل، والثاني على الخشب؛ وبينهما شروط واضحة لا تحل محل عقد الطاحونة.\u003c/p>"},{"n":38,"t":"الفصل الثامن والثلاثون: ما يبقى للبيت","b":"\u003cp>في صباح اليوم الثالث والعشرين بعد المئة، لم يجد لين وانغ تشن عند الطاحونة. بقيت ورقته في الدفتر تحت كلمة «سؤال»، ولم يعرف إن كان سيعود قبل الغروب أو اختار طريقًا آخر. لم يقل إنهما خسرا زبونًا؛ لم يكن قد صار زبونًا أصلًا.\u003c/p>\u003cp>كان اليوم من أيام الطحن بأجر. فتحت شين يان سجل الدور، وراجعت أسماء من ينتظرون منذ الليلة الماضية. وقفت هو سانيانغ عند المدخل، وبيدها دفترها، ثم قالت إن اثنين من أصحاب الرقع وصلا قبل أن يفتحوا الباب. لم يعترض أحد. نقلت شين يان موعدهما إلى أعلى الصفحة، وتركت خانة أجر اليوم فارغة حتى يصل الكيس الأول.\u003c/p>\u003cp>وصل تشانغ متأخرًا قليلًا، يجر وراءه صندوق أدواته. لم يعتذر عن التأخير؛ وضعه تحت الرف، ثم تفقد الوتد الذي أصلحه في اليوم السابق. طرقه بخفة، وأدار حجر الطحن نصف دورة بيده.\u003c/p>\u003cp>قال لين: «هل تسمع شيئًا؟»\u003c/p>\u003cp>«أسمعك تتعجل.»\u003c/p>\u003cp>أعاد الضرب على الخشب. لم يصدر عن المحور سوى احتكاك منتظم. شد تشانغ حزامه، وناول لين قطعة من الدهن. «ادهن المحور بعد أن نزيل الغبار. لا تضعه على الحجر.»\u003c/p>\u003cp>قالت شين يان: «هل أكتب إصلاحًا جديدًا؟»\u003c/p>\u003cp>«اكتبي أني فحصت الوتد. لم أبدل شيئًا.»\u003c/p>\u003cp>سجلت ذلك. لم يكن في السطر أجر للحداد، ولا حصة إضافية. وضع تشانغ علامة صغيرة بجانب التاريخ، ثم جلس قرب الفوهة حتى يراها عند تشغيلها. قال إنه سيبقى إلى أن يمر الكيس الأول، ثم يذهب إلى عمله الخاص.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاءت امرأة تحمل كيس قمح مربوطًا بطرفين مختلفين. قالت إن زوجها ينتظر عند البيت ولا يستطيع حمله. لم يكن الكيس كبيرًا، لكن الرباط الرطب انزلق عن كتفها. تقدم لين ليساعدها، فرفعته شين يان من الجهة الأخرى حتى لا يفتح العقد.\u003c/p>\u003cp>قالت المرأة: «هذا ليس ليوم وعد. أحمل النحاس.»\u003c/p>\u003cp>قالت هو سانيانغ: «نزن قبل أن نتفق على الأجر.»\u003c/p>\u003cp>أخرجت شين يان الميزان الخشبي. كان الميزان خفيفًا، لكن عصاه مستقيمة، وكل كفة معلقة على بعد واحد من الوسط. وضعت حصاة اختبار صغيرة على الجانب المقابل للحبوب، ثم أزالتها حين استقرت الكفتان. لم تضف شيئًا إلى الوزن حتى تأكدت من أن القماش لا يجر الكيس إلى الأسفل.\u003c/p>\u003cp>سألت المرأة: «كم يبقى لي؟»\u003c/p>\u003cp>قالت شين يان: «بعد الوزن نحدد الأجر. هذا قمحك، ولن نخلط حسابه بحصة الدخن.»\u003c/p>\u003cp>«هل تسجلونه في دفتر العمة؟»\u003c/p>\u003cp>قالت هو سانيانغ: «أسجل ما يدخل إلى النزل وما يأخذه شركائي. أما وزن كيسك فتسجلهما صاحبة الميزان.»\u003c/p>\u003cp>لم يكن في هذا انتقاص من دفترها. كانت تريد أن تبقى لها رؤية ما يخصها. أخذت شين يان الوزن، وأعادته بصوت واضح. قالت المرأة إنه مطابق لما توقعت، ثم وافقت على الأجر قبل أن يفتحوا الكيس.\u003c/p>\u003cp>حين خرج الدقيق من بين الحجرين، كانت ذراته الخشنة تخشخش في الوعاء. أوقف لين الحجر، وجمع ما علق من الأطراف بملعقة خشب. لم يصفه بأنه ناعم. أخبر المرأة أن الدقيق سيحتاج إلى غربلة إذا أرادت عجينًا ألين. قالت إنها تعرف، ولفت نصفه بقطعة قماش لتمنع الهواء من الوصول إليه.\u003c/p>\u003cp>سألت هو سانيانغ: «هل نأخذ نحاسًا أم جزءًا من الدقيق؟»\u003c/p>\u003cp>قالت شين يان: «اتفقنا على النحاس.»\u003c/p>\u003cp>كتبت المبلغ في سجل اليوم، ثم قسّمت ما بقي: ثلاثة أعشار لهو سانيانغ، وعشر لتشانغ، وستة أعشار للزوجين. لم تكن تقسم قيمة الكيس كله؛ خصمت الأجر المتفق عليه أولًا. أعادت هو سانيانغ قراءة قسمة شين يان، ثم وضعت خطًا صغيرًا تحت نصيبها.\u003c/p>\u003cp>قالت: «لا تقربي أجر الحمار من الحصص.»\u003c/p>\u003cp>أجابتها شين يان: «لم أقربه. أجر العم تيان جزء من أربعين من أجر الطاحونة، ويُسجل مصروفًا قبل التقسيم. هذا الكيس لم يدره الحمار.»\u003c/p>\u003cp>«جيد.»\u003c/p>\u003cp>كان هناك مقدار صغير لم يقبل القسمة في النحاسات التي بقيت بعد الأجر. لم تدفعه شين يان إلى أي شريك، بل كتبته في خانة الباقي حتى يُضم إلى المقبوض التالي. قالت هو سانيانغ إن حبة النحاس لا تنشطر إذا اختلفت الحصص، وإنها لا تريد أن يضيع الباقي بين دفتر وآخر. سألها لين إن كان بوسعه أن يأخذ حصته الآن ثم يسجل الفرق.\u003c/p>\u003cp>قالت: «إذا أخذت، لا أستطيع أن أعرف هل دفعت لنفسك أم أخذت من المشترك.»\u003c/p>\u003cp>قال: «أضع علامة.»\u003c/p>\u003cp>«العلامة لا تعيد ما خرج.»\u003c/p>\u003cp>أعاد النحاسات إلى الصحن. كتبت شين يان المبلغ المقبوض، وحصة كل شريك، والباقي المؤجل، ثم قرأ لين الأرقام عليها. لم تكن عملية القسمة معقدة، لكن الدفتر ظل ينتظر وضوحًا حتى في أصغر فرق. نظر تشانغ إلى ما خصصته له، وطلب منها أن تضع نصيبه جانبًا إلى أن يعود في آخر النهار. لم يأخذه معه إلى الحدادة؛ لم يكن محتاجًا إليه في الطريق، ولم يرد أن يخلطه بثمن الحديد.\u003c/p>\u003cp>قال: «إذا احتاج أحد إلى عملي اليوم، فليأتِ إليّ. لا يدخل هذا الأجر في الطحن.»\u003c/p>\u003cp>قالت شين يان: «سيكون له سطر مستقل.»\u003c/p>\u003cp>أومأ، ثم عاد إلى مراقبة الحجر. لم يقل إن التسجيل صار نافعًا، ولم يقل إنه بلا فائدة. كان يختبر الوتد، ويحسب أجره، ويريد أن يبقى كل شيء في موضعه.\u003c/p>\u003cp>لم يتركا حصة زاو وهمية في يوم لم يعمل فيه. أما في سجل العمل العام، فقد كتبت شين يان وزن الحبوب، والأجر، واسم صاحبتها، وساعة الاستلام. لم تكتب اسم زوجها في خانة الزبون، لأنه لم يحضر ولم يدفع.\u003c/p>\u003cp>قال لين: «إذا عاد الرجل يسأل عن الطحن، سيكون عندنا مثال نريه.»\u003c/p>\u003cp>قالت شين يان: «مثال لا وعد. لا أقول إن كل كيس له الوقت نفسه.»\u003c/p>\u003cp>بعد قليل عاد فلاحان يحملان كيسين من الدخن. كان أحدهما صاحب رقعة، والآخر جاء معه ليعرف طريق الدور. فصلت شين يان بين الكيسين، وكتبت على الرقعة رقمها ووزنها قبل الطحن. لم تدع الرجلين يضعان حمليهما قرب ميزان القمح، كي لا يختلط الحساب. كان صاحب الرقعة يملك يومه المجاني، أما صاحبه فانتظر أن يعرف الأجر قبل أن يقرر.\u003c/p>\u003cp>سأل: «هل تطحنون له أولًا لأنه جاء معه؟»\u003c/p>\u003cp>قالت هو سانيانغ: «نطحن لصاحب الرقعة في وقته. أنت تقرر إن كنت تريد أن تنتظر أو ترجع.»\u003c/p>\u003cp>لم يرضَ الرجل تمامًا، لكنه لم يعترض. بقي عند الباب وساعد صاحبه على وضع الكيس فوق لوح جاف. بعد الطحن، عاد إلى لين وسأله عن الثمن. أخبره لين بما أخذوه من المرأة قبل ساعة، موضحًا أن القمح يختلف عن الدخن، وأن الوزن هو الذي يحسم. وافق الرجل على أن يأتي بكيس أصغر في اليوم التالي.\u003c/p>\u003cp>لم يكن يومًا مزدحمًا بما يكفي ليملأ المخزن، لكنه لم ينته بلا دخل. حفظت شين يان النحاسات في الكيس الصغير، وكتبت بجانبها كلمة «أجر» حتى لا تختلط بالنقد الذي في جيب لين. قسّمت هو سانيانغ نصيبها من الدقيق، وتركت حصة تشانغ في وعاء خاص حتى يعود.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء سون لي بعد الظهر. لم يحمل الحطب هذه المرة. كان يمشي مع عصاه، وفي اليد الأخرى لوحًا قصيرًا جففه عند موقد النزل. قالت شين يان إن ساقه لا تبدو أسوأ، لكن لا يحق له أن يختبرها على حمل ثقيل.\u003c/p>\u003cp>قال: «أستطيع حمل هذا.»\u003c/p>\u003cp>«اللوح خفيف. لا ترفعه فوق كتفك.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>أخذ منها قطعة القماش التي كانت تلف بها حواف الأوعية، ثم نقل لوحين جافين من المخزن إلى زاوية لا يصلها المطر. لم يطلب طعامًا قبل أن ينتهي، ولم تحسبه هو سانيانغ أجيرًا للطاحونة. كانت قد اتفقت معه على طعام اليوم ومقابل بسيط إذا بقي عمله خفيفًا، لكنه لم يفعل أكثر من النقل. لم يصبح ذلك وعدًا بعمل دائم.\u003c/p>\u003cp>قال لين: «حين تتعافى، نستطيع أن نتفق على عمل آخر إن احتجنا.»\u003c/p>\u003cp>أجاب سون: «لا تعدني بشيء قبل أن ترى ساقي.»\u003c/p>\u003cp>«لن أعدك.»\u003c/p>\u003cp>وضع اللوح، وجلس قرب الباب. مدت إليه هو سانيانغ وعاء حساء، ولم تسأله إن كان سيعود غدًا. أكل ببطء، ثم نظر إلى البخار الصاعد من الموقد.\u003c/p>\u003cp>في أثناء ذلك دخل وو ليبلغهم أن أول جباية مؤقتة قد سُجلت. أحضر إيصالًا مختومًا بمبلغ نحاستين، وكتب عليه الموعد التالي بعد تسعة أيام. راجعت شين يان المبلغ والتاريخ، ثم دققت أن كلمة «جباية» موجودة وأنها لا تذكر شيئًا عن الإيجار أو حصص الشركاء. أخذ لين الإيصال منها، وأدخله في غلاف التسجيل.\u003c/p>\u003cp>قال وو: «دُفعت في المجلس؟»\u003c/p>\u003cp>قالت هو سانيانغ: «نعم. لا تكتبها دينًا.»\u003c/p>\u003cp>«لم أكتبها دينًا.»\u003c/p>\u003cp>«ولا تخصمها من المئة والأربع والعشرين.»\u003c/p>\u003cp>«هذا ليس حساب الدين.»\u003c/p>\u003cp>قالت شين يان: «في سجلنا وضعتها في مصاريف التسجيل. والإيصال يثبتها.»\u003c/p>\u003cp>بدا على وو أنه يريد الرد، لكنه سحب طرف ردائه عن حافة المقعد، ثم قال: «احتفظوا به. إذا ضاع، لا أستطيع أن أعطيكم نسخة إلا بعد مراجعة السجل.»\u003c/p>\u003cp>لم تكن ثقتهم به كاملة، لكن الورقة كانت واضحة. كتبوا التاريخ التالي إلى جانبها، ووضع لين علامة عند اليوم التاسع بعد هذه الدفعة. لم يسددوا من الدين شيئًا في ذلك اليوم. ظل الرقم 124 نحاسة كما هو. وضعت شين يان الإيصال فوق صفحة المصاريف لا داخل دفتر الدين، وطلبت من لين أن يقرأ التاريخ مرة أخرى. كان اليوم الثالث والعشرين بعد المئة؛ كتبت إلى جواره موعد الدفعة التالية بعد تسعة أيام، ثم جعلت خطًا قصيرًا يصل الموعدين. لم يكن الخط قيدًا جديدًا، بل تذكيرًا بأنهم عرفوا متى يدفعون ومتى لا يدفعون.\u003c/p>\u003cp>قال لين: «إذا جاءت دفعة الطحن قبل الموعد، لا يعني ذلك أن علينا دفعها فورًا.»\u003c/p>\u003cp>قالت هو سانيانغ: «ولا يعني أن تتركها حتى تضيع.»\u003c/p>\u003cp>أجابت شين يان: «أسجلها في يومها. وحين يأتي الموعد، نخرج مقدار الجباية من مصاريف البيت.»\u003c/p>\u003cp>لم تعترض العمة. أعادت الإيصال إلى مكانه، وأغلقت الغلاف. بقيت حبات النحاس التي دخلت من الطحن منفصلة عن الحبات التي خرجت إلى المجلس.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين فرغت الطاحونة من آخر كيس، ذهب لين ليغسل الغبار عن يديه. عند مدخل المخزن لمح شين يان تمسك المكوّن المجهول الذي كان محفوظًا في التخزين. لم يكن ملقى في يدها كما يحدث حين ترتب الأشياء، بل قبضت عليه لحظة ثم أنزلته إلى الطاولة، كأن دفئًا خفيفًا وصل إلى راحة يدها من موضع لا يعرفه لين.\u003c/p>\u003cp>قال: «هل هو دافئ؟»\u003c/p>\u003cp>نظرت إلى أصابعها. «قليلًا.»\u003c/p>\u003cp>لم يلمسه. كان قد أخبرها قبل أيام أنه بارد حين حمله، وأنها أحست به دافئًا مرة عند النهر المتجمد. لم يظهر على طرف بصره شيء، ولم يطلب منه النظام تحليلًا. بقيت القطعة ساكنة، بلا ضوء ولا علامة. مسحتها شين يان بطرف القماش وأعادتها إلى موضعها.\u003c/p>\u003cp>قالت: «ربما يدي دافئة.»\u003c/p>\u003cp>«ربما.»\u003c/p>\u003cp>لم يسألها أن تشرح. لم يكن في هذا الدفء ما يكفي لصنع استنتاج، ولا أراد أن يكرر خطأه القديم في تحويل شيء غامض إلى معلومة مؤكدة. كتبت شين يان ملاحظة صغيرة في هامش دفترها، لا في سجل الطاحونة.\u003c/p>\u003cp>في المساء، جاء سون لي إلى باب المطبخ. كان قد أنهى طعامه، لكنه لم يغادر بعد. سمع صوت الحداد تشانغ من الخارج يسأل عن رجل يبيع الفحم في الجبال. رفع سون رأسه.\u003c/p>\u003cp>قال تشانغ: «تعرفه؟»\u003c/p>\u003cp>«رأيت رجاله عند النهر الكبير. لا أعرف اسمه.»\u003c/p>\u003cp>«هل هو تاجر؟»\u003c/p>\u003cp>«يبيع الفحم لمن يصل إليه. أخذوا الطريق العالي حين صارت الجسور خطرة.»\u003c/p>\u003cp>سأل لين: «هل مررت بهم؟»\u003c/p>\u003cp>«مررت بجانب آثارهم. لم أرَ وجوههم.»\u003c/p>\u003cp>قالت شين يان: «وماذا تعرف عن الرامي الذي تحدثت عنه؟»\u003c/p>\u003cp>نظر إليها سون، ثم إلى ساقه الملفوفة. «ما سمعته من رجلين. أحدهما قال إن سهمًا أصاب رفيقه عند موضع لم يستطع أن يميزه من الوادي. الآخر قال إن السهم جاء من الجبل. لم يتفقا على البعد ولا على الطريق.»\u003c/p>\u003cp>قال تشانغ: «إذن لا تعرف.»\u003c/p>\u003cp>«أعرف أن رجلاً مات، وأن الذين بقوا صاروا يخافون الطريق.»\u003c/p>\u003cp>لم يزد على ذلك. كان اسمه سون لي، وقد رأى ما يكفي ليعرف أثر الموت على الذين يمشون معه. لم يحول حكايته إلى دليل على رامٍ لا يخطئ. سأل لين عن اتجاه الطريق، فوصفه سون بخطوات وعلامات أرضية، لكنه أقر أنه لم يرَ مطلق النار.\u003c/p>\u003cp>سجلت شين يان في دفترها عمودين: «ما رآه» و«ما سمعه». كتبت تحت الأول آثار مرور رجال في الطريق العالي، وتحت الثاني حكاية السهم واختلاف الشاهدين. لم تُلحق بها مسافة من تقدير لين، ولم تكتب أن رامٍ يختبئ في الجبل.\u003c/p>\u003cp>عاد سون إلى الفراش المؤقت قبل حلول الليل. بقيت الطاحونة مغلقة، والإيصال محفوظًا، والدين كما كان. على عتبة الباب، سمعوا خرير ماء تحت طبقة الجليد عند المجرى الجانبي. لم يكن صوت نهر مفتوح، بل قطرة تتسرب من تحت غطاء برده طويلًا.\u003c/p>\u003cp>قالت شين يان: «الماء يتحرك.»\u003c/p>\u003cp>لم يقل لين إن الشتاء انتهى. مد يده إلى الحاجز القديم، وشعر ببرودة الخشب المبتل. ثم عادوا إلى الداخل قبل أن يجمد الطين تحت أقدامهم.\u003c/p>"},{"n":39,"t":"الفصل التاسع والثلاثون: السهم البعيد","b":"\u003cp>بعد ثلاثة أيام، في صباح اليوم السادس والعشرين بعد المئة، عاد سون لي إلى الطاحونة وهو يجر قدمه على طرفها. كانت الضمادة أنظف مما كانت، لكنه لم يضع عصاه جانبًا. وجد لين يختبر حركة الحجر، وتشانغ يضرب على الوتد بظهر مطرقته.\u003c/p>\u003cp>قال الحداد: «إذا كنت ستقف، فقف حيث لا يسقط عليك شيء.»\u003c/p>\u003cp>جلس سون قرب الجدار. «لن أحمل اليوم.»\u003c/p>\u003cp>«لم أسألك أن تحمل.»\u003c/p>\u003cp>أدار لين المحور بيده. لم يعلق الوتد، لكن الخشب أطلق صريرًا خافتًا عند نهاية الدورة. أشار تشانغ إلى موضعه. «هذا صوت احتكاك، لا كسر. نضع عليه دهنًا قبل أن نبدأ.»\u003c/p>\u003cp>كانت شين يان تكتب في دفتر العمل. فصلت بين الأوزان، وألحقت إيصال الجباية بتاريخ الدفع، ثم رسمت خطًا تحت موعد التسعة أيام التالية. لم تكن قد كتبت شيئًا عن الرجل الذي أخبرهم به سون قبل أيام. قالت إن الخبر لا يدخل في سجل الطحن، لكن يمكن أن تفتح له صفحة منفصلة، كما فعلت مع قصة الجنوب.\u003c/p>\u003cp>سأل لين: «هل يمكن أن يصف لنا ما سمع؟»\u003c/p>\u003cp>قالت: «إذا أراد. لا أحوله إلى شهادة على شيء لم يره.»\u003c/p>\u003cp>قال سون: «إن كنتما ستسجلان كلامي كما هو، أتكلم. لا أريد أن أرى اسمًا أُضيف إلى قصتي.»\u003c/p>\u003cp>أغلقت شين يان دفتر العمل، وفتحت ورقة جديدة. كتبت في أعلاها: «رواية سون لي — ما سمعه»، ثم أرتْه السطر.\u003c/p>\u003cp>«اكتب اسمي كاملًا كما نطقتُه.» قالها وهو ينظر إلى القلم.\u003c/p>\u003cp>أضافت الاسم. «وسأقرأه عليك قبل أن نغلق الورقة.»\u003c/p>\u003cp>لم يكن الرجل من أهل القرية، ولا يمكن أن يكون شاهدًا على طريقهم الحالي. سأله لين أين سمع الحكاية. قال إنهم كانوا يسيرون على مسار مرتفع فوق الوادي، حين وصلهم صياح رجل من المجموعة السابقة. لم يرَ المصاب عند لحظة السقوط، ولم يرَ من أطلق السهم. رأى بعد ذلك ثلاثة رجال يحملون الجريح، وسمع اثنين يختلفان في مكان الرامي.\u003c/p>\u003cp>قال لين: «ماذا قال الأول؟»\u003c/p>\u003cp>«قال إن السهم جاء من الجبل المقابل. لم يعرف أي قمة.»\u003c/p>\u003cp>«والثاني؟»\u003c/p>\u003cp>«قال إن الرامي كان أقرب، عند شق في الطريق. لم يره أيضًا.»\u003c/p>\u003cp>قالت شين يان: «هل اتفقا على موضع سقوط الجريح؟»\u003c/p>\u003cp>«لا. أحدهما قال عند المنعطف. الآخر قال بعده بمسافة قصيرة.»\u003c/p>\u003cp>سأل لين: «هل كان هناك أثر في الأرض؟»\u003c/p>\u003cp>هز سون رأسه. «لم أكن قريبًا. كنت أساعد امرأة على المشي. لم أتركها لأذهب إلى موضعهم.»\u003c/p>\u003cp>لم يقل ذلك معتذرًا، ولم يطلب منهم أن يكافئوه على اختياره. كان في ركبته خدش قديم، وعلى كفه خطوط من برد الطريق. شين يان كتبت أن الرجل لم يشاهد مكان الإصابة ولا الرامي، وأنه سمع روايتين مختلفتين من شخصين غير مسميين.\u003c/p>\u003cp>قالت: «أريد أن أتأكد من العبارة. هل قلت إن السهم لا يخطئ؟»\u003c/p>\u003cp>«لا. قال رجل إن رفيقه لم يفلت من سهمه. وقال آخر إن الرجل الذي يطلقه لا يخطئ.»\u003c/p>\u003cp>«هل رأيت أحدًا منهما يطلق؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«هل سمعت كلامهما في اللحظة نفسها؟»\u003c/p>\u003cp>«كانا يتكلمان عند موقد توقفنا عنده في الليل. أحدهما جاء بعد الآخر.»\u003c/p>\u003cp>وضعت شين يان فاصلة بين الخبرين. «إذن قد يكون الثاني سمعه من الأول.»\u003c/p>\u003cp>قال سون: «لا أعرف.»\u003c/p>\u003cp>أضافت: «لا نكتب أنهما شاهدان مستقلان.» ثم تركت مساحة فارغة. «هل تعرف عدد السهام التي أُطلقت؟»\u003c/p>\u003cp>«سمعت أنهم وجدوا سهمًا في الرجل. لا أعرف إن كان هناك غيره.»\u003c/p>\u003cp>كان الهواء باردًا في الغرفة، ورائحة الدهن تخرج من المحور. لم تكن هناك صورة لأرض بعيدة ولا ضوء من نظام لين. لم يكن يعرف أكثر مما يعرفه الرجل الجريح، ولم يكن ذلك كافيًا لصنع خطة. لكنهم يبيعون الفحم حين يفتح الطريق، ويعبرون الجسر لأعمال أخرى، ويعيش القرويون قرب المسار الذي وصفه سون.\u003c/p>\u003cp>قال لين: «إذا خرجنا إلى الطريق العالي، سنسأل عن حاله من شخص يعرفه، لا من أول عابر.»\u003c/p>\u003cp>تذكر وعد لاو ما حين عرض عليهما طريقًا للفحم في الربيع. لم يكن الموعد قريبًا، ولم تكن هناك شحنة على الطريق الآن، لكن عبارة «أصاب من بعيد» لا تصلح وحدها لأن يغيرا خط السير. سأل سون إن كان يعرف من يسافر في ذلك المسار عادة، فأشار إلى قافلة مرتين عند بداية الشتاء، وقال إن أصحابها ربما بقوا قرب الماء الكبير. لم يعرف أسماءهم ولا موعد عودتهم.\u003c/p>\u003cp>قال لين: «إذا عاد لاو ما، نسأله عن المسلك قبل أن نوافق على أي حمولة.»\u003c/p>\u003cp>«وتسأله إن كان سمع الحكاية من ناقل آخر، لا أن تعيدها كأنها معلومة مؤكدة.» قالت شين يان ذلك وهي تكتب اسم لاو ما في سطر منفصل تحت قائمة من يمكن سؤالهم. «حماية الطريق لا تبدأ بسلاح. تبدأ بمعرفة من يعرفه.»\u003c/p>\u003cp>قال تشانغ: «وإن لم يعرف أحد؟»\u003c/p>\u003cp>«نأخذ طريقًا أقصر إن كان آمنًا، أو لا نرسل الحمولة وحدها.» لم تكن خطة مكتملة، ولم تعدهم بأن القافلة ستحظى بحراسة. أبقت الورقة مفتوحة على خانة فارغة، كي لا تملأها من خوفهم.\u003c/p>\u003cp>«هل سأل أحدهما عن الريح؟» رفعت شين يان رأسها عن الورقة. «السهم البعيد يتأثر بها أكثر.»\u003c/p>\u003cp>قال سون: «لم أسمع ذلك. لم يصفا الجو أصلًا.»\u003c/p>\u003cp>سأله لين: «أكان الجبل فوق الطريق أم خلفه؟»\u003c/p>\u003cp>«لا أعرف أي جبل قصدا. عندنا أكثر من قمة تطل على الوادي. كنت في جهة منخفضة، وما رأيت إلا الطريق الذي نمشيه.»\u003c/p>\u003cp>قالت شين يان: «هل كان هناك قوس طويل؟»\u003c/p>\u003cp>«لم أشاهد سلاحًا. سمعت كلمة سهم فقط.»\u003c/p>\u003cp>لم تستطع أن تسجل طول القوس ولا موضع الرامي ولا اتجاه الريح. قالت إن ما لديهم لا يثبت حتى أن السهم جاء من مسافة بعيدة. كان أحد الرجلين يصر على أن الرامي بعيد، والآخر يظنه قريبًا، وكل واحد يبني قوله على ما سمع. لم تكن المسافة رقمًا يمكن مقارنته، ولم يصف أي منهما أثرًا رآه.\u003c/p>\u003cp>قال لين: «إذا كان أحدهما قد أخطأ في الموضع، قد يكون الآخر أخطأ في المسافة أيضًا.»\u003c/p>\u003cp>قال سون: «قد يكون. وقد يكون أحدهما يكذب ليخيف من يسلك الطريق.»\u003c/p>\u003cp>سألته شين يان: «هل رأيت من يهدد الناس بهذا الخبر؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>وضعت خطًا تحت «لا شاهد مباشر»، ثم أغلقت القلم. لم تجعل احتمال الخداع حقيقة، ولم تجعل احتمال إصابة بعيدة معجزة. بقي ما لديهم حكاية ناقصة، لا أداة لتحليل النوايا.\u003c/p>\u003cp>قال تشانغ: «وإذا رأيت أثر سهم؟»\u003c/p>\u003cp>«لن أقترب وحدي.»\u003c/p>\u003cp>ضحك سون ضحكة قصيرة ثم كتمها حين آلمته ساقه. «الرجلان اللذان سمعت منهما لم يرجعا إلى الطريق. لا أعرف إن كان خوفهما هو الذي أوقفهما أو شيء آخر.»\u003c/p>\u003cp>قالت شين يان: «هذا أيضًا لا نكتبه سببًا.»\u003c/p>\u003cp>«لم أقل إنه السبب.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد أن انتهى من الكلام، قرأت شين يان الورقة بصوت منخفض. صحح لها سون اسم الرجل الثاني الذي سمع منه الحكاية، أو بالأحرى أكد أنه لا يعرفه، فكتبت: «غير مسمى». لم تضع «رامي الجبال» في خانة الاسم. لم تكتب أنه قاتل أو قاطع طريق. لم يوجد في كلامه ما يكفي كي يربط السهم بالذئب الأعرج أو ببيت ليو أو بتشيان.\u003c/p>\u003cp>قال لين: «كيف نمنع أن تنتشر القصة باسمنا؟»\u003c/p>\u003cp>قالت: «لا ننقلها كحقيقة. إذا سألنا أحد، نقول إنها رواية سمعها سون. الورقة تبقى في الدفتر، لا على باب الطاحونة.»\u003c/p>\u003cp>قال تشانغ: «إذا كان هناك رامي، لن يغيره دفتر.»\u003c/p>\u003cp>«صحيح.» قالت شين يان. «لكن الدفتر يمنعنا من تغيير كلام سون ونحن نكرره.»\u003c/p>\u003cp>وافق سون على أن تضع علامة عند آخر سطر. لم يضع بصمة؛ لم يقرأ الكتابة ولا يعرف إن كانت تمثل كلامه. طلب منها أن تقرأها مرة أخرى، ثم قال إن المعنى صحيح. وضعت شين يان اسمه في هامش منفصل بوصفه صاحب الرواية، وأغلقت الصفحة.\u003c/p>\u003cp>دفع لين إليه وعاء ماء دافئ. «هل ستخبر بقية القادمين؟»\u003c/p>\u003cp>«إذا سألوا عن الطريق. لن أصرخ به في الحظيرة.»\u003c/p>\u003cp>قالت هو سانيانغ من عند الباب: «إذا حملت خبرًا يوقف الناس عن السير، لا تقله لطفل وحده. يأتي من يسألني.»\u003c/p>\u003cp>لم تعترضه ولا قالت إن بقاءه هنا يجعل الطريق آمنًا. كانت قد سمحت له أن يعمل قليلًا، ولم تعده بالإقامة الطويلة. أجابها بأنه سيسأل أولًا إن كانت القصة معروفة عند النازحين، ثم يترك لكل واحد أن يقرر إن كان سيغادر.\u003c/p>\u003cp>قالت: «لا تضع القرار في فمي.»\u003c/p>\u003cp>«لن أفعل.»\u003c/p>\u003cp>خرجت من الغرفة وعادت إلى القدر. لم يكن صوتها قاسيًا، لكنه ثبت حدًا لا تريد تجاوزه. أشار لين إلى ساق سون. «هل تقدر أن تمشي إلى النزل؟»\u003c/p>\u003cp>«أمشي.»\u003c/p>\u003cp>«مع العصا؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>ساعده على الوقوف، لكنه لم يحمل عنه وزنه. خطا سون بنفسه إلى الخارج، توقف عند العتبة، ثم تابع نحو النزل. تبعته شين يان بعينيها حتى ابتلعته زاوية الطريق. لم تكتب في الورقة أنه شجاع أو خائف. كتبته شاهدًا على كلامه فقط.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بقي لين وتشانغ قرب الطاحونة. لم يكن هناك زبون ينتظر، ولا كيس يحتاج إلى وزن. أخرج الحداد دهنًا كثيفًا من علبة صغيرة، ومرر مقدارًا يسيرًا على المحور. أدار الحجر بيده، ثم تركه. اختفى الصرير، لكن دوران الحجر بقي ثقيلًا من جهة واحدة.\u003c/p>\u003cp>قال لين: «هل علق شيء؟»\u003c/p>\u003cp>أدخل تشانغ إصبعه في الفاصل، وأخرج حبة قمح يابسة عالقة في الخشب. «هذا ليس من المحور. حجر قديم أو قشرة من كيس.»\u003c/p>\u003cp>كان ممكنا أن يسجلوا الصرير عطلًا ويستبدلوا الوتد، لكنهم لم يندفعوا. نظف لين المكان، ودار المحور مرة أخرى. استقام الدوران. كتبت شين يان في سجل الصيانة: تنظيف وفحص، لا استبدال. ثم أشارت إلى حصة تشانغ من أجر الأيام السابقة، التي بقيت في الوعاء.\u003c/p>\u003cp>قال: «آخذها بعد أن أبيع مطرقة صغيرة في السوق.»\u003c/p>\u003cp>«لماذا تنتظر؟»\u003c/p>\u003cp>«كيلا أخلطها بثمنها حين أحسب الحديد.»\u003c/p>\u003cp>أخذ الوعاء، وعد ما فيه، ثم وقعه في السجل. وضعه في كيس منفصل، وليس في حزامه. لم يكن المبلغ كافيًا ليغير موضعه في القرية، لكنه لم يعد مجرد عمل يوعد به. صار له طريق واضح من الزبون إلى الأجر.\u003c/p>\u003cp>في الساحة، ثبت مساعد وو ورقة صغيرة على اللوح العام. لم تكن بيان لين وشين يان كاملًا، بل سطرًا يقول إن «بيت الحجر الأزرق» يسجل مورد عمله عند طاحونة جياو، وتحت ذلك اسم هو سانيانغ ككفيلة. وقف رجلان يقرآنها. أحدهما سأل هل يمكن أن يأخذ نسخة من العقد، فقال المساعد إن السجل لا يبيعه ولا يسمح بنسخه بلا إذن. غادر الرجلان، ولم يطلبا منهما أن يرويا من أين أتيا.\u003c/p>\u003cp>عادت شين يان إلى الطاحونة، وقالت إن الورقة ظهرت عند البوابة. سألت هو سانيانغ إن كان وضع اسمها هناك يزعجها.\u003c/p>\u003cp>قالت: «لا. وافقت على الكفالة. لا أريد أن يكتبوا أني وافقت على شيء آخر.»\u003c/p>\u003cp>«العبارة مطابقة لما في السجل.»\u003c/p>\u003cp>«حسنًا.»\u003c/p>\u003cp>لم تكن الموافقة تعني أن الجرح اختفى. كان اسمها في مكان عام، كما كان ختمها على الورقة. كلما نظرت إليه تذكرت أنها صدقت قصة الجنوب قبل أن تسمع الحقيقة. لم تقل ذلك. رفعت الإناء عن النار، ثم طلبت من شين يان أن تفصل نصيب الدقيق عن نصيب النزل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند الغروب خرج لين ليتفقد مجرى الماء الجانبي، ومعه شين يان. لم يدخلا الماء ولم يرفعا ألواح الغطاء؛ اكتفيا بالنظر من الحافة. كان الجليد لا يزال يغلق النهر، لكنه لم يلتصق بالطين في طرف المجرى كما كان قبل أيام. خرجت منه قطرة، تبعتها أخرى، ثم انزلقت خيطًا رفيعًا على الحافة الصخرية.\u003c/p>\u003cp>قالت شين يان: «لن يدور الدولاب بهذا.»\u003c/p>\u003cp>«لا. الحاجز مقفل، والماء لا يكفي.»\u003c/p>\u003cp>«لكن الغطاء لم يعد جافًا.»\u003c/p>\u003cp>مد لين يده إلى طرف اللوح، فوجده رطبًا. سحبها قبل أن يصعد البلل إلى كمه. لم يترك أثرًا على الجليد ولا حاول كسره؛ لو كان ضعيفًا لانزلق الاثنان إلى الماء البارد. عادا إلى اليابسة، وغرسا عودًا صغيرًا عند الحافة ليروا إن ارتفع الماء غدًا.\u003c/p>\u003cp>في الطريق إلى النزل، مرّا قرب باب بيت مغلق. كان هناك أثر حافر يمتد في الطين ثم يختفي عند الجدار. لا يعرفان من مر، ولا متى. لم يكتبا في دفتر سون أنه الرامي. لم يربطا بين كل أثر وخبر سمعاه. كان الشتاء يترك علامات كثيرة، وبعضها لا يعني أكثر من مرور حيوان.\u003c/p>\u003cp>حين عادا، كانت الورقة الجديدة في دفتر شين يان مطوية على خبرين لا يتطابقان، والعود عند المجرى ينتظر ارتفاع الماء. لم ينفتح النهر بعد، لكن الحجر الذي خفت صريره بدأ يستعد لأول دوران في الربيع.\u003c/p>"},{"n":40,"t":"الفصل الأربعون: مكان في الدفتر","b":"\u003cp>بعد أربعة أيام، في صباح اليوم الثلاثين بعد المئة، ذهب لين وشين يان وهو سانيانغ إلى المجرى قبل أن يتجمع الناس عند الطاحونة. لم يكن النهر قد فتح مجراه. الجليد امتد في الوسط، لكن الماء تحرك ببطء عند الحافة، وترك خيطًا باردًا تحت بوابة الخشب القديمة.\u003c/p>\u003cp>حمل لين سلة أدوات صغيرة، وأخذت شين يان دفتر العقد. لم يمشِ تشانغ معهم؛ سبقهم إلى المجرى ومعه مطرقته، وقال إنه لن يضرب شيئًا قبل أن يرى الشركاء ما يحتاج إلى إصلاح.\u003c/p>\u003cp>وقفت هو سانيانغ على طرف الأرض المستأجرة، حيث يلتقي الطريق الصغير بالمسار القديم إلى الطاحونة. قالت: «لا توسعوا المجرى. نصلح الباب الموجود فقط.»\u003c/p>\u003cp>قال لين: «نعرف البند. لا قناة ولا جدار جديد.»\u003c/p>\u003cp>«أريد أن أسمع ذلك منكم قبل أن ترفعوا لوحًا.»\u003c/p>\u003cp>قالت شين يان: «نثبت اللوح في موضعه القديم، ولا نحفر في الضفة.»\u003c/p>\u003cp>أومأت العمة. لم تكن تعترض على الإصلاح؛ كانت تمنع الكلمة من أن تتمدد حتى تصير مشروعًا آخر. كانت المياه لا تزال باردة، وأي عمل زائد قد يجرف التراب من الجهة الشرقية إلى أرض ليو. كما أن العقد لا يمنحهما حق تغيير شكل المجرى.\u003c/p>\u003cp>جلس تشانغ على ركبتيه، وفحص الحافة. لم يستعمل المطرقة فورًا. مرر طرف عتلة تحت زاوية اللوح، ثم سحبها. خرجت من الفاصل قطعة قش متحجرة وطبقة طين يابس. قال إن الخشب لم ينكسر، لكنه مال قليلًا حين تجمد الماء وراءه. إذا تركوه كما هو، سيرشح من الحافة عند ذوبان الجليد. أما إذا أعادوا اللوح في مجراه الأصلي، فسيخف التسرب من دون أن يغيروا عرض الماء.\u003c/p>\u003cp>قال لين: «هل يحتاج إلى بديل؟»\u003c/p>\u003cp>«لا. يحتاج إلى تنظيف وإسناد من الخشب القديم.»\u003c/p>\u003cp>قالت شين يان: «كم يستغرق؟»\u003c/p>\u003cp>«نصف نهار إن لم يتشقق اللوح.»\u003c/p>\u003cp>سألت هو سانيانغ: «هل تعرف إن كان على الأرض إذن جديد؟»\u003c/p>\u003cp>قال تشانغ: «لا أحفر. لا أرفع حجرًا من الضفة. أستعمل الوتد الذي كان هنا.»\u003c/p>\u003cp>«إذن اكتبوا ما ستفعلون قبل أن تفعلوه.»\u003c/p>\u003cp>لم يكن السجل بعيدًا. فتحته شين يان على صفحة الصيانة، وكتبت: «تنظيف بوابة المجرى القائمة وإعادة تثبيت لوحها في موضعه السابق.» وأضافت: «لا تغيير في عرض المجرى أو عمقه.» قرأ تشانغ العبارة، وأشار إلى «عمقه». قال إنهم لن يلمسوا قاع المجرى أصلًا. أبقت العبارة؛ فهي تثبت حدود العمل، لا تصف ما سيحفرونه.\u003c/p>\u003cp>وقعت هو سانيانغ شاهدًا. ثم كتب تشانغ اسمه ببطء، ووضع لين بصمته تحت الإذن. لم يكن عقد الطاحونة يوجب أن يطلبا إذنًا جديدًا لكل إصلاح، لكنهما أرادا أن يبقى أثره واضحًا. تذكرت شين يان بند السنوات الثلاث؛ ما يصلحانه يبقى لهما، ولا يسترد قبل المدة إلا بدفع ثمنه. لم يضيفوا إلى ذلك بندًا جديدًا، ولم يطلبوا من وو أن ينقل الماء إلى أرض أخرى.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بدأ العمل حين غابت الشمس وراء السحاب. أزال لين الطين المتراكم من حول المفصل بملعقة خشبية. لم يدخل أداة حديدية في الشق، كيلا يوسعه. كان البرد يلسع أطراف أصابعه، فلف شين يان قطعة قماش حول المقبض قبل أن تسلمه إليه.\u003c/p>\u003cp>أخذ تشانغ الوتد القديم من موضعه. كان رأسه مهترئًا، لكنه بقي قطعة واحدة. قاس عرضه بمسطرة خشب، ثم نظر إلى الثقب المحفور منذ زمن في قائم البوابة. قال إن الوتد القديم يكفي إن أداروه على الجانب الأقل تآكلًا. لم يكن يحتاج إلى قطعة جديدة من حديد، ولا إلى أن يفتح لين مخزونه الصغير.\u003c/p>\u003cp>قال لين: «هل يدفعنا الماء إذا تحركت القطعة؟»\u003c/p>\u003cp>«لن نرفع الباب عن المجرى. سأدعم أسفله حتى يقف مستقيمًا.»\u003c/p>\u003cp>«من فوق؟»\u003c/p>\u003cp>«من جهة اليابسة، لا من الماء.»\u003c/p>\u003cp>قالت شين يان: «أستطيع أن أقيس ميله من هذه الحافة.»\u003c/p>\u003cp>لم تمنعها حالتها من المشاركة، لكنها لم تنحنِ فوق الماء. ثبتت خطًا قصيرًا على سطح اللوح، وقارنت ارتفاع طرفيه بعود مستقيم. ثم قارنت الميل بعلامتين قديمتين على الخشب. لم تعتمد على تقدير الذاكرة وحده؛ أعادت القياس بعد أن نظف لين ما حوله.\u003c/p>\u003cp>قالت: «الجهة الشمالية أعلى إصبعين.»\u003c/p>\u003cp>قال تشانغ: «هكذا كان قبل أن يميل.»\u003c/p>\u003cp>«كيف تعرف؟»\u003c/p>\u003cp>«علامة الطين على الجنب. الماء كان يصل إليها.»\u003c/p>\u003cp>أشار إلى خط داكن عند طرف القائمة، أعلى من مستوى الماء المتجمد. لم يكن أثرًا جديدًا، لكنه وافق ما وجدته في المقارنة. رفعوا اللوح بمقدار يسير، وأعاد تشانغ الوتد في مكانه. لم يضربه بقوة؛ طرقه ثلاث مرات، ثم ضغط عليه بكفه.\u003c/p>\u003cp>تحرك الماء في الشق، فابتعد لين خطوة. لم يتدفق بقوة. قطرتان انزلقتا تحت اللوح، ثم هدأ الخرير.\u003c/p>\u003cp>قالت هو سانيانغ: «أوقفوه.»\u003c/p>\u003cp>توقف تشانغ. لم يبتسم، ولم يقل إن العمل انتهى. فحص الإسناد، ثم طلب منهم الانتظار حتى ينخفض الماء خلف البوابة. لم تكن لديهم وسيلة لتسريع ذوبان الجليد، ولم يزعموا أنهم أصلحوا النهر. ما استطاعوا فعله هو تثبيت الخشب القديم ومنع التسرب من أن يوسعه.\u003c/p>\u003cp>انتظروا نصف ساعة. تغيرت طبقة الماء عند الحافة، لكنها لم تدفع اللوح. قالت شين يان إن الميل بقي كما كان، فأعاد لين قطعة الطين التي أزالها إلى موضعها حول طرف الدعامة، لا في مجرى الماء. لم يبنِ حاجزًا ولا رفع الضفة. حين انتهى، جرف الثلج عن الطريق حتى لا يتجمع عند المدخل.\u003c/p>\u003cp>قالت هو سانيانغ: «اكتبوا أنكم انتهيتم، ولا تكتبوا أن المجرى صار آمنًا.»\u003c/p>\u003cp>قال لين: «سأكتب أن اللوح ثبت في مكانه، وأنه يحتاج إلى مراقبة عند الذوبان.»\u003c/p>\u003cp>«هذا صحيح.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قبل الظهر عادوا إلى الطاحونة. لم يكن هناك طابور طويل، لكن وانغ تشن وصل ومعه كيس جففه ليلة كاملة. وضعه قرب الميزان، ونظر إلى اللوح المعلق عند المدخل.\u003c/p>\u003cp>قال: «بيت الحجر الأزرق؟»\u003c/p>\u003cp>قالت شين يان: «هذا اسم العمل المسجل. ميزانك هنا.»\u003c/p>\u003cp>أخذت حفنة من الدخن، وفحصت جفافه. لم تكن الحبوب تترك أثرًا رطبًا على كفها. وزنت الكيس، ثم أعادت الوزن للمرة الثانية. وافق الرقمان. اتفق وانغ على الأجر قبل الطحن، وسجلته شين يان في خانة اليوم. لم يقل إنه أول زبون؛ لم يقل أحد ذلك. لكنه عاد بعد أن سأل، وهذه المرة وضع كيسه على الحجر.\u003c/p>\u003cp>كان في الداخل رجل آخر ينتظر دوره، يحمل رقعة من الطين. ذكرت هو سانيانغ أن يومه المجاني مسجل، فأشارت إلى الرقم في الدفتر. لم تطلب منه دفع نحاس. كتب لين وزن كيس وانغ وتاريخ الاتفاق، وكتب أجره بعد الطحن. بقيت حصص الشركاء كما هي: ثلاثة أعشار لهو سانيانغ، وعشر لتشانغ، وستة أعشار للزوجين من أجر الطحن. أما أجر الحمار فظل مصروفًا من أجر الطاحونة قبل القسمة، ولم يعمل زاو ذلك اليوم.\u003c/p>\u003cp>حين انتهى طحن وانغ، نظر إلى الدقيق في الكيس. قال إن به خشونة أكثر مما توقع. ردت شين يان بأن الحجر لا يعطي نعومة واحدة لكل حبوب، وأنه يستطيع غربلته في البيت. لم ترد عليه بوعد تحسين فوري. طلب معرفة إن كان يريد دفع أجره بالنحاس أو بجزء من الدقيق؛ اختار النحاس. تسلم إيصالًا صغيرًا باسم الطاحونة لا باسم بيت ليو.\u003c/p>\u003cp>كانت هذه أول مرة يخرج فيها كيس مدفوع الأجر بعد أن ثبت الاسم في السجل. لم يكن دخلًا كبيرًا، ولم يغير الدين. لكنه دخل له وزن وشروط ومَن استلمه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد الطحن، أغلقت شين يان دفتر الأجر، وفتحت صفحة سجل التسجيل. نقلت إليها موعد الجباية التالية، ولم تضف المبلغ إلى دين الطاحونة. قرأت ملاحظاتها مع لين: عقد الإيجار، الحصص، بيان المنشأ، تسجيل بيت الحرفيين، وإيصال النحاستين. لم تكتب إشاعة الرامي في السجل نفسه. كانت ورقة منفصلة ضمن ما سمعوه، ولم تكن اتفاقًا ولا حقيقة مثبتة.\u003c/p>\u003cp>قالت: «كل اتفاق له طرفان وتاريخ. وكل خبر يسمعه المرء له صاحبه وحدوده.»\u003c/p>\u003cp>قال لين: «وماذا عن وعد لاو ما بالفحم؟»\u003c/p>\u003cp>«لا موعد ولا سعر حتى الآن. نكتب أنه وعد أن يعود في الربيع، لا أن الطريق جاهز.»\u003c/p>\u003cp>فتحت صفحة جديدة، وتركت أعلاها فارغًا. سألها لين إن كانت تريد أن تكتب كل ما يعرفانه من الآن فصاعدًا. قالت إنها تريد كتابة الأسماء والتواريخ والشروط فقط، لا توقعات الناس ولا ما لم يحدث. ثم أعطته القلم.\u003c/p>\u003cp>في تلك اللحظة ظهر أمام لين سطر خافت، لا يحجب باب الطاحونة ولا وجه شين يان. لم يأتِ قبل ذلك في اليوم، ولم يفسر له ما رآه من الطريق أو ما ينوي فعله الرجل الذي سمع عنه. مرّت الكلمات بالترتيب، وتحتها نسبة ثقة واضحة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[إنجاز موثق — مستوى 1]\u003c/strong>\u003c/div>\u003cdiv>حفظ الاتفاقات والمراسلات المعروفة.\u003c/div>\u003cdiv>القيد: لا يستنتج النوايا ولا يضمن الوفاء.\u003c/div>\u003cdiv>الثقة: 88%\u003c/div>\u003cdiv>طاقة التكامل: 82%\u003c/div>\u003c/div>\u003cp>بقي لين ساكنًا لحظة، ثم قال: «ظهر شيء جديد.»\u003c/p>\u003cp>رفعت شين يان رأسها. «ما هو؟»\u003c/p>\u003cp>قرأ لها الكلمات كما ظهرت. لم يخفِ سطرًا واحدًا. سمعت وصف الوظيفة، ثم وضعت القلم على الصفحة الفارغة.\u003c/p>\u003cp>قالت: «هل يكتب ما نفكر به؟»\u003c/p>\u003cp>«لا. يقول ما نعرفه أو اتفقنا عليه.»\u003c/p>\u003cp>«وهل يعرف إذا كذب أحد؟»\u003c/p>\u003cp>«لا. يثبت الكلام، ولا يضمن الوفاء.»\u003c/p>\u003cp>قالت هو سانيانغ: «هذا الفرق كله.»\u003c/p>\u003cp>أومأ لين. لم يكن في السطر وعد بكشف الغش أو حل خصومة قادمة. إذا أخل أحد بعقد، فلن يمنع ذلك. لكنه قد يمنعهما من نسيان ما أُبرم، وما بقي قولًا لم يثبت.\u003c/p>\u003cp>سألت شين يان: «هل صرفت طاقة؟»\u003c/p>\u003cp>قال: «لا يظهر لي شيء عن مصرف جديد. هناك نسبة ثقة وطاقة التكامل فقط.»\u003c/p>\u003cp>«لا تكتب في الدفتر أن النظام شهد على اتفاقاتنا. هو لم يحضرها.»\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>كتبت في أعلى الصفحة: «سجل الاتصالات والاتفاقات»، ثم أضافت: «يُكتب ما عُرف، وما اتُّفق عليه، واسم من حضر. لا يثبت النوايا.» لم تضع اسم النظام على السجل. كان دفترهما أكبر من نافذة واحدة، حتى لو كان النظام قد أضاف وظيفة جديدة.\u003c/p>\u003cp>فتحت شين يان صفحة الاتفاقات القديمة، وراجعت عقد الطاحونة الذي وقعه الثلاثة، ثم بند الحصص الذي أضيف تحت الختم. كتبت أمام الأول: «الإيجار اثنا عشر كيسًا عند الحصاد؛ حماية الإصلاحات ثلاث سنوات.» وأمام الثاني: «ثلاثة أعشار لهو سانيانغ ما دامت الكفالة قائمة؛ واحد لتشانغ؛ ستة للزوجين.» لم تضف عبارة أن العمة ستبقى كفيلة إلى الأبد، لأن ذلك لم يُتفق عليه. ولم تكتب أن بيت ليو سيقبل التعديل، لأن أحدًا لم يقل ذلك.\u003c/p>\u003cp>قال لين: «هل يسجل النظام هذه البنود الآن؟»\u003c/p>\u003cp>«لا أعرف. أنت رأيت الوظيفة، وأنا رأيت عبارتها فقط.»\u003c/p>\u003cp>أوضح لها أن الشاشة لا تذكر أسماء الحاضرين إلا إذا أدخلها بنفسه، ولا تستنتج أن الاتفاق ما زال نافذًا بعد تغير الحال. يمكنه أن يضع تاريخًا، ونصًا، وحالة يحددها هو بعد مراجعة الدفتر. قالت شين يان: «إذن إن سجلته، اكتبه كما في الورقة. لا تكتب تفسيرك.»\u003c/p>\u003cp>أدخل لين البنود واحدًا واحدًا، ثم قرأها لها. صححت له رقم الحصة، وأعاد كتابته. لم تظهر علامة بأن النظام صدق عقدهم، ولم يضمن أن يدفع أحد. ظهر فقط أنه حفظ نصًا أدخله لين، مع تاريخ وتفصيل يستطيعان مراجعته. أغلقت شين يان الصفحة، ثم قارنت ما بقي في الدفتر بما دخل في السجل. تركا خانة الوفاء فارغة؛ لا يعرفان بعد ما سيحدث عند الحصاد.\u003c/p>\u003cp>في آخر النهار، جمع لين النسخ المختومة، ووضع الإيصال بجانب دفتر الدين لا داخله. بقي الرقم 124 كما هو. لم يسددوا دينًا كاملًا، ولم يصبح لهم حق في الأرض. لكن حين سألهم الكاتب عن منشئهم، لم يضطروا إلى اختراع قرية أخرى. وحين سألهم فلاح عن الطحن، استطاعوا أن يزنوا الكيس ويقولوا الأجر قبل أن يفتحوه.\u003c/p>\u003cp>كان تشانغ عند باب الطاحونة يطرق طرف مطرقة حديدية صغيرة، ثم يضعها على خشبة ليتأكد من توازنها. لم يحملها إلى بيت ليو ولم يضع ثمنًا عليها. قال: «مطرقة صغيرة. ليست سكة.»\u003c/p>\u003cp>قال لين: «لمن تصنعها؟»\u003c/p>\u003cp>«سأعرف حين يسألني أحد.» ضربها ثانية. «السكة أولى.»\u003c/p>\u003cp>سألته شين يان عن الرجل الذي قال إن طريق الجسر مظلم. قال إن الأولاد يرددون كلامًا كثيرًا، لكنه سيأخذ المطرقة إلى السوق حين يخرج. لم يذكر اسمًا، ولم يربط الأمر بالرامي. بقيت الطرق كما هي: يمر عليها من يملك حطبًا أو دقيقًا، ويعود بعضهم قبل الليل ولا يعود آخرون.\u003c/p>\u003cp>في تلك الليلة، دفعت شين يان يدها إلى أسفل بطنها حين خف التعب عن كتفيها. كان الحمل ظاهرًا تحت ثوبها، والشهر السابع يقترب. لم تجعل ذلك وعدًا بأن الشتاء لن يؤذيها، ولم ينظر لين إلى السطر الجديد بوصفه جوابًا عن طفلهما. وضع الدفتر مغلقًا عند طرف الطاولة، وجلس قربها.\u003c/p>\u003cp>في الخارج، استقرت طبقة الجليد فوق النهر. بقيت بوابة المجرى القديمة في موضعها، واللوح المثبت ينتظر اختبار ذوبان أكبر. لم يفتح الماء بعد، لكن في سجل القرية صار لعملهما اسم، وفي دفترهما صار للاتفاقات موضع لا يحل محل ثقة الناس ولا يضمنها.\u003c/p>"},{"n":41,"t":"الفصل الحادي والأربعون: الحديد الذي نملكه","b":"\u003cp>في اليوم الرابع والثلاثين بعد المئة، حمل لين وتشانغ الحديد القديم إلى ساحة الورشة، بعدما فتحا المخزن الذي أُغلق منذ انتهاء العمل على الطاحونة. كان إيصال نحاستي الجباية الثانية محفوظاً في غلاف الدفتر؛ دفعاه في اليوم132، بعد تسعة أيام من الدفعة الأولى، وكتب وو على الإيصال أن الموعد التالي هو اليوم141.\u003c/p>\u003cp>لم يأتيا بكل شيء دفعة واحدة. كان تشانغ يرفع القطع بيديه، يزنها في الهواء، ثم يضعها في واحد من ثلاثة أكوام: قضبان يمكن أن تعود إلى النار، وقطع تحتاج إلى كسر وفحص، وأجزاء لا تستحق الوقود. أما لين فجلس عند طرف الساحة، وفتح دفتر المخزون إلى صفحة بيضاء، ورسم ثلاث خانات عريضة.\u003c/p>\u003cp>قال تشانغ: «لا تكتب أسماء جميلة. اكتب ما أراه.»\u003c/p>\u003cp>«أسميها قطعة أولى، قطعة ثانية، وقطعة لا تستحق النار؟»\u003c/p>\u003cp>«سمّها كما تشاء. المهم أن تعرفها حين أطلبها.»\u003c/p>\u003cp>وضع أمامه قضيباً قصيراً، أسود من الخارج، وقد التوى طرفه. ضربه تشانغ بمطرقة خفيفة. لم يخرج من الضربة صوت واحد؛ رن طرفه، بينما أصدر وسطه صوتاً مكتوماً.\u003c/p>\u003cp>قال لين: «اختلاف الصوت؟»\u003c/p>\u003cp>«لا تحكم من صوت واحد.» قلب تشانغ القضيب. «هنا حافة اللحام. أذابت النار طرفين ثم ضغطهما عامل لم يصبر. إن كانت الوصلة ضيقة، حملت الضربة. وإن بقي بينهما خبث، انفصلت حين يتغير اتجاه الطرق.»\u003c/p>\u003cp>لم يقل لين إن النظام يستطيع رؤية ما تحت السطح. لم يكن يستطيع. أخرج الهاتف من التخزين، وقاس القضيب على طاولة العمل، ثم شغّل تحليل المواد المحدود. ظهرت أمامه خطوط قصيرة، ولم تتكون صورة كاملة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>العينة: قضيب حديد قديم.\u003c/div>\u003cdiv>ملاحظات: تفاوت في الكثافة، وشوائب صخرية، واحتمال وجود خط التحام ضعيف.\u003c/div>\u003cdiv>الثقة: 62%\u003c/div>\u003cdiv>طاقة التكامل: 71%\u003c/div>\u003c/div>\u003cp>انطفأت الشاشة. لم يشعر لين إلا بحرارة الهاتف في كفه، ثم أعاده إلى التخزين.\u003c/p>\u003cp>قال تشانغ: «ماذا رأيت؟»\u003c/p>\u003cp>«أنك كنت محقاً. فيه شوائب وخط ضعيف. لكن التحليل لا يقول لي أين تنتهي الوصلة.»\u003c/p>\u003cp>«إذن لا تدعه يطرق نيابة عنك.»\u003c/p>\u003cp>ابتسم لين. «لن يفعل. عندي عينة واحدة، وأنت عندك ثلاثون سنة من العمل.»\u003c/p>\u003cp>لم يبتسم تشانغ، لكنه لم يطلب منه أن يصمت. أخذ القضيب إلى السندان، وضربه مرة أخرى، هذه المرة عند الطرف الرفيع. ثم ثبت عليه إزميلاً وشق جزءاً صغيراً منه. في الداخل خط رمادي ضيق، وحوله حبيبات سوداء. مسحها بإبهامه، ثم أشار إلى طرف القضيب.\u003c/p>\u003cp>«هذا لا ينفع لسكة. قد ينفع لصفيحة صغيرة، إذا لم نضغط عليه من الجانب.»\u003c/p>\u003cp>دوّن لين: «قطعة واحدة، صالحة لعمل غير حامل. لا تسخين متكرر.»\u003c/p>\u003cp>«لم أقل لا تسخين متكرر.»\u003c/p>\u003cp>«قلت إن الخط ضعيف. إذا أعدناها إلى النار مرات كثيرة، قد يتسع.»\u003c/p>\u003cp>«قد.»\u003c/p>\u003cp>«والوقود ليس مجانياً.»\u003c/p>\u003cp>«هذا كلام هو سانيانغ.»\u003c/p>\u003cp>«تعلمت منها.»\u003c/p>\u003cp>كان تشانغ يفحص القضبان، بينما كانت شين يان تقيس الفحم المتبقي وتراجع سجل المنفاخ. لم تسمح لأحد أن يضع القطع قرب الموقد قبل أن تنهي حسابها. فتحت الدفتر على الساحة، وثبتت إحدى زواياه بحجر كي لا تقلب الريح صفحاته.\u003c/p>\u003cp>قالت: «إذا أشعلنا النار اليوم، سنستهلك كيساً كاملاً قبل أن نعرف كم قطعة يمكن إنقاذها.»\u003c/p>\u003cp>قال لين: «لا نحتاج إلى إشعال اليوم. نحتاج إلى فرز المخزون.»\u003c/p>\u003cp>«وتحتاجون إلى ماء؟»\u003c/p>\u003cp>«ليس الآن.»\u003c/p>\u003cp>«إذن لن أسمح بتشغيل الدولاب لأجل شيء لا نعرف إن كان سيصلح.»\u003c/p>\u003cp>رفع تشانغ رأسه إليها. «لم أطلب تشغيله.»\u003c/p>\u003cp>«أعرف. أنا أسجل ما لا ينبغي أن نفعله.»\u003c/p>\u003cp>لم يرد تشانغ. أعاد قضيباً ملتوي الطرف إلى كومة القطع الصغيرة. كان في الساحة بقايا الحديد التي جمعوها من أعمال الطاحونة، ومحور قديم، وطوقان من حديد، وثلاث قطع لقضبان قال تشانغ إنها رديئة منذ البداية. لم تكن الكمية كبيرة بما يكفي لفتح ورشة مستقلة، لكنها كانت كل ما يملكونه من معدن قبل شراء المزيد.\u003c/p>\u003cp>تحركت شين يان بين الأكوام، ورفعت طرف المنفاخ المركون إلى جانب الجدار. كان الجلد ملفوفاً عليه، وقد جف عند الحواف. فحصت الوصلات الخشبية، ثم فتحت دفترها.\u003c/p>\u003cp>«تشانغ، عندما كنت تشغل المنفاخ بيدك، كم دقيقة تستطيع المحافظة على حركة متساوية؟»\u003c/p>\u003cp>«أنا؟»\u003c/p>\u003cp>«أنت أو أي عامل.»\u003c/p>\u003cp>«ما دام الحديد بارداً، زمناً طويلاً. حين تحمر القطعة، يحتاج الأمر إلى عين لا إلى عضلة فقط.»\u003c/p>\u003cp>«أقصد الحركة. دفع الهواء وإعادته.»\u003c/p>\u003cp>هز كتفيه. «إذا كان المقبض جيداً، ربما نصف ساعة. بعدها تتعب اليد، وتختلف الضربات.»\u003c/p>\u003cp>كتبت شين يان الرقم، ثم سألت: «وكم من الوقت تحتاج القطعة الواحدة بين النفخ والطرق؟»\u003c/p>\u003cp>«هذا يتغير. قطعة رقيقة لا تحتاج مثل المحور. لا تحولي عملي إلى جدول.»\u003c/p>\u003cp>«لن أحوله إلى جدول. أريد أن أعرف متى يتوقف الطحن إذا شغلنا الماء للمنفاخ.»\u003c/p>\u003cp>«هذا شأن لين.»\u003c/p>\u003cp>«الطاحونة لنا جميعاً حين نتوقف عن الطحن.»\u003c/p>\u003cp>رفع لين عينيه من الدفتر. «لن نربط المنفاخ بالدولاب قبل أن نعرف ما سنخسره. علينا حساب ساعات الطحن، وحركة الماء، وعدد العمال. إذا أخذنا الدوران ساعة، فكم كيساً نفقد؟»\u003c/p>\u003cp>قالت شين يان: «أريد أيضاً أن أعرف ما الذي نكسبه. حين يضعف الهواء، تزيدون الفحم ولا تتحسن النار. أنتم تحسبون الوقود، ولا تحسبون الهواء.»\u003c/p>\u003cp>رفع تشانغ القضيب وأراهما خط الشق. «إذا أعطيتني هواءً ثابتاً، لن أصلح كل حديد السوق. لكنني أعرف أسرع إن كان العيب في القطعة أم في النار.»\u003c/p>\u003cp>«إذن نحتاج إلى تجربة صغيرة،» قال لين. «لكن بعد فحص القطع. لا نستهلك قطعة جيدة كي نثبت أن الهواء يتحرك.»\u003c/p>\u003cp>قضوا الصباح في الفرز. كل قطعة اختبرها تشانغ بالطرق الخفيف، ثم أحدث فيها شقاً صغيراً عند موضع لا يفسدها إن كانت قابلة لإعادة العمل. علّمها لين بعقدة خيط مختلفة، وكتب وصفاً لا يعتمد على اللون وحده. قطعة ذات خط التحام، قطعة فيها حبيبات صخر، قطعة قصيرة سليمة، وقطعة انكسرت عند الحافة قبل أن يمسها الإزميل.\u003c/p>\u003cp>قال تشانغ حين رأى لين يكتب «صالحة بعد التسخين»: «أنت تكتب الحكم قبل أن نجرب.»\u003c/p>\u003cp>«أكتب احتمالاً.»\u003c/p>\u003cp>«اكتب: لا نعرف.»\u003c/p>\u003cp>شطب لين العبارة، وكتب مكانها: «تحتاج إلى اختبار. خسارتها محتملة.»\u003c/p>\u003cp>كان صوت الريح يمر من بين ألواح الساحة. في البعيد، انخفضت المياه عند حافة المجرى القديم؛ لم يعد الشتاء يمسك النهر كما كان قبل أسابيع، لكن الجليد بقي في ظلال الضفة. لم يقتربوا من الدولاب. قال شو إن الدفء لن يثبت، وإن دفعة برد واحدة تكفي لإعادة الجليد إلى الحواف. وكان يانغ قد وضع علامة على اللوح المتشقق الذي ينبغي تبديله قبل تشغيل الماء.\u003c/p>\u003cp>وصلت هو سانيانغ بعد قليل، تحمل سلة صغيرة فيها خبز يابس وكوبين من المرق. توقفت عند باب الساحة، ونظرت إلى الأكوام قبل أن تضع السلة على الطاولة.\u003c/p>\u003cp>قالت: «كم صار الحديد؟»\u003c/p>\u003cp>أجاب لين: «ثلاثة أكوام. الصالح للاختبار قليل، والخردة أكثر.»\u003c/p>\u003cp>«والفحم؟»\u003c/p>\u003cp>«يكفي تجربة صغيرة واحدة.»\u003c/p>\u003cp>«هذه ليست كمية.» قلبت السلة لتضع الخبز جانباً. «كم نشتري إذا فشلت التجربة؟»\u003c/p>\u003cp>قالت شين يان: «لا نشتري الآن. نبدأ بما عندنا. إذا احتجنا فحماً أكثر، نعرف مقدار ما استهلكناه أولاً.»\u003c/p>\u003cp>جلست هو سانيانغ على صندوق، وأخرجت من جيبها قطعة فحم صغيرة علقت بكمها. «في السوق، لا يبيعون الفحم بالوعد. إذا ذهبتم إلى تشيان وطلبتم مقداراً، سيعرف أنكم تستعدون لشيء. وإذا أخذه منكم، لا أريد أن تضعوا ثمنه في حساب الطحن.»\u003c/p>\u003cp>قال لين: «لن نخلط الحسابين. سأفصل الحديد والفحم وأجر العمل.»\u003c/p>\u003cp>«تقول هذا الآن. حين يتأخر طحن الناس، من يدفع؟»\u003c/p>\u003cp>قالت شين يان: «نحسب ساعة الماء قبل أن نأخذها. لا نوقف الحجر من دون أن نتفق على ثمن الوقت.»\u003c/p>\u003cp>رفعت هو سانيانغ حاجبها. «جيد. لا أريد من أحد أن يقول لي بعد ذلك إن النار أكلت ما كان للطاحونة.»\u003c/p>\u003cp>أخذ تشانغ قطعة الخبز، وكسرها نصفين. «أنا لا أريد شراء حديد جديد قبل أن أعرف أي القديم يمكن نفعه.»\u003c/p>\u003cp>قالت هو سانيانغ: «وأنا لا أريدكم أن تحرقوا كيسين لتعرفوا أن القضيب مكسور.»\u003c/p>\u003cp>أجاب تشانغ: «لن أحرق إلا ما أستطيع حمل خسارته.»\u003c/p>\u003cp>لم ترد هو سانيانغ عليه، لكنها أخرجت الدفتر الصغير الذي تحتفظ فيه بما يُصرف للنزل، وسألت عن علامة الفحم في حسابهم. أعطاها لين رقماً مؤقتاً، فكتبته في هامشها. لم يكن هذا اعتماداً للميزانية؛ كان تنبيهاً إلى أن أي تجربة ثانية ستحتاج إذناً جديداً منها. حين غادرت، أخذت معها الكوبين الفارغين، وتركت الخبز. لم تشكرهم، ولم يطلبوا منها ذلك.\u003c/p>\u003cp>بعدها بوقت قصير، مر عامل من القرية يحمل شفرة منجل قديمة، وسأل تشانغ إن كان يستطيع إصلاحها. تفحصها الحداد تحت الضوء، ثم أعادها إليه.\u003c/p>\u003cp>«ليست اليوم.»\u003c/p>\u003cp>قال العامل: «هي ملتوية فقط. أحتاجها قبل الربيع.»\u003c/p>\u003cp>«الالتواء ليس كل ما فيها. هذا الحديد تشقق قرب الحافة.»\u003c/p>\u003cp>«يمكنك أن تطرقها.»\u003c/p>\u003cp>«أستطيع. وقد تنكسر وهي في يدك.»\u003c/p>\u003cp>بقي العامل ينظر إلى الشفرة، ثم أخفاها في كيسه. «إذا صار عندكم حديد جيد، اطرقوا لي واحدة.»\u003c/p>\u003cp>«إذا صار عندنا حديد جيد، سنقول لك ما يمكن صنعه.»\u003c/p>\u003cp>ظل لين يراقبه وهو يغادر. كان هذا سبباً آخر كي لا يعلنوا أن الحديد القديم جاهز للاستعمال. الناس لا يشترون التحليل؛ يشترون أداة لا تنكسر في الأرض. كتب اسم العامل ومطلبه، ثم شطب كلمة «طلب» واستبدلها بـ«سؤال عن إصلاح». لم يتعهد تشانغ بشيء، ولم ينشأ دين جديد بينهما.\u003c/p>\u003cp>اقتربت شين يان من المنفاخ، ودفعت المقبض بيدها. تحرك الجلد، وأطلق الهواء صفيراً خافتاً. أعادته ببطء، ثم دفعت مرة أخرى. حاولت أن تحافظ على السرعة نفسها، لكنها أسرعت في منتصف الحركة وتباطأت عند الرجوع.\u003c/p>\u003cp>قالت: «هكذا يخسر الهواء ثباته.»\u003c/p>\u003cp>قال تشانغ: «هكذا تتعب اليد.»\u003c/p>\u003cp>«وهذا سبب واحد. لو جعلنا الماء يدفع المقبض ويرده، بقيت الحركة أقرب إلى انتظامها.»\u003c/p>\u003cp>«وإذا توقف الماء؟»\u003c/p>\u003cp>«يتوقف المنفاخ. لا أريد وصلة تجبره على الحركة حين يعلق.»\u003c/p>\u003cp>«هذا جيد.»\u003c/p>\u003cp>رمقها لين. «أنت تقول جيداً الآن؟»\u003c/p>\u003cp>«قلت إن الفكرة جيدة. لم أقل إنها تعمل.»\u003c/p>\u003cp>دوّن لين في الهامش: «المطلوب ليس ناراً أعنف فقط؛ المطلوب هواء ثابت، مع وصلة يمكن إيقافها.» ثم رسم الدولاب القديم، والمنفاخ، والمسافة بينهما. لم يرسم آلة جديدة. كانت الفكرة أن يحمل الذراع جزءاً من حركة الطاحونة إلى مقبض المنفاخ، ثم يعيده. أخطأ في تقدير طول الذراع، فبدت رسمة شين يان أعرض من المساحة المتاحة. صحح القياس، ثم كتب بجانبه: «لا نثبت قبل تجربة باليد».\u003c/p>\u003cp>«إذا شغلنا الدولاب للمنفاخ، سنوقف الحجر،» قال لين. «كم كيساً نخسر في الساعة؟»\u003c/p>\u003cp>قالت شين يان: «ليس عندي رقم موثوق. نحتاج إلى قياس ساعة طحن في يوم ماء مستقر، ثم نقارنها بساعة تشغيل المنفاخ. لكن إن انتظرنا حتى يذوب كل الجليد، قد نخسر أياماً.»\u003c/p>\u003cp>قال تشانغ: «وأنا لا أريد ناراً أخرى تدخن في وجهي.»\u003c/p>\u003cp>لم تكن عندهم إجابة جاهزة. كتب لين في الدفتر أن تجربة المنفاخ قد تسحب وقتاً من الطحن، وأنهم لن يبدؤوا بها حتى يختاروا قطعة اختبار لا تهمهم خسارتها. كتبت شين يان تحت السطر: «مقارنة زمن الطحن قبل تشغيل الماء وبعده. لا تشغيل طويل.»\u003c/p>\u003cp>جاء شياو دو من النزل يحمل إبريق ماء وقطعتين من الخبز اليابس. وقف عند الأكوام، وحدق في القضيب الملتوي.\u003c/p>\u003cp>«هل ستصنعون سكاكين؟»\u003c/p>\u003cp>قال تشانغ: «سنصنع ما يسمح به الحديد.»\u003c/p>\u003cp>«وهل يسمح بسكين؟»\u003c/p>\u003cp>«جرّب أن تطرق هذا القضيب بيدك أولاً.»\u003c/p>\u003cp>ضحك شياو دو، ثم تراجع خطوة. «سأكتفي بالماء.» وضع الإبريق قرب شين يان، ونظر إلى خط الشق في القطعة. «لماذا هذا الخط أسود؟»\u003c/p>\u003cp>أجابه تشانغ: «لأن ما بين الحديدين لم يخرج حين جمعوهما. إذا ضربته من الجانب، قد ينفتح.»\u003c/p>\u003cp>«إذن لا أضعه في النار؟»\u003c/p>\u003cp>«لا تضع شيئاً في النار قبل أن أسألك.»\u003c/p>\u003cp>ضحك شياو دو، لكنه أخذ التحذير بجدية. عاد إلى النزل، وترك وراءه رائحة الخبز والرماد.\u003c/p>\u003cp>مع الظهيرة، انتهى الفرز الأول. لم يعلن تشانغ أن شيئاً صار صالحاً، لكنه فصل القطع التي يمكن اختبارها عن الخردة التي ستبقى خارج الفرن. وأحصت شين يان الفحم: يكفي لاختبار واحد صغير إذا لم يكرروا التسخين. أما الحديد الذي يمكن أن يتحول إلى أدوات، فلا يعرفان مقداره بعد.\u003c/p>\u003cp>أغلق لين الدفتر، لكنه لم يعِد الهاتف إلى التخزين قبل أن يتأكد من إطفائه. كتب بجانب النتيجة: «التحليل يؤيد الفحص، ولا يغني عنه. القرار لتشانغ والقطعة.»\u003c/p>\u003cp>نظر تشانغ إلى الرسم الذي يربط الدولاب بالمنفاخ. «من سيصنع الذراع؟»\u003c/p>\u003cp>قال يانغ من خلفهم: «إذا عرفتم أين تريدونه، أصنع الخشب. أما الحديد، فيصنعه تشانغ.»\u003c/p>\u003cp>«لم نقل إننا سنصنعه بعد.» قالت شين يان. «نحتاج أولاً إلى قياس الحركة.»\u003c/p>\u003cp>قال لين: «يمكننا أن نجربها على الأرض بحبل، من دون نار ولا ماء.»\u003c/p>\u003cp>هز تشانغ رأسه. «غداً. اليوم لا أريد أن أرى الحديد مرة أخرى.»\u003c/p>\u003cp>لم يجادله أحد. وضعوا القضبان في المخزن، وأغلقوا الباب بقفل يانغ. بقي الرسم مفتوحاً على الطاولة، وفي طرفه سهم يصل بين الدولاب القديم ومقبض المنفاخ. إلى جواره سطر شين يان: «كل ساعة للماء ثمنها أكياس من الدخن.»\u003c/p>\u003cp>قرأه لين مرة أخرى، ثم مرر إصبعه على السهم. لم يكن الماء قوة مجانية؛ كان جزءاً من طاحونة تنتظر من يطحن عليها. وإذا أرادوا هواءً ثابتاً، فعليهم أن يقرروا كم من لقمتهم سيمنحونه للنار.\u003c/p>\u003cp>في الصباح التالي، سيحاولون تحريك الذراع بأيديهم.\u003c/p>"},{"n":42,"t":"الفصل الثاني والأربعون: ساعة من الماء","b":"\u003cp>في اليوم السابع والثلاثين بعد المئة، عاد الدفء إلى القرية قبل أن يقرر النهر إن كان سيستسلم له.\u003c/p>\u003cp>كانت الشمس خافتة وراء سحب منخفضة، لكنها أذابت خطاً من الجليد عند طرف المجرى. لم يجر الماء عالياً؛ سال على الحصى بصوت خفيف، ثم اختفى تحت قشرة بيضاء عند المنعطف. وقف شو على الضفة، يحمل عصاه، ويراقب ذلك الخيط كأنه ينتظر منه اعترافاً.\u003c/p>\u003cp>قال لين: «هل يكفي لتدوير الدولاب؟»\u003c/p>\u003cp>«يكفي لتحريك ورقة. لا يكفي لتحريك حجر.»\u003c/p>\u003cp>«نحتاج المنفاخ، لا الحجر.»\u003c/p>\u003cp>«الماء لا يسأل ما تحتاجه. إذا عاد البرد، جمد هذا الخيط قبل أن تنتهي من كلامك.»\u003c/p>\u003cp>لم يجادله لين. كانت حافة النهر تحمل ألواحاً رقيقة من الجليد، بعضها عالق بين الصخور. نزل يانغ إلى الحافة الصلبة، لا إلى الجليد، وانحنى ليفحص ريشة الدولاب التي ظهرت عند طرف المجرى. عبرت شين يان المسافة حتى صارت بجانبه، ثم توقفت حيث أشار شو بعصاه.\u003c/p>\u003cp>«لا تتقدمي أكثر،» قال.\u003c/p>\u003cp>«لن أضع قدمي على الجليد.» رفعت شين يان حبل القياس. «أريد رؤية الشق فقط.»\u003c/p>\u003cp>كانت إحدى الريشات قد انفلقت على طولها. دخل الماء في الشق ثم جمد، فوسعه من الداخل. لم تكن الريشة ساقطة، لكن طرفها تحرك مع كل دفعة ماء.\u003c/p>\u003cp>قال يانغ: «إذا أنزلنا الدولاب كما هو، يكسرها أول ضغط.»\u003c/p>\u003cp>«يمكن تثبيتها من الخارج بلوحين،» قال لين.\u003c/p>\u003cp>«يمكن. لكن لا تصلح لتبقى في الماء. الخشب مبتل والبرد يعود.»\u003c/p>\u003cp>قالت شين يان: «نصلحها أولاً، ثم نختبر الحركة من الضفة. لا أنزل إلى هناك، ولا ينزل أحد.»\u003c/p>\u003cp>قال شو: «هذا أول كلام عاقل اليوم.»\u003c/p>\u003cp>عادوا إلى الورشة ومشوا بمحاذاة الضفة، حتى لا يقطعوا الجليد في الطريق الأقصر. كانت أحذيتهم تغوص في الطين عند المنعطف. أخذ يانغ لوح بلوط جافاً من مخزنه، واختار منه شريحة ضيقة. شرح لشياو دو كيف يضعها على وجه الريشة المتشقق، ثم طلب منه أن يمسك طرف الحبل بينما يثبتها من اليابسة. لم يستعملوا مسماراً في الخشب الرطب؛ صنع يانغ مشبكين خشبيين، وربطهما بحبل مبلل سينكمش حين يجف.\u003c/p>\u003cp>قال شياو دو: «إذا انكمش الحبل، ألن يكسر اللوح؟»\u003c/p>\u003cp>«لهذا لا أشده حتى يصرخ الخشب.»\u003c/p>\u003cp>«كيف أعرف أنه لم يصرخ؟»\u003c/p>\u003cp>«إذا سمعت صوته، فقد تأخرت.»\u003c/p>\u003cp>رمقه شياو دو، ثم أمسك الحبل بحذر زائد. جعل يانغ الرباط ثابتاً، وترك مسافة صغيرة تسمح للخشب أن يتحرك. لم تكن معالجة دائمة؛ كانت كافية لتجربة محدودة بعد ذوبان الجليد القريب.\u003c/p>\u003cp>في الساحة، أخرج لين الرسم الذي بدأه بالأمس. أعاد رسم الدولاب والمنفاخ بمقاييس أبسط، ووضع خطاً على المقبض، ثم خطاً آخر على ذراع الخشب. كان المطلوب أن تتحول دورة الدولاب إلى دفعة للأمام، ثم تعيدها وصلة ثانية إلى الخلف. لم يكن عندهم معدن كافٍ لصنع أجزاء دقيقة، لكنهم امتلكوا خشباً صلباً، ومحوراً قصيراً من حديد قديم، وحلقتين يمكن أن تصيرا موضع تثبيت.\u003c/p>\u003cp>وضعت شين يان حصاة على طرف الرسم. «حركة الدولاب دائرة. مقبض المنفاخ يتحرك ذهاباً وإياباً. إذا ربطت هذا الطرف هنا، ستسحبه الوصلة ثم تدفعه في مسار منحني. لكن المقبض لا يتحرك بهذا الاتجاه.»\u003c/p>\u003cp>«نضيف ذراعاً قصيرة بينهما.»\u003c/p>\u003cp>«فتنقل الحركة إلى المقبض، وتعود معه. لكن يجب أن تستطيع الانفصال. إذا علق المنفاخ، لن أريد أن يواصل الماء دفعه حتى ينكسر.»\u003c/p>\u003cp>قال يانغ: «أستطيع أن أضع وتداً يخرج باليد.»\u003c/p>\u003cp>قال تشانغ: «والحديد يمسك الوصلة. الخشب وحده سيتآكل.»\u003c/p>\u003cp>لم يقترح أحد زيادة القوة. رسموا نقطة التثبيت أولاً، ثم قص يانغ قطعتين من الخشب على شكل ذراعين، ترك بينهما فتحة لمحور صغير. خفف تشانغ طرف المحور القديم، حتى يدخل في الفتحة من غير أن يشقها. ثم صنع مسماراً قصيراً من خردة لا تصلح لقضيب، وترك رأسه عريضاً ليُسحب حين يريدون فصل الحركة.\u003c/p>\u003cp>قال لين: «إذا وضعنا نقطة الدفع قريبة من مركز الدولاب، ستكون الحركة أضعف.»\u003c/p>\u003cp>«وأبعد نقطة ستضغط على الحامل،» أجابت شين يان. «ابدأوا من المنتصف. نقيس قبل أن نوسع.»\u003c/p>\u003cp>تحركت يد لين نحو العلامة الخارجية، ثم توقف. «حسناً. نبدأ بالمنتصف.»\u003c/p>\u003cp>كانت شين يان قد كتبت على لوح صغير مقدار المسافة التي يقطعها المقبض حين يضغطه عامل، ثم قاست مدى دوران الدولاب يدوياً. لم تكن الأرقام دقيقة؛ اختلفت مع كل دفعة. لم تدّع أنها دقيقة. وضعت خطين: أقصر حركة آمنة، وأطول حركة لا تشد الجلد عند أطرافه.\u003c/p>\u003cp>قالت: «نحتاج من المقبض نصف هذا المسار تقريباً، وإلا مزقنا الجلد.»\u003c/p>\u003cp>قال تشانغ: «لا أريد نصفاً تقريبياً حين تحمر القطعة. أريد أن أرى الهواء.»\u003c/p>\u003cp>«سنرى الهواء على شريط خفيف. ثم نرى اللهب حين يصبح الوقود جاهزاً.»\u003c/p>\u003cp>قال لين: «من دون حديد اليوم. لدينا تجربة يد فقط.»\u003c/p>\u003cp>علقوا الوصلة على دعامة خشبية في ساحة الورشة، ثم ربطوا أحد طرفيها بمقبض المنفاخ. أمسك يانغ بذراع طويلة، ودفعها ببطء إلى الأمام. تحرك المقبض، فانفتح المنفاخ وأطلق الهواء. حين أعاد الذراع، ارتد الجلد ببطء، لكنه تعلق عند آخر المسار. أوقف يانغ حركته قبل أن ينكسر شيء.\u003c/p>\u003cp>قال تشانغ: «أزلوا الذراع. إنها تشد المقبض جانباً.»\u003c/p>\u003cp>«لا،» قالت شين يان. «الجانب يتحرك لأن نقطة التثبيت على الخطأ.»\u003c/p>\u003cp>«والنتيجة واحدة. علقت.»\u003c/p>\u003cp>«لكن إذا زدنا القوة سنزيد العلق.»\u003c/p>\u003cp>رفع لين يده إلى المقبض، ولم يحركه. «كيف نعرف أين الخلل؟»\u003c/p>\u003cp>أخذت شين يان خيطاً رفيعاً وربطته بمحور الذراع، ثم طلبت من يانغ أن يدفع ببطء. تحرك الخيط في مسار جانبي عند نهاية الرجوع. وضعت علامة على موضع انحرافه، وقاست المسافة بين المحور والحامل. كان الحامل أقرب إلى المقبض من اللازم، فدفع الوصلة إلى جانبها في آخر الحركة.\u003c/p>\u003cp>قالت: «ننقل نقطة التثبيت مقدار إصبعين. لا نطيل الذراع.»\u003c/p>\u003cp>تأمل تشانغ العلامة. «إذا نقلناها، يخف الدفع.»\u003c/p>\u003cp>«نعم. لكن الحركة تكمل مسارها. نحتاج حركة ثابتة قبل حركة أقوى.»\u003c/p>\u003cp>تبادل لين وتشانغ نظرة قصيرة. لم يكن في كلامها ضمان. كان فيه سبب يمكن اختباره. فك يانغ المحور، نقل الحامل، ثم ثبته بقطعة خشب أخرى. أعادوا الذراع إلى موضعها. هذه المرة تحرك المقبض حتى النهاية، ثم رجع من دون أن يحتك بالحامل. كانت الحركة أبطأ من يد العامل، لكنها كاملة.\u003c/p>\u003cp>ثبت شياو دو شريطاً من قماش خفيف قرب فتحة المنفاخ. ارتفع مع كل دفعة، وانخفض حين عاد المقبض. لم يكن الهواء قوياً، لكنه تكرر بإيقاع واحد أربع مرات.\u003c/p>\u003cp>قال تشانغ: «أربع مرات لا تصنع ناراً.»\u003c/p>\u003cp>«ولا تثبت أن الوصلة ستبقى،» قالت شين يان. «لكنها لا تعلق الآن.»\u003c/p>\u003cp>«كم دورة نجرب؟» سأل لين.\u003c/p>\u003cp>«عشر. ثم نفحص الجلد والمحور.»\u003c/p>\u003cp>عملوا بالتناوب. بدأ يانغ، ثم لين، ثم شين يان، التي دفعت الذراع بيدها وأبطأت الحركة حين شعرت بأن الخشب يقاوم. لم تحمل شيئاً ثقيلاً، ولم تسمح للين أن يمسك الذراع عنها. وحين وصلوا إلى الدورة العاشرة، بقي الشريط يرتفع وينخفض. صار المحور دافئاً من الاحتكاك، لكن الخشب لم يتشقق، ولم يتحرك الحامل.\u003c/p>\u003cp>قال تشانغ: «جرّب.»\u003c/p>\u003cp>لم تكن هذه دعوة إلى تشغيل النار، بل إلى تحريك الذراع. دفعها تشانغ بنفسه ثلاث مرات، ثم فحص موضع التثبيت. «يمشي. لكن لا أعرف كم سيبقى.»\u003c/p>\u003cp>أجاب لين: «لا نعرف حتى الآن. سنسجله على أنه يتحرك يدوياً لعشر دورات، لا على أنه جاهز للعمل.»\u003c/p>\u003cp>قالت شين يان: «والدولاب لا يعمل بعد. هذا اختبار منفصل.»\u003c/p>\u003cp>وقف شو عند الطريق، وجاء صوته من الضفة: «الغيوم ستعود. لا تفتحوا المجرى.»\u003c/p>\u003cp>لم يرفع أحد صوته للرد. كانت فتحة الماء القديمة مغطاة بطبقة جليد، وتحتها أحجار صغيرة تحركها المياه من حين إلى آخر. لا يستطيعون كسرها دفعة واحدة؛ إذا اندفعت كتلة متجمدة إلى الريش، كسرت ما أصلحوه. قال شو إنهم يحتاجون إلى إزالة الجليد على أطراف الفتحة أولاً، ثم الانتظار حتى ينساب الماء الصغير، لا أن يفتحوا البوابة كلها.\u003c/p>\u003cp>قال يانغ: «أستطيع صنع خطاف طويل.»\u003c/p>\u003cp>«من اليابسة،» قالت شين يان. «ولا يدخل أحد إلى المجرى.»\u003c/p>\u003cp>قال لين: «غداً نفحص الحافة مع شو. إذا عاد البرد، ننتظر. الوصلة لن تفسد إن بقيت في الساحة.»\u003c/p>\u003cp>كان هذا أبطأ مما أراده لين. أمضى ساعة في مقارنة المسافات، وكان يريد أن يعرف إن كان الماء يملك قوة كافية. لكن الجليد لا يهتم بحساباته، والخطأ هنا قد يسلبهم الدولاب الذي يطحنون به. كتب في الدفتر: «الوصلة نجحت باليد. لا تشغيل مائي كامل. إصلاح الريشة ثابت مؤقتاً. المجرى مغلق.»\u003c/p>\u003cp>طلب من شياو دو أن يحضر كيساً فارغاً، ثم وضعه تحت حجر الطاحونة في المخزن. لم يكن يختبر الطحن؛ أراد أن يبين لهم ما معنى توقف الحجر. وضع أمام الكيس لوحاً صغيراً، وكتب عليه: «ساعة عمل». ثم رسم تحته أربعة مربعات، كل واحد يمثل ربع ساعة.\u003c/p>\u003cp>قال: «إذا أخذنا ساعة من الماء، لا أريد أن أكتبها كأنها لا تساوي شيئاً. قد لا نعرف كمية الطحن التي نخسرها حتى نجرب، لكن كل مربع هنا وقت لا يعود.»\u003c/p>\u003cp>قالت شين يان: «ولا نكتب كيساً كاملاً إذا لم نعرف أن الحجر كان سيطحنه في تلك الساعة.»\u003c/p>\u003cp>«صحيح. نحتاج إلى قياس أيام عادية.»\u003c/p>\u003cp>قالت: «في الأيام الأخيرة كان الماء أضعف من المعتاد. إذا استخدمناها خط أساس، سنحسب خسارتنا أقل مما هي.»\u003c/p>\u003cp>كتب لين ملاحظة أخرى: «القياس السابق لا يمثل الربيع.»\u003c/p>\u003cp>قال تشانغ: «أتريد أن تطحنوا الآن؟»\u003c/p>\u003cp>«لا. الحجر متوقف، والماء غير كاف.»\u003c/p>\u003cp>«إذن لا تملأ الدفتر بأكياس لم ترها.»\u003c/p>\u003cp>«سأسجل ما لا نعرفه أيضاً.»\u003c/p>\u003cp>أخذت شين يان أحد المربعات، وقسمته بخطين إضافيين. «حين يأتي يوم الماء المستقر، نقيس الطحن في ساعة كاملة. لكننا لا نأخذ الساعة كلها للمنفاخ من أول مرة. نأخذ فترة قصيرة، ثم نعيد الحجر. إذا زاد الماء أو نقص، ندوّن ذلك.»\u003c/p>\u003cp>قال لين: «هذا يجعل القياس أطول.»\u003c/p>\u003cp>«ويجعل القرار أقل كلفة.»\u003c/p>\u003cp>فتح يانغ الصندوق الذي وضع فيه بقايا الحديد، وأخرج محوراً قصيراً ليثبت الذراع الخشبية. لم تكن فيه شقوق ظاهرة، لكنه لم يكن مستقيماً تماماً. وضعه على سطح الطاولة، فدار ببطء ثم توقف عند نقطة واحدة.\u003c/p>\u003cp>قال يانغ: «إذا ركبت هذا المحور كما هو، سيتحرك المقبض مرة بسهولة ومرة بثقل.»\u003c/p>\u003cp>قال تشانغ: «أستطيع تسويته.»\u003c/p>\u003cp>«ليس قبل أن نحدد إن كان المحور نفسه يتحمل الضغط.»\u003c/p>\u003cp>قالت شين يان: «لا نحتاج محوراً يدور دورة كاملة. الذراع تتحرك في قوس قصير. يمكن أن يدفعه الخشب على الجانبين.»\u003c/p>\u003cp>قال يانغ: «إذا تركنا فراغاً كافياً، لن يحتك.»\u003c/p>\u003cp>ثبتوا المحور مؤقتاً بين قطعتين خشبيتين، ثم دفعوه باليد. تحرك إلى اليمين بسهولة، لكنه اصطك عند العودة. لم يكن الخلل كبيراً، غير أنه أظهر أن الوصلة المائية ستكرر الاحتكاك عشرات المرات. عدل يانغ زاوية الخشب، ولم يزد طول الذراع.\u003c/p>\u003cp>قال تشانغ: «هذا يكفي لاختبار يدوي آخر.»\u003c/p>\u003cp>قال لين: «عشر دورات؟»\u003c/p>\u003cp>«عشر، ثم نفك المحور ونرى أثر الاحتكاك.»\u003c/p>\u003cp>هذه المرة تولت شين يان الدفع. كانت الحركة أصعب عند الرجوع، فطلبت من يانغ أن يغير موضع الحامل مقداراً يسيراً. أعادوا الاختبار، فتحرك المقبض على نحو أنعم، لكن صوت الاحتكاك لم يختفِ. لم يحاولوا إخفاءه بالشحم؛ لم يريدوا أن يخلطوا تحسن الحركة بتغيير آخر. سجلت شين يان الموضع الذي خف فيه الصوت، وتركت العلامة بالقلم على الخشب.\u003c/p>\u003cp>رفعت شين يان عينيها عن سجلها. «أضف أن تجربة اليوم لم تخصم شيئاً من وقت الطحن. كانت يدوية.»\u003c/p>\u003cp>«كتبت ذلك.»\u003c/p>\u003cp>«وأضف أن ساعة الماء لها كلفة. لا نأخذها من دون اتفاق.»\u003c/p>\u003cp>قال تشانغ: «أنا أوافق على ساعة واحدة حين يصلح المجرى.»\u003c/p>\u003cp>«لا تزال ساعة واحدة تقديراً،» قالت شين يان. «نقيسها بعد التجربة، ولا ندع المنفاخ يسرق وقت الطاحونة بلا حساب.»\u003c/p>\u003cp>نظر لين إلى الرسم؛ صارت هناك وصلة خشبية صغيرة بين حركة دائرية ودفع مستقيم، لها مسمار يمكن سحبه، ومسافة تسمح للمقبض أن يعود. لم يكن التصميم جميلاً، لكنه مفهوم لكل من سيضع يده عليه. قال: «سنعد جدولاً: زمن الطحن المعتاد، ثم وقت المنفاخ، والكمية التي تفوتنا. بعد ذلك نقرر إن كانت ساعة الماء تستحقها.»\u003c/p>\u003cp>أغلقت شين يان الدفتر. «هذا ما أريده.»\u003c/p>\u003cp>قبل الغروب، مشوا عائدين بمحاذاة الضفة ليروا الإصلاح. بقي اللوح مثبتاً على الريشة، لكن الماء لم يجر إلى الدولاب. كان طرف الجليد قد ابتعد إصبعين عن الحافة، لا أكثر. مد شو عصاه، وضرب الثلج عند طرف الفتحة، فصدر صوت أجوف.\u003c/p>\u003cp>قال: «لا أحد يقترب. ليس بعد.»\u003c/p>\u003cp>بقيت شين يان مكانها، وحدقت في الفتحة. «حين نفتحها، أريدني عند الوصلة لأوقفها فوراً إذا اضطربت.»\u003c/p>\u003cp>قال لين: «ستكونين عندها.»\u003c/p>\u003cp>«ولا أريد أحداً أن يربطها ربطاً لا ينفك.»\u003c/p>\u003cp>قال يانغ: «المسمار يخرج بيدي.»\u003c/p>\u003cp>«تأكدنا من ذلك؟»\u003c/p>\u003cp>أخرج يانغ المسمار وسحبه، ثم أعاده مكانه. «الآن تأكدنا.»\u003c/p>\u003cp>لم يصل الماء إلى المنفاخ. بقيت فتحة المجرى مسدودة بالجليد، وبقيت الوصلة في الساحة ساكنة. لكن ذراعها لم تعد مجرد خط على ورق؛ لقد دفعت مقبض المنفاخ وأعادته عشر مرات، وأظهرت أين تعلق وكيف تُصلح. حين انطفأ الضوء، حملوا الرسم إلى الداخل، وتركوا عند باب الورشة الخطاف الطويل الذي سيستعملونه من اليابسة.\u003c/p>\u003cp>في الصباح، سيقرر شو إن كانت الحافة صلبة بما يكفي لبدء إزالة الجليد.\u003c/p>"},{"n":43,"t":"الفصل الثالث والأربعون: ما تراه وحدها","b":"\u003cp>في اليوم التاسع والثلاثين بعد المئة، وقف شو على الضفة قبل أن يقترب أحد من بوابة المجرى.\u003c/p>\u003cp>كان الجليد قد تراجع عن الحافة، لكنه بقي متراصاً في موضع ضيق أمام الفتحة. طرقه شو بعصاه من الأرض الصلبة، ثم أشار إلى يانغ. مد النجار خطافه الطويل، وسحب قطعة الثلج إلى اليابسة من غير أن يضع قدمه على الضفة الزلقة. تكسرت القطعة عند الحصى، وخرج الماء من خلفها خيطاً ضئيلاً.\u003c/p>\u003cp>قال شو: «قطعة أخرى، ثم ننتظر.»\u003c/p>\u003cp>قال لين: «كم؟»\u003c/p>\u003cp>«حتى أسمع الماء لا الجليد.»\u003c/p>\u003cp>لم يعجبه لين أن يتركوا الوقت للماء، لكنه لم يناقش. وقفوا جميعاً عند الطرف الآمن من المجرى، يراقبون شو وهو يرفع القطع الصغيرة واحدة واحدة. لم يوسعوا الفتحة، ولم ينزلوا إلى القناة. كل مرة كان يسحب قطعة، عاد الماء إلى السكون، ثم وجد طريقه بين الحصى.\u003c/p>\u003cp>كان معهم لوح صغير أعدته شين يان، وفيه ثلاثة أسطر: «الماء»، «الوصلة»، «المنفاخ». أرادت أن يضع كل منهم علامة عند الجزء الذي يراقبه، لا أن يتجمعوا حول المقبض ويتركوا المجرى بلا مراقب. كتب لين عند الماء: «مستوى الفتحة»، وكتب يانغ عند الوصلة: «حركة القاعدة»، وكتبت هي عند المنفاخ: «عودة المقبض». أما تشانغ فاختار أن يقف في موضع يرى فيه الجميع.\u003c/p>\u003cp>قال لين: «إذا لم نر الحركة كلها، لن نعرف أين بدأ الاضطراب.»\u003c/p>\u003cp>قالت شين يان: «وإذا تابع كل واحد شيئاً واحداً، لا يضيع انتباهنا في اللحظة نفسها.»\u003c/p>\u003cp>قال شو: «أنا أراقب الجليد. هذا يكفي.»\u003c/p>\u003cp>لم يجعلوا الوقوف خطة كاملة، لكنه منع التزاحم، وجعل لكل شخص سبباً للبقاء حيث ينبغي. اتفقوا أن أول حركة لا تزيد على دورتين، ثم يغلقون الماء ولو بدا كل شيء سليماً. أراد لين أن يجرب أربعاً كما بالأمس، لكن شين يان أشارت إلى أن الحركة اليدوية لم تحمل وزن الماء ولا اهتزازه.\u003c/p>\u003cp>قالت: «إذا أكملنا دورتين، نكون قد عرفنا أن الماء وصل. لا نحتاج إلى إثبات الأمر خمس مرات في اللحظة الأولى.»\u003c/p>\u003cp>قال تشانغ: «الدورتان تكفيان إذا لم يعلق المقبض.»\u003c/p>\u003cp>أضاف شو: «وأنا أقرر إن كان الجليد يتحرك. لا تفتحوا أكثر مما أقول.»\u003c/p>\u003cp>كانت شين يان عند الوصلة، تفحص المسمار الذي يفصل الذراع عن المقبض. وضعت في يدها وتداً خشبياً قصيراً تستطيع به دفع المسمار بعيداً إذا اهتز التثبيت. لم تضعه في جيبها؛ أبقته بين أصابعها. إلى جانبها وقف لين، وعلى مسافة منه تشانغ، الذي أصر أن يبقى قريباً بما يكفي ليسمع صوت الحديد.\u003c/p>\u003cp>قالت شين يان: «نبدأ من أصغر فتحة. دورة واحدة فقط.»\u003c/p>\u003cp>قال شو: «إذا ارتفع الماء، أغلقوها.»\u003c/p>\u003cp>«كيف نغلقها؟» سأل شياو دو.\u003c/p>\u003cp>أشار يانغ إلى اللوح الذي يغطي جزءاً من المدخل. «أعيده إلى مكانه بالحبل. لن نسحب الحجر.»\u003c/p>\u003cp>قالت شين يان: «ويبقى شخص عند الحبل. لا يبتعد أحد.»\u003c/p>\u003cp>تولى شياو دو الحبل. بدا عليه أنه يريد أن يثبت أنه يستطيع فعل شيء مهم، لكنه لم يتقدم من موضعه الآمن. كانت أطراف الماء تلامس الخشب، ثم ترتد. وقف لين عند ذراع الوصلة، فيما بقيت شين يان عند المسمار. أخذت نفساً قصيراً، ثم رفعت يدها.\u003c/p>\u003cp>تحرك الماء في المجرى القديم. لم يندفع؛ مر على الحصى، ولامس الريشة المصلحة، ثم دفع الدولاب بمقدار يسير. تحركت الذراع. ضغطت الوصلة مقبض المنفاخ، فانفتح الجلد ودفع الهواء إلى الداخل. ارتفع شريط القماش قرب الفوهة.\u003c/p>\u003cp>قال تشانغ: «كفى.»\u003c/p>\u003cp>لكن شين يان رأت أن المسار لم يكتمل. بقيت يدها على المسمار، وعيناها على الحامل. تحركت الوصلة مرة ثانية. هذه المرة عاد المقبض، ثم اندفع إلى الأمام. مر الهواء في خرطوم المنفاخ، فاهتز طرف القماش ثلاث مرات.\u003c/p>\u003cp>قالت: «أوقفوا الماء.»\u003c/p>\u003cp>سحب شياو دو الحبل، ورد يانغ اللوح إلى موضعه. تباطأ الدولاب. بقيت الذراع تتحرك نصف دورة، ثم سكنت. لم يصرخ أحد. لم ينكسر الخشب. لم ينسلخ الجلد عن المنفاخ.\u003c/p>\u003cp>قال تشانغ: «مرتين.»\u003c/p>\u003cp>قالت شين يان: «ثلاثاً، لكن الثالثة لم تكمل.»\u003c/p>\u003cp>أخرجت الوتد وفصلت الوصلة عن المقبض. لم تنتظر إذناً. دخلت بينهما، ولمست الحامل بظهر إصبعها، ثم تفحصت حافة الجلد. كان هناك اهتزاز عند نهاية الحركة. الخشب لم يتحرك من مكانه، لكن المسمار مال قليلاً.\u003c/p>\u003cp>قال لين: «هل انحنى؟»\u003c/p>\u003cp>«لا أعرف بعد. نحتاج إلى فحصه قبل دورة أخرى.»\u003c/p>\u003cp>أمسك تشانغ المسمار، قلبه بين إصبعيه، وأعاد وضعه في الثقب. «دخل مائلاً. ربما كان كذلك من قبل.»\u003c/p>\u003cp>«أو حركه الضغط،» قالت شين يان. «لن نعيد التجربة حتى نستبدله.»\u003c/p>\u003cp>لم يزد لين الماء. سحبوا المسمار، وأخذ تشانغ قطعة خردة أخرى لصنع بديل أعرض عند الرأس. استغرق ذلك وقتاً، وخلاله ظلت بوابة الماء مغلقة. لم ير أحد منهم فائدة في الاستعجال بعد أول حركة؛ كان اختبارهم أن يصل الماء إلى المنفاخ ويعود الهواء، لا أن يشغلوا الطاحونة والفرن في يوم واحد.\u003c/p>\u003cp>عاد تشانغ بالمسمار الجديد. فحصه يانغ، ثم ثبت الوصلة. لم يسمح لشياو دو بسحب الحبل. وقف بنفسه عنده، بينما استعدت شين يان عند نقطة الفصل. فتحوا مجرى الماء على القدر نفسه. تحرك الدولاب، وضغطت الوصلة المقبض، ثم أعادته. تكرر الإيقاع أربع مرات كاملة. في الخامسة اهتز الحامل، وخرج صوت احتكاك حاد من الخشب.\u003c/p>\u003cp>قالت شين يان: «أغلقوا.»\u003c/p>\u003cp>أعاد يانغ اللوح. سحب تشانغ المسمار بيده، وفصل الذراع عن المقبض. تراجعوا خطوة وانتظروا حتى سكن الماء.\u003c/p>\u003cp>قال لين: «التثبيت تحرك.»\u003c/p>\u003cp>«أقل من إصبع،» قالت شين يان، وهي تضع علامة على موضعه. «لكنه تحرك.»\u003c/p>\u003cp>قال تشانغ: «إذا زدنا لوحاً خلفه، يثبت.»\u003c/p>\u003cp>«ربما. نفحص أولاً أين أخذ الحمل. لا نضيف خشباً فوق خشب لا نعرف اتجاه ضغطه.»\u003c/p>\u003cp>استدار تشانغ إليها. «أنا أعرف الخشب.»\u003c/p>\u003cp>«وأنا أعرف أن الماء ضغطه في موضع مختلف عن تجربة اليد.»\u003c/p>\u003cp>سكت. لم يكن اعتراضها على خبرته، بل على المسافة بين تجربة في الساحة ودفع منتظم في المجرى. ترك لهم الحامل، وراح يفحص المنفاخ. رفع الجلد عن الأرض، ومرر أصابعه على الحافة حيث يلتقي بالخشب. لم يكن هناك تمزق، لكن الطرف الذي عاد إليه المقبض صار دافئاً.\u003c/p>\u003cp>قال: «أربع دفعات نظيفة. والخامسة أفسدتها الوصلة.»\u003c/p>\u003cp>قالت شين يان: «إذن نصلحها قبل أن نزيدها.»\u003c/p>\u003cp>قال لين: «هذه أول مرة يدير الماء فيها شيئاً يخدم الإنتاج.»\u003c/p>\u003cp>نظر إلى الدولاب. «لم يطحن.»\u003c/p>\u003cp>قالت: «لكنه أعاد الهواء إلى المنفاخ.»\u003c/p>\u003cp>لم تبتسم. كان صوت الماء ما يزال في أذنها، متقطعاً ومتردداً. في اللحظة التي تحرك فيها المقبض، شعرت بضغط خفيف خلف عينيها، لا كألم، بل كأن حافة زرقاء انعكست على زجاج لم يكن موجوداً. رمشت. اختفى الضوء، ثم عاد في طرف نظرها.\u003c/p>\u003cp>لم تقل شيئاً. نظرت إلى يدها. لم يكن فيها زجاج ولا أثر غريب. وضعت الوتد على الطاولة، وقررت أن تعيد فحص الوصلة. لم تكن تريد أن تعلن خللاً لم تتأكد منه.\u003c/p>\u003cp>في هذه الأثناء، أخذ لين الهاتف من التخزين، وأجرى تحليلاً محدوداً على المسمار البديل بعد أن لاحظ الخدش عند رأسه. ظهرت له رسالة قصيرة، ثم أطفأ الشاشة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>العينة: مسمار حديدي معاد الطرق.\u003c/div>\u003cdiv>الملاحظة: تفاوت في السماكة عند الرأس.\u003c/div>\u003cdiv>الثقة: 68%\u003c/div>\u003cdiv>طاقة التكامل: 59%\u003c/div>\u003c/div>\u003cp>لم ير شين يان ما رآه لين. لم تر هي واجهته، ولم ير هو اللون الأزرق الذي عاد إلى طرف بصرها. وحين سألها عن العينة، أجابت أنها لم تفحص شيئاً. لم تكن تكذب؛ لم تكن تعرف ما الذي حدث بعد.\u003c/p>\u003cp>قال لين: «هل تستطيعين البقاء هنا حتى نفحص التثبيت؟»\u003c/p>\u003cp>«نعم. لكن لا تفتحوا الماء.»\u003c/p>\u003cp>قال: «لن نفتح.»\u003c/p>\u003cp>أخذت هي لوحاً صغيراً، وراحت تقيس المسافة بين الحامل ونقطة احتكاك الوصلة. دوّنت أربع علامات، ثم كتبت بجانبها: «اهتزاز عند الدفعة الخامسة. سبب محتمل: ميل المسمار أو حركة القاعدة. يلزم اختبار منفصل.» حاولت التركيز على الخطوط. لم تعد الحافة الزرقاء، لكنها شعرت بأنها رأتها حقاً، لا كوميض من الماء.\u003c/p>\u003cp>قال يانغ: «نعود إلى الورشة. لا فائدة من الوقوف على البرد.»\u003c/p>\u003cp>مشوا جميعاً على الطريق الصلب بمحاذاة الضفة، ثم عبروا الساحة إلى الورشة. لم يحمل لين شيئاً سوى الدفتر. حمل تشانغ المسمار القديم، وأمسكت شين يان بالوتد. لم تفارقها الفكرة؛ هناك شيء آخر في مجال رؤيتها، لكنه لم يطلب منها أن تلمسه أو يتبع حركتها.\u003c/p>\u003cp>في الورشة، جعلت شياو دو يقيس بعصا المسافة التي تحركها القاعدة. أخطأ في موضع العلامة، فأعاد القياس بعدما صححته شين يان. لم تسأله لماذا أخطأ، بل أشارت إلى الحافة التي ينبغي أن يبدأ منها. ثم فصل يانغ الحامل وأراهما أثر الضغط على الخشب. بدا الأثر عند الجهة التي توقعتها شين يان.\u003c/p>\u003cp>قال تشانغ: «نضيف دعامة إلى الخلف، ونربطها بالعوارض.»\u003c/p>\u003cp>«نربطها، لكن لا نغلق المسمار،» قالت. «يجب أن يبقى قابلاً للسحب.»\u003c/p>\u003cp>«لن أغلقه.»\u003c/p>\u003cp>«وأريد أن أكون عند الحبل في التجربة القادمة.»\u003c/p>\u003cp>قال لين: «أنت من ستقرر متى نفتح ومتى نغلق.»\u003c/p>\u003cp>نظرت إليه. «إذا اهتز التثبيت، أوقف الماء فوراً. لن أنتظر حتى تقول إن التجربة اكتملت.»\u003c/p>\u003cp>«اتفقنا.»\u003c/p>\u003cp>سألها: «هل تستطيعين فتحها حين تريدين، أم لا تظهر إلا قرب الماء؟»\u003c/p>\u003cp>«فتحتها الآن، بعيداً عن المجرى.»\u003c/p>\u003cp>«إذن لا نعرف إن كان ظهورها الأول بسبب الماء.»\u003c/p>\u003cp>«لا نعرف.»\u003c/p>\u003cp>لم يطلب منها أن تحاول إظهارها مرة ثالثة. لم يكن يملك سبباً يجعل التكرار مفيداً، ولم يريد أن يحول الأمر إلى امتحان وهي لم تفهم حدوده بعد. قالت هي إن الواجهة لا تشرح سببها، ولا تعرض إلا عنوان المجال ومقداراً من الطاقة ووصفاً محدوداً. وافقها أن يسجلا الكلمات، لا تخميناتهما.\u003c/p>\u003cp>لم يكن عندها تفسير لما رأت. لم تخبر لين بعد. أرادت أولاً أن تتأكد أن الأمر لم يكن انعكاساً من الثلج أو تعباً من الوقوف في الضوء. دخلت المخزن لتعيد الوتد، ثم بقيت عند الباب لحظة تنظر إلى يدها. عاد الوميض الأزرق، هذه المرة كلوح شفاف يقف أمامها، لا أمام الغرفة.\u003c/p>\u003cp>ظهرت كلمات واضحة، لا تشبه أثر الضوء على الماء:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[النصف الثاني — التكامل 1%]\u003c/strong>\u003c/div>\u003c
