يء بسيط يمكنهم لمسه وإخفاؤه في جيب، تبدلت وجوههم.\u003c/p>\u003cp>سألت امرأة: «وإذا ضاعت؟»\u003c/p>\u003cp>«احفظيها في مكان تعرفينه، واكتبي عندك ما أخذت إن استطعت. سنسجل الأسماء أيضاً.»\u003c/p>\u003cp>«وإذا قلدها أحد؟»\u003c/p>\u003cp>نظر لين إلى الرقعة. العلامة ليست علامة عادية. شين يان صنعتها بنقطتين في ركن لا يظهر إلا لمن يعرف أين ينظر.\u003c/p>\u003cp>«وضعنا لها علامة نعرفها. وسنسجل ما أعطيناه، حتى لا نعتمد على العلامة وحدها.»\u003c/p>\u003cp>وحين انتهى الصباح، كان في العربة ما يقارب ستين رطلاً من الحديد القديم.\u003c/p>\u003cp>عند الظهر مرت العربة قرب النزل، فخرجت هو سانيانغ إلى الباب وهي تمسح يديها بمريلتها، ونظرت إلى الحمولة، ثم إلى الرقع الطينية الصغيرة التي يحملها شياو دو في سلة.\u003c/p>\u003cp>«ما هذه؟»\u003c/p>\u003cp>شرحت شين يان. الرقعة والكيس والشتاء.\u003c/p>\u003cp>«ومن يضمن؟»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«الرقعة طين. الطين لا يطحن.» رفعت هو سانيانغ واحدة بين إصبعين. «عندما يأتي الشتاء، وتقول امرأة إنها أعطتكم قدراً، وتقولون لا، من يحكم؟»\u003c/p>\u003cp>سكتت شين يان لحظة. ثم قالت بهدوء: «كتابك.»\u003c/p>\u003cp>«كتابي؟»\u003c/p>\u003cp>«كل رقعة تُسجَّل فيه: اسم من أعطى، وما أعطى، ووزنه، ورقم الرقعة. الناس يثقون بكتابك أكثر مما يثقون بنا.» رفعت عينيها. «ويثقون به أكثر من ليو.»\u003c/p>\u003cp>لم تبتسم هو سانيانغ. أخذت الرقع الثلاث الأولى من السلة، وقلبتها، وقالت: «نصف نحاسة عن كل عشر رقع أسجلها.»\u003c/p>\u003cp>«نصف نحاسة؟»\u003c/p>\u003cp>«ثمن الحبر والجهد.» وكادت تدير ظهرها. «لا أكتب مجاناً. حتى لكما.»\u003c/p>\u003cp>قالت شين يان: «موافقة.»\u003c/p>\u003cp>ولم تقل هو سانيانغ شيئاً، ففتحت كتابها عند العتبة وكتبت عنواناً جديداً بخط ثقيل. أعادت شين يان عليها أسماء البيوت التي مروا بها، وراح شياو دو يعدّ الرقع من جديد. لم تتحرك العربة حتى اتفق عددها مع عدد ما خرج من السلة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دفعوا العربة من النزل إلى الطريق الجنوبي. عند الورشة أمسك تشانغ بعجلتها لئلا تنزلق، وأنزل لين وشياو دو الحديد قطعة قطعة. صفّوه على الأرض، وفصلوا السكك عن القدور والمسامير.\u003c/p>\u003cp>لم يكن يحتاج إلى النظام ليرى أنها مختلفة. السكك المكسورة سميكة وثقيلة وبقي معدنها متماسكاً عند مواضع الكسر. المسامير الملتوية ليّنة، قدور رقيقة بالكاد تحمل. السلسلة صدئة حتى العمق.\u003c/p>\u003cp>قال: «سأفرزها.»\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: سكة محراث قديمة (3 قطع)\u003c/div>\u003cdiv>الخبث: أقل من 3%\u003c/div>\u003cdiv>الكربون: متجانس نسبياً (0.5–0.6%)\u003c/div>\u003cdiv>الحكم: صالحة لإعادة الطرق. أجود من القضبان المسلّمة مؤخراً.\u003c/div>\u003cdiv>الثقة: 80%\u003c/div>\u003cdiv>طاقة التكامل: 90%\u003c/div>\u003c/div>\u003cp>نظر إلى السطر الأخير، وابتسم رغماً عنه. أخيراً وجدوا ما يصلح للمحور من غير انتظار شحنة أخرى.\u003c/p>\u003cp>التفت تشانغ، الذي كان يقف بجانبه ويراقب.\u003c/p>\u003cp>قال: «ما هذا؟»\u003c/p>\u003cp>«السكك القديمة أجود من قضبان تشيان.»\u003c/p>\u003cp>«أعرف.» رفع تشانغ سكة وقلبها. «هذه صنعت من حديد أقدم وأجود.» أشار إلى طرف الكسر. «الصدأ في الخارج، أما هنا فانظر. معدنه متماسك.» ثم التفت إلى كومة الخردة عند الجدار. «وعندي قطع أخرى منها. تركتها لأن أصحابها طلبوا سككاً جديدة.»\u003c/p>\u003cp>تجمع حولهم عدد من أهل القرية ينظرون من خلف السور الواطئ دون أن يدخلوا، فيهم الجزار وزوجته والفلاح العجوز الذي أصلح لين عربته، وصبيان يتدافعون لرؤية الشرر. لم يتكلم أحد، وكلما رفع لين قطعة بدت لهم أنها تعني شيئاً، سمعهم يتهامسون.\u003c/p>\u003cp>أخذ تشانغ ولين يفرزان معاً: السكك للمحور، والمسامير الجيدة للأطواق، أما القدور ففصلوا ما يمكن طرقه منها عما يتكسر ولا يصلح لهذا العمل. لم تكن كل الخردة حديداً يستطيع تشانغ تحويله إلى مسامير.\u003c/p>\u003cp>ثم نظر تشانغ إلى موقده.\u003c/p>\u003cp>كان موقده حفرة مبنية بالحجارة، لها منفاخ جلدي في الخلف يتصل بأنبوب من الفخار. وقد أصلح لين المنفاخ، لكن الموقد نفسه ظل على حاله.\u003c/p>\u003cp>«لا يسخن بما يكفي.» قال تشانغ. «الحديد القديم يحتاج إلى حرارة أعلى ليلتحم.»\u003c/p>\u003cp>قالت شين يان: «دعني أنظر.»\u003c/p>\u003cp>نظر إليها تشانغ، ثم أفسح الطريق دون تعليق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أفسح لها الصبي مكاناً قرب أنبوب الهواء. جلست شين يان على حجر وأخرجت الدفتر، ورسمت ما رأته: الأنبوب، ومكان دخول الهواء، وعمق الحفرة، وشكل الفحم. ثم قامت وأخذت قضيباً رفيعاً من الحديد، ومررته داخل فتحة الأنبوب، وقاست المسافة بين رأسه والفحم المتوهج.\u003c/p>\u003cp>«الهواء يدخل من أعلى.»\u003c/p>\u003cp>«هكذا كان دائماً.»\u003c/p>\u003cp>«ويضيع نصفه.» قالت. «ينتشر في الحفرة بدل أن يتركز على الفحم. ما نحتاجه هو أن يدخل من الجانب، مائلاً إلى أسفل، في اتجاه مركز النار، وليس فوقه.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«فوهة من الطين.»\u003c/p>\u003cp>مشت مع لين إلى النزل، وأحضرا من المخزن دلو الطين المخلوط بالنسبة التي تعلماها بالتجربة: خمسون وخمس وثلاثون وثمانية وسبعة. عادا به إلى الورشة، وجلست شين يان تشكل الفوهة بيديها، أسطوانة صغيرة بثقب ضيق في الوسط، ثم تصنعها ثانية بزاوية مختلفة، وتجففها قرب النار البعيدة.\u003c/p>\u003cp>قالت: «اثنتان. سأجرب الزاويتين.»\u003c/p>\u003cp>صنعت جدار الفوهتين رقيقاً، وأبقتهما بعيدتين عن اللهب حتى جف السطح. كان تشانغ يقلب بين يديه قطعة من الحديد كلما نهض ليتفقدهما، فتمنعه من تركيبهما. وبعد انتظار طويل دفأتهما بالتدريج، ثم ركبت الأولى في فم الأنبوب، ودفعت الفحم بقضيب حديدي، وأومأت لصبي المنفاخ.\u003c/p>\u003cp>«اضغط.»\u003c/p>\u003cp>ضغط الصبي النعسان.\u003c/p>\u003cp>لم يرتفع الصوت. لكن لون النار تغير. من البرتقالي الباهت إلى الأصفر، ثم إلى لون أبيض في قلبها لم يكن لين قد رآه في هذه القرية. اشتد وهج الجمر حتى آلم العينين، فتراجع تشانغ خطوة. وسمع لين من وراء السور صوتاً ينطق بكلمة واحدة، «آه»، ثم صمتاً أكبر. وهمس شياو دو بجانبه: «كأنه شمس صغيرة.»\u003c/p>\u003cp>قالت شين يان، وكأنها تحدث نفسها: «الأولى أضيق مما ينبغي.» أوقفت الصبي وبدلت الفوهة بحذر، مستعينة بخرقة مطوية وقضيب يمسك طرفها. وحين أعادت الهواء اشتد وهج الفحم. قالت: «الثانية أفضل.» ثم التفتت إلى لين. «هل ترى؟ لم أزد الفحم. غيرنا اتجاه الهواء فقط.»\u003c/p>\u003cp>لم يقل لين شيئاً. كان يرى فيها الفتاة التي كانت تأتي لاستعارة الكاوية ولا تعيدها، مائلة فوق رسمها بالقلم نفسه، تنتظر جواب التجربة قبل أن ترفع رأسها.\u003c/p>\u003cp>وضع تشانغ سكة قديمة في النار، وانتظر. وحين أخرجها، كانت بيضاء تقريباً، تتلألأ. ضرب، وتناثرت الشرارات على الأرض الحجرية. ضرب مرة ثانية، ثالثة. طوى القطعة، وعاد.\u003c/p>\u003cp>بعد الطية الخامسة تركه يبرد قليلاً، ثم رفع القطعة المطروقة. استقام سطحها، ولم تعد فيه الشقوق الداكنة التي ظهرت قبل الطرق. قلبها تحت الضوء، يتفقد حافتيها.\u003c/p>\u003cp>حدق فيه.\u003c/p>\u003cp>لم يقل «جيد»، ولا «شكراً». أعاد القضيب إلى الماء، فصدر صفير طويل، وصعدت سحابة من البخار.\u003c/p>\u003cp>ثم قال، دون أن ينظر إلى أحد: «بالأمس كنت أحتاج إلى ساعة لهذه القطعة.»\u003c/p>\u003cp>«وكم احتجت اليوم؟»\u003c/p>\u003cp>«ثلث ساعة.» ثم أضاف بنبرة من يعدد خسائره: «لم يخبرني أحد.»\u003c/p>\u003cp>قالت شين يان: «لم تسألني.»\u003c/p>\u003cp>خفض تشانغ رأسه فوق القطعة، لكن طرف فمه ارتفع قبل أن يعود إلى الطرق.\u003c/p>\u003cp>حتى منتصف العصر، كان قد خرج من تلك النار طوق واحد كامل، وأربعة عشر مسماراً، وعدة قضبان تشبه الذراع. حسبها لين على لوحة التخطيط الخافتة: قطعة بعد قطعة، يوماً بعد يوم، تقترب من الرقم الذي يلزمهم، وتقترب معه من الموعد الذي لا يغيره أحد. لكن الرقم، لأول مرة، بدا ممكناً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وصل تشيان قبيل الغروب.\u003c/p>\u003cp>جاء على بغل أبيض، متدثراً بمعطفه الأسود المصقول، ويتبعه خادمان يحملان صندوقاً خشبياً. توقف أمام الورشة، ونزل بتؤدة، ومسح الغبار عن كمه، وتفحص النار المتوهجة وراء الباب كأنه يتفحص ثروة.\u003c/p>\u003cp>«تشانغ العزيز.» وانحنى. «وصديقنا الذي يصلح الأشياء. والسيدة صاحبة هذه النار.» انحنى لشين يان أيضاً، قليلاً. «ما أجمل أن أرى ورشة تعمل.»\u003c/p>\u003cp>لم يرد أحد.\u003c/p>\u003cp>أضاف وهو يخلع قفازه الجلدي إصبعاً إصبعاً: «وسمعت عن الرقع الطينية. فكرة ممتازة. العملة بلا نحاس.» ضحك بخفة. «لو طبقتموها على نطاق أوسع لصرتم صرافاً صغيراً.»\u003c/p>\u003cp>نظرت شين يان إلى القفاز، ثم إلى الحذاء الجلدي الأسود الذي ينتعله، ولم تقل شيئاً.\u003c/p>\u003cp>دخل تشيان دون دعوة، وأشار للخادمين، ففتحا الصندوق على الطاولة. في داخله ثلاثة قضبان رمادية براقة، نظيفة، مصفوفة على قماش أحمر.\u003c/p>\u003cp>«هذا.» لمس أحدها بإصبع ممتلئ. «حديد من الشمال. نقي كالفضة. من شحنة اخترتها بنفسي؛ ثلاثة قضبان لا تجد مثلها في كل دكان.»\u003c/p>\u003cp>نظر لين، فلم يستدعِ النظام. لكنه رأى بعينيه المجردتين أن القضبان فعلاً أجمل من التي أرسلها.\u003c/p>\u003cp>قال تشيان بحرارة: «هذا هدية.»\u003c/p>\u003cp>«هدية؟»\u003c/p>\u003cp>«نموذج، يا صديقي. لأنني أريد أن أصلح الخطأ الذي وقع. كانت الشحنة الأخيرة بائسة، وأنا آسف.» ابتسم. «ولأنكم تبنون طاحونة، وأنا أريد أن أكون جزءاً من هذا الخير. سأبيعكم كل ما تحتاجونه من حديد بسعر خاص، أقل بالربع من المعتاد.»\u003c/p>\u003cp>سأل لين: «بأي شرط؟»\u003c/p>\u003cp>لم يتحرك وجه التاجر.\u003c/p>\u003cp>«شرط صغير، لا يستحق الذكر.» فتح يديه. «أن تشتروا مني وحدي. كل ما تحتاجه الطاحونة من حديد لثلاث سنوات. وهذا في مصلحتكم، فإن الثقة بين التاجر والعميل...»\u003c/p>\u003cp>«ثلاث سنوات.» قالت شين يان.\u003c/p>\u003cp>«ثلاث، مثل الثلاث التي في بندكم عند ليو.» ابتسم بوضوح هذه المرة، ورأى لين أنه يعرف بالضبط ما في البند. «ثلاث سنوات من العمل، وثلاث سنوات من الحديد بسعر مضمون.»\u003c/p>\u003cp>خيّم الصمت. تذكر لين الحداد الذي يكنس السوق.\u003c/p>\u003cp>ثم قال، بهدوء، وبأدب كامل: «شكراً يا سيد تشيان. لكننا نفضل أن نبقى أحراراً في الشراء. إن احتجنا إلى حديدك، فسنأتي إليك.»\u003c/p>\u003cp>«ومتى؟»\u003c/p>\u003cp>«حين نحتاج.»\u003c/p>\u003cp>«ولن تحتاجوا؟»\u003c/p>\u003cp>«ربما لا.» أشار إلى الموقد المتوهج. «لدينا حديد قديم.»\u003c/p>\u003cp>نظر التاجر إلى الكومة على الأرض، ثم إلى النار البيضاء، ثم إلى تشانغ الذي لم ينظر إليه. وابتسم أكثر.\u003c/p>\u003cp>كانت ابتسامة أوسع من كل ما رآه لين له. وبقي ينتظر، كأنه يترك لهم فرصة أخيرة لتغيير الجواب.\u003c/p>\u003cp>«أفهم.» أغلق الصندوق بنفسه. «أتمنى لكما حظاً سعيداً.»\u003c/p>\u003cp>وانصرف.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مع أول ضوء من الصباح التالي، وصل صبي المنفاخ إلى النزل يطلب لين وشين يان. تركا وعاءيهما على الطاولة وسارا خلفه إلى الورشة. استقبلهما تشانغ بمطرقة في يده، وقادهما حول الجدار إلى الخلف.\u003c/p>\u003cp>قال: «الكلب أيقظني قبل الفجر. خرجت فوجدت هذا.»\u003c/p>\u003cp>كان السياج الخشبي الواطئ مفتوحاً؛ أحد أعواده الأربعة مكسور، والثاني مرمي في الوحل. لمس تشانغ أذنه اليسرى. «لم أسمع أحداً يدخل. هذه لا تسمع جيداً من زمان.» وعلى الأرض آثار أقدام.\u003c/p>\u003cp>لم يكن شيء مسروقاً. لم يلمس أحد النار ولا السندان ولا الحديد المصفوف. حتى القضبان المكسورة في الزاوية بقيت كما هي.\u003c/p>\u003cp>وقفوا ثلاثتهم في الفناء الخلفي، تشانغ بوجه مظلم لا يقرأ، وشين يان تضع يداً على بطنها وتنظر إلى الأرض.\u003c/p>\u003cp>جثا لين. كانت الآثار عميقة وواضحة في الطين الرطب. نعل مستدير، مصقول، ليس نعل قش ولا قماش كما يلبس أهل القرية. نعل جلد.\u003c/p>\u003cp>وعلى أحد أعواد السياج المكسورة، عالقة بمسمار، خصلة صغيرة من شعر ناعم أسود لامع.\u003c/p>\u003cp>لم يلمسها. نظر فقط إلى لمعانها في ضوء الفجر الشاحب.\u003c/p>\u003cp>لم تنتظر شين يان أن يقول أحد شيئاً. أخرجت الدفتر، وجثت بحذر بجانب أقرب أثر، ورسمت النعل كما هو: مستدير الطرف، مربع الكعب، وعليه خطان متوازيان. ثم قاست طول الخطوة بين أثرين بعصا، وكتبت الرقم.\u003c/p>\u003cp>قال لين: «ما الذي تفعلينه؟»\u003c/p>\u003cp>«أسجل.»\u003c/p>\u003cp>«نحن لا نعرف من...»\u003c/p>\u003cp>«لا نحكم.» لم ترفع رأسها. «نسجل. الحكم يأتي حين يكون عندنا ما يكفي.» ثم أشارت إلى العمق. «الأثر عميق، والمسافات منتظمة. يبدو أنه كان يمشي. لا أعرف إن كان يحمل شيئاً.»\u003c/p>\u003cp>قال تشانغ بصوت أجش: «لم يسرق شيئاً.»\u003c/p>\u003cp>«لهذا بالتحديد.» رفعت شين يان رأسها أخيراً، وضمت الدفتر إلى صدرها. «رجل يأتي في الليل ولا يسرق، يريد أن نعرف أنه جاء.»\u003c/p>\u003cp>ثم أضافت بصوت أخفض: «من يلبس نعلاً كهذا في هذه القرية؟»\u003c/p>\u003cp>نظر لين إلى الطريق خلف السياج، ثم إلى تشانغ. ظل الحداد يقبض على المطرقة، ولم يقل اسماً.\u003c/p>"},{"n":13,"t":"الفصل الثالث عشر: الماء البارد","b":"\u003cp>في فجر اليوم الثامن والثلاثين، ظهر الجليد على حافة النهر.\u003c/p>\u003cp>لم تكن طبقته متصلة بعد. رقائق بيضاء رقيقة تتجمع عند الضفة في الظل، تصدر صريراً خفيفاً كلما حركها الماء، وتذوب حين تلمسها الأصابع. لكن العجوز شو، الجالس على صخرته منذ الفجر، لم يلتفت حين وصل لين. قال فقط، وعيناه على الخيط: «أربعون يوماً أو أقل.»\u003c/p>\u003cp>«كم مضى؟»\u003c/p>\u003cp>«ثمانية وعشرون.» ثم: «من أول يوم قلتها.» ونظر لأول مرة إلى لين، نظرة قصيرة. «لا يغرك أنه يذوب الآن. جهزوا الدولاب.»\u003c/p>\u003cp>كان الدولاب مستلقياً على الضفة منذ الأمس.\u003c/p>\u003cp>بلغ قطره ثلاثة أمتار، وعلى إطاره أربع وعشرون ريشة خشبية يدفعها الماء. تفقد لين وصلاتها في الضوء الرمادي. كان يفوح منه عبق البلوط الجديد مع رائحة الزيت التي دهنه بها العجوز يانغ، وحول محوره الخشبي أربعة أطواق حديدية سوداء لامعة، خرجت من نار تشانغ البيضاء.\u003c/p>\u003cp>وقف حوله ثلاثة عشر رجلاً. والرابع عشر، الذي كان يشتكي من بطنه، لم يعد يأتي.\u003c/p>\u003cp>وصل تشانغ متأخراً عن الجميع، يمشي بخطواته الثقيلة، وعلى كتفه كيس من الخيش فيه ما صنعه في الليل: المسامير الأخيرة وقطعتا الإطار الحديديتان. لم يحيّ أحداً. وضع الكيس على الصخرة المسطحة بجانب شين يان، ثم وقف أمام الدولاب مدة طويلة، ويداه خلف ظهره، يحدق في الأطواق السوداء التي صنعها.\u003c/p>\u003cp>قالت شين يان: «ما رأيك؟»\u003c/p>\u003cp>لم يرد. دار حول الدولاب مرة، وأمسك أحد الأطواق، وهزه. ثم قال: «طرف المحور الأيمن أنا من طرقته.» وأضاف بعد صمت: «في الليلة الأخيرة، تحت ضوء ضعيف. إن كان فيه عيب فهو عيبي.»\u003c/p>\u003cp>«لم يقل أحد إن فيه عيباً.»\u003c/p>\u003cp>«سيقول.» نظر إلى الماء. «الماء يقول دائماً.»\u003c/p>\u003cp>قال لين: «ثلاثة على كل حبل. وثلاثة على الرافعة. وواحد يراقب المحور.»\u003c/p>\u003cp>قال لاو دونغ: «من يراقب؟»\u003c/p>\u003cp>«أنا.»\u003c/p>\u003cp>«ستكون في الماء إذن.»\u003c/p>\u003cp>«سأكون في الماء.»\u003c/p>\u003cp>تفقد لين العقدة حول خصره، وشد طرف الحبل ليتأكد من ثباته. كان عليه أن ينزل؛ عرف موضع القطع التي ركبوها، وكيف تفك وتثبت. لكنه لن يعمل وحده. أشار إلى لاو دونغ ليمسك الحبل من الضفة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق رفع الدولاب أربع ساعات.\u003c/p>\u003cp>استخدموا مثلثاً من جذوع البلوط، وحبالاً من القنب مبللة، وبكرة خشبية صنعها العجوز يانغ في يومين. كان كل حبل يئنّ، وكل جذع يصر، والرجال يتنفسون ببخار أبيض يتصاعد من أفواههم. في الساعة الثالثة انزلق أحد الحبال.\u003c/p>\u003cp>لم يكن حبلاً مقطوعاً، بل عقدة تفككت من البلل. هبط الجانب الأيسر من الدولاب فجأة شبراً كاملاً، وصرخ الجميع، وتأرجح المثلث الخشبي فوقهم. رأى لين الحبل ينزلق عبر يدي تشيو، الشاب النحيل، الذي حاول أن يقبض عليه فاحترق جلد راحتيه. كاد يتركه.\u003c/p>\u003cp>لم يتركه.\u003c/p>\u003cp>قفز لاو دونغ، عريض الجذع، من مكانه، وأمسك بالحبل خلف تشيو، وجذب بكل وزنه. لم يتبادلا كلمة. لكن لين رأى كتفيهما ملتصقتين وهما يشدان معاً، كل منهما يثبت قدميه في الطين، حتى استقر الدولاب واستقام.\u003c/p>\u003cp>ثبتوا الدولاب بحبل ثان قبل أن يترك الرجلان موضعيهما. بسط تشيو راحته، فظهر خط أحمر عند قاعدة أصابعه. ناوله شياو دو خرقة نظيفة، ولفها الشاب حول يده ثم قبض عليها ليختبرها.\u003c/p>\u003cp>قال لاو دونغ بعد أن أعاد العقدة: «لا تكرر هذا.»\u003c/p>\u003cp>«أنت من ربط العقدة!»\u003c/p>\u003cp>«وأنت من أمسكها.» وضرب ظهر تشيو ضربة قصيرة.\u003c/p>\u003cp>نظر لين إلى الراحتين الملفوفتين. «إذا انفلت الحبل، ابتعد عنه. سنصنع خشباً آخر، لكن يدك لا يعوضها أحد.»\u003c/p>\u003cp>هز تشيو رأسه، ثم أخذ موضعاً أبعد عند الطرف الحر. أعاد لاو دونغ فحص العقدة بنفسه، وجذبها مرتين قبل أن يعطي إشارة الرفع.\u003c/p>\u003cp>وحين ارتفع الدولاب عن الأرض أخيراً، متأرجحاً، ثقيلاً، رأى لين شياو دو يضع يديه على فمه، ويحبس صياح الفرح حتى يستقر الحمل.\u003c/p>\u003cp>أنزلوه على الأعمدة الحجرية التي بنوها على جانبي المجرى، في تجويفين مبطنين بخشب الزان الصلب، يحملان طرفي المحور ويسمحان له بالدوران.\u003c/p>\u003cp>قال العجوز يانغ: «اتركوه.»\u003c/p>\u003cp>تراجع الرجال خطوة، ثم خطوتين.\u003c/p>\u003cp>استقر الدولاب فوق الماء، ريشاته الدنيا تلامس سطح الجدول، وقطرات تنزلق من حوافها.\u003c/p>\u003cp>قالت شين يان، من مكانها على الصخرة: «افتحوا الحاجز.»\u003c/p>\u003cp>سحب رجلان لوحاً خشبياً من فتحة الحاجز الحجري. اندفع الماء.\u003c/p>\u003cp>ببطء في البداية، ثم أسرع، تمدد الماء في المجرى الضيق الذي نظفوه، وضرب الريشة الأولى. ارتجف الدولاب. ثم تحرك، نصف دورة، ثم دورة كاملة.\u003c/p>\u003cp>صاح شياو دو. وصاح لاو دونغ. وضحك أحدهم بصوت عالٍ، وأخذ الرجال يصفقون.\u003c/p>\u003cp>ثم سمع لين الصوت.\u003c/p>\u003cp>لم يكن عالياً. كان خفيفاً، مزعجاً، على إيقاع الدوران: طق. طق. طق. صوت خشب يصطدم بشيء مع كل دورة.\u003c/p>\u003cp>توقف الجميع عن الضحك.\u003c/p>\u003cp>اهتز الدولاب. اهتزازة صغيرة في البداية، ثم أكبر، وبدأ الماء يتطاير بشكل غير متساوٍ. أمسك لين بالحبل الذي يربط أحد جوانب الإطار، فشعر بالرعشة تنتقل من الخشب إلى عظامه.\u003c/p>\u003cp>صاح: «أوقفوه!»\u003c/p>\u003cp>أغلق الرجال الحاجز. تباطأ الدولاب، وتمايل، ثم وقف.\u003c/p>\u003cp>كان الصمت أسوأ من الصوت.\u003c/p>\u003cp>اقترب العجوز يانغ ببطء، ومرر كفه على إطار الدولاب، ثم على ريشة، ثم على أخرى، يضرب كل واحدة بظهر إصبعه ويصغي إلى رنينها.\u003c/p>\u003cp>«الخشب سليم.»\u003c/p>\u003cp>لم يعلق أحد.\u003c/p>\u003cp>«لا يوجد شق ولا وصلة مخلوعة. الخشب الذي صنعناه يحمل.» رفع عينيه الصغيرتين نحو المحور، وإلى الرجل الواقف عنده، تشانغ. «ما يهتز ليس الخشب.»\u003c/p>\u003cp>وقف تشانغ ساكناً. لم يقل لا ولم يقل نعم. لكن لين رأى فكه يتحرك مرة واحدة، كمن يطحن شيئاً بين أسنانه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ركز لين على المحور.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: محور دولاب مائي مركب\u003c/div>\u003cdiv>الاعوجاج: الطرف المعدني الأيمن منحرف عن محور الخشب بنحو 4 ملم. حامل المحور الأيمن أعلى من الأيسر بنحو 3 سم.\u003c/div>\u003cdiv>الاهتزاز يتوقع أن يزداد تحت الحمل\u003c/div>\u003cdiv>الثقة: 69%\u003c/div>\u003cdiv>ملاحظة: القياسات في الماء الجاري غير دقيقة. التحليل لا يحدد أي العيبين أكبر أثراً.\u003c/div>\u003cdiv>طاقة التكامل: 82%\u003c/div>\u003c/div>\u003cp>قرأ التقرير لشين يان بلغتهما، ثم أشار أمام الرجال إلى موضع استناد المحور: «هذا هو المحمل. إن ارتفع أحد الطرفين أكثر من الآخر مال الدولاب كله. أما الحديد المعوج فيدفعه إلى الجانب مرة في كل دورة.»\u003c/p>\u003cp>«إذن عيبان.» قالت شين يان. «ولا يعرف أيهما الأسوأ.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«وإن عدّلنا الخطأ، فربما نزيد الآخر.»\u003c/p>\u003cp>«ربما.»\u003c/p>\u003cp>«سأقيس بنفسي.»\u003c/p>\u003cp>نظر لين إلى المسافة بين قدميها وحافة الصخرة.\u003c/p>\u003cp>«أنا من سيقيس.»\u003c/p>\u003cp>«لا يمكنك أن تقيس وتعدّل في الوقت نفسه. أنت في الماء. من يراقب من الضفة هو من يرى المحور من الجانب.»\u003c/p>\u003cp>«وأنا أقول لك أن تراقبي من الضفة.»\u003c/p>\u003cp>«من هنا لا أرى قاعدة المحمل، الخشبة التي يستند إليها المحور. الماء يغطي أسفلها.» أخرجت من جيبها خيطاً معقوداً في طرفه حجر صغير، وهزته. «أحتاج أن أنزل حتى الصخرة الثانية. هناك أرى الخط.»\u003c/p>\u003cp>«الصخرة الثانية في الماء.»\u003c/p>\u003cp>«حتى كاحلي فقط.»\u003c/p>\u003cp>«الماء يتجمد.»\u003c/p>\u003cp>«حتى كاحلي يا لين.»\u003c/p>\u003cp>تقدم خطوة. كان قد قرر أن لا يرفع صوته، لكنه سمع نفسه يقولها:\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>وكان الصمت حولهما. ثلاثة عشر رجلاً يتظاهرون أنهم يفحصون الحبال.\u003c/p>\u003cp>قالت شين يان بصوت منخفض جداً، بلغتهما: «لا تقل لي لا أمام هؤلاء.»\u003c/p>\u003cp>«وماذا أقول؟»\u003c/p>\u003cp>«تقول لي ما تخشاه.»\u003c/p>\u003cp>«أخشى أن تسقطي.»\u003c/p>\u003cp>«أخشى أنا أن أبقى جالسة على صخرة بينما زوجي يتجمد.»\u003c/p>\u003cp>خفض لين عينيه إلى الخيط في يدها.\u003c/p>\u003cp>«هذا ليس نفس الشيء.»\u003c/p>\u003cp>«بل هو.» لم تتحرك. كانت واقفة هناك، يدها على بطنها، وجهها شاحب من البرد، وعيناها حادتان. «أنت لا تثق بأنني أعرف حدودي. وأنا لا أثق بأنك تعرف حدودك. وكلانا يكذب.»\u003c/p>\u003cp>سكت.\u003c/p>\u003cp>قالت: «إذن حل وسط. أبقى على الضفة. لكن تسمعني.»\u003c/p>\u003cp>«أسمعك؟»\u003c/p>\u003cp>«أعطيك القياسات وأنت تعدل. وإذا تغير الصوت تخبرني فوراً. لا نجرب خطوتين معاً.»\u003c/p>\u003cp>نظر إليها طويلاً.\u003c/p>\u003cp>«موافق.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>نزل لين إلى الماء.\u003c/p>\u003cp>كان أبرد مما تخيل. حين لامست قدماه السطح، انقبضت عضلاته كلها، وحبس نفساً دون أن يقرر. كان الماء يصل إلى فخذيه بعد خطوتين، وإلى خصره بعد خمس، وبعد ذلك لم يعد يحس بجلده.\u003c/p>\u003cp>كانت التيارات تدفعه عند ركبتيه. تذكر، لا يدري لماذا، المسابح الجامعية والمكيف في المختبر وكوب الشاي البارد على الطاولة، وظن لحظة أنه لن يشعر بدفء مرة أخرى. شد لاو دونغ حبل الأمان من الضفة، فنظر إليه لين وأومأ. وضع يده على المحور وانحنى. قال بأسنان تصطك: «حاضر.»\u003c/p>\u003cp>صاحت شين يان من الضفة، صوتها يصل واضحاً فوق صوت الماء:\u003c/p>\u003cp>«أخفض المحمل الأيمن. إصبعان!»\u003c/p>\u003cp>طلب من الرجال أن يحملوا طرف المحور بالرافعة. وحين خف الضغط على الحامل، سحب الوتد وأنزله بحذر، ثم أعاد تثبيته قبل أن يرخوا الحبل. ارتجفت يداه من الصقيع، فأخطأ في الضغط على الوتد، وكاد ينزلق من يده.\u003c/p>\u003cp>«الآن حرك الدولاب!»\u003c/p>\u003cp>دفعه لاو دونغ من الطرف الآخر. دار الدولاب نصف دورة.\u003c/p>\u003cp>طق.\u003c/p>\u003cp>«لا زال.»\u003c/p>\u003cp>«أخفض إصبعاً آخر!»\u003c/p>\u003cp>فعل. شعر بقدميه تتخدران. حاول قبض أصابعه حول الوتد، فلم تطاوعه إلا بعد أن حركها مرتين.\u003c/p>\u003cp>«الآن!»\u003c/p>\u003cp>دار.\u003c/p>\u003cp>طق. طق.\u003c/p>\u003cp>«أسوأ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أسوأ يا يان. صار الصوت أسوأ.»\u003c/p>\u003cp>سكتت. ثم سمع صوتها، منخفضاً هذه المرة، وفيه ارتباك:\u003c/p>\u003cp>«أخطأت. أخفضت أكثر مما يجب. ارفعه إصبعاً.»\u003c/p>\u003cp>كان عليها أن تقول ذلك، وعرف لين كم كلفها. رفع المحمل. أعاده إصبعاً إلى أعلى، فبقي أخفض من موضعه الأول بإصبعين.\u003c/p>\u003cp>«الآن.»\u003c/p>\u003cp>دار الدولاب. دار مرة، مرتين، ثلاثاً.\u003c/p>\u003cp>صوت الخشب ما زال هناك، لكنه أخف. تغير الإيقاع.\u003c/p>\u003cp>«الأيسر.» صاحت. «ارفع الأيسر إصبعاً.»\u003c/p>\u003cp>اتجه إلى الجهة الأخرى، والماء يضغط على ساقيه. أسنانه تصطك بشدة، وركبتاه ترتجفان، ولم يعد يشعر بما تحت خصره. وضع كفيه على الوتد الأيسر، ورفع.\u003c/p>\u003cp>«الآن!»\u003c/p>\u003cp>دار الدولاب.\u003c/p>\u003cp>لم يصدر صوتاً.\u003c/p>\u003cp>لا طق. لا اهتزاز. فقط همس الماء على الريشات، وصرير الخشب الناعم. دار الدولاب دورة كاملة، وثانية، وثالثة، من دون أن يتمايل.\u003c/p>\u003cp>قال لين، بصوت لم يعرفه: «يان.»\u003c/p>\u003cp>«أنا أرى.»\u003c/p>\u003cp>«لا صوت.»\u003c/p>\u003cp>«أرى. أرى.» كان في صوتها اهتزاز لا علاقة له بالبرد.\u003c/p>\u003cp>وصاح شياو دو، وصاح الرجال، وبدأ شخص ما يضرب الأرض بقدمه.\u003c/p>\u003cp>لكن المحور الأيمن لم يثبت تماماً. مع كل دورة، ارتجف طرفه ارتجافة دقيقة، بالكاد تُرى في انعكاس الضوء. ما زال منحنياً بضعة ملّيمترات؛ والإصلاح لم ينتهِ.\u003c/p>\u003cp>اقترب بحذر. وضع إصبعه على الحديد.\u003c/p>\u003cp>كان بارداً حد الألم.\u003c/p>\u003cp>وشعر تحته باهتزاز قصير يتكرر عند الموضع نفسه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرج من الماء بمساعدة رجلين.\u003c/p>\u003cp>لم يشعر بساقيه. سقط على الضفة، فغطاه أحدهم بمعطف قديم، ورفع آخر وعاء ماء ساخناً أحضره شياو دو من النزل مسرعاً. ارتجف لين بعنف، أسنانه تصطك كحجارة في كيس، وأنفاسه تخرج بيضاء متقطعة.\u003c/p>\u003cp>وجدته شين يان.\u003c/p>\u003cp>جثت إلى جواره، بحذر، ويدها على بطنها، ثم نزعت قفازها الصوفي الذي أعارته إياها هو سانيانغ، وأمسكت أصابعه بكفيها الدافئتين. كانت تشد عليها بقوة غريبة.\u003c/p>\u003cp>قالت: «أخطأت في الخفض الأول.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«كلفك ذلك خمس دقائق في الماء.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لا تقل أعرف.» كان صوتها يرتجف. «قل ما تفكر فيه.»\u003c/p>\u003cp>حدق فيها. كانت عيناها حمراوين، وليس من البرد.\u003c/p>\u003cp>قال، بصعوبة: «فكرت أن علينا أن نتوقف إذا لم يتحسن الصوت. ثم صححتِ القياس قبل أن أطلب. كنت أحتاج أن أسمعك تقولين إنك أخطأتِ.»\u003c/p>\u003cp>أغمضت عينيها لحظة.\u003c/p>\u003cp>ثم سألت بنبرة مختلفة: «والمحور الأيمن؟»\u003c/p>\u003cp>لم يكذب عليها. «ما زال فيه شيء. ربما الاعوجاج. ربما لا. لا أعرف.»\u003c/p>\u003cp>«لكن الدولاب يدور.»\u003c/p>\u003cp>«الدولاب يدور. لكن المحور الأيمن فيه رعشة صغيرة. إن تركناه، سيتعب بعد أسبوع، ربما شهر. ويمكن أن يعدله مبرد تشانغ الليلة.»\u003c/p>\u003cp>«وماذا يقول النظام؟»\u003c/p>\u003cp>نظر إلى السطر في زاوية عينه. كان قد تغير بصمت أثناء وجوده في الماء:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — قيد التنفيذ]\u003c/strong>\u003c/div>\u003cdiv>أول أصل منتج: شغّل الطاحونة قبل تجمد النهر\u003c/div>\u003cdiv>المتبقي: تركيب الحجر وربطه بالمحور، وتثبيت المحمل الأيمن. تقدير: يوم واحد\u003c/div>\u003cdiv>الاحتمال: متوسط، ويتحسن إذا عُدّل المحور الأيمن\u003c/div>\u003c/div>\u003cp>قرأ لها ما بقي، ثم أسند رأسه إلى المعطف المطوي خلفه.\u003c/p>\u003cp>قالت: «إذن غداً.»\u003c/p>\u003cp>«غداً.»\u003c/p>\u003cp>ظلت ماسكة بيديه. ثم قالت بصوت لا يسمعه غيره، بلغتهما: «في المرة القادمة التي أقول لك فيها حلاً وأكون مخطئة، لا تتبعني بعمى.»\u003c/p>\u003cp>«كان يجب أن أقول إن قدمي لم تعودا تحملانني جيداً.»\u003c/p>\u003cp>«قلها في المرة القادمة.» ضغطت أصابعه. «القياس ينتظر. أنت لا.»\u003c/p>\u003cp>جاءت هو سانيانغ في تلك اللحظة تجري بخطوات قصيرة، وعلى ذراعها وعاء ملفوف بخرقة، ترك أثراً من بخار في الهواء. لم تقل شيئاً. جلست بجانبه، وأمسكت الوعاء بين كفيه، وقالت وهي تنظر إلى الدولاب لا إليه: «اشرب. فإن مات الدولاب، لا بأس. أما إن مت أنت فأنا التي ستدفع للحداد.»\u003c/p>\u003cp>شرب. كان مرقاً ساخناً بالزنجبيل والبصل، وطعمه أفضل شيء ذاقه منذ جاء.\u003c/p>\u003cp>كان الدولاب يدور خلفهم، ببطء، يلمع الماء على ريشاته بلون الرصاص، وكان الجليد يتكاثر على الحافة.\u003c/p>"},{"n":14,"t":"الفصل الرابع عشر: الحجر الأول يدور","b":"\u003cp>في فجر اليوم التاسع والثلاثين، خرج الرجال إلى الطاحونة وأنفاسهم تتصاعد بيضاء. علق الصقيع بأهداب لين قبل أن يبلغ الضفة.\u003c/p>\u003cp>لم ينم لين تلك الليلة أكثر من ساعتين.\u003c/p>\u003cp>استيقظ مرتين على صوت لا وجود له، صوت دولاب يتعثر في حلمه، وفي كل مرة وجد شين يان نائمة بجانبه، ويدها على بطنها، وأنفاسها هادئة. وفي المرة الثالثة وجدها مستيقظة، تنظر إلى السقف المنخفض بعينين مفتوحتين.\u003c/p>\u003cp>«لم تنامي؟»\u003c/p>\u003cp>«نمت.» لم تتحرك. «ثم استيقظت لأنني فكرت في الأرامل.»\u003c/p>\u003cp>«ماذا فكرت؟»\u003c/p>\u003cp>«نطحن الكيس الأول للأرامل، بلا أجر. هن أولى به.»\u003c/p>\u003cp>نظر إلى يديها المتشابكتين فوق بطنها، ثم أومأ. أمسك يدها، وبقيا هكذا حتى سمعا الديك الأول.\u003c/p>\u003cp>كان تشانغ قد أمضى الليل كله في ورشته على ضوء مصباح زيت، يبرد بمبرد غليظ طرف المحور الأيمن، ملّيمتراً بعد آخر، يتوقف كل بضع دقائق ويضع عليه عوداً مستقيماً، ثم يعود. جاء قرب الفجر يحمل المحور تحت إبطه ملفوفاً بقطعة من الخيش، وعيناه حمراوان، ويداه ترتجفان من التعب. لم يقل شيئاً. وضعه في يد لين، وأشار نحو الماء بذقنه.\u003c/p>\u003cp>وكان هذا هو الاعتذار الوحيد الذي سمعه لين منه، ولم يكن يحتاج إلى غيره.\u003c/p>\u003cp>ركّبوا المحور قبل الضوء. ثم ربطوا الحجر.\u003c/p>\u003cp>كان الحجر العلوي معلقاً بسلسلة فوق الحجر السفلي، وقد أُنزل بحذر شديد على ارتفاع قبضة واحدة، والعجوز يانغ يصيح بأوامر قصيرة، ويدا لاو دونغ وتشيو تمسكان الرافعة المصنوعة من جذع بلوط. حين لامس الحجران بعضهما، أصدرا طقة مكتومة، فتوقفت الأيدي عن الدفع.\u003c/p>\u003cp>قالت شين يان: «ارفعوه شعرة.»\u003c/p>\u003cp>«شعرة؟»\u003c/p>\u003cp>«أقل مما تتخيل.» جثت على ركبة واحدة بجانب الحجرين، وأخرجت ورقة صفراء رقيقة من جيبها، قطعتها من صفحة قديمة في كتاب الحسابات. «ارفعوا حتى تدخل الورقة بينهما، وتخرج إذا سحبتها بإصبعين.»\u003c/p>\u003cp>ضحك شياو دو، فرمقته شين يان بنظرة.\u003c/p>\u003cp>دخلت الورقة. سحبتها بإصبعين. خرجت، وفيها أثر دقيق من الغبار الرمادي.\u003c/p>\u003cp>«هكذا.»\u003c/p>\u003cp>ثبّتوا حامل الحجر عند هذا الارتفاع، ثم أرخوا حبل الرافعة ليتأكدوا أن المسافة لم تتغير.\u003c/p>\u003cp>كان تشانغ قد حفر في وجه الحجرين، في الأيام الماضية، أخاديد رفيعة تمتد من الوسط إلى الأطراف بإزميل صلّبه بنفسه، تتفرع عند أطرافها ليمر فيها الدقيق. لم يطلب منه أحد ذلك، ولم يخبر لين بالأمر. وحين رأى لين الأخاديد أول مرة سأله: «من علّمك؟» فقال: «جياو. أتيت إلى هنا وأنا صبي أحمل له الإزميل.»\u003c/p>\u003cp>مسح تشانغ الغبار عن أحد الأخاديد، وأخرج شظية صغيرة بقيت عند حافته. أمسكها لين بين إصبعيه، ثم كنس وجه الحجر قبل أن يعيدوا إنزاله. بقي الحداد يراقب حتى ابتعد الجميع عن الحجر.\u003c/p>\u003cp>ولم يزد.\u003c/p>\u003cp>كانت الأخاديد تساعد الحجرين على الطحن: تدفع الحبوب إلى الخارج وتسحب الدقيق، فلا يحترق ولا ينسد. وأدرك لين، وهو ينظر إليها، أن ما عرفه تشانغ صبياً هو الذي أكمل عملهم الآن. لم تكن رسمة الدولاب وحدها تكفي.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند أول ضوء، كان القرويون قد تجمعوا.\u003c/p>\u003cp>لم يدعُهم أحد. كان أهل القرية يمرون على الطريق المحاذي للنهر منذ أسبوعين، ثم يتوقفون، ثم يتقدمون، ثم يتراجعون. لكنهم هذا الصباح جاؤوا قبل أن يدور الحجر: رجال بمعاطف مبطنة ونساء يحملن أطفالاً ملفوفين في شالات، وزوجة الجزار، والفلاح العجوز الذي أصلح لين عربته، وامرأة القدر المثقوب بين صفين من النساء، وفي يدها الرقعة الطينية.\u003c/p>\u003cp>وقف شياو دو على حجر مرتفع. كان وجهه محمراً من الحماس، وأذناه البارزتان بلون الشفق.\u003c/p>\u003cp>«أيها الناس!» صاح. «هذا الدولاب! ذاك الحجر! وهذا الماء!» أشار إلى كل شيء بذراع مفتوحة. «الماء يدفع الدولاب، والدولاب يدير المحور، والمحور يدير الحجر، والحجر يطحن الدخن!»\u003c/p>\u003cp>قال أحدهم: «نعرف كيف تعمل الطاحونة يا ولد.»\u003c/p>\u003cp>«أنت تعرف طاحونة ليو. هذه ليست كطاحونة ليو.» وضع يديه على خصره بجدية مضحكة. «هذه بنت جياو. والذي أعاد بناءها نازحان لا يعرفان كيف يتكلمان!»\u003c/p>\u003cp>ضحك الناس. ثم انحنى الصبي بمبالغة وبدأ يقلد، بنبرة غليظة ممدودة، لهجة لين بالضبط: «\"مسافران... ضللنا الطريق!\"»\u003c/p>\u003cp>وانفجر الناس ضحكاً، ورأى لين أنه يضحك هو أيضاً. لم يكن الصبي يسخر هذه المرة. كان يشير إلى لين ويبتسم، منتظراً أن يضحك معه.\u003c/p>\u003cp>نظر إليه شياو دو بعد أن هدأ الضحك، وقال بصوت أخف: «لكنه أصلح مدخنة العمة.»\u003c/p>\u003cp>سكت الناس.\u003c/p>\u003cp>«وأصلح عجلة عربتي.» قال الفلاح العجوز من الخلف.\u003c/p>\u003cp>وقالت امرأة: «وقدري المثقوب صار حديده في هذه الطاحونة.» رفعت رقعتها وسكتت.\u003c/p>\u003cp>لم يعرف لين ماذا يفعل بوجهه. نظر إلى الماء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فتح العجوز يانغ الحاجز.\u003c/p>\u003cp>لم يقل أحد شيئاً. ارتفع الماء ببطء في المجرى، بلون رمادي مسود، وضرب الريشة الأولى. وارتجف الدولاب، ثم تحرك.\u003c/p>\u003cp>دار نصف دورة. دورة. ثانية.\u003c/p>\u003cp>كان صوته ناعماً، لا طق ولا اهتزاز، همس الخشب في الماء، وصرير خفيف من المحور لا يقلق. وفي الداخل، في الغرفة الحجرية الصغيرة التي بناها لاو دونغ وتشيو وثلاثة آخرون في الأسبوع الأخير، دار الحجر العلوي ببطء فوق الحجر السفلي.\u003c/p>\u003cp>ثم سمع الناس الصوت الذي لم يسمعوه منذ خمس سنوات في هذا المكان: خشخشة الحجرين، منتظمة وعميقة، تعلو على خرير الماء.\u003c/p>\u003cp>نادت شين يان بصوت جاد: «الحبوب.»\u003c/p>\u003cp>كان شياو دو قد أعد الكيس. فتحه بيدين مرتجفتين وسكب أول حفنة من الدخن في الفتحة الخشبية فوق الحجر العلوي. اختفت بين الحجرين. ثم، من الجانب، من القناة الخشبية الصغيرة التي صنعها العجوز يانغ، انساب شيء ناعم ضارب إلى الأصفر، كالرمل الرطب.\u003c/p>\u003cp>دقيق.\u003c/p>\u003cp>مدت شين يان يدها تحت القناة وأمسكت حفنة، وقربتها من وجهها. فركتها بين إصبعيها. «خشن.»\u003c/p>\u003cp>«أخفضي الحجر قليلاً.»\u003c/p>\u003cp>أمرت العجوز يانغ، فحرك الرافعة بالقدر الذي قالته. ثم حفنة ثانية.\u003c/p>\u003cp>«ناعم.»\u003c/p>\u003cp>أومأت. ثم نظرت حولها إلى القرويين الصامتين، وإلى النساء اللواتي كن يطحنّ الدخن بأيديهن في الظلام منذ طفولتهن، وإلى لين.\u003c/p>\u003cp>قالت بصوت واضح: «أول ما نطحنه اليوم للأرامل، مجاناً.»\u003c/p>\u003cp>لم يفهم أحد.\u003c/p>\u003cp>«لثلاث نساء.» كانت قد حسبت الأمر ليلاً، وعرف لين ذلك من هدوئها. «الأرامل. اللواتي لا رجل لهن في القرية يطحن ويحمل. أول دقيق من هذه الطاحونة لهن.»\u003c/p>\u003cp>تقدمت امرأة عجوز نحيلة، ثم أخرى، ثم الثالثة، من بين الجمع. إحداهن هي صاحبة القدر المثقوب. حملت كل واحدة كيسها، ووضعته عند الفتحة، وصبّ شياو دو الدخن، ودار الحجر، وخرج الدقيق، وملأ الأكياس الثلاثة واحداً بعد آخر.\u003c/p>\u003cp>لم يقل أحد شيئاً. لكن لين رأى أصابع العجوز الأولى ترتجف وهي تغلق الكيس. رآها تضعه على صدرها، كما وضعت الرقعة، ثم تنظر إلى شين يان.\u003c/p>\u003cp>قالت بصوت مبحوح: «الرحى اليدوية كانت تأخذ مني الصباح كله.»\u003c/p>\u003cp>«الآن تأخذ منك نصف ساعة.»\u003c/p>\u003cp>«وماذا أفعل ببقية الصباح؟»\u003c/p>\u003cp>ابتسمت شين يان. «تنامين.»\u003c/p>\u003cp>ضحكت المرأة، ضحكة قصيرة مكسورة، ثم مسحت عينيها بكمها بسرعة.\u003c/p>\u003cp>شقّت هو سانيانغ طريقها بين الواقفين حتى وصلت إلى الحجر. تأملت الدولاب وهو يدور، ثم الدقيق المتجمع عند القناة، وأخيراً الكيس الذي ضمّته العجوز إلى صدرها.\u003c/p>\u003cp>«مجاناً؟»\u003c/p>\u003cp>«أكياسهن اليوم فقط.» قالت شين يان.\u003c/p>\u003cp>«اليوم فقط.» كررتها هو سانيانغ وهي تنظر إلى الأكياس الثلاثة. ثم فتحت كتابها الأصفر، وأخذت قطعة الفحم، وكتبت سطراً. «وأنا لا أكتب إلا الذي يدفع.»\u003c/p>\u003cp>«وما كتبتِ؟»\u003c/p>\u003cp>«كتبت أن كيساً مجانياً أول يوم يشتري سمعة سنة كاملة.» أغلقت الكتاب. «هذا ما كان يقوله زوجي. لم أصدقه قط. والآن...» نظرت إلى الطحين. «ربما أصدقه.»\u003c/p>\u003cp>ولاحظ لين أن عينيها لم تكونا على الدقيق، بل على القرويين الذين يتبادلون النظرات، ويهمسون باسم الطاحونة، «طاحونة جياو»، كأنه اسم عاد من الموت.\u003c/p>\u003cp>وبعد الأرامل، تقدمت زوجة الجزار بكيس دخن ثقيل على كتفها، وضعته عند الفتحة دون كلمة. طحن شياو دو. وحين امتلأ كيسها بالدقيق، أخرجت شين يان ميزانها الخشبي، وعزلت جزءاً من عشرين، وصبته في وعاء جانبي.\u003c/p>\u003cp>سألت الزوجة: «أهذا أجركم؟»\u003c/p>\u003cp>«هذا أجر الطاحونة.»\u003c/p>\u003cp>«عند ليو يأخذون واحداً من عشرة.»\u003c/p>\u003cp>«وهنا واحد من عشرين.» قالت شين يان. «وبالميزان أمامك.»\u003c/p>\u003cp>نظرت المرأة إلى الميزان الذي يتأرجح أمامها، العصا الطويلة والكفتان والحصى. لم تفهم الحصى، لكنها فهمت أن العين ترى ما تأخذه. أومأت، وحملت كيسها، ومضت وهي تحدث جارتها بصوت لم يعد همساً.\u003c/p>\u003cp>كان هذا أول أجر. رفع لين الوعاء عن الأرض ووضعه فوق رف جاف، بعيداً عن أكياس الزبائن. سأله شياو دو إن كان يكفي لخبز المساء. نظر إلى القاع المغطى بالدقيق وقال: «إذا خلطناه بما عند العمة.» ثم أعاده إلى مكانه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>انتظر لين.\u003c/p>\u003cp>كان يعرف ما سيحدث، فقد قرأ العبارة قبل شهر. لكن حين ظهرت الحروف الزرقاء في زاوية عينه، شعر بشيء يتقلب في صدره.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — مكتمل]\u003c/strong>\u003c/div>\u003cdiv>أول أصل منتج: شغّل الطاحونة قبل تجمد النهر ✓\u003c/div>\u003cdiv>المكافأة: التخطيط الصناعي — المستوى 1 (مفتوح)\u003c/div>\u003cdiv>مؤشر الحضارة: +3 (أصل منتج، وعمل جماعي، وتحسين معيشة)\u003c/div>\u003cdiv>\u003cstrong>التكامل: 4%\u003c/strong>\u003c/div>\u003c/div>\u003cp>وبعد لحظة:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخطيط الصناعي — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>يمكنك الآن تخطيط سلسلة إنتاج من ثلاث مراحل، مع تقدير للمدخلات والمخرجات والوقت.\u003c/div>\u003cdiv>لا يشمل تحليل الاختناقات. لا يحل محل القياس الميداني.\u003c/div>\u003c/div>\u003cp>قرأ السطر الأخير مرتين. ابتسم. ستساعده الأداة في ترتيب العمل وحساب ما يحتاجه، لكنها لا تعرف أين يتعطل حتى يراه بنفسه. نظر إلى قطعة الحديد التي تعب فيها تشانغ ليلة كاملة. لن تختصر تلك الليلة رسمة على اللوحة.\u003c/p>\u003cp>جرب الأداة الجديدة فوراً، لأنه لم يستطع مقاومة ذلك. فتح اللوحة البيضاء، وكتب فيها كلمة «طحن»، ثم أضاف الخطوات: حبوب إلى الطاحونة، ومن الطاحونة إلى دقيق، ومن الدقيق إلى النزل. وأدخل الأرقام التي رآها.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تخطيط صناعي — أولي]\u003c/strong>\u003c/div>\u003cdiv>الإنتاجية التقديرية للحجر الواحد: حوالي 10 أكياس في اليوم\u003c/div>\u003cdiv>أجر الطحن (جزء من عشرين): حوالي نصف كيس في اليوم\u003c/div>\u003cdiv>الثقة: 61%\u003c/div>\u003cdiv>ملاحظة: بيانات ناقصة عن حجم الطلب في الشتاء.\u003c/div>\u003c/div>\u003cp>نصف كيس في اليوم. كان يعرف أنه ليس كثيراً. لكنه كان رقماً لم يكن قبل أسبوع، ورقماً يتكرر كل يوم.\u003c/p>\u003cp>قالت شين يان، دون أن تلتفت: «ما الذي تقوله؟»\u003c/p>\u003cp>«مكتمل.»\u003c/p>\u003cp>«كلها؟»\u003c/p>\u003cp>«كلها. الأصل المنتج. والتكامل صار أربعة.»\u003c/p>\u003cp>«وماذا أيضاً؟»\u003c/p>\u003cp>«تخطيط صناعي.» رفع كتفيه. «المستوى الأول. ثلاث خطوات.»\u003c/p>\u003cp>«ثلاث.» هزت رأسها ببطء. «كان يمكن أن تكون أكثر.»\u003c/p>\u003cp>«ثلاث خطوات أفضل من لا شيء.»\u003c/p>\u003cp>«لا.» التفتت أخيراً، ورآها تبتسم للدقيق الذي ملأ القناة. مسحت أثره عن كمها ثم عادت تراقب الحجر. «لكنها بداية.»\u003c/p>\u003cp>مدّ يده فأمسكت بها، وكان كفها دافئاً هذه المرة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان تشانغ واقفاً عند طرف الغرفة الحجرية، منفرداً، ذراعاه مطويتان.\u003c/p>\u003cp>لم يقل شيئاً طوال الصباح. بقي هناك، يتأمل المحور الذي يدور، والأطواق الحديدية الأربعة تدور حوله في الماء، سوداء لامعة، تقطر الماء، وتلتف ببطء حول الخشب الذي ثبتته. كانت عيناه تتبعان كل دورة، وكان فكه ينبض.\u003c/p>\u003cp>اقترب لين منه بحذر.\u003c/p>\u003cp>«المحور.»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>«صمد.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>استدار تشانغ نحوه ببطء. توقف نظره عند الطرف الذي برده طوال الليل. مد إصبعه نحوه، ثم أبعده وأبقى يديه خلف ظهره.\u003c/p>\u003cp>قال تشانغ بصوت خشن:\u003c/p>\u003cp>«جيد.»\u003c/p>\u003cp>لم يقل غيرها.\u003c/p>\u003cp>وأدار وجهه نحو الماء، وبقي هناك. ثم قال بعد صمت طويل، دون أن يلتفت، كأنه يتحدث إلى النهر:\u003c/p>\u003cp>«حسبت في الليل. سكك المحاريث المكسورة التي مرت على يدي هذه السنة وحدها. أكثر من ثمانين.» ضرب بإصبعه على المحور مرة واحدة. «ثمانون سكة في قرية واحدة. هل تعرف كم يعني هذا؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«قلت لك أن حديدي سيئ. لم أقل لك كم.»\u003c/p>\u003cp>نظر لين إلى يدي الحداد المشققتين. ثمانون سكة، ولكل واحدة حقل ينتظر. أراد أن يسأله عن صنع سكة تصمد، لكنه نظر أولاً إلى الحجر الذي ما زال يحتاج إليهما.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وبعد الظهر، حين تفرق الناس بأكياسهم الصغيرة، وبقي في الطاحونة لين وشين يان والعجوز يانغ ولاو دونغ وتشيو، وقف على الطريق أعلى الضفة فارس على حصان أسود.\u003c/p>\u003cp>كان الوكيل.\u003c/p>\u003cp>نظر إلى الدولاب الذي يدور، وإلى الدقيق الأصفر الذي يتراكم عند فم القناة، وإلى رجال القرية الذين يحملون الأكياس. وأعطى لجام حصانه حركة قصيرة.\u003c/p>\u003cp>كان خادمه يقف خلفه على بغل. التفت الوكيل إليه، وقال بصوت هادئ لم يسمعه لين ولا شين يان، لكن الريح حملته إلى العجوز يانغ، الذي كان قريباً من الطريق:\u003c/p>\u003cp>«دعهم يعملون. الشتاء طويل.»\u003c/p>\u003cp>ثم مضى.\u003c/p>\u003cp>وعلى الجهة الأخرى من الوادي، على التل الذي يطل على القرية، وقف رجل على بغل أبيض في معطف أسود لامع، يتدثر به من الريح. من هناك لا يُرى من الطاحونة إلا ظل أسود صغير، ومن الطاحونة لا يُرى من الرجل إلا ظل أصغر. كان تشيان يعد الداخلين والخارجين.\u003c/p>\u003cp>كان يعرف عدد القرى في المقاطعة، وعدد البيوت في كل قرية، وعدد الأكياس التي يطحنها كل بيت في الشتاء. ولم يكن عنده شيء من ذلك مكتوباً، فكله في رأسه. حسب عدد الأكياس. وعدد من خرجوا من الطاحونة، وعدد من دخلوا. وحسب في رأسه، بابتسامة لا تتغير، الأرقام التي سيقولها ليلاً لمن يستمعون إليه.\u003c/p>\u003cp>ثم سقطت على كم معطفه الأسود أول ندفة ثلج.\u003c/p>"},{"n":15,"t":"الفصل الخامس عشر: الوعود تُطحن أولاً","b":"\u003cp>أيقظ صرير الثلج لين في فجر اليوم الأربعين.\u003c/p>\u003cp>مرت أقدام بجانب جدار المخزن. سمعها قبل أن يفتح عينيه، وسمع تشقق الخشب في السقف المنخفض، وأنفاس شين يان القصيرة الهادئة بجانبه تحت كومة الأغطية. كان القش تحتهما متجمداً من أسفل، وكان الهواء في الغرفة يلسع أنفه مع كل شهيق. وحين مد يده إلى وعاء الماء الذي تركه بجانب رأسه، وجد على سطحه قشرة بيضاء سميكة.\u003c/p>\u003cp>تحركت شين يان. التصق ظهرها بصدره، وسحبت يده إلى بطنها دون أن تستيقظ تماماً. كان البطن دافئاً وأكبر مما كان قبل أسبوعين، ثقيلاً قليلاً تحت كفه، وقد بدأ ينتأ فوق أسفل السترة. ظل لين ساكناً. كان يعرف أن هذه الدقائق القليلة قبل أن تصيح الديكة هي كل ما سيملكانه اليوم لأنفسهما.\u003c/p>\u003cp>ثم صاح الديك، وفتحت عينيها.\u003c/p>\u003cp>قالت بصوت مبحوح: «كم؟»\u003c/p>\u003cp>«كم ماذا؟»\u003c/p>\u003cp>«كم درجة. قل لي بالنظام.»\u003c/p>\u003cp>«النظام لا يقيس الحرارة.»\u003c/p>\u003cp>«يقيس ما شئت.» أغمضت عينيها مرة أخرى. «اسأله إن كان النهر قد تجمد.»\u003c/p>\u003cp>نهض لين وفتح الباب. ارتدى سترته وسار إلى الطاحونة، يتبع آثار الرجال على الطريق المتجمد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يتجمد النهر بعد. لكن الماء البطيء عند الحاجز، حيث يتجمع قبل دخول مجرى الدولاب، كان قد غطته طبقة رقيقة من الجليد الرمادي، مثل زجاج متسخ، تتكسر حوافها وتعود فتلتحم. وفي المجرى نفسه، قرب الريشات، كانت قطع صغيرة تتراكم وتلتصق بالخشب وتكبر.\u003c/p>\u003cp>كان الدولاب يدور بتثاقل.\u003c/p>\u003cp>وقف لين على الضفة ينظر إليه بقلب منقبض. كل دورة تستغرق وقتاً أطول من الأمس، وكل ريشة تخرج من الماء وعليها طبقة من ثلج لامع، تسقط منه قطرات تتجمد قبل أن تصل إلى الأرض.\u003c/p>\u003cp>صاح العجوز يانغ، الذي سبقه إلى المكان: «العصي!»\u003c/p>\u003cp>كانوا قد أعدوا لهذا اليوم عصياً طويلة بأطراف مسطحة من الخشب الصلب، وأخذ كل واحد منها واحدة. نزل لاو دونغ وتشيو إلى حافة المجرى، وتبعهما ثلاثة رجال آخرون، وبدأوا يطرقون الجليد عند الحاجز بضربات قصيرة منتظمة. كان الصوت يتردد في الوادي كله، فتردده الضفة المقابلة.\u003c/p>\u003cp>نزل لين معهم. وقف على حجر مسطح ثبّت قدميه عليه، وضرب. تشقق الجليد تحت العصا وتساقطت قطعه ورقصت على الماء. وكان الماء تحتها أسود وبطيئاً، يخرج منه بخار خفيف.\u003c/p>\u003cp>قال تشيو، من بين أسنان تصطك: «لو أنني أعرف أن الشتاء هكذا لبقيت في بيتي.»\u003c/p>\u003cp>«بيتك لا طحين فيه.»\u003c/p>\u003cp>«بيتي لا طحين فيه، لكن فيه نار.»\u003c/p>\u003cp>«وهنا؟»\u003c/p>\u003cp>«هنا نار في الصدر.» ضحك ضحكة مرتجفة وضرب الجليد. «أرجو أن تدوم.»\u003c/p>\u003cp>تورمت مفاصل أصابع تشيو واحمرّت، وقد انتبه لين إلى أن جلد راحتيه، الذي احترق بالحبل قبل يومين، لم يلتئم بعد، وأن قفاز القماش الذي يلبسه مبلل ومتجمد. لم يقل شيئاً. سجّل في رأسه أن الرجال يحتاجون إلى قفازات من جلد، وإلى شحم، وإلى نار صغيرة قرب الحاجز يتدفأون عندها.\u003c/p>\u003cp>وكان لا يعرف من أين يأتي بأي من هذا.\u003c/p>\u003cp>ركز على الدولاب، لأنه لم يعرف ما يفعله غير ذلك.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: دولاب مائي، طبقة جليد على الريشات\u003c/div>\u003cdiv>الوزن الإضافي المقدر: 40–60 كغ، ويزداد بمعدل ثابت ما دامت الحرارة تحت الصفر\u003c/div>\u003cdiv>يتوقع توقف الدوران إذا تجاوز الجليد الحد الذي يستطيع الماء دفعه\u003c/div>\u003cdiv>الثقة: 66%\u003c/div>\u003cdiv>ملاحظة: لا بيانات محلية عن مدة الصقيع.\u003c/div>\u003cdiv>طاقة التكامل: 91%\u003c/div>\u003c/div>\u003cp>عاد إلى العصا. عرف الآن أن ثقل الجليد سيزيد، لكن عليه أن يزيله بيديه؛ لن تحركه الأرقام عن الريشات.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بدأ الطابور قبل أن تشرق الشمس.\u003c/p>\u003cp>لم يدعهم أحد. جاؤوا بأكياسهم على أكتافهم وفي عربات صغيرة وعلى ظهور الحمير: رجال بعضهم لم يره لين من قبل، ونساء يلفّن رؤوسهن بشالات، وأطفال يقفون في آخر الصف يتقافزون ليدفئوا أقدامهم. وكان في أيدي الكثيرين شيء صغير، حجر مستدير بحجم الإبهام.\u003c/p>\u003cp>الرقع.\u003c/p>\u003cp>جلست شين يان عند الباب الخشبي الصغير للغرفة الحجرية، على مقعد وضعه لها العجوز يانغ، ملتفة بسترتها الثقيلة ولحاف هو سانيانغ القديم، ودفترها على ركبتيها. وأمامها على الأرض لوح الأعواد، وكيس الرقع الذي تسلمته من هو سانيانغ، وميزانها الخشبي.\u003c/p>\u003cp>نادت بصوت عالٍ لا يشبه صوتها: «الرقع أولاً!»\u003c/p>\u003cp>تقدم الأول: رجل ضخم بحاجبين أبيضين من الصقيع. وضع رقعته في يدها. قلبتها، ونظرت إلى النقطتين السريتين في الركن، وأومأت. «اسمك؟»\u003c/p>\u003cp>«وانغ الأكبر.»\u003c/p>\u003cp>«وما أعطيت؟»\u003c/p>\u003cp>«سكتين وقدراً.» مد ذقنه. «منذ أيام.»\u003c/p>\u003cp>نظرت في دفترها، ثم في كتاب هو سانيانغ الذي فتحته الأخيرة على المقعد بجانبها وهي واقفة تنظر إلى الجمع بعينين ضيقتين. «اثنان وعشرون رطلاً. وهذه إحدى رقعك؛ كيس واحد.»\u003c/p>\u003cp>«كيس واحد.»\u003c/p>\u003cp>وضع الكيس عند الفتحة، وصب شياو دو، ودار الحجر.\u003c/p>\u003cp>وهكذا مضى الصباح. رقعة بعد رقعة، كيس بعد كيس. والغرفة الحجرية الصغيرة تهتز بخشخشة الحجر على الحجر، وغبار الدقيق الأبيض يتصاعد في الهواء البارد ويعلق على الأهداب والحواجب وشعر الرجال. ورائحة الدخن المطحون الدافئة، وهي رائحة لم يتخيل لين أنه سيحبها يوماً، ملأت الوادي.\u003c/p>\u003cp>حاول أن يحسب. دورة الدولاب البطيئة تعطي ثمانية أكياس في اليوم لا عشرة، وقد مضى منها ثلاثة قبل الظهر. وكل كيس طُحن مجاناً لا يترك للطاحونة شيئاً.\u003c/p>\u003cp>بحث بعينه عن وعاء الأجر، فوجد قاعه ظاهراً.\u003c/p>\u003cp>في منتصف الصف، حوالي الضحى، رأى لين امرأة نحيلة تحمل طفلاً ملفوفاً بخرق، ولا تحمل كيساً.\u003c/p>\u003cp>وقفت جانباً لا تنضم إلى الطابور. كانت تنظر إلى الغرفة الحجرية والغبار الأبيض يتصاعد منها، وتمسح وجه الطفل بكمها كل لحظة. وحين مر بها لين سمع صوتاً خافتاً، أنيناً رتيباً يخرج مع كل نفس.\u003c/p>\u003cp>كشفت الخرقة بحذر. كانت قدما الطفل، الذي لم يتجاوز الثالثة، زرقاوين ومتورمتين، وأصابع قدمه اليمنى سوداء عند الأطراف.\u003c/p>\u003cp>قالت: «نفد الحطب منذ ثلاث ليال. قلت إنني سأطحن الدخن وأحمله إلى الجار...» لم تكمل. شدت الخرقة حول الطفل ونظرت إلى يدي لين. «ليس عندي رقعة. ولا دخن. جئت لأرى.»\u003c/p>\u003cp>ضغط لين شفتيه. لم يعرف ما يقول. انحنى، ولمس بإصبعه قدم الطفل، فكانت باردة كحجر نهر. ركز، وأحس بالخجل لأنه فعل.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل أساسي]\u003c/strong>\u003c/div>\u003cdiv>الهدف: قدم طفل، تجمد موضعي (المرحلة 2–3)\u003c/div>\u003cdiv>الأصابع السوداء: أنسجة ميتة على الأرجح، لن تُستعاد\u003c/div>\u003cdiv>الإجراء: تدفئة تدريجية، لا فرك، ولا نار مباشرة\u003c/div>\u003cdiv>الثقة: 72%\u003c/div>\u003c/div>\u003cp>كرر لين التحذير بصوت مسموع: لا فرك ولا نار مباشرة. لم يكن يعرف كم من الإحساس بقي في تلك القدم الصغيرة.\u003c/p>\u003cp>طلب لين من شياو دو أن يتولى الباب. ثم حمل الطفل وسار مع أمه وشين يان إلى النزل. أخلوا له موضعاً في مخزن الحطب، وأخبر شين يان بما قرأ بلغتهما. ملأت وعاء بماء فاتر واختبرته بيدها. أجلست الأم على القش، ووضعت قدمي الطفل في الماء من دون أن تفركهما. بقيت بقربه تغني بصوت منخفض وتزيد الماء الدافئ قليلاً كلما برد. بعد ساعة بكى الطفل. قالت له الأم: «هذا جيد. البكاء جيد.» وجلست على الأرض ورأسها بين ركبتيها.\u003c/p>\u003cp>وضعت شين يان غطاء مطوياً تحت ساقي الطفل، وأعطت أمه قطعة قماش جافة. «لا تدعيه يمشي على الثلج وهو هكذا.»\u003c/p>\u003cp>أومأت المرأة من دون أن ترفع رأسها. بقيت يدها تحت ظهره، فجلست شين يان إلى جوارها حتى استقر بكاؤه. لم تعدها بعودة الأصابع السوداء إلى لونها، ولم تجد المرأة سؤالاً تقوله.\u003c/p>\u003cp>عاد لين إلى الطاحونة. قال لهو سانيانغ بعد ذلك، بكلمات قليلة، ما رآه. نظرت إليه وقالت: «بيت أرملة تشو. ثلاثة أطفال.» ثم أضافت دون أن ترفع صوتها: «ثلاثة أصابع، ربما أربعة. هذا شتاء.» ثم أخذت وعاء عصيدة وخرجت به إلى الأم في المخزن.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند الظهر جاء أول من لا يحمل رقعة.\u003c/p>\u003cp>كان رجلاً ضئيلاً من قرية الماء الأحمر، أتى مشياً ثلاث ساعات بكيس صغير، ووقف في آخر الطابور وحده، يتطلع إلى الصف من غير أن يكلم أحداً. حين وصل إلى شين يان، قالت له: «لا رقعة؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«ستدفع الأجر إذن. جزءاً من عشرين.»\u003c/p>\u003cp>«كنت أنوي أن أدفع...» توقف. «لكن قيل لي إن الأولوية للرقع.»\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>«وإن الرقع كثيرة.»\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>نظر إلى الطابور الذي أمامه، ثم إلى الكيس الصغير في يده، ثم إلى الجبل الرمادي في السماء الذي بدأ يبيض بحبات ثلج صغيرة متناثرة. حرك الرجل الكيس من يد إلى أخرى، منتظراً جوابها.\u003c/p>\u003cp>قالت: «تعال بعد غد.»\u003c/p>\u003cp>«بعد غد؟»\u003c/p>\u003cp>«عند الفجر. سأحفظ لك دوراً.» ودونت اسمه بعلامة في دفترها. «لن يسبقك أحد.»\u003c/p>\u003cp>كان الرجل يحدق فيها، ثم قال بصوت غريب: «في طاحونة ليو لا يحفظون دوراً لأحد.»\u003c/p>\u003cp>«لسنا طاحونة ليو.»\u003c/p>\u003cp>مضى وهو يلتفت إلى الوراء مرتين.\u003c/p>\u003cp>ولاحظ لين أنها لم تنظر إليه حين مضى. كانت قد عادت إلى الدفتر، وإلى عود جديد تحركه من مكان إلى مكان على لوحها. ضغطت القلم حتى ترك طرفه أثراً غامقاً في الصفحة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في آخر النهار، حين غابت الشمس خلف التل، وتفرق الناس بأكياسهم، وتركوا خلفهم رائحة الدقيق وخطوطاً في الثلج، جلس لين على الحجر الأخير قرب الدولاب.\u003c/p>\u003cp>لم يعد يثني أصابعه بسهولة. أنفاسه بيضاء. ووخزت قدماه كلما حاول الوقوف. وكان الدولاب قد توقف تماماً في آخر ساعة، وانتزع العجوز يانغ والرجال الجليد من ريشاته بالعصي والمطارق الصغيرة وهم يتمتمون.\u003c/p>\u003cp>جاءت شين يان بخطوات بطيئة، تسند يدها على ظهرها. جلست بجانبه على الحجر دون كلمة. ووضعت الدفتر على ركبتيها ونظرت إلى الدولاب.\u003c/p>\u003cp>فتحت الدفتر وأغلقته. طوال النهار لم تتكلم معه عن الحساب، واكتفت بتسجيل ما يدخل إلى الحجر وما يخرج منه.\u003c/p>\u003cp>قال: «يان.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«لم أقل...»\u003c/p>\u003cp>«أعرف ما ستقوله. أريد أن أشرب شيئاً ساخناً أولاً.»\u003c/p>\u003cp>مشيا معاً إلى النزل بين أشجار عارية ثقيلة بالصقيع، ويدها في يده داخل كمه. لم يتكلم أحد. كان القمر شاحباً فوق الجبال، وفي الحقول المحصودة بقع من الثلج الأبيض بين الأحجار، والكلاب تنبح من بعيد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان النزل خالياً تقريباً. موقد المطبخ يتنفس بهدوء وحرارة ثابتة، وجلست هو سانيانغ على كرسيها الخشبي أمامه، بكوب شاي في يدها، وبين قدميها على الأرض كيس القماش الذي تعلقه في حزامها.\u003c/p>\u003cp>نظرت إليهما حين دخلا ولم تقل شيئاً. أشارت بذقنها نحو وعاءين على الطاولة، وفيهما عصيدة دخن ساخنة عليها قطعة من لحم مقدد.\u003c/p>\u003cp>جلسا وأكلا.\u003c/p>\u003cp>كان الصمت ثقيلاً. تطلع لين إلى الكيس عند قدمي هو سانيانغ. لم تسمع منهما طوال النهار إلا أسماء من سيطحنون مجاناً.\u003c/p>\u003cp>وضعت شين يان ملعقتها أخيراً، وأخرجت الدفتر.\u003c/p>\u003cp>«ثلاث عشرة رقعة من العمال.» قالت بصوت منخفض. «وسبع وعشرون من القرية، عن الحديد القديم. أربعون. أمس طحنا أربعة أكياس بالرقع بعد الافتتاح، واليوم ثمانية. اثنا عشر حتى الآن، ولا نعرف كم سيحمل العمال بعد ذلك.»\u003c/p>\u003cp>«وكم طحنا اليوم؟»\u003c/p>\u003cp>«ثمانية أكياس.» أدارت صفحتين. «ثمانية اليوم. والاثنا عشر مجموع اليومين. لا تخلط بينهما.»\u003c/p>\u003cp>«إذن لم يبق في عمل اليوم موضع لزبون يدفع.»\u003c/p>\u003cp>«يعني أنه لا يوجد أجر.»\u003c/p>\u003cp>قالتها بنبرة صافية، دون لوم، ولم يكن لين يحتاج إلى أن تعيدها.\u003c/p>\u003cp>نظر إلى كيس هو سانيانغ. قالت، دون أن تلتفت إلى أحد، وهي تحدق في النار:\u003c/p>\u003cp>«لم يدفع أحد اليوم.»\u003c/p>\u003cp>«رجل من قرية الماء الأحمر...»\u003c/p>\u003cp>«لم يدفع. هو الآن في الدور.» حركت الكيس بقدمها فصدر عنه رنين خافت ضعيف. «تقاضيت نصف نحاسة عن كل عشر رقع كما اتفقنا. أربع رقع جديدة سجلتها اليوم. لم تبلغ عشراً، فلا شيء مستحقاً بعد. وأنتما لم تجلبا لي نحاسة واحدة.»\u003c/p>\u003cp>لم يرد أحد.\u003c/p>\u003cp>رفعت عينيها أخيراً، وفيهما برودة امرأة رأت هذا من قبل.\u003c/p>\u003cp>«وعدتم الجميع بالطحن مجاناً طوال الشتاء. والجميع يصدق. والجميع يأتي. والجميع، ما دام الوعد صحيحاً، لن يدفع.» وضعت كوبها على الأرض بحذر. «وفي الربيع، حين يدور الماء ويذوب الجليد، سيقول الناس إن الغريبين أعطوا بسخاء ثم أفلسوا. وسأكون أنا الأرملة الغبية التي كفلتهم.»\u003c/p>\u003cp>قالت شين يان: «لم نفكر...»\u003c/p>\u003cp>«فكرتما. فكرتما في الوعد.» مدت يدها وأمسكت وعاء لين الفارغ، ووضعته فوق وعاء شين يان. «لم تفكرا في ما بعده.»\u003c/p>\u003cp>قالت شين يان بهدوء: «غداً أضع لك الحساب كاملاً، يوماً بيوم، حتى آخر الشتاء.»\u003c/p>\u003cp>«الحساب لا يملأ الكيس.»\u003c/p>\u003cp>«لا. لكنه يريك أين الثقب.»\u003c/p>\u003cp>نظرت إليها هو سانيانغ لحظة، ولم تجب.\u003c/p>\u003cp>أطرق لين.\u003c/p>\u003cp>لم يكن عنده ما يرد به. نظر إلى يديه، ثم إلى الوعاءين الفارغين. أكل الرجال من مؤن بيوتهم وهم يبنون الطاحونة، وأخذوا وعده بدلاً من الأجر. لن يستطيع أن يقول لهم الآن إن حسابه كان خطأ. كان عليه أن يجد وقتاً لهم ووقتاً للطاحونة، قبل أن يصبح الحجر الذي أصلحوه عاجزاً عن إطعام من يديره.\u003c/p>\u003cp>نهضت هو سانيانغ، حاملة الكيس، ومشت نحو الباب الداخلي.\u003c/p>\u003cp>وقفت عنده ظهرها إليهما. وقالت بصوت منخفض جداً، بلا مرارة، وهي تشد الكيس في قبضتها:\u003c/p>\u003cp>«الوعود تُطحن قبل الحبوب.»\u003c/p>\u003cp>ثم أغلقت الباب خلفها، وسمع لين، في الصمت الذي تلاه، صوت الريح تلتف حول زاوية النزل، وصوت الثلج الخفيف على الشباك الورقي، وتنفس امرأة حامل بجانبه تعد في رأسها أيام الشتاء.\u003c/p>"},{"n":16,"t":"الفصل السادس عشر: حساب الوعود","b":"\u003cp>وضعت شين يان الورقة على طاولة المطبخ في صباح اليوم الحادي والأربعين، وأدارتها نحو هو سانيانغ لتتأملها.\u003c/p>\u003cp>لم تكن ورقة بالمعنى المعتاد. كانت أربع صفحات انتزعتها من آخر الدفتر، وربطتها بخيط من القنب، وغطتها بخط صغير مرتب من الأرقام والأسهم والأعمدة. ولأن هو سانيانغ لا تقرأ الأرقام التي كتبتها، فقد رسمت لها فوقها صورة: أكياس صغيرة مرسومة بالفحم، كل كيس بحجم الظفر، مصفوفة في صفوف.\u003c/p>\u003cp>قالت: «هذا الشتاء.»\u003c/p>\u003cp>كان بجانبها لين، يده المتشققة على فخذه، وشياو دو واقفاً عند الموقد يتظاهر بتحريك القدر. وكان الضوء الرمادي يتسلل من الشباك الورقي المبقع، ويلقي على الطاولة مربعاً شاحباً.\u003c/p>\u003cp>«ثلاثة عشر عاملاً.» وضعت إصبعها على الصف الأول. «كل واحد وضع عوده، ولكل واحد طحن مجاني طوال الشتاء، هو وعائلته. وسبع وعشرون رقعة من الحديد القديم، كل واحدة بكيس. هذه أربعون وعداً.»\u003c/p>\u003cp>«كيس واحد لكل وعد؟»\u003c/p>\u003cp>«الرقع كيس واحد. العمال طوال الشتاء، لا كيس واحد.» أشارت إلى ثلاثة صفوف طويلة متتابعة. «افترضت أن كل عائلة تطحن كيساً في الأسبوع. عشرون أسبوعاً من الآن حتى الربيع. ثلاثة عشر عاملاً في عشرين أسبوعاً.»\u003c/p>\u003cp>«مئتان وستون كيساً.»\u003c/p>\u003cp>«مئتان وستون، ناقص من يتخلف. وسبعة وعشرون من الرقع. المجموع قرابة ثلاثمئة كيس.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى الصورة طويلاً.\u003c/p>\u003cp>«والطاحونة؟»\u003c/p>\u003cp>«في أحسن الأحوال، عشرة أكياس يومياً.» أخذت نفساً. «لكن النهر يتجمد، والدولاب يتباطأ، وأقرب تقدير ثمانية. ثم حين يتجمد كلياً، لا أعرف.»\u003c/p>\u003cp>«يعني أن ثلاثمئة كيس تحتاج إلى أربعين يوماً من الطحن الكامل.»\u003c/p>\u003cp>«أربعون يوماً من العمل، لا أجر فيها.»\u003c/p>\u003cp>«وإذا اجتمع أصحابها على الباب...»\u003c/p>\u003cp>«فلا نجد وقتاً كافياً للزبائن الذين يدفعون.» قالتها شين يان بصوت ثابت، وأدارت الصفحة الأخيرة. «والمطلوب منا دين مئة وستة وأربعون، وحطب، وبذور الربيع، وإيجار الأرض اثنا عشر كيساً. لا تغطي الوعود أيّاً منها.»\u003c/p>\u003cp>صمتوا.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قال لين، حين خرجت هو سانيانغ إلى الغرفة الكبيرة لتنظر إلى شيء ما، وبقي هو وشين يان وحدهما مع الورقة:\u003c/p>\u003cp>«نحدد أياماً.»\u003c/p>\u003cp>«أياماً؟»\u003c/p>\u003cp>«للطحن المجاني. يومان من كل ستة أيام. وباقي الأيام بأجر.»\u003c/p>\u003cp>لم تقل شيئاً.\u003c/p>\u003cp>«حسبت الأمر ليلاً. قرابة ثلاثمئة كيس حتى الربيع. يومان من ثمانية أكياس يعطيان ستة عشر في كل ستة أيام. يكفي ذلك إذا بقي الدولاب يعمل، وتبقى أربعة أيام للأجر.»\u003c/p>\u003cp>«يومان.»\u003c/p>\u003cp>«يومان.»\u003c/p>\u003cp>نظرت إليه بعينين لم يرَ فيهما شيئاً سهلاً. قالت: «أنت تعرف ماذا سيقول الناس.»\u003c/p>\u003cp>«سيقولون إننا نماطل.»\u003c/p>\u003cp>«سيقولون إننا تراجعنا.» وضعت يدها على بطنها، حركة صارت عادتها حين تتوتر. «قلنا لهم طحناً مجانياً طوال الشتاء. ثم سنقول: لا. يومان فقط. أنا أفهم الحساب يا لين، فقد كتبته أنا. لكن الوعد وعد. الرجل الذي وقف معنا في الماء المتجمد لم يسمع منك: مجاناً في يومين فقط.»\u003c/p>\u003cp>«لم نقل له مجاناً كل يوم.»\u003c/p>\u003cp>«لم نقل له غير ذلك.»\u003c/p>\u003cp>«إذن ما الحل؟ نطحن حتى نفلس؟ وحين نفلس، نكون قد حافظنا على الوعد، ولا طاحونة؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«ماذا إذن؟»\u003c/p>\u003cp>لم تجب. أغمضت عينيها وفركت جبينها بأصابع باردة. وأبقى لين يده قرب الورقة، منتظراً منها اقتراحاً آخر.\u003c/p>\u003cp>وفي تلك اللحظة، عادت هو سانيانغ، ووقفت عند الباب تنظر إليهما.\u003c/p>\u003cp>«أنتما تتشاجران بصوت منخفض.» قالت. «هذا أسوأ من الصراخ.»\u003c/p>\u003cp>ثم جلست وسحبت الورقة نحوها، وتفحصت رسومات الأكياس بدلاً من أرقام شين يان.\u003c/p>\u003cp>«قولا لي.»\u003c/p>\u003cp>شرحت شين يان. ثم شرح لين. ثم قالت هو سانيانغ بعد صمت طويل:\u003c/p>\u003cp>«الناس لا يحبون أن يُعدل الوعد. لكنهم يحبون أن يُنظم.»\u003c/p>\u003cp>رفعت شين يان رأسها.\u003c/p>\u003cp>«أنت تقولين...»\u003c/p>\u003cp>«أقول إنني رأيت طحن ليو. وطحن جياو قبله. وطاحونة بلا يوم للفقراء، وطاحونة بيوم.» وضعت كفها على الورقة. «حددوا لهم موعداً يعرفونه. لا تتركوهم يأتون ثم يقال لهم انتظروا. إن عرف الرجل يومه، جاء وهو يعرف ما سيأخذ.»\u003c/p>\u003cp>قالت شين يان ببطء: «يوم... للوعد.»\u003c/p>\u003cp>«يوم الوعد.»\u003c/p>\u003cp>«يومان من كل ستة أيام.» أمسكت القلم. «مكتوبان في كتابك. ومعلنان في الساحة. لا نقول: لن نطحن لكم. نقول: هذه أيام وعدكم، ومن جاء فيها طُحن له، ومن جاء في غيرها دفع جزءاً من عشرين.»\u003c/p>\u003cp>«الوعد يبقى.»\u003c/p>\u003cp>«ونعطي كل واحد موعداً.» أمسكت القلم. «وكل من وضع عوداً أو رقعة، يُكتب اسمه في كتابك لليوم الذي يخصه.»\u003c/p>\u003cp>«ولا يسبق أحد أحداً.»\u003c/p>\u003cp>«ولا يُنتظر في الثلج بلا موعد.» التفتت إلى لين. ورسمت خطين واضحين تحت اليومين. «ولم تقل هذا أنت، ولم أقله أنا.»\u003c/p>\u003cp>«قالته هو سانيانغ.»\u003c/p>\u003cp>«قالتاه معاً.» قالت هو سانيانغ بجفاف. «لا تنسبا لي ما لا أقبل ثمنه.» ثم أضافت: «أريد أن أكتب الإعلان بيدي.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وفي صباح اليوم الثاني والأربعين، وقف شياو دو في وسط ساحة القرية على صندوق خشبي مقلوب، وصاح بصوت أجش من البرد:\u003c/p>\u003cp>«أيها الناس! من وضع عوداً، ومن حمل رقعة!»\u003c/p>\u003cp>اجتمع عشرات الأشخاص، يخرجون من البيوت الواحد تلو الآخر، ملتفين بالأغطية. كان بعضهم يتنفس في كفيه. وكانت هو سانيانغ واقفة بجانب الصندوق، كتابها مفتوح على ذراعها، تراقب الوجوه في الصف الأول.\u003c/p>\u003cp>«يوم الوعد!» صاح الصبي. «اليوم الثاني واليوم الخامس من كل ستة أيام! من حمل رقعة، يأتي فيهما ويُطحن له بلا أجر! ومن لم يحمل، وجاء في أي يوم آخر، يدفع جزءاً من عشرين!» ثم، بنبرة مختلفة، تحدث بها كمن حفظ الجملة بعناية: «والوعد باقٍ حتى الربيع، بالكلمة المكتوبة في كتاب العمة هو، التي لا تكذب!»\u003c/p>\u003cp>توقف الصبي لحظة ونظر إلى كفه، حيث كتبت له هو سانيانغ الجملة بالفحم، وقد امّحى نصفها من عرق يده. أخذ يتلمس الباقي: «ومن... ومن لم يحمل...» ثم رفع رأسه بجرأة: «قالت العمة إنكم تعرفون الباقي!»\u003c/p>\u003cp>ضحك الجمع ضحكة قصيرة كأنها تنفس. وانفكّت عقدة في كتفي لين دون أن يدري.\u003c/p>\u003cp>تذمر أحدهم في الخلف: «ولماذا يومان؟»\u003c/p>\u003cp>«لأن الماء لا يدور إلا بقدر ما يدور!» ثم نظر إلى لين وقال: «إن جئتم جميعاً معاً، فلن يسرع الحجر من أجلكم!»\u003c/p>\u003cp>سكت الناس.\u003c/p>\u003cp>جاء من الصف الأمامي رجل ضخم، وانغ الأكبر، الذي أعطى سكتين وقدراً. تقدم بخطوات بطيئة، وأخرج رقعته من جيبه، وقلبها في يده.\u003c/p>\u003cp>«هذا لا يعدل الوعد؟»\u003c/p>\u003cp>قالت هو سانيانغ، بصوتها الجاف: «اسمك مكتوب. ويومك اليوم الثاني. وكل رطل أعطيت محسوب. من أراد تغييراً فليأتني.»\u003c/p>\u003cp>نظر إليها الرجل. ثم نظر إلى الكتاب المفتوح على ذراعها، المليء بالخطوط التي لا يقرؤها. وقال: «في طاحونة ليو لا يُكتب شيء.»\u003c/p>\u003cp>«لهذا ما زلتم تدفعون عشراً.»\u003c/p>\u003cp>ضحك أحدهم من بعيد. ثم ضحك آخر. وبصق رجل عجوز في الثلج، لكنه لم يمضِ.\u003c/p>\u003cp>ولاحظ لين أن شين يان، الواقفة في آخر الجمع، تتنفس أخيراً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الظهيرة بدأوا بناء الموقد الثاني.\u003c/p>\u003cp>اختار لين أن يبنيه في الجدار الشرقي للغرفة الكبيرة، قريباً من الجدار المشترك مع المطبخ، حتى يتقاسم الموقدان المدخنة الرئيسية. فتح اللوحة البيضاء في ذهنه، ورتب الخطوات التي أنهكهم تعلمها: الهدم، والخلطة، والبطانة، والتجفيف، والإشعال التدريجي.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخطيط الصناعي — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>المشروع: موقد الغرفة الكبيرة\u003c/div>\u003cdiv>المراحل: (1) الهدم وتحضير الخلطة (2) البناء والتبطين (3) التجفيف والاختبار\u003c/div>\u003cdiv>المدة المقدرة: 4 أيام\u003c/div>\u003cdiv>الخلطة: طين 50% + رمل 35% + رماد خشب 8% + قش 7% — ثقة 91%\u003c/div>\u003cdiv>طاقة التكامل: 88%\u003c/div>\u003c/div>\u003cp>كان شياو دو يحمل الطين الأحمر، وشين يان تضغط الطبقات بقطعة الخشب الملساء، وجلست هو سانيانغ على كرسيها عند الباب، تحصي بصمت كل دلو. كان الجميع يعمل بسرعة، لأن الطقس لا ينتظر.\u003c/p>\u003cp>حين وضعوا الطبقة الأولى، قالت هو سانيانغ من مكانها، دون أن ترفع صوتها:\u003c/p>\u003cp>«من هذا اليوم يبدأ الحساب.»\u003c/p>\u003cp>التفتوا.\u003c/p>\u003cp>«الخُمس.» كتبت شيئاً في كتابها. «من اليوم الذي يُبنى فيه الموقد الثاني، يُحسب لكما خمس ما يوفره الموقدان من الحطب، وتُدفع قيمته من دينكما. كما اتفقنا في اليوم الثالث.» أغلقت الكتاب. «ولا أقبل مفاوضة جديدة.»\u003c/p>\u003cp>«لم نطلب.»\u003c/p>\u003cp>«أعرف. لهذا أقولها الآن.»\u003c/p>\u003cp>طلبت شين يان منها أن تثبت في الكتاب مقدار الحطب المعتاد قبل الإصلاح. فتحت هو سانيانغ صفحة أقدم، ووضعت إصبعها على القيود. حمل لين السلة المستعملة إلى جوار الموقد ليتأكدوا أنهم يعدون المقدار نفسه. لم يكف أن تقل النار أو يصفو هواء الغرفة؛ سيخصم من الدين ثمن حطب لم يعودوا يحتاجون إلى شرائه.\u003c/p>\u003cp>قالت هو سانيانغ: «هذه السلة، لا سلة بائع الحطب. يغيرها كلما ارتفع السعر.»\u003c/p>\u003cp>رسمت شين يان علامة على حافتها.\u003c/p>\u003cp>«ومن يراقب ما يدخل إلى الموقد؟» سأل لين.\u003c/p>\u003cp>رفع شياو دو يده الملطخة بالطين. «أنا. لكن لا تجعلوا لي كتاباً آخر.»\u003c/p>\u003cp>«ثلاث علامات على الخشب أهون من شكوى كل مساء.» قالت هو سانيانغ. فمسح الصبي يده، وأخذ قطعة الفحم.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند الغروب مشى لين مع شياو دو من النزل إلى الطاحونة، وتوقف عند منعطف الدرب.\u003c/p>\u003cp>عند منعطف الدرب القريب من الطاحونة، حيث الحقول المحصودة تمتد بيضاء، كان رجلان يقفان في الثلج. يلبسان سترتين خضراوين مبطنتين، ويحملان حبلاً طويلاً معقوداً على فترات منتظمة. أحدهما يمسك طرفه عند وتد يغرسه في الأرض، والآخر يمشي مبتعداً ومعه الطرف الآخر، ثم يغرس وتداً ثانياً.\u003c/p>\u003cp>قاسا أرض المنعطف. من الطاحونة إلى الضفة إلى الحاجز. وعلى كتف أحدهما لفافة ورق.\u003c/p>\u003cp>لم ينظرا إلى لين. لم يردا حين مر قريباً. انحنى أحدهما وعقد عقدة جديدة وكتب شيئاً بقلم فحم، ثم أشار إلى زميله ليتقدم.\u003c/p>\u003cp>همس شياو دو: «هؤلاء من بيت ليو.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«يقيسون أرضهم.»\u003c/p>\u003cp>«لا.» قال لين وهو يحدق في الحبل الممدود فوق الثلج الأزرق في ضوء الغروب. «يقيسون ما يريدون استرداده.»\u003c/p>\u003cp>أخبر شين يان بما رأى حين عادا إلى النزل. ظلت تنظر إلى الطريق من الباب، ثم سحبت المزلاج وأغلقت باب النزل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عادا إلى المخزن ليلاً، بعد أن سكنت القرية وتوقفت الكلاب عن النباح.\u003c/p>\u003cp>كان البرد قد بلغ حداً يجعل كل نفس يخرج كغيمة صغيرة، والقش المتجمد يصرّ تحت أقدامهما. أغلق لين الباب بالمزلاج الخشبي، وسدّ الشق بقطعة قماش، وأشعل الشمعة الصغيرة، ثم جلس على حافة فرشهما وخلع حذاءه ببطء، لأن أصابعه لم تعد تطيعه.\u003c/p>\u003cp>جلست شين يان أمامه على القش، ومدت يديها.\u003c/p>\u003cp>«أرني.»\u003c/p>\u003cp>أعطاها يديه. كانتا متشققتين، حمراوين، مغطاتين بنتوءات صلبة جديدة. أمسكتهما بين كفيها، وفتحتهما، وقلّبتهما في ضوء الشمعة. ثم أخرجت علبة الشحم الأخضر وأخذت تدلكهما ببطء، إصبعاً إصبعاً، دون كلام.\u003c/p>\u003cp>كان لمسها دافئاً ومؤلماً معاً. لسعت الشقوق عند مفاصله حين مر الشحم عليها.\u003c/p>\u003cp>قالت: «لا تحاول أن تكسب كل نقاش.»\u003c/p>\u003cp>«لم أكن...»\u003c/p>\u003cp>«كنت. أمس، حين قلت يومين.» رفعت عينيها. «كنت محقاً في الحساب، وكنت مخطئاً في الطريقة. لا بأس. كلانا يفعل.»\u003c/p>\u003cp>«وأنت أيضاً؟»\u003c/p>\u003cp>«أنا أيضاً.» ابتسمت ابتسامة صغيرة. «خشيت أن يقال إننا خدعناهم. ولم أبحث عن طريقة نشرح بها الأمر.»\u003c/p>\u003cp>سكتا.\u003c/p>\u003cp>كانت أصابعها تدور على راحته المتشققة ببطء أكثر. ثم توقفت.\u003c/p>\u003cp>«لين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«منذ أسابيع...» لم تكمل. نظرت إلى يديه في يديها. «منذ أسابيع ونحن ننام كشخصين متعبين.»\u003c/p>\u003cp>عرف ما تعني. وعرف أنه فكر في ذلك أكثر مما اعترف: في الأسابيع التي مرت منذ وصلا، وفي الخوف الذي سكن بينهما وبين أي شيء آخر، وفي كل ليلة ينامان فيها متلاصقين من البرد لا غير، وجسداهما مشغولان بالبقاء.\u003c/p>\u003cp>قال: «كنت خائفاً.»\u003c/p>\u003cp>«من ماذا؟»\u003c/p>\u003cp>«من أن أؤذيك. ومن أن أؤذيه.» ونظر إلى بطنها.\u003c/p>\u003cp>ضحكت، ضحكة قصيرة مبحوحة. «لين. هو في الشهر الخامس. ولا أحد أخبرك أن الأمر يستحيل.»\u003c/p>\u003cp>«لا أحد أخبرني بشيء.»\u003c/p>\u003cp>«هذا صحيح.» مالت إلى الأمام حتى اقتربت جبهتها من جبهته. «وأنا لا أعرف أكثر منك. أعرف فقط أنني أفتقدك.»\u003c/p>\u003cp>لم يقل شيئاً. رفع يده التي ما زالت تلمع بالشحم، ولمس خدها، فأغمضت عينيها. كان جلدها بارداً من أطراف الوجه، ودافئاً تحت الأذن، حيث ينبض عرق صغير. مرر إبهامه عليه ببطء، ووجد أنفاسه تتسارع من دون أن يقرر.\u003c/p>\u003cp>«أريد أن أقول لك شيئاً غير الحساب.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«نسيت كيف أتكلم معك من دون أن أذكر عملاً.»\u003c/p>\u003cp>«هذه بداية جيدة.»\u003c/p>\u003cp>«لا تطلبي مني شعراً.»\u003c/p>\u003cp>ضحكت، ثم ضحك معها بصوت مكتوم، حتى وضع يده على فمها قائلاً: «سيسمعنا شياو دو.» وقالت من تحت كفه: «شياو دو ينام في المطبخ، وهو أخرس إذا نام.» ثم قبّلها.\u003c/p>\u003cp>قبلها ثانية، هذه المرة من غير أن يعجل إلى الابتعاد. بقي طعم الشاي على شفتيها. أمسكت بوجهه بكلتا يديها، فقربها منه. تشبثت بقميصه، وقال لها بين شهيقين: «الأغطية.» فقالت: «اسكت.» وسحبت اللحاف فوقهما.\u003c/p>\u003cp>استلقت إلى جانبه، وقرب اللحاف حول كتفيها. قبّل جبينها وبقيت يدها في عنقه. وحين ضحكت مرة أخرى، وضع إصبعه على شفتيه فضمت كفه بين يديها.\u003c/p>\u003cp>ترك الشمعة تنطفئ. تأخر نومهما تلك الليلة، وبقي حديث العمل مؤجلاً إلى الصباح.\u003c/p>"},{"n":17,"t":"الفصل السابع عشر: الصقيع يأكل الدولاب","b":"\u003cp>بعد ستة أيام على أول يوم للوعد، جاءت الليلة التي كادت تقتل الدولاب.\u003c/p>\u003cp>لم يكن لين نائماً حين بدأت. كان مستلقياً في المخزن في الظلام، وشين يان ملتصقة بظهره، والريح تصفر في شقوق الجدران، وتهز الباب كلما اشتدت. لم يعد البرد يلسع الجلد فحسب؛ تسلل إلى العظم واستقر فيه. وجد أنه يعدّ أنفاسه ليشغل رأسه.\u003c/p>\u003cp>قالت شين يان في العتمة، دون أن تتحرك: «أسمع شيئاً.»\u003c/p>\u003cp>«الريح.»\u003c/p>\u003cp>«لا. ليس صوت الريح.» رفعت رأسها. «صوت الماء. توقف.»\u003c/p>\u003cp>ظل لين ساكناً. ثم فهم: لم يعد يسمع، من بعيد، تلك الهمهمة الناعمة التي صارت جزءاً من الليل، همهمة الماء على ريشات الدولاب. أصغى مرة أخرى، فلم يسمع إلا الريح.\u003c/p>\u003cp>نهض بسرعة وارتدى حذاءه وسترته وخرج.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أضاء القمر الطريق والثلج على الضفة. وكان ما رآه عند منعطف النهر كافياً ليوقف أنفاسه.\u003c/p>\u003cp>الحاجز مغطى بصفائح من الجليد الأبيض السميك، تتدلى حوافها من حجارته. والمجرى الضيق الذي كان يندفع فيه الماء صار حفرة رمادية ساكنة، سطحها لوح صلب لا حركة فيه. والدولاب، ذلك الشيء الكبير الجميل الذي رفعوه بأيديهم، واقف في مكانه، وقد التصقت ريشاته كلها بالجليد، وصارت قطعة واحدة مع الماء المتجمد تحتها.\u003c/p>\u003cp>مشى إلى أسفل الضفة وأمسك إحدى الريشات بكفه المغطاة بالقفاز.\u003c/p>\u003cp>كانت صلبة كالحجر. حاول أن يدفعها فلم تتحرك بوصة.\u003c/p>\u003cp>ورأى، في الضوء الأزرق، شقاً رفيعاً في خشب الريشة السفلى. شقاً صغيراً في الألواح المركبة، لا يزيد على عرض شعرة.\u003c/p>\u003cp>ركز عليها.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: ريشة دولاب (ألواح مركبة)، شق دقيق عند الوصلة\u003c/div>\u003cdiv>السبب المرجح: تمدد الماء المتجمد داخل المسام ثم ضغط الجليد الخارجي\u003c/div>\u003cdiv>الخطر: الكسر عند أول دفعة قوية إذا دار الدولاب والجليد ملتصق\u003c/div>\u003cdiv>الثقة: 77%\u003c/div>\u003cdiv>طاقة التكامل: 90%\u003c/div>\u003c/div>\u003cp>لم يقل النظام ما يفعل. قال لنفسه: لو دار الماء الآن ودفع بالقوة، لانكسر الخشب.\u003c/p>\u003cp>وجاءت شين يان خلفه، تكاد تجري، مغطاة بلحاف هو سانيانغ، تتنفس بصعوبة. أمسكت ذراعه.\u003c/p>\u003cp>«لا تدفع.»\u003c/p>\u003cp>«دفعت قليلاً. لم يتحرك.»\u003c/p>\u003cp>«ستدفع.» أنفاسها بيضاء مرتجفة. «الجليد يبقي الدولاب سالماً الآن. لو كسرناه بالقوة، نكسر الخشب معه. لا تلمسه حتى الصباح.»\u003c/p>\u003cp>وقفا ينظران إلى الصمت الأبيض. كان الوادي كله قد توقف.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق إذابة الدولاب في الصباح ساعتين.\u003c/p>\u003cp>أحضر العجوز يانغ ورجاله ماءً مغلياً في أوعية حملوها من النزل، وصبوه ببطء على الريشات، ريشة ريشة، يكسرون الجليد بالمطارق الصغيرة بعدما يلين. كان البخار يتصاعد في الهواء الأزرق ويتجمد على لحى الرجال. وكان تشيو يلعن بصوت متقطع لأن الماء الساخن على قفازه يتجمد في لحظات.\u003c/p>\u003cp>وحين دار الدولاب أخيراً، بعد أن فُتح الحاجز، دار ببطء، وكان محوره يصدر صريراً رفيعاً مع كل دورة.\u003c/p>\u003cp>كان العجوز شو واقفاً على حافة الضفة. لم يجلس هذه المرة. حدق في الجليد الذي يتكسر ويطفو، ثم قال دون أن يلتفت:\u003c/p>\u003cp>«عشرة أيام.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«ويتجمد كله. لا تحسبوا أن هذا آخر ما عند الشتاء.» رفع قصبة الصيد التي لم يكن يستعملها، وضربها ضربة صغيرة على الجليد. «الليالي الأبرد لم تأت بعد.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>اقترحت شين يان الحل في الظهر.\u003c/p>\u003cp>كانت تقف على الضفة بعد أن قاست سماكة الجليد بعصا معقودة، ودفترها مفتوح على الصخرة. قالت للين وللعجوز يانغ وللرجال المجتمعين حولها:\u003c/p>\u003cp>«نغلق الحاجز ليلاً.»\u003c/p>\u003cp>«ونوقف الدولاب؟»\u003c/p>\u003cp>«نعم، نوقفه حتى الفجر. نغلقه ونصرّف الماء من المجرى كله. نتركه جافاً حتى الفجر. لا ماء، لا جليد على الريشات.» رسمت بالقلم الرصاص على الصفحة. «وفوق المجرى نضع ألواحاً من خشب، وفوقها قشاً جافاً مربوطاً حتى لا تأخذه الريح. الغطاء يخفف تعرض المجرى للهواء البارد.»\u003c/p>\u003cp>قال لين: «والدولاب؟»\u003c/p>\u003cp>«نرفعه قليلاً على القوائم. ما دام المجرى فارغاً، لن يبقى حول ريشاته ماء يتجمد.»\u003c/p>\u003cp>«نرفع هذه الكتلة كل ليلة؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«وفي الصباح ننزله من جديد؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>تأمل لين الرسم. كان العمل شاقاً، لكنه معقول.\u003c/p>\u003cp>قال العجوز يانغ: «الخشب يتعب من الرفع والخفض.»\u003c/p>\u003cp>«يتعب أقل من أن ينكسر.»\u003c/p>\u003cp>وهكذا فعلوا. استغرق الأمر يومين من العمل المتواصل بين الحاجز والمجرى والقوائم الخشبية التي نحتها العجوز يانغ، وفي اليوم الثالث أغلقوا الحاجز عند الغروب، وغطوا المجرى بالألواح والقش، وتحلقوا حوله ينتظرون.\u003c/p>\u003cp>لم يُحسم الأمر بالكامل. في الصباح التالي وجدوا الجليد قد تغلغل في الركن الأيسر من الغطاء، وفتحوا الألواح فوجدوا طبقة رقيقة على الماء الراكد، لكن الدولاب نفسه كان سليماً، يدور بعد نصف ساعة فقط.\u003c/p>\u003cp>قالت شين يان: «ينجح جزئياً.»\u003c/p>\u003cp>«جزئياً.»\u003c/p>\u003cp>«وفي ليلة أبرد لن ينجح.»\u003c/p>\u003cp>كلاهما كان يعرف أن الليلة الأبرد آتية.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فكرت شين يان في الدابة في الليلة نفسها.\u003c/p>\u003cp>جلست على القش في المخزن، والدفتر على ركبتيها، وقالت دون مقدمة:\u003c/p>\u003cp>«إذا تجمد النهر كله، يتوقف الدولاب. نحتاج إلى قوة أخرى تدير الحجر.»\u003c/p>\u003cp>«الحيوانات.»\u003c/p>\u003cp>«بغل. حمار. ثور.» رسمت دائرة صغيرة، وفي وسطها محور، وخطاً يمتد منه. «دابة تدور حول عمود، فيدير العمود الحجر. كما تدير الرحى في الطواحين الصغيرة.»\u003c/p>\u003cp>«الرحى تدور بحيوان يمشي في دائرة. لكن الحجر في الطاحونة يحتاج إلى سرعة مختلفة.» فكر لين. «الدابة تدور ببطء. الحجر يحتاج إلى دورات أكثر. نحتاج تروساً.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«التروس تحتاج إلى دقة.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«أسنان متساوية، وخشب جاف، وتصميم لا نخطئ فيه، وإلا انكسرت في الأسبوع الأول.» حك رأسه. «لم أصنع ترساً من خشب في حياتي.»\u003c/p>\u003cp>«لست أنت من سيصنعه.»\u003c/p>\u003cp>رفع حاجبه.\u003c/p>\u003cp>قالت: «العجوز يانغ.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الجواب عند العجوز يانغ هذه المرة أطول مما توقعا.\u003c/p>\u003cp>جلس في الصباح على جذعه المعتاد قرب النشارة، ينحت عوداً بسكين صغير. ولما شرح له لين الفكرة، لم يقل شيئاً. ظل ينحت. ثم قال:\u003c/p>\u003cp>«ترس.»\u003c/p>\u003cp>«ترس خشبي.»\u003c/p>\u003cp>«هذه كلمة جديدة.»\u003c/p>\u003cp>«عجلة بأسنان.»\u003c/p>\u003cp>«آه.» رفع رأسه. «عجلة الأوتاد.»\u003c/p>\u003cp>ثم جلس صامتاً مدة طويلة، وعيناه الصغيرتان على الأرض. وحين تكلم كان صوته مختلفاً، أبعد.\u003c/p>\u003cp>«جياو صنع واحدة مرة. لطاحونة يدوية كبيرة، في قرية بعيدة. كان ذلك قبل خمس عشرة سنة. استغرق ثلاثة أشهر.» وضع السكين على ركبته. «عجلة كبيرة، فيها أوتاد من خشب الزان تبرز من وجهها كأسنان. وأسطوانة صغيرة من قضبان خشبية، مثل قفص. الأوتاد تدخل بين القضبان، فتدير الأسطوانة. سماه ترس الفانوس، لأن القفص يشبه الفانوس.»\u003c/p>\u003cp>«هل تتذكر كيف صنعه؟»\u003c/p>\u003cp>«أتذكر ما قاله.» ابتسم ابتسامة قصيرة مريرة. «كان يقول: لا تقطع الوتد بمنشار. اقطعه بالفأس، ثم انحته بالإزميل. المنشار يقطع الألياف في الاتجاه الخطأ.»\u003c/p>\u003cp>«هل تستطيع أن تصنع واحداً؟»\u003c/p>\u003cp>نظر إليه العجوز طويلاً.\u003c/p>\u003cp>«سأجرب.»\u003c/p>\u003cp>وكان هذا هو الجواب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وجدوها في صباح اليوم الثالث والخمسين.\u003c/p>\u003cp>لم يأتِ أحد ليخبر لين. كان يمر بالطريق قبل الفجر مع شياو دو، متجهاً إلى الطاحونة، حين رأى الباب.\u003c/p>\u003cp>بيت صغير من الطين على حافة القرية الجنوبية، سقفه من القش المتجمد، وباب خشبي لم يغلق تماماً. كان الباب يهتز على الريح، يصدر صوتاً رتيباً يشبه طرقاً خافتاً على جدار فارغ. وعلى العتبة، بلا أثر قدم في الثلج.\u003c/p>\u003cp>توقف شياو دو. لم يقل شيئاً. كان وجهه قد تبدل.\u003c/p>\u003cp>دخل لين.\u003c/p>\u003cp>كانت الغرفة معتمة، باردة على نحو غريب، برودة ساكنة لم تعرف أنفاس بشرية منذ أيام. الموقد في الركن أسود، وفي قاعه حفنة رماد رمادية ليس فيها بقية جمر. وعلى السرير الخشبي الملاصق للجدار، تحت كومة من الأغطية الرثة، شكل صغير.\u003c/p>\u003cp>اقترب.\u003c/p>\u003cp>كانت امرأة عجوز. نحيلة جداً، ملتفة على نفسها كجنين، ركبتاها إلى صدرها، ويداها مضمومتان تحت ذقنها كأنها تدفئهما بآخر نفس. كان شعرها الرمادي مبعثراً على وجه الوسادة، ووجهها مغطى بطبقة رقيقة من الصقيع الأبيض الذي استقر على الجفون والحاجبين والشفتين الزرقاوين. عيناها مغمضتان. لم يرتفع الغطاء فوق صدرها.\u003c/p>\u003cp>مد لين يده ببطء ولمس كتفها.\u003c/p>\u003cp>كان الكتف صلباً مثل خشب.\u003c/p>\u003cp>سحب يده كأنها احترقت.\u003c/p>\u003cp>سمع خلفه صوتاً مختنقاً. كان شياو دو واقفاً عند الباب، يضغط يده على فمه، وعيناه متسعتان بدموع لم تسقط.\u003c/p>\u003cp>«هذه... هذه العمة لي.» همس. «كانت تبيع الخضار المخللة في السوق. كانت تعطيني حبات منها إذا مررت.»\u003c/p>\u003cp>لم يجب لين.\u003c/p>\u003cp>«لماذا لم تطلب؟ لماذا لم تأتِ إلى العمة هو؟ كنا سنعطيها...»\u003c/p>\u003cp>«لا أعرف.»\u003c/p>\u003cp>نظر إلى الموقد الفارغ. لا حطب بجانبه، ولا طعام على الرف. لم يعرف كم بقيت وحدها، أو ما الذي منعها من الخروج. كان شياو دو ينتظر جواباً، فلم يجد ما يقوله له.\u003c/p>\u003cp>حمل لين الجثة.\u003c/p>\u003cp>كانت خفيفة على نحو لا يحتمل. لا وزن لها تقريباً، عظام ملفوفة بخرق، ومتجمدة في وضعها الملتف، فلم يستطع أن يمد ساقيها. حملها كما هي، على ذراعيه، وحرص أن يغطي وجهها، وخرج من الباب إلى الفجر الرمادي. وصل إلى النزل بعد عشر دقائق من المشي البطيء على الثلج، وشياو دو يمشي خلفه ولا يتكلم.\u003c/p>\u003cp>لم يتكلم لين طوال الطريق. كان يشعر بالبرد الذي في جسدها يتسرب إلى صدره، ويعرف أنه لن ينساه. وفي منتصف الطريق انزلق ساعد المرأة عن صدرها، وسقطت يدها الصغيرة المعقوفة، وفيها خيط من القنب كانت تقبض عليه، ربما تفتل منه حبلاً لحطب لم يأتِ. أعاد اليد إلى صدرها بإصبعين مرتجفين، ثم واصل.\u003c/p>\u003cp>مر بهم رجل يحمل جرة، فتوقف، ونظر إلى الحمل في ذراعي لين، ثم أنزل عينيه ومضى بلا كلمة. وفي نافذة بيت، رأى لين ستارة تتحرك وتعود إلى مكانها. عادت المرأة وراءها تغلق الشباك، بينما أسرع صاحب الجرة إلى النزل قبلهما ليفتح الباب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يكن ممكناً دفنها.\u003c/p>\u003cp>قال العجوز يانغ ذلك بصوت منخفض حين اجتمع الرجال في الساحة. «الأرض حجر. ثلاثة أشبار من الصقيع. نحتاج إلى نار كبيرة تذيب الأرض يومين قبل أن نحفر.»\u003c/p>\u003cp>«وكم من الحطب؟»\u003c/p>\u003cp>«حطب ثلاثة بيوت.»\u003c/p>\u003cp>لم يقل أحد شيئاً.\u003c/p>\u003cp>وضعوها في الحظيرة الخلفية للنزل، مغطاة بحصير نظيف، بجانب الأكياس الفارغة. ستبقى هناك حتى يجدوا حطباً يكفي لتليين موضع القبر.\u003c/p>\u003cp>وقفت هو سانيانغ عند الباب، ويدها على إطاره، وعيناها على الحصير. لم تبكِ. قالت فقط، بصوت جاف:\u003c/p>\u003cp>«كانت تأخذ مني البصل في الخريف، ولا تدفع. وأنا أعرف أنها لا تملك. قلت لنفسي: ستدفع في الربيع.» ثم أغلقت الباب بحذر.\u003c/p>\u003cp>لم يتكلم لين. جلس على جذع قرب الحظيرة، ويداه بين ركبتيه، ينظر إلى الثلج الذي علق في فراء حذائه ولم يذب.\u003c/p>\u003cp>جاءت شين يان وجلست بجانبه. لم تضع يدها على كتفه، ولم تقل شيئاً. كانت تنظر إلى دفترها المفتوح على ركبتيها، وفيه صفحة كتبت عليها في اللحظات الماضية، بيد ثابتة وأنفاس غير ثابتة، ثلاثة أعمدة.\u003c/p>\u003cp>«بيوت القرية.» همست. «مئة وأربعة بيوت. أنا أعرف نصفها. هو سانيانغ تعرف الباقي.»\u003c/p>\u003cp>«يان...»\u003c/p>\u003cp>«كم بيتاً بلا حطب؟»\u003c/p>\u003cp>لم يجب لين.\u003c/p>\u003cp>«أحصيت من تكلم معي. من ذكر البرد. من لم يأتِ في يوم الوعد لأن عنده شيئاً آخر ينتظره.» رفعت الدفتر. «أحد عشر بيتاً عندي هنا. على الأقل. بيوت لا أعرف إن كانت تأكل ثلاث مرات.»\u003c/p>\u003cp>كان صوتها منخفضاً جداً، ولم تكن تبكي.\u003c/p>\u003cp>قال: «لن نستطيع...»\u003c/p>\u003cp>«لا أطلب منك أن تفعل. أخبرك فقط.» أغلقت الدفتر. «حتى لا نقول بعد الآن: لم نكن نعلم.»\u003c/p>\u003cp>نظر لين إلى الحظيرة المغلقة، حيث ترقد المرأة بين أكياس فارغة.\u003c/p>\u003cp>«لو أعطينا كل بيت من هؤلاء الأحد عشر حمل عربة...»\u003c/p>\u003cp>«حمل عربة من أين؟ هو سانيانغ تشتري حطبها بالدين، ووانغ العجوز يغش في الوزن. نحتاج فؤوساً ورجالاً وعربة تذهب إلى الغابة.» أمسكت يده. «لا أقول لا. أقول: ليس قبل أن نعرف كيف. وإلا متنا معهم.»\u003c/p>\u003cp>فتح لين يده المغلقة، ثم أغلقها على يدها. أراد أن يعدها بحطب الأحد عشر بيتاً، لكنه لم يعرف حتى ثمن العربة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وصل العم تيان بعد الظهر.\u003c/p>\u003cp>كان الفلاح العجوز الذي أصلح له لين عجلة عربته منذ أسابيع، الواقف الآن عند الباب بقبعته القشية وحماره الصغير. لم يكن قد دعاه أحد. جاء لأنه سمع.\u003c/p>\u003cp>قال: «سمعت أنكم تحتاجون دابة.»\u003c/p>\u003cp>نظر لين إلى الحمار. كان نحيلاً، شعره الرمادي خشناً، يبحث بأنفه في الثلج عن شيء يأكله.\u003c/p>\u003cp>«من أخبرك؟»\u003c/p>\u003cp>«يانغ العجوز.» حرك العم تيان قبعته بين يديه. «قال لي ما قلتماه عن الدابة التي تدور حول عمود.» ثم أضاف بصوت منخفض: «لا أطلب نقداً. أطلب فقط...»\u003c/p>\u003cp>«ماذا تطلب؟»\u003c/p>\u003cp>«لا شيء.» نظر إلى الأرض. «أنت أصلحت عجلتي بلا أن تطلب أكثر. هذا ما أذكره.»\u003c/p>\u003cp>ومد يده بحبل الحمار.\u003c/p>\u003cp>لم يأخذه لين فوراً. نظر إلى تيان، ثم إلى الحيوان الذي ينفض الثلج عن أذنه.\u003c/p>\u003cp>«لن نربطه اليوم. على يانغ أن يصنع العجلة أولاً. تعال به حين يطلبك لنقيس مكان سيره.»\u003c/p>\u003cp>أومأ تيان. «أبقيه عندي إذن. يعرف معلفه.»\u003c/p>\u003cp>شد الحبل برفق، لكن الحمار ظل يبحث قرب العتبة. انحنى شياو دو والتقط حفنة قش يابس من تحت السقف، ومدها إليه. أكلها من راحته، فمسح الصبي أنفه بكمه.\u003c/p>\u003cp>وقفت شين يان عند الباب، ودفتر الأحد عشر بيتاً في يدها. رفعت عينها إلى لين، ثم أعادت الدفتر إلى جيبها. تبع نظره الحبل في يد تيان حتى ابتعدا على الطريق.\u003c/p>"},{"n":18,"t":"الفصل الثامن عشر: تروس من خشب","b":"\u003cp>لم يقطع العجوز يانغ الوتد الأول بالمنشار.\u003c/p>\u003cp>وقف في ورشته المؤقتة تحت سقف خيش مشدود إلى أعمدة بين الطاحونة والحظيرة. أمامه جذع زان جاف انتُزع من عوارض بيت مهدوم، وفي يده فأس صغيرة حادة. دار حول الخشب مرة، ثم ثانية وثالثة، يتحسس الشقوق واتجاه خطوطه بأطراف أصابعه.\u003c/p>\u003cp>سأله شياو دو، الذي وقف قريباً يحمل مصباحاً لا حاجة إليه: «لماذا لا تبدأ؟»\u003c/p>\u003cp>«لأن الخشب لم يقل لي بعد.»\u003c/p>\u003cp>«يقول؟»\u003c/p>\u003cp>«يقول من أين ينشق.» ضرب الفأس ضربة واحدة قصيرة على طرف الجذع، فانفلقت منه شظية طويلة نظيفة كأنها قُصّت بخيط. «هنا. هل رأيت؟ لو قطعت بالمنشار من الجهة الأخرى، لقطعت ألياف الخشب كلها، ولانكسر الوتد عند أول حمل. أما هكذا...» رفع الشظية، وثناها بين إصبعيه، فانحنت ولم تنكسر. «هكذا يتحمل الضغط أفضل. وإذا عطب أخرجناه وبدلناه.»\u003c/p>\u003cp>«وجياو علّمك هذا؟»\u003c/p>\u003cp>«جياو علمني أن أسأل الخشب. أما الباقي فتعلمته من الأخطاء.»\u003c/p>\u003cp>كان لين يراقب من بعيد، ومعه لوحة بيضاء في ذهنه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فتحها صباح اليوم الرابع والخمسين، وبدأ يملؤها بحذر.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخطيط الصناعي — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>المشروع: ترس الفانوس لإدارة الحجر بدابة\u003c/div>\u003cdiv>المراحل: (1) تجهيز الخشب (2) التركيب (3) التجربة\u003c/div>\u003cdiv>المدة المقدرة: 6 أيام\u003c/div>\u003cdiv>تنبيه: دقة الأوتاد والقضبان تحتاج إلى قياس مباشر، ولا تتحقق منها هذه الأداة.\u003c/div>\u003cdiv>الثقة: 58%\u003c/div>\u003cdiv>طاقة التكامل: 90%\u003c/div>\u003c/div>\u003cp>توقف عند نسبة الثقة وهز رأسه.\u003c/p>\u003cp>«ثمانية وخمسون.» قال بصوت مسموع. «مرة أخرى.»\u003c/p>\u003cp>كانت شين يان تقف بجانبه على الصخرة، ودفترها في يدها، وفي الأخرى كيس فيه حصى صغيرة. رفعت حاجبها دون كلمة.\u003c/p>\u003cp>قال: «لن أخفيه هذه المرة.»\u003c/p>\u003cp>«هذا ما أريد أن أسمعه.»\u003c/p>\u003cp>«ثمانية وخمسون. لأن الأداة لا تعرف الخشب، ولا تعرف العجوز يانغ، ولا تعرف الحمار.»\u003c/p>\u003cp>«ولا تعرف الدائرة.» أخذت القلم. «لكنني أعرفها.»\u003c/p>\u003cp>رسمت على الأرض الثلجية بعصا دائرة العجلة الكبيرة، ثم رسمت تحت حافتها قفصاً صغيراً على جانبه. اقترب العجوز يانغ ووقف يتفحص الرسم.\u003c/p>\u003cp>قالت: «الحمار يمشي حول عمود ذراعه ثلاثة أمتار. يخطو بقدر خطوة بطيئة، نحو خمسة وتسعين سنتيمتراً في الثانية في التجربة. الدائرة التي يرسمها طولها تسعة عشر متراً تقريباً.» أشارت إلى الدائرة الكبيرة. «يدور ثلاث دورات في الدقيقة. هذا بطيء جداً. الحجر يحتاج إلى ثلاثين دورة على الأقل ليطحن الدخن دون أن يسخنه.»\u003c/p>\u003cp>قال لين: «عشرة أضعاف.»\u003c/p>\u003cp>«عشرة أضعاف.» رفعت العصا. «عجلة كبيرة بستين وتداً، وفانوس صغير بستة قضبان. كل دورة للعجلة الكبيرة، يدور الفانوس عشر دورات.»\u003c/p>\u003cp>نظر العجوز يانغ إلى الأرض. «ستون وتداً.»\u003c/p>\u003cp>«ستة قضبان.»\u003c/p>\u003cp>«ستة قضبان صغيرة جداً يا بنتي.»\u003c/p>\u003cp>«هل تعرف طريقة أخرى؟»\u003c/p>\u003cp>قلّب العجوز العصا في أصابعه ثم قال: «لا.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق التجهيز أربعة أيام.\u003c/p>\u003cp>كان العجوز يانغ يعمل ببطء لا يعرف التعجل، يرفض تثبيت وتد قبل أن يقيسه مرتين. ساعده لاو دونغ في الفأس، وكان يقطع الأوتاد الخام، وتشيو في الإزميل، يصقل كل وتد حتى تصير سطوحه ملساء كسطح العظم. جلس لين وشين يان إلى جانبهم، يقيسان ويسجلان.\u003c/p>\u003cp>في اليوم الثاني، كسر لاو دونغ وتداً.\u003c/p>\u003cp>لم يقل شيئاً. نظر إليه، ثم رماه في الكومة، وبدأ آخر. لكن لين رأى أن يده ارتجفت، وأن أذنيه احمرتا. اقترب العجوز يانغ ورفع الوتد المكسور، وفحصه، وقال دون أن يرفع صوته: «العقدة.» ثم أضاف: «لا بأس. الخشب يخبئها حتى الضربة الأخيرة.»\u003c/p>\u003cp>وفي اليوم الثالث، جاء الفلاح العجوز تيان بحماره ليقيس عليه المسافة.\u003c/p>\u003cp>سار الحمار حول عمود مؤقت، ثل
