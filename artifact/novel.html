ن المقبض. جر الكرسي الصغير وجلس عليه ليفرك قاع القدر، ثم سأل إن كان يستطيع أخذ الماء الدافئ الباقي إلى آن. أومأت عمته من دون أن ترفع السكين.\u003c/p>\u003cp>وقف لين قرب رف الخبز. احتاج أن ينتظر خروج الصبي، وحين خرج وجد نفسه يرتب أرغفة مرتبة أصلًا. نقلت هو سانيانغ لوح البصل إلى النار، وحركت الزيت بطرف المغرفة.\u003c/p>\u003cp>قال: «الطاحونة ستفتح بعد الطعام.»\u003c/p>\u003cp>«يانغ ذهب إليها. معه العم تيان.»\u003c/p>\u003cp>«لم أُكلفهما بذلك.»\u003c/p>\u003cp>«فتحاها قبل الظهر. لا تتركهما وحدهما إلى الليل.»\u003c/p>\u003cp>وصلت رائحة البصل الساخن إلى حلقه. كان يسمع فرقعة الزيت، ومن الساحة وقع عصا سون على الأرض. أراد أن يسأل عمّا سمعته، لكن المرأة مدت إليه صينية فيها أوعية.\u003c/p>\u003cp>«خذها. انتبه، واحد منها مشقوق من جانبه.»\u003c/p>\u003cp>وجد الشق، فوضع الوعاء جانباً وحمل الصينية. عند باب الحظيرة مد رجل من نزلاء الغرفة الكبيرة يده ليسند الطرف الآخر. كان قد رأى توزيع الخبز، وبقي ينظر إلى الأوعية.\u003c/p>\u003cp>«هؤلاء يقيمون بلا أجر؟»\u003c/p>\u003cp>«اليوم ليس عندهم ما يدفعونه.»\u003c/p>\u003cp>«دفعت عن مبيتي ليلة أمس.»\u003c/p>\u003cp>انتظر لين أن يكمل، فلم يفعل. قال: «وماذا تريد أن أفعل؟»\u003c/p>\u003cp>تغير وجه الرجل. «لا أطلب أن تطردهم. سألت كيف ستمتلئ القدور غداً. أنا أعطيت الصبي حطبتين هذا الصباح، ولم يبق لي إلا ما أرجع به إلى بيتي.»\u003c/p>\u003cp>أحس لين بالصينية تميل في يده فعدلها. كان قد حسب السؤال اتهاماً قبل أن يسمع آخره.\u003c/p>\u003cp>«لم أعرف أنك أعطيته.»\u003c/p>\u003cp>«لا يهم أن تعرف. المهم ألا تعدهم بما في مخزن غيرك.»\u003c/p>\u003cp>أمسكت شين يان طرف الصينية حين بلغا الأطفال. شكرت الرجل على الحطب، فعاد إلى الغرفة الكبيرة، وبقي لين معها يوزع الطعام. قدم صبي نصف قشرة قرع لأخته، فقلبتها شين يان لتتحسس موضع التسرب قبل أن تملأها. لم يزد لين في وعاء أحد حتى رأى آخر طفل يحمل نصيبه.\u003c/p>\u003cp>حين أعاد الصينية، كانت هو سانيانغ قرب النار. وضعها أمامها وقال: «سأسألك عما بقي قبل أن أعد أحداً بشيء.»\u003c/p>\u003cp>نظرت إلى الأوعية الفارغة ثم إليه. «افعل.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرج لين وشين يان إلى البئر بعد الطعام. حمل الدلوين، وحملت هي قطعة قماش لتغطي أحدهما. كان الماء الأول للشرب، والثاني لغسل اللفافات بعيدًا عن الحوض.\u003c/p>\u003cp>على الطريق ضغطت يدها على خاصرتها وتوقفت. أنزل لين الدلوين فورًا.\u003c/p>\u003cp>قالت: «ليس وجعًا. قف قليلًا.»\u003c/p>\u003cp>استندت إلى جدار منخفض. من وراء الجدار جاء صوت رجل يضرب حطبًا، وصوت امرأة تقول له إن القطع ما زالت كبيرة.\u003c/p>\u003cp>قال لين بلغتهما: «كان يمكن أن أقول إنني نسيت الاسم.»\u003c/p>\u003cp>التفتت إليه ببطء. «هل أردت أن تقولها؟»\u003c/p>\u003cp>«جاءت في رأسي. بالأمس، عند اللوح.»\u003c/p>\u003cp>«ثم يأتي باسم ثانٍ.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>مدت يدها إلى قماش الدلو، وأصلحت طرفًا يجر على الأرض. قالت: «سنسمع أسماء كثيرة. لا أريد أن نختار واحدًا منها ونلبسه.»\u003c/p>\u003cp>راقب بخار أنفاسه. «لم أطلب منه أن يرسم.»\u003c/p>\u003cp>«ولم أقل إنك طلبت. لكننا نستطيع أن نحوّل كلامه إلى غطاء جديد إذا لم ننتبه.»\u003c/p>\u003cp>مر طفلان يحملان سلة فارغة، فسكتا حتى ابتعدا. حمل لين الدلوين من جديد، لكن شين يان ظلت عند الجدار.\u003c/p>\u003cp>«العمة.» قالت الكلمة بلغتهما أيضًا. «لم تسألنا أمامه. هذا لا يعني أنها لم تسمع.»\u003c/p>\u003cp>«سأكلمها.»\u003c/p>\u003cp>«بماذا؟»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>قالت: «حين يقول وو إن كفالتهما مبنية على كلام ناقص، لن يطلب الثمن من سون. سيطلبه من المرأة التي وضعت ختمها.»\u003c/p>\u003cp>كان قد فكر في احتمال الطرد، وفي السخرة، وفي الدفتر الذي تنتقل به الأسماء من قرية إلى أخرى. لم يتخيل هو سانيانغ واقفة وحدها أمامه وهو يسألها عمّا كانت تعرفه.\u003c/p>\u003cp>قال: «نحن لم نطلب منها أن تقول الجنوب.»\u003c/p>\u003cp>خرجت الجملة، فكرهها قبل أن ينتهي منها.\u003c/p>\u003cp>نظرت إليه شين يان، ثم أبعدت يدها عن الجدار. «لكننا تركناها تقوله عنّا.»\u003c/p>\u003cp>سارا إلى البئر من غير كلام. عند الحافة حوّل لين الحبل إلى يده اليسرى؛ اليمنى كانت قد احمرت من حمل المقبض. جلست شين يان على الحجر تنتظر، وعيناها على الطريق إلى النزل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عادا والدلْوان يصطدمان بركبتي لين. في الساحة كانت هو سانيانغ تساعد رجلًا على تقوية مزلاج الحظيرة. سمعت الماء، فطلبت أن يضعا دلو الغسل عند الحوض الخارجي.\u003c/p>\u003cp>فعل لين. تناولت شين يان الغطاء ونشرته فوق مقبض الحبل. لم تدخلا قبل أن تنتهي هو سانيانغ من فحص المزلاج بيدها؛ جذبته مرتين، ثم دفعت الباب بكتفها.\u003c/p>\u003cp>قالت للرجل: «يبقى هكذا الليلة.»\u003c/p>\u003cp>دخل الرجل، وبقوا ثلاثتهم في الساحة. صعدت من فتحة المطبخ رائحة البصل المحمر. داخل الحظيرة ضحك طفل ضحكة قصيرة، ثم سعل طويلًا.\u003c/p>\u003cp>قال لين: «هو سانيانغ، أريد—»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>لم يكن صوتها مرتفعًا. نزعت خيطًا علق بمسمار المزلاج، ولفته حول إصبعها.\u003c/p>\u003cp>«شياو دو يقول أشياء كثيرة. يانغ يقول قليلًا. وسون ورفاقه لم يسمعوا ما يقوله أهل القرية عنكما.» رفعت عينيها. «لكنهم سألوا، وأنت لم تعرف.»\u003c/p>\u003cp>قال: «نعم.»\u003c/p>\u003cp>«وشين يان؟»\u003c/p>\u003cp>قالت شين يان: «لا أعرف المعبر أيضًا.»\u003c/p>\u003cp>أومأت هو سانيانغ، كأنها تسجل مقدارًا في رأسها. مسحت كفيها بثوبها، ومشت نحو المطبخ. عند العتبة توقفت، فلم يعد أمامهما إلا أن يتبعاها.\u003c/p>\u003cp>كان على الطاولة وعاء ماء وثلاثة أكواب. أبعدت اثنين وجلست، وتركت المقعد المقابل فارغًا لهما.\u003c/p>\u003cp>قال لين: «لا نعرف أسماء القرى التي—»\u003c/p>\u003cp>رفعت يدها. «لا أسألك عن الأسماء.»\u003c/p>\u003cp>التصقت قدمه بالأرض لحظة. جلس إلى جانب شين يان، وشعر بخشب المقعد البارد من خلال ثوبه.\u003c/p>\u003cp>دفعت هو سانيانغ الكوب الوحيد بعيدًا عنها، فصار وجه الطاولة خاليًا.\u003c/p>\u003cp>«صفا لي الطريق الذي جئتما منه.»\u003c/p>"},{"n":31,"t":"الفصل الحادي والثلاثون: السؤال الصحيح","b":"\u003cp>في صباح اليوم الثامن عشر بعد المئة، لم تكن هو سانيانغ قد أعادت سؤال الطريق. أخذت منهما في الليلة السابقة وصف التل والحقل الذي وجدا نفسيهما فيه، قالت لهما: «لم أسأل أين وجدتما نفسيكما. سألت عن الطريق قبل ذلك.» لم يجدا جواباً، فأطفأت المصباح.\u003c/p>\u003cp>الآن كانت تقف عند باب النزل، وإلى جانبها الكاتب وو، تمسك كميها فوق معصميها من برد الصباح.\u003c/p>\u003cp>قال وو للين: «صباح الخير. قيل لي إن عندك ضيوفًا كثيرين.»\u003c/p>\u003cp>قالت هو سانيانغ: «عندي جائعون. الضيف يختار متى يأتي.»\u003c/p>\u003cp>ابتسم الكاتب ابتسامة صغيرة، ومسح الثلج عن حافة حذائه قبل الدخول. حمل خلفه شاب صندوق الكتابة، ولم يدخل حتى أشارت إليه صاحبة النزل بالطاولة التي يستطيع استعمالها.\u003c/p>\u003cp>قال وو: «أحتاج أسماءهم، لا أموالهم. على الأقل هذا الصباح.»\u003c/p>\u003cp>لم تبتسم. ذهبت إلى الموقد ورفعت قدر الماء، وتركت لهما طرف الطاولة القريب من الضوء. أخرج الشاب دفترًا، ومحبرة صغيرة، وقطعة خشب يحط عليها الورق.\u003c/p>\u003cp>كان شياو دو يراقب القلم. نظر إليه وو وقال: «ساعدني في إحضار الناس بيتًا بيتًا. لا أريد خمسة يجيبون عن طفل واحد.»\u003c/p>\u003cp>قال الصبي: «بعضهم ليسوا من بيت واحد.»\u003c/p>\u003cp>«إذن يعرفون ذلك قبلي. أحضر من يعرف.»\u003c/p>\u003cp>خرج شياو دو. بقي لين عند الباب، حتى طلب الكاتب منه أن يفتح المصراع الآخر ليدخل الضوء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاءت أولًا المرأة ذات الرضيع وأمها. وقفتا بدل الجلوس، فأشار وو إلى المقعد. سأل المرأة عن اسمها واسم أبيها والموضع الذي خرجت منه، ثم عاد إلى الاسم الأول حين اختلف نطق أمها له.\u003c/p>\u003cp>«هل هذا اسمك في بيت أبيك، أم الاسم الذي يناديك به زوجك؟»\u003c/p>\u003cp>أجابت، فكتب الشاب. سأل عن الزوج. سكتت المرأة، ورفعت أمها يديها عن حجرها.\u003c/p>\u003cp>قالت: «تركناه عند الطريق. لم نقدر أن نحمله.»\u003c/p>\u003cp>انتظر وو لحظة قبل أن يملي الجواب. «رأيتموه يموت؟»\u003c/p>\u003cp>قالت المرأة: «تنفس حين مشينا.»\u003c/p>\u003cp>رفع وو عينيه إلى كاتبه. «غائب. لا تكتب ميتًا.»\u003c/p>\u003cp>شدت المرأة الرضيع إلى صدرها. سألها الكاتب إن كان أحد هنا يعرف زوجها من قبل الطريق، فأشارت إلى الحظيرة. أرسل شياو دو يبحث عن الشاهد، ولم يحتج إلى شرح معنى الكلمة مرة ثانية.\u003c/p>\u003cp>وقف لين عند الحائط وقدماه تبردان. في أول الشتاء جلس هنا هو وشين يان، وكان يريد أن ينتهي الرجل من الكتابة بسرعة. الآن رأى كيف يتوقف القلم عند كلمة غائب، وكيف يستطيع أن يكمل بعدها إن هز شخص آخر رأسه.\u003c/p>\u003cp>حين جاء الأب، لم يحمل شيئًا. جلس وصوته مسموع بالكاد. سأله وو عن الطفل، فأجاب: «يون.»\u003c/p>\u003cp>قال الكاتب: «مات في الطريق؟»\u003c/p>\u003cp>«قبل وصولنا بيوم.»\u003c/p>\u003cp>سأل عن عمره، وعن أمه، وكتب ما استطاع الأب أن يقوله. حين ارتجفت اليدان على الطاولة، أخذ وو الورقة المكتوبة ووضعها بعيدًا عن الماء المسكوب قرب الكوب.\u003c/p>\u003cp>قال: «أين الجثمان الآن؟»\u003c/p>\u003cp>أجابت هو سانيانغ من الموقد: «وراء المخزن. الباب مغلق.»\u003c/p>\u003cp>«هل يراه غير أبيه؟»\u003c/p>\u003cp>قال لين: «أنا حملت المصباح. وهو وضعه هناك.»\u003c/p>\u003cp>نظر إليه وو، ثم أومأ لكاتبه، فكتب اسمه في الهامش.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلس سون لي بعد ذلك. احتاج إلى وقت ليدني قدمه من الطاولة، ولم يساعده وو إلا بإبعاد المقعد قليلًا.\u003c/p>\u003cp>قال: «قيل إنك من قرى النهر الكبير.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«أي ضفة؟»\u003c/p>\u003cp>ذكر سون قرية أبيه ثم المعبر، ورسم بإصبعه على الخشب حركة النهر نفسها التي رسمها في الرماد. كان وو يسأله بين جملة وأخرى عن السوق الذي قصدوه، وعن آخر مرة دفعوا فيها حبوب الضريبة قبل الهرب.\u003c/p>\u003cp>لم يعرف سون اسم الجابي. عرف لون قبعة رجل رافقه، وأن المكيال كان مشقوقًا فربطه بخيط. كتب الشاب هذا كله، ثم رفع عينيه ينتظر إن كان سيده يريد اختصاره.\u003c/p>\u003cp>قال وو: «اتركه.»\u003c/p>\u003cp>حكت ريشة القلم الورق. وقف لين مستقيمًا بعدما وجد كتفه يضغط الجدار، ودخلت شين يان من المطبخ بوعاء ماء للكتابة.\u003c/p>\u003cp>طلب منها وو أن تبقى لحظة.\u003c/p>\u003cp>«أنت تسمع حديث هؤلاء منذ يومين، سيد لين. هل لهجتهم تشبه لهجتك؟»\u003c/p>\u003cp>قال لين: «أفهمهم. لكن بعض ألفاظهم مختلفة.»\u003c/p>\u003cp>«ما الذي يختلف؟»\u003c/p>\u003cp>ذكر لفظًا استعمله سون عن حافة النهر، وآخر عن جراب الطعام. شرحهما سون بإيماءتين، كأنهما أمران يسهل شرحهما لمن لم ير الماء قط.\u003c/p>\u003cp>التفت وو إلى سون: «والحروف التي تكتبها زوجة لين، هل يكتب بها أهل قريتك؟»\u003c/p>\u003cp>قال سون: «لم أرَ كتابتها.»\u003c/p>\u003cp>ناولته شين يان صفحة لا تحمل إلا أرقام الطعام والقماش. حدق فيها قليلًا ثم أعادها.\u003c/p>\u003cp>«لا أعرفها. لكنني لا أقرأ خط الكاتب أيضًا.»\u003c/p>\u003cp>توقف الشاب عن الكتابة، ثم استأنف حين نظر إليه وو.\u003c/p>\u003cp>قال الكاتب: «جيد. عدم معرفتك بالخط لا يثبت أن الناس لا يعرفونه. أسألك عن شيء تستطيع الشهادة به.»\u003c/p>\u003cp>ثم أشار إلى لين. «هل تعرف هذا الرجل من قبل أن تصل إلى القرية؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«هل يشبه كلامه كلام أهل معبرك؟»\u003c/p>\u003cp>فكر سون قبل الإجابة. «بعضه. ليس كله.»\u003c/p>\u003cp>«هل تستطيع أن تشهد أنه من قرى النهر الكبير؟»\u003c/p>\u003cp>رفع سون رأسه إلى لين. بقيت يد لين على حافة الباب، ولم يشر إليه بعينه ولا برأسه.\u003c/p>\u003cp>قال سون: «لا أعرفه. لن أشهد بما لا أعرف.»\u003c/p>\u003cp>أومأ وو. «هذا ما أردت أن أسأل عنه.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>نهض سون، واحتك طرف عصاه برجل الطاولة. تناول لين المقعد كيلا ينقلب، وخرج معه إلى الساحة.\u003c/p>\u003cp>في الخارج كان ضوء النهار أبيض مؤلمًا بعد الغرفة. رفع سون كمه إلى عينيه، ثم خفضه حين انزلق طرف عصاه فوق ماء تجمع على الجليد.\u003c/p>\u003cp>قال: «لم أقل إنك تكذب.»\u003c/p>\u003cp>«سمعت ما قلت.»\u003c/p>\u003cp>«بعضهم يظن إن أكلت من قدر رجل، وجب أن تنطق كما يريد.»\u003c/p>\u003cp>أزاح لين بقدمه قطعة خشب تعترض طريقه. «لن أطلب ذلك.»\u003c/p>\u003cp>توقف سون. أمسك العصا من أعلاها بكلتا يديه، وأسند ثقله إلى القدم السليمة.\u003c/p>\u003cp>«أردت أن أجد أحدًا يعرف أين ضاع أخي.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لا. أنت سمعتني أقولها. هذا كل شيء.»\u003c/p>\u003cp>رفع لين وجهه ثم خفضه. بقي سون لحظة ينتظر، كأنه ندم على حدته، ثم أشار إلى الخشب المزاح.\u003c/p>\u003cp>«شكرًا لهذا.»\u003c/p>\u003cp>مضى إلى الحظيرة. لم يمد لين ذراعه ليسنده، فقد صار يمشي متوازنًا، والتفت إلى النزل حين نادته شين يان.\u003c/p>\u003cp>كانت تقف عند العتبة بورقة في يدها. «يريدنا أن نجلس.»\u003c/p>\u003cp>«ماذا يريد؟»\u003c/p>\u003cp>«اسأله.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلسا أمام وو. لم يخرج دفتره الأول، بل فتح صفحة صغيرة من الأوراق التي في صندوقه. قربت شين يان مقعدها من الضوء، وبدأت تقرأ السطر الأعلى ببطء.\u003c/p>\u003cp>قال الكاتب: «تقدمت.»\u003c/p>\u003cp>وضعت إصبعها تحت حرف. «هذه تعني شاهدًا؟»\u003c/p>\u003cp>«هذه تعني مسؤولًا. الحرف الذي يجاورها للشاهد.»\u003c/p>\u003cp>قارنتهما، ثم قالت: «المسؤول يدفع؟»\u003c/p>\u003cp>ابتسم وو. «أحيانًا. ومن الخير أن تعرفي الفرق قبل أن تضعي اسمك.»\u003c/p>\u003cp>قالت: «نسأل عن اسم هو سانيانغ.»\u003c/p>\u003cp>تحركت صاحبة النزل قرب الموقد، ولم تقترب.\u003c/p>\u003cp>رفع وو الورقة قليلًا. «اسمها في الكفالة الأولى. ما زالت نافذة.»\u003c/p>\u003cp>«عن أي شيء؟»\u003c/p>\u003cp>قال لين: «يان—»\u003c/p>\u003cp>وضعت يدها على طرف مقعده من غير أن تنظر إليه، وأعادت السؤال.\u003c/p>\u003cp>«إذا كان خبر المنشأ ناقصًا، ما الذي تدفعه الكفيلة؟ وما الذي نتحمله نحن؟»\u003c/p>\u003cp>أعاد الكاتب الورقة إلى الطاولة. بدت المجاملة على وجهه أخف الآن.\u003c/p>\u003cp>«يتوقف ذلك على الناقص. الغائب عن بيته شيء، والهارب من تكليف شيء آخر. إذا صح أنها عرفت أمرًا وأخفته، تُسأل عمّا أخفته. وإذا ضمنت أناسًا لا تعرف عنهم ما قالت إنها تعرفه، نراجع الضمان.»\u003c/p>\u003cp>قالت هو سانيانغ: «قلت إنهما عملا عندي. قلت ذلك أمامك.»\u003c/p>\u003cp>«صحيح.» أدار وو وجهه إليها. «وذلك لم يتغير.»\u003c/p>\u003cp>«لم أقل إنني زرت قريتهما.»\u003c/p>\u003cp>«ولهذا أسأل الآن، ولا أكتب حكمًا.»\u003c/p>\u003cp>قالت شين يان: «أريد أن يكون السؤال مكتوبًا. حتى نرد على الشيء نفسه.»\u003c/p>\u003cp>تأملها الكاتب لحظة، ثم أملى على الشاب عبارة قصيرة. قرأها بصوت عالٍ حين انتهى: إثبات المنشأ، واستمرار مورد الرزق، وبيان الكفالة.\u003c/p>\u003cp>لم تلتقط شين يان كل الحروف. طلبت إعادة الكلمة الثانية، فأعادها من غير أن يسخر. كررتها، ثم نقلت السطر إلى دفترها بخط أبطأ.\u003c/p>\u003cp>مد الشاب يده إلى السجل قبل أن يجف آخر سطر، فأوقفه وو بإشارة. نثر فوق الحبر قليلًا من الرمل الناعم، ثم مال بالصفحة ليعيد الباقي إلى وعائه. تابعت شين يان الحركة، ورفعت يدها عن دفترها بعدما وجدت بقعة حبر على طرف الخنصر.\u003c/p>\u003cp>قالت: «هل لكل واحد من النازحين كفيل؟»\u003c/p>\u003cp>«لم أكتب إقامة دائمة لأحد. كتبت وصولهم.»\u003c/p>\u003cp>«ومتى يصير الوصول إقامة؟»\u003c/p>\u003cp>«حين يجدون موضعًا يبقون فيه وموردًا يأكلون منه. أو حين يطلبهم أهلهم، أو تكليف معلوم.»\u003c/p>\u003cp>قالت هو سانيانغ: «الحظيرة ليست موردًا، وما في قدري لا يكفي قريتين.»\u003c/p>\u003cp>«لذلك أحتاج العدد الصحيح.» قلب وو ورقة صغيرة. «وأحتاج ألا يسجل الصبي من يغيب بحثًا عن الحطب على أنه رحل من القرية.»\u003c/p>\u003cp>رفع شياو دو رأسه من وراء الحوض. «أسأله أولًا.»\u003c/p>\u003cp>«واسأل من رآه يخرج، إذا لم تجده.»\u003c/p>\u003cp>خرجت هو سانيانغ إلى الحظيرة. تبعها لين حتى الباب، فطلبت منه أن يحمل لوحًا غطوا به فتحة قرب الأرض. كان الماء قد تجمع تحته، ورطّب طرف فراش. رفعه لين ونقل القش المبتل إلى الخارج، ثم جاء بقطعتين من الحطب ليرفع عليهما طرف اللوح.\u003c/p>\u003cp>كانت آن تنظر من وراء العباءة. سألت إن جاء أحد يأخذهم. قال لين إن الرجل يكتب الأسماء، فسألت السؤال نفسه مرة أخرى، ولم يجد إلا أن يقول إنه لم يطلب أخذهم الآن.\u003c/p>\u003cp>حين رجع إلى الغرفة، كان الشاب قد انتهى من نثر الرمل. ألقى لين نظرة على يديه الوسختين قبل أن يجلس، ومسحهما جيدًا ثم أبقاهما بعيدتين عن السجل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين أغلق الكاتب دفتر النازحين، بقيت ورقة الزوجين مفتوحة. رفع شياو دو الأكواب، ثم أبقى يده فوق كوب عمته منتظرًا. أزاحته هي إليه.\u003c/p>\u003cp>قال وو: «الحسابات التي تستعملينها، هل تستطيعين أن تعيديها بحروفنا؟»\u003c/p>\u003cp>«الأعداد الصغيرة. ومع وقت أكثر، البقية.»\u003c/p>\u003cp>«أجر الطحن مثلًا؟»\u003c/p>\u003cp>«نعده أمام صاحبه، ثم نسجل ما أخذنا. بعضها حبوب، وبعضها نحاس.»\u003c/p>\u003cp>أخرجت صفحة من حساب الطاحونة. غطت الطرف الذي كتبت فيه ملاحظات بلغتهما، وأشارت إلى الوزن ثم إلى الأجر. سأل عن كيس يعود باسم رجل مرتين، فقالت إن قيده الثاني يوم وعد، بلا أجر.\u003c/p>\u003cp>قال: «والحمار؟»\u003c/p>\u003cp>«طحن بيت صاحبه مجانًا، وجزء من أربعين من الأجر. مصروف قبل قسمة الحصص.»\u003c/p>\u003cp>توقف لين عن مراقبة باب الغرفة. عرف السؤال التالي قبل أن يأتي، كما يعرف خشخشة ترس قبل أن يعلق.\u003c/p>\u003cp>«كم حصة الكفيلة؟»\u003c/p>\u003cp>«اثنان من عشرة.»\u003c/p>\u003cp>«والحداد؟»\u003c/p>\u003cp>«واحد من عشرة. لنا سبعة.»\u003c/p>\u003cp>نظر وو إلى ورقة الحساب. «هذا مورد يمكن التحقق منه.»\u003c/p>\u003cp>قال لين: «الطاحونة تعمل.»\u003c/p>\u003cp>«الطاحونة قد تعمل في أرض غير أرضك.»\u003c/p>\u003cp>«عندنا عقد.»\u003c/p>\u003cp>«أعرف. أريد أن أراه.»\u003c/p>\u003cp>من موضعها عند الموقد قالت هو سانيانغ: «رأيته حين خُتم.»\u003c/p>\u003cp>«وأريد أن أراه وهم يحملونه معهم، لا أن أطلبه من بيت ليو. ما بين النسخة والذاكرة قد يضيع بند.»\u003c/p>\u003cp>نهضت شين يان، ومشت إلى المخزن. لم تتعجل؛ أزاحت حصيرة ثم أخرجت اللفافة من موضعها الجاف. عاد لين معها عند الباب، وحمل صندوق الخشب الصغير من تحت الفراش ووضعه مكانه بعدما أخذت ما تحتاج إليه.\u003c/p>\u003cp>قال لها بصوت منخفض: «سيأخذه؟»\u003c/p>\u003cp>«لن أعطه النسخة ليحتفظ بها.»\u003c/p>\u003cp>رجعا. فتحت العقد على الطاولة وأمسكت بطرفه. انحنى وو يقرأ، فتوقف عند اثني عشر كيسًا من الدخن، ثم مر بإصبعه فوق مدة السنوات الثلاث.\u003c/p>\u003cp>«هذا الخط أضيف بعد السطر الأول.»\u003c/p>\u003cp>قالت: «قبل الأختام.»\u003c/p>\u003cp>نظر إليها، ثم إلى الأثر تحت البند. «ظاهر.»\u003c/p>\u003cp>أعاد يده إلى جانبه، فلفت الورقة. لم تطلب منه وعدًا بحمايتها؛ احتاجت فقط أن تبتعد عن الطاولة بالورقة نفسها التي جاءت بها.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الظهر قد اقترب حين أغلق وو محبرته. نهض، وطلب من الشاب أن يحمل الصندوق بعيدًا عن الثلج الذي ذاب عند العتبة.\u003c/p>\u003cp>وقف لين أمامه. «وماذا نفعل الآن؟»\u003c/p>\u003cp>نفض الكاتب كم ردائه. «غدًا، بعد ارتفاع الشمس. مجلس القرية أوسع، وفيه السجل الأول.»\u003c/p>\u003cp>قالت شين يان: «نأتي بالعقد.»\u003c/p>\u003cp>«وبالكفيلة.»\u003c/p>\u003cp>لم يجب أحد. كانت هو سانيانغ تنظر إلى الورقة الملفوفة في يد شين يان، وإلى الخيط الذي تشده حولها.\u003c/p>\u003cp>انحنى وو لصاحبة النزل انحناءة صغيرة، وشكرها على الماء والطاولة. ثم خرج مع كاتبه، وتبعتهما إلى الطريق أصوات من الحظيرة تسأل عن التسجيل.\u003c/p>\u003cp>تحرك شياو دو ليعيد المقعد إلى مكانه. رفعه نصف رفعة، ثم وضعه حين رأى عمته ما زالت واقفة.\u003c/p>\u003cp>قالت هو سانيانغ: «ضعا العقد حيث لا يصله الماء.»\u003c/p>\u003cp>أجابت شين يان: «نعم.»\u003c/p>\u003cp>خلعت صاحبة النزل شالها وعلقته. مدت يدها إلى صدرها، وتحسست الكيس الصغير الذي تضع فيه ختمها، ثم أبعدت يدها عنه كأن شيئًا حارًا لسعها.\u003c/p>"},{"n":32,"t":"الفصل الثاني والثلاثون: كلفة الاسم","b":"\u003cp>في صباح اليوم التاسع عشر بعد المئة، مشت هو سانيانغ أمامهما إلى مجلس القرية، وختمها في كيس صغير داخل كمها. حمل لين العقد، وحملت شين يان دفترها ملفوفًا بقماش جاف.\u003c/p>\u003cp>كان الطريق الذي يعبران به إلى السوق مألوفًا، لكنهما لم يتوقفا عند الفرن ولا عند بائع المخلل. رفعت هو سانيانغ طرف ثوبها عند ساقية متجمدة، واجتازتها من غير أن تنظر خلفها. تبعتها شين يان ببطء أكبر، فمد لين يده إليها.\u003c/p>\u003cp>أخذتها، ثم تركتها على الطرف الثاني.\u003c/p>\u003cp>عند بيت يانغ كان الرجل يشق خشبًا. توقف حين رآهم، وأسند الفأس إلى الجذع. لم يسأل أين يذهبون؛ أومأ لهو سانيانغ أولًا، ثم للين، وعاد إلى الخشب.\u003c/p>\u003cp>قالت شين يان بلغتهما: «قل ما تعرفه. وإذا لم تعرف، لا تسد الفراغ.»\u003c/p>\u003cp>قال لين: «وأنت؟»\u003c/p>\u003cp>«سأقول ما أعرفه أيضًا.»\u003c/p>\u003cp>سمعت هو سانيانغ صوتهما، فأبطأت خطوتها لحظة. لم تطلب ترجمة، ولم يتابعا الحديث.\u003c/p>\u003cp>في الساحة كان رجلان يزيلان الثلج عن درجات المجلس. وضع أحدهما مكنسته جانبًا حتى تمر شين يان، ثم نظر إلى اللفافة تحت ذراع لين. سمع وراءه سؤالًا خافتًا، ولم يسمع الجواب.\u003c/p>\u003cp>دخلوا. كانت الغرفة أصغر مما تبدو من الخارج، وفيها طاولة طويلة ومقعدان وموقد صغير. قرب النافذة جلس وو إلى جوار شاب الكتابة، وترك أمامه مساحة نظيفة لورقهم.\u003c/p>\u003cp>قال: «أغلق الباب، من فضلك. الحبر يثخن من البرد.»\u003c/p>\u003cp>أغلقه لين. انقطع صوت المكانس، وبقيت فرقعة الحطب داخل الموقد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>طلب وو العقد أولًا. فرده لين، ووضع عند طرفيه حصاتين من صحن صغير. قرأ الكاتب أسماء أطرافه بصوت مسموع، ثم سأل هو سانيانغ إن كانت ما زالت كفيلتهما.\u003c/p>\u003cp>قالت: «اسمي لم يتغير.»\u003c/p>\u003cp>«أسأل عن الاستمرار، لا عن الاسم.»\u003c/p>\u003cp>«اسأل أولًا ما جئت لتسأل عنه.»\u003c/p>\u003cp>رفع وو نظره إليها لحظة، ثم أشار للشاب أن يفتح السجل القديم. قلب ثلاث صفحات حتى وصل إلى القيد الذي يعرفه. كان اسم لين على الورق، وحروفه تبدو أغرب من قبل.\u003c/p>\u003cp>قال الكاتب: «عندما سُجّل وصولكما، ذُكر الفيضان في الجنوب. من منكما رأى الماء يرتفع؟»\u003c/p>\u003cp>ترك السؤال بينهما، من غير أن ينظر إلى واحد أكثر من الآخر.\u003c/p>\u003cp>قال لين: «لم أرَ الفيضان.»\u003c/p>\u003cp>تحركت يد هو سانيانغ داخل كمها. لم تخرج الختم.\u003c/p>\u003cp>قال وو: «وشين يان؟»\u003c/p>\u003cp>«لم أره.»\u003c/p>\u003cp>أعاد القلم إلى موضعه على الطاولة. «أي شهر تركتما فيه قريتكما؟»\u003c/p>\u003cp>سمع لين خشونة أنفاسه وهو يفكر في أسماء شهور لا يعرفها. كان يستطيع أن يربط الجواب بيوم وصولهما، لكن الرجل لم يسأله متى دخل هذه القرية.\u003c/p>\u003cp>قال: «لا أستطيع أن أعطيك شهرًا من تقويمكم.»\u003c/p>\u003cp>«تستطيع أن تقول قبل الحصاد أو بعده.»\u003c/p>\u003cp>«ليس عندي حصاد أستند إليه.»\u003c/p>\u003cp>خفض الشاب بصره إلى الورق، منتظرًا إشارة للكتابة. أومأ وو، فكتب. سمع لين خشخشة القلم مع كل حرف، فشد فكه.\u003c/p>\u003cp>قال الكاتب: «الناس الذين وصلوا ذكروا ارتفاع الماء بعد مطر طويل. بعضهم بقي في القرى العالية مدة قبل الهرب. هذا يفسر اختلاف وقت الوصول. لا يفسر أن يعيش رجل هناك ولا يعرف المعبر ولا الطريق إليه.»\u003c/p>\u003cp>قال لين: «نعم.»\u003c/p>\u003cp>«هل هو معبر آخر تسميه باسم آخر؟»\u003c/p>\u003cp>«لا أعرف معبرًا هناك.»\u003c/p>\u003cp>ظل وو ساكنًا. مد إصبعه إلى القيد الأول، وتوقف عند كلمة لم يستطع لين قراءتها.\u003c/p>\u003cp>«حين يقول السجل من الجنوب، هل يصف موضعًا أم جوابًا وافقتما أن يُكتب؟»\u003c/p>\u003cp>لم يجد لين موضعًا يضع فيه عينيه بعيدًا عن الطاولة. نظر إلى زوجته. كانت قد فتحت دفترها، ولم تكتب شيئًا بعد.\u003c/p>\u003cp>قال: «جواب تركناه يُكتب.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يصرخ أحد. لم يضرب وو الطاولة، ولم يفتح الباب ليدعو الحرس. صب لنفسه قليلًا من الماء، وشرب، ثم قال: «أريد كلامًا أدق.»\u003c/p>\u003cp>رفع لين رأسه. «لسنا من القرى التي يظن الناس أننا جئنا منها. لا نعرف قراهم ولا الطرق التي وصفها سون لي.»\u003c/p>\u003cp>التفتت هو سانيانغ إليه أخيرًا. نظر إلى يدها الموضوعة الآن فوق ركبتها.\u003c/p>\u003cp>«حين وجدنا المأوى، قال الناس إن الماء أخرجنا من بيوتنا. لم أصحح لهم. وبعد ذلك صار القول أسهل من تصحيحه.»\u003c/p>\u003cp>قال وو: «هل اخترعت اسم قرية؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«هل أخذت اسم رجل ميت أو حي؟»\u003c/p>\u003cp>«اسمي لين. هذا الاسم لي.»\u003c/p>\u003cp>«ومع ذلك تركتَ غيرك يشهد لك.»\u003c/p>\u003cp>لم يجب لين بسرعة. كانت هو سانيانغ تجلس مستقيمة، كأنها تسمع حساب شخص لا تعرفه.\u003c/p>\u003cp>قال: «نعم.»\u003c/p>\u003cp>سأل وو شين يان: «عرفتِ أن القيد ناقص؟»\u003c/p>\u003cp>أجابت: «عرفت. وسكتّ.»\u003c/p>\u003cp>«أمرك زوجك بذلك؟»\u003c/p>\u003cp>«لا.» وضعت يدها على الصفحة البيضاء. «كان قراري أيضًا.»\u003c/p>\u003cp>نظر الكاتب إلى الشاب، فكتب الجواب. ثم عاد إلى لين.\u003c/p>\u003cp>«من أين أنتما إذن؟»\u003c/p>\u003cp>ظهر المختبر في ذهنه من غير أن يريده: طاولة لامعة، كوب بارد، ويد شين يان على القابس. فتح فمه ولم يجد طريقة يعبر بها من تلك الصورة إلى الغرفة.\u003c/p>\u003cp>قال: «من موضع بعيد. لا أملك ورقة تثبته هنا.»\u003c/p>\u003cp>«البعيد مسافة. أسأل عن مكان.»\u003c/p>\u003cp>«لا أستطيع أن أعطيك مكانًا تستطيع التحقق منه.»\u003c/p>\u003cp>أغلق وو السجل نصف إغلاق. «إذن سنكتب أن المنشأ غير مثبت.»\u003c/p>\u003cp>لم تكن العبارة براءة. قالها الشاب مرة وهو ينقلها، فأحس لين أنها صارت شيئًا يستطيع رجل آخر أن يقرأه من دونه.\u003c/p>\u003cp>سأل وو عن الطريق الأخير قبل الوصول. وصف لين التل والحقل كما وصفهما في المطبخ، والحصى الذي دخل حذاءه حين نزلا، والبيوت التي رآها تحت الدخان. سأله من أي جهة مالت الشمس. فكر لين ثم قال إنه لا يتذكر.\u003c/p>\u003cp>أبعد الكاتب الورقة عن يده. «هذه أشياء يوم واحد. أحتاج ما قبله.»\u003c/p>\u003cp>سمع لين حفيف القماش قربه. كانت شين يان تفرد الغطاء الذي لفت به الدفتر، وتعيد طي زواياه لتشغل أصابعها. وضع كفه تحت الطاولة على ركبته، وضغطها بقوة.\u003c/p>\u003cp>«ليس عندي وصف طريق تستطيع أن ترسل رجلًا يسير فيه.»\u003c/p>\u003cp>«هل يملك أحدكم ورقة باسم أب أو أسرة؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«أحد تعرفانه في هذا الإقليم قبل وصولكما؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>التفت وو إلى شين يان. «أجيبيني أنتِ أيضًا. لا يكتب الشاب جواب زوجك عنك.»\u003c/p>\u003cp>رفعت وجهها. «لم أعرف أحدًا هنا قبل وصولنا. لا ورقة عندي، ولا شاهد على مكاننا الأول.»\u003c/p>\u003cp>سأل الشاب بهدوء: «أكتب الأول أم المنشأ؟»\u003c/p>\u003cp>قال وو: «المنشأ.»\u003c/p>\u003cp>خرجت الكلمة من رأس القلم ببطء. نظر لين إلى يد الشاب، إلى سواد الحبر تحت ظفر السبابة، وتذكر يديه حين وضعهما أمام الحداد أول مرة. ظن يومها أن العمل سيغيرهما حتى لا يسأل أحد. كان الجلد قد خشُن فعلًا، والشق قرب إبهامه لا ينغلق في البرد، لكن الرجل أمامه ظل يسأل السؤال نفسه.\u003c/p>\u003cp>فتح الباب قليلًا. مد أحد العاملين رأسه يسأل عن حطب الموقد. أشار وو إلى رصّة قرب الحائط، فدخل وجثا ووضع قطعتين. لم ينظر إلى الزوجين إلا وهو ينهض، نظرة سريعة بقيت أطول مما ينبغي.\u003c/p>\u003cp>حين خرج، وجد لين أن شين يان قد طوت القماش كله ووضعته تحت الدفتر. كانت ترفع كتفيها عند كل نفس، فدفع المقعد قليلًا ليصبح أقرب إلى الموقد. تحرك الخشب على الأرض بصوت خشن. لم يمنعه وو، ولم يطلب منه الجلوس في مكانه السابق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قالت هو سانيانغ: «في أول ليلة قلت إنكما هربتما.»\u003c/p>\u003cp>لم تكن تخاطب وو. كان وجهها نحو لين، ولا شيء في نبرتها يشبه الأسئلة التي تسألها عند المساومة.\u003c/p>\u003cp>قال: «كنا خائفين.»\u003c/p>\u003cp>«من ماء؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>تحركت شين يان على المقعد، لكن هو سانيانغ رفعت إصبعًا واحدًا.\u003c/p>\u003cp>«سأسمعك. أسأله الآن.»\u003c/p>\u003cp>بقي لين ينظر إليها. «لم نكن نعرف أين نحن. ولم نعرف من يقبل غريبين بلا شيء.»\u003c/p>\u003cp>«فعرفت أنني أقبل اثنين أخذهما الماء.»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>قال وو بهدوء: «يمكن أن يبقى هذا الحديث بينكم بعد أن نكمل القيد.»\u003c/p>\u003cp>التفتت إليه هو سانيانغ. «أنا القيد الذي تريد إكماله.»\u003c/p>\u003cp>للمرة الأولى تحرك الشاب في مقعده، ثم تجمد. لم يقطع الكاتب نظره عنها، لكنه أبعد القلم قليلًا حتى لا يلطخ العقد المفتوح.\u003c/p>\u003cp>قال: «أنتِ كفيلتهما، ولهذا يجب أن تسمعي ما أطلبه، وأن تقولي ما تقبلين.»\u003c/p>\u003cp>سحبت يدها إلى كمها، وأومأت له بأن يكمل.\u003c/p>\u003cp>قال وو: «لا يظهر أمامي اسم مسروق، ولا شاهد يقول إنه يعرفهما هاربين من تكليف. يظهر قيد ناقص، وعمل قائم، وكفيلة لم تسمع هذا النقص كاملًا.»\u003c/p>\u003cp>نظر إلى لين. «لا يعني ذلك أنك تستطيع ترك الفراغ كما هو.»\u003c/p>\u003cp>«ماذا تطلب؟»\u003c/p>\u003cp>«بيانًا مكتوبًا بما تقرانه وما لا تستطيعان إثباته. ومورد رزق ظاهرًا. وكفيلًا يستمر وهو يعلم ما سمعناه اليوم.»\u003c/p>\u003cp>قالت شين يان: «العقد مورد الرزق.»\u003c/p>\u003cp>«العقد يثبت حق العمل. الحساب والشهود يثبتون استمرار العمل. أستطيع إرسال من يرى الحجر يدور.»\u003c/p>\u003cp>قال لين: «يدور بالحمار الآن. النهر متجمد.»\u003c/p>\u003cp>«إذن يراه بالحمار.»\u003c/p>\u003cp>كان هذا التفصيل الصغير أول شيء استطاع لين أن يجيب عنه من غير أن يفكر كيف يبدو الجواب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قربت شين يان دفترها. «أريد أن أنقل المطلوب.»\u003c/p>\u003cp>أملى وو الجملة، وقرأتها عليه كلمة كلمة. أخطأت في حرف، فطلبت من الشاب أن يشير إليه. لم يأخذ القلم من يدها؛ رسمه على ورقة صغيرة حتى أعادته صحيحًا.\u003c/p>\u003cp>قالت: «ومتى نأتي بالبيان؟»\u003c/p>\u003cp>«غدًا.»\u003c/p>\u003cp>«وإذا احتاجت الكفيلة أن تقرر؟»\u003c/p>\u003cp>التفت وو إلى هو سانيانغ. «لهذا أمهلكما. لا أضع ختمها نيابة عنها.»\u003c/p>\u003cp>قال لين: «هل نبقى في النزل الليلة؟»\u003c/p>\u003cp>استقرت عيناه عليه. «أنا لم أخرجكما منه. وصاحبة النزل أمامك.»\u003c/p>\u003cp>نظر لين إليها، فوجدها تنظر إلى العقد. لم يسألها مرة أخرى.\u003c/p>\u003cp>قالت شين يان: «إذا لم تستمر الكفالة، ما الذي يحدث؟»\u003c/p>\u003cp>أجاب وو: «نبحث تسجيلًا آخر أو كفيلًا آخر. ولا تفترضي أن من يقبل اليوم يقبل الشروط نفسها. إن رحلتما من دون قيد واضح، لا تكونان مجرد مسافرين في الورقة التالية.»\u003c/p>\u003cp>مسكت شين يان الخيط الذي تلف به عقد الطاحونة. لم تربطه بعد. «وأي مال مطلوب الآن؟»\u003c/p>\u003cp>«لم أحدد رسمًا. سيُكتب ما يلزم قبل أن يُدفع. لا تدفعي لمن يأتي باسم المجلس بلا ورقة.»\u003c/p>\u003cp>أومأت. كان لين يعرف سؤالها؛ في الكيس نحو سبع وثلاثين نحاسة، وفي دفتر هو سانيانغ مئة وأربع وعشرون، ولا يريدان أن يتحول الصمت الذي جلبهما إلى هنا إلى حساب لا يرون نهايته.\u003c/p>\u003cp>رفع العقد عن الحصاتين. حرص على أن يرده بالطية القديمة، لكنه أخطأ فبرز طرفه. ساعدته شين يان، وسوّت الورقة بكفها حتى عاد الخيط يحيط بها كما كان.\u003c/p>\u003cp>توقفت عين لين عند أثر الختم الثالث قبل أن يخفيه القماش. كان العقد قد دخل الغرفة سليمًا وسيخرج سليمًا، لكن هو سانيانغ لم تنظر إليه كما نظرت يوم وضعته أمامهم أول مرة. مدت يدها لتزيح الحصاتين عن طرف الطاولة، ثم أعادتهما إلى الصحن واحدة واحدة، وهي تنظر إلى يديها.\u003c/p>\u003cp>قال وو: «هذا العقد يبقى معكما.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«وغدًا يأتي معي الكاتب إلى الطاحونة. قبل ذلك أريد جواب الكفيلة.»\u003c/p>\u003cp>نقل الشاب ما أملاه سيده إلى ورقة ثانية، وقارن السطرين قبل أن يقص الخيط الذي سيضمها إلى السجل. انتظر لين حتى جف الحبر، ثم قرأت شين يان الموعد عليه مرة أخرى. لم يبقَ من الغد في ذهنه إلا تلك الصفحة.\u003c/p>\u003cp>لم يتحرك كيس الختم في كم هو سانيانغ.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرجوا إلى الساحة. كان الرجلان قد أزالا الثلج عن الدرج، وبقي خط رطب يتسع تحت الشمس. انتظر لين حتى نزلت شين يان، ثم سار خلف هو سانيانغ.\u003c/p>\u003cp>عند زاوية المجلس قابلوا امرأة تحمل سلة بيض مغطاة بالقش. حيت صاحبة النزل، وسألت إن كانت تريد نصفها للعابرين في الحظيرة. قالت هو سانيانغ إنها تريد أن ترى البيض أولًا، ثم تشتري ما يلزمها.\u003c/p>\u003cp>كان صوتها عاديًا إلى حد آلم لين. تحدثت عن البيض بثبات، وأعادت القش إلى السلة، واتفقت أن تمر المرأة بها بعد الظهر.\u003c/p>\u003cp>ثم مضت خطوات، وتوقفت حيث ينقسم الطريق. اليسار إلى النزل مباشرة، واليمين يمر بالطاحونة قبل أن يعود إليه.\u003c/p>\u003cp>قال لين: «نذهب معك.»\u003c/p>\u003cp>وقفت أمامهما. أبقت بينهما مسافة ذراع، فلم يقدر أن يخفض صوته أكثر مما فعل.\u003c/p>\u003cp>«هو سانيانغ، لم نرد أن—»\u003c/p>\u003cp>«أعرف ما أردتماه. مكانًا تنامان فيه.»\u003c/p>\u003cp>أحس شين يان تقرب العقد إلى صدرها.\u003c/p>\u003cp>قالت صاحبة النزل: «حين سألني الناس، قلت إنهما تحت اسمي. وحين سألني الوكيل، قلت إن كفالتي في دفتر الحكومة.»\u003c/p>\u003cp>«سمعناك.» قال لين.\u003c/p>\u003cp>نظرت إليه طويلًا. «وكنتَ تسمع نفسك أيضًا.»\u003c/p>\u003cp>مر الرجل صاحب المكنسة خلفهم، يحمل كومة الثلج إلى حافة الطريق. انتظرت هو سانيانغ حتى ابتعد، ثم سوت كمها فوق كيس الختم.\u003c/p>\u003cp>«عودا إلى النزل.»\u003c/p>\u003cp>قالت شين يان: «نريد أن نتكلم معك هناك.»\u003c/p>\u003cp>«ستتكلمان.»\u003c/p>\u003cp>تحرك لين ليفسح لها موضعًا بينهما، لكنها أخذت الطريق المباشر وحدها. وقفا عند المفترق حتى صار شالها الداكن قرب أول البيوت، ولم تلتفت لترى إن كانا يمشيان وراءها.\u003c/p>"},{"n":33,"t":"الفصل الثالث والثلاثون: باب المطبخ","b":"\u003cp>لم يكن الطريق إلى النزل طويلًا في ظهيرة اليوم التاسع عشر بعد المئة، لكن لين وشين يان أخذاه من الجانب الذي يمر بالبئر، بعيدًا عن ظهر هو سانيانغ وهي تصعد الدرب المباشر.\u003c/p>\u003cp>حمل العقد تحت سترته. كان طرف الورقة يضغط صدره، فنقله إلى الجانب الآخر ثم أعاده. توقفت شين يان عند الدرجة المؤدية إلى البئر، ورفعت قدمها كي تنزع حصاة دخلت حذاءها.\u003c/p>\u003cp>قال: «نجلس قليلًا؟»\u003c/p>\u003cp>«إذا جلسنا هنا، سأفكر في طريقة أخرى لتأخير الدخول.»\u003c/p>\u003cp>استندت إليه حتى أصلحت الحذاء، ثم تابعا. مر بهما رجل يقود حمارًا محملًا بالخوص. سحب الدابة إلى جانب الطريق لتفسح لها، وحياها باسمها. ردت التحية من غير أن ترفع صوتها.\u003c/p>\u003cp>عند النزل كان باب الحظيرة مفتوحًا. رأيا سون لي يساعد رجلًا على شد حبل فوق فتحة في الجدار، وهو جالس على صندوق يرفع العمل إلى مستوى يديه. التفت، ثم عاد إلى العقدة. لم يسأل عما حدث في المجلس.\u003c/p>\u003cp>في الداخل خرج شياو دو من المطبخ حاملًا السكين ولوح الخشب.\u003c/p>\u003cp>قال: «العمة قالت أقطع البصل هنا.»\u003c/p>\u003cp>لم تكن هذه عادتها. نظر إلى وجهيهما، فحمل اللوح إلى آخر الغرفة من غير أن يسأل. دخلت شين يان، وتبعها لين.\u003c/p>\u003cp>كانت هو سانيانغ عند الطاولة. عقدت شعرها من جديد، وتركت شالها على المقعد الآخر. لم تُعد طعامًا لنفسها. وضعت كيس الختم قرب يدها، كأنها أخرجته لتتأكد أنه ما زال هناك.\u003c/p>\u003cp>قالت للين: «أغلق الباب.»\u003c/p>\u003cp>أغلقه برفق. لم يقل إن شياو دو يستطيع السماع من الشق؛ أبعدت هي المقعد إلى الطرف الآخر من الغرفة، وجلست أبعد ما يمكن عن الباب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ظل الزوجان واقفين حتى أشارت إلى المقعد. جلس لين أولًا، وجلست شين يان ببطء، وأبقت دفترها في حجرها.\u003c/p>\u003cp>قالت هو سانيانغ: «ابدأ من غير الماء.»\u003c/p>\u003cp>رفع لين رأسه. على خدها شريط أحمر من البرد، وعند طرف كمها بقعة حبر من طاولة المجلس.\u003c/p>\u003cp>«نحن من مكان بعيد جدًا، ليس في هذا الإقليم ولا في أي إقليم تعرفينه.»\u003c/p>\u003cp>لم تتغير عيناها.\u003c/p>\u003cp>«هذا ما قلته للكاتب، بكلمات أكثر.»\u003c/p>\u003cp>«هناك أشياء لا أستطيع أن أثبتها لك. لا طريق أصفه فتسيرين عليه، ولا رجل أذكر اسمه فتبعثين إليه.»\u003c/p>\u003cp>«إذن تريدني أن أصدق ما لا أقدر أن أسأل عنه.»\u003c/p>\u003cp>«لا أطلب أن تسميه دليلًا.»\u003c/p>\u003cp>«وماذا أسميه؟»\u003c/p>\u003cp>تحركت شين يان، لكنه رفع يده قليلًا ثم أنزلها. كان عليه أن يكمل، وإلا وجد طريقة أخرى لتترك زوجته الجملة الأصعب عنه.\u003c/p>\u003cp>«كلام رجل خاف أول يوم، ثم خاف أن يقول إنه سكت أول يوم. كان يمكن أن أقول لا حين قلتِ الفيضان. لم أقل. حين سألتِ عن الجنوب، تركتُك تجيبين عنّا.»\u003c/p>\u003cp>سحبت هو سانيانغ الشال عن المقعد، ووضعت نهايته في حجرها.\u003c/p>\u003cp>«كنت تعرف أنني سأضع ختمي.»\u003c/p>\u003cp>«عرفت بعد ذلك.»\u003c/p>\u003cp>«وبعد ذلك؟»\u003c/p>\u003cp>خفض بصره إلى كيس الختم. «بقيت ساكتًا.»\u003c/p>\u003cp>خرج صوت حاد من وراء الباب؛ أفلت شيء معدني من يد شياو دو. انتظروا حتى هدأ. مد لين كفه فوق ركبته، وكشف الشق الجاف عند الإبهام.\u003c/p>\u003cp>«في اليوم الذي وصلنا، لم أعرف أين وقعنا، ولا إن كان ثمة طريق نعود منه. كانت زوجتي حاملًا. كنا نرتجف، وليس عندي شيء أستطيع أن أشتري به ليلة.»\u003c/p>\u003cp>«كل من عندي في الحظيرة كان يرتجف.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«ولا يعرف إن كان يرجع إلى بيته.»\u003c/p>\u003cp>أومأ. بقيت يده مكشوفة، ثم أغلقها. لم يستطع أن يجعل برده الأول حجة أمام أقدامهم الدامية في الغرفة الأخرى.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قالت شين يان: «أنا أيضًا تركتك تقولين ما لم نثبته. لا تحسبي أنني سمعت منه قصة ثم صدقتها.»\u003c/p>\u003cp>التفتت هو سانيانغ إليها. «أنت أسرع منه في الجواب. كنت أنتظر أن أسمع لماذا لم تجيبي هناك.»\u003c/p>\u003cp>«لأنني أردت أن أبقى. كان يمكنني أن أوقف الكلام. لم أفعل.»\u003c/p>\u003cp>«وأنا، ماذا أردت؟»\u003c/p>\u003cp>ترددت شين يان. نظرت إلى الموقد، ثم أعادت وجهها إليها.\u003c/p>\u003cp>«أردتِ أن يصلح الموقد.»\u003c/p>\u003cp>«وأنا دفعت ثمنه.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«فلا تجعلاني تاجرة اشترت غريبين بسعر رخيص، ثم لا يحق لها أن تسأل ماذا اشترت.»\u003c/p>\u003cp>قالت شين يان: «لن أفعل. عملنا لا يمحو ما أخفيناه. والاتفاق لا يعني أنك قبلتِ خطرًا لم نشرحه.»\u003c/p>\u003cp>أزاحت دفترها من حجرها إلى الطاولة، لكنها لم تفتحه. لم ترغب أن يبدو كل ما عندها أعمدة حساب.\u003c/p>\u003cp>«الخوف لم يعطنا الحق أن نجعل اسمك يدفع بدلًا عنا.»\u003c/p>\u003cp>شدت هو سانيانغ الشال عند الطرف. «وكم مرة كنتم تسمعون الناس ينادونني كفيلتكم؟»\u003c/p>\u003cp>لم يرد أحد.\u003c/p>\u003cp>«حين وقف الرجل عند باب الطاحونة وقال إن الغرباء يجلبون الحرس، من قال له إنهم تحت اسمها؟»\u003c/p>\u003cp>قال لين: «أنت.»\u003c/p>\u003cp>«وحين خلت الطاحونة، من وضعت الطعام أمامكما كل ليلة؟»\u003c/p>\u003cp>بدا كأنه يريد أن يقول شكرًا. أوقف الكلمة قبل أن تخرج؛ لم تكن تسأل لتأخذ شكرًا.\u003c/p>\u003cp>قال: «أنت. ونحن نعرف.»\u003c/p>\u003cp>«لم أكن أحتاج أن تعرفا. كنت أحتاج أن أعرف أنا أيضًا.»\u003c/p>\u003cp>نهضت، وسارت إلى الموقد. أخذت قطعة خشب صغيرة وقلبت بها جمرة خرجت إلى الحافة. لم تضف حطبًا. بقيت تنظر إلى النار حتى انشغل لين بما ستقوله حين تلتفت.\u003c/p>\u003cp>عندما التفتت، سألت شين يان: «وما الذي أعرفه الآن غير أن البعيد بعيد؟»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>رفعت شين يان يدها عن الدفتر. «تعرفين ما نستطيع فعله هنا. لا لأنه يثبت بلدنا. لأنك تستطيعين فحصه بنفسك.»\u003c/p>\u003cp>قالت هو سانيانغ: «الموقد. سمعت.»\u003c/p>\u003cp>«والطاحونة. والخشب الذي كسره البرد قبل أن نغير طريقة القياس. أنا أعطيتهم خيطًا انكمش، ففسد موضع الأوتاد. أصلحنا الخطأ أمام يانغ وتشانغ. لسنا نعرف كل شيء. لا أريدك أن تشهدي إلا بما رأيتِنا نفعله.»\u003c/p>\u003cp>شعرت بيد لين تتحرك على المقعد، فوضعت يدها فوقها لحظة ثم تركتها.\u003c/p>\u003cp>«إذا بقيتِ كفيلتنا، لا تكتبي أنك تعرفين منشأنا. اكتبي أنك رأيت عملنا. وأننا بقينا هنا، ودفعنا ما اتفقنا على دفعه، وسنسأل عمّا لا نفهمه.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى الدفتر المغلق. «وحين يأتي أحد يريد أصلكما؟»\u003c/p>\u003cp>قال لين: «نجيبه نحن. لا نتركك تجيبين عنا.»\u003c/p>\u003cp>«وإن طلب مالًا؟»\u003c/p>\u003cp>«نرى الورقة قبل أن نعد بشيء.»\u003c/p>\u003cp>«هذا كلام زوجتك.»\u003c/p>\u003cp>«تعلمته منها.»\u003c/p>\u003cp>لم تبتسم. لكنه أحس أن جوابها التالي لم يأت بالسرعة نفسها.\u003c/p>\u003cp>«كفالة الحكومة ليست وعد طفل. الختم يخرج من بيتي، ولا أسترده من كل ورقة يمسها.»\u003c/p>\u003cp>قالت شين يان: «لهذا لا نطلب أن تضعيه اليوم لأنك وضعته من قبل.»\u003c/p>\u003cp>أمسكت صاحبة النزل كيس الختم، وفتحته. أخرجت القطعة الصغيرة، ومسحت أسفلها بطرف خرقة. انحنت شين يان قليلًا فرأت بقايا لون أحمر بين الخطوط؛ كانت قد شاهدت أثره كثيرًا، لكنها لم تحمل الختم قط.\u003c/p>\u003cp>قالت هو سانيانغ: «قبل أن أضعه أول مرة، سألت من أين أنتما.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«هذه المرة سألت ما أعرفه عنكما. لا يعجبني أن الجواب صار أقل.»\u003c/p>\u003cp>وضعت الختم في الكيس وشدت الخيط. بقي على إصبعها أثر أحمر، ففركته فلم يزل كله.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>رد لين لوحًا عند الباب كانت الريح تحركه. قالت هو سانيانغ: «اتركه قليلًا إلى اليمين.» فعل، ثم عاد إلى مقعده.\u003c/p>\u003cp>لم يكن يعرف كيف يقعد من جديد. بقيت بين يديه حركة نافعة صغيرة، ثم انتهت وصارت الغرفة كما كانت.\u003c/p>\u003cp>قال: «إن قررتِ ألا تستمري، نحتاج أن نعرف قبل ذهابنا إلى وو.»\u003c/p>\u003cp>رفعت عينيها بحدة. «هل تستعجلني؟»\u003c/p>\u003cp>«لا. أريد أن أقول إننا لن نفترض جوابك.»\u003c/p>\u003cp>تركته واقفًا لحظة، ثم أشارت إلى مقعده. جلس.\u003c/p>\u003cp>قالت شين يان: «الليلة لنا فراش وطعام بالاتفاق القديم. لا نريد أن نخلطهما بالختم.»\u003c/p>\u003cp>«أنا أعرف اتفاقي.»\u003c/p>\u003cp>احمر وجه شين يان. «أعرف أنك تعرفينه. أردت أن أقول إنني لن أستعمل الحمل سببًا لتوافقي.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى بطنها. كانت يدها عليه منذ جلست ولم تنتبه. أبعدتها شين يان إلى طرف الدفتر، ثم أعادتها حين تحرك الطفل.\u003c/p>\u003cp>لم تستطع إخفاء الحركة، ولم تعلق الأخرى عليها.\u003c/p>\u003cp>قالت صاحبة النزل: «لا أحد ينام في الثلج الليلة. الحظيرة ممتلئة، لكن مخزنكما لم يذهب إلى مكان.»\u003c/p>\u003cp>تنفس لين من أنفه. أحس بشيء يرتخي في كتفيه، فاستقام بسرعة كأنه خجل من ظهوره.\u003c/p>\u003cp>«سأقرر الليلة.»\u003c/p>\u003cp>قالت شين يان: «ننتظر.»\u003c/p>\u003cp>«ولا يأتيني شياو دو يسأل كل ساعة. لا ترسلاه.»\u003c/p>\u003cp>قال لين: «لن نرسله.»\u003c/p>\u003cp>وقفت هو سانيانغ ووضعت كيس الختم في صدرها. فتح لين الباب حين رأى أنها تريد المرور، لكنّها لم تخرج. وقفت عنده ونادت الصبي ليعيد السكين. ثم حملت لوح البصل إلى الطاولة.\u003c/p>\u003cp>فهم الزوجان أن الحديث انتهى، وخرجا.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في المخزن أعادت شين يان العقد إلى موضعه. فتحت الدفتر، وكتبت بلغة بلدهما جملة قصيرة، ثم دفعت الورقة إلى لين.\u003c/p>\u003cp>قرأ: لا وعد باسم شخص غائب.\u003c/p>\u003cp>قال: «هل نحتاج أن نكتبها؟»\u003c/p>\u003cp>«أنا أحتاج.»\u003c/p>\u003cp>جلست على الفراش، وتركت ساقيها ممدودتين. خلع لين حذاءه ثم جلس بقربها، وأخذ يدها. كانت أطراف أصابعها باردة من الغرفة، فضمها بين كفيه.\u003c/p>\u003cp>قال: «لم أقل لها كل شيء.»\u003c/p>\u003cp>«ولا سأقول إنك فعلت.»\u003c/p>\u003cp>«كان يمكن أن أقول إن المختبر—»\u003c/p>\u003cp>ضغطت على يده. «هل تستطيع أن تثبت المختبر؟ هل تستطيع أن تأخذها إليه؟»\u003c/p>\u003cp>هز رأسه.\u003c/p>\u003cp>«إن أخبرتها به فلن تستطيع التحقق منه. قلنا ما أخفيناه عنها هنا، وبقي ما لا نعرف كيف نشرحه. لا تسمِّ ذلك حقيقة كاملة.»\u003c/p>\u003cp>ظل يسمع من المطبخ ضرب السكين. صوت يعرفه كل يوم، لكنه صار يقيس به الوقت الآن. رفعت شين يان رأسها إلى كتفه، وأغمضت عينيها. بقي ساكنًا كي تستريح، حتى خف الألم في ظهرها وقالت إنها تريد أن تتحرك قليلًا.\u003c/p>\u003cp>خرجا إلى الساحة. فوق الحظيرة أصلح الرجال الحبل، وصار الغطاء لا يصفق مع كل هبة. في الطرف الآخر جلس أبو يون، يقلب بين أصابعه خرزة كانت في ثوب ابنه. حياهما لين، فأومأ له من غير أن يخفي الخرزة.\u003c/p>\u003cp>جاء شياو دو من البئر. حمل لين عنه أحد الدلوين، فسارا إلى المطبخ معًا. قبل الباب قال الصبي: «أدخل؟»\u003c/p>\u003cp>«أنت تحمل الماء.»\u003c/p>\u003cp>نظر شياو دو إلى الدلو ثم إليه. طرق الباب بإصبعه على أي حال.\u003c/p>\u003cp>خرج صوت عمته: «مفتوح.»\u003c/p>\u003cp>دخل شياو دو أولًا، ووضع دلوه عند الحوض. تبعه لين بالدلو الآخر. كانت هو سانيانغ تقلّب كتاب حساباتها، وورقة أصغر بين صفحتيه. لم يقرأ لين منها إلا عمودًا من الأعداد.\u003c/p>\u003cp>سألها الصبي أين يضع الخبز الباقي. مدت يدها من غير أن ترفع عينيها، فأعطاها الرغيفين. وزنتهما براحتها ثم أشارت إلى الرف الأعلى.\u003c/p>\u003cp>قال لين: «الخشبة عند الباب الخلفي تتحرك. أصلحها قبل أن يبرد المكان أكثر.»\u003c/p>\u003cp>«المسامير في العلبة.»\u003c/p>\u003cp>رأى العلبة قرب قدمها، فتقدم ليأخذها. أغلقت الكتاب حين مد ذراعه. لم يكن يفكر في النظر إليه، ومع ذلك ابتعد بالعلبة أسرع مما ينبغي.\u003c/p>\u003cp>في الساحة وجد شين يان تنتظر. نظر إلى المسامير في راحته، فوجد اثنين جيدين وثلاثة ملتوية. اختار الجيدين، ورد البقية إلى العلبة.\u003c/p>\u003cp>قالت: «سأذهب لأقرأ المطلوب. إذا نادت، أنت قريب.»\u003c/p>\u003cp>أومأ. سار إلى الباب الخلفي، وتركها تعبر الساحة وحدها. حين وصل إلى الخشبة، رأى أن مسمارًا قديمًا هو الذي دفعها إلى الخارج. نزعَه بطرف المطرقة، وأبقى رأسه في راحته وهو يهيئ موضع الجديد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مع انطفاء ضوء النهار، عاد لين إلى المخزن بعد أن أصلح خشبة تفلت من حافة الباب الخلفي. كان عملاً يستطيع إنجازه في دقائق، فأطال فيه حتى لم يجد مسمارًا آخر يفحصه.\u003c/p>\u003cp>شين يان تقرأ السطر الذي نسخه الشاب في المجلس. حاولت أن تنطق كلمة الكفالة، ثم كتبت تحتها بلغتهما معناها الذي سمعته. جلس قربها وانتظر أن تنتهي.\u003c/p>\u003cp>لم يأت قرار من المطبخ.\u003c/p>\u003cp>وصلت إليهما رائحة الطعام، ثم وقع الأقدام في الغرفة الكبيرة. تحركت ظلال تحت باب المخزن، وابتعدت. أغلقت شين يان الدفتر، ولم تضعه في الصندوق.\u003c/p>\u003cp>أخيرًا سمعا خطوات تتوقف عند العتبة. نهض لين، وفتح الباب قبل أن يُطرق.\u003c/p>\u003cp>لم تكن هو سانيانغ. كان شياو دو يحمل طبقًا وملعقتين.\u003c/p>\u003cp>قال: «العمة قالت كُلا هنا. عندها حساب تريد أن تراجعه وحدها.»\u003c/p>\u003cp>أخذت شين يان الطبق، وسألت إن كان يحتاج إلى المساعدة في الحظيرة. قال إن سون والنساء قسموا المكان بأنفسهم، وإنه سيعيد الأوعية بعد العشاء.\u003c/p>\u003cp>تركهما وانصرف. حمل لين الطبق إلى الأرض، وأزاح الدفتر ليضعه في الموضع المستوي. على الجانب الآخر من الجدار سمع انفتاح درج، ثم صوت كتاب ثقيل يُوضع على الطاولة.\u003c/p>\u003cp>جلسا يأكلان، والختم الذي ينتظرانه خلف الجدار لم يضرب الورق بعد. لم تسرع شين يان في لقمتها. قسمت قطعة الخبز إلى نصفين، وأبقت الأكبر قربه حتى مد يده إليها. عندها أكلت ما بقي، فيما ظل صوت الملعقة يأتي من المطبخ متقطعًا.\u003c/p>"},{"n":34,"t":"الفصل الرابع والثلاثون: حصة الكفيل","b":"\u003cp>قبل أن يرتفع ضوء اليوم العشرين بعد المئة إلى نافذة المخزن، طرقت هو سانيانغ الباب مرة واحدة، وقالت: «بعد أن تغسلا وجهيكما، إلى المطبخ.»\u003c/p>\u003cp>لم تنتظر جوابًا. ابتعدت قدماها على الأرض، وبقي لين جالسًا فوق الفراش ينظر إلى زوجته. كانت قد فتحت عينيها عند أول طرقة.\u003c/p>\u003cp>قال: «قررت.»\u003c/p>\u003cp>«سنسمع ما قررت.»\u003c/p>\u003cp>أبعدت الغطاء، وجلست ببطء حتى استقر ثقل بطنها. حمل لين إبريق الماء عن الطوب الدافئ، وصب لها في الوعاء. غسلت وجهها، ثم رفعت رأسها وشدت شعرها إلى الخلف. لم تسأله إن نام جيدًا؛ كانت تعرف كل مرة تقلب فيها إلى الجانب الآخر.\u003c/p>\u003cp>في المطبخ وجدَا شياو دو يخرج بصينية إلى الغرفة الكبيرة. أراد أن يبقى حين رآهما، فأشارت عمته إلى الصينية. حملها وأغلق الباب بقدمه.\u003c/p>\u003cp>على الطاولة كتاب الحسابات، وورقتان، وعشر حبات فاصوليا جافة في صحن. بجوارها كيس الختم مربوط. لم يكن الختم فوق الورقة.\u003c/p>\u003cp>قالت هو سانيانغ: «أجلسا.»\u003c/p>\u003cp>جلسا. أخرجت شين يان دفترها، وتركت العقد ملفوفًا إلى جانبه. كانت صاحبة النزل قد أكلت، أو لم تأكل؛ لم يجد لين على الطاولة وعاءً يدل على أحد الأمرين.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دفعت هو سانيانغ الفاصوليا إلى وسط الطاولة.\u003c/p>\u003cp>«حصتي في أجر الطحن اثنان من عشرة.» وضعت حبتين قرب كتابها، وحبة قرب طرف العقد. «هذه لتشانغ. وسبعة لكما.»\u003c/p>\u003cp>قالت شين يان: «بعد مصروف الحمار، وفي أيام الأجر.»\u003c/p>\u003cp>«أعرف أين تأخذونها. لا أسأل عن يوم الوعد.»\u003c/p>\u003cp>مدت يدها إلى حباتهما وأخذت واحدة. وضعتها إلى جانب حصتها، فصارت ثلاثًا. بقيت حبة الحداد في مكانها.\u003c/p>\u003cp>نظر لين إلى الحبات الست أمامه. كان يعرف الرقم قبل أن تحركه، لكنه أحس الفرق في أصابعه كأنه حمل كيسًا أخف مما ظن.\u003c/p>\u003cp>قالت هو سانيانغ: «أبقى كفيلتكما. لكن حصتي تصير ثلاثًا ما دمت أحمل الكفالة.»\u003c/p>\u003cp>لم تقترب شين يان من الفاصوليا. قالت: «من أجر الطحن، لا من ملك الطاحونة.»\u003c/p>\u003cp>«الطاحونة ليست ملكًا لي ولا لكما. الأرض لليو، والإصلاحات بالعقد. لا أطلب أرضه.»\u003c/p>\u003cp>«ولا يدخل هذا في أجرة الاثني عشر كيسًا عند الحصاد.»\u003c/p>\u003cp>«تلك في عقد آخر. لم أزدها.»\u003c/p>\u003cp>سأل لين: «وحصة تشانغ؟»\u003c/p>\u003cp>دفعت هو سانيانغ حبته إلى موضع أوضح. «لم يطلب مني أن أكفله. تبقى كما هي.»\u003c/p>\u003cp>أخذت شين يان القلم. كتبت العدد، ثم رفعت رأسها.\u003c/p>\u003cp>«نحتاج أن نحدد معنى ما دمت تحملين الكفالة. إذا رفع الكاتب اسمك، تنتهي الزيادة من ذلك اليوم.»\u003c/p>\u003cp>«إذا رفعه فعلًا. لا إذا قلتما إنكما طلبتما منه.»\u003c/p>\u003cp>«بنسخة من القيد.»\u003c/p>\u003cp>فكرت هو سانيانغ قليلًا، ثم قالت: «بنسخة.»\u003c/p>\u003cp>بدأت شين يان تكتب العبارة، وتوقفت عند حرف لم تتذكره. رسمته في الهواء ثم شطبته من الورقة قبل أن يكتمل. قلبت صفحة من دفترها حتى وجدت الحرف، ونقلته من جديد.\u003c/p>\u003cp>لم تتعجلها صاحبة النزل. كانت تحرك حبة الفاصوليا الإضافية بإصبعها، من غير أن تعيدها.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قال لين: «إلى الحصاد؟»\u003c/p>\u003cp>رفعت هو سانيانغ رأسها. «قلت ما دمت أحمل الكفالة.»\u003c/p>\u003cp>«قد يبقى الاسم سنوات.»\u003c/p>\u003cp>«وقد يأتي من يسألني غدًا.»\u003c/p>\u003cp>وضعت شين يان القلم. «نراجع الاتفاق عند الحصاد. لا يعني أن اسمك يسقط يومها، ولا أن الزيادة تستمر إلى الأبد من غير كلام.»\u003c/p>\u003cp>أصغت هو سانيانغ إلى صوت فتح الباب الخارجي. انتظرت حتى انتهى شياو دو من جواب أحد العابرين، ثم أعادت نظرها إلى الزوجين.\u003c/p>\u003cp>«تريدين أن نختلف مرة أخرى حين نبدأ جمع الأكياس.»\u003c/p>\u003cp>«أريد يومًا نراجع فيه الكلفة وما تغير. الآن لا نعرف ما سيطلبه وو. إن أعطانا قيدًا لا يحتاج إلى كفالة بعد مدة، فلا يبقى سبب الزيادة. وإذا بقيت مسؤولة، نجلس ونسجل ذلك.»\u003c/p>\u003cp>«والعمل الذي لا يخرج له أجر؟»\u003c/p>\u003cp>«يومان من كل ستة للوعود، كما اتفقنا. لا أجر فيها لنقسمه. ولا نحولها إلى دخل وهمي لنؤدي حصتك.»\u003c/p>\u003cp>قالت صاحبة النزل: «لا أطلب دقيقًا من كيس فارغ.»\u003c/p>\u003cp>لم يكن لين يسمع في ذلك تنازلًا. كانت تعرف الحجر بقدر ما يعرفه؛ رأت أصحاب الرقع يجيئون بأكياسهم، ورأت مقدار ما بقي في الميزان بعدهم.\u003c/p>\u003cp>قال: «نريد أن نعرف أيضًا كل ما يُدفع باسم الكفالة. إذا طلب موظف رسمًا، نراه ونأخذ ورقته.»\u003c/p>\u003cp>«وإذا دفعت أنا قبل أن أصل إليكما؟»\u003c/p>\u003cp>قالت شين يان: «تخبريننا في اليوم نفسه، وتبقين إيصال الدفع. لا أقول إنك تحتاجين إذنًا لتخرجي نحاسة من كيسك. أقول إنني لا أريد حسابًا يصلنا بعد شهر، لم نرَ كيف تكوّن.»\u003c/p>\u003cp>فتحت هو سانيانغ كتابها عند صفحة خالية جزئيًا. شدت طرفها إلى الضوء، ثم قالت: «تكتبون هنا. وأحتفظ أنا بما يُعطى لي.»\u003c/p>\u003cp>«وننسخه في دفترنا.»\u003c/p>\u003cp>«ما يخصكما.»\u003c/p>\u003cp>قالت شين يان: «ما يخصنا.»\u003c/p>\u003cp>ظل الكتاب مفتوحًا بينهما، والصفحات القديمة بعيدة عن يدها. سحبت دفترها إلى الجانب الذي يسمح لها أن تكتب من غير أن تميل فوق كتاب العمة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخذت هو سانيانغ ورقة أصغر من كتابها ووضعتها أمام لين. كان في أعلاها رقم يعرفه: مئة وأربع وعشرون نحاسة.\u003c/p>\u003cp>قالت: «وهذا لا يتغير لأنني أخذت حبة فاصوليا أخرى.»\u003c/p>\u003cp>سأل: «لا يُخصم منه؟»\u003c/p>\u003cp>«لا. هذه حصة الكفالة، وهذا دين دفعته عنكما قبل أشهر.»\u003c/p>\u003cp>قالت شين يان: «ولا يزداد عليه شيء؟»\u003c/p>\u003cp>شدت صاحبة النزل شفتيها. «لم أقل إني أقرضكما اليوم.»\u003c/p>\u003cp>«أريد أن تكتبيه.»\u003c/p>\u003cp>استقرت يدها على الكتاب. نظر لين إلى زوجته؛ لم ترفع صوتها ولم تشرح السؤال أكثر. أبقت القلم بين أصابعها وانتظرت.\u003c/p>\u003cp>قالت هو سانيانغ: «اكتبي: الدين الباقي مئة وأربع وعشرون نحاسة، مستقل عن حصة الكفالة، ولا تضاف إليه زيادة بهذا الاتفاق.»\u003c/p>\u003cp>كتبت شين يان، ثم قرأت الجملة بصوت مسموع. صححت صاحبة النزل كلمة واحدة، فأعادتها.\u003c/p>\u003cp>قال لين: «والخمس من توفير الحطب؟»\u003c/p>\u003cp>«كما كان. حين يُقفل حسابه يُخصم من الدين، وما تبيعانه للنزل بسعر نتفق عليه له قيده. لا أقفل اليوم حساب حطب الشتاء كله لأجعل الرقم أجمل.»\u003c/p>\u003cp>أومأ. نقل مئة وأربعًا وعشرين إلى دفترهما مرة أخرى، وترك تحتها مكانًا لدفعة لم تحدث. كان يكره أن يكرر العدد، لكنه صار يفضل رؤيته على أن يبقى خلف عبارة ما عليك.\u003c/p>\u003cp>مد يده إلى كيس النقود داخل سترته، ثم توقف. قالت هو سانيانغ: «هل ستدفع؟»\u003c/p>\u003cp>«أفكر أن أضع شيئًا الآن.»\u003c/p>\u003cp>سألته شين يان: «وبأي رسم نرجع من وو؟»\u003c/p>\u003cp>ترك الكيس في مكانه. لم يعرف بعد. قال للعمة: «حين نعرف ما يبقى.»\u003c/p>\u003cp>«إذن لا أسجله مدفوعًا.»\u003c/p>\u003cp>أعادت ورقة الدين إلى طرف كتابها، منفصلة عن ورقة الحصص. بقي الفاصل ظاهرًا حتى بعد أن أغلقت نصف الغلاف.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>طرق شياو دو الباب، ثم دخل قبل أن يأتيه الجواب، وفي يده طرف حبل مقطوع.\u003c/p>\u003cp>«الغطاء عند الحظيرة—»\u003c/p>\u003cp>توقف حين رأى الفاصوليا.\u003c/p>\u003cp>قالت عمته: «ماذا حدث؟»\u003c/p>\u003cp>«انفلت من المسمار. سون يمسكه الآن. أحتاج حبلًا أطول.»\u003c/p>\u003cp>نهض لين. أشار إلى علبة المسامير، فدفعها الصبي نحوه. كانت هو سانيانغ تنوي أن تقول شيئًا، ثم اكتفت بأن تبعد الورق عن الهواء حين فتح الباب.\u003c/p>\u003cp>خرج إلى الحظيرة. رفرف الغطاء فوق رأس سون، وكان الشاب يثبت قدمه السليمة ويعتمد بظهره إلى العمود. أخذ لين طرف القماش منه، وصعد درجة على صندوق فارغ.\u003c/p>\u003cp>قال سون: «لم يقطع الريح. المسمار قصير.»\u003c/p>\u003cp>نظر لين إلى الخشب. كان الثقب قد اتسع، فلم يحاول إدخال المسمار فيه مرة أخرى. نقل موضع الحبل إلى طرف سليم، وأخذ من شياو دو مسمارًا أطول. شد القماش حتى استقام من غير أن يتمزق، ثم تركه قليلًا ليحتمل هبة أقوى.\u003c/p>\u003cp>سأل سون: «تحتاجني هنا؟»\u003c/p>\u003cp>«لا. لا تقف على قدمك كل هذا.»\u003c/p>\u003cp>جلس الشاب. ظل رأسه يتتبع الغطاء حتى استقر، ثم عاد إلى قطع خيط قديم ينظف به حافة عصاه. لم يسأل عن المجلس، فشكره لين على إمساك القماش وعاد إلى المطبخ.\u003c/p>\u003cp>وجد شين يان قد أحاطت الجمل التي اتفقوا عليها بخط خفيف. كانت هو سانيانغ تملي عليها سطرًا عن موعد المراجعة. توقفتا حتى أغلق الباب وجلس.\u003c/p>\u003cp>سألته زوجته: «المسمار ثبت؟»\u003c/p>\u003cp>«ثبت.»\u003c/p>\u003cp>دفعت إليه الورقة. «اقرأ ما نسخت. والكلمات التي لا تعرفها أسأل عنها أنا.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بدأ لين بالعدد لأنه أسهل ما يستطيع قراءته. ثلاث حصص للعمة، وواحدة لتشانغ، وست لهما، من صافي أجر الطحن بعد المصاريف المتفق عليها. رفع عينيه حين وصل إلى السطر التالي.\u003c/p>\u003cp>«هذا يوم بدء الاتفاق؟»\u003c/p>\u003cp>قالت شين يان: «من تسجيل التعديل. لا نعيد حساب ما مضى.»\u003c/p>\u003cp>سأل هو سانيانغ: «تقبلين؟»\u003c/p>\u003cp>«لم أطلب أجرة الأمس.»\u003c/p>\u003cp>عاد إلى الورقة. كانت شين يان قد تركت مكانًا لذكر استمرار الكفالة ومراجعتها عند الحصاد، وقرأت هذا الجزء عليه كلمة كلمة. سأل عن كلمة الشهادة، ثم عن الفرق بينها وبين الضمان؛ لم يخجل هذه المرة من أن يكرر السؤال أمام العمة.\u003c/p>\u003cp>قالت هو سانيانغ: «أنا أيضًا أسأل وو قبل أن يضع قلمه.»\u003c/p>\u003cp>كتبت شين يان عند طرف الورقة علامة صغيرة تذكرها بالسؤال. لم تجعلها شرطًا غامضًا يحتمل معنى آخر.\u003c/p>\u003cp>قال لين: «تشانغ يعرف أن حصته تبقى؟»\u003c/p>\u003cp>«سيعرف حين نقرأها عليه.» قالت العمة. «له اسم في القسمة، فلا نغير الورقة في غيابه ونقول إننا لم نمس ماله.»\u003c/p>\u003cp>«نمر به في الطريق.»\u003c/p>\u003cp>أومأت. «ويأخذ عقده إن كان عنده ما يريد مقارنته.»\u003c/p>\u003cp>سوت شين يان اللفافة إلى جانب الدفتر. «نذهب اليوم. قبل أن يقول وو إننا تركنا المهلة.»\u003c/p>\u003cp>بقي لين ينظر إلى الحبات العشر. لم يعد يعدها مرة أخرى. جمع الست التي أمامه في راحته ووضعها في الصحن، ثم انتظر أن تدفع هو سانيانغ الثلاث إليه. فعلت، وأضافت حبة تشانغ من غير أن تغير موضع أي ورقة.\u003c/p>\u003cp>بقيت مسألة في آخر الصفحة، فوضعت شين يان إصبعها عليها. «إذا دفع زبون بالنحاس وآخر بالدقيق، نسجل كل واحد كما دُفع. لا نحول الدقيق إلى نحاس بسعر لا نتفق عليه ثم نقسم الفرق.»\u003c/p>\u003cp>قالت هو سانيانغ: «نقسم الحبوب حبوبًا، والنحاس نحاسًا. وإذا بعنا الحبوب، نكتب ثمنها يوم البيع.»\u003c/p>\u003cp>«وما لا يقبل القسمة؟»\u003c/p>\u003cp>أخذت صاحبة النزل حبة فاصوليا من الصحن، وجربت شقها بظفرها، ثم تركتها. «يبقى في الحساب حتى يجتمع. لا نكسر النحاس.»\u003c/p>\u003cp>كتب لين لنفسه العلامة التي تدل على الباقي. كانت صغيرة، ويسهل أن تنسى بين سطر وآخر. طلب من شين يان أن تنقلها قرب القيد التالي أيضًا، فقالت إن مكانها في آخر الصفحة أفضل حتى لا يدخلوها في أجر يوم جديد مرتين.\u003c/p>\u003cp>تابعت هو سانيانغ القلم بعينيها. «والشهود؟»\u003c/p>\u003cp>«الكاتب يكتبها بحضورنا وتشانغ. هذا الذي نطلبه اليوم.»\u003c/p>\u003cp>نظرت إلى لين. «إذا سألك مرة أخرى عن الجنوب؟»\u003c/p>\u003cp>أبعد يده عن الصحن. «أقول إن منشأنا غير مثبت. وأوقع على ما قلته في المجلس.»\u003c/p>\u003cp>«لا تجعل كلامك أخف حين يكون على الورق.»\u003c/p>\u003cp>«لن أضع اسم قرية.»\u003c/p>\u003cp>سحبت شين يان الورقة الصغيرة الخاصة ببيانهما، وفتحتها على موضع خالٍ من الدهن. قرأت العمة ما فيه بصوت منخفض، ثم توقفت عند سطر الشهود.\u003c/p>\u003cp>«لا تكتبا أنني شهدت على أول حياتكما. منذ دخلتما بابي فقط.»\u003c/p>\u003cp>كتبت شين يان ذلك، وأعادت القراءة. حين انتهت، أبقت الورقة مفتوحة لتراها العمة مرة أخرى. لم تضعها فوق حساب الحصص؛ تركت بين الورقتين عرض كف، حتى حين جمعت القلم والمحبرة بعيدًا عن حافة الطاولة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين انتهى الحديث، نهضت هو سانيانغ لتأتي بالطعام. لم تحضر الوعاءين الكبيرين اللذين وضعتهما لهما قبل وصول النازحين. قطعت الخبز على لوح واحد، ووضعت عليهما نصيبهما من الفطور.\u003c/p>\u003cp>قالت: «كُلا قبل الذهاب. قد يمسكنا الكاتب حتى الظهر.»\u003c/p>\u003cp>أخذ لين قطعة الخبز. أراد أن يشكرها على استمرار الكفالة، لكن الورقة التي أمامه لم تدع له أن يخلط الثمن بعشاء يفتح جرحًا ثم يغلقه. قال: «سنحمل نسختنا.»\u003c/p>\u003cp>أجابت: «ونقرأ نسخته.»\u003c/p>\u003cp>أكلوا في صمت قصير. بعد ذلك مسحت شين يان فتات الخبز بخرقة، ولفت الورق بعيدًا عن الدهن. تناول لين سترته، وجرب جيب العقد ليتأكد أنه جاف. عند الباب رفعت زوجته طرف كمها وأعادت ربطه حتى لا يجر فوق الطاولة عند وو.\u003c/p>\u003cp>دخل شياو دو ليسأل عمن سيحسب طعام المساء. قالت له عمته إنها ستعود، وإن طال غيابها يقيس الدخن بالمكيال الصغير ويترك الحساب لها. أومأ الصبي، ونظر إلى اللفافة، ثم أفسح الطريق.\u003c/p>\u003cp>وقفت هو سانيانغ قرب صندوقها، وأخرجت كيس الختم. فتحته، وتأكدت من الخرقة التي تحمي أسفله، ثم شدته من جديد. لم تعطه للين ليحمله عنها.\u003c/p>\u003cp>قال: «جاهزان.»\u003c/p>\u003cp>مشت نحوهما، ثم توقفت عند الطاولة حيث بقيت نسخة المسودة. أخذتها شين يان قبل أن تطلبها، ورفعتها حتى لا تنثني.\u003c/p>\u003cp>نظرت هو سانيانغ إلى الورقة في يدها. قالت: «اقرآ الشروط مرة أخرى قبل أن أضعه.»\u003c/p>\u003cp>ثم ضمت كيس الختم في راحتها، وفتحت باب النزل.\u003c/p>"},{"n":35,"t":"الفصل الخامس والثلاثون: تحت الختم","b":"\u003cp>خرجوا من النزل قبل أن يشتد الثلج. حملت هو سانيانغ كيس ختمها في كمها، ومشى لين إلى جانبها بالعقد ملفوفًا في قماش لا ينفذ إليه البلل. كانت شين يان تحمل اللفافة التي صاغتها في الصباح، وتضع يدها الأخرى على طرف معطفها كي لا يفتحها الهواء. بقي شياو دو عند الباب يتابعهم بعينيه، ثم عاد إلى الداخل حين طلبت منه عمته أن يراقب القدر.\u003c/p>\u003cp>لم يكن الطريق إلى بيت الكاتب بعيدًا، لكن الثلج القديم صار طينًا زلقًا عند المنعطف. مشت هو سانيانغ بحذر، من دون أن تتكئ على أحد. وحين وصلوا إلى الساحة رأوا تشانغ ينتظر قرب العمود الخشبي، يحمل مطرقته على كتفه. رفع يده تحية قصيرة، ثم نظر إلى العقد في يد لين.\u003c/p>\u003cp>قال: «طلبت أن أشهد على الحصص. لن أترككم تضيفون اسمي إلى غيرها.»\u003c/p>\u003cp>قالت شين يان: «لن نفعل. نثبت ما اتفقنا عليه فقط.»\u003c/p>\u003cp>مشى الأربعة معًا نحو المجلس. عند باب الكاتب وو وقف رجل من بيت ليو، يلف وشاحًا أخضر حول عنقه. لم يكن وكيل العائلة الذي رآه لين عند الطاحونة، بل شابًا يحمل لوحًا صغيرًا وقلمًا. نظر إلى ختم هو سانيانغ، ثم قال:\u003c/p>\u003cp>«أنت ذاهبة لتجديد ضمان الغريبين؟»\u003c/p>\u003cp>توقفت. «أنا ذاهبة لأثبت اتفاقًا بين شركاء.»\u003c/p>\u003cp>«سمعت أن الأمر يتعلق بالكفالة.»\u003c/p>\u003cp>قالت شين يان: «الكفالة في سجل الكاتب. الحصص في عقد الطاحونة. كل واحدة لها ورقة.»\u003c/p>\u003cp>لم يبتسم الشاب. «السيد ليو لا يحب أن تختلط الأوراق.»\u003c/p>\u003cp>أجابته هو سانيانغ: «إذن سيجدها مفصولة.» ثم تابعت السير.\u003c/p>\u003cp>قبل أن يجيب أحد، فتح الكاتب الباب من الداخل. كان قد سمع الكلام، لكنه لم يتدخل حتى صاروا على العتبة. قال للرجل: «إذا كان لديك طلب إلى المجلس، اكتبه. لا تجعلني أستنتج ما تريد من وشاحك.»\u003c/p>\u003cp>قال الشاب: «لا أطلب شيئًا. أسأل فقط.»\u003c/p>\u003cp>«السؤال الذي لا يثبت في الدفتر يضيع وقته.» تنحى وو لهم. «ادخلوا. ولا تتركوا الطين في الممر.»\u003c/p>\u003cp>مسح لين حذاءه عند العتبة. رأى أن التراب يترك خطًا داكنًا على القش المفروش، فرفع قدمه الثانية عن الأرض قبل أن تطأه. بدا له هذا التفصيل أهم من الخلاف كله لدقيقة؛ القش يحمي البلاط من البلل، والبلل يجعل الغرفة أبرد. ثم تذكر أن هو سانيانغ تمشي خلفه، فأفسح لها المجال كي تدخل من غير أن تمر على البقعة.\u003c/p>\u003cp>كان الكاتب وو داخل الغرفة، ينفخ على أصابعه فوق موقد صغير. رفع رأسه حين دخلوا، ورأى تشانغ خلفهم. أشار إلى المقاعد، لكن هو سانيانغ بقيت واقفة حتى فرش لين العقد على الطاولة.\u003c/p>\u003cp>قال وو: «انتهت مهلة بيانكم غدًا. هل اتفقتم على صيغة؟»\u003c/p>\u003cp>وضعت شين يان اللفافة إلى جوار العقد. «اتفقنا على ما نعرفه وما لا نعرفه. وهذه ورقة الحصص، نريد أن نثبتها في ملحق العقد بحضور الشاهد.»\u003c/p>\u003cp>فك وو الرباط، وقرأ أول سطرين. «زيادة نصيب هو سانيانغ إلى ثلاثة أعشار من أجر الطحن ما دامت كفالتكما قائمة، مع مراجعة عند الحصاد.» رفع عينيه. «هل تريدان تعديل عقد الطاحونة كله؟»\u003c/p>\u003cp>قالت هو سانيانغ: «لا. أريد أن يعرف كل من يقرأ الورقة أنني تحملت مخاطرة إضافية.»\u003c/p>\u003cp>أضاف لين: «وحصة تشانغ تبقى عُشرًا. ونصيبنا يصير ستة أعشار. لا يتغير إيجار الاثني عشر كيسًا عند الحصاد، ولا بند حماية الإصلاحات ثلاث سنوات.»\u003c/p>\u003cp>أخرج العقد الأصلي. بحث عن موضع الأختام الثلاثة، ثم وضعه إلى يسار الملحق. لم يمزق شيئًا ولم يشطب بندًا. قارن التاريخ بخط شين يان، وأعاد قراءة العبارة مرتين.\u003c/p>\u003cp>قال تشانغ: «أقرأها أنا أيضًا؟»\u003c/p>\u003cp>«نعم.» دفعت شين يان الورقة ناحيته. «إذا وجدت كلمة تغير ما اتفقنا عليه، قلها.»\u003c/p>\u003cp>قرأ ببطء، محركًا شفتيه عند كل رقم. توقف عند كلمة «الأجر». «أجر الطحن فقط؟ لا أجرة الإصلاح؟»\u003c/p>\u003cp>قالت هو سانيانغ: «فقط ما يدخل من طحن القمح والدخن. إذا باع لين شيئًا آخر أو عمل في بيت، فلا حصة لي فيه.»\u003c/p>\u003cp>سأل وو: «وهل تدخل أيام الوعد المجانية في الحساب؟»\u003c/p>\u003cp>أجابت شين يان: «لا يوجد أجر يُقسم في يوم الوعد. نكتب عدد الأكياس التي طُحنت مجانًا في سجل منفصل، كما نفعل الآن.»\u003c/p>\u003cp>هز وو رأسه. «جيد. لا أريد أن أرى بعد شهر مطالبة على كيس لم يُدفع ثمنه.»\u003c/p>\u003cp>عاد إلى الورقة، وأضاف العبارة في موضع فاصل: «لا تشمل الزيادة الإيجار ولا الديون السابقة ولا أي عمل خارج الطحن.» ثم قرأها بصوت مسموع. طلب من الجميع أن يراجعوها، لا أن يكتفوا بكلامه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دخل الرجل ذو الوشاح الأخضر بعد أن طرق الباب طرقة واحدة. لم يستأذن. وضع لوحه على طرف الطاولة وقال: «السيد ليو يطلب نسخة من كل تعديل يمس الطاحونة.»\u003c/p>\u003cp>لم يرفع وو رأسه. «هذا التعديل لا يمس ملك الأرض ولا الإيجار. لكنه يسجل حصة الشركاء، لذلك سأعطي نسخة لأصحاب العقد.»\u003c/p>\u003cp>«والكفالة؟»\u003c/p>\u003cp>«سجل آخر.»\u003c/p>\u003cp>«لكنها سبب زيادة الحصة.»\u003c/p>\u003cp>أجاب وو وهو يجفف طرف القلم: «السبب يشرح الاتفاق ولا يحول الدفتر الخاص إلى دفتر عام. إذا أراد السيد ليو أن يطلب شيئًا من عقده، فليأت باسمه وختمه.»\u003c/p>\u003cp>نظر الرجل إلى هو سانيانغ. «هل وافقتِ على الزيادة طوعًا؟»\u003c/p>\u003cp>قالت: «نعم.»\u003c/p>\u003cp>«وهل تعرفين أن الكفالة قد تجلب لك غرامة إن أخفيا منشأهما؟»\u003c/p>\u003cp>رفع وو عينيه هذه المرة. «هذا سؤالي أنا. وقد أجابت عنه حين أكدت استمرار الكفالة. لا حاجة إلى محاسبتها أمامك.»\u003c/p>\u003cp>مر صمت قصير. لم يتحرك تشانغ، لكنه وضع كفه على مقبض المطرقة. أما لين فظل ساكنًا، وقد لاحظ أن الرجل لم يسأل عن الدخل الذي تحصل عليه هو سانيانغ، بل عن موضع يستطيع فيه بيت ليو أن يمد إصبعه إلى الورق.\u003c/p>\u003cp>قال الرجل: «سأنقل ما رأيت.»\u003c/p>\u003cp>ردت هو سانيانغ: «انقل ما قرأت.»\u003c/p>\u003cp>خرج من دون أن يأخذ نسخة. تابع وو كتابة الملحق. لم يرفع صوته ولم يبد منتصرًا؛ كان حريصًا على أن يبقى السجل ملكًا له، كما أنفذ ضريبته، وأن لا يتحول خلاف ملكية الطاحونة إلى نزاع يضعف سلطته.\u003c/p>\u003cp>بقيت عينه على الباب بعد خروج الرجل. ثم عاد إلى القلم وسأل هو سانيانغ: «هل طلب منك أحد من بيت ليو أن توقعي شيئًا؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«هل دفعوا لك مالًا لتقبلي بهذه الزيادة؟»\u003c/p>\u003cp>«لم يدفعوا لي شيئًا.»\u003c/p>\u003cp>«وهل تتوقعين منهم أن يعترضوا؟»\u003c/p>\u003cp>قالت: «أتوقع أن يسألوا. لا أعرف ماذا يفعلون بعد السؤال.»\u003c/p>\u003cp>أومأ وو، وكتب ملاحظة قصيرة منفصلة عن العقد. لم يطلب منها أن تتهم أحدًا، ولم يمح ما قاله رجل بيت ليو. سأل شين يان إن كان لديها نسخة من الاتفاق الأول. أخرجت العقد من غلافه وأشارت إلى التوقيعات الثلاثة. وضع الكاتب الورقة الجديدة فوق القديمة، مع ترك مواضع الأختام ظاهرة.\u003c/p>\u003cp>قال: «لا أريد أن يبدو التعديل كأنه نزع لبند سابق. سيبقى الأصل في السجل، وهذه ورقة تلحق به.»\u003c/p>\u003cp>سألت شين يان: «ومن يستطيع أخذ الأصل؟»\u003c/p>\u003cp>«لا أحد من الشركاء. يبقى هنا، وتؤخذ نسخ.»\u003c/p>\u003cp>أشارت إلى زاوية العقد. «إذن اكتب رقم الصفحة على النسخة التي نأخذها، ونكتب الرقم نفسه في سجلنا.»\u003c/p>\u003cp>نظر إليها وو. «تريدين أن تمنعي اختلاف النسختين.»\u003c/p>\u003cp>«أريد أن أعرف إن تبدل شيء.»\u003c/p>\u003cp>لم يسخر. رسم الرقم على أعلى الورقة، ثم طلب من تشانغ أن يتأكد من ظهوره في النسخة الأخرى. مرر الحداد إصبعه على الحبر الطري دون أن يلمسه. «واضح.»\u003c/p>\u003cp>كتب الأسماء والحصص والتاريخ. طلب من لين أن يضع بصمته، ومن هو سانيانغ أن تختم عند طرف السطر، ثم وقع تشانغ شاهدًا. أعاد لكل واحد ورقته قبل أن يجف الحبر. سألته شين يان إن كان يمكن أن يثبت في الهامش أن التغيير ينتهي إذا انتهت الكفالة رسميًا قبل الحصاد.\u003c/p>\u003cp>قال وو: «هذا موجود في نصكم.»\u003c/p>\u003cp>«أريد تاريخ رفع الاسم إذا حدث ذلك. لا يكفي أن نعرف أنه انتهى؛ يجب أن نعرف متى.»\u003c/p>\u003cp>أخذ القلم وأضاف: «تثبت نهاية الكفالة في سجل المجلس بتاريخها، وينتهي التعديل في التاريخ نفسه.» ثم قلب الورقة نحوها.\u003c/p>\u003cp>قرأتها كلمة كلمة. «هذا واضح.»\u003c/p>\u003cp>سألها: «هل تتوقعين أن تُرفع؟»\u003c/p>\u003cp>«لا أعرف. لا أكتب ما أتوقعه.»\u003c/p>\u003cp>لم يعلق وو، لكنه وضع الورقة فوق العقد وقال: «الآن نقرأ بيان المنشأ.»\u003c/p>\u003cp>فتحت شين يان لفافتها. قرأ لين ما كتبتاه: أنهما لا يستطيعان إثبات انتسابهما إلى أي قرية في الإقليم، وأنهما تركا نسبتهما إلى الجنوب تمر من غير تصحيح، وأنهما لا يقدمان اسمًا بديلًا. وأن عملهما في طاحونة جياو ومورد الرزق الظاهر يمكن التحقق منهما. لم تصف خوفه عند الوصول، ولم تذكر المختبر ولا القطعة السوداء ولا النظام. لم تكن تلك الأشياء مما يستطيعان إثباته لهؤلاء.\u003c/p>\u003cp>قال وو: «لماذا أضفتما أنكما لم تصححا القول؟»\u003c/p>\u003cp>أجاب لين: «لأنها الحقيقة التي تخص هذا السجل. قيل إننا من الجنوب، ولم نكن كذلك. تركنا الكلام يمر لأننا خفنا أن نُطرد قبل أن نفهم أين نحن.»\u003c/p>\u003cp>«والآن؟»\u003c/p>\u003cp>«الآن لا أطلب أن تصدق منشأ لا أستطيع إثباته.»\u003c/p>\u003cp>قرأ وو الورقة مرة ثانية، ثم وضع إصبعه على مكان التوقيع. «لا أستطيع أن أكتب أنني عرفت من أين أتيتما. سأكتب أنكما قدمتما بيانًا، وأن المنشأ غير مثبت، وأن سون لي لم يشهد بما لا يعرف. هل توافقان؟»\u003c/p>\u003cp>قالت شين يان: «نوافق.»\u003c/p>\u003cp>وقعت، ثم دفع لين القلم إلى وو. كتب الكاتب ملاحظته في السجل، وترك فراغًا بجانبها كي يضيف رقم العقد. لم يشطب السؤال عن الجنوب من دفتره، لكنه لم يحوله إلى اعتراف بجريمة لم تقع.\u003c/p>\u003cp>عند الباب كان تشانغ قد انتهى من تثبيت كم معطفه. قال: «صار لكل ورقة مكان.»\u003c/p>\u003cp>قال لين: «ليس لكل سؤال جواب.»\u003c/p>\u003cp>«السؤال لا يثبت شيئًا.» ثم مضى أمامهم.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الخارج كان الثلج يخف. مشت هو سانيانغ إلى النزل ببطء، ثم توقفت حين لمحوا سون لي قرب البوابة. كان يحمل رزمة صغيرة من الحطب اليابس على كتفه، وساقه المصابة ملفوفة تحت الثوب. لم يضعها على الأرض حتى رآهم.\u003c/p>\u003cp>قال لين: «لا تحملها وحدك. كان يمكن أن تنتظر.»\u003c/p>\u003cp>«أخذت أقل مما ظننت.» نظر إلى شين يان. «قالت لي إن النقل الخفيف يناسبني. لو تركت الحطب هناك لابتل.»\u003c/p>\u003cp>قالت: «هل اتفقت مع العمة على المقابل؟»\u003c/p>\u003cp>«رغيف وطعام ساخن اليوم. وغدًا نرى حال ساقي. لم أعدها أن أحمل للناس.»\u003c/p>\u003cp>أومأت. «جيد.»\u003c/p>\u003cp>دخلت هو سانيانغ إلى الحظيرة لتتفقد النازحين. كان على الأرض وعاء ماء دافئ وخرقة نظيفة، وقد وضعت أحد الرجال قرب الموقد كي يجف ثوبه. لم يكن هناك متسع يكفي الجميع، فجلس اثنان عند الباب يتبادلان الدفء مع حركة الداخلين والخارجين. سألها لين إن كانوا يحتاجون إلى وقود أكثر.\u003c/p>\u003cp>قالت: «نحتاج إلى معرفة كم بقي في الرصة أولًا.»\u003c/p>\u003cp>قاسوا الحطب معًا. لم تخلط ما خصصته للضيوف بما بقي للطاحونة، ولم تعد أن تكفيهم أيامًا لا تملكها. سجلت شين يان الكمية في صفحة جديدة، ثم كتبت اسم سون لي في سطر العمل المؤقت، وأبقت مكان الأجر فارغًا حتى يعرفوا ما أنجزه.\u003c/p>\u003cp>سأل سون لي إن كان يستطيع أن يضع شيئًا من أمتعته قرب الباب، لكنه لم يطلب مكانًا خاصًا. قالت هو سانيانغ إن ما يبلل الأرض يرفعونه إلى الرف، وما له صاحب يكتبون اسمه على قطعة قماش. دفع إليها كيسًا صغيرًا مربوطًا بحبل، لا يزيد على قميصين ووعاء خشب مشقوق. كتب شياو دو الاسم على قصاصة، وقارنته شين يان بما نطقه الرجل. لم يحاولا تحويل الاسم إلى رسمتهما الخاصة؛ تركا له أن يريهما طريقة كتابته إن كان يعرفها.\u003c/p>\u003cp>قال سون: «لا أعرف حروفكم.»\u003c/p>\u003cp>ردت شين يان بلغتها الأصلية: «نكتب الصوت الذي نسمعه.» ثم قالت له بالفصحى: «إذا أخطأنا في نطقه، صححنا غدًا.»\u003c/p>\u003cp>تردد، ثم أعاد اسمه مقطعًا مقطعًا. كررته هي، وصححته مرة. لم يتغير شيء في الحساب، لكن الرجل راقب القلم وهي تكتب، كأنه ينتظر أن ترى فيه كلمة أخرى. لم تستعجل يده ولا نظره. حين انتهت، أعطته القصاصة ليتأكد من العلامة، فأومأ وأعادها.\u003c/p>\u003cp>نظرت هو سانيانغ إلى صفحة الحصص الجديدة. «ثلاثة أعشار.»\u003c/p>\u003cp>قال لين: «حتى ينتهي سجل الكفالة أو نراجع الاتفاق عند الحصاد.»\u003c/p>\u003cp>«أعرف ما وافقت عليه.» أخذت القلم ووضعت خطًا تحت العبارة التي تحدد المدة. «لا تجعلني أكررها كل يوم.»\u003c/p>\u003cp>لم يكن في صوتها دفء، لكنه لم يحمل الأمر القديم وحده. عادت إلى المطبخ، وسألت شين يان أن تساعدها في تقسيم الدخن إلى وجبتين. لم تطلب منها أن تكتب الحساب عنها، ولم تمنعها كذلك. جلستا جنبًا إلى جنب، إحداهما تزن والأخرى تسجل.\u003c/p>\u003cp>أخرجت هو سانيانغ من القدر مقدارًا يكفي الموجودين، ثم أوقفت يد شين يان حين مالت الملعقة. «هذا للوجبة الأولى. لا تنقلي الباقي قبل أن يعود الصبيان من الحظيرة.»\u003c/p>\u003cp>قالت شين يان: «كتبت الوزن. بقي أن نعرف كم شخصًا يأكل.»\u003c/p>\u003cp>«سبعة عشر في الغرفة الكبيرة، وثلاثة قرب الموقد. الصغيران يأكلان من وعاء واحد حين يبرد الطعام. لا أحسبهما وجبة واحدة.»\u003c/p>\u003cp>أضافت شين يان الأسماء التي تعرفها في الهامش. لم تكتب «النازحون» كتلة واحدة؛ لكل شخص مقدار وموضع، وللجرحى ما يناسبهم. وقفت هو سانيانغ تراقب السطر، ثم دفعت إليها صحنًا فارغًا كي تضع فيه ما يخص عامل الطاحونة. لم تقل إن هذا مشاركة ولا عودة إلى ما كان. تركتهما تعملان جنبًا إلى جنب، وتدخلت كلما أخطأت اليد في الوزن.\u003c/p>\u003cp>حين خرج لين إلى الساحة، كان الرجل ذو الوشاح الأخضر قد عاد إلى الطريق المؤدي إلى بيت ليو. لم يلتفت. عند مدخل النزل وقف صبي يحمل كيسًا صغيرًا، ينتظر دوره للطحن. لم يسأله عن الجنوب، بل قال:\u003c/p>\u003cp>«هل تقبلون هذا الوزن؟»\u003c/p>\u003cp>رفع لين الكيس، وقدّر ثقله بيده. «نزن أولًا.»\u003c/p>\u003cp>مد الصبي الكيس إليه. وفي يد شين يان، داخل المطبخ، استقرت الورقة التي تحمل ختم هو سانيانغ إلى جانب سجل جديد لم يُكتب فيه اسم مجهول.\u003c/p>"},{"n":36,"t":"الفصل السادس والثلاثون: بيت حرفيين","b":"\u003cp>في صباح اليوم الحادي والعشرين بعد المئة، وجدوا ورقة الكاتب معلقة عند مدخل النزل. لم تكن مختومة بختم بيت ليو، بل بختم المجلس الأحمر الذي يضعه وو على ما يريد أن يراه الناس. التصق طرفها بالخشب من أثر الثلج، فحررها لين برفق كي لا يمزق السطر الأخير.\u003c/p>\u003cp>جاءت هو سانيانغ من المطبخ وهي تمسح يديها بمئزرها. نظرت إلى الورقة ولم تمد يدها إليها. قالت: «اقرأها هنا. لا نريد أن نلحقها في الوحل.»\u003c/p>\u003cp>قرأ لين العنوان، ثم توقف. «طلب تسجيل مورد رزق ومكان إقامة مؤقت.»\u003c/p>\u003cp>قالت شين يان: «ليس أمرًا بالإخلاء.»\u003c/p>\u003cp>«ولا تثبيتًا بعد.»\u003c/p>\u003cp>رفعت هو سانيانغ حاجبها. «اقرأ الباقي.»\u003c/p>\u003cp>كان النص يطلب منهما الحضور إلى المجلس قبل غروب اليوم، وإحضار شاهد على عملهما وبيان المنشأ، ودفع رسم التسجيل البالغ أربع نحاسات. ثم يذكر جباية عمل مؤقتة مقدارها نحاستان كل تسعة أيام حتى الحصاد، مع إيصال لكل دفعة. أما بقية الشروط فكانت في أسفل الورقة: إثبات المهنة، واسم الكفيل، وعدم المطالبة بخدمة عامة غير مدفوعة ما لم يسجلها المجلس بعقد منفصل.\u003c/p>\u003cp>قرأت شين يان الرقم مرتين. «أربع نحاسات مرة واحدة. ونحاستان كل تسعة أيام.»\u003c/p>\u003cp>قالت هو سانيانغ: «هل بقي معكما ما يكفي؟»\u003c/p>\u003cp>«نحو سبع وثلاثين نحاسة، إذا لم يخطئ حساب الدفتر. والدين مئة وأربع وعشرون. لا أريد أن أخلطهما.»\u003c/p>\u003cp>قالت العمة: «لم أسألك إن كنت تريدين خلطهما. سألت هل تكفي.»\u003c/p>\u003cp>«تكفي للرسم، لا لأكثر من ذلك بلا حساب.»\u003c/p>\u003cp>أعادت الورقة إلى يد لين. لم تبتسم، لكنها لم تطلب منه أن يرفض. دخلت المطبخ وأخرجت وعاءً فيه خبز من الأمس، ثم وضعته قرب شين يان. «خذي لقمة قبل أن تبدئي الحساب.»\u003c/p>\u003cp>لم تأكل شين يان فورًا. فتحت دفترها على صفحة نظيفة، وكتبت البنود كما وردت: رسم، جباية، موعد، إيصال. ثم رسمت خطًا بين رسم التسجيل والجباية.\u003c/p>\u003cp>قال لين: «ما الذي يقلقك في كلمة عمل؟»\u003c/p>\u003cp>«قد يكتبون علينا حملًا أو إصلاحًا لا نعرفه قبل أن يطلبوه. الجملة تقول إن الخدمة غير المدفوعة تحتاج عقدًا منفصلًا. أريد أن أعرف من يقرر إذا كان الطلب خدمة عامة.»\u003c/p>\u003cp>«وإذا كان فيه أجر؟»\u003c/p>\u003cp>«فليذكروا الأجر والمدة ومن يحاسبنا. كلمة واحدة لا تكفي.»\u003c/p>\u003cp>جلست هو سانيانغ مقابلهما، وأخذت قطعة خبز. «الكاتب يعرف أن الطاحونة تعمل. لا تذهبا إليه كأنكما تكتشفان العقد لأول مرة. اسألاه عن السطر الذي لا تفهمانه.»\u003c/p>\u003cp>قالت شين يان: «سنفعل.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ساروا إلى المجلس بعد أن تركوا لتشانغ نسخة من ورقة الحصص الجديدة. لم يكن معهم ما يكفي لشراء شيء في السوق، لذلك لم يتوقفوا عند الباعة. كان الثلج قد انحسر عن الطريق، وبقيت طبقة رقيقة عند ظل الجدار. كلما وطئت هو سانيانغ موضعًا جافًا اختارته شين يان، ثم تجاوزته حين صار المسار ضيقًا.\u003c/p>\u003cp>عند المجلس، كان الكاتب وو يراجع سجل العمال. وقف أمامه شابان يحملان أكياس حبوب، ينتظران إثبات الوزن. لم يطلب منهما أن يغادرا. جلس لين مع شين يان قرب الباب، وبقيت هو سانيانغ واقفة حتى فرغ وو من الحساب. وضع الشابان إصبعيهما على العلامتين، ثم خرجا بإيصال صغير.\u003c/p>\u003cp>قال وو لهو سانيانغ: «دخلتِ معهم؟»\u003c/p>\u003cp>قالت: «هذه ورقتهم. وهذه ورقتنا.» وضعت نسخة طلب التسجيل أمامه.\u003c/p>\u003cp>قرأتها شين يان بصوت منخفض، ثم أشارت إلى الجملة الأخيرة. «ما المقصود بخدمة عامة غير مدفوعة؟»\u003c/p>\u003cp>قال وو: «إذا طلب المجلس من بيت مسجل أن ينظف طريقًا عامًا بعد عاصفة مثلًا، فيكتب الطلب وعدد الأيام. لا يعني ذلك أن صاحب الأرض يستطيع أن يأخذ العمل مجانًا.»\u003c/p>\u003cp>«ومن يقدر المقابل؟»\u003c/p>\u003cp>«إذا كان العمل طارئًا على الناس جميعًا، لا يكون له أجر فردي. أقول هذا بوضوح حتى لا أزينه. إذا طلب المجلس مهارة خاصة أو أيامًا طويلة، يكتب اتفاقًا على الأجر أو التعويض.»\u003c/p>\u003cp>لم تتراجع شين يان عن سؤالها. «وإذا كان أصحاب الأرض هم من طلبوا؟»\u003c/p>\u003cp>«فليس عملًا للمجلس. يذهبون إلى صاحب الحرفة ويتفقون معه.»\u003c/p>\u003cp>نظر لين إلى وو. «هل هذه الورقة تجعلنا مدينين لكم بنوبات ثابتة؟»\u003c/p>\u003cp>«لا. الجباية المكتوبة منفصلة عن العمل. كل نحاستين كل تسعة أيام حتى الحصاد، ما لم يتغير وضعكم أو ألغَ المجلس الترتيب.» أخرج إيصالًا فارغًا من الدرج. «أدفع لكل منكما إيصالًا مختومًا. لا أدع ذلك في الذاكرة.»\u003c/p>\u003cp>قالت هو سانيانغ: «وهل تدخل نحاستا الجباية في دين الطاحونة؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«ولا تُخصمان من إيجار الاثني عشر كيسًا؟»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>قالت شين يان: «نريد هذا مكتوبًا في النسخة التي سنحتفظ بها.»\u003c/p>\u003cp>ابتسم وو ابتسامة صغيرة لم تصل إلى عينيه. «تسألين أسئلة الكاتب.»\u003c/p>\u003cp>قالت: «نحن من سندفع إذا ضاع المعنى.»\u003c/p>\u003cp>أعاد الورقة إليها. أضاف بخطه: «الجباية المذكورة مستقلة عن إيجار الأرض وديون الشركاء، ولا تنشئ حقًا لبيت ليو في العمل.» ثم وضع توقيعه عند الهامش. لم يبدُ عليه أنه أحب الجملة الأخيرة، لكنه أبقاها.\u003c/p>\u003cp>سأله لين: «مقابل ماذا ندفعها؟»\u003c/p>\u003cp>أجاب: «مقابل أن أضعكما في سجل بيوت الحرفيين، وأعرف من أين أطلبكما إذا حدث ضرر في المجرى أو شكوى على العمل. لا أمنحكما أرضًا، ولا أعفيكما من الإيجار. وجود اسم واضح يحمي المجلس كما يحميكما.»\u003c/p>\u003cp>قالت هو سانيانغ: «ومن يقرأ اسمنا؟»\u003c/p>\u003cp>«من يحتاج إلى معرفة أنكما تعملان هنا، لا من يريد أن يشتري حصتكما.»\u003c/p>\u003cp>«ومن يقرر الحاجة؟»\u003c/p>\u003cp>توقف القلم بين أصابعه. «أنا الآن. إن تغير الكاتب، سيرى السجل من بعدي.»\u003c/p>\u003cp>لم يكن جوابًا يطمئنها، لكنه لم يتظاهر بضمان أكبر مما يملك. نظرت شين يان إلى لين. «نحتاج إلى نسخة كاملة، لا سطر التعهد فقط.»\u003c/p>\u003cp>قال وو: «أكتب الأصل على صفحتين، وأعطيكما نسخة عليها ختم المجلس. لكن الاسم في السطر الأخير لم يُملأ.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلسوا إلى الطاولة. وضع وو دفتر السجل أمامه، وكتب اسم كل منهما في سطر مستقل. ترك خانة المهنة فارغة، وخانة المنشأ أيضًا. وتحتها كتب: «المنشأ غير مثبت؛ البيان محفوظ في الملف». ثم أضاف أن هو سانيانغ كفيلة، وأن مورد الرزق طاحونة جياو المستأجرة.\u003c/p>\u003cp>قرأ لين كلمة «مستأجرة». كان قد اعتاد أن يراها في العقد، لكنها بدت هنا أثقل؛ تثبت عملهما وتذكرهما بأن الأرض ليست لهما.\u003c/p>\u003cp>قالت شين يان: «اسم الطاحونة يكفي لتحديد المكان؟»\u003c/p>\u003cp>«أضيف منعطف النهر، شرق القرية. يعرفه كل من هنا.»\u003c/p>\u003cp>«هل نحتاج إلى اسم صاحب الأرض؟»\u003c/p>\u003cp>«اسم عائلة ليو موجود في سجل الملكية، لا في عقد عملكما.»\u003c/p>\u003cp>كتبت شين يان هذا في دفترها. لم ترفع رأسها وهي تكتب؛ كانت تتبع حافة السطر بقلمها كيلا يتداخل مع العلامة السابقة.\u003c/p>\u003cp>سأل وو: «ما مهنتكما؟»\u003c/p>\u003cp>قال لين: «إصلاح الطاحونة وتشغيلها.»\u003c/p>\u003cp>«وهل تصنعان الأدوات؟»\u003c/p>\u003cp>«نصلح ما نستطيع. لا نملك ورشة مستقلة.»\u003c/p>\u003cp>قالت هو سانيانغ: «تشانغ هو الحداد. لا تسجلوا الطاحونة كحدادة.»\u003c/p>\u003cp>أومأ وو. «أسجل: تشغيل طاحونة وإصلاح أخشابها وأجزائها. والحدادة لتشانغ، إذا أراد أن يسجلها.»\u003c/p>\u003cp>لم يعترض تشانغ، لكنه قال: «لا تكتب أني أعمل فيها كل يوم. أصلح ما أقبله.»\u003c/p>\u003cp>«أضيف ذلك.» نظر الكاتب إلى شين يان. «هل تريدين تسجيل القراءة والكتابة؟»\u003c/p>\u003cp>«لا. هذه ليست المهنة التي تكسبنا الطعام.»\u003c/p>\u003cp>«لكنك تقدمين الحسابات.»\u003c/p>\u003cp>«حساب الطاحونة جزء من عملنا. أما قراءة سجلات الناس فليست خدمة عامة.»\u003c/p>\u003cp>لم يبتسم وو هذه المرة. «إذن لن أكتبها.»\u003c/p>\u003cp>كتب لكل واحد اسمًا، ثم توقف عند خانة مشتركة كانت ستسمى «حرفة البيت». بقي رأس القلم فوق الصفحة. «هذا السطر يحتاج إلى اسم مختصر. ماذا تسميان عملكما؟»\u003c/p>\u003cp>قال لين: «الطاحونة.»\u003c/p>\u003cp>«هذه آلة. أحتاج اسمًا يميز البيت الذي يديرها.»\u003c/p>\u003cp>قالت شين يان: «نحن لم نؤسس بيتًا جديدًا. نعمل عند طاحونة جياو.»\u003c/p>\u003cp>«سجل الحرفيين لا يحفظ اسم الآلة فقط. حين يأتي جامع الضريبة يسأل عن بيوت العمل. قد أكتب اسميكما بيتين منفصلين، لكنكما شريكان في مورد واحد.»\u003c/p>\u003cp>سألت هو سانيانغ: «وإذا كتبت اسمًا، هل يصير ملكًا؟»\u003c/p>\u003cp>«لا. الاسم لا ينقل أرضًا ولا يغير عقدًا. يحدد مورد الرزق في السجل.»\u003c/p>\u003cp>لم يكن الاسم مسألة زينة. إذا كتبوا ما يوحي بأن لهم ملكية على الطاحونة، صار السجل سلاحًا لبيت ليو. وإذا اكتفوا باسم فردي، أمكن أن تختفي شراكة هو سانيانغ وتشانغ من أي سجل لاحق. نظر لين إلى شين يان، ولم يسبقها إلى الجواب.\u003c/p>\u003cp>قالت: «نعطيك الاسم غدًا.»\u003c/p>\u003cp>قال وو: «يجب أن يكتمل قبل إغلاق السجل.»\u003c/p>\u003cp>«نستطيع إكماله قبل الغروب.»\u003c/p>\u003cp>قالت هو سانيانغ: «لا تختاريه لأنك تريدين أن يبدو كبيرًا.»\u003c/p>\u003cp>«لن أفعل.»\u003c/p>\u003cp>أغلق وو دفتره عند الخانة الفارغة. «سأنتظر إلى آخر النهار. بعد ذلك لا أضمن أن يبقى في هذه الصفحة.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخرج لين كيس النقود من جيبه، وفرد النحاسات على الطاولة. فصل أربعًا عن الباقي، ثم أعاد عدها. لم يدفعها بعد. قال: «نستطيع دفع الرسم اليوم، لكن لا ندفع حتى نرى الاسم في النسخة.»\u003c/p>\u003cp>قال وو: «هذا حقكما.»\u003c/p>\u003cp>أخرج الإيصال، وكتب فيه «رسم تسجيل، أربع نحاسات»، وترك خانة الدفع فارغة. قال: «لا أوقع أنني قبضت قبل أن أقبض.»\u003c/p>\u003cp>قالت هو سانيانغ: «جيد.»\u003c/p>\u003cp>سألته شين يان عن الجباية التالية. قال إن موعد أول دفعة يثبته عند اكتمال التسجيل، وإن المدة بين الدفعات تسعة أيام. كتبت شين يان اليوم الحادي والعشرين من بعد المئة على ورقتها. «إذن يبدأ العد من تاريخ الدفع، لا من يوم التسجيل.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«والدفعة التالية بعد ذلك بتسعة أيام؟»\u003c/p>\u003cp>«ما دام الاتفاق قائمًا.»\u003c/p>\u003cp>لم يكن المبلغ كبيرًا، لكنه لم يكن تافهًا. كل نحاسة تخرج من الكيس تقلل ما يستطيعان دفعه إذا احترق جزء من الطاحونة أو احتاجت شين يان إلى طعام لا ينتظر الحصاد. وكان الدين منفصلًا، والإيجار ينتظر الموسم، والنازحون يستهلكون من الحطب والطعام. لم يرسم النظام شيئًا على طرف بصر لين. لم يطلب تحليلًا ولا ظهرت له رسالة. كانت المسألة ورقة ومالًا واسمًا لا يستطيع الجهاز أن يختارهما عنه.\u003c/p>\u003cp>قالت هو سانيانغ: «أربع نحاسات ثمن سجل، لا ثمن حماية.»\u003c/p>\u003cp>قال وو: «لم أقل إنه حماية.»\u003c/p>\u003cp>«لكن الناس قد يسمونه كذلك.»\u003c/p>\u003cp>«دعهم يسمونه ما يشاؤون. أنا أسجل مورد العمل.»\u003c/p>\u003cp>أعاد لين النحاسات إلى كيسه، وبقيت الأربع في يده. لم يضعها على الطاولة. قال: «نرجع بعد أن نتفق على الاسم. إذا لم نجد اسمًا، نسجلنا بلا عنوان مشترك.»\u003c/p>\u003cp>قال وو: «أستطيع ترك الخانة فارغة يومًا، لا أسبوعًا.»\u003c/p>\u003cp>وقفت شين يان. «نعود قبل الغروب.»\u003c/p>\u003cp>أعاد لهم العقد والبيان بنسختين، ثم ختم الورقة التي تحمل الشروط. خرجوا إلى الساحة. عند الباب كان الرجل ذو الوشاح الأخضر قد عاد، لكنه لم يدخل. نظر إلى الورقة المختومة في يد لين.\u003c/p>\u003cp>قال: «ما اسم الحرفة؟»\u003c/p>\u003cp>أجابت هو سانيانغ: «حين يُكتب، ستقرأه.»\u003c/p>\u003cp>لم يسأل أكثر. مشوا باتجاه النزل، وبينهم أربع نحاسات لم تنتقل بعد إلى صندوق المجلس، وخانة فارغة تنتظر اسمًا لا يسرق الطاحونة من أصحابها.\u003c/p>\u003cp>في الطريق، طلبت شين يان أن يتوقفوا عند حافة الساحة. فتحت الورقة وراجعت البنود من أولها، بينما أمسك لين طرفها كي لا يطير. عددت بأصابعها: رسم واحد، ثم جباية كل تسعة أيام حتى الحصاد، وإيصال في كل مرة، وخدمة لا تُطلب منهم إلا بعقد مستقل. وضعت علامة صغيرة بجانب كل بند. لم تكن تخشى خطأ في الجمع بقدر ما خشيت أن يختفي شرط بين الصيغتين.\u003c/p>\u003cp>قال لين: «إذا استمر التسجيل إلى الحصاد، فكم دفعة ستقع؟»\u003c/p>\u003cp>«لا أستطيع أن أعد الأيام إلى الحصاد من غير تاريخ يحدده المجلس. نكتب المواعيد واحدة واحدة عندما يأتي إيصالها.»\u003c/p>\u003cp>«هذا يجعل الحساب أبطأ.»\u003c/p>\u003cp>«ويمنعنا من دفع دفعة عن يوم لم يحن.»\u003c/p>\u003cp>أخرجت هو سانيانغ قطعة نحاس من كيسها، وأدارتها بين إصبعيها. «رسم الأربع لا يعود إذا تركتما السجل.»\u003c/p>\u003cp>قالت شين يان: «أعرف. لذلك نقرأ قبل الدفع.»\u003c/p>\u003cp>«والجباية؟»\u003c/p>\u003cp>«نطلب تاريخها على الإيصال. إذا انتهى التسجيل قبل موعدها، لا ندفعها.»\u003c/p>\u003cp>أومأت هو سانيانغ. «هذه جملة أستطيع أن أوقع تحتها.»\u003c/p>\u003cp>واصلوا السير. مروا بالميزان الذي باعته امرأة من القرية، ووجدوا شياو دو ينقل سلتين صغيرتين إلى بيت قريب. وضعهما جانبًا حين رآهم. قرأ لين عليه الشروط، لكن الصبي خلط بين رسم الاسم وضريبة الحبوب.\u003c/p>\u003cp>قالت شين يان: «ليس رسمًا على كل كيس. أربع نحاسات مرة واحدة لتسجيل الحرفة، ثم نحاستان عن البيت كل تسعة أيام. الطحن المجاني لا يدخل في الجباية.»\u003c/p>\u003cp>سأل شياو دو: «حتى لو جاء رجل برقعة؟»\u003c/p>\u003cp>«حتى لو جاء بعشر رقع. لا يدفع عنها نحاسًا، ولا ندفع عنها نحن ضريبة ثانية.»\u003c/p>\u003cp>قالت هو سانيانغ: «هذا إذا بقيت الكلمة في الورقة كما هي.»\u003c/p>\u003cp>أعاد شياو دو النظر إلى النسخة. «أفهم الآن. كنت سأقول للناس إنكم دفعتم عن كل كيس.»\u003c/p>\u003cp>«جيد أنك سألت قبل أن تقول.» أعادت شين يان طي الورقة. «إذا جاءك أحد يسأل، قل له أن يقرأها.»\u003c/p>\u003cp>لم يعد شياو دو إلى السلتين فورًا. سأل إن كان اسم الحرفة يعني أن عليهم أن يستقبلوا كل من يريد الطحن. قالت هو سانيانغ إن الطاحونة تفتح في أيامها، وإن التسجيل لا يلغي دور الزبائن ولا يخلق مخزونًا إضافيًا من الدخن. أعاد الصبي السلتين إلى كتفيه، ثم مضى دون أن يحمل معه جوابًا أكبر من السؤال.\u003c/p>\u003cp>عند باب النزل أعادت شين يان الورقة إلى غلافها، ووضعت النحاسات الأربع في جيب منفصل عن كيس النقود. قالت: «لا نشتري بها شيئًا. سأبقيها وحدها حتى نرجع إلى وو.»\u003c/p>\u003cp>قال لين: «والاسم؟»\u003c/p>\u003cp>نظرت إلى الطاحونة التي لا تظهر من هنا، وراء صف البيوت. «نحتاج أن نكتب ما نعمله. لا ما نملكه.»\u003c/p>\u003cp>فتحت هو سانيانغ الباب. «إذن ابدآ من هناك.»\u003c/p>"},{"n":37,"t":"الفصل السابع والثلاثون: اسم على
