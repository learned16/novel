<script id="data" type="application/json">{"chapters":[{"n":1,"t":"الفصل الأول: ثلاثة أفراد","b":"\u003cp>كانت الساعة الحادية عشرة وسبعاً وأربعين دقيقة حين أعاد لين شياو تشغيل المنصة للمرة الرابعة.\u003c/p>\u003cp>في المختبر رائحة القصدير المحترق والقهوة الباردة. وعلى الطاولة الطويلة تحت ضوء النيون الأبيض لوحات دوائر مكشوفة، وكابلات ملفوفة بشريط لاصق أصفر، وثلاثة أكواب ورقية فيها بقايا شاي لم يشربه أحد. والشاشة الكبيرة على الجدار تعرض منحنى الجهد يتمايل كأنه موجة بحر صغيرة.\u003c/p>\u003cp>قالت شين يان من خلفه دون أن ترفع عينيها عن الحاسوب المحمول: «المحول الثالث يسخن أكثر من اللازم.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«إذا كنت تعرف فلماذا لم تخفض الحمل؟»\u003c/p>\u003cp>«لأن المستثمرين سيأتون في العاشرة صباحاً، ولن يعطونا مالاً على منصة تعمل بنصف قدرتها.»\u003c/p>\u003cp>رفعت شين يان رأسها أخيراً. كانت قد جمعت شعرها خلف رأسها بقلم رصاص، وعلى خدها أثر خفيف من شحم أسود لم تنتبه له. نظرت إليه نظرة طويلة يعرفها جيداً، نظرة تعني أنها لن تكرر كلامها مرة ثالثة.\u003c/p>\u003cp>تنهد لين، وأنزل الحمل خمسة في المئة.\u003c/p>\u003cp>استقر المنحنى على الشاشة. وانخفضت حرارة المحول الثالث درجتين، ثم ثلاثاً.\u003c/p>\u003cp>قالت: «أرأيت؟ ما زالت تعمل.»\u003c/p>\u003cp>«تعمل بخمسة وتسعين في المئة.»\u003c/p>\u003cp>«خمسة وتسعون في المئة تعمل أفضل من مئة في المئة محترقة.»\u003c/p>\u003cp>ابتسم رغماً عنه. هذه الجملة بالذات قالتها له في سنتهما الثالثة في الجامعة، حين أحرق أول نموذج بناه لمسابقة الروبوتات. يومها لم يكونا متزوجين، ولم يكونا حتى صديقين. كانت مجرد الطالبة المزعجة في المختبر المجاور التي تأتي لتستعير الكاوية ولا تعيدها.\u003c/p>\u003cp>الآن تجلس على كرسي بلاستيكي في مختبر استأجراه بكل مدخراتهما، ويدها اليسرى، دون أن تنتبه، مستقرة على بطنها.\u003c/p>\u003cp>ثلاثة أشهر. ما زال البطن مسطحاً تقريباً، لكنها صارت تفعل ذلك كثيراً في الأيام الأخيرة. تضع يدها هناك وهي تفكر، كما يضع شخص يده على جيب فيه شيء ثمين.\u003c/p>\u003cp>قال لين: «نامي قليلاً. سأراقب أنا حتى الصباح.»\u003c/p>\u003cp>«سأنام حين ننتهي من اختبار وحدة التحكم.»\u003c/p>\u003cp>«الوحدة تعمل.»\u003c/p>\u003cp>«الوحدة تعمل لأننا لا نفهمها.» أدارت شاشة حاسوبها نحوه. «انظر.»\u003c/p>\u003cp>على الشاشة صورة مكبرة للوحة وحدة التحكم المستوردة، تلك التي اشترياها من مورد ألماني لأنها الوحيدة التي تحتمل التذبذبات السريعة في الطاقة. وفي زاوية اللوحة، بين المكثفات الصغيرة، قطعة سوداء مربعة بحجم ظفر الإبهام، ملساء تماماً، بلا رقم ولا علامة ولا شعار.\u003c/p>\u003cp>قالت: «هذه القطعة ليست في مخطط الشركة. بحثت في كل الوثائق. راسلت المورد، فقالوا إنها مكون حماية قياسي. سألتهم أي مكون، فلم يردوا.»\u003c/p>\u003cp>«ربما سر تجاري.»\u003c/p>\u003cp>«ربما.» ضغطت على زر في لوحة المفاتيح، فظهر رسم بياني آخر. «لكن كل مرة نتجاوز فيها تسعين في المئة من الحمل، يظهر هذا.»\u003c/p>\u003cp>نظر لين إلى الرسم. خط رفيع متذبذب بتردد لا يشبه أي شيء صدر عن المنصة. لم يكن ضجيجاً، فالضجيج عشوائي. هذا كان منتظماً، يتكرر بنمط معقد كأنه نبض.\u003c/p>\u003cp>قال ببطء: «من أين يأتي هذا؟»\u003c/p>\u003cp>«لا أعرف. لكنه لا يأتي من منصتنا.»\u003c/p>\u003cp>نظر إلى القطعة السوداء على الشاشة، ثم إلى وحدة التحكم الحقيقية الموصولة بالمنصة على الطاولة. كانت هادئة، ضوءها الأخضر الصغير يومض ببطء.\u003c/p>\u003cp>ثم أدرك أنه لم يعد يسمع طنين المروحة.\u003c/p>\u003cp>في البداية ظن أن المروحة توقفت. لكنها كانت تدور. كان يرى شفراتها تدور خلف الشبكة المعدنية. فقط الصوت اختفى، وحل مكانه صوت آخر، منخفض جداً، كأنه يأتي من تحت الأرض، أو من داخل عظام رأسه.\u003c/p>\u003cp>قالت شين يان: «لين.»\u003c/p>\u003cp>كان الرسم البياني على شاشتها قد تحول إلى خط مستقيم يرتفع.\u003c/p>\u003cp>«الحمل؟» سأل.\u003c/p>\u003cp>«الحمل خمسة وتسعون في المئة. لم يتغير.» وقفت. «هذا ليس منا. اقطع التيار.»\u003c/p>\u003cp>مد يده إلى المفتاح الرئيسي. وفي اللحظة نفسها مدت هي يدها إلى قابس وحدة التحكم.\u003c/p>\u003cp>كانت القطعة السوداء تتوهج. لا بضوء، بل بشيء يشبه الضوء، شيء يجعل الهواء حولها يرتجف كما يرتجف الهواء فوق إسفلت في الصيف.\u003c/p>\u003cp>لمست أصابعه المفتاح.\u003c/p>\u003cp>ثم ابتلع البياض كل شيء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أول ما شعر به كان البرد.\u003c/p>\u003cp>لم يكن برد المكيف في المختبر. كان برداً حقيقياً، رطباً، يدخل من ظهره ويصعد في عموده الفقري. وتحت خده شيء خشن وحاد، يشبه القش المكسور.\u003c/p>\u003cp>فتح عينيه.\u003c/p>\u003cp>السماء رمادية بلون الرصاص، ثقيلة، وفي طرفها الغربي خط برتقالي باهت. وفوقه، عالياً، طيور سوداء تطير في دوائر وتنعق.\u003c/p>\u003cp>جلس بسرعة. دار رأسه لحظة ثم استقر.\u003c/p>\u003cp>حقل. حقل واسع محصود، بقايا السيقان المقطوعة تبرز من الأرض المتجمدة كأسنان صفراء قصيرة. وفي البعيد تلال منخفضة تكسوها أشجار عارية. والريح تأتي من الشمال، تحمل رائحة دخان خشب وروث.\u003c/p>\u003cp>«يان!»\u003c/p>\u003cp>كانت هناك. على بعد ثلاثة أمتار، ممددة على جنبها، وسترة المختبر البيضاء ملتفة حولها.\u003c/p>\u003cp>زحف إليها. لم يستطع أن يقف، فساقاه لم تطيعاه بعد. وضع يده على كتفها.\u003c/p>\u003cp>«يان. يان، انظري إلي.»\u003c/p>\u003cp>فتحت عينيها. كانت عيناها مشوشتين، ثم ركزتا عليه.\u003c/p>\u003cp>«لين.» صوتها مبحوح. «ما الذي… أين…»\u003c/p>\u003cp>«لا أعرف. هل تتألمين؟ هل يؤلمك شيء؟»\u003c/p>\u003cp>صمتت لحظة. ورأى في وجهها أنها تفحص جسدها من الداخل، عضواً عضواً، كما تفحص دائرة كهربائية بحثاً عن عطل. ثم وضعت يدها على بطنها.\u003c/p>\u003cp>لم تتكلم. فقط بقيت يدها هناك. وكان يعرف أنها تنتظر شيئاً لا يمكن الإحساس به بعد، في هذا الشهر.\u003c/p>\u003cp>قالت أخيراً: «لا ألم. لا نزيف. أشعر بالبرد فقط.»\u003c/p>\u003cp>أطلق لين نفساً لم يعرف أنه كان يحبسه. خلع سترته، سترة العمل الرمادية ذات الجيوب الكثيرة، ولفها حولها فوق سترة المختبر.\u003c/p>\u003cp>«وأنت؟» سألت.\u003c/p>\u003cp>«بخير.»\u003c/p>\u003cp>«لين.»\u003c/p>\u003cp>«بخير فعلاً.»\u003c/p>\u003cp>ساعدها على الجلوس. نظرت حولها، إلى الحقل والتلال والطيور، ثم إلى السماء. وظلت تنظر إلى السماء طويلاً.\u003c/p>\u003cp>قالت: «الشمس تغرب في الجهة الخطأ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«كانت الساعة منتصف الليل تقريباً. والآن غروب. وحتى لو مر وقت… انظر إلى الهواء. هذا ليس هواء مدينة. لا أسمع سيارة واحدة.»\u003c/p>\u003cp>كانت محقة. لم يكن هناك أي صوت سوى الريح والطيور. لا محرك ولا طائرة ولا طنين أسلاك كهرباء. صمت لم يسمع مثله في حياته.\u003c/p>\u003cp>وفي هذا الصمت، أمام عينيه، ظهرت كتابة.\u003c/p>\u003cp>لم تكن على شيء. لم تكن على شاشة ولا على ورق. كانت ببساطة هناك، معلقة في الهواء على بعد ذراع منه، حروف زرقاء شاحبة كأنها مرسومة بضوء.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[نظام السيادة الحضارية]\u003c/strong>\u003c/div>\u003cdiv>\u003cstrong>جارٍ التكامل… 3%\u003c/strong>\u003c/div>\u003cdiv>المضيف: لين شياو\u003c/div>\u003cdiv>الوحدة الحضارية المسجلة: 3 أفراد\u003c/div>\u003cdiv>الوظائف المتاحة: التحليل الأساسي — التخزين (0.03 م³)\u003c/div>\u003cdiv>الوظائف المقفلة: ██████\u003c/div>\u003c/div>\u003cp>أغمض عينيه. فتحهما. ما زالت الكتابة هناك.\u003c/p>\u003cp>حرك رأسه إلى اليسار، فتحركت الكتابة معه، تبقى دائماً في الزاوية نفسها من مجال رؤيته، كما تبقى بقعة ضوء بعد أن تنظر إلى الشمس.\u003c/p>\u003cp>قالت شين يان: «لين؟ لماذا تحدق هكذا؟»\u003c/p>\u003cp>لم يجبها. كان يقرأ السطر الثالث مرة أخرى.\u003c/p>\u003cp>\u003cstrong>الوحدة الحضارية المسجلة: 3 أفراد.\u003c/strong>\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قال لنفسه: فكر كمهندس. لا تفكر كرجل خائف.\u003c/p>\u003cp>هناك شيء يعرض عليه معلومات. إما أن عقله أصيب في الحادثة ويخترع ما يراه، وإما أن الشيء حقيقي. وفي الحالتين، الخطوة الأولى واحدة: اختبره.\u003c/p>\u003cp>نظر إلى الأرض بجانب ركبته. كانت هناك نبتة صغيرة، أوراقها خضراء داكنة رغم البرد، تنمو في ظل كومة سيقان.\u003c/p>\u003cp>ركز عليها. لم يعرف كيف يفعل ذلك، فقط أراد أن يعرف ما هي.\u003c/p>\u003cp>ارتعشت الحروف الزرقاء، ثم تغيرت.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل أساسي]\u003c/strong>\u003c/div>\u003cdiv>الهدف: نبات عشبي معمّر\u003c/div>\u003cdiv>الجذر: نشوي، صالح للأكل بعد الطهي\u003c/div>\u003cdiv>الأوراق: مُرّة، غير ضارة بكميات قليلة\u003c/div>\u003cdiv>الثقة: 71%\u003c/div>\u003cdiv>ملاحظة: لا تتوفر بيانات محلية كافية. التحليل مبني على التشابه البنيوي.\u003c/div>\u003cdiv>طاقة التكامل: 96%\u003c/div>\u003c/div>\u003cp>قال بصوت مسموع: «واحد وسبعون في المئة.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>التفت إلى شين يان. كانت تنظر إليه بقلق حقيقي الآن، وجبينها مقطب.\u003c/p>\u003cp>قال: «يان. أنا أرى شيئاً. أمامي. كتابة.»\u003c/p>\u003cp>لم تقل شيئاً للحظة. ثم مدت يدها ولمست جبينه، تتحسس حرارته، كما تفعل أم مع طفل.\u003c/p>\u003cp>قال: «لست محموماً.»\u003c/p>\u003cp>«لم أقل إنك محموم.»\u003c/p>\u003cp>«لكنك تفكرين في ذلك.»\u003c/p>\u003cp>«أفكر في كل الاحتمالات.» سحبت يدها. «ماذا تقول الكتابة؟»\u003c/p>\u003cp>«تقول إن جذر هذه النبتة يؤكل بعد طهيه. بنسبة ثقة واحد وسبعين في المئة.»\u003c/p>\u003cp>نظرت إلى النبتة، ثم إليه. ثم، لدهشته، ضحكت. ضحكة قصيرة مكسورة، فيها من الخوف أكثر مما فيها من المرح.\u003c/p>\u003cp>قالت: «نسبة ثقة. حتى هلوستك تضع نسب ثقة.»\u003c/p>\u003cp>«ليست هلوسة.»\u003c/p>\u003cp>«سنعرف.» ثم نظرت إلى الأفق، حيث الخط البرتقالي يضيق. «لكن ليس الآن. الشمس تغيب يا لين، والحرارة تنخفض. إذا بقينا هنا الليلة سنتجمد.»\u003c/p>\u003cp>كانت محقة. وكأن الكتابة سمعتها، تغيرت مرة أخرى.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري]\u003c/strong>\u003c/div>\u003cdiv>تأمين مأوى قبل حلول الليل\u003c/div>\u003cdiv>المكافأة: تحليل المواد — المستوى 1\u003c/div>\u003cdiv>هذا الهدف اختياري. لا توجد عقوبة على تجاهله.\u003c/div>\u003c/div>\u003cp>نظر لين إلى السطر الأخير طويلاً. لا عقوبة. على الأقل الشيء، أياً كان، ليس من النوع الذي يهدد.\u003c/p>\u003cp>قلع النبتة من جذرها، ونفض عنها التراب، ودسها في جيب بنطاله.\u003c/p>\u003cp>قالت شين يان: «ماذا تفعل؟»\u003c/p>\u003cp>«واحد وسبعون في المئة أفضل من لا شيء.»\u003c/p>\u003cp>ساعدها على الوقوف. كانت ساقاها ثابتتين أكثر مما توقع. وقفا معاً في الحقل المحصود، ونظرا إلى الشرق، حيث يرتفع من خلف التلة خيط دخان رمادي.\u003c/p>\u003cp>قالت: «دخان يعني ناساً.»\u003c/p>\u003cp>«ويعني ناراً.»\u003c/p>\u003cp>بدآ يمشيان.\u003c/p>\u003cp>كانت الأرض صلبة متجمدة، والسيقان المقطوعة تخز نعالهما. حذاء شين يان كان حذاء رياضياً أبيض، صار رمادياً في الخطوات العشر الأولى. وحذاؤه كان حذاء العمل بمقدمة فولاذية، ثقيلاً لكنه دافئ.\u003c/p>\u003cp>بعد نصف ساعة من المشي وصلا إلى طريق. لم يكن طريقاً معبداً، بل أخدوداً محفوراً في الأرض بعجلات عربات كثيرة، فيه آثار حوافر ونقاط روث متجمد. وعلى جانبه حجر منتصب، عليه نقش لم يستطع لين أن يقرأه. حروف تشبه الصينية القديمة، لكنها ليست هي تماماً. كأنها ابنة عم بعيدة للخط الذي يعرفه.\u003c/p>\u003cp>وقفت شين يان أمام الحجر، ومررت إصبعها على النقش.\u003c/p>\u003cp>قالت بهدوء: «لا أستطيع قراءته.»\u003c/p>\u003cp>«ولا أنا.»\u003c/p>\u003cp>«لين. أين نحن؟»\u003c/p>\u003cp>لم يجب. لأنه لم يكن يعرف. ولأن الإجابات التي كانت تخطر في باله كانت كلها مستحيلة.\u003c/p>\u003cp>تابعا الطريق. وبعد المنعطف، رأيا القرية.\u003c/p>\u003cp>بيوت منخفضة من الطين والحجر، سقوفها من القش أو القرميد الرمادي، متلاصقة حول ساحة ترابية. وسور طيني نصف منهار يحيط بها، فيه بوابة خشبية مفتوحة. والدخان يخرج من عشرات الأماكن، ورائحة الحطب المحترق تختلط برائحة الروث والطين المبلل وشيء يطبخ، شيء فيه لحم وثوم.\u003c/p>\u003cp>انقبضت معدة لين. لم يأكل منذ ظهر الأمس… ظهر اليوم… لم يعد يعرف.\u003c/p>\u003cp>بدأت الكلاب تنبح قبل أن يصلا إلى البوابة. ثلاثة كلاب نحيفة صفراء، تقف عند المدخل وتكشر عن أنيابها، ثم تتراجع حين يقترب.\u003c/p>\u003cp>وخرج الناس.\u003c/p>\u003cp>رجل عجوز يحمل حزمة حطب على ظهره، توقف في منتصف الساحة وحدق. وامرأة عند بئر، يدها على حبل الدلو، توقفت عن السحب. وطفلان حافيان، رغم البرد، اختبآ خلف جدار وأطلا برأسيهما.\u003c/p>\u003cp>كانوا جميعاً يلبسون ثياباً من القماش الخشن، رمادية وبنية وزرقاء باهتة، مبطنة بالقطن أو القش من أجل الشتاء. والرجال شعرهم مربوط فوق رؤوسهم. والنساء شعرهن مجموع خلف رؤوسهن بأعواد خشبية.\u003c/p>\u003cp>ولم يكن أحد منهم يلبس سترة مختبر بيضاء.\u003c/p>\u003cp>همست شين يان: «إنهم ينظرون إلى ملابسنا.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«ماذا نقول لهم؟»\u003c/p>\u003cp>فتح لين فمه، ثم أغلقه. لم يكن يعرف حتى إن كانوا سيفهمونه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرج صوت من باب بيت في الطرف الشمالي من الساحة. صوت امرأة، حاد، فيه نبرة من اعتاد أن يُطاع.\u003c/p>\u003cp>«ما هذا التجمع؟ هل رأيتم شبحاً؟ شياو دو! أين وضعت الدلو الثاني؟»\u003c/p>\u003cp>وخرجت.\u003c/p>\u003cp>امرأة في نحو الخامسة والثلاثين أو الأربعين، قصيرة، عريضة الكتفين، وجهها مستدير احمرّت وجنتاه من البرد. تلبس سترة زرقاء داكنة مبطنة، ومريلة رمادية فوقها، وتمسح يديها بها. وفوق باب البيت خلفها لوح خشبي معلق، عليه حروف لم يستطع لين قراءتها، وتحتها رسم بسيط لشجرة صفصاف.\u003c/p>\u003cp>نزل.\u003c/p>\u003cp>كان البيت نزلاً.\u003c/p>\u003cp>نظرت المرأة إلى الناس المتجمعين، ثم تبعت نظراتهم، ورأت لين وشين يان.\u003c/p>\u003cp>ولثانية طويلة لم تقل شيئاً. نظرت إلى سترة المختبر، والحذاء الأبيض المتسخ، وبنطال لين بجيوبه الكثيرة، ووجهيهما المرهقين.\u003c/p>\u003cp>ثم قالت: «من أنتما؟»\u003c/p>\u003cp>وفهمها لين.\u003c/p>\u003cp>فهم كل كلمة. لم يكن يعرف هذه اللغة، كان متأكداً من ذلك. الأصوات غريبة، والنبرة تصعد وتهبط بطريقة لم يسمعها من قبل. لكن المعنى كان يصل إليه مباشرة، كما يصل إليك معنى كلام بلغتك الأم دون أن تفكر فيه.\u003c/p>\u003cp>فتح فمه، وقال: «نحن… مسافران. ضللنا الطريق.»\u003c/p>\u003cp>وخرجت الكلمات من فمه بتلك اللغة نفسها.\u003c/p>\u003cp>لم يقررها. لم يترجمها. فقط تكلم، وخرج الكلام هكذا، كأن فمه يعرف شيئاً لا يعرفه عقله.\u003c/p>\u003cp>وانفجر أحدهم ضاحكاً.\u003c/p>\u003cp>كان صبياً في نحو الرابعة عشرة، نحيفاً، أذناه بارزتان، يقف خلف المرأة ويحمل دلواً خشبياً. ضحك ضحكة عالية، ثم وضع يده على فمه حين التفتت إليه المرأة.\u003c/p>\u003cp>«شياو دو!»\u003c/p>\u003cp>«آسف يا عمة. آسف. لكنه… لكنه يتكلم مثل الممثلين في مسرحيات العيد! \"مسافران، ضللنا الطريق\"!» قلّد نبرة لين بمبالغة، يمد الحروف ويضغط عليها. «مثل الجنرال في مسرحية الملك القديم!»\u003c/p>\u003cp>ضحك بعض الواقفين. احمر وجه لين.\u003c/p>\u003cp>لكن المرأة لم تضحك. كانت تنظر إليهما بعينين ضيقتين، عينين تحسبان.\u003c/p>\u003cp>قالت: «من الجنوب؟»\u003c/p>\u003cp>تردد لين.\u003c/p>\u003cp>لم تنتظر جوابه. «الجنوب. طبعاً. منذ شهرين والطريق مليء بكم. الفيضان أخذ كل شيء، أليس كذلك؟ البيوت والحقول والثياب.» نظرت إلى سترة المختبر مرة أخرى. «حتى الثياب. ألبسوكم ما وجدوه في المعابد، أليس كذلك؟»\u003c/p>\u003cp>لم يقل لين شيئاً. شعر بيد شين يان تضغط على ذراعه، ضغطة خفيفة.\u003c/p>\u003cp>لم يقل نعم. لكنه لم يقل لا أيضاً.\u003c/p>\u003cp>قالت المرأة: «اسمي هو. الناس يسمونني هو سانيانغ. هذا نزلي، نزل الصفصافة.» وأشارت بذقنها إلى اللوح فوق الباب. «لا أعطي شيئاً مجاناً، فلا تسألا. الشتاء قادم، وعندي فم ابن أخي هذا ليأكل، ونزل لا يأتيه إلا القوافل.»\u003c/p>\u003cp>قالت شين يان: «لا نطلب شيئاً مجاناً.»\u003c/p>\u003cp>التفتت إليها هو سانيانغ، كأنها تراها للمرة الأولى. ورأى لين أن لهجة شين يان كانت غريبة هي الأخرى، لكنها أخف من لهجته. كأنها تكلمت بلكنة أقل قِدَماً.\u003c/p>\u003cp>قالت هو سانيانغ: «حسناً. ماذا تملكان إذن؟»\u003c/p>\u003cp>قال لين: «لا شيء. لكني أعرف أن أصلح الأشياء.»\u003c/p>\u003cp>«كل رجل يقول إنه يعرف أن يصلح الأشياء.»\u003c/p>\u003cp>«أنا لا أقول. أنا أصلحها.»\u003c/p>\u003cp>نظرت إليه هو سانيانغ طويلاً. ثم أدارت رأسها نحو باب نزلها. كان هناك دخان يخرج من الباب نفسه، لا من المدخنة فقط، خيط رمادي يتسلق إطار الباب ويتسرب من شقوق النوافذ الورقية.\u003c/p>\u003cp>قالت: «مدخنتي.»\u003c/p>\u003cp>انتظر لين.\u003c/p>\u003cp>«منذ الشتاء الماضي وهي تخنق الضيوف. الدخان يرجع إلى الغرفة الكبيرة بدل أن يخرج. أحضرت عامل البناء من البلدة مرتين، وأخذ مالي مرتين، وبقيت تخنق.» شبكت ذراعيها على صدرها. «قافلة الملح تصل بعد غد. عشرون رجلاً، ينامون في الغرفة الكبيرة ويدفعون جيداً. السنة الماضية سعل نصفهم طوال الليل، وقال رئيسهم إنه إذا تكرر الأمر هذه السنة فسيبيت في قرية الماء الأحمر.»\u003c/p>\u003cp>نظرت إليه مباشرة.\u003c/p>\u003cp>«أعطيكما مخزن الحطب الليلة، ووجبة واحدة. إذا أصلحت المدخنة قبل مساء الغد، نتكلم. وإذا لم تصلحها، ترحلان بعد غد صباحاً قبل أن تصل القافلة. وتبقى الوجبة ديناً.»\u003c/p>\u003cp>قالت شين يان بلغتهما الأصلية، همساً: «هذا اتفاق سيئ.»\u003c/p>\u003cp>همس لين بالمثل: «هل عندك اتفاق أفضل؟»\u003c/p>\u003cp>صمتت.\u003c/p>\u003cp>التفت إلى هو سانيانغ، وقال باللغة الجديدة، بلهجته الغريبة التي جعلت شياو دو يعض شفته كي لا يضحك:\u003c/p>\u003cp>«موافق.»\u003c/p>\u003cp>وفي زاوية عينه، تغيرت الحروف الزرقاء:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — مكتمل]\u003c/strong>\u003c/div>\u003cdiv>تأمين مأوى قبل حلول الليل ✓\u003c/div>\u003cdiv>المكافأة: تحليل المواد — المستوى 1 (مفتوح)\u003c/div>\u003c/div>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان مخزن الحطب غرفة صغيرة ملحقة بجدار النزل الخلفي، سقفها منخفض حتى إن لين اضطر إلى أن يحني رأسه. نصفها مكدس بالحطب المقطع حتى السقف، ونصفها الآخر أرض ترابية فرشها شياو دو بالقش وفوقه حصيرة ممزقة.\u003c/p>\u003cp>لكنه كان ملاصقاً لجدار المطبخ، والجدار دافئ.\u003c/p>\u003cp>أكلا الوجبة جالسين على القش. عصيدة دخن ساخنة في وعاءين خشبيين، فوقها قطع من خضار مخللة مالحة جداً، ورغيف واحد مقسوم نصفين. أكلها لين في أقل من دقيقة، ولم يتذكر أنه أكل شيئاً بهذه اللذة في حياته.\u003c/p>\u003cp>أكلت شين يان ببطء. لعقت آخر حبة من الوعاء، ثم وضعته جانباً، ولفت ركبتيها بذراعيها.\u003c/p>\u003cp>قالت: «الآن أخبرني.»\u003c/p>\u003cp>حكى لها لين كل شيء. الكتابة الزرقاء، والكلمات بالتحديد، والنسب المئوية، والهدف الاختياري، والمكافأة. لم يحذف شيئاً.\u003c/p>\u003cp>إلا سطراً واحداً.\u003c/p>\u003cp>لم يخبرها بالسطر الذي يقول ثلاثة أفراد. لم يكن متأكداً لماذا. ربما لأنه هو نفسه لم يكن يعرف ماذا يعني.\u003c/p>\u003cp>استمعت دون أن تقاطعه. وحين انتهى، بقيت صامتة طويلاً.\u003c/p>\u003cp>ثم قالت: «أثبت.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«قلت إنه يحلل الأشياء.» أشارت إلى الجدار الطيني خلفها، الجدار الملاصق للمطبخ. «حلل هذا. وقل لي ما تراه. ثم سأتحقق بنفسي.»\u003c/p>\u003cp>نظر لين إلى الجدار. ركز عليه.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: جدار من طين مدكوك مخلوط بقش\u003c/div>\u003cdiv>السماكة: 38–42 سم تقريباً\u003c/div>\u003cdiv>العيوب: شق طولي على ارتفاع 60 سم من الأرض، يمتد حوالي 50 سم، بعمق 3 سم. شق ثانٍ أصغر قرب الزاوية اليمنى العليا.\u003c/div>\u003cdiv>الرطوبة: مرتفعة في القسم السفلي\u003c/div>\u003cdiv>الثقة: 84%\u003c/div>\u003cdiv>طاقة التكامل: 89%\u003c/div>\u003c/div>\u003cp>قال: «شق طولي، على ارتفاع ستين سنتيمتراً تقريباً من الأرض. طوله نصف متر. وشق آخر أصغر في الزاوية العليا اليمنى. والجزء السفلي من الجدار رطب.»\u003c/p>\u003cp>لم تقل شيئاً. نهضت، وأبعدت القش عن أسفل الجدار بيدها، ثم مررت أصابعها على الطين ببطء، من اليسار إلى اليمين.\u003c/p>\u003cp>توقفت أصابعها.\u003c/p>\u003cp>ظلت ساكنة لحظة. ثم تحركت أصابعها إلى الأعلى قليلاً، وتتبعت شيئاً لم يكن لين يراه في هذا الضوء الخافت الذي يتسرب من شق الباب.\u003c/p>\u003cp>قالت بصوت منخفض: «ستون سنتيمتراً.» ثم مدت شبراً، وقاسته مرة، ومرة أخرى. «طوله تقريباً نصف متر.»\u003c/p>\u003cp>نهضت على أطراف أصابعها، ولمست الزاوية العليا اليمنى. سمع صوت أظافرها تخدش الطين.\u003c/p>\u003cp>ثم جلست مرة أخرى على القش. لم تنظر إليه. نظرت إلى يديها، إلى الطين العالق تحت أظافرها.\u003c/p>\u003cp>قالت: «الأسفل رطب. أشعر به.»\u003c/p>\u003cp>«يان…»\u003c/p>\u003cp>«لا تقل شيئاً. دعني أفكر.»\u003c/p>\u003cp>صمت.\u003c/p>\u003cp>في الخارج، نبح كلب، ثم سكت. ومن خلف الجدار سمعا صوت هو سانيانغ تؤنب شياو دو على شيء ما، وصوت أوانٍ تتصادم.\u003c/p>\u003cp>قالت أخيراً: «لا أستطيع أن أفسر هذا.»\u003c/p>\u003cp>«ولا أنا.»\u003c/p>\u003cp>«لكن الشيء الذي لا أستطيع تفسيره، يمكنني أن أختبره.» رفعت عينيها إليه. وكان فيهما ذلك البريق الذي يعرفه، البريق الذي يظهر حين تواجه مشكلة لا حل لها بعد. «سنختبره يا لين. كل يوم. كل شيء يقوله لك. لن نصدقه حتى نتحقق منه. اتفقنا؟»\u003c/p>\u003cp>«اتفقنا.»\u003c/p>\u003cp>مدت يدها، فأمسكها.\u003c/p>\u003cp>كانت يدها باردة. ضغط عليها، وتمدد على القش بجانبها، وسحب سترته فوقهما معاً.\u003c/p>\u003cp>قبل أن يغمض عينيه، تذكر شيئاً.\u003c/p>\u003cp>\u003cstrong>التخزين (0.03 م³).\u003c/strong>\u003c/p>\u003cp>ركز على الكلمة. ولم يكن متأكداً كيف عرف أن يفعل ذلك، تماماً كما لم يكن يعرف كيف يتكلم هذه اللغة. ظهرت أمامه قائمة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخزين — 0.03 م³]\u003c/strong>\u003c/div>\u003cdiv>أداة متعددة (فولاذ مقاوم للصدأ)\u003c/div>\u003cdiv>دفتر ملاحظات (72 صفحة، مستعمل منه 31)\u003c/div>\u003cdiv>قلم رصاص (نصف طول)\u003c/div>\u003cdiv>هاتف محمول (البطارية: 0%)\u003c/div>\u003cdiv>مكوّن مجهول ×1\u003c/div>\u003c/div>\u003cp>نظر إلى السطر الأخير.\u003c/p>\u003cp>كان يعرف ما هو. القطعة السوداء الصغيرة، التي لم تكن في مخطط الشركة الألمانية. القطعة التي كانت تتوهج في آخر لحظة رآها فيها.\u003c/p>\u003cp>كيف وصلت إلى هنا؟ لقد كانت ملحومة في لوحة وحدة التحكم، لا في جيبه.\u003c/p>\u003cp>ركز عليها، وطلب التحليل.\u003c/p>\u003cp>ارتعشت الحروف الزرقاء. وطالت الرعشة هذه المرة، ثانية، ثانيتين، ثلاثاً.\u003c/p>\u003cp>ثم:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل]\u003c/strong>\u003c/div>\u003cdiv>الهدف: مكوّن مجهول\u003c/div>\u003cdiv>\u003cstrong>غير قابل للتحليل.\u003c/strong>\u003c/div>\u003c/div>\u003cp>لا نسبة ثقة. لا ملاحظات. لا شيء آخر.\u003c/p>\u003cp>وبجانبه، في العتمة، كانت شين يان قد نامت، ويدها، حتى في النوم، على بطنها.\u003c/p>"},{"n":2,"t":"الفصل الثاني: الدخان","b":"\u003cp>أيقظه الديك.\u003c/p>\u003cp>لم يكن ديكاً واحداً. كان ثلاثة أو أربعة، يتبادلون الصياح من أطراف القرية المختلفة كأنهم يتجادلون. وفتح لين عينيه على ظلام رمادي يتسرب من شق الباب، ورائحة الحطب والقش، وألم حاد في كتفه اليسرى من النوم على الأرض.\u003c/p>\u003cp>لم يتحرك فوراً. بقي ممدداً، ينظر إلى سقف المخزن المنخفض، إلى العوارض الخشبية السوداء من الدخان، وخيوط العنكبوت بينها.\u003c/p>\u003cp>ثم ظهرت الحروف الزرقاء في زاوية عينه، هادئة، كأنها كانت تنتظره:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[نظام السيادة الحضارية]\u003c/strong>\u003c/div>\u003cdiv>التكامل: 3%\u003c/div>\u003cdiv>طاقة التكامل: 100%\u003c/div>\u003c/div>\u003cp>إذن لم يكن حلماً.\u003c/p>\u003cp>أدار رأسه. كانت شين يان مستيقظة. جالسة وظهرها إلى الجدار الدافئ، وسترته على كتفيها، وتنظر إليه.\u003c/p>\u003cp>قالت: «ما زال هناك؟»\u003c/p>\u003cp>«ما زال هناك.»\u003c/p>\u003cp>أومأت، كأنها كانت تتوقع ذلك. «طاقته؟»\u003c/p>\u003cp>«مئة في المئة. تجددت في الليل.»\u003c/p>\u003cp>«كم استهلكت أمس؟»\u003c/p>\u003cp>فكر. «تحليل النبتة أخذ أربعة في المئة. والجدار سبعة. والمكوّن…» توقف. «لا أعرف. لم أنظر.»\u003c/p>\u003cp>«انظر في المرة القادمة. نحتاج أن نعرف كم يكلف كل نوع من التحليل، وكم يحتاج من الوقت ليتجدد.» قامت ونفضت القش عن سترة المختبر. «إذا كان عندنا مورد واحد، فيجب أن نعرف حدوده قبل أن نعتمد عليه.»\u003c/p>\u003cp>كان هذا بالضبط ما كان سيقوله هو. لكنه لم يقله. ابتسم فقط، وقام.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت هو سانيانغ في المطبخ قبلهما.\u003c/p>\u003cp>المطبخ غرفة واسعة نسبياً، أرضها من الطين المدكوك، وفي وسطها موقد كبير مبني من الطوب والطين، عليه قدران حديديتان ضخمتان. وخلف الموقد، مستندة إلى الجدار، المدخنة: عمود مربع من الطوب يصعد عبر السقف.\u003c/p>\u003cp>وكان الدخان في كل مكان.\u003c/p>\u003cp>ليس كثيفاً، لكنه حاضر. طبقة رمادية تطفو تحت السقف، وتنزل كلما فتحت هو سانيانغ باب الموقد لتضيف حطباً. ورائحته تلتصق بكل شيء: بالجدران، وبالقدور، وبالسلال المعلقة، وبشعر هو سانيانغ نفسها.\u003c/p>\u003cp>سعلت شين يان مرتين قبل أن تخطو داخل المطبخ.\u003c/p>\u003cp>قالت هو سانيانغ دون أن تلتفت: «هكذا كل صباح. ولما أشعل النار في الغرفة الكبيرة، يصير أسوأ.» وأشارت بمغرفتها إلى الجدار الشرقي. «هناك. المدخنتان تلتقيان في الجدار، وتخرجان من فتحة واحدة في السقف.»\u003c/p>\u003cp>اقترب لين من الموقد.\u003c/p>\u003cp>كان يعرف المبدأ. كل مهندس يعرفه. الهواء الساخن أخف من البارد، فيصعد. والمدخنة الجيدة تستغل ذلك: يصعد الدخان الساخن عبرها، ويسحب خلفه هواءً جديداً من فتحة الموقد، فتشتعل النار أفضل، ويصعد مزيد من الهواء الساخن. حلقة تغذي نفسها.\u003c/p>\u003cp>وحين ينكسر شيء في الحلقة، يرجع الدخان.\u003c/p>\u003cp>ركز على المدخنة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: مدخنة من طوب طيني ومونة طين\u003c/div>\u003cdiv>العيوب:\u003c/div>\u003cdiv>1. شق في جدار المجرى الداخلي على ارتفاع 1.2 م تقريباً. تسرب هواء بارد إلى المجرى. (ثقة: 79%)\u003c/div>\u003cdiv>2. انهيار جزئي في حاجز الفصل بين مجرى المطبخ ومجرى الغرفة الكبيرة. (ثقة: 63%)\u003c/div>\u003cdiv>3. ترسبات سخام كثيفة تضيّق المجرى. (ثقة: 88%)\u003c/div>\u003cdiv>ملاحظة: البنية الداخلية غير مرئية مباشرة. التحليل مبني على أنماط الحرارة والتدفق الخارجية.\u003c/div>\u003cdiv>طاقة التكامل: 91%\u003c/div>\u003c/div>\u003cp>تسعة في المئة. تحليل أعقد من الجدار، فكلف أكثر.\u003c/p>\u003cp>قرأ القائمة مرتين، ثم التفت إلى شين يان، وأعادها عليها بصوت منخفض، بلغتهما.\u003c/p>\u003cp>استمعت، ثم نظرت إلى المدخنة نظرة طويلة. وضعت كفها على الطوب، على ارتفاع صدرها تقريباً، ثم حركتها ببطء إلى الأعلى.\u003c/p>\u003cp>قالت: «هنا أبرد.»\u003c/p>\u003cp>«الشق الأول.»\u003c/p>\u003cp>«ممكن. وممكن أنه مجرد طوب أرق.» سحبت يدها. «الحاجز المنهار بثقة ثلاثة وستين في المئة. هذا ليس أكثر من تخمين جيد. ونحن لا نستطيع أن نرى داخل المجرى.»\u003c/p>\u003cp>قالت هو سانيانغ بحدة من عند القدر: «ماذا تقولان؟ تكلما بلغة يفهمها الناس.»\u003c/p>\u003cp>التفت إليها لين، وانتقل إلى اللغة الجديدة دون أن يفكر. ما زال هذا يدهشه، كيف يتحرك لسانه بين اللغتين كأنه يعرفهما منذ ولد.\u003c/p>\u003cp>«المدخنة فيها ثلاث مشاكل على الأقل. شق في الداخل يدخل منه هواء بارد. والحاجز بين المجريين مكسور، فيتصارع الدخانان. والمجرى مسدود بالسخام.»\u003c/p>\u003cp>توقفت المغرفة في يد هو سانيانغ.\u003c/p>\u003cp>«من قال لك هذا؟»\u003c/p>\u003cp>«عيناي.»\u003c/p>\u003cp>«عامل البناء من البلدة قال إن المدخنة قصيرة. وأضاف إليها صفين من الطوب فوق السقف. وأخذ ثلاثين قطعة نحاس.»\u003c/p>\u003cp>«ورجع الدخان.»\u003c/p>\u003cp>لم ترد. لكن فمها انقبض.\u003c/p>\u003cp>قالت شين يان، باللغة الجديدة هذه المرة، بلهجتها الأخف: «المدخنة القصيرة ليست المشكلة الأولى. لكنها قد تكون مشكلة رابعة.»\u003c/p>\u003cp>نظرت إليها هو سانيانغ. «وأنتِ؟ ما شأنك بالمداخن؟»\u003c/p>\u003cp>«شأني بالنار.» قالتها شين يان ببساطة. «بالنار والهواء والحرارة. كيف تتحرك، وأين تضيع.»\u003c/p>\u003cp>لم تقل هو سانيانغ شيئاً. أعادت المغرفة إلى القدر، وحركت العصيدة، ثم قالت دون أن تلتفت:\u003c/p>\u003cp>«عندكما حتى المساء. القافلة غداً ظهراً. وإذا خربتما شيئاً، تدفعان ثمنه.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت المشكلة الأولى أنه لا يملك شيئاً.\u003c/p>\u003cp>وقف لين في الساحة الخلفية للنزل، والبرد يعض أذنيه، وأحصى ما عنده.\u003c/p>\u003cp>أداة متعددة في تخزين النظام. يمكن أن يخرجها، لكنها فولاذ مقاوم للصدأ لامع، بمفاصل دقيقة، لا يشبه أي شيء في هذه القرية. وإذا رآها أحد فسيسأل.\u003c/p>\u003cp>قرر أن يتركها في المخزن إلا عند الضرورة.\u003c/p>\u003cp>ثم ما تملكه هو سانيانغ: كومة طوب مكسور خلف بيت الدجاج، بقايا جدار قديم انهار. ورمل في زاوية الساحة. وطين، كثير من الطين، فالساحة كلها طين. ودلو، ومجرفة خشبية برأس حديدي صدئ، ومطرقة صغيرة.\u003c/p>\u003cp>لا جير. لا إسمنت طبعاً. لا مثقاب، ولا عتلة معدنية، ولا شيء يمكن أن يصل به إلى داخل مجرى المدخنة.\u003c/p>\u003cp>قالت شين يان من خلفه: «هل تعرف كيف تصنع مونة من الطين؟»\u003c/p>\u003cp>«أعرف النظرية.»\u003c/p>\u003cp>«النظرية لن تلصق الطوب.»\u003c/p>\u003cp>ظهر شياو دو عند زاوية البيت، يحمل دلواً فارغاً، ويمشي ببطء متعمد، كأنه يمر صدفة.\u003c/p>\u003cp>قال: «العمة قالت أساعدكما.»\u003c/p>\u003cp>نظر إليه لين. «العمة قالت؟»\u003c/p>\u003cp>«…قالت ألا أدعكما تسرقان شيئاً.» احمرت أذنا الصبي البارزتان. «لكن هذا مثل المساعدة، أليس كذلك؟»\u003c/p>\u003cp>لم يستطع لين أن يمنع نفسه من الضحك. وضحك شياو دو بدوره، ضحكة عصبية.\u003c/p>\u003cp>قال لين: «حسناً. أين تجلب العمة طين البناء؟ ليس طين الساحة. الطين الجيد.»\u003c/p>\u003cp>«من ضفة النهر. عند المنعطف. الطين هناك أحمر ولزج.» توقف. «لكنه بعيد.»\u003c/p>\u003cp>«كم؟»\u003c/p>\u003cp>«نصف ساعة مشي. ربع ساعة إذا ركضت.»\u003c/p>\u003cp>قالت شين يان: «والقش؟ نحتاج قشاً مقطعاً قصيراً، لا أكثر من طول الإصبع.»\u003c/p>\u003cp>نظر إليها شياو دو باحترام مفاجئ. «العمة تقطع القش هكذا للجدران. في الحظيرة كيس كامل.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فكا المدخنة قبل الظهر.\u003c/p>\u003cp>لم يفكاها كلها، فهذا مستحيل في يوم واحد. لكن شين يان اقترحت شيئاً جعل هو سانيانغ تحدق فيها كأنها مجنونة: أن يفتحا نافذة في جدار المدخنة نفسه، في الأسفل، على مستوى الركبة. فتحة بحجم طوبتين، تصل مباشرة إلى المجرى.\u003c/p>\u003cp>قالت هو سانيانغ: «تريدين أن تثقبي مدختني؟»\u003c/p>\u003cp>«أريد أن أرى داخلها. ثم نغلق الثقب.»\u003c/p>\u003cp>«وإذا انهارت؟»\u003c/p>\u003cp>ركز لين على الجزء السفلي من المدخنة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الجزء السفلي من المدخنة: الطوب في حالة جيدة. الحمل الإنشائي موزع على الجدار المجاور.\u003c/div>\u003cdiv>إزالة طوبتين في هذا الموضع: خطر انهيار منخفض.\u003c/div>\u003cdiv>الثقة: 81%\u003c/div>\u003cdiv>طاقة التكامل: 84%\u003c/div>\u003c/div>\u003cp>قال: «لن تنهار.»\u003c/p>\u003cp>«وما أدراك؟»\u003c/p>\u003cp>لم يستطع أن يقول: لأن كتابة زرقاء في الهواء تقول ذلك بنسبة واحد وثمانين في المئة. فقال الشيء الآخر الصحيح:\u003c/p>\u003cp>«لأن الحمل على الجدار، لا على هذا الجزء. انظري.» أشار إلى الطوب. «الصف الذي فوقه مربوط بالجدار الشرقي. حتى لو أزلنا طوبتين، يبقى الثقل محمولاً.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى الطوب، ثم إليه. ولم يعرف إن كانت قد فهمت أم أنها فقط قررت أن تصدق.\u003c/p>\u003cp>قالت أخيراً: «إذا انهارت، تبنيانها من جديد بأيديكما.»\u003c/p>\u003cp>نزع لين الطوبتين بالمطرقة الصغيرة وإزميل استعاره شياو دو من الجيران. كان الطوب قديماً، والمونة بينه هشة، فتفتت بسهولة أكثر مما توقع.\u003c/p>\u003cp>وحين سقطت الطوبة الثانية، اندفع من الفتحة ركام أسود.\u003c/p>\u003cp>سخام. كميات منه، ناعمة كالدقيق، تتدفق على أرض المطبخ وتملأ الهواء. وسعل الجميع، وتراجعت هو سانيانغ وهي تشتم بكلمات لم يفهمها لين، وفهمها في الوقت نفسه.\u003c/p>\u003cp>وحين انقشع الغبار، أدخل لين ذراعه في الفتحة.\u003c/p>\u003cp>كان المجرى ضيقاً. في الأسفل يتسع لكفه مبسوطة بالكاد، والسخام على جدرانه طبقة سميكة بقوام الشمع. وحين مد ذراعه إلى الأعلى، على قدر ما يستطيع، لمست أصابعه حافة حادة.\u003c/p>\u003cp>حجر. أو طوبة منكسرة. كانت معترضة في المجرى، مائلة، تسد نصفه.\u003c/p>\u003cp>قال: «الحاجز.»\u003c/p>\u003cp>قالت شين يان: «المنهار؟»\u003c/p>\u003cp>«جزء منه سقط داخل المجرى. هو ما يسد الطريق.»\u003c/p>\u003cp>ثلاثة وستون في المئة. التخمين الجيد كان صحيحاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق إخراج الطوبة المنكسرة ساعة كاملة.\u003c/p>\u003cp>لم تكن ذراع لين طويلة بما يكفي. جرب شياو دو، فذراعه أنحف، لكنها كانت أقصر. وفي النهاية ربط لين قطعة خشب طويلة إلى عصا المجرفة بحبل، وصنع منها شيئاً يشبه الخطاف، وظل يحاول، والسخام يتساقط في عينيه وفمه، حتى انزلقت الطوبة أخيراً وسقطت عبر المجرى إلى الفتحة.\u003c/p>\u003cp>صفق شياو دو.\u003c/p>\u003cp>ثم نظفوا المجرى. على قدر ما استطاعوا: بالعصا، وبحزمة من الأغصان، وبيد شياو دو المغطاة بقطعة قماش. وامتلأت ثلاثة دلاء بالسخام.\u003c/p>\u003cp>كانت الشمس قد تجاوزت منتصف السماء حين قالت شين يان: «الآن الشق.»\u003c/p>\u003cp>«لا نستطيع الوصول إليه من الداخل.»\u003c/p>\u003cp>«لا نحتاج إلى ذلك.» وأشارت إلى الجدار الخارجي للمدخنة، على ارتفاع صدرها. «الهواء البارد يدخل من الخارج، أليس كذلك؟ إذن نسده من الخارج.»\u003c/p>\u003cp>خلطت المونة بنفسها.\u003c/p>\u003cp>جلست على كرسي خشبي صغير أحضره شياو دو، لأن لين رفض أن تنحني فوق الدلو، ورفضت هي أن تجلس دون أن تعمل، فكان هذا التسوية. وخلطت الطين الأحمر الذي جلبه شياو دو من النهر، مع الرمل والقش المقطع، وأضافت الماء ببطء، وعجنته بيديها، ثم رفعت قبضة منه وضغطتها.\u003c/p>\u003cp>قالت: «جاف قليلاً.» وأضافت ماءً. عجنته مرة أخرى. ضغطت.\u003c/p>\u003cp>هذه المرة، حين فتحت يدها، بقي الطين متماسكاً بشكل قبضتها، يحمل أثر أصابعها.\u003c/p>\u003cp>قالت: «الآن.»\u003c/p>\u003cp>لكن لين لم يأخذ الدلو فوراً.\u003c/p>\u003cp>قال: «يان. حتى لو سددنا الشق ونظفنا المجرى، المدخنة ستبقى ضعيفة. السحب فيها ضعيف من الأساس.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«تعرفين؟»\u003c/p>\u003cp>«فكرت في ذلك أمس.» نظرت إلى الموقد الكبير، إلى بابه الحديدي الصغير المغلق. «المشكلة ليست فقط في المدخنة. المشكلة في كيف يدخل الهواء إلى النار.»\u003c/p>\u003cp>قامت ومشت إلى الموقد. فتحت بابه، فاندفعت رائحة الحطب المحترق. أشارت إلى الداخل.\u003c/p>\u003cp>«انظر. الهواء يدخل من الباب فقط، من الأعلى. يمر فوق الحطب لا تحته. فالنار تحترق ببطء من الأعلى، والحطب في الأسفل يدخن ولا يشتعل. دخان كثير، وحرارة قليلة.»\u003c/p>\u003cp>«تريدين فتحة هواء من الأسفل.»\u003c/p>\u003cp>«تحت الحطب. صف من الطوب المثقوب، أو قضبان حديد إذا وجدنا. يدخل الهواء من تحت، فتشتعل النار من تحت، وتحترق أنظف. ودخان أقل، يعني ضغطاً أقل على المدخنة.» أغلقت باب الموقد. «وحين يصعد الدخان أسخن، يسحب أقوى.»\u003c/p>\u003cp>نظر إليها لين طويلاً.\u003c/p>\u003cp>ثم ركز على الموقد. لم يكن يريد أن يتحقق من كلامها، فهو يعرف أنها محقة. أراد فقط أن يرى إن كان النظام يرى ما تراه.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل]\u003c/strong>\u003c/div>\u003cdiv>الهدف: موقد طبخ مغلق، تصميم محلي\u003c/div>\u003cdiv>كفاءة الاحتراق: منخفضة (تقدير)\u003c/div>\u003cdiv>المشكلة الرئيسية: إمداد هواء غير كافٍ أسفل منطقة الاحتراق.\u003c/div>\u003cdiv>اقتراح: لا تتوفر بيانات كافية لتقديم اقتراح محدد.\u003c/div>\u003cdiv>الثقة: 52%\u003c/div>\u003cdiv>طاقة التكامل: 77%\u003c/div>\u003c/div>\u003cp>اثنان وخمسون في المئة. والنظام لم يقترح شيئاً.\u003c/p>\u003cp>وشين يان، دون أي كتابة زرقاء، قالت الحل في دقيقة.\u003c/p>\u003cp>قال بهدوء: «النظام لا يعرف أكثر منك.»\u003c/p>\u003cp>قالت: «في هذا لا.» ثم رفعت حاجبيها. «لكن لا تحزن عليه. عمره يوم واحد.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت الشمس قد اقتربت من التلال الغربية حين انتهيا.\u003c/p>\u003cp>لم يكن الإصلاح جميلاً. الفتحة السفلية أُغلقت بطوبتين من كومة الطوب المكسور، ومونة شين يان تبرز من حوافهما كعجين فائض. والشق في الجدار الخارجي سُد بطبقة سميكة من الطين، ما زالت رطبة ومظلمة. وفي أسفل الموقد، تحت مكان الحطب، فتحا ممراً ضيقاً للهواء، ووضعا فوقه ثلاثة قضبان حديدية صدئة وجدها شياو دو في الحظيرة، بقايا محراث قديم.\u003c/p>\u003cp>وقفت هو سانيانغ في باب المطبخ، ذراعاها على صدرها.\u003c/p>\u003cp>قالت: «أشعلاها.»\u003c/p>\u003cp>أشعلها شياو دو. حطب جاف من المخزن، ثم قطع أكبر. وانتظروا.\u003c/p>\u003cp>اشتعلت النار. وبدا لهم في البداية أن شيئاً لم يتغير. الدخان نفسه، الرائحة نفسها.\u003c/p>\u003cp>ثم سمعوا الصوت.\u003c/p>\u003cp>صوت منخفض، يشبه الهمس، يأتي من داخل الموقد. صوت الهواء وهو يندفع عبر الممر السفلي إلى النار. واشتعل الحطب في الأسفل، وتحول لونه من الأحمر الداكن إلى البرتقالي الساطع.\u003c/p>\u003cp>وارتفع الدخان. لم يتراكم تحت السقف. ارتفع مباشرة إلى المدخنة وغاب.\u003c/p>\u003cp>وقف أربعتهم صامتين، ينظرون إلى السقف.\u003c/p>\u003cp>كان هناك بعض الدخان، لم يختف تماماً. خيط رفيع يتسرب حين فتح شياو دو باب الموقد ليضيف حطباً، ثم يختفي بعد لحظات. لكن الطبقة الرمادية التي كانت تطفو تحت السقف منذ الصباح بدأت تخف. وتخف. وتنسحب إلى المدخنة كأن شيئاً يسحبها من الأعلى.\u003c/p>\u003cp>قال شياو دو بصوت خافت: «عمة.»\u003c/p>\u003cp>لم ترد هو سانيانغ.\u003c/p>\u003cp>قال: «عمة، لا أسعل.»\u003c/p>\u003cp>مشت هو سانيانغ إلى الموقد. وقفت أمامه، ونظرت إلى النار، ثم رفعت رأسها ونظرت إلى السقف. ثم فعلت شيئاً لم يتوقعه لين: أخذت نفساً عميقاً، عميقاً جداً، من أنفها.\u003c/p>\u003cp>وزفرته ببطء.\u003c/p>\u003cp>لم تقل شيئاً. لم تشكرهما، ولم تبتسم. فقط التفتت إلى شياو دو، وقالت:\u003c/p>\u003cp>«أشعل النار في الغرفة الكبيرة. أريد أن أرى.»\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[إنجاز]\u003c/strong>\u003c/div>\u003cdiv>أول إصلاح في العالم الجديد\u003c/div>\u003cdiv>مؤشر الحضارة: +1\u003c/div>\u003cdiv>ملاحظة: الإصلاح مؤقت. متانته المتوقعة: أسابيع قليلة.\u003c/div>\u003c/div>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>اشتعلت النار في الغرفة الكبيرة أيضاً. ليس بالنظافة نفسها، فالموقد هناك لم يُعدّل، لكن الدخان كان يصعد. والغرفة، التي كانت تفوح برائحة السخام القديم، بدأت تدفأ.\u003c/p>\u003cp>وحين نزل الظلام، وعاد لين وشين يان إلى المخزن، كان في يد كل منهما وعاء من العصيدة، وفيه هذه المرة قطع صغيرة من اللحم المجفف.\u003c/p>\u003cp>لم تقل هو سانيانغ إنها مكافأة. وضعتها أمامهما فقط وقالت: «كلا. غداً كلام.»\u003c/p>\u003cp>ولم يكن لين قد أنهى نصف وعائه حين سمعا الأجراس.\u003c/p>\u003cp>أجراس كثيرة، صغيرة، معلقة في أعناق حيوانات. وصوت حوافر، ورجال ينادون بعضهم بأصوات خشنة متعبة، وصرير عجلات خشبية ثقيلة.\u003c/p>\u003cp>قالت شين يان: «القافلة. قالت إنها ستأتي غداً.»\u003c/p>\u003cp>خرج لين إلى الساحة.\u003c/p>\u003cp>كانت القافلة تدخل من البوابة. بغال، عشرون أو أكثر، محملة بأكياس منتفخة. ورجال يمشون بجانبها، ملفوفين بالفراء والصوف، ووجوههم حمراء من الريح. ووراءهم ثلاث عربات.\u003c/p>\u003cp>وفي مقدمتهم رجل ضخم، لحيته رمادية قصيرة، يلبس معطفاً من جلد الغنم مقلوباً، صوفه إلى الداخل. نزل عن بغله، ومشى إلى باب النزل بخطوات ثقيلة، وصاح:\u003c/p>\u003cp>«هو سانيانغ! وصلنا مبكراً، الطريق كان جافاً! هل عندك مكان لعشرين جائعاً؟»\u003c/p>\u003cp>ظهرت هو سانيانغ في الباب. «عندي.»\u003c/p>\u003cp>«والمدخنة؟» ضحك الرجل ضحكة عالية. «هل ستخنقيننا هذه المرة أيضاً؟ قلت لك في الربيع…»\u003c/p>\u003cp>توقف.\u003c/p>\u003cp>كان قد وصل إلى العتبة، ونظر عبر الباب إلى الغرفة الكبيرة، حيث النار تشتعل في الموقد، والدفء يتسرب إلى الخارج في هواء الليل البارد. ونظر إلى السقف.\u003c/p>\u003cp>بقي واقفاً هكذا لحظة.\u003c/p>\u003cp>ثم قال، بنبرة مختلفة تماماً، نبرة رجل يسأل عن شيء له قيمة:\u003c/p>\u003cp>«من أصلحها؟»\u003c/p>"},{"n":3,"t":"الفصل الثالث: حساب الفحم","b":"\u003cp>لم تجب هو سانيانغ فوراً.\u003c/p>\u003cp>وقفت في الباب، بين الرجل الضخم ذي اللحية الرمادية وبين الغرفة الدافئة، ونظرت إليه نظرة طويلة. ورأى لين، من مكانه في الساحة، أنها تحسب شيئاً. لم يكن يعرف ما هو، لكنه رأى الحساب يتحرك خلف عينيها كما تتحرك الأرقام على شاشة.\u003c/p>\u003cp>قالت أخيراً: «عامل.»\u003c/p>\u003cp>«عامل من البلدة؟ الذي جاء في الربيع؟»\u003c/p>\u003cp>«عامل آخر.»\u003c/p>\u003cp>«من؟»\u003c/p>\u003cp>«عاملي.» وتنحت عن الباب. «ادخل يا لاو ما، الريح تأكل الدفء. ورجالك يغسلون أيديهم قبل أن يلمسوا القدور، كما في كل مرة.»\u003c/p>\u003cp>ضحك لاو ما مرة أخرى، لكنه لم يتحرك. أدار رأسه ببطء ونظر إلى الساحة، إلى البغال والرجال والعربات، ثم إلى الظل قرب مخزن الحطب حيث يقف لين.\u003c/p>\u003cp>التقت عيناهما. لم يكن الضوء كافياً ليرى لين وجهه بوضوح، لكنه رأى أن الرجل توقف عند سترة المختبر البيضاء التي تلبسها شين يان خلفه، كما توقف كل من رآها في هذه القرية.\u003c/p>\u003cp>ثم دخل لاو ما النزل، وأُغلق الباب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يناما كثيراً تلك الليلة.\u003c/p>\u003cp>كان النزل يضج بعشرين رجلاً يأكلون ويشربون ويضحكون ويتشاجرون على أماكن النوم. وكان الجدار الذي ينامان بجانبه ينقل كل صوت: القدور، والصحون الخشبية، وشخير أحدهم الذي بدأ مبكراً وكان يشبه منشاراً يقطع جذعاً رطباً.\u003c/p>\u003cp>لكن لم يسعل أحد.\u003c/p>\u003cp>استلقى لين على القش، يستمع، وعد السعال. صفر. مرة واحدة سعل رجل، ثم تبعها بضحكة وشتيمة، كأنه شرق بالنبيذ.\u003c/p>\u003cp>قالت شين يان في العتمة: «أنت تعدّ.»\u003c/p>\u003cp>«أعدّ.»\u003c/p>\u003cp>«وأنا أيضاً.» صمتت. «صفر.»\u003c/p>\u003cp>«واحد. لكنه شرق.»\u003c/p>\u003cp>«لا يُحسب.»\u003c/p>\u003cp>ابتسم في الظلام.\u003c/p>\u003cp>ثم قالت، بنبرة مختلفة: «لين. غداً ستعرض علينا هو سانيانغ شيئاً.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«ماذا سنطلب؟»\u003c/p>\u003cp>لم يجب فوراً. كان قد فكر في ذلك منذ أن رأى وجه لاو ما في الباب. «مبيت أسبوع؟ مع الطعام؟»\u003c/p>\u003cp>«أسبوع.» قالت الكلمة كأنها تزنها. «وبعد الأسبوع؟»\u003c/p>\u003cp>«نجد عملاً آخر.»\u003c/p>\u003cp>«في قرية لا نعرف فيها أحداً، وليس معنا قطعة نحاس واحدة، والشتاء بعد أيام.» سمعها تتقلب على القش، ثم شعر بها تقترب منه. «الإصلاح الذي عملناه اليوم لا يساوي أسبوعاً. يساوي أكثر بكثير. لكننا لا نعرف كم، ولا نستطيع أن نثبت ذلك لها. وهي امرأة لا تدفع إلا لما تراه بعينيها.»\u003c/p>\u003cp>«إذن؟»\u003c/p>\u003cp>«إذن نجعلها تراه.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استيقظت شين يان قبل الديكة.\u003c/p>\u003cp>وحين فتح لين عينيه، كانت قد خرجت. وجدها عند باب المطبخ الخلفي، جالسة على جذع مقطوع، ودفتره مفتوح على ركبتيها، والقلم الرصاص في يدها.\u003c/p>\u003cp>قال: «أخرجتِه من التخزين؟»\u003c/p>\u003cp>«لا. أنت أخرجته أمس وتركته تحت القش.» لم ترفع رأسها. «انتبه لأشيائك.»\u003c/p>\u003cp>كانت تراقب الحطب.\u003c/p>\u003cp>بالتحديد، كانت تراقب شياو دو وهو يحمل الحطب. كل سلة يحملها من المخزن إلى الموقد، كانت تخط خطاً صغيراً في الدفتر. وحين أشعل شياو دو الموقد في الغرفة الكبيرة، خطت عموداً آخر.\u003c/p>\u003cp>قال لين: «تعدّين الحطب.»\u003c/p>\u003cp>«أعدّ السلال. ليس عندي ميزان.» أشارت إلى السلة التي وضعها شياو دو للتو بجانب الموقد. «كل السلال من الحجم نفسه تقريباً. شياو دو يملؤها حتى الحافة. هذا قياس سيئ، لكنه أفضل من لا شيء.»\u003c/p>\u003cp>«ومن أين نعرف كم كانت تحرق قبل الإصلاح؟»\u003c/p>\u003cp>نظرت إليه. ثم نظرت إلى ما وراء كتفه.\u003c/p>\u003cp>التفت لين. كانت هو سانيانغ واقفة في باب المطبخ، تمسح يديها بمريلتها، وتنظر إليهما.\u003c/p>\u003cp>قالت شين يان، بلهجتها الأخف: «صباح الخير، هو سانيانغ. عندي سؤال.»\u003c/p>\u003cp>«اسألي.»\u003c/p>\u003cp>«كم سلة حطب كنتِ تحرقين في اليوم الواحد، في الشتاء الماضي، حين كانت القافلة هنا؟»\u003c/p>\u003cp>لم تجب هو سانيانغ فوراً. ثم قالت، ببطء: «لماذا؟»\u003c/p>\u003cp>«لأنني أظن أنك ستحرقين أقل هذه المرة. وأريد أن أعرف كم أقل.»\u003c/p>\u003cp>ونظرت هو سانيانغ إلى الدفتر على ركبتي شين يان. إلى الخطوط والأعمدة والأرقام الغريبة التي لم تستطع قراءتها.\u003c/p>\u003cp>ثم دخلت المطبخ، وخرجت بعد دقيقة بكتاب.\u003c/p>\u003cp>لم يكن كتاباً بالضبط. كان رزمة من الأوراق الخشنة الصفراء، مخيطة من طرفها بخيط من القنب، وغلافها قطعة من الجلد الرقيق. فتحتها هو سانيانغ، وقلبت الصفحات بأصابع خبيرة، حتى توقفت عند صفحة.\u003c/p>\u003cp>قالت: «الشتاء الماضي. القافلة الثانية. اشتريت الحطب من عائلة وانغ، ثلاث عربات.» وأشارت إلى عمود من الحروف لم يستطع لين ولا شين يان قراءته. «القافلة بقيت أربع ليال. وانتهت العربة الثالثة في الليلة الرابعة.»\u003c/p>\u003cp>حدقت شين يان في الصفحة.\u003c/p>\u003cp>«العربة الواحدة، كم سلة؟»\u003c/p>\u003cp>«ثلاثون. تقريباً. وانغ العجوز لص، يملأ العربة من الأعلى ويتركها فارغة من الأسفل.»\u003c/p>\u003cp>بدأت شين يان تكتب في دفترها. سمع لين صوت الرصاص على الورق، سريعاً وثابتاً.\u003c/p>\u003cp>«ثلاث عربات، تسعون سلة، أربع ليال. اثنتان وعشرون سلة ونصف في اليوم.» رفعت رأسها. «والطبخ للقافلة نفسه؟ والغرفة الكبيرة نفسها؟»\u003c/p>\u003cp>«نفسه.»\u003c/p>\u003cp>«والطقس؟»\u003c/p>\u003cp>لم تفهم هو سانيانغ السؤال. ثم فهمت. «أبرد قليلاً من الآن. كان الثلج قد نزل.»\u003c/p>\u003cp>كتبت شين يان. ثم أغلقت الدفتر.\u003c/p>\u003cp>قالت: «سأقول لك الرقم الليلة.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يكن عند لين ما يفعله طوال النهار.\u003c/p>\u003cp>حاول أن يجد عملاً. سأل شياو دو إن كان أحد في القرية يحتاج شيئاً يُصلح، فهز الصبي كتفيه. سأل هو سانيانغ، فأعطته فأساً ودلته على كومة جذوع خلف الحظيرة.\u003c/p>\u003cp>فقضى الصباح يقطع الحطب.\u003c/p>\u003cp>لم يقطع حطباً منذ كان طفلاً في قرية جده. كانت يداه الناعمتان، يدا مهندس يقضي يومه أمام الحاسوب، تؤلمانه بعد ربع ساعة. وبعد ساعة، ظهرت بثرة على راحته اليمنى، ثم انفجرت.\u003c/p>\u003cp>لكنه تعلم.\u003c/p>\u003cp>تعلم أن الفأس لا تحتاج إلى قوة بقدر ما تحتاج إلى زاوية. وتعلم أن يقرأ الجذع قبل أن يضربه، أن يبحث عن الشقوق الصغيرة في نهايته، فهي تقول له من أين ينشق. وفكر، وهو يضرب، أن النظام يستطيع أن يقول له ذلك أيضاً. لكنه لم يستخدمه.\u003c/p>\u003cp>كان يريد أن يعرف إن كان يستطيع أن يفعل شيئاً واحداً بنفسه.\u003c/p>\u003cp>قرب الظهر، جاء لاو ما.\u003c/p>\u003cp>لم يسمعه لين يقترب. كان الرجل الضخم يتحرك بهدوء غريب بالنسبة إلى حجمه. وقف عند زاوية الحظيرة، وذراعاه على صدره، وراقب لين وهو يقطع ثلاثة جذوع.\u003c/p>\u003cp>ثم قال: «أنت لم تقطع حطباً في حياتك.»\u003c/p>\u003cp>توقف لين. مسح عرقه بكمه. «قطعت. حين كنت صغيراً.»\u003c/p>\u003cp>«حين كنت صغيراً.» ضحك لاو ما. «يداك يدا كاتب. أو تاجر. أو ابن عائلة. لكن ليستا يدي حطاب.» اقترب، وأشار إلى الجذع. «ولا يدي عامل بناء.»\u003c/p>\u003cp>لم يقل لين شيئاً.\u003c/p>\u003cp>«لكن المدخنة لا تكذب.» توقف لاو ما بجانب كومة الحطب، ونظر إليها، ثم إلى لين. «من أين أنتما؟»\u003c/p>\u003cp>«من الجنوب.»\u003c/p>\u003cp>«الجنوب كبير.»\u003c/p>\u003cp>«من مكان أخذه الماء.»\u003c/p>\u003cp>نظر إليه لاو ما طويلاً. ولم يكن في نظرته شيء من الحدة التي في نظرة هو سانيانغ. كانت نظرة رجل يقضي حياته على الطرق، يرى غرباء كل يوم، وتعلم أن يقيس كل واحد منهم.\u003c/p>\u003cp>قال: «أنا أذهب إلى الجنوب كل ربيع. إلى المدن على النهر الكبير. ولم أسمع أحداً هناك يتكلم مثلك.»\u003c/p>\u003cp>توقف قلب لين لحظة.\u003c/p>\u003cp>لكن لاو ما لم ينتظر جواباً. هز كتفيه الضخمين، كأن الأمر لا يعنيه حقاً.\u003c/p>\u003cp>«لا يهمني من أين أنت. يهمني ما تعرف أن تفعل.» التفت ليمشي، ثم توقف. «عندنا في محطة الملح، على بعد ثلاثة أيام شمالاً، مدخنة مثل هذه. أسوأ. وفرن لتجفيف الملح، يأكل الحطب كأنه جائع منذ سنة. إذا كنت ما زلت هنا في الربيع، وإذا كانت مدخنة هو سانيانغ ما زالت تسحب…» لوح بيده. «سنتكلم.»\u003c/p>\u003cp>ومشى.\u003c/p>\u003cp>وقف لين يحدق في ظهره حتى اختفى عند زاوية النزل.\u003c/p>\u003cp>ظهرت الحروف الزرقاء.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[ملاحظة]\u003c/strong>\u003c/div>\u003cdiv>تم تسجيل جهة اتصال: لاو ما (رئيس قافلة ملح)\u003c/div>\u003cdiv>فرصة محتملة: غير مؤكدة.\u003c/div>\u003c/div>\u003cp>قال لين في نفسه: شكراً. هذا ما كنت أحتاجه بالضبط. ملاحظة.\u003c/p>\u003cp>ثم عاد إلى الجذع.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت شين يان قد أمضت النهار كله بين المطبخ والمخزن.\u003c/p>\u003cp>حين عاد لين قبل الغروب، يداه ملفوفتان بقطعة قماش أعطاه إياها شياو دو، وجدها جالسة في المخزن، الدفتر على ركبتيها، وعلى الصفحة المفتوحة أرقام وأسهم وجداول، كتبتها بالأرقام التي تعلماها في المدرسة. الأرقام التي لا يقرأها أحد في هذه القرية.\u003c/p>\u003cp>قالت دون أن ترفع رأسها: «يداك.»\u003c/p>\u003cp>«بخير.»\u003c/p>\u003cp>«أرني.»\u003c/p>\u003cp>أراها. فكت القماش، ونظرت إلى البثرة المنفجرة، والجلد الأحمر حولها. لم تقل شيئاً. أعادت لف القماش بعناية أكبر، وربطته.\u003c/p>\u003cp>ثم قالت: «أربع عشرة سلة.»\u003c/p>\u003cp>«اليوم؟»\u003c/p>\u003cp>«حتى الآن. والنار في الغرفة الكبيرة لن تُطفأ قبل منتصف الليل، فأضف ثلاثاً. سبع عشرة سلة. لنقل ثماني عشرة، لأنني ربما أخطأت في العد.» قلبت الصفحة. «وفي الشتاء الماضي، اثنتان وعشرون ونصف. وكان الجو أبرد. فإذا عدّلنا للطقس… لا أستطيع أن أعدّل بدقة، ليس عندي معلومات. لكن لو قلت إن البرد كان يحتاج سلة إضافية واحدة…»\u003c/p>\u003cp>«واحد وعشرون ونصف مقابل ثماني عشرة.»\u003c/p>\u003cp>«ثلاث سلال ونصف في اليوم. ستة عشر في المئة تقريباً.»\u003c/p>\u003cp>«ستة عشر في المئة.» فكر لين. «هذا جيد. لكنه ليس كثيراً.»\u003c/p>\u003cp>«ليس كثيراً.» أغلقت الدفتر. «لأن إصلاح أمس لم يكن إلا نصف إصلاح. لم نلمس موقد الغرفة الكبيرة، والمدخنة ما زالت ضيقة، والطوب الذي سدَدنا به الثقب لن يصمد شهراً.» نظرت إليه. «لو أعدنا بناء الموقدين كما ينبغي، وأضفنا فتحة هواء سفلية وصفيحة تضبط سحب الدخان، وعزلنا جدار الموقد كيلا تتسرب الحرارة إليه…»\u003c/p>\u003cp>«كم؟»\u003c/p>\u003cp>«ثلاثين في المئة. ربما خمسة وثلاثين.»\u003c/p>\u003cp>صمت لين.\u003c/p>\u003cp>ثلث الوقود. في شتاء يبدأ بعد أيام، في نزل يعتمد على القوافل، ويشتري حطبه بالعربة من رجل لص.\u003c/p>\u003cp>قال: «هي لن تصدق الرقم.»\u003c/p>\u003cp>«ستصدق نصفه.» وقفت شين يان، ونفضت القش. «وهذا يكفي.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وجدتهما هو سانيانغ في المطبخ بعد العشاء.\u003c/p>\u003cp>كان رجال القافلة قد ناموا أو سكروا. وشياو دو يجلي القدور في الزاوية بصوت عالٍ. وجلست هو سانيانغ على كرسي خشبي قرب الموقد، وفي يدها كوب من الشاي الساخن، وأمامها على الطاولة كتاب حساباتها مفتوحاً.\u003c/p>\u003cp>لم تقدم لهما شاياً.\u003c/p>\u003cp>قالت: «الرقم.»\u003c/p>\u003cp>جلست شين يان على الكرسي المقابل. جلس لين على صندوق خشبي بجانبها.\u003c/p>\u003cp>قالت شين يان: «اليوم أحرقتِ ثماني عشرة سلة. الشتاء الماضي، مع القافلة نفسها، اثنتين وعشرين ونصفاً.»\u003c/p>\u003cp>لم تتحرك هو سانيانغ. لكن لين رأى أصابعها تشتد على الكوب.\u003c/p>\u003cp>«أنتِ لم تكوني هنا الشتاء الماضي.»\u003c/p>\u003cp>«كتابك كان هنا.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى كتابها، ثم إلى شين يان.\u003c/p>\u003cp>قالت شين يان: «هذا بإصلاح يوم واحد. إصلاح مؤقت، لن يصمد. لو أعدنا بناء الموقدين والمدخنة كما يجب، ستحرقين ثلثاً أقل مما كنت تحرقين.»\u003c/p>\u003cp>«ثلث.»\u003c/p>\u003cp>«ثلث.»\u003c/p>\u003cp>ضحكت هو سانيانغ. ضحكة قصيرة، جافة. «عامل البناء من البلدة قال لي إن المدخنة ستسحب كأن تنيناً يتنفس فيها. وأخذ ثلاثين نحاسة.»\u003c/p>\u003cp>«عامل البناء لم يعدّ السلال.»\u003c/p>\u003cp>توقفت الضحكة.\u003c/p>\u003cp>قالت هو سانيانغ بعد صمت: «ماذا تريدان؟»\u003c/p>\u003cp>نظرت شين يان إلى لين. كان هذا اتفاقهما: هو يقول الرقم الأول.\u003c/p>\u003cp>قال لين: «المبيت والطعام. لنا نحن الاثنين. حتى ينتهي الشتاء.»\u003c/p>\u003cp>«حتى ينتهي الشتاء.» رفعت هو سانيانغ حاجبيها. «هذا أربعة أشهر. أربعة أشهر من الطعام لشخصين، مقابل موقد؟»\u003c/p>\u003cp>قالت شين يان: «مقابل ثلث حطب الشتاء كله. وأربعة أشهر من القوافل التي لن تذهب إلى قرية الماء الأحمر.»\u003c/p>\u003cp>«ومن يقول إنكما ستصلحانه؟ ومن يقول إن الثلث صحيح؟»\u003c/p>\u003cp>«لا أحد.» قالت شين يان ذلك ببساطة أدهشت لين. «لذلك لا نطلب كل شيء الآن.»\u003c/p>\u003cp>وأخرجت الدفتر، وفتحته، ووضعته على الطاولة أمام هو سانيانغ. لم تستطع المرأة قراءة الأرقام، لكن شين يان وضعت إصبعها على عمود.\u003c/p>\u003cp>«نعيد بناء الموقدين في ثلاثة أيام، أو أربعة. خلال هذه الأيام، المبيت والطعام. ثم نعدّ السلال معاً، أنتِ وأنا، كل يوم، لمدة عشرة أيام. إذا كان الحطب أقل بالثلث، نبقى حتى نهاية الشتاء بالطعام والمبيت. وإذا كان أقل بالربع فقط، نبقى حتى منتصف الشتاء. وإذا كان أقل من ذلك…»\u003c/p>\u003cp>«ترحلان.»\u003c/p>\u003cp>«نرحل.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى الدفتر. إلى الإصبع على العمود الذي لا تستطيع قراءته. ثم إلى وجه شين يان.\u003c/p>\u003cp>قالت: «وتريدان شيئاً آخر. أرى ذلك في عينيك.»\u003c/p>\u003cp>ابتسمت شين يان لأول مرة منذ دخلت المطبخ. «نصف ما توفرينه من ثمن الحطب، بعد نهاية الشتاء.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«ربعه.»\u003c/p>\u003cp>«ولا نحاسة.» وضعت هو سانيانغ الكوب على الطاولة بقوة، فاندلق الشاي على حافتها. «الطعام والمبيت، هذا أجر رجل يعمل عندي. لا أشاركه في مالي.»\u003c/p>\u003cp>قال لين: «لكننا لا نعمل عندك. نحن نبيعك شيئاً.»\u003c/p>\u003cp>«تبيعانني ماذا؟ موقد؟ الموقد موقدي. والطوب طوبي، والطين من نهر القرية.»\u003c/p>\u003cp>«نبيعك ما نعرفه.»\u003c/p>\u003cp>صمتت هو سانيانغ.\u003c/p>\u003cp>قال لين بهدوء: «لو أعطيتك الطوب والطين، هل تستطيعين بناءه؟ عامل البلدة لم يستطع، بعد مرتين. ما تدفعين ثمنه ليس الطوب. هو ما في رأس زوجتي.»\u003c/p>\u003cp>نظرت إليه هو سانيانغ طويلاً. ثم نظرت إلى شين يان، وشيء ما تغير في وجهها. لم يعرف لين ما هو. ربما احترام. ربما حذر.\u003c/p>\u003cp>قالت ببطء: «حين تقولين الثلث. الثلث من ماذا؟»\u003c/p>\u003cp>رمش لين.\u003c/p>\u003cp>«من الشتاء الماضي؟» تابعت هو سانيانغ. «الشتاء الماضي كان أبرد. فإذا جاء هذا الشتاء أدفأ، أحرق أقل وحدي، دون موقدكما. وتقولان: هذا بفضلنا.» نقرت بإصبعها على الطاولة. «وإذا جاء أبرد، أحرق أكثر. وتقولان: كان سيكون أسوأ بدوننا. وأنا لا أستطيع أن أقرأ أرقامكما.»\u003c/p>\u003cp>لم يجد لين ما يقوله.\u003c/p>\u003cp>لأنها كانت محقة. لم يفكر في ذلك. كان الرقم واضحاً في رأسه، ثلث، ستة عشر في المئة، اثنتان وعشرون ونصف مقابل ثماني عشرة. لم يفكر أن الرقم نفسه يمكن أن يُقرأ بطريقتين، وأن من يملك الحق في قراءته هو من يملك الاتفاق.\u003c/p>\u003cp>لكن شين يان كانت قد فكرت.\u003c/p>\u003cp>قالت: «إذن لا نقارن بالشتاء الماضي.»\u003c/p>\u003cp>«بماذا إذن؟»\u003c/p>\u003cp>«بالموقد نفسه.» أشارت إلى الغرفة الكبيرة. «نعيد بناء موقد المطبخ أولاً، ونترك الغرفة الكبيرة كما هي. وكل يوم، تعدّين بنفسك. سلال المطبخ، وسلال الغرفة الكبيرة. في اليوم نفسه، في البرد نفسه. فإذا كان موقد المطبخ يحرق أقل بالثلث من الغرفة الكبيرة، مع أنه يطبخ لعشرين رجلاً، عرفتِ الرقم بعينيك. لا تحتاجين إلى قراءة أرقامي.»\u003c/p>\u003cp>صمت.\u003c/p>\u003cp>قلّبت هو سانيانغ الفكرة في رأسها. رأى لين ذلك. رآها تبحث عن الثغرة، كما بحثت عن الثغرة في كلامه.\u003c/p>\u003cp>ثم قالت: «وبعد ذلك الغرفة الكبيرة.»\u003c/p>\u003cp>«بعد ذلك الغرفة الكبيرة.»\u003c/p>\u003cp>«والربع؟»\u003c/p>\u003cp>«ربع ما توفرينه من ثمن الحطب. من اليوم الذي نبني فيه الموقد الثاني، حتى نهاية الشتاء. تحسبينه أنتِ، من كتابك.»\u003c/p>\u003cp>«خُمس.»\u003c/p>\u003cp>قالت شين يان: «خُمس، والمبيت حتى الربيع، مهما كان الرقم، إذا كان التوفير أكثر من الربع.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى شين يان مرة أخرى. ثم، لأول مرة منذ رآها لين، ضحكت ضحكة حقيقية. قصيرة، لكنها حقيقية.\u003c/p>\u003cp>«أنتِ كنتِ تبيعين في السوق، أليس كذلك؟ في الجنوب؟»\u003c/p>\u003cp>قالت شين يان: «شيء من هذا.»\u003c/p>\u003cp>«اتفقنا.»\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[اتفاق مسجل]\u003c/strong>\u003c/div>\u003cdiv>الطرف: هو سانيانغ\u003c/div>\u003cdiv>الشروط: المبيت والطعام طوال مدة البناء. خُمس قيمة الوقود الموفر حتى نهاية الشتاء. المبيت حتى الربيع إذا تجاوز التوفير 25%.\u003c/div>\u003cdiv>طريقة القياس: مقارنة يومية بين موقدين، تجريها هو سانيانغ.\u003c/div>\u003cdiv>ملاحظة: الشروط شفهية. لا توجد وثيقة.\u003c/div>\u003c/div>\u003cp>قرأ لين السطر الأخير، وعرف أن النظام محق. لكنه لم يقل شيئاً.\u003c/p>\u003cp>لأن هو سانيانغ لم تكن قد انتهت.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قالت، وهي تسكب لنفسها كوباً آخر من الشاي: «شيء أخير.»\u003c/p>\u003cp>انتظرا.\u003c/p>\u003cp>«بعد ستة أيام، يوم السوق. يأتي الكاتب وو من البلدة.» لم تنظر إليهما. نظرت إلى الشاي. «يكتب الناس في دفتر الحكومة. من وُلد، ومن مات، ومن جاء، ومن ذهب. ويجمع ضريبة الرأس.»\u003c/p>\u003cp>شعر لين بشين يان تتصلب بجانبه.\u003c/p>\u003cp>«كل غريب يبقى في القرية أكثر من عشرة أيام يجب أن يُكتب. ويجب أن يكون له كفيل من أهل القرية، يضمن أنه ليس لصاً ولا هارباً ولا متمرداً.» رفعت عينيها إليهما. «والغريب الذي ليس له كفيل، يأخذه الكاتب إلى البلدة. وهناك، إما أن يعمل في السخرة على السور حتى يدفع ضريبته، أو يُطرد من الإقليم.»\u003c/p>\u003cp>لم يقل لين شيئاً. لم يكن يعرف ماذا يقول.\u003c/p>\u003cp>قالت هو سانيانغ: «أنا أكفلكما.»\u003c/p>\u003cp>قالت شين يان بحذر: «لماذا؟»\u003c/p>\u003cp>«لأنني أريد موقدي.» شربت من الشاي. «ولأن الكاتب وو إذا أخذكما، لن يرجع لي أحد عملي.»\u003c/p>\u003cp>«وماذا يكلف ذلك؟»\u003c/p>\u003cp>ابتسمت هو سانيانغ. لم تكن الابتسامة نفسها التي ضحكتها قبل قليل.\u003c/p>\u003cp>«رسم التسجيل أربعون نحاسة للشخص. وضريبة الرأس للشتاء ثلاثون. مئة وأربعون نحاسة لكما الاثنين.» وأغلقت كتاب حساباتها. «أدفعها أنا للكاتب. وتصير ديناً عليكما. تسددانه من الخُمس.»\u003c/p>\u003cp>قال لين: «وإذا لم يكف الخمس؟»\u003c/p>\u003cp>«تسددانه بعد ذلك.»\u003c/p>\u003cp>«وإذا رحلنا؟»\u003c/p>\u003cp>نظرت إليه هو سانيانغ، وكانت عيناها ثابتتين تماماً.\u003c/p>\u003cp>«الكفيل الذي يهرب مكفوله، يدفع عنه غرامة للحكومة. والمكفول الذي يهرب من دينه، يُكتب اسمه في دفتر الكاتب بأنه هارب. وكل كاتب في الإقليم يقرأ ذلك الدفتر.» وقفت، وأخذت كوبها. «لن ترحلا.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين عادا إلى المخزن، لم يتكلما طويلاً.\u003c/p>\u003cp>جلس لين على القش، يضغط يده الملفوفة على صدره، يفكر في مئة وأربعين نحاسة. لم يكن يعرف حتى كم تساوي النحاسة. كم رغيفاً؟ كم سلة حطب؟\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل]\u003c/strong>\u003c/div>\u003cdiv>لا تتوفر بيانات كافية عن القيمة الشرائية للعملة المحلية.\u003c/div>\u003cdiv>الثقة: —\u003c/div>\u003c/div>\u003cp>قال لنفسه: طبعاً.\u003c/p>\u003cp>قالت شين يان أخيراً: «كان يجب أن أتوقع ذلك.»\u003c/p>\u003cp>«لا أحد كان يستطيع أن يتوقعه.»\u003c/p>\u003cp>«كان يجب.» كانت جالسة في زاويتها، ركبتاها إلى صدرها. «كانت تعرف منذ البداية. منذ أول ليلة. كانت تعرف أننا سنحتاج إلى كفيل، وكانت تنتظر حتى نتفق على كل شيء آخر، حتى نشعر أننا ربحنا، ثم قالتها.»\u003c/p>\u003cp>لم يقل لين شيئاً. لأنها كانت محقة مرة أخرى.\u003c/p>\u003cp>قالت: «الكذبة.»\u003c/p>\u003cp>«أي كذبة؟»\u003c/p>\u003cp>«الجنوب. الفيضان.» نظرت إليه. «الكاتب سيسأل. سيسأل عن القرية والمقاطعة وأسماء آبائنا. ونحن لا نعرف حتى اسم نهر واحد في الجنوب.»\u003c/p>\u003cp>«لم نكذب. هي التي قالت.»\u003c/p>\u003cp>«ولم نصحح.» قالت ذلك بهدوء، لكن الكلمات وقعت ثقيلة. «وهذا أسوأ يا لين. لأن الكذبة التي تقولها، تعرف حدودها. والكذبة التي تتركهم يصدقونها، تكبر وحدها.»\u003c/p>\u003cp>صمت طويل.\u003c/p>\u003cp>ثم قالت بنبرة مختلفة، عملية: «أريد أن أتعلم القراءة.»\u003c/p>\u003cp>«القراءة؟»\u003c/p>\u003cp>«كتابها. كتاب حسابات هو سانيانغ.» نظرت إلى الدفتر في حضنها، إلى أرقامها التي لا يقرأها غيرهما. «كل الاتفاقات هنا تُكتب بتلك الحروف. وكل الديون. ودفتر الكاتب وو. إذا لم نقرأ ما يكتبونه عنا، فهم يملكوننا.»\u003c/p>\u003cp>«ستعلمك؟»\u003c/p>\u003cp>«ستعلمني.» وابتسمت ابتسامة صغيرة، متعبة. «لأنها تريد أن أقرأ أرقام السلال في كتابها، لا في دفتري. تريد أن تتأكد أنني لا أغشها. وأنا أريد أن أتأكد أنها لا تغشني.»\u003c/p>\u003cp>ضحك لين، رغم كل شيء.\u003c/p>\u003cp>ثم توقف. لأن شين يان فعلت شيئاً غريباً: وضعت يدها على بطنها، وأغمضت عينيها، وبقيت هكذا ساكنة.\u003c/p>\u003cp>«يان؟»\u003c/p>\u003cp>«لا شيء.» فتحت عينيها. «فقط… سيولد هنا، أليس كذلك؟ في الصيف. سيولد في مكان يُكتب فيه اسمه في دفتر الكاتب، بحروف لا يقرأها أبوه ولا أمه.»\u003c/p>\u003cp>لم يكن عند لين جواب لذلك.\u003c/p>\u003cp>مد يده فقط، ووضعها على يدها. وبقيا هكذا، في الظلام، يستمعان إلى شخير رجال القافلة عبر الجدار، وإلى الريح التي تزداد برودة في الخارج.\u003c/p>\u003cp>وفي زاوية عينه، هادئة، لا تطلب شيئاً، كانت الحروف الزرقاء تقول:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>الوحدة الحضارية المسجلة: 3 أفراد.\u003c/strong>\u003c/div>\u003c/div>"},{"n":4,"t":"الفصل الرابع: الحداد لا يجادل","b":"\u003cp>حسمت هو سانيانغ الأمر وهي تضع كوبها على الطاولة: «الموقد الصغير أولاً. موقد المطبخ.»\u003c/p>\u003cp>كان ذلك في فجر اليوم الرابع، والقافلة ما زالت نائمة في الغرفة الكبيرة. كانت تقف بين القدور، وكوب الشاي إلى جانبها، وتنظر إلى شين يان لا إلى لين.\u003c/p>\u003cp>«إن فشل، فقد خسرت طيناً وبعض الحطب. وإن نجح، فأنتما تبنيان الثاني في الغرفة الكبيرة. وإن انهار الأول فوق رأس الطباخة، ترحلان قبل أن تعود القافلة من السوق.»\u003c/p>\u003cp>قالت شين يان: «سيصمد.»\u003c/p>\u003cp>«قولي هذا حين يصمد.»\u003c/p>\u003cp>خرجت إلى الغرفة الكبيرة وهي تأمر أحداً بإحضار الماء للطباخة. وبقي لين وشين يان في عتمة المطبخ الدافئة، يسمعان تكتكة الجمر في الموقد القديم، وهو يلفظ دخانه الرمادي إلى الداخل، كما يفعل منذ سنة.\u003c/p>\u003cp>قال لين: «لو اشتغل الأول جيداً، فالثاني سهل.»\u003c/p>\u003cp>«وإن لم يعمل؟» لمست الرسم بطرف القلم.\u003c/p>\u003cp>«نبحث عن الخلل.»\u003c/p>\u003cp>«بأي وقت؟ وبأي حطب؟»\u003c/p>\u003cp>نظر إلى القدور المعلقة. لا موقد آخر في المطبخ يعوضانه به، ولا مال يشترون به ما يتلف. قال: «نختبره بنار صغيرة قبل الطبخ.»\u003c/p>\u003cp>«ونترك منفذاً نصل منه إلى البطانة. لا تغلق الواجهة قبل أن أراها.»\u003c/p>\u003cp>أومأ، فأضافت إلى الرسم فتحة صغيرة.\u003c/p>\u003cp>عادت شين يان إلى الجذع قرب الباب، وأكملت الرسم بالقلم الرصاص. كانا يسمعان احتكاك سنّه بالورق في هدوء المطبخ. غرفة احتراق صغيرة تعزلها طبقة سميكة من الطين، وشبكة يدخل الهواء من تحتها، ثم فتحة أخرى فوق النار. أما المدخنة فتضيق قليلاً في منتصفها، حيث تستقر صفيحة بمقبض لضبط سحب الدخان.\u003c/p>\u003cp>قال لين: «نحتاج صفيحة حديد لضبط السحب.»\u003c/p>\u003cp>«أعرف.» لم ترفع رأسها. «هل عندك حديد؟»\u003c/p>\u003cp>«عندي أداة متعددة من فولاذ لا يصدأ، ولن أقطعها.»\u003c/p>\u003cp>«طبعاً لن تقطعها.»\u003c/p>\u003cp>سألت هو سانيانغ من خلفهما: «ماذا تحتاجان؟»\u003c/p>\u003cp>«صفيحة حديد بحجم الكف.»\u003c/p>\u003cp>«عند تشانغ.» قالتها بلا حماس. «في الطرف الجنوبي. لا يبيع إلا لمن يعرفه، ولا يعرفك. خذ شياو دو، فهو يعرف أن يسكت أمامه.»\u003c/p>\u003cp>قال شياو دو من الزاوية: «أنا لا أعرف أن أسكت أمام أحد.»\u003c/p>\u003cp>«أمام تشانغ تعرف.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مشوا عبر القرية في الصباح الباكر. كان الصقيع قد ترك على الساحة طبقة بيضاء رقيقة تنكسر تحت النعال، وخيوط الدخان ترتفع عمودية من بيت بعد بيت. مرت بهم امرأة تحمل جرة ماء على رأسها، فتوقفت وتبعتهم بعينيها حتى انعطفوا.\u003c/p>\u003cp>قالت شين يان بلغتهما: «يحدقون.»\u003c/p>\u003cp>«ثيابنا.»\u003c/p>\u003cp>«لا، ليست الثياب فقط.» مشت خطوتين صامتة. «اليوم عرفوا أن هو سانيانغ احتفظت بنا. هذا يغير شيئاً.»\u003c/p>\u003cp>«ماذا يغير؟»\u003c/p>\u003cp>«أنهم سيأتون إلينا بطلبات. وسيسألون كيف تعلّمنا هذا.»\u003c/p>\u003cp>مرّا بجانب سور قصير من الحجر الجاف، وعلى رأسه امرأتان تنشران لحافاً مبطناً للتهوية. توقفتا عن الكلام حين مرا، ثم عادتا إليه بصوت أخفض. وسمع لين كلمة «الموقد» تتردد بين همسهما، وكلمة «الجنوب».\u003c/p>\u003cp>قال شياو دو بفخر مفاجئ، كأنه صاحب الفضل: «سمعوا عن المدخنة. ليلة أمس لم يسعل أحد في الغرفة الكبيرة. كل القرية تعرف، لأن زوجة الجزار تنام قرب الجدار.»\u003c/p>\u003cp>«قرية صغيرة.»\u003c/p>\u003cp>«قرية لا تُخفى فيها حتى الضرطة.» ثم عض لسانه: «آسف. هذا لا يقال أمام الست.»\u003c/p>\u003cp>ارتفع طرف فم شين يان للحظة، ثم عادت إلى جديتها.\u003c/p>\u003cp>الورشة عند آخر الطريق، بعد آخر بيت وقبل أول حقل. سقف منخفض من القرميد الأسود، وجدار مفتوح من جهة واحدة، وأمامه كومة قضبان حديد صدئة بلون الدم القديم. سمعوا الضربات قبل أن يروا صاحبها: ضربة، ثم صمت قصير، ثم ضربة. إيقاع رجل لا يستعجل.\u003c/p>\u003cp>كان تشانغ منحنياً على السندان، عريض الظهر، ذراعاه مغطيتان بندوب حروق قديمة بيضاء. لم يلتفت. أخرج من الفحم قطعة حمراء، وضربها ثلاث مرات، وأعادها إلى النار.\u003c/p>\u003cp>قال شياو دو بصوت خافت: «هذا العم تشانغ.»\u003c/p>\u003cp>«أرى.»\u003c/p>\u003cp>وقفوا. وحين أنهى تشانغ ما في يده، رفع رأسه ونظر إلى لين من أعلى إلى أسفل، إلى اليدين الملفوفتين بالقماش، ثم إلى ملابس شين يان.\u003c/p>\u003cp>«أنتما النازحان.»\u003c/p>\u003cp>«نريد صفيحة حديد بحجم الكف. لضبط سحب المدخنة.»\u003c/p>\u003cp>«كيف تضبط الصفيحة السحب؟»\u003c/p>\u003cp>شرح لين. المدخنة، والتضييق، والمقبض. كان تشانغ يستمع وهو يمسح يديه بخرقة سوداء، ورفع طرف فمه حين وصل الشرح إلى صفيحة الحديد.\u003c/p>\u003cp>«نازحون يعلّمونني النار؟»\u003c/p>\u003cp>«لا أعلّمك. أطلب صفيحة.»\u003c/p>\u003cp>«وبماذا تدفع؟»\u003c/p>\u003cp>لم يكن عند لين جواب. ولاحظ أنه لم يعد يغضب من هذا السؤال. أصبح سؤالاً يتكرر كل يوم، مثل الجوع.\u003c/p>\u003cp>قالت شين يان: «بالعمل.»\u003c/p>\u003cp>نظر إليها تشانغ. ثم نظر إلى المنفاخ.\u003c/p>\u003cp>كان المنفاخ في الزاوية الخلفية للورشة، من الجلد الأسود المشدود بين لوحين خشبيين كبيرين، له ذراع طويلة يديرها صبي نعسان جالس بجانبه. كلما ضغط الصبي الذراع، صدر عن الجلد صفير ضعيف، ثم زفير خشن، والنار تحت الفحم تتنفس بضعف.\u003c/p>\u003cp>قال لين: «منفاخك يسرب.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«يسرب. أراه من هنا.»\u003c/p>\u003cp>كان يسمع الصفير، لكنه لم يعرف موضع التسرب. تسرع في كلامه، ثم ركز على الجلد ليتأكد.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: منفاخ جلدي\u003c/div>\u003cdiv>العيوب: تسريب عند الخياطة السفلية اليسرى (قطر حوالي 4 ملم). تسريب ثانٍ عند حافة الصمام العلوي.\u003c/div>\u003cdiv>الصمام الجلدي: متيبس، لا يغلق إغلاقاً كاملاً. يفقد حوالي ثلث الهواء.\u003c/div>\u003cdiv>الثقة: 81%\u003c/div>\u003cdiv>طاقة التكامل: 91%\u003c/div>\u003c/div>\u003cp>وجد لين نفسه يقول: «في الأسفل على اليسار، عند الخياطة. وعند حافة الصمام. والصمام نفسه قاسٍ، فلا يغلق.»\u003c/p>\u003cp>قال الصبي النعسان فجأة، دون أن يرفع رأسه عن الذراع: «يسرب منذ العيد الماضي.»\u003c/p>\u003cp>التفت إليه تشانغ، فسكت الصبي وانكمش.\u003c/p>\u003cp>قال تشانغ: «أعرف أنه يسرب.»\u003c/p>\u003cp>«وأنت تعرف أين؟»\u003c/p>\u003cp>«لا.» قالها بصدق مؤلم لرجل مثله.\u003c/p>\u003cp>«أنا أعرف أين.»\u003c/p>\u003cp>«كلام.»\u003c/p>\u003cp>«جرّب.» قال لين.\u003c/p>\u003cp>كانت الكلمة كلمة تشانغ، لكنها خرجت من فم لين، فرفع الحداد حاجبيه ببطء. ثم تنحى عن المنفاخ، ووضع الخرقة على السندان.\u003c/p>\u003cp>«جرّب.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق الأمر ساعة.\u003c/p>\u003cp>استعار لين قطعة جلد قديمة من كومة في الزاوية، وإبرة غليظة وخيطاً من عصب، وأخذ يخيط الثقب الأول. كانت يداه المتورمتان تتعثران، وشين يان تمسك الجلد مشدوداً له دون أن يطلب منها. أما الصمام فكان أصعب، فقد دهنه بشحم الحيوان الذي وجده في وعاء قرب الفحم، وأخذ يليّنه بين أصابعه حتى صار مرناً.\u003c/p>\u003cp>كانت الورشة تفوح برائحة الفحم المحروق والشحم الحيواني والحديد المبلل، رائحة معدنية حامضة تلتصق بالحلق. وفي الزاوية جرة ماء بارد يغمس فيها تشانغ قطعه الساخنة، فتصعد منها سحابة بيضاء تفح بصوت حاد.\u003c/p>\u003cp>حين انتهى لين من الثقب الأول، أمسكت شين يان الجلد بين أصابعها وشدّته وراقبت الخياطة.\u003c/p>\u003cp>قالت: «الغرزة متباعدة.»\u003c/p>\u003cp>«الجلد ضعيف.»\u003c/p>\u003cp>«الغرزة متباعدة. سيتسرب الهواء بعد أسبوع.» أخذت منه الإبرة دون أن تسأل. «أنت تخيط كما تلحم لوحة: تريد أن تنتهي. هذا جلد، يحتاج إلى غرزة كل نصف سنتيمتر، وشدّ بعد كل ثلاث غرز.»\u003c/p>\u003cp>وخاطت. غرزاتها صغيرة متقاربة، وأصابعها لا تتعثر. وكان تشانغ، من مكانه، يراقب يديها بانتباه أكبر مما راقب يدي لين.\u003c/p>\u003cp>وقف شياو دو خلف الحداد، يضم شفتيه كي لا يقاطع العمل.\u003c/p>\u003cp>حين انتهيا، وضع لين يده على الذراع.\u003c/p>\u003cp>«اضغط.»\u003c/p>\u003cp>ضغط الصبي النعسان.\u003c/p>\u003cp>اختفى الصفير. اندفع الهواء بقوة، وتوهج الفحم من الأحمر إلى البرتقالي، واشتد بياض قلب النار. تراجع تشانغ خطوة، ثم قرب منها قطعة الحديد التي تركها على السندان.\u003c/p>\u003cp>وقف يحدق في الفحم المتوهج. كانت النار تنعكس في عينيه وفي كل ندوب ذراعيه.\u003c/p>\u003cp>لم يقل شكراً. التقط من الكومة صفيحة صغيرة رمادية بحجم الكف، سميكة بعض الشيء، ووضعها في يد لين بلا كلمة. مرر لين ظفره على طرفها الخشن، فتوقف تشانغ عند الحركة. أخذ الصفيحة ثانية، وسوّى الحافة بالمبرد قبل أن يعيدها إليه. لم يترك فيها موضعاً يجرح من يحركها كل يوم. ثم التفت إلى قضبانه الصدئة، وتنفس بصوت مسموع، وقال وهو يحدق فيها:\u003c/p>\u003cp>«حديدي سيئ. لا تسألني لماذا.»\u003c/p>\u003cp>نظر لين إلى الصفيحة. ثم إلى القضبان. وبقيت أسئلته في فمه.\u003c/p>\u003cp>قالت شين يان: «سنعيد لك الصفيحة بعمل آخر.»\u003c/p>\u003cp>«لا تعيدا شيئاً.» ثم أضاف بعد صمت: «والإبرة في الصندوق. لا تضيعوها.»\u003c/p>\u003cp>جمع لين بقايا الخيط ووضع الإبرة في مكانها. وحين همّ بالمغادرة، ضغط الحداد ذراع المنفاخ مرة أخرى، يتفقد الرقعة الجديدة. لم يستدعهم ليغيروا فيها شيئاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد الظهر، هدموا الموقد القديم.\u003c/p>\u003cp>كان شياو دو يضرب الطين بمعول قصير ويضحك، ويحمل الحجارة إلى الخارج بحماسة صبي وجد أخيراً سبباً مشروعاً للتخريب. قال وهو يسقط قطعة كبيرة على الأرض بصوت مكتوم: «العمة تبكي كلما هدمنا شيئاً.»\u003c/p>\u003cp>«هي لا تبكي.»\u003c/p>\u003cp>«تبكي في سرها. ترى وجهها يتغير.»\u003c/p>\u003cp>قلّد وجه هو سانيانغ وهي تعد القطع الخشبية، شفتاها مزمومتان وعيناها تدوران، وضحك، ثم التفت حوله خائفاً وقال: «آسف. لا تخبرها.»\u003c/p>\u003cp>كانت العمة تظهر عند الباب كل نصف ساعة، تلقي نظرة على الركام وتعدّ بصمت الطوب المتكسر، ثم تختفي دون كلمة. وتركت على عتبة المخزن وعاء فيه خبز بارد وبصل، بلا تعليق، فأكلاه واقفين.\u003c/p>\u003cp>دفع لين الوعاء إلى شين يان أولاً. أكلت نصف الخبز وأعادت إليه الباقي، ثم رجعت إلى القياس.\u003c/p>\u003cp>كان الغبار الأحمر يتصاعد من الركام. جلست شين يان على كرسي صغير بعيد قليلاً عن الغبار، ويدها على بطنها تلقائياً، وتقيس بالقلم المسافات على الجدار الذي سيحمل الموقد الجديد.\u003c/p>\u003cp>قال لين: «لا تقتربي من الغبار.»\u003c/p>\u003cp>«أنا بعيدة.»\u003c/p>\u003cp>«أبعد.»\u003c/p>\u003cp>حدجته بنظرة وجرّت كرسيها شبراً واحداً. ففتح شياو دو الباب الخلفي ليتبدد الغبار.\u003c/p>\u003cp>وصل لين إلى الطبقة الأخيرة من الطين القديم، ورأى تحتها الجدار الأصلي، رطباً قليلاً. ركز عليه.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: بطانة داخلية لغرفة احتراق\u003c/div>\u003cdiv>المقترح: خلطة طين محلي (60%) + رمل ناعم (25%) + قش مفروم (15%)\u003c/div>\u003cdiv>الثقة: 58%\u003c/div>\u003cdiv>ملاحظة: بيانات محلية ناقصة عن خصائص الطين في هذه المنطقة.\u003c/div>\u003cdiv>طاقة التكامل: 82%\u003c/div>\u003c/div>\u003cp>قرأ الرقم مرتين.\u003c/p>\u003cp>ثمانية وخمسون. أقل من الستين بقليل، وهي النسبة التي كان يعتبرها في حياته السابقة حدّاً لا يُبنى فوقه. كان يعرف ما تعنيه: النظام لا يعرف هذا الطين. يخمّن.\u003c/p>\u003cp>التفت. كانت شين يان تقيس الجدار بظهرها إليه. وهو سانيانغ في المطبخ تضرب الخضار بسكين ثقيلة. والقافلة سترحل بعد ثلاثة أيام، ومعها فرصة الاختبار تحت أعين عشرين رجلاً يشهدون على أن الموقد يعمل. وبعدهم لن تكون هناك قافلة قبل أسابيع. وهو سانيانغ حددت شروطها: الاختبار قبل أن يبيعوا أي شيء.\u003c/p>\u003cp>وهو لا يملك أياماً زائدة.\u003c/p>\u003cp>قال في نفسه: ثمانية وخمسون في المئة تكفي لتجربة. ثم نقاش وتعديل.\u003c/p>\u003cp>لكنه لم يقل ذلك بصوت مسموع.\u003c/p>\u003cp>كان شياو دو ينتظر بفارغ الصبر، وقد حمل دلواً من الطين الأحمر الذي جلبه من منعطف النهر.\u003c/p>\u003cp>«هذا يكفي؟»\u003c/p>\u003cp>«يكفي.»\u003c/p>\u003cp>مزجوا الخلطة كما قالها النظام تماماً، بالأيدي والأقدام، والطين يتسلق الكاحلين بلونه الأحمر البارد. ثم أخذوا يصفونها على الجدار طبقة بعد طبقة. ناول لين الطين إلى شياو دو، فحمله الصبي إلى الجدار. وكانت شين يان تضغطه بقطعة خشب ملساء وتصحح الميل. كلما ظهر فراغ عند حجر أوقفتهما حتى يملآه، ثم مسحت يدها وأعادت القياس من القاعدة.\u003c/p>\u003cp>في منتصف العمل أوقفتهم شين يان بيدها.\u003c/p>\u003cp>«الشبكة.»\u003c/p>\u003cp>«ما بها؟»\u003c/p>\u003cp>«رسمتها مستوية. لكن الرماد سيتجمع في الوسط ويسد الهواء.» نزلت من الكرسي بحذر، وأمسكت قطعة الطين، وصنعت منها منحدراً خفيفاً نحو الأمام. «هكذا. يسقط الرماد وحده إلى الدرج.»\u003c/p>\u003cp>«كانت مستوية في الرسم.»\u003c/p>\u003cp>«كان الرسم خطأً.» قالتها ببساطة، دون اعتذار ودون تباهٍ، كمن يصحح رقماً. «أنا من رسمته.»\u003c/p>\u003cp>وتبدلت الشبكة. نظر لين إلى المنحدر الصغير، ثم وسّع أسفله مكاناً يجمع فيه الرماد. لم ينتبها إلى هذا في الرسم، وكان إصلاحه الآن أسهل من تكسيره بعد أن يجف.\u003c/p>\u003cp>حين غابت الشمس، كانت الغرفة الصغيرة في الموقد الجديد قد اكتملت. جدارها رطب لامع، بلون أحمر داكن، يلتصق بالأصابع.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلسا في المخزن بعد العشاء. الهواء مشبع برائحة الطين.\u003c/p>\u003cp>كانت شين يان تنظف يديها بخرقة مبللة، وبإبهامها تزيل الطين المتجمع تحت أظافرها. وفي ضوء الشمعة الوحيدة التي أعارتهم إياها هو سانيانغ، بدا وجهها أنحل مما كان في الصباح.\u003c/p>\u003cp>قالت دون أن تنظر إليه: «اليوم، حين حللت المنفاخ. كم كانت الثقة؟»\u003c/p>\u003cp>«واحد وثمانون.»\u003c/p>\u003cp>«جيد.» ثم: «والطين؟»\u003c/p>\u003cp>لم يرد فوراً.\u003c/p>\u003cp>مدّ يده إلى أداته المتعددة وأخذ يفتح شفرتها ويغلقها، وهو يعرف أنها لاحظت.\u003c/p>\u003cp>«الطين؟» قالت مرة أخرى.\u003c/p>\u003cp>«حللته. قدم الخلطة.»\u003c/p>\u003cp>«وما الثقة؟»\u003c/p>\u003cp>انتظرت وعيناها على يده. أغلق الشفرة ووضع الأداة بجانبه، ولم يرفع رأسه إليها.\u003c/p>\u003cp>قال: «كافية.»\u003c/p>\u003cp>«كافية كم؟»\u003c/p>\u003cp>«كافية لنبدأ.»\u003c/p>\u003cp>لم تقل شيئاً.\u003c/p>\u003cp>ثم أومأت ببطء، وأعادت الخرقة إلى الدلو، واستلقت على القش وأدارت ظهرها إليه، ويدها على بطنها.\u003c/p>\u003cp>لم يدرِ إن كانت صدّقته.\u003c/p>\u003cp>أطفأ الشمعة وظل مستيقظاً. بقيت واجهة النظام زرقاء في طرف بصره، تعرض النسبة التي أخفاها عنها:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>الثقة: 58%\u003c/strong>\u003c/div>\u003c/div>"},{"n":5,"t":"الفصل الخامس: الطين لا يكذب","b":"\u003cp>بعد يومين من البناء، صار لين يفتح أصابعه ببطء كي لا تتسع شقوق الجلد.\u003c/p>\u003cp>تشققت راحتاه من الماء البارد والطين الجاف، وصار الجلد في أطراف أصابعه أحمر داكناً يلسع كلما لمس شيئاً خشناً. كان يمسك الملعقة الخشبية في الصباح فتلسعه حافتها. ووجد على عتبة المخزن وعاءً صغيراً فيه شحم حيوان ممزوج بعشب أخضر مسحوق، ولم يسأل من وضعه. دهن به راحتيه، فتحسنتا، وتظاهرت شين يان أنها لم ترَ.\u003c/p>\u003cp>في صباح اليوم السادس، حان وقت اختبار النار.\u003c/p>\u003cp>استيقظت شين يان قبله، وخرجت إلى خلف الحظيرة، وسمعها تتقيأ بهدوء، بصوت من اعتاد أن يخفي صوته. حين عادت كان وجهها شاحباً قليلاً، وعيناها صافيتين.\u003c/p>\u003cp>«بخير؟»\u003c/p>\u003cp>«إنه الصباح فقط.» مسحت فمها بكمها. «يزول بعد أن آكل.»\u003c/p>\u003cp>«تحتاجين إلى...»\u003c/p>\u003cp>«أحتاج إلى أن نبدأ.» ثم، بصوت أخف: «لا تنظر إلي هكذا. سأقول لك إن كان الأمر أسوأ.»\u003c/p>\u003cp>صدقها، لأنها لم تكذب عليه قط في أمر كهذا، وهذا ما جعل كذبته هو عليها أثقل.\u003c/p>\u003cp>وقفت هو سانيانغ أمام الموقد الجديد وذراعاها مطويتان، لم تنم جيداً، وعند طرف كمها بقعة طين من عمل الأمس. قالت: «إن لم أره يعمل قبل الظهر، فلن أنتظر.»\u003c/p>\u003cp>قالت شين يان: «ليس قبل الظهر.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«لا نشعل نار الطبخ الآن.» أشارت بالقلم إلى الجدار الأحمر الداكن. «الطين ما زال فيه ماء. إذا وضعنا عليه نار القدر دفعة واحدة، فسيخرج الماء كله بسرعة، وقد يتشقق.»\u003c/p>\u003cp>«تتحدثين كأنك بنيتِ مواقد من قبل.»\u003c/p>\u003cp>«أتحدث كأنني فكرت في ما يحدث للطين حين يسخن.» لم ترفع نبرتها. «نار صغيرة أولاً. حفنة من القش وقطعتان من الحطب الرفيع. ننتظر ساعة، ثم نزيد قليلاً، ثم ننتظر.»\u003c/p>\u003cp>نظرت هو سانيانغ إلى لين لا إليها، تبحث عن تأكيد.\u003c/p>\u003cp>قال: «هي محقة.»\u003c/p>\u003cp>نظر إلى البطانة الرطبة. كان يستطيع أن يؤيدها في التجفيف، لكن ذلك لن يغير الخلطة التي أخفى عنها شكه فيها.\u003c/p>\u003cp>قالت هو سانيانغ: «إلى الظهر أطعم الناس من موقد الغرفة الكبيرة. بعده أحتاج إلى هذا القدر.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أشعلها لين بنفسه.\u003c/p>\u003cp>جثا أمام فم الموقد، وفي يده شعلة من قش مجدول، ووضعها في غرفة الاحتراق على فرش من قشور البصل اليابسة والأغصان الدقيقة. التهم اللهب القش بصوت ناعم، ثم تسلق الأغصان. وانتظر لين أن يرتد الدخان إلى وجهه كما حدث دائماً مع الموقد القديم.\u003c/p>\u003cp>لم يرتد.\u003c/p>\u003cp>صعد الدخان في خيط رفيع إلى المدخنة واختفى فيها. لا غيمة تتجمع تحت السقف، ولا سعال، ولا لسع في العينين. مجرد همس خفيف، النار تتنفس من الفتحة السفلية وتتمدد ببطء بلون ذهبي هادئ.\u003c/p>\u003cp>سمع شياو دو يقول بصوت خفيض: «العمة. العمة، لا دخان.»\u003c/p>\u003cp>«أرى.»\u003c/p>\u003cp>قال لين: «زِد الحطب يا شياو دو. قطعتين رفيعتين.»\u003c/p>\u003cp>«أنا؟»\u003c/p>\u003cp>«أنت.»\u003c/p>\u003cp>أضاف الصبي قطعتين، ثم ثالثة من تلقاء نفسه، فمدت شين يان يدها ومنعته بلا كلمة. أعاد الحطبة إلى الأرض كمن أمسكوه متلبساً.\u003c/p>\u003cp>كانت شين يان تلمس الجدار براحة يدها كل ربع ساعة، من اليسار إلى اليمين، وتقف عند كل بقعة ثم تكتب في الدفتر رمزاً. دافئ. دافئ جداً. بارد قرب الزاوية. ولاحظ لين أن الطين يتصبب على سطحه قطرات صغيرة لامعة، تتجمع ثم تنزلق، تبلل المواضع التي جفت من الخارج.\u003c/p>\u003cp>قال: «هذا طبيعي. الماء يخرج.»\u003c/p>\u003cp>«أعرف.» لم تلتفت. «لكنه يخرج من هذه الجهة أسرع منها. انظر.» أشارت إلى جانب الغرفة الأيمن حيث الطين أغمق لوناً. «هنا أكثر ماءً. ربما لأن شياو دو ضغط الطبقة هنا أقل.»\u003c/p>\u003cp>«أنا لم أضغط أقل!» قال الصبي من خلفهما.\u003c/p>\u003cp>«إذن لأنه أسمك.» كتبت شيئاً. «سنرى.»\u003c/p>\u003cp>مرر لين ظهر كفه على الموضعين، فوجد الفرق واضحاً. كتب في الدفتر أن سماكة هذا الجانب تحتاج إلى مراجعة، ثم أبعد الحطب الغليظ عن يد شياو دو.\u003c/p>\u003cp>مرت ساعة. تجمع في الباب أناس من القرية يتظاهرون أنهم يمرون: زوجة الجزار، ورجل يحمل حبلاً لا يحتاجه، وطفلان حافيان يتدافعان. كانوا يمدون أعناقهم نحو الجدار الأحمر، ولا يقترب منه أحد. وكانت هو سانيانغ تطردهم بنظرة، فيبتعدون خطوتين ثم يعودون.\u003c/p>\u003cp>عند الظهيرة جاءت امرأة من القرية. وقفت عند باب المطبخ تعصر طرف كمها بيديها، ولم تنظر إلى لين، بل إلى هو سانيانغ.\u003c/p>\u003cp>«يا ست هو. سمعت أن مدخنتك...»\u003c/p>\u003cp>«مدخنتي بخير.»\u003c/p>\u003cp>«بيتي يدخن مثل بيتك. أولادي يسعلون طوال الليل. لو أن الرجل...» أشارت بذقنها نحو لين من دون أن تنظر إليه. «يأتي ويرى. لا أملك نحاساً، لكن عندي دجاجتان.»\u003c/p>\u003cp>نظر لين إلى هو سانيانغ. هذه المرة لم يطلب أحد رأيه، وكان يعرف أن السؤال ليس له.\u003c/p>\u003cp>قالت هو سانيانغ: «ليس قبل أن يعمل الموقد ثلاثة أيام. وليس قبل أن يمر الكاتب.» ثم خففت صوتها قليلاً: «سأرسل لك شياو دو حين يحين الوقت. لا تعطي أحداً دجاجتيك قبل ذلك.»\u003c/p>\u003cp>مضت المرأة وهي تشكر بصوت منخفض، وبقيت هو سانيانغ تنظر إلى مكانها.\u003c/p>\u003cp>قالت: «الآن صارت كل القرية تعرف. وإن فشل، فسأكون أنا التي...» لم تكمل الجملة.\u003c/p>\u003cp>ثم وضع شياو دو القدر على النار، فيه ماء من البئر. وحين رفع الغطاء بعد وقت أقصر مما توقع الجميع، كان الماء يغلي بفقاعات كبيرة بطيئة.\u003c/p>\u003cp>قالت هو سانيانغ شيئاً تحت أنفاسها. أخذت من الرف كتاب حساباتها، وفتحته على صفحة جديدة، ثم مدت يدها إلى قطعة الفحم التي تكتب بها وخطت أول رقم.\u003c/p>\u003cp>تتبعت شين يان القلم بعينيها.\u003c/p>\u003cp>قالت هو سانيانغ دون أن تنظر إلى أحد: «سأعد السلال بنفسي. أنا لا أثق إلا بعدي.»\u003c/p>\u003cp>عدّت طوال النهار. وعدّت شين يان في دفترها. كانت المرأتان تعدّان في صمت متواز، كل واحدة تنظر إلى ما تكتبه الأخرى بطرف عينها وتتظاهر أنها لا تفعل.\u003c/p>\u003cp>بعد الظهر جاء لاو ما، وفي يده لفافة، وخلفه رجلان يحملان صندوقاً. أفسح له شياو دو مكاناً عند الطاولة، وأبعد عن قدميه سلة الحطب التي لم تُستعمل بعد.\u003c/p>\u003cp>جاء يحاسب هو سانيانغ على مبيت القافلة، وجلس ليدفع أمامها، وعدّ القطع النحاسية على الطاولة قطعة بعد قطعة بأصابعه الغليظة. كان المطبخ دافئاً على غير عادته. دافئ بلا دخان.\u003c/p>\u003cp>توقف في منتصف العد.\u003c/p>\u003cp>نظر حوله. وأحنى رأسه قليلاً، كأنه يسمع شيئاً.\u003c/p>\u003cp>قال: «لا يسعل أحد.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«ولا في الغرفة الكبيرة. منذ ثلاث ليال لم أسمع أحداً من رجالي يسعل. في السنة الماضية كان أحدهم يخرج إلى الساحة ويبصق من شدة الدخان.»\u003c/p>\u003cp>«ذاك بعد إصلاح المدخنة. الموقد الجديد أشعلناه هذا الصباح فقط. موقد الغرفة الكبيرة ما زال ينتظر دوره.»\u003c/p>\u003cp>قام عن الطاولة. تقدم نحو الموقد ببطء، ويده الضخمة مبسوطة، ثم وضعها على جدار الموقد من الخارج، جنب الطين الأحمر.\u003c/p>\u003cp>وقف هكذا لحظة. لم يتحرك أحد.\u003c/p>\u003cp>قال: «هذا لا يسرق الحرارة.»\u003c/p>\u003cp>أبقى يده على الجدار لحظة، ثم نظر إلى الحطب الباقي في السلة. قال: «رجالي حملوا إلى هنا أكثر من هذا أمس، والقدر نفسه يغلي. أهذه كل نار اليوم؟»\u003c/p>\u003cp>قالت هو سانيانغ: «إلى الآن. ولم أنته من العد.»\u003c/p>\u003cp>سحب يده، وقد تركت أصابعه أثراً باهتاً على الطين.\u003c/p>\u003cp>التفت لاو ما إليه.\u003c/p>\u003cp>«لم أنس الملح.»\u003c/p>\u003cp>«ولا أنا.»\u003c/p>\u003cp>«في الربيع.» لم يضف شيئاً. ضرب جدار الموقد ضربة خفيفة، كمن يربّت على حصان، وعاد إلى عدّ نحاسه.\u003c/p>\u003cp>راقبه لين يعود إلى نحاسه. ما زال عرض محطة الملح قائماً، على الأقل في كلام الرجل. سيذكره له حين يأتي الربيع، إن بقي هو وشين يان هنا حتى ذلك الوقت.\u003c/p>\u003cp>عند المساء انتهت هو سانيانغ من العد. قارنت عدد السلال بما كتبته عن الموقد القديم، ثم أغلقت الكتاب.\u003c/p>\u003cp>«أقل.»\u003c/p>\u003cp>سأل لين: «كم أقل؟»\u003c/p>\u003cp>«هذا يوم واحد. اسألني حين يكون عندي حساب أثق به.»\u003c/p>\u003cp>أعادت الحطب الباقي إلى المخزن بيديها، ولم تسمح لشياو دو أن يخلطه بحطب الغد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد العشاء، أخرجت هو سانيانغ كتابها الأصفر المخيط بخيط القنب، ووضعته على طاولة المطبخ، وأشارت لشين يان بذقنها.\u003c/p>\u003cp>«اجلسي.»\u003c/p>\u003cp>جلست شين يان على الكرسي المقابل، وجلس لين على الأرض قرب الموقد. لم يقل أحد إن عليه أن يبتعد.\u003c/p>\u003cp>«الدرس الأول.» أخذت هو سانيانغ القلم الفحمي وفتحت صفحة بيضاء، وخطت علامة ثقيلة، ثم ثانية، ثم ثالثة، متلاصقة، فيها شيء من النقش الذي رآه لين على حجر الطريق في اليوم الأول. «هذه الكلمة.»\u003c/p>\u003cp>«ماذا تقول؟»\u003c/p>\u003cp>«ليست كلمة تبدأ بها المدارس. لكنها أول ما تحتاجين إليه.»\u003c/p>\u003cp>تأملت شين يان العلامات. وبإصبعها، دون أن تلمس الورق، تتبعت الخطوط في الهواء مرة، ثم مرتين.\u003c/p>\u003cp>«ما هي؟»\u003c/p>\u003cp>قالت هو سانيانغ: «دَين.»\u003c/p>\u003cp>سكتت شين يان لحظة. ثم قالت بجدية: «من أين أبدأ بكتابتها؟»\u003c/p>\u003cp>ضحكت هو سانيانغ ضحكة قصيرة خشنة، وهي أول مرة يسمعها لين تضحك فيها حقاً. «من هنا. من الأعلى إلى الأسفل. أول خط أفقي، ثم الباقي.»\u003c/p>\u003cp>حاولت شين يان فخرجت الخطوط متزاحمة، يصعب تمييز أولها من آخرها. مسحتها هو سانيانغ بإبهامها: «مرة أخرى.» فكتبت شين يان مرة أخرى، وأخرى.\u003c/p>\u003cp>لاحظ لين أنها لا تنظر إلى العلامة نفسها، بل إلى يد هو سانيانغ وهي ترسمها، كيف ينحني الخط وكيف يرتفع. كانت تتعلم الحركة قبل المعنى، كما تتعلم لحاماً جديداً.\u003c/p>\u003cp>في المحاولة السابعة استطاعت شين يان أن تقرأ ما كتبته من غير أن تقارنه بالأصل.\u003c/p>\u003cp>قالت هو سانيانغ: «مقبولة.» ثم كتبت أخرى. «هذه: فائدة. وهذه: رهن. وهذه: كفيل.»\u003c/p>\u003cp>«لماذا تعلّمينني الديون أولاً؟»\u003c/p>\u003cp>رفعت هو سانيانغ رأسها.\u003c/p>\u003cp>«لأنها أول ما سيُكتب عنك.»\u003c/p>\u003cp>ولم يقل أحد شيئاً بعد ذلك زمناً طويلاً، إلا صوت الفحم على الورق ونار الموقد الجديد تتنفس خلفهم.\u003c/p>\u003cp>حين انتهى الدرس، لم تنهض هو سانيانغ فوراً. نظرت إلى لين، ثم إلى الجدار.\u003c/p>\u003cp>«الطين جيد.»\u003c/p>\u003cp>شعر لين بشيء يضغط على صدره. «الطين...»\u003c/p>\u003cp>«يعمل. هذا ما أقوله.» ثم أخذت كتابها ومضت.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في المخزن، حين انطفأت الشمعة، قالت شين يان بلغتهما: «كتبت الكلمة سبع مرات.»\u003c/p>\u003cp>«رأيتك.»\u003c/p>\u003cp>«في المرة الأولى لم أعرف أين ينتهي الخط. وفي السابعة عرفتها من دون أن أنظر إلى كتابها.» سمع في صوتها رضا مختلطاً بشيء آخر. «لكنني لا أعرف ما تقوله العلامات الأخرى حولها. كل علامة أعرفها الآن تجعلني أرى عشر علامات لا أعرفها.»\u003c/p>\u003cp>«هذا يحدث في كل علم.»\u003c/p>\u003cp>«لكن الخطأ هنا سيكلفنا مالاً.» ثم ضحكت بخفوت. «غداً أتعلم الأرقام. لا أريد أن أوقع على حساب لا أقرؤه.»\u003c/p>\u003cp>لم يجد ما يقوله. فمد يده في الظلام وأعاد السترة على كتفها.\u003c/p>\u003cp>قالت: «لين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«الموقد. هل سيصمد؟»\u003c/p>\u003cp>ارتفع شيء في صدره، ثم عاد وهبط.\u003c/p>\u003cp>قال: «لا أعرف. نحن نراقب الجدار، والجدار يقول إنه يعمل.»\u003c/p>\u003cp>«لم أسألك ماذا يقول الجدار.» كان صوتها هادئاً، بلا اتهام. «سألتك هل سيصمد.»\u003c/p>\u003cp>«أعتقد ذلك.»\u003c/p>\u003cp>«تعتقد.»\u003c/p>\u003cp>«أعتقد.»\u003c/p>\u003cp>لم تقل شيئاً بعد ذلك. لكن أنفاسها بقيت متيقظة وقتاً أطول مما ينبغي لمن يوشك على النوم، ثم هدأت.\u003c/p>\u003cp>نامت أخيراً، ويدها على بطنها، والدفتر بجانب رأسها مفتوحاً على الكلمة المكتوبة سبع مرات.\u003c/p>\u003cp>ولم ينم لين. جلس في الظلام يفكر في الرقم في زاوية عينه.\u003c/p>\u003cp>ثمانية وخمسون.\u003c/p>\u003cp>مضى النهار بأكمله دون مشكلة. الموقد يعمل، ولاو ما يشهد، وهو سانيانغ تكتب أرقاماً أقل. تمنى لو انتهى الاختبار عند ذلك. لكنه يعرف أن البطانة ستبرد بعدما سخنت، وقد تتشقق عندئذ. نجحت النار الأولى؛ هذا كل ما يستطيع الجزم به. وكان عليه أن يقول لها ذلك قبل أن تنام.\u003c/p>\u003cp>فكر في النحاسات. إن انهار الموقد، فهناك ثمن الطين الذي استُهلك، والحطب الذي احترق في الاختبار، وعمل شياو دو اليومين، وصبر امرأة لا تمنح الصبر مجاناً. جمع الأرقام في رأسه بسرعة معتادة، فاكتشف أنه لا يعرف أي رقم منها بالنحاس. ما يعرفه فقط أن هذا الرقم، أياً كان، سيُكتب في كتاب أصفر، بخط
