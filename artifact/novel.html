div>مجال العمل: الطاقة والحرارة والتحكم.\u003c/div>\u003cdiv>طاقة التكامل: 100%\u003c/div>\u003cdiv>تحليل القياس: محدود.\u003c/div>\u003cdiv>الثقة: 51%\u003c/div>\u003c/div>\u003cp>لم يتحرك الهواء. لم يتبدل صوت الورشة. كانت شين يان وحدها ترى الكلمات. لم تسمع صوتاً يشرحها، ولم تظهر لها صورة للناس أو للغد أو للمكان الذي لا تراه. لم تتغير يدها، ولم تجد فيها قوة جديدة.\u003c/p>\u003cp>أغلقت عينيها. اختفت الواجهة. فتحتهما فعادت. حاولت أن تلمس طرفها، لكن إصبعها مر في الهواء. بقيت الكلمات في مكانها، ولم تتبدل حين حركت رأسها.\u003c/p>\u003cp>استدارت نحو لين. كان ينظر إلى الدفتر، ويحسب عدد الأكياس التي فقدوها إن توقف الحجر ساعة. لم تظهر له الواجهة. ولم تعرف إن كانت تستطيع أن تخبره بما فيها، لكن الاتفاق بينهما كان واضحاً: كل رقم يراه، تعرفه. أما ما تراه هي، فلم يتفقا عليه بعد.\u003c/p>\u003cp>تركت السؤال حتى لا تنفلت منها الكلمات. ثم مشيت إلى موضع أكثر هدوءاً خلف مخزن الخشب، حيث لا يسمع تشانغ الحديث. تبعها لين بعد أن لاحظ أنها نادته بإشارة قصيرة.\u003c/p>\u003cp>قال: «ما الأمر؟»\u003c/p>\u003cp>أشارت إلى عينيها، ثم قالت بلغتهما الأصلية، كي لا يسمع أحد: «ظهر أمامي شيء. واجهة. لا أظنها انعكاساً.»\u003c/p>\u003cp>لم يقترب منها، ولم يلمسها. «هل قرأتِها؟»\u003c/p>\u003cp>«رأيت عنواناً: النصف الثاني، التكامل واحد بالمئة. ثم كلمات عن الطاقة والحرارة والتحكم، وطاقة تكامل كاملة، وتحليل قياس محدود. والثقة واحد وخمسون بالمئة.»\u003c/p>\u003cp>بقي لين صامتاً. نظر إلى يدها، ثم إلى وجهها. «أنت متأكدة أنها لم تكن واجهتي؟»\u003c/p>\u003cp>«أنت لم تكن تحمل الهاتف حين ظهرت.»\u003c/p>\u003cp>«هل بقيت بعد أن أغمضت عينيك؟»\u003c/p>\u003cp>«اختفت، ثم عادت حين فتحتها.»\u003c/p>\u003cp>لم يسألها إن كانت خائفة. كان يرى أنها تقف بثبات، وأن أصابعها تمسك طرف كمها بقوة. قال: «هل تريدين أن نعود؟»\u003c/p>\u003cp>«نعم. لكن لا تخبر تشانغ الآن. لم ننهِ فحص الوصلة.»\u003c/p>\u003cp>«لن أخبره قبل أن تقرري.»\u003c/p>\u003cp>قالت: «سأخبرك بكل ما يظهر. لكن لا تظن أنني فهمت كل شيء.»\u003c/p>\u003cp>«لن أظن.»\u003c/p>\u003cp>سكت لحظة، ثم قال بلغتهما: «إذا عادت، اقرئي لي السطر الأول كله.»\u003c/p>\u003cp>نظرت شين يان إلى الواجهة التي لم تعد تراها. «سأفعل.»\u003c/p>\u003cp>عادا إلى الورشة. لم تتوقف التجربة عند الواجهة؛ بقي الحامل يحتاج إلى دعامة، وبقي الماء خلف البوابة. لكن شين يان صارت تعرف أن هناك نصاً يخصها وحدها، وأنه بدأ في اللحظة التي استخدم فيها الماء لدفع الهواء إلى عملهم. لم يكن لها جواب عن سببه، ولا عن مدى ما يستطيع فعله.\u003c/p>\u003cp>قال تشانغ من عند الطاولة: «هل انتهيتما؟ أريد أن أرى التثبيت بعد الإصلاح.»\u003c/p>\u003cp>قالت شين يان: «سنصلحه أولاً، ثم نختبره. ليس اليوم.»\u003c/p>\u003cp>«لماذا؟»\u003c/p>\u003cp>«لأن الماء اهتز عند الدفعة الخامسة، ولأننا نحتاج إلى دعامة.»\u003c/p>\u003cp>أومأ تشانغ. «جيد. حين تثبت الوصلة، نختبر ناراً حقيقية.»\u003c/p>\u003cp>لم يظهر على وجه شين يان شيء. كان القرار عملياً، مؤجلاً إلى اختبار آخر. لكنها حين نظرت إلى طرف مجالها، رأت كلمات الواجهة مرة أخرى، ثابتة خلف العين، لا يراها أحد سواها.\u003c/p>\u003cp>قالت: «اقرأ لي السطر الأول. كله.»\u003c/p>"},{"n":44,"t":"الفصل الرابع والأربعون: نافذتان","b":"\u003cp>في اليوم نفسه، بعد أن انتهت تجربة الماء، لم يعد لين وشين يان إلى الطاحونة. مشيا من الورشة حتى مخزن الحطب، ثم تابعا بمحاذاة الجدار إلى الممر الضيق خلف النزل. لم يكن المكان بعيداً، لكنه حجب عنهما أصوات تشانغ وشياو دو، وأعطاهما ما يكفي من الخصوصية ليتكلما بلغتهما الأصلية.\u003c/p>\u003cp>لم يفتح لين واجهته أولاً. جلس على صندوق فارغ وأخرج دفتره، بينما بقيت شين يان واقفة. أرادت أن تروي ما رأته بالترتيب، من غير أن يملأ لها الفراغات.\u003c/p>\u003cp>قالت: «حين تحرك الماء، رأيت ضوءاً أزرق عند طرف بصري. ظننته انعكاساً. ثم ظهر أمامي لوح مكتوب.»\u003c/p>\u003cp>«هل كان واضحاً؟»\u003c/p>\u003cp>«بعضه.»\u003c/p>\u003cp>«والباقي؟»\u003c/p>\u003cp>«لم أقرأه كله.»\u003c/p>\u003cp>«ماذا قرأتِ؟»\u003c/p>\u003cp>أجابت ببطء، وهي ترفع إصبعاً مع كل سطر: «النصف الثاني، التكامل واحد بالمئة. مجال العمل: الطاقة والحرارة والتحكم. طاقة التكامل مئة بالمئة. تحليل القياس محدود. الثقة واحد وخمسون بالمئة.»\u003c/p>\u003cp>كتب لين الكلمات كما قالتها، ثم أعاد قراءتها عليها. صححت له موضع كلمة «محدود»؛ كانت تحت عنوان التحليل لا عنوان الطاقة. نقلها إلى مكانها.\u003c/p>\u003cp>قالت: «لا أعرف لماذا ظهر الآن.»\u003c/p>\u003cp>«ولا أنا. لا أريد أن أخمن.»\u003c/p>\u003cp>«أنت تظن أن للماء علاقة.»\u003c/p>\u003cp>«ظهر حين حرك الماء المنفاخ. لكن هذا ترتيب في الوقت، لا دليل على السبب.»\u003c/p>\u003cp>أومأت. «جيد. اكتب ذلك.»\u003c/p>\u003cp>كتب: «ظهرت الواجهة عند تشغيل الماء للمنفاخ. العلاقة غير مؤكدة.» ثم أضاف: «لا معلومات عن أصلها.»\u003c/p>\u003cp>قالت: «أنت رأيت واجهتك منذ البداية. كيف تظهر لك؟»\u003c/p>\u003cp>شرح لها شكل الكلمات، وطريقة اختفائها وعودتها. لم يرها في الهواء كما رأت هي. تظهر له حين يريد فتحها، ويستطيع إغلاقها. كانت هي تحاول أن تعرف إن كان عليها أن تبحث عنها بالطريقة نفسها. أغمضت عينيها، وركزت على وصفها. عاد اللوح الأزرق أمامها. هذه المرة لم يظهر الضوء أولاً؛ ظهرت الكتابة مباشرة.\u003c/p>\u003cp>قالت: «عاد.»\u003c/p>\u003cp>لم يرفع لين رأسه. «أترينه الآن؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«هل تستطيعين إخفاءه؟»\u003c/p>\u003cp>رمشت، واختفى. فتحته مرة أخرى، ثم أغلقته. «أستطيع.»\u003c/p>\u003cp>«هل يتغير حين تبتعدين عن الورشة؟»\u003c/p>\u003cp>«لا أعرف.»\u003c/p>\u003cp>«لا نختبره الآن. اكتبي ما يظهر لك.»\u003c/p>\u003cp>أخرجت شين يان دفترها الصغير، ونسخت الكلمات كما رأتها. كتبت العنوان بحروف واضحة، ثم وضعت تحتها خطوطاً فاصلة بين مجال الطاقة والحرارة والتحكم وبين التحليل المحدود. لم تكتب تفسيراً.\u003c/p>\u003cp>سألها لين: «هل ظهر مؤشر الحضارة؟»\u003c/p>\u003cp>«لا أتذكر. لم أره.»\u003c/p>\u003cp>فتح هو واجهته، ووصف لها ما فيها. لم يظهر لها لوحه، ولم يظهر له لوحها. حين ذكر رقم التكامل في واجهته، لم يتغير ما تراه. قالت له: «إذن واجهتاك منفصلتان.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«لكن هناك شيء مشترك؟»\u003c/p>\u003cp>«مؤشر الحضارة.»\u003c/p>\u003cp>تردد قبل أن يقرأ الرقم لها. لم يكن التردد خوفاً من أن تخالفه؛ بل من أن يخلط بين ما يظهر في واجهته وما يستنتجه. أمال الدفتر نحوه وقال: «سأقرأه كما هو.»\u003c/p>\u003cp>لم يرَ وجهها يتبدل عند الرقم. ظهر مؤشر الحضارة مشتركاً في وصفه، لكنه لم يكن شريطاً مرئياً لها. قرأ لها رصيده بعد تحليل المسمار، وكان تسعاً وخمسين بالمئة. ثم توقف عند سطر الطاقة في واجهتها.\u003c/p>\u003cp>قال: «حين سألتِ عن حرارة الطين، ظننت أن رصيدي سينخفض.»\u003c/p>\u003cp>«لم تستعمل واجهتك.»\u003c/p>\u003cp>«لكننا لا نعرف إن كانت نافذتك تخصم من طاقة واحدة مشتركة.»\u003c/p>\u003cp>فتحت شين يان الواجهة. كان رصيدها الآن مئة بالمئة. قالت: «كان مئة حين ظهرت أول مرة.»\u003c/p>\u003cp>«إذن السؤال لم يخصم شيئاً.»\u003c/p>\u003cp>«أو أن الواجهة لم تحدث الرصيد بعد.»\u003c/p>\u003cp>«ورصيدي تسع وخمسون، كما كان بعد تحليل المسمار.»\u003c/p>\u003cp>أعاد فتح واجهته وتحقق، ثم وصف الرقم كما ظهر. لم يتغير. بقيت واجهتها على مئة، وبقي رصيده على تسع وخمسين. لم يكن ذلك برهاناً كاملاً؛ لكنه لم يدعم ظنه بأن استعمالها يأخذ من طاقته.\u003c/p>\u003cp>قالت: «ظننت أن نافذتك ونافذتي تتقاسمان الرصيد نفسه.»\u003c/p>\u003cp>«والآن؟»\u003c/p>\u003cp>«الآن أعرف أن تجربة اليوم لم تخصم من رصيدك. وأعرف أن رصيدي لم يتغير بعد سؤالي. لا أستطيع أن أقول أكثر من ذلك.»\u003c/p>\u003cp>«لن نقوم بتحليل آخر لمجرد إكمال الدليل.»\u003c/p>\u003cp>كتبت في دفترها: «رصيد لين بعد تحليله: 59%. رصيد شين يان بعد القياس: 100%. لا يظهر خصم مشترك في هذه التجربة؛ استقلال الرصيدين احتمال، لا حكم نهائي.»\u003c/p>\u003cp>قال لين: «نراقب ما يحدث في الأيام المقبلة. لا نجرب استهلاك طاقة لا نحتاج إليه.»\u003c/p>\u003cp>«هذا ما نعرفه. لا أكثر.»\u003c/p>\u003cp>عادا إلى الورشة، لكنهما لم يدخلا. أخذا طريقاً إلى الغرفة الجانبية التي تحوي عينات الطين والرماد. لم يكن هدفهما ناراً حقيقية؛ أرادا اختباراً صغيراً للقياس الذي يظهر في واجهة شين يان. وضعت أمامها قطعة طين جافة، وعينة رماد، وقطعة حديد صغيرة. لم تسمح للين بأن يشعل الموقد. اختارت جمرة بقيت من نار المطبخ، ثم طلبت من شياو دو أن يضعها في وعاء فخاري بعيد عن الألواح الخشبية. رفضت أن يستخدموا القطعة الحديدية.\u003c/p>\u003cp>قالت: «نقيس حرارة الطين بتغير لونه فقط. لا نضع اليد فوق النار، ولا نستعمل هذه النتيجة لتحديد حرارة الفرن.»\u003c/p>\u003cp>قال لين: «الواجهة ذكرت قياساً محدوداً. هل تستطيعين طلب قيمة؟»\u003c/p>\u003cp>«لا أعرف إن كان ذلك أمراً أو مجرد سطر.»\u003c/p>\u003cp>«جربي.»\u003c/p>\u003cp>ركزت على الواجهة، وسألتها عن حرارة الجمرة. لم يظهر جواب فوري. ظهر سطر واحد، ثم تلاه آخر.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[قياس حراري — تقدير أولي]\u003c/strong>\u003c/div>\u003cdiv>العينة: سطح الطين قرب جمرة صغيرة.\u003c/div>\u003cdiv>المدى التقريبي: دافئ إلى ساخن.\u003c/div>\u003cdiv>الثقة: 38%\u003c/div>\u003cdiv>طاقة التكامل: 96%\u003c/div>\u003c/div>\u003cp>لم يكن في الرسالة رقم درجات، ولم يظهر كيف وصل النظام إلى التقدير. لم تعرف شين يان إن كانت الطاقة قد نقصت أربعة بالمئة بسبب السؤال، أم لأن الواجهة استهلكت شيئاً لتعمل. لم تقل إنه يقين.\u003c/p>\u003cp>قال لين: «هذا ليس رقماً مفيداً.»\u003c/p>\u003cp>قالت: «يعطيني حدّاً عاماً. لكن الثقة منخفضة.»\u003c/p>\u003cp>«هل جربتِ على الطين أم على الجمرة؟»\u003c/p>\u003cp>«طلبت حرارة سطح الطين. سأقارنها بأثرها بعد أن نبعدها.»\u003c/p>\u003cp>لمست شين يان طرف الوعاء بظهر ملعقة خشبية، لا بيدها. كان دافئاً. لم تستعمل حرارة يدها مقياساً. طلبت من شياو دو أن يضع الطين على سطح مستو، ثم أزاحت الجمرة. بعد دقائق، صار لون موضعها أغمق قليلاً، لكن الرطوبة القديمة في الطين جعلت الأثر غير واضح.\u003c/p>\u003cp>قال شياو دو: «إذن كان ساخناً؟»\u003c/p>\u003cp>«كان أدفأ من بقية السطح، ثم برد.»\u003c/p>\u003cp>«والواجهة قالت هذا؟»\u003c/p>\u003cp>«قالت دافئ إلى ساخن. لم تعطنا رقماً.»\u003c/p>\u003cp>قال لين: «قد يكون هذا تقديراً، لكنه لا يكفي لضبط نار الفرن.»\u003c/p>\u003cp>«ولا نضبطه به. نستخدم عين تشانغ وخبرته، ونراقب الطين والحديد.»\u003c/p>\u003cp>لم تأخذ شين يان كلام لين على أنه رفض للقياس. أزاحت الوعاء، وانتظرت حتى يبرد سطح الطين، ثم وضعت قطعتين صغيرتين من الطين على مسافتين مختلفتين من الجمرة. جعلت إحداهما أقرب إلى الحافة، والأخرى أبعد، وطلبت من شياو دو أن يبدل موضعهما من غير أن يخبرها أيهما قرب النار.\u003c/p>\u003cp>قال لين: «ما الفائدة؟»\u003c/p>\u003cp>«أريد أن أعرف إن كان الوصف يميز بينهما.»\u003c/p>\u003cp>«حتى لو قال إن الأولى أسخن، لا نعرف مقدار الفرق.»\u003c/p>\u003cp>«صحيح. لكن إذا قال الشيء نفسه للاثنتين، نعرف أن هذا القياس أضعف مما نحتاج.»\u003c/p>\u003cp>لم يكن اختباراً دقيقاً. كانت قطعتا الطين مختلفتين قليلاً في الرطوبة، والجمرة نفسها تتغير مع الهواء. لم تستعمل شين يان الواجهة هذه المرة؛ طلبت من لين أن يلمس كل قطعة بظهر ملعقة بعد أن يبعدها شياو دو عن النار، ثم سجلا أيهما بقي دافئاً مدة أطول. لم يكن ذلك يقيس حرارة دقيقة، لكنه قدم مقارنة يمكن رؤيتها.\u003c/p>\u003cp>قال شياو دو: «هذه بقيت دافئة. رأيت الدخان يمر من فوقها.»\u003c/p>\u003cp>قالت شين يان: «هذا دليل على موضعها، لا على حرارة النار كلها.»\u003c/p>\u003cp>قال لين: «وإذا أردنا أن نضبط الهواء، نحتاج إلى معرفة أثر موضع القطعة أيضاً.»\u003c/p>\u003cp>«نعم. الواجهة لا تعرف ما لم نخبرها به عن العينة والمكان.»\u003c/p>\u003cp>كان هذا أول حد عملي يضعانه حول ما تستطيع نافذتها قوله. لم تحول اللون إلى رقم، ولم تكشف داخل قطعة الحديد، ولم تخبرهما أيهما صالح للطرق. أمكنها أن تعطي وصفاً عاماً لموضع محدد، مع ثقة ضعيفة. الباقي بقي في يد الحرفي الذي يعرف سلوك النار والحديد.\u003c/p>\u003cp>أعادت شين يان القطعتين إلى جانب وعاء الطين، ثم كتبت بجوار نتيجة الواجهة: «لا تستخدم لضبط الفرن. يلزم مقارنة مرئية، والنتيجة مرتبطة بموضع العينة.» لم تضعها في صفحة المنجزات، بل في صفحة الحدود.\u003c/p>\u003cp>أغلق شياو دو الباب عن تيار الهواء. كان يظن أن القياس يمكن أن يتحول إلى جواب نهائي، لكنه اكتشف أن وراء السطر حدوداً. سأل إن كان يستطيع رؤية الواجهة. قالت شين يان إنه لا يستطيع، مثلما لا يرى لين نافذتها. لم يلحّ.\u003c/p>\u003cp>قالت: «سجل أن الثقة ثمانية وثلاثون بالمئة. والنتيجة وصف عام، لا درجة.»\u003c/p>\u003cp>كتب لين ذلك في دفتره، ثم توقف. «هل تعرفين إن كان مؤشر الحضارة مشتركاً حقاً؟»\u003c/p>\u003cp>قالت: «أنت رأيته في واجهتك، وأنا لا أراه في واجهتي. قد يكون مشتركاً في النظام، لا في العرض.»\u003c/p>\u003cp>«إذا ظهر لك رقم له، أخبريني.»\u003c/p>\u003cp>«إذا ظهر لك رقم له، لا تستخدمه من دون أن تخبرني.»\u003c/p>\u003cp>أغلق لين الدفتر لحظة. «اتفقنا. لا أستعمل المؤشر المشترك سراً. ولا تستعملينه أنت.»\u003c/p>\u003cp>«ولا نصرف الطاقة على تجربة لم نتفق عليها.»\u003c/p>\u003cp>«إذا كان في الأمر خطر، القرار لمن يوقف العمل.»\u003c/p>\u003cp>قالت: «أنا أوقف الماء إذا اهتز التثبيت. أنت توقف التحليل إذا نقصت طاقتك. لا يحتاج أحدنا إلى إذن من الآخر ليوقف خطراً.»\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>لم يكن اتفاقاً على كل شيء. لم يعرفا هل تتجدد طاقتها ليلاً، أو ما الذي تستهلكه، أو إن كانت الواجهة تتعلم. ولم يكن عندهما سبب لتجربة أخرى. حفظا النسختين في دفترين منفصلين، ثم كتب لين في دفتره عنواناً: «معلومات مشتركة، لا قرارات مشتركة بعد».\u003c/p>\u003cp>بعد أن انتهيا، مشيا من الغرفة إلى الساحة. كان تشانغ قد ثبت دعامة جديدة خلف قاعدة المنفاخ. طرقها بالمطرقة ليتأكد من ثباتها، ثم أشار إلى الذراع.\u003c/p>\u003cp>قال: «صارت جاهزة للفحص. النار الحقيقية غداً، لا اليوم.»\u003c/p>\u003cp>قالت شين يان: «أريد أولاً أن نعيد الحركة بالماء ونرى إن بقيت القاعدة.»\u003c/p>\u003cp>«أربع دورات ثم توقف؟»\u003c/p>\u003cp>«خمس إذا لم تهتز.»\u003c/p>\u003cp>قال تشانغ: «جرّبوا.»\u003c/p>\u003cp>لم يفتحوا الماء. أعادوا الحركة باليد، وفحصوا القاعدة بعد كل دورة. بقيت الدعامة ثابتة. لم يعلنوا النجاح قبل أن يعيدوا التجربة عند المجرى، ولم يشعلوا النار في اليوم نفسه. كانت هذه حدود ما يعرفونه.\u003c/p>\u003cp>حين اقترب المساء، أغلقت شين يان واجهتها. لم تعرف إن كانت ستظهر لها ثانية، لكنها لم تحاول إجبارها على الظهور. وضع لين دفتره إلى جانب دفترها، وترك بينهما مسافة صغيرة، لا تخلط الكلمات ولا تفصل صاحبيها.\u003c/p>\u003cp>قالت: «نافذتان.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ولا واحدة منا ترى ما في الأخرى.»\u003c/p>\u003cp>«نصف ما عندنا على الأقل.»\u003c/p>\u003cp>«لا تقل نصفاً قبل أن تعرف ما الذي ينقص.»\u003c/p>\u003cp>ابتسم لين. «سأكتب: نوافذ منفصلة، والمعلومات المنقولة بالكلام.»\u003c/p>\u003cp>قالت: «اكتب أيضاً: لا قرار سرياً بشأن المؤشر المشترك.»\u003c/p>\u003cp>كتبها. ثم أغلق الدفتر، وسمع من بعيد صوت تشانغ يطرق دعامة المنفاخ مرة أخيرة. كان يريد تجربة نار حقيقية بعد ثبات الهواء. أما الماء، فظل عند حافة المجرى ينتظر يومه التالي.\u003c/p>\u003cp>قبل أن يخرجا من الغرفة، طلبت شين يان من لين أن يقرأ لها ما كتب في خانة المؤشر المشترك. أعاد قراءة السطر، فصححت كلمة «مرئي» إلى «موصوف». هي لم تر المؤشر، وهو لم ير واجهتها؛ لم يكن وصفه دليلاً على أنها تشارك في الرقم نفسه، لكنه كان المعلومة الوحيدة المتاحة لهما.\u003c/p>\u003cp>قالت: «إذا ظهر لك أن المؤشر تغير، لا تقول إنني رأيته.»\u003c/p>\u003cp>«لن أقول ذلك. سأكتب أنه ظهر في واجهتي.»\u003c/p>\u003cp>«وإذا قلت لك إن طاقتي تغيرت، لا تفترض أن السبب استعمالك.»\u003c/p>\u003cp>«أسألك عما فعلتِ أولاً.»\u003c/p>\u003cp>«وإذا لم أفعل شيئاً، نكتب التغير وننتظر. لا نبحث عن سبب سريع.»\u003c/p>\u003cp>أعاد لين فتح الدفتر، وكتب بجانب العنوان: «لا يساوي الاشتراك في المؤشر تطابقاً في الواجهة أو الرصيد.» لم تكن العبارة قانوناً جديداً للنظام، بل قاعدة بينهما كي لا يتحول ما لا يعرفانه إلى يقين يفرض أحدهما على الآخر.\u003c/p>\u003cp>قالت شين يان: «أريد أن أوقف العمل إذا رأيت خطراً في الماء. هذا لا ينتظر موافقتك.»\u003c/p>\u003cp>«وأنا أوقف التحليل إذا لم يعد عندي ما يكفي.»\u003c/p>\u003cp>«جيد.»\u003c/p>\u003cp>«لكن إذا كان القرار سيوقف الطحن، نتكلم بعد أن يصبح الخطر تحت السيطرة.»\u003c/p>\u003cp>«بعد أن يصبح تحت السيطرة، نعم.»\u003c/p>\u003cp>لم يكن بينهما نزاع على سلطة أحدهما. كانا يضعان حدوداً لما يحق لكل منهما إيقافه، وما يحتاج إلى حديث مشترك. أغلقت شين يان دفترها، واحتفظت بالصفحة في جيبها الداخلي. أما نسخة لين فبقيت مع سجل المواد. فصل النسختين لم يكن إخفاءً؛ كان لكل نافذة سجلها، وللأمر المشترك سطر يقرآن به بعضهما.\u003c/p>\u003cp>ثم خرجا من الغرفة وعادا إلى الساحة. بقيت دعامة المنفاخ ثابتة، وعلامة شين يان عند المسمار واضحة. لم يفتحوا الماء، ولم يشعلوا ناراً جديدة. كان تشانغ قد انتهى من الطرق، فوضع المطرقة على السندان وقال: «حين تثبت الوصلة مرة أخرى، نرى النار.»\u003c/p>\u003cp>قالت شين يان: «نرى الهواء أولاً.»\u003c/p>\u003cp>لم يعترض. كانت تلك خطوة صغيرة، لكنها غيرت طريقة الترتيب: لا نار قبل ثبات الحركة، ولا حركة مائية قبل إعادة فحص القاعدة.\u003c/p>"},{"n":45,"t":"الفصل الخامس والأربعون: نار لا تثبت","b":"\u003cp>في اليوم الحادي والأربعين بعد المئة، وبعد يومين من فحص الوصلة وإصلاح قاعدتها، عادوا إلى الورشة ومعهم قطعة حديد قصيرة لا تصلح لشيء آخر.\u003c/p>\u003cp>لم تكن النار قد اشتعلت بعد. كان تشانغ قد اختار جزءاً من قضيب مشقوق، وقطع منه شريحة صغيرة عند موضع الشوائب. قال إن خسارتها لن تفسد أي أداة، وإن ما بقي منها يمكن أن يعود إلى الخردة. كتب لين وزن القطعة قبل العمل، ثم وضعها على ميزان شين يان الخشبي.\u003c/p>\u003cp>قالت شين يان: «هذه تجربة واحدة. إذا احتجنا إلى إعادة التسخين، نوقف ونحسب قبل أن نكمل.»\u003c/p>\u003cp>قال تشانغ: «لا أطرقها حتى أرى أن الحرارة دخلت فيها.»\u003c/p>\u003cp>«وهل سنعرف ذلك من الخارج؟» سأل لين.\u003c/p>\u003cp>«لن نعرف كل ما في قلبها. لكن أعرف متى يكذب اللون.»\u003c/p>\u003cp>أبقى تشانغ القطعة على السندان، وطلب من يانغ أن يثبت المنفاخ بعيداً عن النار حتى لا تتعرض الوصلة للحرارة. مروا بالدولاب والمجرى، ولم يفتحوا الماء. كانوا سيستعملون المنفاخ باليد أولاً، ثم يختبرون الحركة بالماء في وقت لاحق، إذا ظلت النار تحتاج إلى هواء متصل. لم يكن تشغيل الطاحونة مع النار ضرورياً حتى يعرفوا كيف يتوزع اللهب.\u003c/p>\u003cp>وضعت شين يان الفحم في طبقة رقيقة، ووزنته قبل أن يضيف تشانغ القطعة. لم تملأ الموقد كله؛ تركت فراغاً على جانب الفوهة، حتى ترى مسار الهواء. نقلت بعض الفحم بعيداً عن المخرج، ثم أشارت إلى خط وسطه.\u003c/p>\u003cp>قالت: «إذا وضعناه حول الفوهة كلها، يندفع الهواء في جهة واحدة. أريد أن أرى ما يحدث حين يكون الفحم موزعاً طبقة واحدة.»\u003c/p>\u003cp>قال تشانغ: «إذا كانت الطبقة رقيقة، تبرد القطعة.»\u003c/p>\u003cp>«سنزيدها بعد أن نرى اتجاه الهواء.»\u003c/p>\u003cp>ثبتت شريطاً من القماش قرب فتحة المنفاخ. حين دفع تشانغ المقبض، مال الشريط إلى الداخل، ثم عاد. أعاد الحركة ببطء، فارتفع طرفه وتحركت ذرات الرماد. كان الهواء أقوى في منتصف الفوهة، وأضعف عند الحافة القريبة من جانب الموقد. لم يكن هذا مفاجئاً لتشانغ؛ فقد ظل يغير موضع الفحم بيده في تجارب سابقة. لكن هذه المرة سجلت شين يان اتجاه التيار.\u003c/p>\u003cp>قال لين: «نستطيع تحريك القطعة إلى الوسط.»\u003c/p>\u003cp>«إذا فعلنا، لن نعرف هل تغير اللون بسبب مكانها أم بسبب الهواء.» قالت شين يان. «نثبت مكانها ونعدل التوزيع أولاً.»\u003c/p>\u003cp>قال تشانغ: «أنا أراقبها. لا يحتاج الأمر إلى واجهة.»\u003c/p>\u003cp>«لن أستعملها لتقرر عنك. أريد تقديراً للمسافة والحرارة عند سطح الموقد، لا أكثر.»\u003c/p>\u003cp>حدقت في الفوهة، ثم حاولت تقدير دفء الطين المحيط بها. لم يكن هناك قياس مباشر، ولم تكن الثقة مرتفعة. ظهرت لها واجهتها، ولكنها طلبت وصفاً عاماً فقط. لم تظهر درجة دقيقة. لم تبن على ذلك قراراً وحده، بل قارنته باللون الذي وصفه تشانغ، وبحركة شريط القماش.\u003c/p>\u003cp>قالت: «الطرف قرب الجدار أبطأ في التسخين. ثقتي منخفضة. لا أريد زيادة النار الآن.»\u003c/p>\u003cp>قال لين: «هل نغير الفوهة؟»\u003c/p>\u003cp>«بعد أن نرى القطعة. إذا غيرناها الآن، ستصبح هذه تجربة على شيئين.»\u003c/p>\u003cp>أومأ. كانت تجربة واحدة كافية لتعليمهم أين يضيع الهواء. أخذ تشانغ القضيب بملقط طويل، ووضعه فوق الفحم. حرك شين يان المقبض بإيقاع متقارب، بينما راقب لين كمية الفحم. لم يكن هناك جدول متقدم؛ سجلا الوقت بعلامات على لوح، كلما قلب تشانغ القطعة أو غيّر موضعها.\u003c/p>\u003cp>اشتعل الفحم عند فتحة الهواء، ثم استقر اللهب على جانب واحد. بدأ طرف القضيب يحمر، بينما بقي الطرف الآخر أسود. حرك تشانغ القطعة قليلاً، لكن التفاوت لم يتلاشَ. زاد شياو دو الفحم على الجهة الباردة، فاستجاب اللهب بسرعة قرب الفوهة، وتكاثف الدخان في أعلى الفرن.\u003c/p>\u003cp>قال تشانغ: «توقف.»\u003c/p>\u003cp>أوقف شياو دو يده. لم يضف المزيد.\u003c/p>\u003cp>قال لين: «الدخان زاد.»\u003c/p>\u003cp>«والهواء لا يصل إلى الخلف،» قالت شين يان. «زيادة الفحم أغلقت المسار.»\u003c/p>\u003cp>قال تشانغ: «والفوهة تدفع في جهة واحدة. لا ترفعوا السرعة.»\u003c/p>\u003cp>لم تمض عشر دقائق حتى ظهر خلل آخر. بقي طرف القطعة بلون أحمر قاتم، بينما صار الطرف المقابل أكثر لمعاناً. لم تكن الحرارة موزعة، وكان الفحم قد تجمع عند جهة الفوهة. لو طرق تشانغ الحديد الآن، لالتوى قبل أن يخرج ما فيه من شوائب.\u003c/p>\u003cp>قال لين: «هل نوقف؟»\u003c/p>\u003cp>قال تشانغ: «أخرجها. لا نطرقها بهذا الشكل.»\u003c/p>\u003cp>أخرجها تشانغ من النار ووضعها على طرف السندان. لم تكن قد احترقت، لكن الحافة الرقيقة انكسرت حين لامسها الملقط. سقط جزء بحجم ظفر اليد، وتفتت إلى حبيبات سوداء. لم يكن الفقد كبيراً، لكنه كان دليلاً على أن العيب في القطعة أعمق مما حسبوا.\u003c/p>\u003cp>قال شياو دو: «انكسرت.»\u003c/p>\u003cp>قال تشانغ: «قطعة صغيرة. هذا ما نختبره.»\u003c/p>\u003cp>قال لين: «ما بقي من الوزن؟»\u003c/p>\u003cp>وزن شين يان القطعة بعد أن بردت بما يكفي. دوّنت مقدار الحديد المفقود، ثم فصلت الحبيبات التي سقطت في الرماد.\u003c/p>\u003cp>«لا نعيدها للنار اليوم،» قالت. «نحتاج إلى فحص الفوهة والتوزيع.»\u003c/p>\u003cp>نظر تشانغ إلى مسار الهواء. «الفتحة واسعة عند طرفها، وضيقها عند القاع. يضرب الهواء الجدار، ثم يصعد من هناك. النار لا تعبر القطعة كلها.»\u003c/p>\u003cp>قال لين: «أيمكن أن نغير ارتفاع القطعة؟»\u003c/p>\u003cp>«هذا سيغير موضع الفحم أيضاً.»\u003c/p>\u003cp>قالت شين يان: «نبدأ بمسار الهواء. الفوهة تدفع جانباً. نضيق فتحتها قليلاً، ونوزع الفحم على شكل قوس حول القطعة بدل تكديسه عندها. نغيّر شيئاً واحداً.»\u003c/p>\u003cp>لم تكن النتيجة مضمونة. أخرجت شين يان قياسها التقريبي من الواجهة، ثم قارنت المسافة بين فتحة الهواء وحافة الطين. الثقة بقيت منخفضة، فلم تحدد مقداراً دقيقاً. وضعت علامة بالقلم على الفوهة لتضييق ثقبها بما يكفي لئلا يواجه الجدار مباشرة. قالت إنهم سيتوقفون إذا صار الهواء ضعيفاً جداً.\u003c/p>\u003cp>قال تشانغ: «إذا ضيقناها أكثر، ستختنق النار.»\u003c/p>\u003cp>«لن نضيقها كثيراً.»\u003c/p>\u003cp>«كيف تعرفين؟»\u003c/p>\u003cp>«لا أعرف بعد. لذلك أضع علامة صغيرة، ونختبر الهواء من القماش قبل إشعالها.»\u003c/p>\u003cp>لم يعترض تشانغ. أخذ أداة حديدية طويلة، وأزال جزءاً يسيراً من حافة الفوهة، ثم نعّمها. لم يتركها ضيقة؛ بقيت فتحة الهواء واسعة بما يكفي لتدفقه، لكن زاويتها صارت أقل حدّة. أعادوا شريط القماش. دفع لين المقبض ببطء. مال الشريط باتجاه الفحم، ولم يعد يضرب الجدار مباشرة. لم يكن التيار متساوياً تماماً، لكنه لم يدفع الرماد إلى الخارج.\u003c/p>\u003cp>قالت شين يان: «الآن نغير توزيع الفحم. لا نزيد المقدار.»\u003c/p>\u003cp>أعادوا كمية الفحم نفسها تقريباً، لكنهم تركوا ممراً ضيقاً للهواء، ووضعوا القطعة في الوسط. لم يملأوا الفراغات حولها. احتفظت شين يان بوعاء الفحم المتبقي جانباً؛ إذا احتاجوا إلى إضافة، سيزنون ما يضيفون.\u003c/p>\u003cp>قال تشانغ: «ابدأوا.»\u003c/p>\u003cp>دفع لين المقبض. لم يشغلوا الماء؛ أرادوا إبقاء التحكم في يد العامل، وتجنب خلط مشكلتين. ظل تدفق الهواء أكثر استقراراً من التجربة الأولى، لكن حرارة النار تقدمت ببطء. بدأ اللون يتغير على الجانبين، ثم تأخر الوسط. أضافت شين يان نصف مجرفة صغيرة من الفحم إلى الجهة الباردة، لا إلى الفوهة. عادت تقيس بالعين، وتطلب من لين أن يدفع الهواء بوتيرة ثابتة.\u003c/p>\u003cp>راقب تشانغ اللون. «ارفعها.»\u003c/p>\u003cp>رفعها لين. «لم تصل الحرارة إلى الوسط.»\u003c/p>\u003cp>«أرى ذلك.»\u003c/p>\u003cp>«هل ننتظر؟»\u003c/p>\u003cp>«ننتظر قليلاً. لا نزيد الهواء.»\u003c/p>\u003cp>كان الطرف القريب من الفوهة يضيء، لكن الطرف الآخر لا يزال داكناً. لم يكن لدى لين جواب يحدد اللحظة المناسبة. الواجهة لم تعرض إلا تقديراً عاماً، منخفض الثقة، ولم تساعده على اختيار حركة المطرقة. بقي القرار عند تشانغ، الذي دار حول الموقد ليرى اللون من جهتين.\u003c/p>\u003cp>قالت شين يان: «الهواء صار أهدأ. إن زدنا السرعة الآن، قد تزيد الحرارة قرب الفوهة وحدها.»\u003c/p>\u003cp>أومأ تشانغ. «أعرف. اثبت على هذا الإيقاع.»\u003c/p>\u003cp>مضت دقائق أخرى. اقترب اللون بين الطرف والوسط، لكن شقاً رفيعاً ظهر على الحافة المتضررة. لم يكن من الحرارة وحدها؛ كان خط اللحام الضعيف ينفتح حين تمددت القطعة. أخرجها تشانغ، وقلبها على السندان. لم يطرقها بقوة. لمسها بمطرقة صغيرة، ثم سمع صوتين مختلفين.\u003c/p>\u003cp>قال: «الطرف صالح للطرق الخفيف. الوسط ليس كذلك.»\u003c/p>\u003cp>«هل نكمل؟» سأل لين.\u003c/p>\u003cp>«لا. نوقف قبل أن نخسر أكثر.»\u003c/p>\u003cp>وضع تشانغ الحديد على السندان، وضرب الجزء الذي تغير لونه ضربات قليلة، ثم أوقفه قبل أن يصير حاراً أكثر. انفتحت الشقوق الدقيقة على طرفه، وانفصلت حبيبات الخبث. لم يخرج منها قضيب سليم، ولم يعلن نجاحاً. بقي جزء قصير يمكن استعماله قطعة تثبيت أو خردة، لكن لم يعد يصلح لاختبار آخر.\u003c/p>\u003cp>قالت شين يان: «كم فقدنا؟»\u003c/p>\u003cp>قال تشانغ: «لا أزن الحديد قبل أن يبرد.»\u003c/p>\u003cp>«سأنتظر.»\u003c/p>\u003cp>لم تسأله أن يسرع. جلست قرب الساحة، وكتبت كمية الفحم التي استهلكوها، ووقت كل مرحلة، وكمية الحديد التي فقدوها، والموضع الذي اختلف فيه اللون. سجل لين ما حدث عند الفوهة: التوزيع الأول خنق الخلف، والتعديل الصغير حسّن اتجاه الهواء، لكن الحديد نفسه كان معيباً.\u003c/p>\u003cp>قال تشانغ وهو ينظر إلى الرماد: «لا تجعلوا الواجهة تقول إن الفوهة أصلحت القطعة. القطعة كانت رديئة قبل أن نبدأ.»\u003c/p>\u003cp>قال لين: «لن تفعل. التحليل وجد شوائب وخطاً ضعيفاً.»\u003c/p>\u003cp>«وهذا ما رأيته أنا في الكسر.»\u003c/p>\u003cp>«الاثنان صحيحان.»\u003c/p>\u003cp>قالت شين يان: «لا نلوم القياس على الحديد، ولا الحديد على الهواء. نحتاج تسجيل كل سبب منفرد.»\u003c/p>\u003cp>بقي تشانغ صامتاً. ثم أخذ قطعة حديد صغيرة من طرف الخردة، وفحصها بالمطرقة. «هذه أنظف. سأفصلها عن الباقي.»\u003c/p>\u003cp>لم يكن ذلك وعداً بعمل أداة، بل اختيار عينة أخرى. أخذ يانغ القطعة إلى جانب السندان، ووضعها في صندوق صغير. لم يخلطها بالحديد الرديء. قال إنه سيجفف بطانة الفرن قبل المحاولة التالية، حتى لا يختلط أثر الرطوبة بأثر الهواء. لم يشعلوا الفرن طويلاً؛ أطفؤوا الجمرات، وتركوها تبرد في موضع آمن.\u003c/p>\u003cp>قبل أن يعيدوا الحديد إلى الصندوق، فحص تشانغ موضع الكسر مرة أخرى. أدار القطعة تحت الضوء، ثم كشط سطحها بطرف إزميل. ظهر خط رفيع بمحاذاة الحافة، وفيه حبيبات لا تتساوى في الصلابة.\u003c/p>\u003cp>قال لين: «هل كان هذا الخط هو الذي رأيناه قبل التسخين؟»\u003c/p>\u003cp>«قريب منه. لكن الحرارة أظهرت امتداده.»\u003c/p>\u003cp>«إذن لم تصنعه النار.»\u003c/p>\u003cp>«لا. النار جعلت الضعف واضحاً. لو طرقته بعنف، لقلت إن المطرقة كسرته، مع أن العيب كان فيه من البداية.»\u003c/p>\u003cp>كتب لين ذلك بجوار وزن الفتات. لم يكتب «فشل الفرن» ولا «فشل الحديد». كتب: «القطعة التجريبية فيها خط التحام ضعيف؛ التسخين غير المتساوي زاد ظهور الشق. خسارة محدودة، لا تصلح هذه القطعة لإعادة الاختبار.»\u003c/p>\u003cp>قال تشانغ: «الكلام كثير.»\u003c/p>\u003cp>«حتى لا نكرر التجربة على قطعة أسوأ ونظن أن الهواء أصلحها.»\u003c/p>\u003cp>لم يرد تشانغ، لكنه دفع القطعة إلى صندوق الخردة بنفسه. أما الشريحة الأنظف، فوضعها في صندوق آخر، ولم يسمح لشياو دو أن يضع فوقها قطعاً أثقل. كان يريد أن تبقى منفصلة إلى أن يفحصها مع ضوء النهار.\u003c/p>\u003cp>سأل شياو دو: «إذا كانت هذه أنظف، لماذا لا نجربها الآن؟»\u003c/p>\u003cp>قال تشانغ: «لأن الفحم انتهى، ولأنني لا أطرق وأنا متعب.»\u003c/p>\u003cp>قالت شين يان: «ولأننا غيرنا الفوهة اليوم. نحتاج أن نعيد وزن الفحم ونفحص البطانة قبل تجربة ثانية.»\u003c/p>\u003cp>«إذن غداً؟»\u003c/p>\u003cp>«ليس بالضرورة. إذا لم تجف البطانة أو عاد البرد، ننتظر.»\u003c/p>\u003cp>أعاد شياو دو يده إلى جانبه. «سأنتظر.»\u003c/p>\u003cp>حين بردت القطعة التجريبية، وزنها لين. كان جزء صغير قد انفصل، كما كان الرماد يحمل فتاتاً آخر. كتبوا مقدار الفقد على أنه خسارة تجربة، ولم يحسبوه حديداً صالحاً. الفحم المستهلك أيضاً لم يعد إلى المخزون. لم يكن الرقم كبيراً، لكنه جعل حد التجربة التالية واضحاً.\u003c/p>\u003cp>قالت شين يان: «في المرة القادمة، لا نرفع الهواء فوق ما استعملناه اليوم. نضع علامة على المقبض قبل أن نبدأ.»\u003c/p>\u003cp>قال لين: «حتى لا نتجاوز هذه الحركة؟»\u003c/p>\u003cp>«نعم. إذا احتجنا إلى أكثر، نتوقف ونراجع. ليس كل ارتفاع في النار تحسناً.»\u003c/p>\u003cp>أخذت خيطاً ولفته حول مقبض المنفاخ عند الموضع الذي بلغوه. ثم ربطت علامة قماشية صغيرة على الحامل كي يراها العامل. لم تكن مقياساً دقيقاً، لكنها كانت حداً يمكن للجميع رؤيته. كتب لين في الدفتر: «الحد الأعلى للتدفق في التجربة المقبلة: علامة الخيط. لا زيادة قبل مراجعة توزيع الفحم ومسار الهواء.»\u003c/p>\u003cp>قال تشانغ: «هذه العلامة لا تخبرني بحرارة الحديد.»\u003c/p>\u003cp>«صحيح. إنها تخبرنا فقط متى نوقف الزيادة.»\u003c/p>\u003cp>«جرّبوا.»\u003c/p>\u003cp>أدار تشانغ المقبض حتى العلامة، ثم تركه. لم يزد الضغط. فحص الفوهة، ومسح الرماد عن حافتها. «حين نجرب القطعة النظيفة، أريد أن أبدأ باللون الذي أعرفه، لا برقم لا أراه.»\u003c/p>\u003cp>قالت شين يان: «وأنا أراقب الهواء وأقيس التغير. لا أحدنا يستبدل الآخر.»\u003c/p>\u003cp>بعد أن جمعوا الأدوات وأطفؤوا الجمر، سار لين وشين يان إلى المجلس. كان موعد الجباية الثالثة قد حل في اليوم141. وضعت شين يان نحاستين أمام وو، فعدهما وختم إيصالاً جديداً. راجعت التاريخ قبل أن تحفظه: الموعد التالي بعد تسعة أيام، في اليوم150. لم تدخل الدفعة في دين الطاحونة ولا في حساب الحدادة. وعادا إلى الورشة قبل أن يبرد آخر الجمر.\u003c/p>\u003cp>في نهاية اليوم، كان المنفاخ ساكناً، والفحم المتبقي أقل مما كان صباحاً، والقطعة التي اختبروها لم تعد صالحة لصنع أداة. لم يكن لهم من الحديد الجديد شيء. لكنهم عرفوا أن الهواء لا يوزع نفسه بالتساوي لمجرد أن المنفاخ يتحرك، وأن زيادة الفحم قد تسد المسار، وأن القطعة ذات خط اللحام الضعيف يمكن أن تنفصل قبل أن تنتفع بحرارة متساوية.\u003c/p>\u003cp>مرر تشانغ يده على العلامة التي تركتها شين يان، ثم قال: «في المرة القادمة، لا تتجاوزوا هذه.»\u003c/p>\u003cp>أجابته: «لن نتجاوزها حتى نعرف ما الذي تغير.»\u003c/p>\u003cp>بقي الخيط الأحمر على المقبض، علامةً للحد الأعلى من الهواء قبل إعادة التجربة.\u003c/p>"},{"n":46,"t":"الفصل السادس والأربعون: جدار يحفظ النار","b":"\u003cp>في صباح اليوم الثالث والأربعين بعد المئة، عاد لين إلى الحداد ومعه دفتر الفحم تحت ثوبه. كان البرد قد لان قليلاً، لكن الماء في الجرار ظل يترك طبقة رقيقة من الجليد عند الفجر. خلف دكان تشانغ، بقيت علامة الفحم على الأرض كما تركوها في التجربة الأخيرة؛ خط أسود قصير لا يبلغ طرف الموقد.\u003c/p>\u003cp>لم يمد تشانغ يده إلى الحديد. وضع كفه على حافة الفرن وقال: «الجدار يتلقى الهواء قبل القطعة. إذا لم يحفظ النار، فلن ينفعنا منفاخ أقوى.»\u003c/p>\u003cp>كانت التجربة السابقة قد أظهرت لهم أن الهواء صار أهدأ، لا أن الحرارة وزعت نفسها وحدها. في طرف الموقد قرب الفوهة احمر الفحم سريعاً، بينما بقيت القطعة عند الجانب الآخر معتمة. لم يكن اللون وحده مقياساً كافياً، كما قال تشانغ وهو يقلب القطعة التجريبية. ولم تكن إضافة الفحم حلاً؛ فالذي يذوب من الجدار سيعلق بالحديد، والحديد القديم لا يحتمل خسارة أخرى.\u003c/p>\u003cp>قال لين: «إذن نبدأ من البطانة. نخلط كمية صغيرة، نجففها، ثم نرى إن كانت تصمد. لا نغطي كل الفرن قبل أن نعرف.»\u003c/p>\u003cp>رد تشانغ: «جرّب.»\u003c/p>\u003cp>كانت شين يان قد جاءت من النزل ومعها لوح صغير كتبت عليه المقادير. لم تسمح للين أن يحمل كيس الطين عنها، واختارت بنفسها موضعاً قريباً من الباب لا يصله المطر. قالت: «أجريت ثلاث عينات قبل الفجر. هذه تحمل القش، وهذه فيها رماد من نار قديمة، والثالثة بلا إضافة. لا نسميها ناجحة حتى تجف.»\u003c/p>\u003cp>أشار تشانغ إلى العينة ذات القش. «القش يحبس الهواء إن بقي منه كثير. لو احترق، يترك فراغات.»\u003c/p>\u003cp>قالت: «لذلك خففت مقداره. لم أضعه لتقوية الطين، بل حتى أرى إن كانت الفراغات الصغيرة تفسر التشقق الذي رأيناه. أمس جف قرص صغير من خلطة فيها قليل من القش والرماد، وسخنته على نار قصيرة؛ لم يتشقق، لكن هذا لا يكفي كي أضعها على الجدار كله.»\u003c/p>\u003cp>نظر إليها لحظة، ثم أخذ اللوح. لم يجامِل المقادير ولا رفضها. طلب حفنة من كل خلطة، ثم جعل لين يضغطها بين إصبعيه. كانت الأولى لزجة، والثانية أخشن، أما الثالثة فمالت إلى الانفصال عند الحافة.\u003c/p>\u003cp>قال لين: «الرماد يجعلها أقل التصاقاً.»\u003c/p>\u003cp>«أو أن الماء في هذه العينة أقل.» قالت شين يان. «لا نعرف بعد. أكتب هذا احتمالاً، لا حكماً.»\u003c/p>\u003cp>أخرج لين من واجهته مقداراً محدوداً من التحليل بعد أن وضع عينة من الطين قربه. لم تمنحه الواجهة وصفة، بل عرضت أن اختلاف الرطوبة بين العينات أكبر مما ظنوا.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>تفاوت الرطوبة بين العينات أكبر من المتوقع؛ لا تكفي للمقارنة قبل إعادة الخلط.\u003c/div>\u003cdiv>الثقة: 68%\u003c/div>\u003cdiv>طاقة التكامل: 74%\u003c/div>\u003c/div>\u003cp>أغلق التحليل قبل أن يكرر السؤال بصيغ أخرى.\u003c/p>\u003cp>قال: «المقارنة ليست نظيفة. أعددناها بيدينا، لكننا لم نزن الماء.»\u003c/p>\u003cp>رفعت شين يان نظرها عن لوحها. «نبدأ من جديد بكمية ماء واحدة. وإذا بقي الفرق بعد الجفاف، نعرف أن الإضافة أثرت. لا أريد رقماً يطمئننا لأننا نريده.»\u003c/p>\u003cp>قسما الطين إلى ثلاثة أكوام صغيرة. أخذت شين يان المكيال، بينما وضع لين حصى متساوية في كل وعاء حتى يقدرا الماء نفسه. لاحظ تشانغ عملهما، ولم يتدخل إلا حين مال الوعاء الثالث.\u003c/p>\u003cp>قال: «السطح لا يقول لك ما في الوسط. اعجنه حتى تختفي العقد.»\u003c/p>\u003cp>دفع لين العجين بكفه. كان بارداً، وخشن الحبيبات. بعد دقائق صار أقل تفتتاً، لكن القش بقي ظاهراً فيه. ترك تشانغ الطين جانباً، ثم أخرج قطعة من بطانة قديمة وطرقها بظفره. انفصل طرف صغير.\u003c/p>\u003cp>«هذه كانت أكثر رطوبة مما حسبنا.»\u003c/p>\u003cp>لم يجادله لين. كتب شين يان على اللوح: «عينة قديمة، لا تدخل المقارنة.»\u003c/p>\u003cp>قالت: «أحتاج إلى راحة قصيرة.»\u003c/p>\u003cp>نظر لين إلى كفيها المحمرتين. كان قد أراد إنجاز بطانة كاملة قبل عودة الزبائن في النهار، لكنه رأى أنها لا تزال تضغط أصابعها لتعيد إليها الإحساس. وكان الوقود الذي اشتروه لا يكفي لتجارب لا تنتهي.\u003c/p>\u003cp>قال: «نتوقف عشر دقائق. أذهب أنا إلى السوق، وأعود بالفحم الذي اتفقنا عليه.»\u003c/p>\u003cp>لم تجبه فوراً. مسحت الطين عن أطراف أصابعها. «عشر دقائق، ثم نقرر إن كان يكفي الجهد اليوم. لا تجعلها موعداً للعودة إلى العمل مهما كان.»\u003c/p>\u003cp>هز رأسه. أخذ الدفتر وسار إلى سوق القرية. لم يكن يريد شراء كومة كبيرة قبل أن يثبت مقدار ما يستهلكه الفرن. وجد بائع الفحم قرب أكياس الحطب، يفرز القطع الكبيرة من الفتات. ساومه على وزن محدد لا على عدد الأكياس، وجعل البائع يعيد الوزن بعد أن مال الميزان إلى طرفه.\u003c/p>\u003cp>قال البائع: «كل هذا لأجل نار واحدة؟»\u003c/p>\u003cp>«لأكثر من تجربة، إذا لم نفسدها.»\u003c/p>\u003cp>«ومن يضمن أن تشتروه مني ثانية؟»\u003c/p>\u003cp>«لا أحد. لهذا أشتري القليل الآن.»\u003c/p>\u003cp>وزن الرجل الفحم على دفعتين. دفع لين الثمن المتفق عليه، وكتب المقدار والسعر في الدفتر بحضور البائع. لم يطلب خصماً إضافياً؛ كان يريد رقماً يمكن أن يقارن به الشراء التالي. وضع البائع علامة فحم على ورقته، ثم ناوله الكيس.\u003c/p>\u003cp>حين عاد، كانت شين يان جالسة على مقعد منخفض، ويدها على بطنها. لم تكن نائمة. كانت تراقب العينة التي جف سطحها قليلاً.\u003c/p>\u003cp>قالت: «القش جعلها أخف، لكنه لا يعني أنها أصلب. نستخدم الخلطة التي اختبرناها عند الموضع الضعيف فقط، ولا نغطي بها الفرن كله.»\u003c/p>\u003cp>أجاب لين: «نثبت طبقة رقيقة داخل الجدار ونسندها حتى تجف. لا نشعلها قبل أن تفقد رطوبتها.»\u003c/p>\u003cp>«بعد أن نثبتها. لا نتركها معلقة على طين لين.»\u003c/p>\u003cp>أزال تشانغ بملعقة خشبية القشرة المفككة من الموضع الضعيف في الجدار الداخلي. أخذ مقداراً من الخلطة المختبرة، وعدّل ماءه حتى صار يمسك بالملعقة من غير أن يسيل، ثم ضغط طبقة رقيقة في الموضع المكشوف. لم يمدها على كامل الفرن؛ أبقاها حول الشق الذي ظهر عند الحرارة، وسوّى أطرافها كي لا تنفصل عند الجفاف. ثبت يانغ حجراً مسطحاً خلف ذلك الجانب حتى يحمل الطبقة، وترك الدعامة في موضع آمن.\u003c/p>\u003cp>أخذ تشانغ قليلاً من الخلطة نفسها ووضعه على لوح حجري منفصل. وصنعوا ثلاث رقع صغيرة، واحدة من كل خلطة، على قطع طوب قديمة، ليقارنوا جفافها بجفاف الجدار. لم يخلطوا ما تبقى في دفعة واحدة، ولم يقربوا النار منها.\u003c/p>\u003cp>قال تشانغ وهو يمسح الملعقة: «هذه ستبقى حتى تجف. لا أريد أحداً يلمسها غداً ويقول إنها صارت صلبة من الخارج.»\u003c/p>\u003cp>سأل لين: «وماذا نفعل بالفرن؟»\u003c/p>\u003cp>أشار الحداد إلى بطانته الحالية. «أقوي الجهة التي تنفتح عند الضغط أولاً. ثم أضيف الجدار الذي اتفقنا عليه. وأترك فتحة أستطيع سدها حين أريد أن يحبس الفرن الحرارة، وأفتحها حين أحتاج أن يخرج الدخان. إن جعلتموها ضيقة لا تدخلون أداة تسدها، فستلعنون أنفسكم.»\u003c/p>\u003cp>لم يكن ذلك رسماً جاهزاً. وضع تشانغ حجراً مكان الفتحة، ثم أزاحه حتى صار في متناول اليد من خارج الجدار. جرّب لين أن يدفع قطعة خشب لتسدها، فاحتكت بالحافة.\u003c/p>\u003cp>قالت شين يان: «الحافة خشنة. إذا تمدد الطين حولها لن نستطيع تحريك السدادة.»\u003c/p>\u003cp>أخذت أداة مسطحة وسوت الطرف بنفسها، ثم طلبت من لين أن يعيد تجربة الحركة. انزلقت قطعة الخشب الآن دون أن تتعلق. قالت: «هذه حركة واحدة. لا نحتاج إلى نظام معقد كي نتحكم بفتحة.»\u003c/p>\u003cp>وضع تشانغ حجراً مسطحاً خلف الموضع الضعيف ليحمل ثقل البطانة، وثبت الحجر بدعامتين خشبيتين مؤقتتين. رفض لين أن يقربهما من النار، وأصر على أن ترفعا قبل أي إشعال. سجل ذلك على هامش الدفتر.\u003c/p>\u003cp>لم تعجبه كلمة «مؤقتتين» في السجل، فطلب من شين يان أن تكتب بجانبها موعد إزالتهما. قالت إن الموعد ليس اليوم، لأن الطين ما زال رطباً. اقترح أن يكتبوا «قبل الإشعال»، فوافقت. لم يرد لين أن ينسوا الأمر حين يقترب موعد التجربة، وكانت العلامة الصغيرة على الورق أقل عرضة للنسيان من اتفاق بينهم عند باب الدكان.\u003c/p>\u003cp>مر يانغ من الخارج بعد قليل، وكان يحمل لوحاً لبيت النازحين. نظر إلى الدعامتين وسأل إن كان يريد منهما إزالة الحمل عن الطوب. أوضح له تشانغ ما يحتاجه، فقص يانغ وتداً خشبياً قصيراً يثبت الحجر من الجانب، ثم جرّبه بيده. لم يتركه في مكانه نهائياً، بل قال إن رطوبة البطانة قد تغير موضعه. فحص لين المسافة بين الدعامة والحافة، حتى لا يعلق السد الذي سيغلق الفتحة.\u003c/p>\u003cp>قال يانغ: «إذا صارت الفتحة أضيق بعدما يجف الطين، لن يخرج هذا اللوح بسهولة.»\u003c/p>\u003cp>أخرج لين السدادة الخشبية من الصندوق وجربها. بقيت تتحرك، لكن طرفها احتك بزاوية لم ينتبها لها. مرر يانغ سكينه على الزاوية مرة واحدة، ثم أعادها إلى لين. دخلت السدادة وخرجت من غير أن تحك الطين. كتبت شين يان أن الحركة جُربت وهي باردة فقط، وأنهم سيعيدونها بعد جفاف الجدار، قبل إشعال النار.\u003c/p>\u003cp>قالت: «كل اختبار له شرطه. لا نكتب أنها تنزلق دائماً؛ نكتب أنها انزلقت الآن.»\u003c/p>\u003cp>قال لين: «لو كتبت كل قيد، امتلأ الدفتر.»\u003c/p>\u003cp>«أفضل من أن يمتلئ الفرن بخطأ لم نسجله.»\u003c/p>\u003cp>ابتسم يانغ، ثم حمل لوحه ومضى. لم يكن قد أخذ أجراً من الورشة، ولم يطلبه، لكن لين كتب أن مساعدة يانغ في تعديل السد لم تدخل ضمن أجره في إصلاح البيوت. وحين اعترضت شين يان أن السجل لا يحتاج إلى ذكر كل خدمة، قال إن الحدود تختلط سريعاً إذا لم يذكروها. تركت الأمر كما هو، مع علامة لا تعني ديناً.\u003c/p>\u003cp>بعد أن رتبوا عينات الطين، جاء طفل من الجوار ليطلب من تشانغ مسماراً معوجاً يصلح به باب حظيرة. لم يسمح الحداد له أن يدخل إلى قرب الفرن، وأخرج المسمار من صندوق قديم. وقف الطفل يراقب الجدار الجديد، وسأل إن كان سيذيب الحديد اليوم. أجابه تشانغ: «اليوم لا نار.» ثم أخرجه إلى الباب قبل أن يلمس الأدوات.\u003c/p>\u003cp>قال لين بعد ذهابه: «لو انتظرنا حتى جفاف البطانة، سنكون خسرنا يوماً آخر.»\u003c/p>\u003cp>رد تشانغ: «لو أشعلناها رطبة، قد نخسر الجدار كله. اختر أيهما أغلى.»\u003c/p>\u003cp>لم يجب لين. كان الفحم الموزون دليلاً صغيراً على كلفة الوقود، والطين الذي انفصل أثبت أن المادة قد تهدر قبل أن يبلغ الحديد النار. عاد إلى موضع الطبقة الجديدة، ولم يمد يده إليها. اكتفى بإزالة قطرة ماء من حافة لوح العينة قبل أن تنساب إلى الشق.\u003c/p>\u003cp>قبل أن يغادروا الورشة، أشار تشانغ إلى أثر الحرارة غير المتساوية في القطعة التي تلفت. لم يجعل البطانة سبباً وحيداً للفشل؛ كانت الفوهة قد وجهت الهواء نحو جانب، وتجمع الفحم هناك. قال إن الجدار الجديد قد يثبت الحرارة حين تجف الخلطة، لكنه لن يصلح مسار هواء منحرفاً. لذلك سيعيدون فحص العلامة التي وضعتها شين يان على حد الهواء، ويبدؤون بتوزيع الوقود قبل أن يطلبوا من المنفاخ قوة أكبر.\u003c/p>\u003cp>سألت شين يان إن كان بإمكانهم وضع لوح فوق العينات كي لا يبللها الندى. أخرج يانغ قطعة قماش سميكة من صندوقه، لكن تشانغ رفض أن تلامس الطين. ثبتوا لوحاً فوقها على حجرين صغيرين، وتركوا الجانبين مفتوحين للهواء. لم يكن الغطاء محكماً؛ إن حبس الرطوبة حول العينة، صار حمايتها سبباً في إطالة جفافها.\u003c/p>\u003cp>قال لين: «لو جف سطحها فقط، نعرف من لونها؟»\u003c/p>\u003cp>قال تشانغ: «لا. نفحص طرفاً من عينة صغيرة ونكسرها. لا نكسر الرقعة التي نريدها للجدار.»\u003c/p>\u003cp>أضافت شين يان إلى الدفتر أن فحص الجفاف سيكون في عينة منفصلة، لا في البطانة. كان ذلك يستهلك جزءاً صغيراً من الخلطة، لكنه يمنعهم من إفساد الجدار كله لأجل معرفة بسيطة. حمل لين لوح الغطاء بنفسه، ووضعه على الحجرين، ثم تأكد أن الهواء يمر تحته.\u003c/p>\u003cp>لم يزد الفحم في الموقد ولم يتركه تشانغ مشتعلاً. أطفأوه على مهل، وفصلوا الرماد عن القطع التي لم تحترق. بقيت حرارة خفيفة في السندان، أما البطانة فتركت لتبرد على حالها. لم يكن في الورشة ما يستدعي البقاء حتى الليل؛ القياس التالي لن يتغير لأنهم يراقبونه كل دقيقة.\u003c/p>\u003cp>قال تشانغ: «ستجف البطانة بين اليوم والتجربة التالية. إذا استعجلتموها، يخرج البخار من داخلها ويشققها.»\u003c/p>\u003cp>نظر لين إلى الشمس التي مالت فوق السطوح. كان يمكن أن يبدأ طبقة أخرى، لكنه حسب الفحم في الكيس، ثم نظر إلى يدي زوجته. «يكفي اليوم.»\u003c/p>\u003cp>قالت شين يان: «يكفي.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند عودتهم إلى النزل، وضعت شين يان اللوح قرب الموقد، بعيداً عن الطعام، وطلبت من لين أن يقرأ ما كتبته. راجعوا مقدار الماء، ووزن الفحم، وثمنه، وموضع كل عينة. لم يكتبوا أن خلطة القش أفضل؛ كتبوا أنها أخف بعد الخلط، وأن اختبار جفافها لم يكتمل.\u003c/p>\u003cp>قال لين: «إذا تحملت، توفر طيناً ووقتاً.»\u003c/p>\u003cp>قالت: «وإذا لم تتحمل، نكون قد عرفنا ذلك في رقعة صغيرة، لا بعد أن نغطي الفرن.»\u003c/p>\u003cp>أغلق الدفتر. «كنت أريد أن أسرع الدفعة. ظننت أن الهواء المنتظم سيختصر الوقت.»\u003c/p>\u003cp>«الهواء أهدأ، لكن الطبقة الجديدة لم تجف ولم نختبرها بعد.»\u003c/p>\u003cp>لم ترفع صوتها. كان ذلك كافياً. تنفس لين ببطء، وأومأ. «لن أشعل البطانة وهي رطبة.»\u003c/p>\u003cp>في المساء مر تشانغ بالنزل، يحمل قطعة حديد قصيرة ملفوفة بخرقة. لم يضعها على الطاولة؛ أبقاها في يده وقال: «هذه الشريحة التي عزلناها. أحتفظ بها للتجربة بعد غد، إن جف الجدار واستقر الهواء.»\u003c/p>\u003cp>قال لين: «سنكون هناك.»\u003c/p>\u003cp>«لا تعدني بوقت لا تملكه.»\u003c/p>\u003cp>أجابت شين يان: «سنفحص الجدار أولاً. إن بقي رطباً، نؤجل النار.»\u003c/p>\u003cp>نظر تشانغ إليها، ثم هز رأسه. لف القطعة بإحكام وأعادها إلى صندوقه. بقي أثر الفحم على أصابعه حين غادر.\u003c/p>\u003cp>قبل أن يغلقوا النزل، أعادت شين يان اللوح إلى مكانه، وتركت خانة النتيجة فارغة. لم تكن رقع المقارنة ولا الطبقة المثبتة على الجدار جافة، ولم يشعل أحد النار. حمل لين الفحم إلى الورشة ووضعه في صندوق جاف، ثم أغلقه. بقيت القطعة التي عزلها تشانغ ملفوفة في خرقتها، تنتظر أن يجف الجدار قبل التجربة.\u003c/p>"},{"n":47,"t":"الفصل السابع والأربعون: أول منجل","b":"\u003cp>في صباح اليوم الخامس والأربعين بعد المئة، عاد لين إلى دكان تشانغ بعد يومين من تجفيف البطانة. كان الطريق موحلاً عند أطرافه؛ ذاب الثلج عن الحجارة، لكنه بقي متماسكاً في الظل. حمل لين سجل الفحم والعينات في كيس من القماش، فيما مشت شين يان إلى جانبه من غير أن تحمل شيئاً ثقيلاً.\u003c/p>\u003cp>لم يشعل تشانغ الفرن بعد. وقف عند الجدار، ومرر ظهر إصبعه على الرقعة التي جف سطحها أولاً. لم يتفتت الطين، لكن طرفها انفصل قليلاً عن الطوب.\u003c/p>\u003cp>قال: «هذه لم تثبت. لا تدخل في الجدار.»\u003c/p>\u003cp>أشار لين إلى العينة الثانية. «وهذه؟»\u003c/p>\u003cp>نقرها الحداد بظفره، ثم كسر زاوية صغيرة. ظهر القلب أغمق من السطح، لكنه لم يترك الطين على إصبعه. «أجف. ليست جاهزة لإشعال كبير، لكنها تكفي لاختبار حرارة خفيفة إن ثبتناها جيداً.»\u003c/p>\u003cp>قالت شين يان: «والثالثة؟»\u003c/p>\u003cp>«تشققت.»\u003c/p>\u003cp>لم يحاول لين إنقاذها. كانت تلك خسارة طين ووقت، لا سبباً لإخفاء النتيجة. كتب في الدفتر أن الخلطة الثالثة تشققت عند الجفاف، والثانية تماسكت جزئياً، وأن الأولى انفصل طرفها. ثم فحصوا طبقة البطانة التي ثبتوها على الجدار قبل يومين. لم تنفصل عن الطين القديم، ولم يظهر فيها شق جديد. كسر تشانغ طرف عينة الشاهد المنفصلة، فوجد قلبها جافاً، لكنه لم يعلن أن البطانة اجتازت النار بعد؛ قال إن الجفاف يكفي لتجربة قصيرة، لا لتسخين طويل. ثم راجعوا موضع فتحة السدادة والدعامات. أزال يانغ الخشب المؤقت، وثبت الحجر الصغير خلف الموضع الأضعف، ثم ضغط على الجدار بقبضته. لم يتحرك.\u003c/p>\u003cp>قال: «الآن لا يسنده الخشب. إذا مال بعد النار، سأعرف.»\u003c/p>\u003cp>كان يانغ قد مر ليتفقد الفرن قبل أن يعود إلى إصلاح سقف أحد النازحين. لم يجلس. أدار قطعة الخشب التي ستسد الفتحة، ثم أعادها إلى لين. «لا تتركها هنا. من يراها قد يدفعها وهو لا يعرف.»\u003c/p>\u003cp>وضعها لين داخل صندوق الأدوات.\u003c/p>\u003cp>أخرج تشانغ الشريحة التي عزلوها في التجربة السابقة. كانت قطعة قديمة أقصر من ساعد لين، عليها بقايا صخر وخط داكن عند إحدى حوافها. ضربه تشانغ على السندان مرة واحدة. رن الصوت أجوف عند الطرف.\u003c/p>\u003cp>قال: «هذا الجزء لا يدخل النار. أفصله أولاً.»\u003c/p>\u003cp>لم يقل إن الفرن سيجعل الحديد جيداً. وضع علامة على الموضع الذي سيقطعه، ثم انتظر حتى ثبتت البطانة. أشعل ناراً صغيرة بقدر ما يسخن طرفها، وبقي ينظر إلى اللون لا إلى واجهة لين. حين صار الطرف ألين، ضربه حتى انفصلت قطعة الشائبة. تطايرت قشرة سوداء إلى الأرض.\u003c/p>\u003cp>سأل لين: «كم نهدر؟»\u003c/p>\u003cp>«ما يخرج من الحديد لا يعود حديداً لأننا نتمناه.»\u003c/p>\u003cp>جمع لين الشظايا في وعاء منفصل، ووزن القضيب قبل التسخين وبعده على ميزان الورشة. لم يكن فرق الوزن وحده مقياساً نقياً، إذ بقي بعض القشور على الأرض، لكنهم عرفوا مقدار ما فقدوه تقريباً. سجل الرقم باعتباره تقديراً لا حساباً نهائياً.\u003c/p>\u003cp>لم يترك تشانغ لين يضع كل الشظايا في كيس الخردة نفسه. فرز القطع التي بدت كأنها خبث حجري عن رقائق الحديد السوداء، وقال إن بعضها قد يحمل حديداً وبعضها لا يستحق وقتاً إضافياً. لم يكن عندهم ما يفصل الاثنين بدقة. وضعا كل نوع في وعاء مختلف، وكتبت شين يان على الأول «قشور مختلطة»، وعلى الثاني «مادة صلبة من الحافة». لم تسمح للين أن يسمي الثاني حديداً صالحاً؛ لم يُطرق ولم يُختبر.\u003c/p>\u003cp>قال لين: «إن احتجنا إلى كل شيء، سنعود إليه.»\u003c/p>\u003cp>قال تشانغ: «إن احتجنا إليه، نختبره. لا تخلط ما لا تعرفه في قطعة تريد بيعها.»\u003c/p>\u003cp>كان هناك في الصندوق ثلاث قطع من الحديد القديم، احتفظ بها تشانغ منذ بداية الشتاء. اختار منها واحدة أصغر من القضيب، لكنه لم يدخلها النار. وضعها قرب ميزان الورشة ليعرفوا الفرق بين حالة المعدن قبل المعالجة وبعدها. قال إن اختلاف مصدر القطع يجعل المقارنة محدودة، لكنه يريد أن يرى إن كان هذا القضيب وحده ذا خط التحام رديء أم أن المخزون كله كذلك.\u003c/p>\u003cp>قالت شين يان: «نضع علامة لكل قطعة قبل أن نسخنها. وإلا لن نعرف أي واحدة أعطت النتيجة.»\u003c/p>\u003cp>أخذت من لين خيطاً قصيراً، وربطته حول القطعة غير المختبرة، ثم كتبت على لوح خشبي رقمها ومكانها في الصندوق. لم يكن للخيط وظيفة تتجاوز التعريف، لكنه منع خلطها بالشظايا. قرأ تشانغ الرقم وقال إنه لا يريد علامات على الحديد نفسه، إذ قد تفسد الموضع الذي يحتاج إلى طرقه.\u003c/p>\u003cp>في تلك الأثناء، بقي الفحم عند طرف الموقد. لم يكن كيساً كبيراً، لكن تشانغ أصر على أن يقسمه لين إلى مقدارين. مقدار للتسخين، والآخر للطوارئ إن بدأ الحديد يبرد قبل أن ينتهي الطرق. قال لين إن حسابه في الدفتر يبين ما استهلكوه، لكن شين يان أشارت إلى أن الوزن بعد الاحتراق لا يطابق دائماً ما دخل النار بسبب الرماد والقطع الصغيرة التي سقطت.\u003c/p>\u003cp>قالت: «نكتب الكمية المصروفة من الكيس، ولا نزعم أن كل ما اختفى احترق. جزء يسقط أو يختلط بالرماد.»\u003c/p>\u003cp>ترك لين مكاناً لملاحظة الوزن الباقي. لم يكن ذلك جواباً كاملاً عن كلفة كل ضربة، لكنه أفضل من رقم مصنوع. في الخارج، بدأ عامل من القرية بإغلاق مصراع نافذته قبل أن تشتد الريح. سمعوا صوت الخشب يهتز، فانتظروا حتى يهدأ الجو قبل أن يعيد تشانغ تشغيل المنفاخ.\u003c/p>\u003cp>حين عادت النار إلى ثباتها، بقيت شين يان تراقب الذراع من الجانب، بينما تولى لين رفع الفحم المتراجع عن الحافة. لم تزد الحركة سرعة، لكنها منعت الجمر من أن يتجمع تحت طرف واحد. قالت إن تدفق الهواء لا يوزع الفحم وحده، وعليهم أن يحركوا الوقود بيدهم. لم تسجل الواجهة ملاحظة عن الخبث، ولا أخبرتهم بأي موضع يطرقونه؛ كل ما ظهر للين كان تقديراً محدوداً للعينة التي اختاروها. لم تلمس ذراع التحكم حتى أشار لها تشانغ، ثم عدلت التدفق بخطوات صغيرة من غير أن ترفع شدته دفعة واحدة. كان الفحم يحترق على نحو أهدأ من التجربة السابقة، إلا أن جانباً من الحديد بقي أقل احمراراً.\u003c/p>\u003cp>قال تشانغ: «القطعة ليست كلها في القلب.»\u003c/p>\u003cp>قال لين: «نستدير بها.»\u003c/p>\u003cp>«نستدير بها حين أقول.»\u003c/p>\u003cp>أمسك لين بالملقط، لكنه أبقى طرفه بعيداً عن القضيب. كان متحمساً لأن يرى أثر الجدار الجديد، وخاف أن يحرك الحديد مبكراً فيخسر القطعة. شين يان لم تنظر إليه؛ قالت: «الهواء ثابت الآن. لا أزيده إلا إذا تحرك الفحم عن موضعه.»\u003c/p>\u003cp>أومأ تشانغ. انتظر حتى احمر موضع بعينه، ثم أمرهما أن يقلبا القطعة. جرى العمل ببطء. يسخن طرف، يخرجون بعض الخبث، ثم يتركون الجانب الآخر يأخذ نصيبه. لم يكن الفرن واسعاً ولا وقوده وفيراً. وقبل الظهر، أوقف تشانغ التجربة، وأخرج الحديد إلى السندان.\u003c/p>\u003cp>طرق القضيب عدة مرات. سقطت قشور أخرى، لكن خط الالتئام بقي عند الحافة. توقف الحداد قبل أن يتفتت الحديد. قال: «ما زال فيه عيب. لا أريده في قطعة تحتاج إلى طول كامل.»\u003c/p>\u003cp>رفع لين رأسه. «أيمكننا أخذ الجزء السليم لصنع منجل صغير؟»\u003c/p>\u003cp>أدار تشانغ القطعة ونظر إلى سماكتها. «واحد، إذا أحسنت تقسيمها. ويبقى من الباقي ما يكفي لقطعة سكة صغيرة، لكن لا أعدك أنها ستخرج اليوم.»\u003c/p>\u003cp>قال لين: «لا نعد أحداً بموعد. نصنع ما تسمح به القطعة.»\u003c/p>\u003cp>نظر إليه تشانغ ثم ناوله المطرقة. «أمسك الطرف. لا تضرب الحديد من تلقاء نفسك.»\u003c/p>\u003cp>عمل تشانغ على تسطيح الحديد، ثم قص جزءاً مناسباً للمنجل. جعل الانحناء تدريجياً، لا حافة حادة من طرفها إلى طرفها. بقيت القطعة سميكة عند قاعدتها، وأرق قرب الحد. لم تكن الأداة جميلة؛ فيها أثر الطرق، وخط خافت لا يختفي. لكنه لم يكن شقاً مفتوحاً.\u003c/p>\u003cp>على الجانب الآخر من السندان، حفظ تشانغ بقية الحديد للقطعة الزراعية. طرقها حتى صار شكلها مسطحاً وعريضاً، ثم توقف حين ظهرت قشرة سوداء داخل الحافة. لم يحاول طمسها بضربات أكثر. قال: «هذه لا تصلح للاختبار الآن. إما أن نعيد فرزها لاحقاً، أو نعيدها خردة. لا أبيعها باسم سكة.»\u003c/p>\u003cp>لم تعترض شين يان. أخذت القطعة ووضعَتها على لوح مسطح كي لا تختلط بالمنجل. ثم سألت تشانغ إن كان يريد حساب الفحم المستهلك قبل أن يطفئوا النار.\u003c/p>\u003cp>«بعد أن تبرد.»\u003c/p>\u003cp>«نسجل ما نعرفه اليوم، ونترك الباقي فارغاً.»\u003c/p>\u003cp>«افعلي.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد أن خمدت النار، بقي المنجل على السندان حتى زال عنه وهج الحرارة. لم يسمح تشانغ لأحد أن يسكب الماء عليه؛ قال إن سرعة التبريد قد تفسد ما بقي متماسكاً. حين برد، مرر حجر شحذ على حدّه، ثم أمسكه من قاعدته وجرّب الضغط على قطعة قش سميكة. انثنى طرفه قليلاً، ولم ينفصل.\u003c/p>\u003cp>قال لين: «أهو صالح؟»\u003c/p>\u003cp>«هو قابل للاختبار. لا تسأل عن البيع قبل المقبض.»\u003c/p>\u003cp>طلب تشانغ من شين يان أن تسجل أن التبريد جرى في الهواء، لا في الماء، وأن وزن القطعة بعد الطرق ليس وزناً صافياً للحديد الصالح. أضافت أن مقدار الفحم المصروف يتضمن ما اختلط بالرماد وما سقط قرب الفوهة. قال لين إن التسجيل بهذه الطريقة سيصعب مقارنة اليوم باليوم التالي، فأجابته بأن كتابة رقم كأنه دقيق أسوأ من كتابة تقدير مع حدوده.\u003c/p>\u003cp>أعاد الحداد القضيب المتبقي إلى صندوق الحديد، لكنه لم يضعه مع المخزون الجاهز. لفه بقطعة قماش وكتب عليه علامة تدل على أنه جُرب مرة. إذا عادوا إليه، يعرفون أنه تعرض للحرارة والطرق، فلا يعاملونه كقطعة لم تمسها النار. أما الشظايا التي جمعوها فبقيت في وعائها؛ لا تدخل في حساب وزن المنجل ولا في القطعة الزراعية التي لم تجتز الفرز.\u003c/p>\u003cp>كان المقبض الخشبي الذي أعده يانغ ما زال في طريقه من بيته. لم يكن لين يريده مرتجلاً. وضع شين يان المنجل على الطاولة، ورسم بجانبه خطاً يبين موضع الثقب الذي ينبغي أن يستقبل المقبض. لم تسمح للين أن يكتب «نجح» في السجل. كتبت: «الحد لم يتشقق في اختبار القش، وبقيت الحافة متماسكة. يحتاج إلى تركيب مقبض وتجربة قطع.»\u003c/p>\u003cp>قال لين: «أقصر منجل في السوق يقطع القصب اليابس.»\u003c/p>\u003cp>أجابه تشانغ: «حين يركب له مقبض لا يتحرك.»\u003c/p>\u003cp>كان ثمة قصب يابس قرب الساقية القديمة. ساروا إليه بعد أن لفوا الأداة بخرقة، وأخذ تشانغ معه قطعة خشب مؤقتة ليمسكها بها. لم يذهبوا بعيداً؛ الأرض حول الماء كانت لينة، والطين يمسك بنعل الحذاء. اختار تشانغ عوداً يابساً، وثبته بقدمه، ثم أمر لين أن يقطع.\u003c/p>\u003cp>استعمل لين الأداة بحركة قصيرة. انحنى العود، ولم يقطعه من المرة الأولى. احتاج إلى ضربة ثانية، فضرب بحذر. انفصل القصب، لكن المنجل تحرك في الخشب المؤقت، وكاد ينزلق من يده.\u003c/p>\u003cp>شد لين قبضته، ثم توقف. «المقبض يتحرك.»\u003c/p>\u003cp>قال تشانغ: «قلت لك.»\u003c/p>\u003cp>لم يكن في صوته انتصار. تناول المنجل، وفحص الفتحة التي لم تُنه بعد. كان الخشب المؤقت أعرض من اللازم، ولم يسند انحناء القبضة. أعاد الأداة إلى خرقتها، وربطها بحبل حتى لا تتأرجح.\u003c/p>\u003cp>قالت شين يان: «لا نكرر الاختبار بهذه القطعة الخشبية. قد تسقط وتجرح يد أحد.»\u003c/p>\u003cp>عادوا إلى الدكان مشياً. لم يحمل لين الحديد؛ تركه في يد تشانغ، ومشى خالي اليدين يحمل دفتره. في الطريق مر بهما فلاح يسأل إن كانوا صنعوا سكة جديدة. لم يَعِداه بشيء. أراه تشانغ الحديد الذي لم يكتمل، وقال: «ليس للبيع.»\u003c/p>\u003cp>توقف الرجل عند كلمة «ليس». «حتى للتجربة؟»\u003c/p>\u003cp>«بعد أن نثبتها ونختبرها.»\u003c/p>\u003cp>هز الفلاح رأسه، ولم يساوم. كان يعرف أن قطعة مكسورة في الأرض ستضيع عليه يوماً من الحرث. مضى إلى السوق، بينما دخل الثلاثة الدكان.\u003c/p>\u003cp>رتبت شين يان السجل. كتبت أن الوقود المستهلك في التجربة أكثر مما توقعوا، وأن الوزن بعد الطرق تقريبي، وأن الحديد المستعمل أعطى منجلاً واحداً غير جاهز للبيع، وقطعة سكة لم تجتز الفرز. أضاف لين أن الجزء الذي رفضه تشانغ سيبقى خردة إلى أن يعاد تقييمه، لا أن يُخلط بحديد الدفعة التالية.\u003c/p>\u003cp>قال: «إذا بعنا واحداً فقط، فلن يعوض أجرة هذا اليوم.»\u003c/p>\u003cp>قالت شين يان: «ولا نبيع منجلاً قد يؤذي صاحبه كي نعوضها.»\u003c/p>\u003cp>لم يعترض. عاد ذهنه إلى النار الصغيرة، إلى ما بقي من الفحم، وإلى الساعات التي خسرها الطحن حين توقفوا للعمل. لم تكن الحسابات مريحة، لكنها لم تُخفِ شيئا.\u003c/p>\u003cp>قبل أن يغلقوا الدكان، أعاد تشانغ المنجل إلى خرقة نظيفة، ووضعه قرب باب الورشة حتى يأخذه يانغ حين يأتي. بقيت قطعة السكة على رف منفصل، وعليها علامة الفحم التي تدل على أنها لم تجتز الاختبار.\u003c/p>\u003cp>قال تشانغ: «إذا ثبت المقبض غداً، نختبره مرة أخرى. لا قبل ذلك.»\u003c/p>\u003cp>أغلق لين الدفتر. كان في السجل الآن أداة واحدة ذات حد متماسك، ومقبض يتحرك. لم يكن ذلك منجلاً يباع. لكنه كان أول شكل نافع خرج من الحديد القديم، وشيء واحد فقط بقي بينه وبين اليد التي ستجربه: خشب لا ينزلق.\u003c/p>"},{"n":48,"t":"الفصل الثامن والأربعون: قبل البيع","b":"\u003cp>في صباح اليوم السادس والأربعين بعد المئة، جاء يانغ إلى دكان تشانغ ومعه مقبض من خشب جاف. كان قد اختار غصناً سميكاً من شجرة سقطت قبل الشتاء، ونزع قشره، لكنه لم يحفر موضع المنجل بعد.\u003c/p>\u003cp>قال تشانغ: «أبطأت.»\u003c/p>\u003cp>«لو أخذت خشباً أخضر لوصلت أسرع.» وضع يانغ المقبض على الطاولة. «لكنه كان سينكمش حين يجف.»\u003c/p>\u003cp>مد تشانغ يده، ورفع القطعة نحو الضوء. «أين اتجاه العروق؟»\u003c/p>\u003cp>أشار يانغ إلى الخطوط التي امتدت طولاً. «تسير مع المقبض. لا تقطعها عرضاً في موضع الثقب.»\u003c/p>\u003cp>كان شياو دو قد وصل خلف لين، ويحمل سلة خبز من النزل. رأى المقبض، فاقترب منه أكثر مما ينبغي. قال: «إنه يبدو قوياً من هنا.»\u003c/p>\u003cp>أوقفه يانغ بكفه. «من أين تعرف؟»\u003c/p>\u003cp>مد الصبي يده، ثم سحبها. «لأنه سميك.»\u003c/p>\u003cp>قال يانغ: «السماكة لا تكفي. انظر إلى العروق. إذا قطعتها هنا، يخرج الشق على طول الخشب حين تسحب المنجل.»\u003c/p>\u003cp>أدار المقبض ببطء حتى ظهرت عقدة داكنة قرب الطرف. سأله: «لو حفرت من هذا الجانب، ماذا يحدث؟»\u003c/p>\u003cp>تأمل شياو دو العلامة. «العقدة تسحب الشق إليها؟»\u003c/p>\u003cp>«قد تفعل. لا تعرف حتى تجرب القطعة، لكنك تعرف أن هذا الموضع أضعف. لذلك نتجنبه.»\u003c/p>\u003cp>لم يمد الصبي يده إلى الخشب مرة أخرى. طلب منه يانغ أن يساعده في حمله إلى السندان، وأعطاه الطرف الخفيف. تبعاه حتى الطاولة، ثم جعله يضعه على فرشة من الخيش بدل الحجر. قال له: «لا تترك الخشب يرتطم. الشقوق الصغيرة لا تصيح حين تبدأ.»\u003c/p>\u003cp>كان تشانغ قد غسل يديه، لكنه لم يمسك المنجل بعد. وضع المقبض فوق لوح ورسم محيط قاعدة الأداة عليه بالفحم. طلب من يانغ أن يثبت الخشب، بينما صنع فتحة ضيقة على دفعات، يجرب فيها قطعة الحديد بعد كل قليل. لم يدفعها بالقوة. كلما علقت، أخرجها ونظر إلى موضع الاحتكاك.\u003c/p>\u003cp>قال لين: «يمكنني أن أجعل الفتحة أوسع قليلاً من هنا.»\u003c/p>\u003cp>رد تشانغ: «وإذا صارت أوسع من اللازم، لن يمسك الخشب الحديد.»\u003c/p>\u003cp>قالت شين يان: «نزيل من المواضع المرتفعة فقط. لا نطارد راحة اليد قبل أن نثبت القاعدة.»\u003c/p>\u003cp>أخذت المنجل من تشانغ، وقلبته حتى صارت حافته بعيداً عن يده، ثم حددت موضعاً صغيراً من الخشب يضغط على طرف المعدن. صنع تشانغ شقاً أدق، وحين أعاد تركيب القطعتين استقر الحديد من دون حركة ظاهرة.\u003c/p>\u003cp>لم يطرقوه بمسمار عشوائي. وضع تشانغ وتداً من خشب قاس في الثقب الذي أعده، ثم قطعه على مستوى المقبض. بقي المقبض أثخن قليلاً من راحة لين، فنعّم يانغ موضع الإمساك بسكينه، مع إبقاء جانب كاف لا يضعف الجسم.\u003c/p>\u003cp>قال شياو دو: «هل صار جاهزاً؟»\u003c/p>\u003cp>أجاب تشانغ: «صار له مقبض.»\u003c/p>\u003cp>«وهل نبيعه؟»\u003c/p>\u003cp>«بعد أن نختبره.»\u003c/p>\u003cp>أخرجت شين يان خرقة رقيقة ولفتها حول الجزء القريب من الحافة، بحيث يبقى المقبض مكشوفاً. ربطت على الخرقة علامة صغيرة من خيط أزرق. قالت: «هذه ليست زينة. إذا رجعت القطعة إلينا، نعرفها من علامتها. لا نكتب علامة تشبه ختم جهة رسمية، ولا نقول إنها ضمان لكل عيب. نقول إننا نفحصها إذا عاد صاحبها بما ظهر من خلل.»\u003c/p>\u003cp>قال لين: «ويكون لنا سجل بالقطعة والحديد الذي خرجت منه.»\u003c/p>\u003cp>«وبمن جربها.»\u003c/p>\u003cp>كتب رقم الأداة في الدفتر، ووصف المنجل بأنه قطعة واحدة من حديد قديم، مطروقة في ورشة تشانغ، ومقبضها من خشب يانغ. لم يسمه نوعاً من الحديد لا يعرفونه، ولم يضع له درجة جودة. سجلوا تاريخ التجربة، والعلامة، واسم من شارك في تركيب المقبض.\u003c/p>\u003cp>أخذ تشانغ الأداة وخرجوا إلى قطعة أرض ترابية خلف الورشة، حيث بقيت عيدان قصب يابس من الموسم الماضي. لم يكن المكان حقلاً ولا أرضاً صالحة للحرث. ثبت تشانغ ساقاً بين حجرين، وأعطى المنجل لليانغ.\u003c/p>\u003cp>قال: «جرّب بيدك. لا تضربه كأنك تقطع خشباً.»\u003c/p>\u003cp>أمسك يانغ المقبض، ومرر الحافة على القصب. قطع الساق من المرة الأولى، لكن طرفها ترك شعيرات طويلة. جرب ساقاً ثانية بحركة أقل قوة، فانفصلت أنظف. ثم وضع الأداة بين يديه وحاول ثنيها قليلاً من غير أن يلتوي المقبض. لم يسمعوا فرقعة، ولم يفتح الخشب عند الوتد.\u003c/p>\u003cp>أعاد يانغ المنجل إلى تشانغ. أمسكه الحداد من قاعدته، وراجع موضع الوتد، ثم أعطاه إلى شين يان كي تكتب نتيجة الاختبار. قالت: «قطع ساقين يابستين. لم يتحرك المقبض. لا نعرف كيف يتصرف مع قصب أخضر أو استعمال طويل.»\u003c/p>\u003cp>«هذا يكفي للبيع؟» سأل لين.\u003c/p>\u003cp>قال تشانغ: «يكفي لأقول إن هذه القطعة اجتازت ما اختبرناه. لا أكثر.»\u003c/p>\u003cp>لم يرفع لين صوته، لكنه اعترض: «إذا قلنا للناس كل ما لا نعرفه، ظنوا أننا لا نثق بما صنعنا.»\u003c/p>\u003cp>قالت شين يان: «الثقة لا تزيد حين نخفي حد الاختبار.»\u003c/p>\u003cp>بقي لين ينظر إلى المنجل. أراد أن يقول إن السعر سيبدو مرتفعاً إذا أرفقوا به كل تلك الشروط. ثم تذكر الحديد الذي فرزوه، والقطعة التي رفضها تشانغ، والساعات التي توقفت فيها الطاحونة عن العمل. قال: «نشرح ما جربناه، ثم نطلب سعراً يغطي العمل. لا نعد بعمر لا نملكه.»\u003c/p>\u003cp>هزت شين يان رأسها، لا موافقة كاملة ولا اعتراضاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مر بهما رجل من طرف السوق، يحمل منجلاً قديماً مربوطاً بخيط عند المقبض. رفع عينيه إلى الأداة في يد تشانغ، ثم نظر إلى العودين المقطوعين.\u003c/p>\u003cp>قال: «هل تبيعون مثلها؟»\u003c/p>\u003cp>أجاب تشانغ: «هذه اجتازت اختباراً قصيراً. لم أقرر بعد أن أصنع غيرها.»\u003c/p>\u003cp>فحص الرجل العلامة الزرقاء، من دون أن يلمس الحافة. «أحتاج سكة للمحراث، لا منجلاً. كم تأخذون؟»\u003c/p>\u003cp>نظر لين إلى القطعة غير المكتملة على الرف. «لم تجتز الفحص. لا أستطيع أن أحدد لك ثمنها كأنها جاهزة.»\u003c/p>\u003cp>قال الرجل: «حديدكم موجود. والعمل معروف. أعطني رقماً.»\u003c/p>\u003cp>قال لين: «إذا أعطيتك رقماً قبل أن نعرف كم بقي منها صالحاً، أكون أبيعك وعداً.»\u003c/p>\u003cp>تدخل تشانغ: «السكة التي تراها لن أبيعها. فيها خط لا أثق به.»\u003c/p>\u003cp>قال الرجل بامتعاض: «إذن لماذا أتيت إلى هنا؟»\u003c/p>\u003cp>أجاب تشانغ: «لأنك سألت عن سكة. لو قلت لك نعم، ثم انكسرت في أرضك، عاد الضرر إليك.»\u003c/p>\u003cp>لم يبدُ الرجل راضياً. أشار إلى المنجل الجديد. «وهذا؟»\u003c/p>\u003cp>«لا أعرف ثمنه بعد.» قال لين. «نحسب الحديد الذي استهلكناه، والفحم، والعمل، ووقت الطحن الذي خسرناه. ثم نقول لك السعر قبل أن تشتري.»\u003c/p>\u003cp>ضحك الرجل من أنفه. «تريدون أن تحسبوا حتى الهواء؟»\u003c/p>\u003cp>قالت شين يان: «الهواء لا نشتريه. الفحم نشتريه.»\u003c/p>\u003cp>حدق فيها، ثم عاد إلى لين. «ارجع إليّ حين يكون عندك رقم. لا أشتري شيئاً لا أعرف ثمنه.»\u003c/p>\u003cp>«هذا حقك.»\u003c/p>\u003cp>مضى الرجل، وقد بقيت سكة المحراث المكسورة مربوطة إلى كتفه. لم يذكر تشانغ اسمه، ولم يطلب منه أن ينتظر. غادر الثلاثة السوق في طريقهم إلى الورشة.\u003c/p>\u003cp>في الطريق مروا من طرف الساحة. كان عاملان يتجادلان على أداة قديمة، يلوم كل منهما الآخر على شق ظهر قرب موضع التثبيت. لم يدعهم لين إلى الورشة، لكنه توقف حين سمع أحدهما يقول إن حداد القرية سيطلب نحاساً أكثر من ثمن الحديد كله. سألهما تشانغ من أصلح الأداة آخر مرة. لم يعرفا، ولم يذكرا متى ظهر الشق. قال لهما أن يتركاها حتى يفحصها، لا لأنهما اشترياها من مكان آخر، بل لأن رؤية موضع العيب أهم من تخمينه.\u003c/p>\u003cp>قال أحدهما: «إن قلت إنها لا تصلح، نحتاج غيرها.»\u003c/p>\u003cp>«أقول ما أراه. لا أشتري قراركم.» أجابه تشانغ.\u003c/p>\u003cp>أراهم لين العلامة الزرقاء على المنجل، ثم أخفاها ثانية. قال إن العلامة تخص القطعة الوحيدة التي اختبروها، ولا تعني أن كل أداة في الورشة تحمل العلامة اجتازت الاختبار نفسه. لم يطلب الرجلان منه سعراً، لكن أحدهما سأل إن كان إصلاح الحديد يختلف عن شراء قطعة جديدة.\u003c/p>\u003cp>قالت شين يان: «يختلف. إذا كان الحديد ملكك، نحسب العمل والفحم. إذا أخذت حديداً من مخزوننا، يدخل ثمنه في الحساب. لا ينبغي أن يكون الرقم واحداً.»\u003c/p>\u003cp>نظر العامل إلى رفيقه. «إذن سنأتي بها.»\u003c/p>\u003cp>قال تشانغ: «أحضراها كما هي. لا تسخناها في بيتكما قبل أن أراها.»\u003c/p>\u003cp>لم يَعِدهم بشفاء الأداة، ولم يطلب عربوناً قبل فحصها. تابعا طريقهما، بينما عاد الثلاثة إلى دكانه. جعل لين من الحديث سبباً ليضيف خانة «إصلاح حديد الزبون» في صفحة الدفتر، ثم رسم خطاً يفصلها عن خانة الأدوات التي تصنعها الورشة. لم يكن قد عرف كلفة الإصلاح بعد؛ أراد فقط ألا يضع الحسابين في عمود واحد.\u003c/p>\u003cp>قالت شين يان: «لا تسجل طلباً حتى يتركوا الأداة.»\u003c/p>\u003cp>«كتبت نوع الحساب، لا اسم زبون.»\u003c/p>\u003cp>«جيد. لا نريد أن يبدو الكلام وعداً.»\u003c/p>\u003cp>عند الباب، طلبت شين يان من لين ألا يكتب «عرض سعر» على لوحه. قال إنهم لم يعطوا الرجل رقماً. أجابته أن اللوح قديم، وقد يظن المار أن السعر الذي عليه يخص المنجل أو السكة. مسحوا العلامة التي وضعها شياو دو في الصباح، وأعادوا اللوح فارغاً إلى مكانه.\u003c/p>\u003cp>قال شياو دو: «كنت أكتب اسم الورشة فقط.»\u003c/p>\u003cp>«اكتب اسمها، ولا تكتب سعراً قبل أن نتفق عليه.»\u003c/p>\u003cp>أخذ قطعة الفحم وكتب الاسم في السطر الأعلى. بقي تحته فراغ واسع. سأله إن كان ينبغي أن يرسم صورة المنجل، فطلبت منه شين يان أن يرسم علامة بسيطة لا تشبه ختم الكاتب وو. رسم خطاً منحنياً صغيراً، ثم توقف كي يعرضه عليها. قالت إنه يصلح إذا لم يقلد العلامة الزرقاء المربوطة بالأداة.\u003c/p>\u003cp>عاد يانغ إلى الورشة، ورأى الرسم. طلب من شياو دو أن يترك مسافة بين اللوح وباب الدكان كي لا تحتك به الأداة عند إخراجها. ثم علمه أن يمسك المنجل من المقبض لا من الحافة، حتى لو كانت ملفوفة. كرر الصبي الحركة من غير سخرية، وأعاد الأداة إلى الطاولة.\u003c/p>\u003cp>قال يانغ: «لو سقطت، لا تعرف من أي جهة يضرب الحديد الأرض.»\u003c/p>\u003cp>سأل شياو دو: «حتى إن كان مربوطاً؟»\u003c/p>\u003cp>«الرباط يحمي الحافة، لكنه لا يمسك المنجل عنك.»\u003c/p>\u003cp>أخذت شين يان الدفتر، وفصلت صفحة الأداة عن صفحة أجر الطحن. كتبت في سجل الورشة اسم منجل واحد، وموضع العلامة، ومصدر الخشب والحديد، ونتيجة اختبارين فقط. لم تسجل اسم المشتري لأنه لم يوجد مشترٍ بعد. ثم وضعت بجانب الصفحة ورقة فارغة لطلبات الإصلاح، حتى لا يختلط ثمن القطعة الجديدة بأجر ترميم حديد يملكه الزبون.\u003c/p>\u003cp>قال لين: «هذا كثير لقطعة واحدة.»\u003c/p>\u003cp>«القطعة الواحدة هي التي ستعلّمنا ما نحتاج إلى تسجيله. إذا صنعنا عشرين، يصبح النقص أغلى.»\u003c/p>\u003cp>فتح صندوق الفحم، وأخرج حفنة صغيرة ليتأكد من أن الكيس لم يبتل. كانت الحبات قد بقيت جافة، لكنها لم تزد عما أشتروه. لم يكن شراء المزيد مبرراً حتى يقرروا إن كانوا سيشغلون الفرن لقطعة جديدة. أما المنجل الموجود، فحسبوا ما صرفه من الفحم وحده، من غير أن يضيفوا كلفة القطعة التي رفضها تشانغ إلى ثمنه مباشرة؛ سجلوا الحديد المرفوض خسارة للدفعة، ثم تركوا باب المراجعة مفتوحاً إذا أعادوا استخدامه.\u003c/p>\u003cp>قالت شين يان: «إذا وزعنا كل خسارة على أول قطعة، سيصير ثمنها أكبر من قدرة زبون واحد. لكن لا نمحو الخسارة أيضاً.»\u003c/p>\u003cp>«نضعها في حساب الدفعة.» قال لين.\u003c/p>\u003cp>«ونكتب أنها دفعة صغيرة، لا كلفة كل منجل نصنعه مستقبلاً.»\u003c/p>\u003cp>أعاد لين ترتيب الأرقام على ورقة مسودة. كتب تكلفة الحديد، والوقود، وأجر الطرق، والمقبض، ووقت توقف الطحن في أعمدة منفصلة. لم يكن لديه بعد ما يكفي ليحدد السعر؛ بعض الوقت لم يسجله ساعة بساعة، وبعض الفحم اختلط رماده ببقية الموقد. ترك الخانة التي تجمع الثمن فارغة.\u003c/p>\u003cp>أخرج لين دفتره. بدأ يقسم التكلفة إلى حديد مستهلك، وفحم، ووقت الحداد، والجزء الذي توقفوا فيه عن الطحن. لم يضع أجراً ثابتاً للمنجل قبل أن يسأل تشانغ عن عدد ساعات الطرق التي حسبها من يومه، ولم يخلط حصة هو سانيانغ من أجر الطحن بأجر الحدادة. أما القطعة التي لم تجتز الاختبار فسجلها خسارة مؤقتة، لا منجلاً ثانياً.\u003c/p>\u003cp>قالت شين يان: «لا نسعر السكة بهذه الحسابات بعد. لم نكمل واحدة قابلة للتجربة.»\u003c/p>\u003cp>«أعرف. لكن الرجل يريد رقماً.»\u003c/p>\u003cp>«حين نعرف كلفتها، نعطيه رقماً. لا نجعل استعجاله مقياساً للجودة.»\u003c/p>\u003cp>كتب لين ذلك في الهامش، ثم أغلق الدفتر. لم يبعوا المنجل في ذلك اليوم. بقي في مكانه وعلامته الزرقاء مربوطة إلى قاعدته. أما الرجل الذي طلب السكة، فقد صار لديه سبب واضح للعودة: أن يسمع رقماً لا يختبئ خلف التخمين. لم يكتبوا اسمه في سجل الزبائن لأنهم لا يعرفونه؛ احتفظ لين بوصف سؤاله فقط في الهامش، حتى لا ينسبوا إليه طلباً لم يقدمه. أغلقت شين يان الدفتر على صفحة المنجل، وتركت سطر السعر فارغاً إلى أن يجمعوا الحساب. وفي الورشة بقيت الأداة معلقة بعيداً عن الباب، لا علامة بيع عليها ولا إيصال لها.\u003c/p>"},{"n":49,"t":"الفصل التاسع والأربعون: ثمن السكة","b":"\u003cp>في صباح اليوم الثامن والأربعين بعد المئة، جاء الرجل الذي سأل عن سكة المحراث إلى دكان تشانغ، يحمل قطعة مكسورة ملفوفة بقماش خشن. كان الشق عند عنق السكة، قريباً من الموضع الذي تتصل فيه بالخشب.\u003c/p>\u003cp>وضعها على الطاولة من غير أن يفكها. قال: «هذه التي عندي. إن أصلحتموها اليوم، أزرع الطرف الشرقي بعد يومين. لا أستطيع شراء حديد جديد.»\u003c/p>\u003cp>فتح تشانغ القماش، ونظر إلى طرف الكسر. لم يلمس الحافة فوراً. مرر عينه على موضع التواء المعدن، ثم رفع القطعة إلى الضوء. «من أين انكسرت؟»\u003c/p>\u003cp>«من هنا.» أشار الرجل. «كانت تنحرف، فشدها ابني. لم يكن يجرها وحده.»\u003c/p>\u003cp>قال لين: «هل سخنها أحد قبل هذا؟»\u003c/p>\u003cp>«لا أعرف. اشتريتها من سوق السنة الماضية.»\u003c/p>\u003cp>قلب تشانغ السكة. كان على الحديد انحناء قديم، وفيه موضع أرق من بقية العنق. قال: «لا أستطيع أن أعدك أنها تعود كما كانت. أقدر أن أسخنها وأعيد طرق الجزء الملتوي، وأضيف رقعة من الحديد الذي عندك إن سمح سمكه. لكن هذا الموضع قد يبقى أضعف من الأصل.»\u003c/p>\u003cp>قال الرجل: «أحتاجها للعمل، لا لأنظر إليها.»\u003c/p>\u003cp>«ولهذا لا أبيعك كلاماً.» رد تشانغ. «نعمل عينة تثبيت عند العنق. إن لم تمسك بعد الطرق الخفيف، نعيدها لك كما هي ولا نأخذ أجرة الإصلاح.»\u003c/p>\u003cp>كانت شين يان قد جلست إلى جانب الدفتر، وبسطت ورقة لتسجيل ما يسمعونه. سألت الرجل: «إذا فشلت العينة، هل تتركها هنا؟»\u003c/p>\u003cp>«أتركها حتى تجربوا.»\u003c/p>\u003cp>«وإذا قبلتها، ندفع لك ثمن إصلاح العمل. الحديد ملكك، ولا نحسبه كأننا بعنا لك سكة جديدة.»\u003c/p>\u003cp>قال: «لا أريد سكة جديدة. أريد القديمة ألا تنكسر في التراب.»\u003c/p>\u003cp>سأل لين: «ما المقدار الذي تستطيع دفعه؟»\u003c/p>\u003cp>«ثماني نحاسات. لا أملك أكثر الآن.»\u003c/p>\u003cp>أدار تشانغ السكة في يده، ثم وضعها على الطاولة. «ثماني نحاسات لأجر العمل. لا تشمل شراء حديد آخر إن اضطررنا إليه. إن ظهر أننا نحتاج قطعة غير الموجودة عندك، نخبرك قبل أن نأخذها.»\u003c/p>\u003cp>قال الرجل: «ثمانٍ كثيرة على إصلاح.»\u003c/p>\u003cp>قالت هو سانيانغ من عند الباب: «والطحن الذي توقف حتى يطرقها؟»\u003c/p>\u003cp>التفتوا إليها. جاءت من النزل تحمل دفترها الصغير، وقد سمعت آخر الحديث. لم تدخل حتى أشار لها لين إلى المقعد.\u003c/p>\u003cp>قالت: «إذا أخذت الحدادة ساعات من النهار، لا يخرج من الطاحونة أجر طحن في تلك الساعات. لا يصير وقت العمل مجاناً لأن الحديد قديم.»\u003c/p>\u003cp>قال الرجل: «لكنني لم أطلب منكم أن توقفوا الطاحونة.»\u003c/p>\u003cp>أجابته هو سانيانغ: «صحيح. لذلك نسجل ما توقف، ونحسب أجر الإصلاح على قدر العمل. لا نأخذ حصتك من الطحن ولا ندخل في دينك.»\u003c/p>\u003cp>قال لين: «ثماني نحاسات مقابل إعادة طرق الجزء الملتوي وتثبيت العنق، بعد أن تقبل العينة. نحاستان عربوناً حين توافق على العينة ونكتب الاتفاق، وست نحاسات عند التسليم بعد اختبارها. وإذا احتجنا حديداً إضافياً، نتفق على ثمنه وحده قبل استعماله.»\u003c/p>\u003cp>لم يمد الرجل يده إلى النقود. «وإن لم تعجبني العينة؟»\u003c/p>\u003cp>قال تشانغ: «تأخذ سكتك. لا تدفع أجرة إصلاح. لا أضمن أن المعدن القديم لم يتشقق من قبل، لكن لا أطرقها بعد أن ترفض العينة.»\u003c/p>\u003cp>قال الرجل: «والقطعة التي تخرجونها من الكسر؟ أريدها.»\u003c/p>\u003cp>«إذا بقيت قطعة منفصلة، أعيدها لك مع السكة. إن كانت شظايا لا يمكن استعمالها، أجمعها في القماش كي تراها.» قال تشانغ. «لا أضم حديدك إلى خردة الورشة.»\u003c/p>\u003cp>لم يكن الرجل يريد أن يفقد شيئاً من الحديد، ولو كان صغيراً. فتح القماش، وبيّن أن سكة المحراث كانت قد أُصلحت مرة برقعة سميكة، وأنه لا يعرف من فعلها. فحص تشانغ موضع الرقعة، وأخبره أن ذلك قد يفسر التفاوت في العنق. لم يَعِد أن الرقعة القديمة ستصمد مع الطرق الجديد.\u003c/p>\u003cp>قال لين: «نسجل أن الإصلاح محصور في العنق والجزء الملتوي. لا نحسب ما لا نعمله، ولا نضمن ما لم نفحصه.»\u003c/p>\u003cp>سأل الرجل: «وإذا اضطررتم إلى إزالة جزء من الرقعة؟»\u003c/p>\u003cp>«نتوقف ونريك قبل أن نكمل.» قالت شين يان. «العينة التي قبلتها تخص هذا العمل، لكنها لا تعني أنك وافقت على إضافة معدن أو تغيير شكل السكة.»\u003c/p>\u003cp>نظر إلى الورقة. «اكتبوا ذلك.»\u003c/p>\u003cp>أضافت سطراً عن إيقاف العمل إذا ظهر أن الإصلاح يحتاج إلى حديد إضافي أو إزالة جزء غير مذكور. قرأته له، فطلب أن تكتب كلمة «قبل» بوضوح؛ لم يرد أن يُفهم أنه يدفع ثمن مادة لم يقبلها.\u003c/p>\u003cp>فك الرجل القماش ثانية، ومرر إصبعه على موضع الكسر من دون أن يلمس الحافة الحادة. «أروني العينة أولاً.»\u003c/p>\u003cp>بدأ تشانغ العمل على طرف من الحديد الزائد من السكة نفسها. لم يخلط بينه وبين معدن الورشة. سخن قطعة صغيرة، وطواها حول العنق ليعرف إن كان الحديد يحمل الطرق أو يتقشر. ضربها ثلاث مرات، ثم تركها تبرد ببطء. لم تتفتح حافتها، لكن تشانغ لم يعلن نجاحها. مسح الرماد، وفحص الخط الداكن عند طرفها.\u003c/p>\u003cp>قال: «هذه لا تضمن القطعة. لكنها تبين أن ما في السكة يمكن طرقه اليوم من غير أن يتفتت فوراً.»\u003c/p>\u003cp>أخذ الرجل العينة، قلبها بين أصابعه، ثم أعادها. «اقبلت. لا تحرقوا العنق كله.»\u003c/p>\u003cp>قال تشانغ: «الحرارة بقدر ما أحتاج. إذا بدأ يتشقق أوقف.»\u003c/p>\u003cp>كتبت شين يان الاتفاق قبل أن يدفع الرجل شيئاً. فصلت في السطر بين إصلاح الحديد القديم وشراء سكة جديدة، وذكرت ثماني نحاسات، اثنتين بعد قبول العينة، وستاً عند التسليم بعد الفحص. كما كتبت أن أي قطعة حديد تضاف لها سعر مستقل يتفقون عليه قبل استعمالها. قرأ لين النص بصوت مسموع، وأعاد الرجل سماعه، ثم وضع علامة إبهامه قرب اسمه.\u003c/p>\u003cp>قالت هو سانيانغ: «وماذا عن أجرة تشانغ؟»\u003c/p>\u003cp>قال لين: «تسجل مصروفاً للطلب. حصة الطحن شيء آخر.»\u003c/p>\u003cp>«اكتبها.»\u003c/p>\u003cp>كتبها. لم تكن ورشة كبيرة لها صندوق مستقل، ولم يكن بينهم عقد شراكة طويل. اتفقوا على أن تشانغ يتولى الحدادة، وأن لين وشين يان يقدمان التصميم والقياس، وأن الحديد والفحم والأجر تسجل كمصروف للطلب. لم ينقص ذلك من حصة هو سانيانغ في الطحن، ولم يجعل كل دخل الحديد جزءاً من حساب الطاحونة.\u003c/p>\u003cp>حين وافق الرجل على العينة، أخرج نحاستين ووضعهما أمام شين يان. لم تخلطهما بمال الدكان؛ رسمت لهما خانة في الدفتر، وكتبت «عربون إصلاح سكة، باقي ست». أخذ الرجل ورقة صغيرة تحمل نسخة مختصرة من الاتفاق. طواها وحفظها في ثوبه.\u003c/p>\u003cp>بدأ تشانغ يسخن عنق السكة على دفعات. لم يتركها في قلب الفحم. كان يرفعها ويديرها، يطرق موضعاً ثم يتوقف ليفحصه. تولى لين حمل الملقط بمقدار ما طلبه منه، بينما راقبت شين يان حركة الهواء والوقود. أوقفت التجربة لحظة حين اندفع الفحم إلى جانب واحد.\u003c/p>\u003cp>قال تشانغ: «أعيديه كما كان، لا أكثر.»\u003c/p>\u003cp>قالت: «إن زدت الهواء الآن، سيسخن الطرف أسرع من العنق.»\u003c/p>\u003cp>لم يجادل. انتظر حتى استقرت الجمرات، ثم واصل. لم يكن الإصلاح سريعاً، وكان الحديد القديم يذكرهم بكل ضربة أنه ليس قطعة جديدة. عند الظهيرة، أعاد تشانغ الطرق إلى الموضع الملتوي. ثبتت الحافة أفضل مما كانت، لكن اللون عند العنق ظل غير متساوٍ.\u003c/p>\u003cp>قال لين: «هل ننهيها الآن؟»\u003c/p>\u003cp>«بعد أن تبرد أفحصها. لا أختبرها وهي ساخنة.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أطفأوا النار عن السكة، وتركها تشانغ على جانب السندان حتى تبرد. لم يطلب من الرجل دفع بقية المال، ولم يطلبه الرجل. وقف عند الباب يراقب السندان، ثم قال إنه سيعود في الموعد المتفق عليه للاختبار والتسليم. دوّنت شين يان الموعد في طرف الاتفاق، حتى لا يصبح الوعد الشفهي تاريخاً مختلفاً في ذاكرة كل واحد منهم.\u003c/p>\u003cp>جمع لين وشين يان أرقام الوقود والحديد والعمل. وزن الفحم قبل التجربة وبعدها، وسجل الحديد الذي أزيل من الحافة، والوقت الذي بقي فيه تشانغ بعيداً عن إصلاح الأدوات الأخرى. لم يسجلوا الطاحونة على أنها أوقفت طوال اليوم؛ فقد استمرت بعض ساعات العمل، وتوقف الطحن في الفترة التي احتاجوا فيها إلى يد لين عند السندان.\u003c/p>\u003cp>قال لين: «تكلفة المنجل الأول لا تصلح سعراً للسكة. الحديد فيها ملك الرجل.»\u003c/p>\u003cp>قالت هو سانيانغ: «والفحم ليس ملكه. والعمل ليس هبة.»\u003c/p>\u003cp>فصلوا أولاً ما يخص الإصلاح عما يخص البيع. الحديد المكسور ملك الرجل، لذلك لم يسجلوا له قيمة شراء. الفحم الذي خرج من مخزونهم له ثمن، وساعات تشانغ لها أجر، ووقت لين عند السندان توقف فيه عن متابعة الطحن. لم تكن السكة الجديدة مثل هذه: حديد الورشة سيذهب كله إليها، ويحتاج الطرق إلى يومين على الأقل، بينما الإصلاح يأخذ جزءاً من يوم بعد أن يقبل الزبون العينة.\u003c/p>\u003cp>فتح لين صفحة المنجل، واستعملها ليتأكد من ألا يحسب الحديد نفسه مرتين. قال إن ثمن الحديد القديم الذي يصلح للاستخدام يقدره بثماني نحاسات للقطعة، بحسب ما دفعوه وما بقي منها صالحاً، والفحم نحاستان، وأجر تشانغ ست، ووقت توقف الطحن نحاستان. أضافوا نحاستين مقابل الأدوات والوقت الذي يضيع في فرز الحديد الرديء. صار سعر أول سكة من مخزون الورشة يعرضونها للبيع عشرين نحاسة. لم يضعوا قيمة للحديد الفاسد كله، ولم يخفوا أنه تقدير لقطعة بالحجم نفسه وبمخزونهم الحالي.\u003c/p>\u003cp>قالت هو سانيانغ: «العشرون ليست من حساب الطحن. ومن يشتريها يدفع ثمن الحديد والعمل معاً. لا تأخذوا النحاس من حصة الأجر ثم تقولوا إن الطاحونة كسبت.»\u003c/p>\u003cp>قال لين: «نسجلها في حساب الورشة. وإذا طلب أحد سكة أكبر أو أحضر حديده، لا نستخدم الرقم نفسه.»\u003c/p>\u003cp>«ولا ترفعونه لأن الرجل مستعجل.»\u003c/p>\u003cp>أجاب تشانغ: «ولا أخفضه حتى أبيع سكة لا أثق بها.»\u003c/p>\u003cp>كتب لين السعر على ورقة منفصلة، وأضاف بجانبه: «سكة واحدة من الحديد المتاح، بعد اجتياز الفحص. لا يشمل هذا إصلاح حديد الزبون.» لم يجعلوه سعراً ثابتاً لكل ما قد يصنعونه، ولم يقدموه قبل أن يعرفوا مقدار الحديد الصالح. كان رقماً محدداً يمكن قوله، مع حدوده.\u003c/p>\u003cp>قالت شين يان: «هذا سعر أولي لقطعة نختبرها. إذا تغير الحديد أو عدد ساعات الطرق، نعيد الحساب للقطعة التالية. لا نسميه سعراً ثابتاً لكل ما قد نصنعه.»\u003c/p>\u003cp>سأل لين: «هل نقوله لمن يسأل؟»\u003c/p>\u003cp>«نقوله مع وصف ما نعرفه. السعر الواضح لا يعني أن القطعة جاهزة.»\u003c/p>\u003cp>كان تشانغ قد عاد إلى العمل على منجل ثان لم يكتمل. عندما رفع الحديد إلى النار، ظهر فيه خط من قشرة قديمة. أخرجه قبل أن يتسع الخط، ووضعه في وعاء الخردة.\u003c/p>\u003cp>قال لين: «كان يمكن أن ننتظر ونرى.»\u003c/p>\u003cp>قال تشانغ: «رأيت ما يكفي.»\u003c/p>\u003cp>لم يعترض. كان يعرف الآن كم كلفهم أن يصدقوا اللون وحده، وكم يمكن أن يخسر الزبون إن لم يصدقوا الشق.\u003c/p>\u003cp>عند المساء حملت شين يان نسخة الاتفاق إلى النزل، وحفظت الأصل في الدفتر. وضعت نحاستي العربون في كيس منفصل عن الإيراد، ثم سجلت أن الباقي ست نحاسات بعد تسليم السكة. لم تختف الأجرة من الحساب، ولم يصبح الحديد القديم مجانياً لأن صاحبه جاء به.\u003c/p>\u003cp>قبل أن يغادر، وقف الرجل عند الباب وسأل: «متى أعود؟»\u003c/p>\u003cp>قال تشانغ: «بعد أن تبرد السكة تماماً ونفحص العنق. لا أريدك أن تحكم عليها وهي دافئة. نختبرها في قطعة أرض لينة بعد غد، إن لم يظهر شق عند الفحص.»\u003c/p>\u003cp>«ولماذا لا غداً؟»\u003c/p>\u003cp>أشار تشانغ إلى موضع الطرق. «لأن التسرع لن يجعل الحديد أقوى. أستطيع أن أريها لك بعد أن تبرد، لكن تجربة السحب تحتاج أن نثبتها في المحراث ونرى أثرها في التراب.»\u003c/p>\u003cp>قبل الرجل الموعد. لم يكن مرتاحاً إلى الانتظار، لكنه لم يجادل بعد أن رأى أثر الرقعة القديمة. أخذ نسخته من الاتفاق، وأعاد قراءتها حتى وصل إلى السطر الذي يوقف العمل إذا احتاجوا حديداً آخر. ثم طواها ووضعها في الجيب نفسه الذي حفظ فيه بقية المال.\u003c/p>\u003cp>سألت شين يان: «هل تحمل معك ما يكفي لست نحاسات؟»\u003c/p>\u003cp>قال: «أبقيتها في البيت. لا أريد أن أخرجها قبل أن أرى السكة.»\u003c/p>\u003cp>«هذا حقك. لا نريدها قبل التسليم.»\u003c/p>\u003cp>خرج الرجل، وبقيت السكة على الطاولة حتى تبرد. جمع تشانغ الأدوات التي استخدمها، بينما فحص لين سطح العنق من غير أن يضغط عليه. لم تظهر شقوق جديدة، لكنه لم يضع علامة النجاح. كتبوا أن الفحص البصري الأول لم يبين شقاً، وأن اختبار السحب مؤجل إلى الموعد المتفق عليه.\u003c/p>\u003cp>حين أغلقت شين يان الدفتر، لم تكن هناك علامة «تم»؛ بقيت خانة التسليم فارغة، وإلى جانبها رقم ستة ينتظر دليله.\u003c/p>\u003cp>ثبتت شين يان النسخة في غلاف الدفتر كي لا يضيع ترتيب البنود. لم يضع لين الست نحاسات في كيس المصروف قبل قبضها؛ بقيت ديناً للورشة لا مالاً في يدها. أغلق تشانغ صندوق الخردة على القطع التي أزالها، وكتب عليها اسم صاحب السكة.\u003c/p>"},{"n":50,"t":"الفصل الخمسون: حافة في التراب","b":"\u003cp>في صباح اليوم الخمسين بعد المئة، حمل تشانغ السكة التي أصلحها ملفوفة بالقماش، وسار مع لين إلى قطعة الأرض التي وافق صاحبها على تجربتها فيها. لم تكن أرضاً جافة تماماً؛ انحسر عنها الثلج، وظهرت بقع من التراب اللين، لكن سطحها لم يجف بما يكفي للحرث. لم يكن الفلاح يريد زرعها الآن. أراد أن يرى إن كانت السكة ستنحني عند أول مقاومة.\u003c/p>\u003cp>لحقت بهما شين يان، ومعها نسخة الاتفاق والدفتر، وقد ربطت شالها حول بطنها كي لا يجره الهواء. بقيت هو سانيانغ في النزل لتحسب أجور الطحن. منع لين زوجته من حمل السكة، فاكتفت بالدفتر وجلست عند طرف الأرض لتسجل الاختبار. عند باب الورشة، حاول لين أن يأخذ السكة عن تشانغ، فقال الحداد: «أستطيع حملها.»\u003c/p>\u003cp>«أعرف. لا أريد أن أتركك تحملها وحدك إذا تعبت.»\u003c/p>\u003cp>نظر تشانغ إليه، ثم ناوله طرف القماش ليحمل نصف الوزن. مشيا حتى قطعة الأرض. كان الفلاح ينتظرهما قرب المحراث، وقد غسل الطين عن الخشب، لكنه ترك أثر استعماله واضحاً عند المقبض.\u003c/p>\u003cp>قال: «هل أصلحتموها؟»\u003c/p>\u003cp>قال تشانغ: «أعدنا طرق العنق. سنختبرها هنا. لا أجعلها جديدة؛ الحديد نفسه قديم.»\u003c/p>\u003cp>فك لين القماش، وأظهر الموضع الذي أصلحوه. أشار إلى الحافة الأرق وإلى موضع التثبيت. لم يقل إنها مضمونة أبداً. قال: «نجرب سحباً قصيراً أولاً. إذا ظهر تشقق أو انحناء نوقف، ولا نجرها في الأرض كلها.»\u003c/p>\u003cp>لم يخف الرجل خيبته. «أحتاج أن أزرع قريباً.»\u003c/p>\u003cp>قالت شين يان: «والاختبار هنا يعطيك جواباً قبل أن تخاطر ببذورك.»\u003c/p>\u003cp>أخذ الفلاح السكة، وأدخلها في قاعدة المحراث. جرب أن يثبتها بيده، ثم دفع الوتد حتى استقر. راقب تشانغ الخشب، فيما جلست شين يان على حجر منخفض وفتحت دفترها.\u003c/p>\u003cp>قال لين: «اسحبها في هذه البقعة. لا تدخل الجزء الأشد صلابة بعد.»\u003c/p>\u003cp>أمسك الرجل بالمحراث، وجره خطوتين في التراب اللين. انزاحت طبقة السطح، وترك الحديد شقاً ضيقاً. توقف، وانحنى ليتفقد الوتد. لم يتحرك.\u003c/p>\u003cp>قال تشانغ: «مرة أخرى، بضغط أقل.»\u003c/p>\u003cp>أعاد الرجل السحب، ثم زاد الضغط قليلاً حين وصل إلى حافة البقعة. اصطدم الحديد بكتلة تراب متماسكة. سمعوا احتكاكاً خشناً، وتوقف المحراث. لم ينحن العنق، ولم ينفلت التثبيت. لم يدفعه تشانغ إلى اختبار أقسى؛ أخرجوا السكة ونظروا إلى الحافة.\u003c/p>\u003cp>قال لين: «لا شق ظاهر.»\u003c/p>\u003cp>قال تشانغ: «ولا يعني ذلك أنها لا تنكسر بعد شهر. تعود بها إلينا إذا ظهر كسر عند موضع الطرق.»\u003c/p>\u003cp>سأل الرجل: «أصلحها مجاناً؟»\u003c/p>\u003cp>قال تشانغ: «إذا ظهر أن عيب الصنعة هو الذي كسرها، نعيد النظر فيها بلا أجرة إصلاح. أما إن صدمت حجراً كبيراً أو انكسرت في موضع آخر، نفحص السبب أولاً.»\u003c/p>\u003cp>أضافت شين يان: «هذا المكتوب في الإيصال: حق الرجوع إذا ظهر كسر من الصنعة. لن نكتب وعداً أوسع مما اتفقنا.»\u003c/p>\u003cp>مد الرجل يده إلى العنق، ولمس المعدن عند موضع الطرق. بقي خشناً، وآثار المطرقة ظاهرة فيه. سأل إن كان هذا يعني أن الإصلاح لم يكتمل. أجابه تشانغ أن الأثر لا يساوي شقاً، وأنه يقدر أن ينعّم السطح أكثر، لكنه لا يريد إزالة معدن سليم لمجرد أن يبدو أملس. طلب الرجل أن يرى موضع الوتد من الجانب، ففكّاه مرة أخرى وأظهرا له كيف يستند الخشب على قاعدة السكة.\u003c/p>\u003cp>قال الفلاح: «إذا لان الخشب بعد المطر؟»\u003c/p>\u003cp>أجاب يانغ، الذي كان قد لحق بهم بعد أن أنهى عمله في السقف: «تراقب الوتد. إذا صار يتحرك، لا تضربه حتى يشق المقبض. أخرجه، وجفف الخشب، ثم أعد تثبيته. الخشب لك، وأصلحه إن احتجت.»\u003c/p>\u003cp>نظر الرجل إلى يانغ. «والخشب الجديد؟»\u003c/p>\u003cp>«لا تجعله أخضر. الخشب الرطب ينكمش حين يجف.»\u003c/p>\u003cp>أعاد الفلاح تركيب القطعة بيده. هذه المرة لم يستعمل مطرقته، بل ضغط الوتد حتى استقر، ثم جر المحراث مقدار خطوة. وقف يانغ قربه، ولم يمسك المقبض عنه. تركه يختبره بنفسه، ثم أشار إلى أن السكة لم تتحرك.\u003c/p>\u003cp>قال تشانغ: «الاختبار انتهى. إن أردت الزرع، أنت تختار يومه. نحن رأيناها في التراب اللين فقط.»\u003c/p>\u003cp>كان الرجل يريد سماع أن العمل سيبدأ فوراً، لكن شين يان أشارت إلى حافة الأرض حيث بقي الماء ظاهراً. «هذه ليست أرضاً ربيعية كاملة. البذور لا تحتاج أن تُدفن في طين كهذا.»\u003c/p>\u003cp>حدق الرجل في التراب، ثم جمع البذور التي كانت في كيس صغير عند خصره وأعادها إلى ثوبه. لم يرد أن يخسرها ليكسب يوماً. قال إنه سيصلح جزءاً من الحقل حين تجف بقية الأرض، وسيستخدم السكة في مساحة صغيرة أولاً.\u003c/p>\u003cp>قرأ الرجل السطر ببطء. لم يكن سريعاً في القراءة، فقرأت له شين يان العبارة مرة أخرى. سألها عن كلمة «الصنعة»، فقالت إنها تعني خللاً من الطرق أو التثبيت، لا كل ما يمكن أن يصيب الحديد بعد استعماله. نظر إلى السكة، ثم إلى المحراث. بدا أنه يزن إن كان سيقبل هذا الحد من الضمان.\u003c/p>\u003cp>قال لين: «إذا لم تقبل، نعيدها لك ولا تأخذها. لك العربون في الحساب، وسنردّه.»\u003c/p>\u003cp>«لا.» أجاب الرجل. «قبلت العينة. أريد أن أستعملها.»\u003c/p>\u003cp>أخرجت شين يان الإيصال. دوّنت فيه أن الإصلاح كلف ثماني نحاسات، وأن عربون نحاستين قد دُفع، وأن ست نحاسات بقيت عند التسليم. أضافت أن الحديد الأصلي ملكه، وأنه اختبر السكة في تربة لينة، وأن حقه في العودة قائم إذا ظهر خلل من الصنعة. قرأ لين الإيصال بصوت واضح، ثم طلب من الرجل أن يضع علامته.\u003c/p>\u003cp>وقّع الفلاح بعلامة بسيطة من خطين. دفع ست نحاسات، فعدها لين واحدة واحدة قبل أن يضعها في الكيس. لم يخلطها مع العربون. كتبت شين يان في الدفتر «اكتمل أجر إصلاح السكة» وأغلقت القيد.\u003c/p>\u003cp>كان الفلاح يستطيع الانصراف، لكنه أعاد تركيب السكة على المحراث. جرها مرة أخرى في البقعة نفسها. هذه المرة ضغط بقوة أكبر قليلاً، ثم توقف وكأنه سمع صوتاً. ركع، ومرر ظفره حول عنق الحديد. لم ير شقاً. رفع رأسه، فوجدهم ينظرون إليه، فتنحنح.\u003c/p>\u003cp>قال تشانغ: «هل تحركت؟»\u003c/p>\u003cp>«لا.» نفض يده. «أردت أن أتأكد.»\u003c/p>\u003cp>عاد إلى المحراث وجره خطوتين أخريين. لم يلتفت إليهم هذه المرة. كان يريد أن يعرف كيف تستجيب الأداة حين لا يراقبه صانعها، فدفعها في التراب اللين، ثم جذبها عكس الاتجاه. بقيت السكة في موضعها.\u003c/p>\u003cp>قال لين: «نكتفي بهذا. لا نختبرها حتى الكسر.»\u003c/p>\u003cp>أومأ الرجل. أخرج قطعة قماش وربط بها المحراث. «إن بقيت على هذه الحال، أعود بقطعة أخرى.»\u003c/p>\u003cp>قال تشانغ: «أحضرها أولاً. لا أعدك أن كل سكة تصلح للإصلاح.»\u003c/p>\u003cp>ابتسم الفلاح ابتسامة صغيرة. «أعرف. هذه لا أريد أن أخسرها.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند عودتهم إلى الورشة، كانت شين يان تراجع رصيد الفحم والحديد. أعادت
