اث دورات، أربعاً، والعجوز تيان يمسك الحبل ويهمهم له. كان الحمار يمشي بخطوات منتظمة ثقيلة، أذناه إلى الوراء، لا يرى شيئاً سوى الحبل. وحين انتهى، قال تيان بصوت متردد:\u003c/p>\u003cp>«أريد أن أسألكم.»\u003c/p>\u003cp>قال لين: «اسأل.»\u003c/p>\u003cp>«الحمار... هل سيتعب؟»\u003c/p>\u003cp>«سيعمل ساعتين، ثم يستريح ساعة. لن نتركه يعمل أكثر.» أجابت شين يان قبل لين. «وسيأكل شعيراً من الطاحونة.»\u003c/p>\u003cp>نظر الفلاح إلى الحمار طويلاً. «اسمه زاو. لأن لونه لون التمر.» ثم أضاف، كأنه يعترف بشيء: «ابني الذي مات علمني أن أسميه.»\u003c/p>\u003cp>لم يعلق أحد.\u003c/p>\u003cp>وبعد لحظة، قال: «طحن مجاني لعائلتي طوال الشتاء، وجزء من أجر طحن الحمار.»\u003c/p>\u003cp>«جزء من أربعين.» قالت شين يان.\u003c/p>\u003cp>«جزء من أربعين...» أعاد الكلمات بتأنٍّ، يحسبها في رأسه. «جزء من أربعين من مال حماري.»\u003c/p>\u003cp>«من مال الطاحونة. التي يدير حمارك حجرها.»\u003c/p>\u003cp>وافق. ولم يبتسم، لكن لين رأى أنه يربت على عنق زاو، ربتة سريعة وكأنه يبرئ نفسه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وفي اليوم الخامس ركّبوا الترس.\u003c/p>\u003cp>فصلوا محور الطاحونة الخشبي عن الدولاب المائي، وأبقوا الوصلة التي تنقل دورانه إلى الحجر. في الساحة ثبتوا العجلة الكبيرة أفقياً على عمود الحمار، وأوتادها بارزة إلى أسفل. وتحت حافتها ركبوا القفص الصغير على طرف محور الطاحونة الممتد من الغرفة. حين تدخل الأوتاد بين قضبانه من أعلى يدور المحور، ويدير الحجر بوصلته القديمة. بقي مسار الدابة حول العمود مكشوفاً في الساحة، بعيداً عن الجدار.\u003c/p>\u003cp>كل شيء بدا جميلاً. عجلة من الزان الأصفر، أوتادها بارزة على مسافات متساوية، وقفص صغير من ستة قضبان ملساء.\u003c/p>\u003cp>قال العجوز يانغ: «حرّكه.»\u003c/p>\u003cp>دفع لاو دونغ الذراع.\u003c/p>\u003cp>دارت العجلة الكبيرة ربع دورة. ودخل أول وتد بين قضيبين من قضبان الفانوس...\u003c/p>\u003cp>وتوقف.\u003c/p>\u003cp>لم يتحرك شيء. بقي الوتد عالقاً، وبدا القفص كله كأنه يشد نفسه نحو العجلة بقوة لا يراها أحد. ثم سمع الجميع صوت الخشب يئن.\u003c/p>\u003cp>صاح العجوز: «اترك!»\u003c/p>\u003cp>رفع لاو دونغ يديه. ارتد الذراع قليلاً. وفي مكان الوتد المحشور، صدر صوت رفيع ضعيف، تشقق صغير يتسلل من القاعدة.\u003c/p>\u003cp>وقف الجميع بلا حراك.\u003c/p>\u003cp>قال تشيو، بصوت خافت: «أنا قطعت الأوتاد. أنا قست.»\u003c/p>\u003cp>«لا.» قال العجوز يانغ. «لا أحد منا.»\u003c/p>\u003cp>فتح لين اللوحة في ذهنه، وركز على الترس.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: ترس الفانوس (عجلة أوتاد + قفص)\u003c/div>\u003cdiv>المشكلة: عرض ثلاثة أوتاد يزيد على الفراغ بين قضبان القفص بنحو 4 ملم\u003c/div>\u003cdiv>النتيجة: الوتد يعلق ولا ينزلق\u003c/div>\u003cdiv>الثقة: 74%\u003c/div>\u003cdiv>ملاحظة: يلزم فحص الأوتاد باليد لتحديد مواضع الاحتكاك.\u003c/div>\u003cdiv>طاقة التكامل: 92%\u003c/div>\u003c/div>\u003cp>قرأ لشين يان النتيجة بلغتهما، ثم قال للرجال: «العرض. بعض الأوتاد أعرض من الفراغ بين القضبان.»\u003c/p>\u003cp>«أعرف ذلك.» رد العجوز يانغ. «لكن لماذا؟ قست كل وتد بالخيط.»\u003c/p>\u003cp>«الخيط لم يبق بالطول نفسه.»\u003c/p>\u003cp>التفت الجميع إلى شين يان.\u003c/p>\u003cp>كانت جالسة على الحجر الأقرب، ودفترها على ركبتيها، ويدها تمسح بطنها بحركة بطيئة. قالت وهي تنظر إلى الخيط المعقود في يدها:\u003c/p>\u003cp>«استعملنا خيط القنب مرة وهو مبتل، ومرة بعدما جف. وشددناه بأيد مختلفة. المسافة التي نقلناها في الصباح لم تبق نفسها بعد الظهر.» رفعت رأسها. «أنا التي أعطيتهم الخيط. وأنا لم أنتبه.»\u003c/p>\u003cp>«كلنا لم ننتبه.»\u003c/p>\u003cp>«كان عليّ أن أنتبه.» وضعت الخيط على الدفتر. «نحتاج مقياساً لا يتغير بين أيدينا.»\u003c/p>\u003cp>وقفت، بصعوبة، ومدت يدها إلى العصا الطويلة التي استعملتها على الثلج، وتقدمت نحو الترس.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أشارت إلى اللوح: «أمهلوني ساعة.»\u003c/p>\u003cp>رسمت دائرة بالفحم على لوح أملس، وعلمت عليها مواضع الأوتاد الستين. صنعت من عود بلوط جاف مقياساً للفراغ بين قضبان القفص، ثم قارنته بعرض كل وتد. حين لم يدخل المقياس إلى جانب أحد الأوتاد وضعت تحته علامة، وأكملت حتى عادت إلى أول العجلة. ثم قالت للعجوز يانغ:\u003c/p>\u003cp>«ثلاثة أوتاد من الستين تزيد عن عرضها المطلوب. هنا يعلق الترس. باقي الأوتاد يمر.»\u003c/p>\u003cp>«وأين أخطأنا؟»\u003c/p>\u003cp>«نقلنا القياس بالخيط، فخرجت هذه أعرض مما يلزم. قارنتها بالعود وبمواضع القضبان، واحدة بعد أخرى.» أشارت. «هنا. وهنا. وهنا.»\u003c/p>\u003cp>قاس العجوز، وقلب شفتيه. «صحيح.»\u003c/p>\u003cp>نحتوا الأوتاد الثلاثة بالإزميل ملّيمتراً بعد ملّيمتر، وبرد تشيو الحافة بحجر ناعم. وحين أعادوا الدفع، دار الترس.\u003c/p>\u003cp>دار دورة، ثم دورة. وكان الصوت ناعماً: نقر خشبي رتيب، مثل خطوات هادئة على أرض مفروشة.\u003c/p>\u003cp>صاح شياو دو: «دار!» ثم: «العمة تريد أن تسمع!»\u003c/p>\u003cp>ركض وعاد بعد دقائق، ومعه هو سانيانغ، تجفف يديها بمريلتها. وقفت عند الباب، وحدقت في الحجر الذي يدور من تلقاء نفسه بعد أن دفعه رجلان، وفي العجلة الخشبية الصفراء، وفي شين يان التي كانت تمسك ذراعها وتتنفس بصعوبة.\u003c/p>\u003cp>لم تقل شيئاً. أخرجت من جيبها قطعة خبز ملفوفة، ووضعتها في يد شين يان، وانصرفت.\u003c/p>\u003cp>وجاء تشانغ بعد ذلك بساعة، ومعه قطعة حديد صغيرة سوداء مصقولة على شكل مخروط، جعلها عند الطرف السفلي للعمود الرأسي، حيث يدور على حجر القاعدة.\u003c/p>\u003cp>«رأس للمحور.» قال.\u003c/p>\u003cp>«لم نطلب...»\u003c/p>\u003cp>«الخشب على الحجر يأكل نفسه في شهر.» حك أذنه الصماء بإبهامه. «الحديد على الحجر يعيش سنة.» ثم وضع المخروط في مكانه بيديه، ودقّه دقتين، ومضى كما جاء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لكن الحمار لم يوافق في المرة الأولى.\u003c/p>\u003cp>حين ربطه تيان بالذراع الطويلة وشدّ الحبل، تقدم زاو ثلاث خطوات ثم توقف. أذناه إلى الأمام، وعيناه الكبيرتان على الحجر الدوار الذي يخشخش خلفه، والدقيق الأبيض ينفث من النافذة. لم يتحرك. دفعه تيان من الخلف، فرفس رفسة صغيرة، ورفع رأسه ونهق نهيقاً مبحوحاً هز الساحة كلها.\u003c/p>\u003cp>قال شياو دو بجدية: «يقول إنه لا يريد.»\u003c/p>\u003cp>«أعرف أنه لا يريد.»\u003c/p>\u003cp>«يقول إن عمله ليس أن يدور حول عمود.»\u003c/p>\u003cp>«شياو دو.»\u003c/p>\u003cp>«آسف.» ثم أضاف: «لكنه يقول أيضاً إن الصوت يخيفه.»\u003c/p>\u003cp>نظرت شين يان إلى الحمار، ثم إلى الغرفة الحجرية، ثم قالت: «غطوا عينيه.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«نضع حاجباً من القماش حتى لا يرى الحجر المتحرك. ثم يمشي تيان بقربه أول الدورات. لا نشده بالقوة.»\u003c/p>\u003cp>جاء شياو دو بخرقة سوداء، ووضعها العم تيان على عيني زاو برفق وهو يهمس في أذنه. وقف الحمار لحظة. ثم تحرك. خطوة، خطوتان، ثم انتظم.\u003c/p>\u003cp>مشى الحمار وانتظم نقر الأوتاد. تبعه تيان ممسكاً بالحبل، ثم أرخاه قليلاً حين لم يتوقف.\u003c/p>\u003cp>قال تيان بصوت متهدج: «هو يظن أنه ذاهب إلى مكان.»\u003c/p>\u003cp>قالت شين يان: «نوقفه عند أول تعب. هذا شرطنا.» أومأ تيان وبقي يمشي إلى جواره.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقفا آخر النهار، لين وشين يان، على حافة الساحة الصغيرة، حيث ربط العم تيان زاو بالذراع الطويلة.\u003c/p>\u003cp>كان الحمار يمشي حول العمود، رأسه منخفض، وحوافره تدوس الثلج المتراكم دائرة بعد دائرة. ومن الغرفة الحجرية تأتي خشخشة الحجر الدوار، ويرتفع غبار دقيق خفيف من النافذة.\u003c/p>\u003cp>تبع لين الأوتاد بإصبعه من بعيد، وعد المواضع الثلاثة التي أعادوا نحتها. لم يظهر عندها احتكاك جديد. وضع العجوز يانغ إلى جانبه وتداً احتياطياً وإسفيناً صغيراً.\u003c/p>\u003cp>«إن انكسر واحد، توقفون الدابة أولاً.»\u003c/p>\u003cp>قال شياو دو: «ثم نخرجه.»\u003c/p>\u003cp>«ثم تثبتون العجلة. لا تدخل يدك بين خشبتين تتحركان.»\u003c/p>\u003cp>أعاد الصبي الكلام، هذه المرة من دون تقليد. طوى يانغ خرقة حول الإزميل وتركه عند الوتد الاحتياطي.\u003c/p>\u003cp>قال لين: «جميع الأوتاد الستين صمدت.»\u003c/p>\u003cp>«حتى الآن.»\u003c/p>\u003cp>أشارت إلى كومة الأوتاد الباقية. «نترك هذه هنا. لا يحرقها أحد مع الحطب.» نقل لين الخشب إلى الرف، وأبعده عن فتحة النار. أخذ شياو دو قطعة فحم ووضع علامة على الكومة قبل أن يعود إلى باب الطاحونة.\u003c/p>\u003cp>«تقولين حتى الآن دائماً.»\u003c/p>\u003cp>«أنت من علمني.»\u003c/p>\u003cp>ثم ظلا واقفين، يحدقان في الحمار.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في تلك الليلة، في المخزن، جلست شين يان على القش وأشعلت الشمعة الصغيرة، ولم تقل شيئاً.\u003c/p>\u003cp>كان لين يرتب الأغطية. التفت، فوجدها تنظر إليه.\u003c/p>\u003cp>قالت: «أخرجهما.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«المكوّن. والحجر الصدئ.» لم يتغير صوتها. «أريد أن أمسكهما.»\u003c/p>\u003cp>لم يكن عنده ما يعترض به. لم يسبق أن طلبت ذلك منذ أن أخرجه في اليوم الأول. ركز على التخزين، وأحس الشيئين يستجيبان، وخرجا في كفه: القطعة السوداء المربعة بحجم الظفر، والحجر المحمر المسامي.\u003c/p>\u003cp>مدّ يده.\u003c/p>\u003cp>أخذت المكوّن أولاً. ثبتته بين إصبعيها، ورفعته إلى ضوء الشمعة. تذكر لين ملمسه الأملس وبرودته في كفه.\u003c/p>\u003cp>أغمضت عينيها.\u003c/p>\u003cp>مرّت عشر ثوانٍ. لم يتحرك وجهها. كانت أنفاسها هادئة جداً.\u003c/p>\u003cp>ثم قالت بصوت منخفض جداً:\u003c/p>\u003cp>«إنه دافئ.»\u003c/p>\u003cp>نظر إليها.\u003c/p>\u003cp>«دافئ؟»\u003c/p>\u003cp>«كأنه كان في جيب.» فتحت عينيها. «كأن أحداً حمله قبل لحظات.»\u003c/p>\u003cp>«أعطني.»\u003c/p>\u003cp>أعطته. أمسكه بين أصابعه. كان بارداً. بارداً كما كان دائماً، بلا نبض ولا حرارة، قطعة صغيرة ملساء كحجر نهر في الشتاء.\u003c/p>\u003cp>«بارد.»\u003c/p>\u003cp>«أعرف أنه بارد عندك.» لم تشك في كلامه ولم تبدُ متحيرة. «أنا فقط أقول ما أحسه.»\u003c/p>\u003cp>ركز عليه بالنظام. ارتعشت الحروف الزرقاء، كما ترتعش دائماً، ثم عادت:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل]\u003c/strong>\u003c/div>\u003cdiv>الهدف: مكوّن مجهول\u003c/div>\u003cdiv>\u003cstrong>غير قابل للتحليل.\u003c/strong>\u003c/div>\u003c/div>\u003cp>كالعادة. لا شيء.\u003c/p>\u003cp>أخذت منه الحجر الصدئ، وأمسكته في الكف الأخرى. قالت: «هذا بارد.» وأعادته. ثم قبضت على المكوّن مرة ثانية، وأدارته في أصابعها، وابتسمت ابتسامة صغيرة حائرة.\u003c/p>\u003cp>قال لين: «أعيديه. لا أحب أن يبقى خارجاً.»\u003c/p>\u003cp>«ولا أنا.»\u003c/p>\u003cp>أعاده إلى التخزين، وأغلق القائمة. ولم يذكرا الأمر.\u003c/p>\u003cp>ظل لين ينظر إلى الموضع الذي اختفت منه القطعة. مسحت شين يان كفها على الغطاء، ثم أطفأت الشمعة. لم يطلب منها أن تجرب ثانية.\u003c/p>\u003cp>استلقت على جنبها، ووضعت يدها على بطنها المنتفخ، وأغمضت عينيها.\u003c/p>\u003cp>وبعد صمت طويل، همست في الظلام، كمن تقنع نفسها:\u003c/p>\u003cp>«ربما يدي هي الدافئة.»\u003c/p>"},{"n":19,"t":"الفصل التاسع عشر: النهر ينام","b":"\u003cp>نام النهر في الليلة الحادية والستين.\u003c/p>\u003cp>لم يسمعه أحد وهو ينام. لكن في الصباح، حين وصل لين إلى المنعطف مع الفجر، وجد العجوز شو جالساً على صخرته المعتادة، وقصبته الطويلة موضوعة على ركبتيه، وقد توقف عن التظاهر بالصيد. كان ينظر إلى سطح الماء الذي لم يعد ماءً.\u003c/p>\u003cp>قال دون أن يلتفت: «نام.»\u003c/p>\u003cp>وقف لين بجانبه. امتد أمامهما النهر أبيض رمادياً، مستوياً، من ضفة إلى ضفة، كلوح من الحجر الأملس. لا موج ولا همس ولا خيوط ماء رفيعة ترتجف قرب الحاجز. حتى الحاجز نفسه صار قطعة من الجليد. وفي مكان الدولاب، انتصب الهيكل الخشبي نصف المرفوع على قوائم العجوز يانغ، وريشاته الدنيا محاطة بالجليد المتراكم في قاع المجرى.\u003c/p>\u003cp>ركز لين على الجليد عند قدميه.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل أساسي]\u003c/strong>\u003c/div>\u003cdiv>الهدف: جليد نهري\u003c/div>\u003cdiv>السماكة عند الضفة: 40–50 سم. في الوسط: 25–35 سم\u003c/div>\u003cdiv>يحمل وزن رجل. لا يحمل عربة محملة في الوسط بأمان\u003c/div>\u003cdiv>الثقة: 69%\u003c/div>\u003cdiv>طاقة التكامل: 94%\u003c/div>\u003c/div>\u003cp>«كم سمكه؟»\u003c/p>\u003cp>«ذراع عند الضفة. أقل في الوسط.» ضرب العجوز شو الجليد بطرف قصبته فأعطى صوتاً مكتوماً صلباً. «يحمل رجلاً في مواضع. أما العربة فلا آمن لها الوسط.» ثم أضاف: «ويحمل ما لا ينبغي أن يحمله.»\u003c/p>\u003cp>لم يفهم لين، وقرأها في وجهه: كان العجوز ينظر إلى حفرة صغيرة سوداء قرب الضفة المقابلة، حيث كُسر الجليد رقيقاً بين قصبتين.\u003c/p>\u003cp>«عبر طفل هنا بالأمس.» قال بصوته الهادئ. «ثم عاد. لم يقع. هذه المرة.»\u003c/p>\u003cp>ظل لين ساكناً. لم يتجمد النهر عند الطاحونة وحدها؛ صار سطحه ممراً يعبره أهل القرية اختصاراً للطريق، مع أن الجليد لا يضمن سلامة أحد.\u003c/p>\u003cp>قال العجوز شو: «لقد انتهى الدولاب.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لا أقول إنه مات. أقول إنه نام مثل النهر.» حرك القصبة. «وهناك من لا يستيقظ في الربيع.»\u003c/p>\u003cp>قبل أن يمضي، أخذ لين عصاً طويلة من كومة الحطب، وصعد إلى الجليد.\u003c/p>\u003cp>مشى ببطء، يختبر كل خطوة بطرف العصا، ويصغي إلى الصوت تحت قدميه: صوت صلب مكتوم يعني أن الجليد سميك، وصوت أجوف رقيق يعني أنه لا يصلح. في الوسط، قرب مجرى الدولاب القديم، سمع الصوت الأجوف، فتوقف.\u003c/p>\u003cp>صاح العجوز شو من الضفة: «ماذا تفعل؟»\u003c/p>\u003cp>«أرسم الطريق.»\u003c/p>\u003cp>«أي طريق؟»\u003c/p>\u003cp>«الذي يعبر منه الأطفال.» غرس العصا في ثقب صغير حفره بكعب حذائه، ثم ذهب لجلب أخرى. «عصي عند مواضع العبور وحدود الجليد الرقيق. ولا نعبر وحدنا، ولا تمر عربة.»\u003c/p>\u003cp>وقف العجوز شو صامتاً. ثم قام عن صخرته، وأخذ قصبته، وسار على الجليد حتى لحق به.\u003c/p>\u003cp>«هناك.» أشار إلى نقطة بعيدة. «العصا هنا سيئة. المياه تحتها تجري رغم الجليد.»\u003c/p>\u003cp>«كيف تعرف؟»\u003c/p>\u003cp>«لأني أصطاد هنا منذ أربعين سنة.»\u003c/p>\u003cp>وزعا خمس عشرة عصا قبل الظهر على طريق الاقتراب ومواضع العبور، يشدان على رأس كل منها خرقة حمراء، حتى لا يختصر الأطفال الطريق قرب الجليد الرقيق. وحين أنهيا، نظر العجوز شو إلى الصف الأحمر وقال بنبرة مختلفة: «جياو كان سيفعل هذا.»\u003c/p>\u003cp>وكانت تلك أول مرة يقول فيها شيئاً دون أن يسخر.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دفنوا العجوز لي في ذلك اليوم.\u003c/p>\u003cp>أحضر العجوز يانغ ولاو دونغ وتشيو ثلاث عربات من الحطب. ليس حطب الطاحونة، بل الحطب الذي أخرجته هو سانيانغ، في صمت، من مخزن النزل، دون أن تقول كلمة عن ثمنه. أوقدوا عليه نار الدفن في أرض جرداء خلف القرية، تحت شجرة جميز عارية، وتركوها تشتعل منذ الفجر حتى الظهر، يغذونها على مساحة ضيقة لتلين الأرض تحتها.\u003c/p>\u003cp>وقف القرويون حولها في دائرة واسعة، لا يقتربون من الحر ولا يبتعدون، وهم يتبادلون النظرات الثقيلة. كثير منهم لم يكن قد تكلم معها أكثر من كلمتين. وكثير منهم شاركها وجودها الصغير في السوق عشرين سنة.\u003c/p>\u003cp>حفر لين مع الرجال.\u003c/p>\u003cp>لم يطلب منه أحد، لكنه أخذ معولاً. كانت الأرض، حين انكسر قشرتها المحروقة، طرية لزجة سوداء من تحت، تفوح منها رائحة التراب المبلل والرماد. ضرب بمعوله ضربة بعد ضربة، وعرقه يتجمد على جبهته قبل أن يسيل، وصوت المعاول يتردد في الوادي مع نعيق غراب بعيد.\u003c/p>\u003cp>حين أصبحت الحفرة بعمق قامة، توقفوا.\u003c/p>\u003cp>جاء أربعة رجال بالجثمان ملفوفاً بحصير، كما هو، ملتفاً على نفسه، لأنه لم يعد ممكناً مد ساقيها. وضعوه برفق في القاع. نظر لين إلى الحصير الأسمر، الصغير جداً، وفكر أنه لم يعرف عنها شيئاً سوى أنها كانت تبيع المخللات.\u003c/p>\u003cp>قال شياو دو بصوت مبحوح: «كانت تعطيني حبات الفجل الحارة.»\u003c/p>\u003cp>لم يرد أحد.\u003c/p>\u003cp>وتقدمت هو سانيانغ. خلعت قفازها، ووقفت على حافة الحفرة، وفي يدها حفنة من البصل المجفف المربوط بخيط، كالذي كانت تأخذه العجوز كل خريف.\u003c/p>\u003cp>قالت بصوت جاف: «ستدفعين في الربيع.»\u003c/p>\u003cp>ثم رمت الحبل في الحفرة.\u003c/p>\u003cp>لم يبكِ أحد. لكن امرأة في الصف الأمامي، وقد مسحت وجهها بكمها، غنّت مقطعاً قصيراً من لحن حزين بصوت واهن، فتبعتها أخرى، حتى صار الغناء همهمة ثقيلة تلتف مع الدخان الرمادي المتصاعد من الحطب نحو سماء رصاصية.\u003c/p>\u003cp>أهال الرجال التراب. وحين انتهوا، تراجعت الدائرة، ومضى كل واحد إلى بيته بخطوات بطيئة.\u003c/p>\u003cp>بقيت شين يان وحدها قرب القبر، يدها على بطنها، تحدق في التراب الأسود الذي ظل يتصاعد منه خيط رفيع من البخار. لم تقل شيئاً. ولم يدنُ منها لين. وقف بعيداً، وترك لها صمتها.\u003c/p>\u003cp>حين التفتت أخيراً كان الدخان قد خف، وبقي الجمر الأحمر تحت الرماد يتنفس. مشت نحوه ببطء، وسندت يدها على كتفه، وسارا معاً على الطريق الذي حفرته أقدام المشيعين في الثلج.\u003c/p>\u003cp>قالت: «كتبت اسمها.»\u003c/p>\u003cp>«أين؟»\u003c/p>\u003cp>«في الدفتر. تحت الأحد عشر بيتاً. ليس لأنها من الأحد عشر، فبيتها لم يكن فيها.» أنفاسها بيضاء قصيرة. «كتبته لأنني خفت أن أنساه.»\u003c/p>\u003cp>«لن تنسي.»\u003c/p>\u003cp>«أنسى أشياء كثيرة.» نظرت إلى قدميها. «نحن طلبنا من هو سانيانغ ماء وخبزاً وغطاء. وفتحنا بابها كل يوم. لي بقيت في بيتها، ولم نطرق بابها مرة.»\u003c/p>\u003cp>لم يعرف ماذا يقول. شد على يدها.\u003c/p>\u003cp>«سأكتب أسماء البيوت التي لا يخرج من مداخنها دخان.» أكملت. «لا ننتظر حتى يأتي أصحابها يطلبون. نسأل عنهم أولاً.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«لا أعرف بعد.» وضعت رأسها على كتفه خطوتين. «لكنني سأعرف.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وجدها لين في المطبخ في المساء، جالسة على كرسيها أمام الموقد، وكتاب الحسابات مغلق على ركبتيها.\u003c/p>\u003cp>وقف عند الباب. ولم يعرف كيف يبدأ.\u003c/p>\u003cp>«الحطب.» قال أخيراً. «الذي أخرجتِه اليوم.»\u003c/p>\u003cp>«أعرف أي حطب.»\u003c/p>\u003cp>«سنردّ ثمنه.»\u003c/p>\u003cp>«لن تردا شيئاً.» لم تلتفت. «لم أكتب شيئاً في الكتاب.» ثم، بعد صمت: «ولن أكتب.»\u003c/p>\u003cp>«لماذا؟»\u003c/p>\u003cp>«لن تدفعا ثمنه. لي ليست من زبائنكما.» رفعت الكتاب قليلاً ثم وضعته. «عرفتها قبلكما بسنوات. هذا بيني وبينها.»\u003c/p>\u003cp>ظل واقفاً. ثم قال: «شكراً.»\u003c/p>\u003cp>«قلت لك، لا أحب هذه الكلمة.» لكن صوتها لم يكن حاداً. «اذهب. ضع شيئاً في معدتك. غداً يوم الحمار.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دارت الطاحونة بالحمار صباح اليوم الثاني والستين.\u003c/p>\u003cp>لم تكن لحظة احتفال. لا خطبة من شياو دو، ولا جمع من القرويين. فقط العم تيان وزاو، وحاجب القماش على عيني الحمار، وكيس دخن مفتوح، ولين وشين يان والعجوز يانغ وحدهم.\u003c/p>\u003cp>قال العجوز تيان: «هيا يا زاو.» وشد الحبل.\u003c/p>\u003cp>تحرك الحمار. خطوة، ثم خطوة. دارت الذراع الطويلة ببطء مؤلم، دورة، ثم دورة، وانغرزت حوافره في الثلج المتراكم. في الغرفة الحجرية، دار العمود، وعجلة الأوتاد الصفراء، والقفص الصغير الذي سموه ترس الفانوس. ثم دار الحجر.\u003c/p>\u003cp>نقر الخشب. وخشخش الحجر. وخرج الدقيق.\u003c/p>\u003cp>مدت شين يان يدها تحت القناة، فركت الحفنة بين إصبعيها، ثم عبست.\u003c/p>\u003cp>«خشن.»\u003c/p>\u003cp>«لأن الحمار أبطأ من الماء.»\u003c/p>\u003cp>«ولأن الحجر أبعد مما يجب.» أشارت إلى الرافعة. «أنزله قليلاً.»\u003c/p>\u003cp>أنزله لين بيده. جربت. «ما زال خشناً.» أنزله أكثر. جربت. «أقل.» ثم، بعد حفنة ثالثة: «هنا.» رفعت إبهامها.\u003c/p>\u003cp>أخذ شياو دو الدقيق بين أصابعه، ورفعه إلى أنفه وشمّه كأنه خبير، ثم تذوقه بطرف لسانه. «طعمه خشن وفيه تراب.»\u003c/p>\u003cp>فركت شين يان الدقيق مرة أخرى، فوجدت حبيبات صلبة. رفعت يدها فوراً: «أوقفه. الحجران يحتكان.» أعاد لين رفع الحجر قليلاً. أخرجوا الدقيق الأول جانباً، ونظفوا القناة قبل أن يعيدوا التجربة. ظلت شين يان تفحص كل حفنة حتى اختفت الحبيبات. قالت: «نقبل الدقيق أخشن قليلاً. لا نطحن الحجر في طعام الناس.»\u003c/p>\u003cp>غسلت شين يان يديها في الوعاء، ثم نشرت عينة من الدقيق فوق لوح داكن. مرت بأصابعها عليها ولم تجد حبات صلبة. طلبت من شياو دو أن يضع الدقيق الأول في كيس منفصل.\u003c/p>\u003cp>«هذا لا يذهب إلى أحد. اكتب عليه علامة كبيرة.»\u003c/p>\u003cp>«حتى لا يأتي من يخلطه؟»\u003c/p>\u003cp>«حتى لا نخلطه نحن حين نتعب.»\u003c/p>\u003cp>ربط الصبي فم الكيس بإحكام، وحمله إلى الركن البعيد. أبقى لين يده قرب رافعة الحجر، يستمع إلى الصوت قبل أن يسكب حفنة جديدة من الحبوب.\u003c/p>\u003cp>كانت الإنتاجية، حسب الحساب الذي أخذته على الدفتر، أربعة أكياس ونصفاً في اليوم. نصف ما كان يطحنه الماء في أحسن أيامه. وتحتاج الدابة إلى راحة، ويحتاج الحجر إلى ضبط، ويحتاج الفلاح إلى أن يقتنع أن حماره ليس عبداً.\u003c/p>\u003cp>وقف شياو دو يراقب الحمار المحجوب العينين يدور، وقال بصوت منخفض غير معتاد: «يمشي كأنه يعرف.»\u003c/p>\u003cp>«ماذا يعرف؟»\u003c/p>\u003cp>«أن هذا ما عليه أن يفعله.» ثم ضحك ضحكة قصيرة: «وأنا أيضاً.»\u003c/p>\u003cp>جاء عجوز من القرية يتكئ على عصا، فوقف عند الباب ينظر ويصغي، ثم أنزل عصاه وجلس على حجر. ظل هناك ساعتين، لا يقول شيئاً، ثم قام وقال للعم تيان: «لو كان لي حمار...» ولم يكمل.\u003c/p>\u003cp>سأل الرجل قبل أن يبتعد عن موعد الطحن التالي. أجابه لين، فرجع العجوز خطوة ليتأكد أنه سمع اليوم الصحيح، ثم مضى إلى بيته.\u003c/p>\u003cp>كان الدخان يتصاعد من ثلاثة بيوت على الأقل عند طرف الطريق إلى الطاحونة. وفي عز الشتاء، حين نام النهر، كان الحجر يدور.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء الجزار بعد الظهر.\u003c/p>\u003cp>كان رجلاً عريضاً أحمر الوجه، أكمامه مشمرة رغم البرد، وذراعاه المشعرتان تلمعان بشحم قديم. لم يأتِ بكيس. أتى وفي يده كفه المفتوحة، وفيها ثلاث قطع نحاسية.\u003c/p>\u003cp>وقف أمام شين يان الجالسة على المقعد عند الباب، وقال:\u003c/p>\u003cp>«زوجتي طحنت عندكم قبل ثلاثة أسابيع.»\u003c/p>\u003cp>«أذكر.»\u003c/p>\u003cp>«أعطتكم جزءاً من عشرين.»\u003c/p>\u003cp>«بالميزان أمامها.»\u003c/p>\u003cp>«نعم.» مد كفه. «دخننا هذا الشتاء ليس كثيراً. لكنني سمعت أن الطاحونة تدور، رغم النهر. فقلت لزوجتي: لا نأتي بكيس. نأتي بنحاس، ونطحن حين نحتاج. ثلاث نحاسات. احسبوا لي بها الطحن حين آتي بحبوبي. نحسب الأجر بالوزن يومها.»\u003c/p>\u003cp>لم تتحرك شين يان.\u003c/p>\u003cp>«بالأجر؟»\u003c/p>\u003cp>«بالأجر كاملاً.»\u003c/p>\u003cp>نظرت إلى القطع الثلاث. كانت صغيرة، رديئة الصك، حوافها متآكلة، وعليها صورة باهتة لشيء يشبه طائراً. لم يكن في كفه الغليظ ما هو أصغر منها.\u003c/p>\u003cp>أخذتها. وقلبتها واحدة بعد أخرى. ثم رفعت رأسها وقالت:\u003c/p>\u003cp>«لماذا النحاس؟»\u003c/p>\u003cp>هز الجزار كتفيه. «الدقيق يؤكل. النحاس يبقى.» ثم أضاف بصوت أخفض: «وفي الشتاء، من يعطي النحاس يصير له اسم. أريد أن يكون لي اسم عندكم.»\u003c/p>\u003cp>أغلق الجزار أصابعه على كف فارغة، ثم أدخلها في كمه.\u003c/p>\u003cp>مضى، وبقيت القطع في كف شين يان.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلسا آخر النهار في المخزن.\u003c/p>\u003cp>غابت الشمس منذ ساعة، وبقي ضوء شمعة واحدة على القش بينهما. وضع لين القطع الثلاث على القش بينهما، وحدق فيها. ثلاث نحاسات. دفعة مقدمة لطحن حبوب الجزار. رفع لين إحداها ليرى النقش الباهت، ثم وضعها بحذر على القش.\u003c/p>\u003cp>لم يحتفظا بنحاس منذ أجر عجلة الفلاح؛ ذهبت نحاساته كلها إلى الدين.\u003c/p>\u003cp>قال: «أول نقد.»\u003c/p>\u003cp>«أول نقد.»\u003c/p>\u003cp>مدّ يده، ووضعها في كفها. كانت أصابعها باردة، فأغلقها عليها بسرعة. ثم فتحت الكيس المعلق في حزامها، الكيس القماشي الصغير الذي حملت فيه الرقع الطينية والحصى وأشياء كثيرة، ووضعت فيه القطع واحدة بعد أخرى.\u003c/p>\u003cp>سقطت في القاع بصوت رنين خافت.\u003c/p>\u003cp>وقالت، وهي تغلق الكيس بأصابع ما زالت ترتجف:\u003c/p>\u003cp>«هذه أول نحاسات لم يعطنا إياها أحد.»\u003c/p>\u003cp>لم يفهم لين فوراً. ثم فهم.\u003c/p>\u003cp>سجلت شين يان اسم الجزار، وأمامه ثلاث نحاسات مقدماً لأجر الطحن. صار عليهما عمل يقابله نقد في الكيس. مرر لين إبهامه على أثر النحاس في كفه.\u003c/p>\u003cp>أعاد لين شد خيط الكيس لئلا تسقط منه قطعة.\u003c/p>\u003cp>فتح اللوحة البيضاء لأنه لم يستطع منع نفسه، وأدخل الأرقام. أربعة أكياس ونصف في اليوم، وجزء من عشرين أجراً للطحن. يخرج من الأجر أولاً جزء من أربعين لتيان وزاو، ثم يتقاسمان الباقي مع هو سانيانغ وتشانغ بحسب الاتفاق.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخطيط الصناعي — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>دخل الطاحونة اليومي بالحمار (أيام الأجر): حوالي ربع كيس دخن\u003c/div>\u003cdiv>حصة الزوجين بعد أجر الدابة والتوزيع: نحو ثلاثة أجزاء من عشرين من الكيس\u003c/div>\u003cdiv>مع يومي الوعد: أقل من ذلك\u003c/div>\u003cdiv>الثقة: 63%\u003c/div>\u003c/div>\u003cp>«أقل من سُدس كيس.» قال بصوت مسموع.\u003c/p>\u003cp>«ما هذا؟»\u003c/p>\u003cp>«حصتنا إذا طحنا كل الأكياس بأجر. أيام الوعد لا تعطينا هذا.»\u003c/p>\u003cp>لم تضحك. نظرت إلى الكيس في حزامها، ثم إلى القش. «هذه الثلاث دفعة مقدمة. وما زال علينا أن نطحن له أكياسه.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«إذن لا نحسب كل ما في الكيس ربحاً.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«وكم يبقى للدين بعد كل هذا؟»\u003c/p>\u003cp>لم يكن عنده جواب، وكان يعرف أن السؤال سيتكرر.\u003c/p>"},{"n":20,"t":"الفصل العشرون: أول سداد","b":"\u003cp>وضعت هو سانيانغ كتابها على الطاولة في صباح اليوم السادس والستين، وفتحته عند صفحة لم يرها لين من قبل، وقالت: «اجلسا. سنحسب.»\u003c/p>\u003cp>دفّأ الموقدان المطبخ، وملأت رائحة العصيدة والبصل المقلي المكان. قشّر شياو دو الثوم عند الباب مصغياً إلى حديثهم، فيما جلست هو سانيانغ على كرسيها وقدماها فوق حجر دافئ. بقي كوب الشاي أمامها من دون أن تمسه، وتنقلت نظرتها بين وجهي الزوجين.\u003c/p>\u003cp>قالت: «الخُمس.»\u003c/p>\u003cp>أومأت شين يان. كانت قد أحصت الأيام في دفترها منذ بدأ بناء الموقد الثاني، وفصلت أيام تجفيفه عن أيام تشغيله، ولم تحتج إلى أن تُسأل.\u003c/p>\u003cp>«أربعة وعشرون يوماً.» قالت هو سانيانغ. «من اليوم الثاني والأربعين إلى أمس. في الأربعة الأولى وفّر موقد المطبخ وحده، ثم عمل الموقدان عشرين يوماً. قارنت ما أحرقناه بما كنت أحرقه قبل الإصلاح، وراجعت أيام القافلة في كتاب السنة الماضية.» وضعت إصبعها على عمود. «ستون سلة موفرة. بسعر السوق الحالي، نحاسة للسلة. هذا ستون نحاسة. وخمسها اثنتا عشرة.»\u003c/p>\u003cp>«اثنتا عشرة.»\u003c/p>\u003cp>«وهذا وحده.» رفعت إصبعاً ثانياً. «والدقيق.»\u003c/p>\u003cp>نظر لين إلى شين يان. لم يكن يعرف شيئاً عن الدقيق.\u003c/p>\u003cp>أخرجت شين يان من حزامها ورقة مطوية، وبسطتها. «الدقيق الذي طحناه للنزل. اثنا عشر كيساً صغيراً من حصتنا من أجر الطحن. ليست أكياس الحبوب الكبيرة؛ وزنتها كلها وسجلت أوزانها. بعتها لك بسعر السوق الذي سألت عنه عند الباعة.»\u003c/p>\u003cp>«بعتِ بسعر السوق؟»\u003c/p>\u003cp>«بسعر السوق يوم الأمس. لو بعتها للقافلة لكان أعلى بنحاسة. لكن القافلة ليست هنا.»\u003c/p>\u003cp>حدقت فيها هو سانيانغ طويلاً.\u003c/p>\u003cp>«كنت سأعطيكما أقل.» قالت.\u003c/p>\u003cp>«أعرف. لهذا سألت.»\u003c/p>\u003cp>ارتفعت زاوية فم هو سانيانغ ارتفاعاً لا يصل إلى ابتسامة. ثم قلبت صفحة وكتبت رقماً وشطبت آخر.\u003c/p>\u003cp>«عشر نحاسات للدقيق. واثنتا عشرة للخُمس.»\u003c/p>\u003cp>«اثنتان وعشرون.» قالت شين يان. «من مئة وست وأربعين.»\u003c/p>\u003cp>«مئة وأربع وعشرون.» أغلقت الكتاب. «هذا ما بقي.»\u003c/p>\u003cp>قال شياو دو من عند الباب، بصوت مختنق بالأمل: «وأنا؟ أنا الذي حملت الحطب كله.»\u003c/p>\u003cp>«أنت تأكل ثلاث مرات في اليوم.»\u003c/p>\u003cp>«الأكل ليس أجراً!»\u003c/p>\u003cp>«هو أجر.» ردت هو سانيانغ دون أن ترفع عينيها. «وأنت تأخذه منذ ولدت.» ثم، بعد لحظة، أخرجت من جيبها حبة تمر مجففة وقذفتها نحوه دون أن تنظر، فالتقطها في الهواء. «والآن اخرج وقشر الثوم قبل أن أضيف ثمن الحبة.»\u003c/p>\u003cp>ضحك الصبي ضحكة قصيرة وعاد إلى مكانه، وقضم التمرة على مهل ليدوم طعمها.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقف لين في الممر الضيق خارج المطبخ بعد أن انصرفت الجلسة، يحدق في الجدار، وفي رأسه الرقم: مئة وأربع وعشرون.\u003c/p>\u003cp>أعاد الحساب في رأسه: مئة وست وأربعون، ناقص اثنتين وعشرين. بقي دين كبير، لكنه نقص من عملهما. مد أصابعه المتشققة ثم أغلقها؛ كانت تؤلمه، وصار لهذا الألم مبلغ يعرفه.\u003c/p>\u003cp>ووقفت شين يان بجانبه، ولم تتكلم. نظر إليها، فوجدها تحدق في الحائط نفسه.\u003c/p>\u003cp>«مئة وأربع وعشرون.» قالت.\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«أقل باثنتين وعشرين من الأمس.»\u003c/p>\u003cp>«حفظتِ الرقم.»\u003c/p>\u003cp>«أعدته ثلاث مرات.» لم تلتفت. «خشيت أن أكون قرأته خطأ.»\u003c/p>\u003cp>ضحك بصوت منخفض. ثم أخذ يدها وأدخلها في كمه، وبقيا هكذا لحظة، ثم أفسحا الطريق لهو سانيانغ وهي تمر بسلة الحطب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قبل الظهر، جاء شياو دو يركض إلى الطاحونة، يتنفس بخاراً أبيض، وقال بصوت مرتفع كأنه يحمل خبراً عن الحرب: «الكاتب وو في النزل!»\u003c/p>\u003cp>توقف لين عن إصلاح مزلاج الباب. «متى؟»\u003c/p>\u003cp>«الآن. جاء على بغل، وحارساه ينتظران في الخارج. طلب شاياً. قالت العمة إن ليس عندها إلا الشاي المغلي، وقال هو: لا بأس، أحب الشاي المغلي.»\u003c/p>\u003cp>«ماذا يريد؟»\u003c/p>\u003cp>«لا شيء. هذا ما يجعلني أخاف.» ابتلع ريقه. «سأل العمة عن الجنازة.»\u003c/p>\u003cp>مشى لين مع الصبي إلى النزل، وكانت شين يان في المطبخ قبلهما، واقفة عند الموقد تقلب قدراً ببطء ولا تنظر إلى الجالس عند الطاولة. أما الكاتب وو فكان جالساً على الكرسي الذي يجلس عليه التجار، معطفه الأزرق نظيفاً كما كان، وفي يده كوب شاي مغلي، يدور به بين أصابعه كمن يتأمل نقشاً.\u003c/p>\u003cp>قال بلطف حين رآه: «السيد لين. أي مصادفة طيبة.»\u003c/p>\u003cp>«سيدي الكاتب.»\u003c/p>\u003cp>«كنت أقول للسيدة هو إنني حزنت لما سمعت عن العجوز لي.» ارتشف الشاي. «امرأة كانت تبيع المخلل منذ أيام الحاكم السابق. أظن أنني اشتريت منها مرة. لم تدفع قط ضريبة السوق، لكن أحداً لم يطالبها، فهي أفقر من أن تُطالَب.»\u003c/p>\u003cp>لم يقل لين شيئاً.\u003c/p>\u003cp>«وسمعت أنها ماتت من البرد.» أضاف وو بنبرة عابرة، كأنه يذكر حالة الطقس. «في بيت بلا حطب. وقد دُفنت بحطب النزل.» رفع عينيه الناعستين. «كم حطباً تحتاج جنازة؟ سؤال أحمق، أعرف.»\u003c/p>\u003cp>«حطب ثلاثة بيوت.» قالت شين يان من الموقد، دون أن تلتفت.\u003c/p>\u003cp>«ثلاثة بيوت.» كرر. «في شتاء كهذا، ثلاثة بيوت.» ثم هز رأسه ببطء. «وبالمناسبة، سيدة شين، يقولون إنك تقرئين الآن.»\u003c/p>\u003cp>توقفت الملعقة في القدر.\u003c/p>\u003cp>«أقرأ قليلاً.»\u003c/p>\u003cp>«حسن. القراءة نعمة.» حرك الكوب. «يقولون أيضاً إنك تكتبين بحروف لا يعرفها أحد.»\u003c/p>\u003cp>«أكتب أرقامي.»\u003c/p>\u003cp>«أرقامك.» ابتسم. «إذن لك أرقام. يسرني أن أرى من يهتم بالحساب.»\u003c/p>\u003cp>ثم وضع الكوب، ونهض، وانحنى انحناءة صغيرة للجميع، وقال وهو ينظر إلى هو سانيانغ: «أعتذر عن الإزعاج. كنت أمر.» وخرج.\u003c/p>\u003cp>حين اختفى صوت الحوافر، قالت هو سانيانغ، وهي تحدق في الكوب الفارغ: «لا يمر.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وجدته بعد الظهر في ورشة الترس.\u003c/p>\u003cp>كان العجوز يانغ يصقل وتداً جديداً احتياطاً، ولاو دونغ يقطع الخشب، وزاو يرتاح على كومة من القش وعليه غطاء قديم. ودخلت شين يان بخطوات ثقيلة، ورائحة الشاي على أنفاسها، وجلست على الجذع بجانب لين.\u003c/p>\u003cp>«سأعرض عليها شيئاً.»\u003c/p>\u003cp>«من؟»\u003c/p>\u003cp>«هو سانيانغ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«الكتابة.» أخرجت من جيبها قطعة من الورق الخشن، أخذتها من الكتاب القديم الذي كانت هو سانيانغ تعلمها منه كل ليلة. وعليها بخط شين يان المتعثر، حروف لم يرها لين مرتبة هكذا: سطور قصيرة، وكل سطر يبدأ بكلمة ويتبعه رقم.\u003c/p>\u003cp>«قرأتها؟»\u003c/p>\u003cp>«قرأتها.» قالت بنبرة فيها ما يشبه الخجل والكبرياء معاً. «أقرأ الآن أي قيد بسيط. سلة. نحاسة. دقيق. عشرة. كفيل. أعرف ثمانين حرفاً. ربما تسعين.»\u003c/p>\u003cp>«في شهرين؟»\u003c/p>\u003cp>«شهران تقريباً. وأنا أراجعها كل ليلة. إذا تركتها يومين خلطت بين الحروف.»\u003c/p>\u003cp>ثم أضافت: «سأعرض عليها أن أكتب لها الحساب اليومي. كل شيء: الحطب والدقيق والزبائن والمشتريات. مجاناً.»\u003c/p>\u003cp>«مجاناً؟»\u003c/p>\u003cp>«مقابل أن أتعلم.»\u003c/p>\u003cp>قال لين: «سترفض؟»\u003c/p>\u003cp>«ترفض أي شيء مجاني.» قالت. «لذلك سأبين لها ما آخذه في المقابل.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جلسا مرة أخرى في المطبخ عند المساء. كانت هو سانيانغ قد أكلت لتوها، ومسحت فمها بمريلتها، وجلست أمام الموقد.\u003c/p>\u003cp>قالت شين يان من الباب بصوت مهذب: «هو سانيانغ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أريد أن أعرض عليك شيئاً.»\u003c/p>\u003cp>«قولي.»\u003c/p>\u003cp>اقتربت ببطء، ويدها على بطنها، وجلست على الكرسي المقابل. وضعت قطعة الورق على الطاولة.\u003c/p>\u003cp>«أكتب لك الحساب اليومي. كل مساء، بعد العشاء. ما دخل وما خرج. وأنت تحاسبين.»\u003c/p>\u003cp>لم تنظر هو سانيانغ إلى الورقة.\u003c/p>\u003cp>«مجاناً.» أكملت شين يان. «مقابل أن أتعلم.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«لم أنتهِ.»\u003c/p>\u003cp>«لست بحاجة. قلت لا.» رفعت هو سانيانغ الكوب إلى فمها. «الحساب سر. يعرفه صاحب البيت وأهل بيته. والكفالة لا تجعلك من أهلي.»\u003c/p>\u003cp>«وأنا أعمل في بيتك...»\u003c/p>\u003cp>«وأنا كفيلتك.» قالتها بصوت جاف، ثم وضعت الكوب. «هذا لا يفتح لك حساباتي.»\u003c/p>\u003cp>سكتت شين يان.\u003c/p>\u003cp>كان لين على الباب، يراقب. لم يقل شيئاً. كان قد تعلم أن هناك محادثات لا يدخلها.\u003c/p>\u003cp>وبعد صمت طويل، قالت شين يان بصوت خافت:\u003c/p>\u003cp>«قرأت اليوم صفحة من كتابك كانت مفتوحة على الطاولة. وفهمت ما فيها.»\u003c/p>\u003cp>رفعت هو سانيانغ رأسها.\u003c/p>\u003cp>«أي صفحة؟»\u003c/p>\u003cp>«صفحة أيام الجنازة.» أخرجت شين يان صوتها بحذر. «لا حطب فيها ولا رقم. تركتِها فارغة، وأنتِ تكتبين كل شيء حتى قشر البصل. وأنا أعرف ما يعنيه الفراغ في كتاب مثل كتابك.»\u003c/p>\u003cp>ساد صمت ثقيل.\u003c/p>\u003cp>كانت يد هو سانيانغ على الكوب. ثم وضعته ببطء على الطاولة، وأخذت وقتاً طويلاً كأنها تقرأ شيئاً غير موجود في الهواء أمامها.\u003c/p>\u003cp>ثم قالت، دون أن تنظر إلى أحد:\u003c/p>\u003cp>«تكتبين أمامي.»\u003c/p>\u003cp>رفعت شين يان رأسها.\u003c/p>\u003cp>«وفي كتابي. لا في دفترك.» التفتت إليها أخيراً، وفي عينيها شيء آخر غير البرودة. «كل مساء. هنا. على هذه الطاولة. وأنا أراقب كل حرف. وإذا أخطأتِ في رقم، تعيدين. وإذا خرجت كلمة من هذه الغرفة...»\u003c/p>\u003cp>«لن تخرج.»\u003c/p>\u003cp>«لا تقولي لن. قولي: إذا خرجت فاطرديني.»\u003c/p>\u003cp>«إذا خرجت فاطرديني.»\u003c/p>\u003cp>«حسن.» نهضت هو سانيانغ وأخذت الكتاب من على الرف، ووضعته بينهما. «ابدئي من هنا.»\u003c/p>\u003cp>قربت شين يان الشمعة، وقرأت القيد بصوت خافت قبل أن تنسخه. حطب، ثم عدد السلال، ثم الثمن. توقفت عند حرف فمدت هو سانيانغ إصبعها فوق الصفحة.\u003c/p>\u003cp>«هذا حطب. الحرف الذي كتبته يعني باباً.»\u003c/p>\u003cp>مسحت شين يان الموضع بطرف خرقة، وانتظرت حتى جف. كتبت الكلمة من جديد، ثم أشارت إلى الرقم.\u003c/p>\u003cp>«والعدد صحيح؟»\u003c/p>\u003cp>عدت هو سانيانغ على أصابعها قبل أن تجيب. «صحيح. تابعي.»\u003c/p>\u003cp>من عند الباب، رأى لين ظهر شين يان ينحني على الكتاب. ترك لها المقعد الآخر لتسند قدميها، ثم خرج إلى المخزن. بقيت تسمع خطواته حتى أغلق الباب، وعادت إلى السطر التالي.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بقي لين وحده بعد ذلك في المخزن، ينتظر.\u003c/p>\u003cp>جاءت شين يان في آخر الليل، حاملة الشمعة، وقد انتفخت قدماها قليلاً من الجلوس، ووجهها متعب ومضيء في آن. جلست على القش وخلعت حذاءها. قالت:\u003c/p>\u003cp>«كتبت اليوم أربعة عشر سطراً.»\u003c/p>\u003cp>«وأخطأتِ؟»\u003c/p>\u003cp>«في سطرين. قالت: مرة أخرى.» وضعت يدها على كاحلها المنتفخ. «ثم قالت لي: خطك أوضح من خطي.»\u003c/p>\u003cp>«قالتها؟»\u003c/p>\u003cp>«تقريباً.» ابتسمت. «قالت: لا بأس.»\u003c/p>\u003cp>مدّ يده ودلك قدمها ببطء. كان الجلد دافئاً من النار، منتفخاً قليلاً، وعظامها الصغيرة تتحرك تحت أصابعه.\u003c/p>\u003cp>قالت: «أمسكت الكتاب حين أخطأت. ظننتها ستنهي الاتفاق.»\u003c/p>\u003cp>«ثم تركتك تكملين.»\u003c/p>\u003cp>«أعادت الصفحة أمامي. لم تتركني أكتب فيها حتى قرأت لها الرقم مرتين.» نظرت إلى الشمعة. «تخشى على هذا الكتاب أكثر مما تخشى على أثاث النزل كله.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقبل أن تنام تلك الليلة، جلست شين يان على القش وفي حضنها ورقة من دفتر لين، وأمامها شياو دو متربعاً يعض طرف لسانه.\u003c/p>\u003cp>كان الصبي قد عرض عليها أن يعلمها، حين رآها تتعثر، وقال بفخر لا يتناسب مع عمره: «أعرف مئة حرف. ليس مئة تماماً. ستة وتسعون.»\u003c/p>\u003cp>«ممتاز. اقرأ هذه.»\u003c/p>\u003cp>أمسك الورقة بيد مرتجفة، وقرأ بصوت خافت: «سلة. نحاسة. ثلاثة.» ثم عبس. «وهذه...»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«لا أعرف. شكلها كحصان بلا ساق.»\u003c/p>\u003cp>نظرت شين يان إلى الحرف، وضحكت. «هذا حرف كتبته أنا خطأً. أردت أن أكتب كلمة أخرى.»\u003c/p>\u003cp>«كلمة ماذا؟»\u003c/p>\u003cp>«ابتسامة.»\u003c/p>\u003cp>قرأ الصبي الحرف مرة ثانية، وابتسم. «إذن هي حصان يبتسم.» ثم، كأنه تذكر شيئاً: «العمة لا تعرف أني أقرأ. لو عرفت، ستخبئ الدفاتر.»\u003c/p>\u003cp>رفعت شين يان رأسها.\u003c/p>\u003cp>«أي دفاتر؟»\u003c/p>\u003cp>«الدفاتر القديمة.» هز كتفيه. «في الصندوق. لم أرها مفتوحة قط. لكنني أعرف أنها هناك.»\u003c/p>\u003cp>أمسكت شين يان القلم، ولم تقل شيئاً. رفع لين رأسه. تأملت شين يان الورقة التي أمامها، ثم طلبت من الصبي أن يعيد قراءة السطر.\u003c/p>\u003cp>نام شياو دو في المطبخ بعد أن ودّعهما. وحين صارا وحدهما، انحنى لين نحوها، وخفض صوته، وتكلم بلغتهما:\u003c/p>\u003cp>«وو.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لم يأتِ ليشرب الشاي.»\u003c/p>\u003cp>«جاء ليرى ما تغير. وليقول لنا إنه يرى.» لفت اللحاف حول كتفيها. «المرأة التي تقرأ. الجنازة بحطب النزل. الدين الذي ينقص.» أحصت على أصابعها. «كلها أرقام، وهو يعدّها.»\u003c/p>\u003cp>«ماذا نفعل؟»\u003c/p>\u003cp>«لا شيء.» قالتها بهدوء. «كل ما يحتاجه ليوقفنا هو ثغرة في القصة. ونحن لا نعطيه ثغرة جديدة.»\u003c/p>\u003cp>«وإن لم يحتج إلى ثغرة؟»\u003c/p>\u003cp>«حينها نبحث عن شيء آخر نحمي به أنفسنا.» نظرت إليه في الضوء الخافت. «لين. هل أنت خائف؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«جيد.» وضعت رأسها على صدره. «أنا أيضاً. لكن لا تعطِه أكثر مما سأل عنه.»\u003c/p>\u003cp>وبقيا هكذا، حتى هدأ تنفسها، وبقي لين مستيقظاً يصغي إلى خطوات هو سانيانغ في المطبخ.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الليل متأخراً حين خرجت شين يان لتقضي حاجتها.\u003c/p>\u003cp>عادت بعد قليل بخطوات صامتة، وبقي لين مستيقظاً في الظلام يستمع. لم تدخل المخزن فوراً. توقفت عند الباب الداخلي للنزل، الذي يؤدي من المطبخ إلى الغرفة الصغيرة الملاصقة لحجرة هو سانيانغ. كان الباب مفتوحاً قليلاً، ومصباح زيت صغير يضيء من الداخل خيطاً من ضوء أصفر.\u003c/p>\u003cp>نظرت شين يان من الشق.\u003c/p>\u003cp>كانت الغرفة صغيرة، سريرها الخشبي ضيق، وعلى الجدار الشرقي رف، وتحت الرف صندوق خشبي كبير، مغلق بقفل نحاسي، عليه غبار كثيف رمادي لم يلمس منذ سنين. وحوله، مكدسة، حزم من الدفاتر الصفراء القديمة، مربوطة بخيوط القنب، وقد بهتت أطرافها من القدم.\u003c/p>\u003cp>لم يكن على الصندوق اسم.\u003c/p>\u003cp>لكن شين يان، التي تعلمت في شهرين نحو تسعين حرفاً، عرفت حرفين من الخط الذي على أقرب حزمة. حرفين لم تفهمهما بعد، لكنها حفظت شكلهما في ذاكرتها كما تحفظ الدوائر.\u003c/p>\u003cp>من وراء الباب الداخلي سمعت حركة هو سانيانغ في سريرها، وصرير خشبه. ابتعدت شين يان عن الشق.\u003c/p>\u003cp>تركت الباب كما وجدته، وعادت إلى المخزن. بقي حرفا الحزمة في رأسها بعدما أطفأ لين الشمعة.\u003c/p>"},{"n":21,"t":"الفصل الحادي والعشرون: الدفاتر القديمة","b":"\u003cp>في اليوم الثامن والستين، غرست هو سانيانغ سكينها في الطاولة، بمحاذاة أصابع أحد الزبائن.\u003c/p>\u003cp>كان ذلك عند الغروب. ثلاثة عابرين من عربة متأخرة، رائحتهم خمر رخيص وروث، جاؤوا يطلبون طعاماً ونبيذاً وفراشاً دافئاً. شتموا الفراش، وشتموا الحساء، وضحك أحدهم حين وضعت الوعاء أمامه، ثم مد يده وأمسك معصمها وجذبها إليه وهو يقول شيئاً عن «أرملة النزل» لم يسمعه لين من الباب إلا نصفه.\u003c/p>\u003cp>لم تصرخ. أخذت السكين الثقيلة من حزامها، تلك التي تقطع بها اللحم المقدد، وغرستها في الخشب بين إصبعه الأوسط والسبابة، بضربة سريعة جعلت الصحون تقفز.\u003c/p>\u003cp>خرجت منه شهقة. كانت السكين ما تزال ترتجف في الخشب، ونصلها قريب من جلده.\u003c/p>\u003cp>قالت بصوت هادئ جداً: «ادفع. قبل أن تنام. بنحاس كامل، لا مقصوص.»\u003c/p>\u003cp>نهض الثلاثة دفعة واحدة. حدق أحدهم في لين الذي كان قد دخل إلى منتصف الغرفة ويداه مفتوحتان وقلبه يدق في أذنيه، ثم في السكين، ثم في المرأة القصيرة العريضة التي لم يرتجف لها جفن. ثم جلسوا من جديد. أخرج أحدهم كيسه وعدّ الأجر على الطاولة، ولم يمد يده إليها ثانية.\u003c/p>\u003cp>حين سحبت هو سانيانغ السكين، ارتجفت يدها. وضعت السكين على الطاولة، وأبقت كفها على المقبض حتى سكنت.\u003c/p>\u003cp>بعد ساعة، حين صعدوا إلى فراشهم، وقف لين في المطبخ وسأل بصوت منخفض: «هل أنت بخير؟»\u003c/p>\u003cp>«لا تسأل.» كانت تمسح يديها بمريلتها، مرة بعد مرة، حتى بعد أن جفتا. «العابرون يفعلون هذا بامرأة وحدها. منذ ست سنوات وأنا وحدي.»\u003c/p>\u003cp>لم يقل شيئاً.\u003c/p>\u003cp>وفي هذه اللحظة جاءت شين يان.\u003c/p>\u003cp>كان الموقدان يهمسان، والمصباح الزيتي يرتجف على الجدار، وشياو دو يغسل قدراً في الزاوية. ووجه هو سانيانغ رمادي من التعب، ونصف الدفعة نحاس رديء مقصوص على الطاولة أمامها.\u003c/p>\u003cp>قالت شين يان: «هل أستطيع أن أطلب شيئاً؟»\u003c/p>\u003cp>«اطلبي بسرعة.»\u003c/p>\u003cp>«أريد أن أتمرن على كتاب قديم.»\u003c/p>\u003cp>«كتب القيود؟»\u003c/p>\u003cp>«الكتب القديمة. إن أمكن.» وقفت تحت المصباح، يدها على بطنها المنتفخ، ووجهها هادئ، وقد أعدت كلماتها قبل الدخول. «خطك الآن أنيق ومنتظم. لكن الأقدم أوضح، لأن من كتبه كتب ببطء وبحبر أسود. وأنا أتعلم من الخط البطيء.»\u003c/p>\u003cp>نقلت هو سانيانغ بصرها من النحاس المقصوص إلى الدفتر الذي تحمله شين يان. بقيت ساكتة حتى ظنت شين يان أنها سترفض.\u003c/p>\u003cp>نظرت هو سانيانغ إليها بعينين نصف مغمضتين. ثم قالت بصوت فيه ثقل نعاس:\u003c/p>\u003cp>«في الصندوق. تحت الرف.» أخرجت من حزامها مفتاحاً نحاسياً ثقيلاً ملفوفاً بخيط، وقذفته نحوها دون أن تنظر. «خذي واحداً من الأعلى. لا تأخذي أكثر من واحد. وأعيديه كما كان.»\u003c/p>\u003cp>التقطت شين يان المفتاح في الهواء.\u003c/p>\u003cp>«شكراً.»\u003c/p>\u003cp>«قلت لك لا أحب...» ثم هزت رأسها وتنهدت. «اذهبي. أنا نائمة.»\u003c/p>\u003cp>أعادت الخرقة فوق الطاولة، تمررها على الموضع نفسه. انتظرت شين يان لحظة، ثم تراجعت إلى الباب والمفتاح في يدها.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في تلك الأثناء، كان لين في الطاحونة مع العجوز يانغ. وضع المصباح على مسمار قرب الترس، ورفع وعاء الزيت إلى المحور.\u003c/p>\u003cp>كان الليل قد هبط وبرد الوادي يتسلل من الباب المفتوح، والحمار زاو ينام واقفاً في زاويته بالغطاء الأسود على رأسه، وبخار أنفاسه يعلو فوق الغطاء. نظر العجوز يانغ إلى المحور وهو يصب الزيت، وقال دون مقدمة:\u003c/p>\u003cp>«صوته يشبه صوته.»\u003c/p>\u003cp>«صوت ماذا؟»\u003c/p>\u003cp>«ترس جياو.» مسح الزيت عن الخشب بإبهامه. «في الليلة الأخيرة قبل الفيضان، كان جالساً هنا. على هذا الجذع. كان يضع الزيت على محور الدولاب ويغني.»\u003c/p>\u003cp>«ماذا كان يغني؟»\u003c/p>\u003cp>«لا أذكر. كان لحناً بلا كلمات.» هز رأسه. «لم أسأله لماذا لا يحب الكلمات.»\u003c/p>\u003cp>لم يرد لين. وضع الوعاء الصغير على الأرض، وجلس على الجذع المقابل.\u003c/p>\u003cp>«يانغ.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«الست هو. منذ متى وهي وحدها؟»\u003c/p>\u003cp>رفع العجوز عينيه الصغيرتين. «ست سنوات. تقريباً. مات زوجها في شتاء مثل هذا، بعد ليلة سعال طويلة.» ثم أضاف: «كان رجلاً طيباً. لكنه أحب الجميع أكثر من اللازم.»\u003c/p>\u003cp>«ماذا تعني؟»\u003c/p>\u003cp>«أعني أنه أقرض كثيرين.» حرك الزيت في الوعاء. «ومن يقرض كثيراً في قرية فقيرة، يقترض من غنية.» ثم قطع كلامه فجأة، كأنه سمع نفسه، وقال: «لا شأن لي بهذا.» وعاد إلى الخشب.\u003c/p>\u003cp>أمسك لين قطعة الخشب تحت المحور كيلا تسيل قطرة الزيت على الأرض. أراد أن يسأل عمن اقترض منه الرجل، لكن يانغ أشاح بوجهه وراح يفحص الأوتاد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخذت شين يان الشمعة وشياو دو معها.\u003c/p>\u003cp>لم تلحق بلين في الطاحونة لتخبره. مرّت من المطبخ إلى الغرفة الصغيرة، والصبي وراءها يحجب شعلة الشمعة بكفه. دخلت الغرفة الصغيرة الملاصقة للمطبخ، حيث ينام الصبي عادة قرب الموقد الحجري، وأغلقت الباب خلفها. جلست على الأرض، وأمامها الصندوق الخشبي الكبير الذي رأته من الشق، ومفتاح نحاسي ثقيل في كفها.\u003c/p>\u003cp>قال شياو دو، وعيناه تلمعان بخوف خجول: «العمة لا تفتح هذا الصندوق.»\u003c/p>\u003cp>«قالت لي أن أفتح الصندوق.»\u003c/p>\u003cp>«لكنها لا تفتحه.»\u003c/p>\u003cp>نظرت إلى المفتاح. «سأعيد كل شيء إلى مكانه. تريد أن تذهب؟»\u003c/p>\u003cp>هز رأسه. «أريد أن أرى.»\u003c/p>\u003cp>دار المفتاح بصعوبة، وانفتح القفل بصوت طقطقة رتيبة. ثم رفعت الغطاء.\u003c/p>\u003cp>تصاعدت رائحة غبار قديم، ورائحة ورق مطوي وحبر جاف، وشيء آخر خافت، عطر عشب مجفف كان موضوعاً بين الكتب لحمايتها من الحشرات. بداخله سبعة كتب صفراء مكدسة بعناية، مربوطة بخيط القنب، وعلى ظهر كل واحد علامة صغيرة بالحبر: دائرة، ثم نقاط بعدد السنين.\u003c/p>\u003cp>أخرجت الأعلى.\u003c/p>\u003cp>كانت علامته دائرة ونقطتين.\u003c/p>\u003cp>مررت شين يان طرف إصبعها على الخيط قبل أن تفكه. كان مربوطاً مرتين، والعقدة الثانية مدفونة تحت الأولى. حاول شياو دو أن يساعدها بأظفاره، فردت يده برفق.\u003c/p>\u003cp>«سينقطع إن شددناه.»\u003c/p>\u003cp>«عندي سكين.»\u003c/p>\u003cp>«لا نقطع شيئاً. سنعيده كما كان.»\u003c/p>\u003cp>أسندت الكتاب إلى الغطاء، ووسعت الحلقة قليلاً حتى خرج طرف الخيط. جمعه الصبي في كفه من غير أن تطلب منه، ثم وضعه بجانب الصندوق. وحين فتحت الكتاب انزلقت ورقة رقيقة من بين صفحتين. أمسكها قبل أن تبلغ الأرض.\u003c/p>\u003cp>لم يكن عليها سوى جمع قصير، وثقب صغير عند الحافة. قربها من الشمعة.\u003c/p>\u003cp>«هل نقرأ هذه أيضاً؟»\u003c/p>\u003cp>«نبدأ بالكتاب.»\u003c/p>\u003cp>أعادت الورقة إلى الموضع الذي خرجت منه. رأى الصبي كيف سوت زاويتها مع حافة الصفحة، فصار يناولها الأوراق من طرفها، ويبعد يده الأخرى عن اللهب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فتحته شين يان على ركبتيها، وقرّبت الشمعة.\u003c/p>\u003cp>كان الخط مختلفاً تماماً عن خط هو سانيانغ. حروف كبيرة مستديرة، مائلة قليلاً إلى اليمين، يتصل آخرها بأول ما بعدها، لكنها واضحة ولا تتزاحم. وبجانب بعض القيود، في الهامش، سطر بخط أصغر، يكاد يضيع عند حافة الورقة.\u003c/p>\u003cp>قرأت ببطء، مشيرة بإصبعها إلى كل حرف:\u003c/p>\u003cp>«شتاء. اثنتا عشرة سلة حطب. سعر الحطب ارتفع.»\u003c/p>\u003cp>وفي الهامش: «وانغ العجوز لص.»\u003c/p>\u003cp>ضحك شياو دو ضحكة قصيرة، ثم وضع يده على فمه.\u003c/p>\u003cp>قلبت صفحة. «قافلة ملح، عشرون رجلاً، ثلاث ليال. دفعوا نصفاً في الحال.» والهامش: «لاو ما دفع مقدماً. رجل طيب.»\u003c/p>\u003cp>قال الصبي: «هذا لاو ما!»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«الذي جاء بالقافلة! إذن العم قال عنه...» أخذ نفساً. «العم قال إنه طيب.»\u003c/p>\u003cp>نظرت إليه شين يان. «من هو العم؟»\u003c/p>\u003cp>«العم لو. زوج العمة.» جلس على الأرض مقابلها، وأخذ يعبث بطرف ثوبه. «لم أعرفه كثيراً. كنت صغيراً جداً حين مات. لكنه كان يحملني على كتفيه في السوق. وكان صوته يشبه... لا أدري. كأنه يغني حتى حين لا يغني.»\u003c/p>\u003cp>صمتت شين يان.\u003c/p>\u003cp>مررت شين يان إصبعها تحت السطر، من غير أن تلمس الحبر. في الصفحة نفسها عدّ الرجل سلال الحطب مرتين، وصحح ثمن ليلة، ثم ترك نكتته عن وانغ في الهامش. قلبت الورقة من الزاوية برفق.\u003c/p>\u003cp>وفي أسفل صفحة، وجدت قيداً مختلفاً.\u003c/p>\u003cp>«ولد اليوم ابن أخي دو.» قرأت بصوت بطيء. «سميناه شياو دو. صغير وصاخب ويشبه خاله.»\u003c/p>\u003cp>لم يقل الصبي شيئاً. كانت عيناه واسعتين.\u003c/p>\u003cp>«هو اسمي.»\u003c/p>\u003cp>«هو اسمك.»\u003c/p>\u003cp>«كتبني...» ابتلع ريقه. «كتبني في الكتاب.»\u003c/p>\u003cp>وضعت شين يان يدها على كتفه. انحنى الصبي على الورقة، وفمه يتحرك باسمه من غير صوت.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مضت ساعة.\u003c/p>\u003cp>قرأت شين يان القيود صفحة بعد صفحة. كانت تتعثر أحياناً في حرف لم تعرفه، فيساعدها الصبي، وأحياناً يقف الاثنان أمام كلمة معقدة، فتفتح هي دفترها الصغير وتنقل الحرف، وتعود. وكانت الصورة التي تتكون في ذهنها أكبر من ورقة واحدة: نزل صغير تحت شجرة صفصاف، وامرأة قوية تضرب الخضار بسكين ثقيلة، ورجل يكتب أجر الغرف في المساء، ثم يترك في الهامش شيئاً مما حدث له نهاراً.\u003c/p>\u003cp>قلبت صفحة أخرى، فوجدت: «السقف يتسرب. أصلحه بنفسي. ثلاث نحاسات وفخذ دجاج.» والهامش: «ولم أقع. حمداً لله.»\u003c/p>\u003cp>ثم: «زبون من الشمال يشكو من الفراش. وضعت له وسادة ثانية. قالت زوجتي إنني أدلل الغرباء. قلت لها: الغريب هو الذي يعود.» والهامش: «أخطأت. لا يعود.»\u003c/p>\u003cp>وقفت شين يان عند هذا القيد دقيقة كاملة. رفعت شين يان عينيها نحو الباب. كان المطبخ قد سكت. قرب ركبتها كان نعلا الصبي المثقوبان، ويده تتبع الحبر حتى آخر السطر.\u003c/p>\u003cp>ثم قلبت الصفحة.\u003c/p>\u003cp>وتوقفت.\u003c/p>\u003cp>كانت الصفحة تبدو كغيرها. أعمدة وأرقام. لكن في قاع العمود الأيمن، بجانب رقم، كلمة. وعرفتها.\u003c/p>\u003cp>كانت قد تعلمت هذه الكلمة في أول ليلة جلست فيها إلى كتاب هو سانيانغ.\u003c/p>\u003cp>«فائدة.»\u003c/p>\u003cp>قرأتها بصوت مسموع، دون أن تقصد.\u003c/p>\u003cp>«ماذا؟» قال شياو دو.\u003c/p>\u003cp>«لا شيء. كلمة.» حركت الشمعة. وقرأت القيد الذي حولها: «خريف. دفعة إلى بيت ليو. فائدة.» وبعده رقم لم تعرفه، حرفان وصفر.\u003c/p>\u003cp>«بيت ليو.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ماذا تعني الفائدة؟»\u003c/p>\u003cp>«الفائدة؟» أحست أن صوتها يخرج من مكان بعيد. «هي ما تدفعه على دين.»\u003c/p>\u003cp>قال الصبي ببراءة: «لا أعرف أن العمة مدينة لأحد.»\u003c/p>\u003cp>لم ترد.\u003c/p>\u003cp>قلبت صفحة، ثم أخرى. ظل الرقم متشابهاً، وتغيرت الأسماء قليلاً. «ربيع. دفعة إلى بيت ليو. فائدة.» «صيف. دفعة إلى بيت ليو.»\u003c/p>\u003cp>ثم ظهر في الهامش، بالخط النحيف نفسه، سطر صغير. لم تفهمه كاملاً لأن بعض حروفه ما كانت تعرفه. فقرأت بعضه: «...لا يكفي. أخشى...»\u003c/p>\u003cp>ثم الجملة انقطعت.\u003c/p>\u003cp>وضعت الكتاب على ركبتيها، وأغمضت عينيها لحظة.\u003c/p>\u003cp>قالت للصبي بصوت هادئ: «أعطني الكتاب الذي تحته.»\u003c/p>\u003cp>أعطاها. فتحته على عجل، وقرأت. الكتاب التالي: «فائدة.» وثالث: «فائدة.» رابع: «فائدة.» في كل كتاب، في كل فصل، السطر نفسه، بيد الرجل نفسه، ثم بخط جديد في الكتب الأخيرة، خط تعرفه جيداً. خط هو سانيانغ، الحاد المستقيم المتشدد.\u003c/p>\u003cp>كانت الدفعات لم تتوقف.\u003c/p>\u003cp>تتبعت أول قيد بخط هو سانيانغ. الأرقام نفسها، لكن الحروف أصغر، ولا تعليق في الهامش.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>انتبهت إلى الصمت.\u003c/p>\u003cp>كان شياو دو قد توقف عن الكلام. جالساً هناك، يحدق في الورق، وأذناه البارزتان محمرتان. ضم ركبتيه، وأبعد قدمه عن الكتاب المفتوح أمامه.\u003c/p>\u003cp>قال بصوت خافت جداً: «هل هذا سر؟»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«إن كانت العمة تدفع كل هذا لبيت ليو.» نظر إليها. «ولا تخبرنا.»\u003c/p>\u003cp>نظرت شين يان إلى وجهه الصغير في ضوء الشمعة. لم تكن تعرف كم يفهم. لكنها عرفت أن الإجابة التي تقولها الآن قد تخرج من فم صبي في الصباح.\u003c/p>\u003cp>قالت: «لا أعرف ما هو.»\u003c/p>\u003cp>«لكنك تعرفين.»\u003c/p>\u003cp>«أعرف أن الكتب فيها كلمة. ولا أعرف ما وراءها.» أخذت نفساً. «شياو دو. اسمعني. هذه الأوراق ليست لنا. لا نتكلم عنها. لا مع أحد في القرية. سأخبر لين وحده، وأنا من يخبره.»\u003c/p>\u003cp>«حتى العمة؟»\u003c/p>\u003cp>«خاصة هي.» أغلقت الكتاب. «سنتكلم عنها حين نكون قد فهمنا.»\u003c/p>\u003cp>أومأ الصبي ببطء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أعادت الكتب إلى الصندوق كما وجدتها، واحداً فوق الآخر، وكانت تتحرك ببطء، ويداها ترتجفان قليلاً. وضعت علامة الدائرة والنقطتين إلى الأعلى كما كانت. ثم أغلقت الغطاء.\u003c/p>\u003cp>كان القفل في يدها حين سمعت الخطوات.\u003c/p>\u003cp>خطوات ثقيلة بطيئة، واحتكاك نعل بالألواح، ونفس طويل. هو سانيانغ.\u003c/p>\u003cp>لم تعد إلى غرفتها. كانت تمشي ببطء في الممر نحو المطبخ، ثم نحو غرفة الصندوق.\u003c/p>\u003cp>أطفأ شياو دو الشمعة بإبهامه وأصابعه، فغرقت الغرفة في ظلام كامل. جلس الاثنان بلا حركة. حبست شين يان نفسها، وأغلقت أصابعها على القفل كيلا يصطك بالخشب.\u003c/p>\u003cp>توقفت الخطوات عند الباب.\u003c/p>\u003cp>مرت لحظة. وخارج الغرفة، سمعت شين يان أنفاساً، ثم صوتاً شبيهاً بتنهد، ثم خطوات تبتعد.\u003c/p>\u003cp>لم تنطق بكلمة حتى سمعت باب الغرفة البعيد يُغلق.\u003c/p>\u003cp>قال الصبي همساً: «كانت واقفة هنا.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«كانت ستفتح الباب.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لماذا لم تفتح؟»\u003c/p>\u003cp>لم تجب شين يان.\u003c/p>\u003cp>كانت جالسة في العتمة الدافئة، المفتاح النحاسي بارد في كفها، ويدها الأخرى على بطنها. وفي الغرفة البعيدة، خلف جدارين، سمعت صوت سرير يصرّ تحت جسد لا ينام.\u003c/p>\u003cp>حين دخلت المخزن أخيراً، كان لين مستلقياً بعينين مفتوحتين في الظلام.\u003c/p>\u003cp>«تأخرتِ.»\u003c/p>\u003cp>«كنت أقرأ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>جلست على القش، وخلعت حذاءها ببطء، وأسندت ظهرها إلى الجدار الدافئ. لم تجب في الحال.\u003c/p>\u003cp>قالت أخيراً، بلغتهما، بنبرة منخفضة مستقيمة: «سأخبرك. لكن ليس الليلة.»\u003c/p>\u003cp>«هل هو سيئ؟»\u003c/p>\u003cp>«لا أعرف بعد.» مدّت يدها وأمسكت يده في العتمة. «وهذا هو السيئ.»\u003c/p>\u003cp>ضغط على يدها مرة واحدة. ومن خلف الباب، سمعا هو سانيانغ تقلب جنبها على السرير.\u003c/p>"},{"n":22,"t":"الفصل الثاني والعشرون: الفائدة على الفائدة","b":"\u003cp>في اليوم الثاني والسبعين، انعقد السوق تحت غيم كثيف، والبرد يقضم أصابع الباعة فوق موازينهم.\u003c/p>\u003cp>ذهبت شين يان إلى الساحة، وكان في ظنها أنها ستمر بسرعة. أخذت شياو دو معها، بعد أن أمرته هو سانيانغ أن يحمل ما تشتريه من السوق. ومشى لين بجانبها يحمل سلة صغيرة فيها عينات من الدقيق للبيع، وأبطأ عند كل بقعة جليد حتى تمسك شين يان بذراعه.\u003c/p>\u003cp>كانت الساحة مزدحمة، لكن الباعة افترشوا مواضع متباعدة. الباعة أقل، والأصوات أخفض، والناس يمشون بين الحصائر ملتفين بالأغطية، ينظرون إلى السلع ولا يمدون أيديهم إليها. في الركن الشمالي، قرب شجرة الكاتب العارية، كان حشد صغير يحيط بشيء.\u003c/p>\u003cp>مرّوا بطاولة تشيان في الطريق.\u003c/p>\u003cp>كان جالساً خلف مدفأة صغيرة من النحاس، وتحت قدميه حصير سميك، وبين يديه كوب شاي ساخن يتصاعد منه البخار. نهض لهم برفق، وانحنى انحناءة صغيرة لشين يان، وقال بدفء:\u003c/p>\u003cp>«سيدتي صاحبة الحساب. مضت أسابيع منذ التقينا أول مرة هنا. والناس لا يتحدثون إلا عن طاحونة جياو.» ثم ابتسم. «كيف حال الطاحونة؟ أسمع أن الحمار يدير الحجر. اثنا عشر أو ثلاثة عشر كيساً في اليوم؟»\u003c/p>\u003cp>«أقل.»\u003c/p>\u003cp>«أقل. أحسن إذن.» أشار بيد ممتلئة إلى مدفأته. «الدفء ثمنه نحاسة واحدة للساعة في هذا الشتاء. وقد سمعت أنكم تمنحونه مجاناً للجميع.»\u003c/p>\u003cp>«لا نمنح شيئاً مجاناً.» قالت شين يان.\u003c/p>\u003cp>«حقاً؟» ضحك. «يقولون غير ذلك. يقولون: يوم وعد.»\u003c/p>\u003cp>مرّوا. وسمع لين، وهو يبتعد، صوت كوب يوضع على النحاس بدقة، وصوته يعود إلى مساومة زبون على سلة ملح.\u003c/p>\u003cp>قال شياو دو بصوت خافت: «لا تنظري.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«لا تنظري يا عمة شين.» وضع يده على ذراعها بحركة غير معتادة منه. «هناك... عقوبة.»\u003c/p>\u003cp>لكنها كانت قد نظرت.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الرجل مربوطاً إلى عمود خشبي منخفض، يداه خلف العمود وصدره عارٍ في البرد، وظهره محني نحو الأمام. ورجلان من حرس الكاتب وو، بمعطفيهما الرماديين، يقف أحدهما خلفه، والآخر يمسك سوطاً من جلد مجدول، قصيراً سميكاً.\u003c/p>\u003cp>لم يكن الرجل شاباً. شعره أشيب، ولحيته غير حليقة، وجلد ظهره أبيض كجلد سمكة. وعلى الظهر، خطوط حمراء عريضة متوازية، بعضها ينز دماً داكناً، تجمدت أطرافه فوق الجلد.\u003c/p>\u003cp>سمع لين السوط يرتفع، ثم يهبط.\u003c/p>\u003cp>لم تكن الضربة صاخبة. كانت صوتاً ثقيلاً رطباً، كأن أحداً يضرب لحماً على لوح. اهتز جسد الرجل كله، وخرج منه نفس مكتوم، لا صراخ.\u003c/p>\u003cp>«ثمانية.» قال الحارس بصوت رتيب. وعدّ على أصابعه. «بقيت اثنتان.»\u003c/p>\u003cp>وقفت شين يان.\u003c/p>\u003cp>لم يكن في وجهها شيء. لكن لين أحس أصابعها تنغرس في ذراعه، ثم تدخل الكم، حتى آلمته من خلال الثوب.\u003c/p>\u003cp>على صندوق خشبي مقلوب قرب العمود، جلس الكاتب وو. معطفه الأزرق على كتفيه، وفي يده كوب الشاي نفسه، ودفتر مفتوح على ركبتيه. كان ينظر إلى الدفتر لا إلى الظهر، ويكتب شيئاً بفرشاته الرقيقة.\u003c/p>\u003cp>قال بصوت مهذب مسموع، وكأنه يخاطب أحداً لا يريد إزعاجه: «ضريبة الرأس للشتاء. ثلاثون نحاسة عن كل نفس. وهو متأخر ثلاثة أسابيع. والقانون ضيق في هذه الأمور كما تعلمون. عشر جلدات للمتأخر الأول، وعشرون للثاني، وبعدها...» رفع عينيه الناعستين. «لا أحب الحديث عن بعدها.»\u003c/p>\u003cp>«تسعة.» قال الحارس.\u003c/p>\u003cp>هبط السوط.\u003c/p>\u003cp>أغمض لين عينيه. حين فتحهما، رأى زوجة الرجل، امرأة نحيلة في الصف الأمامي، ويداها على فمها، وطفلان صغيران ملتصقان بساقها. لم يكن أحد منهم يبكي. كانوا فقط ينظرون، كما ينظر الناس إلى ما لا يستطيعون أن يوقفوه.\u003c/p>\u003cp>«عشرة.»\u003c/p>\u003cp>قطع الحارس الحبال. سقط الرجل على ركبتيه في الثلج، ثم على جنبه، وفتحت زوجته فمها أخيراً، ولم يخرج منه صوت. ركضت إليه.\u003c/p>\u003cp>قال الكاتب وو: «ضريبته تُدفع في الربيع. أرجو أن يتحسن الطقس.» وأغلق الدفتر برفق.\u003c/p>\u003cp>لم يتحرك أحد من الحشد. كانت الزوجة تحاول أن ترفع الرجل، وجسدها الصغير لا يقوى. ورأى لين الحارسين يتبادلان نظرة ملل، كمن أنهى عملاً.\u003c/p>\u003cp>تقدم دون أن يقرر.\u003c/p>\u003cp>«ساعدني.» قال لشياو دو، وانحنى. أمسك الرجل من تحت إبطيه، وبقي دمه الدافئ على كفيه بعد أن لمس الظهر دون قصد، فارتجف. كان الرجل ثقيلاً وبارداً، يتنفس بصعوبة، وعيناه مغمضتان وشفتاه تتحركان بكلمات بلا صوت.\u003c/p>\u003cp>جاءت شين يان، وخلعت لحافها، ولفته على كتفيه، وأبقت القماش بعيداً عن جروح ظهره. ثم قالت للمرأة: «بيتكم؟»\u003c/p>\u003cp>«قريب.» همست. «عند الجسر الصغير.»\u003c/p>\u003cp>مشوا في الثلج، بطيئين، والطفلان يتبعان الأم بصمت. توقفوا عند باب من خشب ملتوٍ. دفعته الزوجة بكتفها، وفي الداخل غرفة واحدة صغيرة، عارية من أي دفء، وموقد في الركن لا نار فيه. على الأرض فراش ممزق، وإبريق مكسور، وطفلة ثالثة في السادسة تجلس في الزاوية وحدها، وعيناها على الباب منذ الصباح.\u003c/p>\u003cp>مدّدوه على بطنه. غسلت شين يان أطراف الجروح بماء فاتر وقطعة قماش نظيفة وجدتها الزوجة في الصندوق. أطلق صرخة قصيرة، ثم سكت. وقفت المرأة في الباب لا تعرف أين تضع يديها.\u003c/p>\u003cp>قالت: «ثلاثون نحاسة. لو كان عندنا ثلاثون نحاسة.»\u003c/p>\u003cp>«كم تملكين؟»\u003c/p>\u003cp>«أربع.»\u003c/p>\u003cp>لم يقل لين شيئاً. أخرج من جيبه الكيس الصغير، الذي أعطته إياه شين يان في الصباح. فيه ثلاث نحاسات الجزار. أعطاها المرأة كلها.\u003c/p>\u003cp>حرك الرجل رأسه على الفراش، فمدت ابنته الصغيرة يدها لتلمس كتفه. أمسكت الأم برسغها قبل أن تبلغ الجرح، ثم جلست بها إلى جانب الباب.\u003c/p>\u003cp>«لماذا لا يلبس أبي؟» سألت الطفلة.\u003c/p>\u003cp>نظرت المرأة إلى القميص الملقى عند قدميه. كانت على ظهره بقع يابسة، والتصق أحد كميه بالثلج الذي دخلوه معهم. أخذته وبدأت تفركه بين أصابعها، من غير ماء.\u003c/p>\u003cp>تراجع لين ليترك لها مكاناً. اصطدمت ساقه بالإبريق المكسور، فانحنى ووضع القطعتين قرب الحائط. لم يكن في الغرفة ما يستطيع إصلاحه بسرعة؛ لا طعام يحمله إليهم، ولا حطب في جيبه، ولا كلمة تعيد الرجل إلى ما كان عليه قبل السوق.\u003c/p>\u003cp>وقفت شين يان بعد غسل الجروح، وأمسكت حافة الموقد لحظة حتى استقرت قدماها. أراد أن يأخذ اللحاف ويعيده إلى كتفيها، لكنها هزت رأسها ونظرت إلى الأطفال. تركه فوق ساقي أبيهم، ثم رفع عن الأرض حذاء الصبي ووضعه قرب الفراش.\u003c/p>\u003cp>نظرت المرأة إلى النحاسات، ثم إلى شين يان. «لا أستطيع...»\u003c/p>\u003cp>«ليست هدية.» قالت شين يان وهي تضع النحاس في كف المرأة وتغلق أصابعها عليه. «هي أجر. زوجك يعرف الخشب؟»\u003c/p>\u003cp>«كان نجاراً. قبل أن يمرض ظهره.»\u003c/p>\u003cp>«سيأتي إلى الطاحونة حين يتعافى. العجوز يانغ يحتاج إلى يد.» ثم سألت المرأة: «وأنتِ، هل تستطيعين الغربلة؟ نحتاج إلى من يساعدنا حين تكثر الأكياس.»\u003c/p>\u003cp>لم تشكر المرأة. انحنت فقط، انحناءة قصيرة عميقة، ثم أدارت وجهها سريعاً نحو الفراش.\u003c/p>\u003cp>وفي الطريق عائدين، حين أصبحت الساحة أمامهم من جديد وبقي العمود الدامي خلفهم، قال لين بصوت منخفض: «هذا بيت من الأحد عشر.»\u003c/p>\u003cp>«نعم.» قالت شين يان. «ونتحدث عن ثلاثين نحاسة، لا عن حطب.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت لوحة المراسيم على بعد عشرين خطوة.\u003c/p>\u003cp>لوح خشبي طويل مثبت بين عمودين تحت سقف صغير من القرميد، عليه ورق أصفر مدبّس بمسامير، مكتوب عليه بحروف كبيرة سوداء. وقف أمامه قليلون، ووجوههم إلى الورق وأجسادهم إلى الوراء، بعيدين عن العمود الذي لا يزال عليه دم.\u003c/p>\u003cp>قالت شين يان، وكان صوتها هادئاً أكثر مما ينبغي: «اقرأ لي.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«الورقة. من البداية.»\u003c/p>\u003cp>نظر الصبي إلى لين، الذي أومأ. وتقدم شياو دو إلى اللوح، وأخذ يتتبع الحروف بإصبعه، ويقرأ بصوت منخفض متعثر:\u003c/p>\u003cp>«مرسوم... مقاطعة يونغآن... سنة... الدين.» توقف. «الدين الخاص. القرض.» أخذ نفساً. «لا يجوز أن تزيد الفائدة على القرض الواحد عن ثلاثة أجزاء من عشرة في السنة.»\u003c/p>\u003cp>«ثلاثة أجزاء من عشرة.»\u003c/p>\u003cp>«نعم.» عبس. «وبعدها شيء... لا يجوز أن... تُحسب الفائدة على الفائدة.» رفع رأسه. «معناها يا عمة شين...»\u003c/p>\u003cp>«أعرف معناها.»\u003c/p>\u003cp>«يعني من اقترض مئة، واستحقت عليه ثلاثون فائدة ولم يدفعها، فلا تُضاف الثلاثون إلى المئة لتؤخذ عليها فائدة جديدة.»\u003c/p>\u003cp>«ويعاقب من فعل.»\u003c/p>\u003cp>«هنا مكتوب: يُجلد ويُغرَّم.» ابتلع. «لكن لا أحد يُجلد على هذا. أنا لم أرَ أحداً قط.»\u003c/p>\u003cp>قالت: «قرأت ما يكفي.»\u003c/p>\u003cp>أخرجت دفترها من جيب سترتها، وأسندته إلى اللوح بساعدها، ثم كتبت النص الذي قرأه الصبي. رأى لين، الواقف خلفها، الأرقام الصغيرة تظهر إلى جانب السطور: ثلاثة، عشرة، صفر.\u003c/p>\u003cp>ثم أغلقت الدفتر.\u003c/p>\u003cp>«نعود.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم تتكلم حتى وصلا المخزن.\u003c/p>\u003cp>كان الصبي قد عاد إلى المطبخ بعد أن ألقى إليهما نظرة مرتبكة، وبقيا وحدهما، والباب مغلق، والهواء مشبع برائحة الدخان والقش. وقفت في منتصف الغرفة الصغيرة، وفكّت وشاحها ببطء، وجلست على الفراش. ثم قالت:\u003c/p>\u003cp>«الكتب.»\u003c/p>\u003cp>رفع لين رأسه. «كتب هو سانيانغ؟»\u003c/p>\u003cp>«ليلة اليوم الثامن والستين.» ضغطت أصابعها على جفنيها. «كنت سأخبرك قبل هذا. لكنني أردت أن أتأكد من الأرقام.»\u003c/p>\u003cp>وأخبرته.\u003c/p>\u003cp>لم تُخف شيئاً. الصندوق، والمفتاح، والكتب السبعة، والخط الكبير المستدير، ودفعات الخريف والربيع والصيف والشتاء إلى «بيت ليو»، تحت كلمة واحدة لم تتغير: «فائدة». والرقم ذو الحرفين والصفر. ثم، في الكتب الأخيرة، الخط الحاد، خط هو سانيانغ، يكتب الدفعة نفسها بالدقة نفسها.\u003c/p>\u003cp>استمع لين دون مقاطعة. وحين انتهت، قال: «كم؟»\u003c/p>\u003cp>«ما استطعت أن أقرأه.» فتحت الدفتر، وأدارت صفحة. «في كل موسم، بين عشرين وخمس وعشرين نحاسة. أربعة مواسم في السنة. أربعة عشر عاماً.»\u003c/p>\u003cp>«في الصندوق سبعة كتب.»\u003c/p>\u003cp>«سبعة كتب. كل كتاب عامان.» بسطت أصابعها على الورق. «حسبت ما قرأته. وقدّرت الباقي. حوالي ألف ومئة نحاسة.»\u003c/p>\u003cp>«ألف ومئة.»\u003c/p>\u003cp>«نعم.» رفعت عينيها إليه. «ولا أعرف أصل الدين. لا قيد في الكتب يقول كم أخذوا. ولا متى. ولا لماذا. لكن لو كانت الفائدة ثلاثة أجزاء من عشرة في السنة، كما في اللوحة، فكم يلزم أن يكون القرض ليدفع مثل هذه الدفعات؟»\u003c/p>\u003cp>حسب لين في رأسه. ثمانون نحاسة سنوياً. «حوالي مئتين وسبعين.»\u003c/p>\u003cp>«مئتان وسبعون.» أومأت. «وما أكبر قرض يمكن أن يأخذه نزل مثل هذا؟ قيمته كلها، بيته وأثاثه وأرضه، ربما أربعمئة. هذا إن بيع كل شيء.» أخذت نفساً. «وما دُفع فائدةً وحدها، ألف ومئة. نحو ثلاثة أمثال أصل القرض إن كان قريباً من قيمة النزل.»\u003c/p>\u003cp>كان لين يحدق في الجدار.\u003c/p>\u003cp>«وهذا لا يعني أنهم يسرقون.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«قد تكون هناك رسوم أخرى. أو أن القرض أكبر. أو أن الفائدة...»\u003c/p>\u003cp>«قد تكون الفائدة على الفائدة.» أمسكت طرف الدفتر. «القانون يمنعها، لكن هذه الأرقام وحدها لا تثبت أنها وقعت.» ثم أضافت: «ولم تتوقف الدفعات حين مات زوجها. استمرت بخط هو سانيانغ. ست سنوات.»\u003c/p>\u003cp>صمتا.\u003c/p>\u003cp>وكان البرد قد بدأ يتسرب من تحت الباب. سمع لين، بعيداً، صوت امرأة تبكي في الساحة، ثم ينقطع.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قال: «هذه ورقة ضد ليو.»\u003c/p>\u003cp>رفعت رأسها ببطء.\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«ما قلتِه. الدفاتر. الأرقام. إذا كانت صحيحة، فهي ورقة. أمام الكاتب وو، أو الحاكم. تكشف أن ليو يأخذ فائدة غير قانونية.» وقف. كان صوته هادئاً، لكن كل جملة تخرج بسرعة. «وليو يريد أرضنا. ويقيس المنعطف بحبل. ويرسل رجاله ليتكلموا في السوق. ولدينا في أيدينا ما يوقفه.»\u003c/p>\u003cp>«في أيدينا.»\u003c/p>\u003cp>«في يديك.»\u003c/p>\u003cp>«ليست في يدي.» نظرت إليه بحدة لم يرها منذ الماء المتجمد. «الكتب في صندوق هو سانيانغ. والأرقام في رأسها. وأنا لم أتعلم هذه القصة منها.»\u003c/p>\u003cp>«لكنك علمتِها.»\u003c/p>\u003cp>«سرقتها.»\u003c/p>\u003cp>«قرأتِها بمفتاح أعطتك إياه.»\u003c/p>\u003cp>«وهي نصف نائمة، ولم تعرف.» وقفت، ووضعت يدها على بطنها. «لين. اسمعني. هذه قصتها. قصتها، لا قصتنا. هي التي عاشت فيها ست سنوات وحدها، تدفع ولا تقول، وتكتب ولا تقول. لا أعرف لماذا. لعل الأمر أكبر من الدين. لعله عار. لعله حب. لعله خوف.»\u003c/p>\u003cp>«أو لعله ظلم.»\u003c/p>\u003cp>«قد يكون ظلماً.» رفعت صوتها قليلاً. «لكنه ظلمها هي. ولا يحق لنا أن نأخذه منها لنستعمله.»\u003c/p>\u003cp>«وماذا لو استعملناه لنحميها؟»\u003c/p>\u003cp>«لا تقل هذا.» حدّقت فيه. «أنا أعرف هذه الجملة. أعرفها جيداً. كل من سرق شيئاً من أحد، قال إنه يحميه.»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>مد لين يده إلى الدفتر. أغلقت شين يان كفها فوقه، فتوقف، وأعاد يده إلى ركبته.\u003c/p>\u003cp>ثم قال، بصوت منخفض: «ومن سيحميها إن لم نفعل؟»\u003c/p>\u003cp>«هي.» ثم أضافت: «أو لا أحد. وهذا مؤلم، لكنه حقها.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يتشاجرا بعد ذلك.\u003c/p>\u003cp>بقي لين واقفاً قرب الباب، ولم تمد شين يان يدها إليه لتجلسه كما كانت تفعل. أخذت شين يان كوب الماء البارد من بجانب الفراش وشربت منه، ثم وضعته، وجلست على القش في زاويتها.\u003c/p>\u003cp>أخرجت الدفتر.\u003c/p>\u003cp>فتحته على صفحة بيضاء. ورأى لين، من مكانه، أنها تكتب الأرقام بالطريقة التي تعلماها في عالمهما، والتي لا يقرؤها أحد هنا غيرهما: ثلاثة، وصفر، ثم مجموعات أخرى. الدفعات التي حفظتها. ثمانون في السنة. أربعة عشر عاماً. ألف ومئة. مئتان وسبعون. أربعمئة. وكل رقم في سطر.\u003c/p>\u003cp>كتبت ببطء، تتوقف عند كل دفعة لتراجع جمعها. وفي أسفل الصفحة، عدّت وجمعت وسطرت خطاً. ثم أمسكت القلم لحظة، ووضعت في آخر الصفحة نقطة.\u003c/p>\u003cp>أغلقت الدفتر.\u003c/p>\u003cp>قالت، وكانت تنظر إلى الجدار لا إلى لين:\u003c/p>\u003cp>«لن أستعملها.»\u003c/p>\u003cp>رفع رأسه.\u003c/p>\u003cp>«لكني لن أنساها.»\u003c/p>"},{"n":23,"t":"الفصل الثالث والعشرون: ما لا يُقال","b":"\u003cp>«لا تفعلي.»\u003c/p>\u003cp>لفّ لين الوشاح حول رقبتها عند باب المخزن في فجر اليوم الرابع والسبعين. تداخل بخار أنفاسهما في البرد، ورأى في عينيها عزماً لم يكن هناك في الليلة الماضية.\u003c/p>\u003cp>«لم أقل شيئاً بعد.»\u003c/p>\u003cp>«لا حاجة. أعرفك.» سوّى طرف الوشاح. «ستسألينها.»\u003c/p>\u003cp>«سأسألها بحذر.»\u003c/p>\u003cp>«وهل يوجد سؤال بحذر عن هذا؟»\u003c/p>\u003cp>«يوجد.» رفعت ذقنها. «كلمة واحدة. في كتاب قديم. لا أقول لها ماذا قرأت ولا ماذا حسبت.»\u003c/p>\u003cp>«ستعرف.»\u003c/p>\u003cp>«قد تعرف. وقد لا تعرف.» وضعت كفها على صدره، فوق معطفه، حيث ينبض قلبه. «لين. هي تحمل هذا وحدها منذ ست سنوات. ولا أريد أن أكون أنا التي تعرف وتنتظر. إن لم أقل شيئاً، فسيصير سرنا نحن، وسرها هي. ولا أستطيع أن أمشي في بيتها وأنا أعرف ما تخفيه، وهي لا تعرف أنني أعرف.»\u003c/p>\u003cp>«وهل هذا يغير شيئاً؟»\u003c/p>\u003cp>«يغير كل شيء بالنسبة إلي.»\u003c/p>\u003cp>لم يجادل. كان قد جادل بما يكفي في اليوم الثاني والسبعين. لكن حين خرجت، بقي واقفاً عند الباب ينظر إلى ظهرها المنحني قليلاً وهي تمشي نحو المطبخ، وكاد يناديها مرة أخرى. أمسك حافة الباب حتى بلغت المطبخ، ثم عاد إلى حذائه وربطه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عادت في المساء من الطاحونة ولم تفتح الموضوع بعد. توقفت عند باب المطبخ لتلتقط أنفاسها، ثم دخلت وجلست إلى الكتاب، تنقل القيود التي تركتها هو سانيانغ على الطاولة.\u003c/p>\u003cp>كانت هو سانيانغ قد فرغت من طبخ العشاء لخمسة نزلاء، تجار صغار عالقين بسبب الثلج، ودخلت المطبخ لتجلس أمام الموقد مثل كل ليلة. وكان كتابها على الطاولة مفتوحاً، وأمامه شين يان تكتب قيودها المسائية على الصفحة بخط صغير مرتب، وهي تنقل الأرقام الثقيلة بحبر أسود من محبرة نحاسية. وشياو دو ينظف الأوعية، ولين يجلس على الأرض بجانب الموقد، يصلح قفل صندوق صغير بقطعة سلك.\u003c/p>\u003cp>احتك قاع القدر بالحجر حين أزاحته هو سانيانغ عن النار. رفع لين القفل إلى الضوء، ثم أعاده إلى ركبته.\u003c/p>\u003cp>أنهت شين يان القيد الأخير: «ثلاثة أكياس دقيق. سبع سلال حطب. عشاء لخمسة.» ووضعت القلم. ثم قالت دون أن ترفع رأسها:\u003c/p>\u003cp>«هو سانيانغ.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«في الكتب القديمة التي قرأتها...»\u003c/p>\u003cp>لم تقطع هو سانيانغ حركتها. كانت تحرك المغرفة في القدر.\u003c/p>\u003cp>«...وجدت كلمة لم أفهمها. أو فهمتها، لكنني لا أعرف كيف تُستعمل في هذا الموضع.»\u003c/p>\u003cp>«أي كلمة؟»\u003c/p>\u003cp>«فائدة.»\u003c/p>\u003cp>توقفت المغرفة.\u003c/p>\u003cp>قطرت من المغرفة بقية الحساء على حافة القدر. ظلت هو سانيانغ ممسكة بها، ثم وضعتها بعناية إلى جانب النار.\u003c/p>\u003cp>لم تلتفت.\u003c/p>\u003cp>«أين وجدتها؟»\u003c/p>\u003cp>«في قيد الخريف. تحت اسم...»\u003c/p>\u003cp>«أين؟»\u003c/p>\u003cp>«في الكتب القديمة. كلها. ربما.» رفعت شين يان عينيها. «سألت فقط لأنني...»\u003c/p>\u003cp>التفتت هو سانيانغ.\u003c/p>\u003cp>انقبض فمها، وبدت البقع الداكنة تحت عينيها أوضح في ضوء الموقد. ثبتت نظرها على شين يان حتى أنزلت هذه يدها عن الكتاب.\u003c/p>\u003cp>قالت بصوت هادئ جداً:\u003c/p>\u003cp>«ماذا قرأتِ؟»\u003c/p>\u003cp>«قيود. حطب. دقيق.» ابتلعت شين يان ريقها. «وبعض الأرقام إلى بيت ليو...»\u003c/p>\u003cp>«توقفي.»\u003c/p>\u003cp>«أنا...»\u003c/p>\u003cp>«توقفي.» لم ترفع هو سانيانغ صوتها. كان أخفض من قبل، وأخطر. «ما سمحت لك أن تقرئي عن بيت ليو.»\u003c/p>\u003cp>«لم أقصد...»\u003c/p>\u003cp>«سمحت لك أن تتمرني على الخط.» خطت خطوة نحوها. «ولم أسمح لك أن تقرئي حياتي.»\u003c/p>\u003cp>«لم أقرأ حياتك. قرأت أرقاماً.»\u003c/p>\u003cp>«أرقاماً.» ضحكت ضحكة قصيرة بلا صوت. «الأرقام حياتي يا بنتي. أنتِ تعرفين هذا. أنتِ تحسبين الأرقام ليلاً ونهاراً.»\u003c/p>\u003cp>قال لين من مكانه: «هو سانيانغ.»\u003c/p>\u003cp>«لا تتكلم.» لم تنظر إليه. «هذا بيني وبين زوجتك.»\u003c/p>\u003cp>ثم عادت إلى شين يان، وسألتها بصوت بطيء، كمن يستجوب شاهداً: «من أعطاك المفتاح؟»\u003c/p>\u003cp>«أنتِ.»\u003c/p>\u003cp>«أنا.» أغمضت عينيها ثانية. «كنت متعبة. قلت: خذي واحداً من الأعلى.» فتحتهما. «والكتاب الذي أخذتِ، أخذتِ غيره أيضاً.»\u003c/p>\u003cp>لم تنكر شين يان.\u003c/p>\u003cp>«أعرف. رأيت أن الدائرة والنقاط في غير مكانها بعد تلك الليلة.» دفعت الكتاب المغلق بإصبعها. «وقلت لنفسي: لعلها تنظف. لعلها فقط تتعلم الخط.» ثم هزت رأسها. «أنا غبية. أعرف الناس منذ عشرين سنة، وصدقت امرأة تقرأ.»\u003c/p>\u003cp>وقفت شين يان، ويدها على بطنها. كانت أصابعها ترتجف قليلاً على الخشب. لكنها لم تتراجع.\u003c/p>\u003cp>«أردت أن أعرف إن كنتِ تريدين أن تكوني وحدك مع هذا.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أردت أن تعرفي أن هناك أحداً يعرف. وأنني لن أستعمل ما قرأته. ولا لين. ولا أحد.» كان صوتها ثابتاً، لكنها اضطرت إلى أخذ نفس بين الجملة والأخرى. «وإذا أردتِ أن تتحدثي، فأنا...»\u003c/p>\u003cp>«دفاتري ليست لك.»\u003c/p>\u003cp>انقطع الكلام.\u003c/p>\u003cp>أزاحت هو سانيانغ يد شين يان عن الطاولة، ثم مدت كفها أمامها.\u003c/p>\u003cp>«الكتب القديمة لا تُفتح بعد اليوم. لا لك، ولا للصبي، ولا لأحد.» مدت يدها. «المفتاح.»\u003c/p>\u003cp>أخرجت شين يان المفتاح النحاسي من حزامها، ووضعته في كف هو سانيانغ. ظلت الكف مفتوحة لحظة، ثم أغلقت عليه.\u003c/p>\u003cp>خرجت من المطبخ.\u003c/p>\u003cp>سمعوا خطواتها في الممر، ثم صوت باب. ثم صوتاً غريباً: صراً طويلاً مؤلماً، خشبياً، كأن شيئاً ثقيلاً يُسحب على الأرض. بلغ الصرير عتبة الغرفة الصغيرة وتوقف. ثم استؤنف، واتجه إلى غرفة هو سانيانغ في آخر الممر.\u003c/p>\u003cp>نهض ليساعدها. أوقفته شين يان بحركة من يدها، دون أن تنظر إليه.\u003c/p>\u003cp>لم يصدر بعد ذلك صوت. سوى باب يُغلق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في صباح اليوم التالي، الخامس والسبعين، وجد لين وعاءيهما على الطاولة ولم يجد هو سانيانغ قرب الموقد.\u003c/p>\u003cp>لم تعد هو سانيانغ تتكلم مع شين يان. لم تتشاجر معها، ولم تطردها. فقط توقفت عن النظر إليها، وعن الكلام. وفي المساء وجدت شين يان كتاب الحسابات مغلقاً على الرف، لا على الطاولة، وأدركت أن القيود المسائية انتهت.\u003c/p>\u003cp>كان الطعام يوضع على الطاولة كل صباح ومساء. وعاء العصيدة، وقطعة اللحم المقدد، والخبز. لا كلمة. تضعه ثم تنصرف. كانت تعاملهما بالحد الأدنى من الحاجة: تطعمهما كما تطعم أي نزلاء، وتنام في غرفتها، وتغلق الباب.\u003c/p>\u003cp>إذا اضطرت شين يان إلى سؤالها عن الحطب، جاءها جواب من كلمة، وعادت خشخشة المغرفة وحدها تملأ المطبخ.\u003c/p>\u003cp>لم يلم لين شين يان. لم يقل لها إنه حذّرها. رآها تفتح دفترها ثم تعيده إلى جيبها قبل أن تكتب شيئاً. جلس بجانبها في المخزن، يمسح كتفيها حين ترتجف، ويقول لها كلاماً قليلاً عن الطاحونة والخشب والحمار.\u003c/p>\u003cp>وفي الليلة الثانية، قالت دون أن ترفع رأسها عن ركبتيها:\u003c/p>\u003cp>«كنت مخطئة.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«كنت مخطئة. وأنت تعرف. ولا تقول.»\u003c/p>\u003cp>«أعرف أنك كنتِ صادقة.» جلس أمامها على القش. «لكنها لم تطلب أن نتدخل. كان ينبغي أن ننتظر.»\u003c/p>\u003cp>رفعت رأسها. كانت عيناها حمراوين، لكن لا دمع فيهما.\u003c/p>\u003cp>«قلت لها: لا تكوني وحدك مع هذا.» همست. «وهي سمعتني تقول: أنا أعرف ما تخفينه.»\u003c/p>\u003cp>«ربما.»\u003c/p>\u003cp>«ربما.» أخذت نفساً مرتجفاً. «وأنا لا أستطيع إعادة الكلمة.»\u003c/p>\u003cp>تحرك شياو دو في الممر، ثم وقف عند بابهما. عرفاه من احتكاك نعله ومن التنحنح القصير الذي سبق طرقته.\u003c/p>\u003cp>قال لين: «ادخل.»\u003c/p>\u003cp>فتح الصبي الباب بقدر ما يتسع لرأسه. كان يحمل وعاء ماء ساخن بكلتا يديه، وقد لف أصابعه بخرقة.\u003c/p>\u003cp>«بقي من غسل الأوعية.»\u003c/p>\u003cp>تقدمت شين يان وأخذته منه. «شكراً.»\u003c/p>\u003cp>نظر إلى وجهها ثم أنزل عينيه. «أنا لم أقل لأحد عن الكتب.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«ولا حتى عن اسمي.»\u003c/p>\u003cp>وضعت الوعاء فوق الصندوق. أرادت أن تجلسه إلى جانبها، لكنه بقي عند العتبة، يهز قدمه داخل الحذاء الواسع.\u003c/p>\u003cp>قالت: «لم تفعل شيئاً يستحق العقاب. أنا التي طلبت المفتاح، وأنا التي فتحت الكتب.»\u003c/p>\u003cp>«لكنني رأيت الحروف أيضاً.»\u003c/p>\u003cp>«ولم تأخذ شيئاً.»\u003c/p>\u003cp>سكت، ثم مد يده إلى مقبض الباب. «إذا سألتني العمة؟»\u003c/p>\u003cp>أجابت بعد لحظة: «قل لها ما حدث. كما حدث تماماً. لا تُخفِ شيئاً من أجلي.»\u003c/p>\u003cp>أومأ الصبي، وإن لم يبد أنه اطمأن. انتظر لين حتى ابتعد، ثم أخذ الوعاء ووضعه أمام شين يان. غمست يديها في الماء، وفركت بقعة حبر صغيرة عند ظفرها. لم تخرج من أول مرة، فعادت إليها بإبهامها.\u003c/p>\u003cp>حين وضعت الماء جانباً، جلس لين إلى جوارها ولف ذراعيه حولها. بقيت ساكتة حتى ثقل رأسها على كتفه ونامت. أرخى قبضته حين نامت، وسحب الغطاء إلى كتفيها من غير أن يوقظها.\u003c/p>\u003cp>وفي منتصف الليل، شعر بيدها تتحرك وتبحث، ثم وجدت يده، ووضعتها على بطنها العالي. لم تقل شيئاً. كانت نائمة، أو شبه نائمة. لم يتحرك شيء تحت كفه. لكنه بقي هناك، دافئاً، منتظراً، حتى استقرت أنفاسها وعادت يدها فارتخت فوق يده.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في عصر اليوم السادس والسبعين، سمع لين وقع حذاء تشانغ عند باب الطاحونة.\u003c/p>\u003cp>لم يقل لماذا. وقف عند باب الغرفة الحجرية يراقب لاو دونغ وهو يصب الدخن في الفتحة، وزاو يدور خارجاً بخطوات ثقيلة، ثم دخل ووضع كفه على خشبة الحامل قرب الترس، وأنصت. ثم دار حول العجلة مرة، وقال دون أن يلتفت إلى لين:\u003c/p>\u003cp>«صوتها تعب.»\u003c/p>\u003cp>«أي صوت؟»\u003c/p>\u003cp>«صوت النزل.» رفع كتفيه. «سمعت من الصبي.»\u003c/p>\u003cp>«أي صبي؟»\u003c/p>\u003cp>«الذي يقلد الناس. جاء يشتري مسامير ثلاثة، وقال لي سبع جمل، ست منها لا علاقة لها بالمسامير.» حك أذنه الصماء. «ولا أحب أن يتكلم أحد كثيراً في ما يخص الست هو. لكنه قال شيئاً.»\u003c/p>\u003cp>لم يرد لين.\u003c/p>\u003cp>«أعرف الست هو منذ كنت أطرق أول سندان في هذه القرية. كانت تأتي بسكينها لأحدّها، وتقف تراقب النار كأنها تحسب ثمنها.» قالها بصوت أجش خافت. «من عاش في هذه القرية عشرين سنة يعرف أن لكل بيت شيئاً مدفوناً. أحياناً تحت الموقد، وأحياناً تحت الصندوق.»\u003c/p>\u003cp>«وماذا يفعل الجيران؟»\u003c/p>\u003cp>«يتجنبون أن يدوسوا.» نظر إليه. «ومن يدوس عن غير قصد، يقف ويرفع قدمه. لا يقول: أنا لم أقصد. يرفعها فقط.»\u003c/p>\u003cp>ثم خرج.\u003c/p>\u003cp>بقي لين ينظر إلى الباب. أعاد القفل الذي كان يصلحه إلى الصندوق، ولم يذهب إلى النزل إلا في موعد العشاء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الليلة الثالثة بعد الخلاف، حمل لين سلة حطب إلى باب غرفة هو سانيانغ.\u003c/p>\u003cp>لم يكن بحاجة إلى ذلك. كانت السلة المعتادة قد وُضعت. لكنه أراد أن يفعل شيئاً بيديه، أي شيء، فانتقى من الحظيرة قطع بلوط جافة، ونفض ما علق بها من غبار، ثم حملها إلى غرفتها.\u003c/p>\u003cp>وقف أمامه. سمع وراءه صوتاً خافتاً: أنفاس عميقة، وحفيف ورق يُقلَّب بحذر.\u003c/p>\u003cp>قال بصوت منخفض: «حطب.»\u003c/p>\u003cp>لم يجبه أحد.\u003c/p>\u003cp>«جاف. من البلوط. لا يدخن.»\u003c/p>\u003cp>صمت. ثم قالت هو سانيانغ من الداخل، بصوت لم يعرفه لين، مبحوح، بلا حدة:\u003c/p>\u003cp>«ضعه عند العتبة.»\u003c/p>\u003cp>وضعه.\u003c/p>\u003cp>«ولين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«لا تقل لي شيئاً.»\u003c/p>\u003cp>«لم أكن سأقول.»\u003c/p>\u003cp>«أعرف.» سمع صوت سرير يصر. «وهذا هو السبب الذي جعلني لا أطردكما.»\u003c/p>\u003cp>بقي لين واقفاً لحظة طويلة. ثم أطرق، ومضى.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في فجر اليوم الثامن والسبعين، وجد لين شياو دو عند باب المطبخ.\u003c/p>\u003cp>كان واقفاً عند باب المطبخ، قبل أن تصحو القرية، ويده على قدر فارغ، وقد بدا أنه لم ينم. نظر إلى لين وهو يدخل، ثم إلى الموقد الخافت، ثم إلى الكرسي الفارغ، وقال بصوت صغير جداً:\u003c/p>\u003cp>«لماذا العمة حزينة؟»\u003c/p>\u003cp>لم يعرف لين ماذا يقول.\u003c/p>\u003cp>«ليست غاضبة.» تابع الصبي بسرعة، كأنه يعدّد دلائل. «أعرف الغضب. حين تغضب تصيح وتقذف الأواني. هي الآن لا تقذف شيئاً. تغسل الأواني ببطء. وتضع الطعام. ولا تنظر.» أمسك القدر بكلتا يديه. «وأنا سألتها: هل أنت مريضة؟ فقالت: لا. ثم قالت: اذهب إلى عملك.» رفع عينيه. «لم تقل: اذهب وإلا ضربتك.»\u003c/p>\u003cp>«لا. لم تقل.»\u003c/p>\u003cp>«هذا يعني أنها حزينة جداً.»\u003c/p>\u003cp>نظر إليه لين.\u003c/p>\u003cp>خفض شياو دو عينيه إلى القدر. وضعه في الحوض وراح يفركه بقوة، ورأسه منحنٍ، وكلما فرغ من جانب عاد إليه.\u003c/p>\u003cp>وضع لين يده على رأسه لحظة. ثم خرج.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في آخر تلك الليلة، استيقظت شين يان ومدت يدها إلى كوب الماء. كان فارغاً.\u003c/p>\u003cp>نهضت بهدوء كيلا توقظ لين. سارت في الممر المظلم، تتحسس الجدار بيد وتحمل الكوب بالأخرى. كان البرد قد خف قليلاً، والنزل يغفو على أنفاس النائمين، وصوت ريح خفيفة تلعب بالباب الخارجي.\u003c/p>\u003cp>ورأت الضوء.\u003c/p>\u003cp>كان خطاً رفيعاً أصفر على أرضية المطبخ، يتسلل من شق في الباب. وقفت. ثم دفعت الباب بإصبع، شبراً واحداً.\u003c/p>\u003cp>كانت هو سانيانغ وحدها.\u003c/p>\u003cp>جالسة على الأرض أمام الموقد، لا على كرسيها، وظهرها إلى الباب، وشعرها المنفوش فوق كتفيها. لم ترَ شين يان وجهها. رأت يدها اليمنى فقط، تمسك شيئاً صغيراً: ورقة صفراء مطوية، أو شريطاً من قماش. وكانت اليد الأخرى على فمها.\u003c/p>\u003cp>لم تسمع صوتاً. لكن كتفيها كانتا تهتزان.\u003c/p>\u003cp>ثم رفعت اليد اليمنى، ومدتها نحو فم الموقد، ورمت ما فيها في النار.\u003c/p>\u003cp>أضاءت لحظة. لهب أصفر صغير ارتفع، واشتعل شيء خفيف، وانكمش، ثم اختفى. ولم تر شين يان ما هو.\u003c/p>\u003cp>ظلت هو سانيانغ جالسة. لم تتحرك.\u003c/p>\u003cp>وتراجعت شين يان ببطء عن الباب، تحاول ألا تحرك ألواح الأرض، وعادت إلى المخزن بيد على فمها، ويد على بطنها.\u003c/p>\u003cp>لم تعرف ماذا كان.\u003c/p>\u003cp>لكنها عرفت أنها لن تسأل عنه.\u003c/p>"},{"n":24,"t":"الفصل الرابع والعشرون: كلمة في السوق","b":"\u003cp>جلس لين في ظهيرة اليوم الحادي والثمانين على حصيرة صغيرة في زاوية السوق، وأمامه ثلاثة أكياس دقيق مفتوحة، وميزان خشبي، ولوح مكتوب عليه بالفحم بخط شياو دو المتعثر: «دقيق الحجر الأزرق. طحن طاحونة جياو.»\u003c/p>\u003cp>كانت أول مرة يبيع فيها باسم الطاحونة.\u003c/p>\u003cp>وكان السوق في الشتاء شيئاً آخر. لا تكاد تسمع المناداة، والباعة يضمون أكمامهم إلى صدورهم ويتشاركون الفحم في مواقد صغيرة. على الأرض قرب بائعة البيض، بقايا عصفور ميت متجمد، جناحاه مفتوحان كأنه سقط في منتصف الطيران، والناس يخطون فوقه دون أن ينتبهوا. وفي الطرف الغربي، رجل عجوز يجلس عند عمود الجلد، حيث بقيت على الخشب بقعة داكنة لم يغسلها الثلج، يمد يده لكل مار بلا كلام.\u003c/p>\u003cp>مرّ إبهامه فوق حافة الميزان الباردة. أعاد الأثقال إلى مواضعها، ثم سوّى طرف الحصيرة بقدمه.\u003c/p>\u003cp>لم يكن البيع هو ما يقلقه. كان يعرف أن الدقيق جيد، مغربلاً مرتين، نظيفاً من حبيبات الحجر. وكان قد قاس الثمن مع شين يان على الورق: ثلاث نحاسات ونصف لنصف الكيس، أقل بنحاسة من دقيق طاحونة ليو الذي لا يُغربل. لكن الحصيرة كانت على الأرض المتجمدة بين بائع فخار وبائعة بيض، والريح تدخل من ياقته، وعيناه تتبعان وجوه الناس وهي تمر.\u003c/p>\u003cp>وكان هذا ما يقلقه: كيف ينظرون.\u003c/p>\u003cp>جاء الأول بعد ساعة. امرأة مكورة في معطف مرقع، توقفت أمام اللوح، وقرأته ببطء بشفتيها، ثم رفعت رأسها.\u003c/p>\u003cp>«طاحونة جياو.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«قيل لي إنها تدور.»\u003c/p>\u003cp>«تدور.»\u003c/p>\u003cp>«بحمار؟»\u003c/p>\u003cp>«بحمار.»\u003c/p>\u003cp>«وجودته؟»\u003c/p>\u003cp>أخذ حفنة من الكيس ووضعها في كفها. فركتها بين أصابعها، وشمتها، ووضعت قليلاً في فمها بطرف لسانها، كما تفعل نساء السوق. وقفت لحظة.\u003c/p>\u003cp>«ناعم.» قالت بدهشة. «أنعم من ليو.»\u003c/p>\u003cp>«وأرخص بنحاسة.»\u003c/p>\u003cp>«نحاسة.» كررت، كمن يزن مبلغاً أكبر من حجمه. ثم قالت: «نصف كيس.»\u003c/p>\u003cp>وزن لها نصف الكيس. دفعت بنحاس صغير مقصوص الحواف، أخذه لين وعدّه مرتين. وحين رفعت الدقيق على كتفها وانصرفت، لم تقل شيئاً. لكنها التفتت بعد خطوات ونظرت إلى اللوح مرة أخرى.\u003c/p>\u003cp>عاد إلى كفه وبقي فيها أثر الدقيق. مسحه عن راحته، ووضع النحاس في الكيس.\u003c/p>\u003cp>وقفت امرأة ثانية وراء الأولى حتى فرغت، ثم أشارت إلى الميزان.\u003c/p>\u003cp>«أرني الوزن.»\u003c/p>\u003cp>أعاد لين الكفة الفارغة إلى موضعها، ورفع الثقل كي تراه. مالت المرأة فوقه، وحكت سطحه بظفرها. كان بائع الفخار يراقبهما من الحصيرة المجاورة.\u003c/p>\u003cp>«لست من يثبت الأثقال»، قال لين. «إن أردت قارناه بثقل جارك.»\u003c/p>\u003cp>مد بائع الفخار يده من غير أن ينهض، وناوله ثقله. علقهما لين على طرفي الذراع. تأرجح الخشب، ثم استقر وفيه ميل يسير.\u003c/p>\u003cp>قال الرجل: «ثقلي يعلق به الطين.»\u003c/p>\u003cp>مسحه بكفه وأعاد التجربة. تقاربت الكفتان. أومأت المرأة، وفتحت كيسها الصغير ليصب لها الدقيق.\u003c/p>\u003cp>حين دفعت، لم تنظر إلى وجهه، بل تابعت كفه حتى وضع نحاسها بعيداً عن كفة الطعام. أعاد ثقل الفخار إلى صاحبه وشكره. قال الرجل وهو يسحبه: «لا تصب هنا. الريح تحمل غبارك إلى أوعيتي.»\u003c/p>\u003cp>أدار لين الكيس إلى الجانب الآخر. لم يحتج إلى محبته؛ كان يكفي أن يترك له موضعاً يبيع فيه، وأن يبقى الميزان أمام أعين الناس.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مضى بعد الظهر هكذا.\u003c/p>\u003cp>باع أنصاف أكياس وأقداراً أصغر. زادت أثمان المقادير الصغيرة في مجموعها نحاسة واحدة على سعرها لو بيعت دفعة؛ كان يبين الزيادة قبل أن يزن، ووقف طويلاً مع امرأتين تتشاحنان على الثمن قبل أن تتقاسما ما اشترتاه. كلما نقص كيس صب فيه من الذي يليه، وجمع النحاس في كيس حزامه، بعيداً عن أصابع المارة.\u003c/p>\u003cp>لكنه بدأ يلاحظ شيئاً.\u003c/p>\u003cp>كان الناس يمرّون عليه أكثر مما يشترون. يتباطؤون عند اللوح، يقرؤون الكلمات، يتبادلون نظرات صغيرة، ثم يمضون إلى بائع آخر. بعضهم يخفض صوته حين يمر. وفي لحظة، سمع امرأتين تقفان خلف بائعة بيض، تتهامسان، وإحداهما تشير بذقنها نحوه دون أن تنظر.\u003c/p>\u003cp>مد يده إلى ثقل الميزان، وتركها هناك، يستمع من غير أن يدير رأسه.\u003c/p>\u003cp>لكن الكلمات كانت تصل.\u003c/p>\u003cp>«...نعم، هو. الغريب.»\u003c/p>\u003cp>«لا يشبه فلاحاً.»\u003c/p>\u003cp>«وأيديه...»\u003c/p>\u003cp>«سمعت أنهم من الجبال.»\u003c/p>\u003cp>«أي جبال؟»\u003c/p>\u003cp>«التي فيها الذئب الأعرج.»\u003c/p>\u003cp>لم يعرف لين من يكون الذئب الأعرج. تحركت المرأة الأخرى خطوة إلى الوراء حين سمعت الاسم.\u003c/p>\u003cp>اقترب رجل من الحصيرة. كان في الأربعين، قصيراً، يلبس سترة قماشية جديدة، ووجهه عادي لا يلفت النظر. أمسك حفنة من الدقيق، لكنه لم يفركها. نظر إلى لين وسأل بصوت منخفض ودود:\u003c/p>\u003cp>«من أين الدقيق يا أخي؟»\u003c/p>\u003cp>«من طاحونة جياو.»\u003c/p>\u003cp>«والحمار؟»\u003c/p>\u003cp>«حمار العم تيان.»\u003c/p>\u003cp>«وماذا تطحن في الليل؟»\u003c/p>\u003cp>رفع لين رأسه. «ماذا؟»\u003c/p>\u003cp>«أقول: في الليل. حين تغيب الشمس.» ابتسم الرجل ابتسامة لطيفة جداً. «أسمع أن في الطاحونة ضوءاً في آخر الليل.»\u003c/p>\u003cp>«الطاحونة مغلقة في الليل.»\u003c/p>\u003cp>«حقاً؟» أمال رأسه. «ربما أخطأ من قال لي.» ثم مدّ كفه كأنه سيشتري، فأعاد الدقيق إلى الكيس، وقال: «بارك الله فيك»، ومضى.\u003c/p>\u003cp>مد لين يده إلى حفنة الدقيق التي أعادها الرجل. انتظر حتى ابتعد، ثم ألقاها في وعاء النخالة. لم يسأل الرجل عن الثمن مرة واحدة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء تشيان قبيل الغروب، راكباً بغله الأبيض بين الحصائر، وخادمه يقوده من اللجام، ومعطفه الأسود اللامع يعكس ضوء الشمس الأخير.\u003c/p>\u003cp>توقف أمام لين، ورفع يده بتحية واسعة مسموعة، وصاح بصوت يسمعه من حوله:\u003c/p>\u003cp>«أيها الناس! هذا دقيق طاحونة جياو!» ثم نزل عن بغله بتؤدة. «خمس نحاسات للنصف كيس؟ لا. لا. هذا ثمن بخس. أنا أعرف الأسعار.»\u003c/p>\u003cp>«ثلاث ونصف.» قال لين.\u003c/p>\u003cp>«ثلاث ونصف!» رفع
