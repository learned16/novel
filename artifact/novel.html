 الست نحاسات إلى سجل الطلب، وأبقت العربون في خانته حتى طابقت الرقم مع الإيصال. لم تسمح للين أن يسجل الأجر كله في حساب الطحن.\u003c/p>\u003cp>قالت: «ثماني نحاسات للإصلاح. منها أجرة تشانغ ومصروف الفحم. لا تدخل حصة الطحن هنا.»\u003c/p>\u003cp>قال لين: «كتبتها كما اتفقنا.»\u003c/p>\u003cp>«أريد أن أرى السطر.»\u003c/p>\u003cp>دفع إليها الدفتر. قرأت القيد، ثم أعادته. لم تكن الأرقام كبيرة، لكنها أثبتت أن العمل المعدني يمكن أن يدخل مالاً إلى الورشة من دون أن يأكل حساب الطاحونة أو يخفي كلفته.\u003c/p>\u003cp>دخل رجل آخر كان قد مر على الورشة أمس، وهو يحمل قطعة قماش مربوطة حول شيء طويل. لم يكن صاحب السكة. وضعها على الطاولة وفك العقدة. ظهر المنجل الذي اختبره يانغ، بعلامته الزرقاء.\u003c/p>\u003cp>قال: «أريد هذا. قيل لي إنكم لا تبيعون كل ما تصنعون.»\u003c/p>\u003cp>أجاب تشانغ: «هذا واحد اختبرناه، لا مجموعة كاملة.»\u003c/p>\u003cp>«أحتاج واحداً فقط.»\u003c/p>\u003cp>أخرج لين دفتر التكلفة. لم يرفع السعر لأن الرجل جاء بعد خبر السكة، ولم يخفضه كي يبيع بسرعة. ذكر له ثمن اثنتي عشرة نحاسة، وقال إن حسابهم لها شمل ثلاثاً للحديد، ونحاسة للفحم، وثلاثاً للطرق، واثنتين للمقبض، وثلاثاً من كلفة الوقت والقطعة التي لم تصلح. لم يدّع أن كل منجل سيكلفهم هذا المقدار، بل أوضح أن هذه دفعة أولى خرج فيها حديد مرفوض. ذكر له مقدار الحديد الذي استهلكه المنجل، والفحم، وأجر الطرق، والمقبض الذي صنعه يانغ. وضع الثمن أمامه، وقال إن القطعة قطعت قصباً يابساً في اختبارين، وإنها لم تُختبر في عمل طويل أو على نبات أخضر.\u003c/p>\u003cp>قال الرجل: «هل أستطيع تجربته قبل أن أدفع؟»\u003c/p>\u003cp>«تستطيع أن تمسكه هنا، وتجربه على ساق يابس في الورشة. لا نخرجه من غير اتفاق.»\u003c/p>\u003cp>أخذه تشانغ من قاعدة المقبض، وناوله للرجل من الجهة الخالية من الحافة. جرّب الرجل توازنه، ثم قطع ساقاً واحدة. لم يتحرك المقبض. نظر إلى العلامة الزرقاء، وسأل إن كان يستطيع العودة به إذا ارتخى التثبيت.\u003c/p>\u003cp>قالت شين يان: «إذا ظهر خلل من التثبيت أو الصنعة، تعود به ونفحصه. نكتب ذلك في الإيصال. لا نعدك أن الحديد القديم لا ينكسر أبداً.»\u003c/p>\u003cp>أخرج الرجل النقود، وعد اثنتي عشرة نحاسة كما أخبره لين. لم يشتر أكثر من منجل واحد، ولم يطلب منهم حزمة كاملة. كتب لين الوصف، وسجل شين يان العلامة الزرقاء، ثم ناولاه الإيصال. لف الرجل الأداة بالقماش، وحملها تحت ذراعه.\u003c/p>\u003cp>قال: «إن احتجت غيرها، أعود.»\u003c/p>\u003cp>قال تشانغ: «إذا صنعنا واحدة صالحة.»\u003c/p>\u003cp>لم يخرج الرجل فوراً. سأل لين عن العلامة الزرقاء، وهل تعني أن المنجل جُرب كما جربوا سكة المحراث. قالت شين يان إن العلامة تتبع سجل القطعة، أما الاختبار فيكتبونه لكل أداة على حدة. لا تحمل العلامة وعداً سحرياً، ولا تجعل منجلين متشابهين إذا اختلف حديدهما. أراه لين صفحة السجل من غير أن يسلمه الدفتر، وقرأ له تاريخ الاختبارين وحدودهما.\u003c/p>\u003cp>قال الرجل: «إن عاد التثبيت إلى الحركة، أجيء به.»\u003c/p>\u003cp>«نعم. اتركه كما هو ولا تحاول تثبيته بمسمار أكبر قبل أن نراه.» قال يانغ. «قد توسع الخشب.»\u003c/p>\u003cp>هز الرجل رأسه، ثم حمل الأداة. لم يطلبوا منه أن يعلن للقرية أنها الأفضل، ولم يطلبوا منه أن يعود بزبائن. خرج لأنه اشترى أداة يحتاجها، لا لأنه صار شاهداً على معجزة.\u003c/p>\u003cp>بعد أن أغلق تشانغ باب الدكان، حسبت شين يان النحاس مرة أخرى: اثنتان دُفعتا عربوناً، وست عند التسليم، وثماني في مجموع الإصلاح. ثم كتبت الاثنتي عشرة التي دخلت من بيع المنجل في قيد منفصل. خصمت منها كلفة الدفعة التي لم تنجح، ولم تجعل الإيراد كله ربحاً. بقي رصيد الورشة صغيراً، لكنه لم يعد مجرد فحم وحديد خرجا من الصندوق.\u003c/p>\u003cp>خرج الرجل. لم تصطف وراءه مجموعة مشترين، ولم يرن صندوق النحاس بما يغير حالهم. بقي في السجل ثمن منجل واحد وأجر إصلاح واحد، مع حساب الفحم والوقت الذي احتاجاهما. لم يُسدَّد كل دين، ولم يتوقف تشيان عن شراء الحديد. لكن أداة خرجت إلى يد صاحبها، ومال دخل الورشة لقاء عمل معلوم.\u003c/p>\u003cp>لم يحولوا ذلك إلى طلبية جديدة في الدفتر. كتب لين «بيع منجل واحد» فقط، وحفظ اسم المشتري وعلامة القطعة، ثم أغلق الصفحة. إذا عاد الرجل بعد استعمالها، سيكون عندهم ما يقارنون به كلامه؛ وإن لم يعد، لا يعني ذلك وحده أن المنجل صالح لكل موسم. قال تشانغ إن الحد لا يزداد حدة من المديح. أجابته شين يان أن البيع ليس نهاية الفحص، لكنه على الأقل نقل الأداة من السندان إلى يد تعمل بها.\u003c/p>\u003cp>في الخارج، كان صبيان يركضان خلف عربة صغيرة. لم يلتفتا إلى الورشة، ولم يلتفت إليهما لين. عاد إلى ميزان الفحم، وسجل الكيس الذي اشتراه في الصباح، والجزء الذي بقي. لم يكتب أن عليه شراء المزيد. قال تشانغ إن الحديد المتبقي لا يكفي لدفعة كبيرة، وشين يان أجابت بأنهم لم يعودوا بحاجة إلى تخمين ذلك؛ السجل سيبين مقدار ما يستطيعون صنعه من الموجود.\u003c/p>\u003cp>قبل أن يتجه لين إلى السوق، سار مع شين يان إلى المجلس ومعهما نحاستان. كان الموعد التالي مكتوباً في إيصال اليوم141، وقد حل اليوم150. عدّ وو النقود وختم إيصال الجباية الرابعة، وكتبت شين يان على غلاف التسجيل أن الدفعة التالية بعد تسعة أيام، في اليوم159. لم يخصموا شيئاً من دين هو سانيانغ، ولم يدخل المال في حساب الطحن.\u003c/p>\u003cp>بعد الظهر مر لين عند بائع الفحم ليشتري قليلاً للفرن. كان البائع يرص الأكياس قرب العربة، حين ظهر خادم تشيان ذو الحذاء الجلدي عند طرف السوق. لم يأت إلى دكان تشانغ، ولم ينظر إلى لين. وقف أمام بائع الفحم، وأخرج ورقة مطوية.\u003c/p>\u003cp>قال الخادم: «كم بقي عندك من الفحم؟»\u003c/p>\u003cp>توقف البائع عن ربط الكيس. «ولم تسأل؟»\u003c/p>\u003cp>«السيد تشيان يريد أن يعرف الكمية التي تستطيع تجهيزها.»\u003c/p>\u003cp>لم يقل الخادم كم سيشتري، ولم يذكر سعراً. نظر إلى الأكياس المصفوفة، ثم إلى العربة الفارغة. كان لين قد وضع يده على دفتره، لكنه لم يكتب ما لم يسمعه كاملاً. ومن حيث وقف، رأى البائع يرفع عينيه عن الفحم قبل أن يجيب.\u003c/p>\u003cp>ظل سؤال الكمية بينهما، بينما بقيت أكياس الفحم مغلقة تحت الحبل.\u003c/p>\u003cp>غسل لين يديه، وبقي أثر الفحم عند أطراف أظافره.\u003c/p>"}],"arcs":[[1,40,"المرحلة الأولى: البداية والبقاء"],[41,100,"المرحلة الثانية: الاقتصاد والإنتاج"],[101,180,"المرحلة الثالثة: النفوذ المحلي"],[181,250,"المرحلة الرابعة: صراعات توحيد الإقليم"],[251,300,"المرحلة الخامسة: توحيد الإقليم وتثبيت الحكم"]]}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var C=D.chapters, root=document.documentElement, main=document.getElementById('main');
  root.setAttribute('dir','rtl'); root.setAttribute('lang','ar');
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var t=get('theme'); if(t) root.dataset.theme=t;
  var f=get('fs'); if(f) root.style.setProperty('--fs',f+'px');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function short(t){return t.replace(/^الفصل [^:]+:\s*/,'')}
  function index(){
    var last=parseInt(get('last')||'0',10), lc=C.filter(function(c){return c.n===last})[0];
    var h='<section class="hero"><h1>نظام السيادة الحضارية</h1><p>رواية · '+C.length+' فصلاً منشوراً</p></section>';
    h+= lc ? '<a class="resume" href="#c'+lc.n+'">أكمل القراءة: الفصل '+lc.n+'</a>' : '<a class="resume" href="#c'+C[0].n+'">ابدأ القراءة</a>';
    D.arcs.forEach(function(a){
      var l=C.filter(function(c){return c.n>=a[0]&&c.n<=a[1]}); if(!l.length) return;
      h+='<h2 class="arc">'+a[2]+'</h2><ul class="toc">'+l.map(function(c){return '<li><a href="#c'+c.n+'"><span class="n">'+c.n+'</span><span>'+esc(short(c.t))+'</span></a></li>'}).join('')+'</ul>';
    });
    main.innerHTML=h; document.title='نظام السيادة الحضارية';
  }
  function chapter(i){
    var c=C[i], p=C[i-1], n=C[i+1];
    main.innerHTML='<article class="chapter"><h1>'+esc(c.t)+'</h1>'+c.b+'</article>'+
      '<nav class="nav">'+(n?'<a href="#c'+n.n+'">الفصل التالي ←</a>':'<span>لا يوجد فصل تالٍ بعد</span>')+
      '<a href="#">الفهرس</a>'+(p?'<a href="#c'+p.n+'">→ الفصل السابق</a>':'<span>البداية</span>')+'</nav>';
    set('last',String(c.n)); window.scrollTo(0,0);
  }
  function route(){
    var m=/^#c(\d+)$/.exec(location.hash||''), i=-1;
    if(m){var k=parseInt(m[1],10); for(var j=0;j<C.length;j++) if(C[j].n===k) i=j;}
    if(i>=0) chapter(i); else index();
  }
  document.getElementById('home').onclick=function(){location.hash='';index();window.scrollTo(0,0)};
  function fsz(d){var c=parseFloat(getComputedStyle(root).getPropertyValue('--fs'))||20,v=Math.min(30,Math.max(15,c+d));root.style.setProperty('--fs',v+'px');set('fs',v)}
  document.getElementById('fs-down').onclick=function(){fsz(-1)};
  document.getElementById('fs-up').onclick=function(){fsz(1)};
  document.getElementById('theme').onclick=function(){
    var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark'; set('theme',root.dataset.theme);
  };
  window.addEventListener('hashchange',route); route();
})();
</script>
