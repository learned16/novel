ارة أعلى ليلتحم.»\u003c/p>\u003cp>قالت شين يان: «دعني أنظر.»\u003c/p>\u003cp>نظر إليها تشانغ، ثم أفسح الطريق دون تعليق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرقت ثلاث ساعات.\u003c/p>\u003cp>جلست شين يان على حجر قرب الموقد، وأخرجت الدفتر، ورسمت ما رأته: الأنبوب، ومكان دخول الهواء، وعمق الحفرة، وشكل الفحم. ثم قامت وأخذت قضيباً رفيعاً من الحديد، ومررته داخل فتحة الأنبوب، وقاست المسافة بين رأسه والفحم المتوهج.\u003c/p>\u003cp>«الهواء يدخل من أعلى.»\u003c/p>\u003cp>«هكذا كان دائماً.»\u003c/p>\u003cp>«ويضيع نصفه.» قالت. «ينتشر في الحفرة بدل أن يتركز على الفحم. ما نحتاجه هو أن يدخل من الجانب، مائلاً إلى أسفل، في اتجاه مركز النار، وليس فوقه.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«فوهة من الطين.»\u003c/p>\u003cp>عادت إلى المخزن، وأحضرت من المخزن دلو الطين المخلوط بالنسبة التي تعلماها بالتجربة: خمسون وخمس وثلاثون وثمانية وسبعة. ونظر إليها لين وهي تشكل الفوهة بيديها، أسطوانة صغيرة بثقب ضيق في الوسط، ثم تصنعها ثانية بزاوية مختلفة، وتجففها قرب النار البعيدة.\u003c/p>\u003cp>قالت: «اثنتان. سأجرب الزاويتين.»\u003c/p>\u003cp>استغرق التجفيف ساعة. ثم ركبتها في فم الأنبوب، ودفعت الفحم بقضيب حديدي، وأومأت لصبي المنفاخ.\u003c/p>\u003cp>«اضغط.»\u003c/p>\u003cp>ضغط الصبي النعسان.\u003c/p>\u003cp>لم يرتفع الصوت. لكن لون النار تغير. من البرتقالي الباهت إلى الأصفر، ثم إلى لون أبيض في قلبها لم يكن لين قد رآه في هذه القرية. غطى الجمر لمعان لاذع، وتراجع تشانغ خطوة بعينين متسعتين. وسمع لين من وراء السور صوتاً ينطق بكلمة واحدة، «آه»، ثم صمتاً أكبر. وهمس شياو دو بجانبه: «كأنه شمس صغيرة.»\u003c/p>\u003cp>قالت شين يان، وكأنها تحدث نفسها: «الزاوية الثانية.» ثم التفتت إلى لين. «هل ترى؟ لم أزد الفحم. غيرنا اتجاه الهواء فقط.»\u003c/p>\u003cp>لم يقل لين شيئاً. كان يرى فيها الفتاة التي كانت تأتي لاستعارة الكاوية ولا تعيدها، وقد استعارت الآن نار هذا الرجل كلها.\u003c/p>\u003cp>وضع تشانغ سكة قديمة في النار، وانتظر. وحين أخرجها، كانت بيضاء تقريباً، تتلألأ. ضرب، وانفرجت الشرارات في الغرفة كأنها نجوم صغيرة. ضرب مرة ثانية، ثالثة. طوى القطعة، وعاد.\u003c/p>\u003cp>في المرة الخامسة، انتهى. رفع القطعة المطروقة، كانت قضيباً أسود لامعاً، متجانساً، ليس فيه خط واحد.\u003c/p>\u003cp>حدق فيه.\u003c/p>\u003cp>لم يقل جيد. ولا شكراً. أعاد القضيب إلى الماء، فصدر صفير طويل، وصعدت سحابة من البخار.\u003c/p>\u003cp>ثم قال، دون أن ينظر إلى أحد: «بالأمس كنت أحتاج إلى ساعة لهذه القطعة.»\u003c/p>\u003cp>«وكم احتجت اليوم؟»\u003c/p>\u003cp>«ثلث ساعة.» ثم أضاف بنبرة من يعدد خسائره: «لم يخبرني أحد.»\u003c/p>\u003cp>قالت شين يان: «لم تسألني.»\u003c/p>\u003cp>وهذه المرة رأى لين شيئاً يشبه ابتسامة يمر في وجه تشانغ، سريعاً، كالبرق في سحابة.\u003c/p>\u003cp>حتى منتصف العصر، كان قد خرج من تلك النار طوق واحد كامل، وأربعة عشر مسماراً، وعدة قضبان تشبه الذراع. حسبها لين على لوحة التخطيط الخافتة: قطعة بعد قطعة، يوماً بعد يوم، تقترب من الرقم الذي يلزمهم، وتقترب معه من الموعد الذي لا يغيره أحد. لكن الرقم، لأول مرة، بدا ممكناً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وصل تشيان قبيل الغروب.\u003c/p>\u003cp>جاء على بغل أبيض، متدثراً بمعطفه الأسود المصقول، ويتبعه خادمان يحملان صندوقاً خشبياً. توقف أمام الورشة، ونزل بتؤدة، ومسح الغبار عن كمه، وتفحص النار المتوهجة وراء الباب كأنه يتفحص ثروة.\u003c/p>\u003cp>«تشانغ العزيز.» وانحنى. «وصديقنا الذي يصلح الأشياء. وسيدتنا الحاملة بالعلم.» انحنى لشين يان أيضاً، قليلاً. «ما أجمل أن أرى ورشة تعمل.»\u003c/p>\u003cp>لم يرد أحد.\u003c/p>\u003cp>أضاف وهو يخلع قفازه الجلدي إصبعاً إصبعاً: «وسمعت عن الرقع الطينية. فكرة ممتازة. العملة بلا نحاس.» ضحك بخفة. «لو طبقتموها على نطاق أوسع لصرتم صرافاً صغيراً.»\u003c/p>\u003cp>نظرت شين يان إلى القفاز، ثم إلى الحذاء الجلدي الأسود الذي ينتعله، ولم تقل شيئاً.\u003c/p>\u003cp>دخل تشيان دون دعوة، وأشار للخادمين، ففتحا الصندوق على الطاولة. في داخله ثلاثة قضبان رمادية براقة، نظيفة، مصفوفة على قماش أحمر.\u003c/p>\u003cp>«هذا.» لمس أحدها بإصبع ممتلئ. «حديد من الشمال. نقي كالفضة. لم يخرج من الجبال منذ مئة عام.»\u003c/p>\u003cp>نظر لين، فلم يستدعِ النظام. لكنه رأى بعينيه المجردتين أن القضبان فعلاً أجمل من التي أرسلها.\u003c/p>\u003cp>قال تشيان بحرارة: «هذا هدية.»\u003c/p>\u003cp>«هدية؟»\u003c/p>\u003cp>«نموذج، يا صديقي. لأنني أريد أن أصلح الخطأ الذي وقع. كانت الشحنة الأخيرة بائسة، وأنا آسف.» ابتسم. «ولأنكم تبنون طاحونة، وأنا أريد أن أكون جزءاً من هذا الخير. سأبيعكم كل ما تحتاجونه من حديد بسعر خاص، أقل بالربع من المعتاد.»\u003c/p>\u003cp>سأل لين: «بأي شرط؟»\u003c/p>\u003cp>لم يتحرك وجه التاجر.\u003c/p>\u003cp>«شرط صغير، لا يستحق الذكر.» فتح يديه. «أن تشتروا مني وحدي. كل ما تحتاجه الطاحونة من حديد لثلاث سنوات. وهذا في مصلحتكم، فإن الثقة بين التاجر والعميل...»\u003c/p>\u003cp>«ثلاث سنوات.» قالت شين يان.\u003c/p>\u003cp>«ثلاث، مثل الثلاث التي في بندكم عند ليو.» ابتسم بوضوح هذه المرة، ورأى لين أنه يعرف بالضبط ما في البند. «أحب الأمور المتناظرة.»\u003c/p>\u003cp>خيّم الصمت. تذكر لين الحداد الذي يكنس السوق.\u003c/p>\u003cp>ثم قال، بهدوء، وبأدب كامل: «شكراً يا سيد تشيان. لكننا نفضل أن نبقى أحراراً في الشراء. إن احتجنا إلى حديدك، فسنأتي إليك.»\u003c/p>\u003cp>«ومتى؟»\u003c/p>\u003cp>«حين نحتاج.»\u003c/p>\u003cp>«ولن تحتاجوا؟»\u003c/p>\u003cp>«ربما لا.» أشار إلى الموقد المتوهج. «لدينا حديد قديم.»\u003c/p>\u003cp>نظر التاجر إلى الكومة على الأرض، ثم إلى النار البيضاء، ثم إلى تشانغ الذي لم ينظر إليه. وابتسم أكثر.\u003c/p>\u003cp>كانت ابتسامة أوسع من كل ما رآه لين له. ولكنها ثابتة تماماً، لم تتحرك فيها زاوية فم واحدة.\u003c/p>\u003cp>«أفهم.» أغلق الصندوق بنفسه. «أتمنى لكما حظاً سعيداً.»\u003c/p>\u003cp>وانصرف.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كسر أحدهم سياج الورشة في تلك الليلة.\u003c/p>\u003cp>لم يسمع أحد. كان الجميع قد غادروا بعد الغروب، وتشانغ ينام في غرفة صغيرة ملحقة بالورشة، ومصاب بصمم ثقيل في أذنه اليسرى منذ سنوات. لم يوقظه إلا الكلب، قرابة الفجر، ينبح نبحاً متقطعاً من الخارج.\u003c/p>\u003cp>خرج بمطرقة. وجد السياج الخشبي الواطئ عند الجدار الخلفي مفتوحاً، عوداً من الأعواد الأربعة مكسوراً، والثاني مرمياً في الوحل. وعلى الأرض آثار أقدام.\u003c/p>\u003cp>لم يكن شيء مسروقاً. لم يلمس أحد النار ولا السندان ولا الحديد المصفوف. حتى القضبان المكسورة في الزاوية بقيت كما هي.\u003c/p>\u003cp>استدعى لين عند أول ضوء. وقفوا ثلاثتهم في الفناء الخلفي، تشانغ بوجه مظلم لا يقرأ، وشين يان تضع يداً على بطنها وتنظر إلى الأرض.\u003c/p>\u003cp>جثا لين. كانت الآثار عميقة وواضحة في الطين الرطب. نعل مستدير، مصقول، ليس نعل قش ولا قماش كما يلبس أهل القرية. نعل جلد.\u003c/p>\u003cp>وعلى أحد أعواد السياج المكسورة، عالقة بمسمار، خصلة صغيرة من شعر ناعم أسود لامع.\u003c/p>\u003cp>لم يلمسها. نظر فقط إلى لمعانها في ضوء الفجر الشاحب.\u003c/p>\u003cp>لم تنتظر شين يان أن يقول أحد شيئاً. أخرجت الدفتر، وجثت بحذر بجانب أقرب أثر، ورسمت النعل كما هو: مستدير الطرف، مربع الكعب، وعليه خطان متوازيان. ثم قاست طول الخطوة بين أثرين بعصا، وكتبت الرقم.\u003c/p>\u003cp>قال لين: «ما الذي تفعلينه؟»\u003c/p>\u003cp>«أسجل.»\u003c/p>\u003cp>«نحن لا نعرف من...»\u003c/p>\u003cp>«لا نحكم.» لم ترفع رأسها. «نسجل. الحكم يأتي حين يكون عندنا ما يكفي.» ثم أشارت إلى العمق. «كان يحمل شيئاً ثقيلاً. أو هو ثقيل. ولم يكن يركض.»\u003c/p>\u003cp>قال تشانغ بصوت أجش: «لم يسرق شيئاً.»\u003c/p>\u003cp>«لهذا بالتحديد.» رفعت شين يان رأسها أخيراً، وفي عينيها ما يشبه الخوف المنظم. «رجل يأتي في الليل ولا يسرق، يريد أن نعرف أنه جاء.»\u003c/p>\u003cp>ثم أضافت بصوت أخفض: «من يلبس جلداً في هذه القرية؟»\u003c/p>\u003cp>لم يجب أحد، لأن الجواب كان طويلاً.\u003c/p>"},{"n":13,"t":"الفصل الثالث عشر: الماء البارد","b":"\u003cp>في فجر اليوم الثامن والثلاثين، ظهر الجليد على حافة النهر.\u003c/p>\u003cp>لم يكن جليداً حقيقياً بعد. رقائق بيضاء رقيقة متكسرة تتجمع عند الضفة في الظل، تصدر صريراً خفيفاً كلما حركها الماء، وتذوب حين تلمسها الأصابع. لكن العجوز شو، الجالس على صخرته منذ الفجر، لم يلتفت حين وصل لين. قال فقط، وعيناه على الخيط: «أربعون يوماً أو أقل.»\u003c/p>\u003cp>«كم مضى؟»\u003c/p>\u003cp>«ثمانية وعشرون.» ثم: «من أول يوم قلتها.» ونظر لأول مرة إلى لين، نظرة قصيرة. «الجليد لا ينتظر الدولاب. لكني أقول لك: إنه ينتظر قليلاً.»\u003c/p>\u003cp>كان الدولاب مستلقياً على الضفة منذ الأمس.\u003c/p>\u003cp>ثلاثة أمتار من الخشب المنحني والألواح المركبة، وأربع وعشرون ريشة تبرز من إطاره كأسنان مشط ضخم. بدا للين، في الضوء الرمادي، أجمل ما صنعه في حياته، وأكثره عرضة للكسر. كان يفوح منه عطر البلوط الجديد مع رائحة الزيت التي دهنه بها العجوز يانغ، وحول محوره الخشبي أربعة أطواق حديدية سوداء لامعة، خرجت من نار تشانغ البيضاء.\u003c/p>\u003cp>وقف حوله ثلاثة عشر رجلاً. والرابع عشر، الذي كان يشتكي من بطنه، لم يعد يأتي.\u003c/p>\u003cp>وصل تشانغ متأخراً عن الجميع، يمشي بخطواته الثقيلة، وعلى كتفه كيس من الخيش فيه ما صنعه في الليل: المسامير الأخيرة وقطعتا الإطار الحديديتان. لم يحيّ أحداً. وضع الكيس على الصخرة المسطحة بجانب شين يان، ثم وقف أمام الدولاب مدة طويلة، ويداه خلف ظهره، يحدق في الأطواق السوداء التي صنعها.\u003c/p>\u003cp>قالت شين يان: «ما رأيك؟»\u003c/p>\u003cp>لم يرد. دار حول الدولاب مرة، وأمسك أحد الأطواق، وهزه. ثم قال: «المحور الأيمن أنا من طرقته.» وأضاف بعد صمت: «في الليلة الأخيرة، تحت ضوء ضعيف. إن كان فيه عيب فهو عيبي.»\u003c/p>\u003cp>«لم يقل أحد إن فيه عيباً.»\u003c/p>\u003cp>«سيقول.» نظر إلى الماء. «الماء يقول دائماً.»\u003c/p>\u003cp>قال لين: «ثلاثة ثلاثة.»\u003c/p>\u003cp>لم يفهمه أحد، فكرر: «ثلاثة على كل حبل. وثلاثة على الرافعة. وواحد يراقب المحور.»\u003c/p>\u003cp>قال لاو دونغ: «من يراقب؟»\u003c/p>\u003cp>«أنا.»\u003c/p>\u003cp>«ستكون في الماء إذن.»\u003c/p>\u003cp>«سأكون في الماء.»\u003c/p>\u003cp>كانت هذه الجملة هي التي تفرض نفسها في كل مرة، وكان لين يعرفها. قبل أسبوع كان سيرسل شخصاً آخر. أما الآن فيعرف أن الرجل الوحيد الذي يستطيع أن يعدل المحور بعينيه في الماء الجاري هو الرجل الذي حسب زاويته.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق رفع الدولاب أربع ساعات.\u003c/p>\u003cp>استخدموا مثلثاً من جذوع البلوط، وحبالاً من القنب مبللة، وبكرة خشبية صنعها العجوز يانغ في يومين. كان كل حبل يئنّ، وكل جذع يصر، والرجال يتنفسون ببخار أبيض يتصاعد من أفواههم. في الساعة الثالثة انزلق أحد الحبال.\u003c/p>\u003cp>لم يكن حبلاً مقطوعاً، بل عقدة تفككت من البلل. هبط الجانب الأيسر من الدولاب فجأة شبراً كاملاً، وصرخ الجميع، وتأرجح المثلث الخشبي فوقهم. رأى لين الحبل ينزلق عبر يدي تشيو، الشاب النحيل، الذي حاول أن يقبض عليه فاحترق جلد راحتيه. كاد يتركه.\u003c/p>\u003cp>لم يتركه.\u003c/p>\u003cp>قفز لاو دونغ، الرجل البرميلي، من مكانه، وأمسك بالحبل خلف تشيو، وجذب بكل وزنه. لم يتبادلا كلمة. لكن لين رأى كتفيهما ملتصقتين وهما يشدان معاً، الأطول والأقصر، كل في خطوته، حتى استقر الدولاب واستقام.\u003c/p>\u003cp>قال لاو دونغ بعد أن أعاد العقدة: «لا تكرر هذا.»\u003c/p>\u003cp>«أنت من ربط العقدة!»\u003c/p>\u003cp>«وأنت من أمسكها.» وضرب ظهر تشيو ضربة قصيرة لم يعرف أحد إن كانت عتاباً أم شكراً.\u003c/p>\u003cp>وحين ارتفع الدولاب عن الأرض أخيراً، متأرجحاً، ثقيلاً، رأى لين شياو دو يضع يديه على فمه كأنه يشاهد ولادة.\u003c/p>\u003cp>أنزلوه على الأعمدة الحجرية التي بنوها على جانبي المجرى، في الأخدودين المحفورين المبطنين بأغطية من خشب الزان الصلب.\u003c/p>\u003cp>قال العجوز يانغ: «اتركوه.»\u003c/p>\u003cp>تراجع الرجال خطوة، ثم خطوتين.\u003c/p>\u003cp>لم يتحرك الدولاب. كان فقط ساكناً في الهواء فوق الماء، ريشاته الدنيا تلامس سطح الجدول، وقطرات تنزلق من حوافها.\u003c/p>\u003cp>قالت شين يان، من مكانها على الصخرة: «افتحوا الحاجز.»\u003c/p>\u003cp>سحب رجلان لوحاً خشبياً من فتحة الحاجز الحجري. اندفع الماء.\u003c/p>\u003cp>ببطء في البداية، ثم أسرع، تمدد الماء في المجرى الضيق الذي نظفوه، وضرب الريشة الأولى. ارتجف الدولاب. ثم تحرك، نصف دورة، ثم دورة كاملة.\u003c/p>\u003cp>صاح شياو دو. وصاح لاو دونغ. وضحك أحدهم بصوت عالٍ، وأخذ الرجال يصفقون.\u003c/p>\u003cp>ثم سمع لين الصوت.\u003c/p>\u003cp>لم يكن عالياً. كان خفيفاً، مزعجاً، على إيقاع الدوران: طق. طق. طق. صوت خشب يصطدم بشيء مع كل دورة.\u003c/p>\u003cp>توقف الجميع عن الضحك.\u003c/p>\u003cp>اهتز الدولاب. اهتزازة صغيرة في البداية، ثم أكبر، وبدأ الماء يتطاير بشكل غير متساوٍ. أمسك لين بالحبل الذي يربط أحد جوانب الإطار، فشعر بالرعشة تنتقل من الخشب إلى عظامه.\u003c/p>\u003cp>صاح: «أوقفوه!»\u003c/p>\u003cp>أغلق الرجال الحاجز. تباطأ الدولاب، وتمايل، ثم وقف.\u003c/p>\u003cp>كان الصمت أسوأ من الصوت.\u003c/p>\u003cp>اقترب العجوز يانغ ببطء، ومرر كفه على إطار الدولاب، ثم على ريشة، ثم على أخرى، يضرب كل واحدة بظهر إصبعه ويصغي كما يصغي طبيب إلى صدر.\u003c/p>\u003cp>«الخشب سليم.»\u003c/p>\u003cp>لم يعلق أحد.\u003c/p>\u003cp>«لا يوجد شق ولا وصلة مخلوعة. الخشب الذي صنعناه يحمل.» رفع عينيه الصغيرتين نحو المحور، وإلى الرجل الواقف عنده، تشانغ. «ما يهتز ليس الخشب.»\u003c/p>\u003cp>وقف تشانغ ساكناً. لم يقل لا ولم يقل نعم. لكن لين رأى فكه يتحرك مرة واحدة، كمن يطحن شيئاً بين أسنانه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ركز لين على المحور.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: محور دولاب مائي مركب\u003c/div>\u003cdiv>الاعوجاج: المحور المعدني الأيمن منحرف عن محور الخشب بنحو 4 ملم. المحمل الأيمن أعلى من الأيسر بنحو 3 سم.\u003c/div>\u003cdiv>الاهتزاز يتوقع أن يزداد تحت الحمل\u003c/div>\u003cdiv>الثقة: 69%\u003c/div>\u003cdiv>ملاحظة: القياسات في الماء الجاري غير دقيقة. التحليل لا يحدد أي العيبين أكبر أثراً.\u003c/div>\u003cdiv>طاقة التكامل: 82%\u003c/div>\u003c/div>\u003cp>قرأه بصوت مسموع.\u003c/p>\u003cp>«إذن عيبان.» قالت شين يان. «ولا يعرف أيهما الأسوأ.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«وإن عدّلنا الخطأ، فربما نزيد الآخر.»\u003c/p>\u003cp>«ربما.»\u003c/p>\u003cp>«سأقيس بنفسي.»\u003c/p>\u003cp>نظر إليها لين. كان قد توقع هذه الجملة منذ الصباح، ومنذ الأيام العشرة.\u003c/p>\u003cp>«أنا من سيقيس.»\u003c/p>\u003cp>«لا يمكنك أن تقيس وتعدّل في الوقت نفسه. أنت في الماء. من يراقب من الضفة هو من يرى المحور من الجانب.»\u003c/p>\u003cp>«وأنا أقول لك أن تراقبي من الضفة.»\u003c/p>\u003cp>«من الضفة، لا أرى المحمل. المحمل تحت الماء.» أخرجت من جيبها خيطاً معقوداً في طرفه حجر صغير، وهزته. «أحتاج أن أنزل حتى الصخرة الثانية. هناك أرى الخط.»\u003c/p>\u003cp>«الصخرة الثانية في الماء.»\u003c/p>\u003cp>«حتى كاحلي فقط.»\u003c/p>\u003cp>«الماء يتجمد.»\u003c/p>\u003cp>«حتى كاحلي يا لين.»\u003c/p>\u003cp>تقدم خطوة. كان قد قرر أن لا يرفع صوته، لكنه سمع نفسه يقولها:\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>وكان الصمت حولهما. ثلاثة عشر رجلاً يتظاهرون أنهم يفحصون الحبال.\u003c/p>\u003cp>قالت شين يان بصوت منخفض جداً، بلغتهما: «لا تقل لي لا أمام هؤلاء.»\u003c/p>\u003cp>«وماذا أقول؟»\u003c/p>\u003cp>«تقول لي ما تخشاه.»\u003c/p>\u003cp>«أخشى أن تسقطي.»\u003c/p>\u003cp>«أخشى أنا أن أبقى جالسة على صخرة بينما زوجي يتجمد.»\u003c/p>\u003cp>ارتجف شيء في صدره.\u003c/p>\u003cp>«هذا ليس نفس الشيء.»\u003c/p>\u003cp>«بل هو.» لم تتحرك. كانت واقفة هناك، يدها على بطنها، وجهها شاحب من البرد، وعيناها حادتان. «أنت لا تثق بأنني أعرف حدودي. وأنا لا أثق بأنك تعرف حدودك. وكلانا يكذب.»\u003c/p>\u003cp>سكت.\u003c/p>\u003cp>قالت: «إذن حل وسط. أبقى على الضفة. لكن تسمعني.»\u003c/p>\u003cp>«أسمعك؟»\u003c/p>\u003cp>«أعطيك الأرقام وأنت في الماء. كل قياس أقوله، تفعله. حتى أرى أنك لا تفعل شيئاً بعينيك دون عيني.»\u003c/p>\u003cp>نظر إليها طويلاً.\u003c/p>\u003cp>«موافق.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>نزل لين إلى الماء.\u003c/p>\u003cp>كان أبرد مما تخيل. حين لامست قدماه السطح، انقبضت عضلاته كلها، وحبس نفساً دون أن يقرر. كان الماء يصل إلى فخذيه بعد خطوتين، وإلى خصره بعد خمس، وبعد ذلك لم يعد يحس بجلده.\u003c/p>\u003cp>كانت التيارات تدفعه عند ركبتيه. تذكر، لا يدري لماذا، المسابح الجامعية والمكيف في المختبر وكوب الشاي البارد على الطاولة، وظن لحظة أنه لن يشعر بدفء مرة أخرى. ثم تذكر أن في بطن امرأة على الضفة شيئاً يتعلم أن يتحرك، وكان هذا كافياً ليضع يده على المحور، وينحني. قال بأسنان تصطك: «حاضر.»\u003c/p>\u003cp>صاحت شين يان من الضفة، صوتها يصل واضحاً فوق صوت الماء:\u003c/p>\u003cp>«أخفض المحمل الأيمن. إصبعان!»\u003c/p>\u003cp>فعل. سحب الوتد الخشبي الذي يثبت المحمل، وأنزله بحذر على الحجر، ثم أعاد الوتد. ارتجفت يداه من الصقيع، فأخطأ في الضغط على الوتد، وكاد ينزلق من يده.\u003c/p>\u003cp>«الآن حرك الدولاب!»\u003c/p>\u003cp>دفعه لاو دونغ من الطرف الآخر. دار الدولاب نصف دورة.\u003c/p>\u003cp>طق.\u003c/p>\u003cp>«لا زال.»\u003c/p>\u003cp>«أخفض إصبعاً آخر!»\u003c/p>\u003cp>فعل. شعر بقدميه تتخدران. كانت أصابعه تصير شيئاً آخر، شيئاً خشبياً بعيداً عنه.\u003c/p>\u003cp>«الآن!»\u003c/p>\u003cp>دار.\u003c/p>\u003cp>طق. طق.\u003c/p>\u003cp>«أسوأ.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أسوأ يا يان. صار الصوت أسوأ.»\u003c/p>\u003cp>سكتت. ثم سمع صوتها، منخفضاً هذه المرة، وفيه ارتباك:\u003c/p>\u003cp>«أخطأت. أخفضت أكثر مما يجب. ارفعه إصبعاً.»\u003c/p>\u003cp>كان عليها أن تقول ذلك، وعرف لين كم كلفها. رفع المحمل. جعله إصبعاً أعلى مما كان في البداية.\u003c/p>\u003cp>«الآن.»\u003c/p>\u003cp>دار الدولاب. دار مرة، مرتين، ثلاثاً.\u003c/p>\u003cp>صوت الخشب ما زال هناك، لكنه أخف. تغير الإيقاع.\u003c/p>\u003cp>«الأيسر.» صاحت. «ارفع الأيسر إصبعاً.»\u003c/p>\u003cp>اتجه إلى الجهة الأخرى، والماء يتحرك حول جسمه كحيوان. أسنانه تصطك بشدة، وركبتاه ترتجفان، ولم يعد يشعر بما تحت خصره. وضع كفيه على الوتد الأيسر، ورفع.\u003c/p>\u003cp>«الآن!»\u003c/p>\u003cp>دار الدولاب.\u003c/p>\u003cp>لم يصدر صوتاً.\u003c/p>\u003cp>لا طق. لا اهتزاز. فقط همس الماء على الريشات، وصرير الخشب الناعم. دار الدولاب دورة كاملة، وثانية، وثالثة، وكان انسيابه كانسياب نفس.\u003c/p>\u003cp>قال لين، بصوت لم يعرفه: «يان.»\u003c/p>\u003cp>«أنا أرى.»\u003c/p>\u003cp>«لا صوت.»\u003c/p>\u003cp>«أرى. أرى.» كان في صوتها اهتزاز لا علاقة له بالبرد.\u003c/p>\u003cp>وصاح شياو دو، وصاح الرجال، وبدأ شخص ما يضرب الأرض بقدمه.\u003c/p>\u003cp>لكن لين رأى شيئاً آخر. رأى، حين تحرك الدولاب، أن المحور المعدني الأيمن يهتز اهتزازة صغيرة جداً، ليست صوتاً ولا حركة، بل رعشة في الضوء. كأنه ما زال منحنياً بضعة ملّيمترات، وأن ما فعلوه لم يحل المشكلة كلها.\u003c/p>\u003cp>اقترب بحذر. وضع إصبعه على الحديد.\u003c/p>\u003cp>كان بارداً حد الألم.\u003c/p>\u003cp>وتحته، في المعدن، شعر بالنبض.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرج من الماء بمساعدة رجلين.\u003c/p>\u003cp>لم يشعر بساقيه. سقط على الضفة، فغطاه أحدهم بمعطف قديم، ورفع آخر وعاء ماء ساخناً أحضره شياو دو من النزل مسرعاً. ارتجف لين بعنف، أسنانه تصطك كحجارة في كيس، وأنفاسه تخرج بيضاء متقطعة.\u003c/p>\u003cp>وجدته شين يان.\u003c/p>\u003cp>جثت إلى جواره، بحذر، ويدها على بطنها، ثم نزعت قفازها الصوفي الذي أعارته إياها هو سانيانغ، وأمسكت أصابعه بكفيها الدافئتين. كانت تشد عليها بقوة غريبة.\u003c/p>\u003cp>قالت: «أخطأت في الخفض الأول.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«كلفك ذلك خمس دقائق في الماء.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لا تقل أعرف.» كان صوتها يرتجف. «قل ما تفكر فيه.»\u003c/p>\u003cp>حدق فيها. كانت عيناها حمراوين، وليس من البرد.\u003c/p>\u003cp>قال، بصعوبة: «رأيتك تصححين الخطأ وأنا في الماء. وفكرت أنني لم أرَ أحداً يصحح خطأه بهذه السرعة. حتى أنا.»\u003c/p>\u003cp>أغمضت عينيها لحظة.\u003c/p>\u003cp>ثم سألت بنبرة مختلفة: «والمحور الأيمن؟»\u003c/p>\u003cp>لم يكذب عليها. «ما زال فيه شيء. ربما الاعوجاج. ربما لا. لا أعرف.»\u003c/p>\u003cp>«لكن الدولاب يدور.»\u003c/p>\u003cp>«الدولاب يدور. لكن المحور الأيمن فيه رعشة صغيرة. إن تركناه، سيتعب بعد أسبوع، ربما شهر. ويمكن أن يعدله مبرد تشانغ الليلة.»\u003c/p>\u003cp>«وماذا يقول النظام؟»\u003c/p>\u003cp>نظر إلى السطر في زاوية عينه. كان قد تغير بصمت أثناء وجوده في الماء:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — قيد التنفيذ]\u003c/strong>\u003c/div>\u003cdiv>أول أصل منتج: شغّل الطاحونة قبل تجمد النهر\u003c/div>\u003cdiv>المتبقي: تركيب الحجر وربطه بالمحور، وتثبيت المحمل الأيمن. تقدير: يوم واحد\u003c/div>\u003cdiv>الاحتمال: متوسط، ويتحسن إذا عُدّل المحور الأيمن\u003c/div>\u003c/div>\u003cp>لم يقرأه عليها. لكنها فهمت من وجهه.\u003c/p>\u003cp>قالت: «إذن غداً.»\u003c/p>\u003cp>«غداً.»\u003c/p>\u003cp>ظلت ماسكة بيديه. ثم قالت بصوت لا يسمعه غيره، بلغتهما: «في المرة القادمة التي أقول لك فيها حلاً وأكون مخطئة، لا تتبعني بعمى.»\u003c/p>\u003cp>«اتبعتك لأن الاحتمال كان نصفاً.»\u003c/p>\u003cp>«نصف، وكلفك ذلك البرد.» ضغطت أصابعه. «سأتذكر هذا الثمن.»\u003c/p>\u003cp>جاءت هو سانيانغ في تلك اللحظة تجري بخطوات قصيرة، وعلى ذراعها وعاء ملفوف بخرقة، ترك أثراً من بخار في الهواء. لم تقل شيئاً. جلست بجانبه، وأمسكت الوعاء بين كفيه، وقالت وهي تنظر إلى الدولاب لا إليه: «اشرب. فإن مات الدولاب، لا بأس. أما إن مت أنت فأنا التي ستدفع للحداد.»\u003c/p>\u003cp>شرب. كان مرقاً ساخناً بالزنجبيل والبصل، وطعمه أفضل شيء ذاقه منذ جاء.\u003c/p>\u003cp>كان الدولاب يدور خلفهم، ببطء، يلمع الماء على ريشاته بلون الرصاص، وكان الجليد يتكاثر على الحافة.\u003c/p>"},{"n":14,"t":"الفصل الرابع عشر: الحجر الأول يدور","b":"\u003cp>برد الفجر في اليوم التاسع والثلاثين كان ماسّاً، حاداً، يخرج البخار من الأفواه ويجمد الأهداب.\u003c/p>\u003cp>لم ينم لين تلك الليلة أكثر من ساعتين.\u003c/p>\u003cp>استيقظ مرتين على صوت لا وجود له، صوت دولاب يتعثر في حلمه، وفي كل مرة وجد شين يان نائمة بجانبه، ويدها على بطنها، وأنفاسها هادئة. وفي المرة الثالثة وجدها مستيقظة، تنظر إلى السقف المنخفض بعينين مفتوحتين.\u003c/p>\u003cp>«لم تنامي؟»\u003c/p>\u003cp>«نمت.» لم تتحرك. «ثم استيقظت لأنني فكرت في الأرامل.»\u003c/p>\u003cp>«ماذا فكرت؟»\u003c/p>\u003cp>«أن الكيس الأول ثمنه لا شيء. وأن لا شيء هو أغلى ما سنبيع هذا الشتاء.»\u003c/p>\u003cp>لم يفهم تماماً، لكنه فهم ما يكفي. أمسك يدها، وبقيا هكذا حتى سمعا الديك الأول.\u003c/p>\u003cp>كان تشانغ قد أمضى الليل كله في ورشته على ضوء مصباح زيت، يبرد بمبرد غليظ طرف المحور الأيمن، ملّيمتراً بعد آخر، يتوقف كل بضع دقائق ويضع عليه عوداً مستقيماً، ثم يعود. جاء قرب الفجر يحمل المحور تحت إبطه ملفوفاً بقطعة من الخيش، وعيناه حمراوان، ويداه ترتجفان من التعب. لم يقل شيئاً. وضعه في يد لين، وأشار نحو الماء بذقنه.\u003c/p>\u003cp>وكان هذا هو الاعتذار الوحيد الذي سمعه لين منه، ولم يكن يحتاج إلى غيره.\u003c/p>\u003cp>ركّبوا المحور قبل الضوء. ثم ربطوا الحجر.\u003c/p>\u003cp>كان الحجر العلوي معلقاً بسلسلة فوق الحجر السفلي، وقد أُنزل بحذر شديد على ارتفاع قبضة واحدة، والعجوز يانغ يصيح بأوامر قصيرة، ويدا لاو دونغ وتشيو تمسكان الرافعة المصنوعة من جذع بلوط. حين لامس الحجران بعضهما، أصدرا طقة مكتومة، كالصمت الذي يسبق الكلام.\u003c/p>\u003cp>قالت شين يان: «ارفعوه شعرة.»\u003c/p>\u003cp>«شعرة؟»\u003c/p>\u003cp>«أقل مما تتخيل.» جثت على ركبة واحدة بجانب الحجرين، وأخرجت ورقة صفراء رقيقة من جيبها، قطعتها من صفحة قديمة في كتاب الحسابات. «ارفعوا حتى تدخل الورقة بينهما، وتخرج إذا سحبتها بإصبعين.»\u003c/p>\u003cp>ضحك شياو دو، فرمقته شين يان بنظرة.\u003c/p>\u003cp>دخلت الورقة. سحبتها بإصبعين. خرجت، وفيها أثر دقيق من الغبار الرمادي.\u003c/p>\u003cp>«هكذا.»\u003c/p>\u003cp>ثبّتوا الرافعة.\u003c/p>\u003cp>كان تشانغ قد حفر في وجه الحجرين، في الأيام الماضية، أخاديد شعاعية رفيعة بإزميل صلّبه بنفسه، تخرج من المركز كأشعة شمس مرسومة بيد طفل. لم يطلب منه أحد ذلك، ولم يخبر لين بالأمر. وحين رأى لين الأخاديد أول مرة سأله: «من علّمك؟» فقال: «جياو. أتيت إلى هنا وأنا صبي أحمل له الإزميل.»\u003c/p>\u003cp>ولم يزد.\u003c/p>\u003cp>كان في الأخاديد، حين يدور الحجر، سر الطحن كله: تدفع الحبوب إلى الخارج وتسحب الدقيق، فلا يحترق ولا ينسد. وأدرك لين، وهو ينظر إليها، أن الرجل الذي بنى هذه الطاحونة قبل خمس سنوات ترك علمه مخبأً في جسد صبي، انتظر خمس سنوات حتى يحتاجه أحد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند أول ضوء، كان القرويون قد تجمعوا.\u003c/p>\u003cp>لم يدعُهم أحد. كان أهل القرية يمرون على الطريق المحاذي للنهر منذ أسبوعين، ثم يتوقفون، ثم يتقدمون، ثم يتراجعون. لكنهم هذا الصباح جاؤوا جميعاً كأن الحجارة نفسها أيقظتهم: رجال بمعاطف مبطنة ونساء يحملن أطفالاً ملفوفين في شالات، وزوجة الجزار، والفلاح العجوز الذي أصلح لين عربته، وامرأة القدر المثقوب بين صفين من النساء، وفي يدها الرقعة الطينية.\u003c/p>\u003cp>وقف شياو دو على حجر مرتفع. كان وجهه محمراً من الحماس، وأذناه البارزتان بلون الشفق.\u003c/p>\u003cp>«أيها الناس!» صاح. «هذا الدولاب! ذاك الحجر! وهذا الماء!» أشار إلى كل شيء بذراع مفتوحة. «الماء يدفع الدولاب، والدولاب يدير المحور، والمحور يدير الحجر، والحجر يطحن الدخن!»\u003c/p>\u003cp>قال أحدهم: «نعرف كيف تعمل الطاحونة يا ولد.»\u003c/p>\u003cp>«أنت تعرف طاحونة ليو. هذه ليست كطاحونة ليو.» وضع يديه على خصره بجدية مضحكة. «هذه بنت جياو. والذي أعاد بناءها نازحان لا يعرفان كيف يتكلمان!»\u003c/p>\u003cp>ضحك الناس. ثم انحنى الصبي بمبالغة وبدأ يقلد، بنبرة غليظة ممدودة، لهجة لين بالضبط: «\"مسافران... ضللنا الطريق!\"»\u003c/p>\u003cp>وانفجر الناس ضحكاً، ورأى لين أنه يضحك هو أيضاً. لم يكن الصبي يسخر هذه المرة. كان يقلد بفخر، مثل من يحمل راية.\u003c/p>\u003cp>نظر إليه شياو دو بعد أن هدأ الضحك، وقال بصوت أخف: «لكنه أصلح مدخنة العمة.»\u003c/p>\u003cp>سكت الناس.\u003c/p>\u003cp>«وأصلح عجلة عربتي.» قال الفلاح العجوز من الخلف.\u003c/p>\u003cp>وقالت امرأة: «وقدري المثقوب.» لم تقل أكثر.\u003c/p>\u003cp>لم يعرف لين ماذا يفعل بوجهه. نظر إلى الماء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>فتح العجوز يانغ الحاجز.\u003c/p>\u003cp>لم يقل أحد شيئاً. ارتفع الماء ببطء في المجرى، بلون رمادي مسود، وضرب الريشة الأولى. وارتجف الدولاب، ثم تحرك.\u003c/p>\u003cp>دار نصف دورة. دورة. ثانية.\u003c/p>\u003cp>كان صوته ناعماً، لا طق ولا اهتزاز، همس الخشب في الماء، وصرير خفيف من المحور لا يقلق. وفي الداخل، في الغرفة الحجرية الصغيرة التي بناها لاو دونغ وتشيو وثلاثة آخرون في الأسبوع الأخير، دار الحجر العلوي ببطء فوق الحجر السفلي.\u003c/p>\u003cp>ثم سمع الناس الصوت الذي لم يسمعوه منذ خمس سنوات في هذا المكان: خشخشة منتظمة عميقة، كأن أحداً يهمس سراً في أذن الأرض.\u003c/p>\u003cp>نادت شين يان بصوت جاد: «الحبوب.»\u003c/p>\u003cp>كان شياو دو قد أعد الكيس. فتحه بيدين مرتجفتين وسكب أول حفنة من الدخن في الفتحة الخشبية فوق الحجر العلوي. اختفت بين الحجرين. ثم، من الجانب، من القناة الخشبية الصغيرة التي صنعها العجوز يانغ، انساب شيء ناعم ضارب إلى الأصفر، كالرمل الرطب.\u003c/p>\u003cp>دقيق.\u003c/p>\u003cp>مدت شين يان يدها تحت القناة وأمسكت حفنة، وقربتها من وجهها. فركتها بين إصبعيها. «خشن.»\u003c/p>\u003cp>«أخفضي الحجر قليلاً.»\u003c/p>\u003cp>أمرت العجوز يانغ، فحرك الرافعة بالقدر الذي قالته. ثم حفنة ثانية.\u003c/p>\u003cp>«ناعم.»\u003c/p>\u003cp>أومأت. ثم نظرت حولها إلى القرويين الصامتين، وإلى النساء اللواتي كن يطحنّ الدخن بأيديهن في الظلام منذ طفولتهن، وإلى لين.\u003c/p>\u003cp>قالت بصوت واضح: «أول كيس مجاناً.»\u003c/p>\u003cp>لم يفهم أحد.\u003c/p>\u003cp>«لثلاث نساء.» كانت قد حسبت الأمر ليلاً، وعرف لين ذلك من هدوئها. «الأرامل. اللواتي لا رجل لهن في القرية يطحن ويحمل. أول دقيق من هذه الطاحونة لهن.»\u003c/p>\u003cp>تقدمت امرأة عجوز نحيلة، ثم أخرى، ثم الثالثة، من بين الجمع. إحداهن هي صاحبة القدر المثقوب. حملت كل واحدة كيسها، ووضعته عند الفتحة، وصبّ شياو دو الدخن، ودار الحجر، وخرج الدقيق، وملأ الأكياس الثلاثة واحداً بعد آخر.\u003c/p>\u003cp>لم يقل أحد شيئاً. لكن لين رأى أصابع العجوز الأولى ترتجف وهي تغلق الكيس. رآها تضعه على صدرها، كما وضعت الرقعة، ثم تنظر إلى شين يان.\u003c/p>\u003cp>قالت بصوت مبحوح: «الرحى اليدوية كانت تأخذ مني الصباح كله.»\u003c/p>\u003cp>«الآن تأخذ منك نصف ساعة.»\u003c/p>\u003cp>«وماذا أفعل ببقية الصباح؟»\u003c/p>\u003cp>ابتسمت شين يان. «تنامين.»\u003c/p>\u003cp>ضحكت المرأة، ضحكة قصيرة مكسورة، ثم مسحت عينيها بكمها بسرعة.\u003c/p>\u003cp>وصلت هو سانيانغ في تلك اللحظة، من خلف الجمع، ودقيقة بعد دقيقة كانت قد شقت طريقها إلى الحجر دون أن يمنعها أحد. نظرت إلى الدولاب، ثم إلى الدقيق، ثم إلى كيس العجوز الذي ضمته إلى صدرها.\u003c/p>\u003cp>«مجاناً؟»\u003c/p>\u003cp>«أول كيس فقط.» قالت شين يان.\u003c/p>\u003cp>«أول كيس.» كررتها هو سانيانغ كمن يزن كلمة في يده. ثم فتحت كتابها الأصفر، وأخذت قطعة الفحم، وكتبت سطراً. «وأنا لا أكتب إلا الذي يدفع.»\u003c/p>\u003cp>«وما كتبتِ؟»\u003c/p>\u003cp>«كتبت أن كيساً مجانياً أول يوم يشتري سمعة سنة كاملة.» أغلقت الكتاب. «هذا ما كان يقوله زوجي. لم أصدقه قط. والآن...» نظرت إلى الطحين. «ربما أصدقه.»\u003c/p>\u003cp>ولاحظ لين أن عينيها لم تكونا على الدقيق، بل على القرويين الذين يتبادلون النظرات، ويهمسون باسم الطاحونة، «طاحونة جياو»، كأنه اسم عاد من الموت.\u003c/p>\u003cp>وبعد الأرامل، تقدمت زوجة الجزار بكيس دخن ثقيل على كتفها، وضعته عند الفتحة دون كلمة. طحن شياو دو. وحين امتلأ كيسها بالدقيق، أخرجت شين يان ميزانها الخشبي، وعزلت جزءاً من عشرين، وصبته في وعاء جانبي.\u003c/p>\u003cp>سألت الزوجة: «أهذا أجركم؟»\u003c/p>\u003cp>«هذا أجر الطاحونة.»\u003c/p>\u003cp>«عند ليو يأخذون عشرة.»\u003c/p>\u003cp>«وهنا عشرون.» قالت شين يان. «وبالميزان أمامك.»\u003c/p>\u003cp>نظرت المرأة إلى الميزان الذي يتأرجح أمامها، العصا الطويلة والكفتان والحصى. لم تفهم الحصى، لكنها فهمت أن العين ترى ما تأخذه. أومأت، وحملت كيسها، ومضت وهي تحدث جارتها بصوت لم يعد همساً.\u003c/p>\u003cp>كان هذا أول أجر.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>انتظر لين.\u003c/p>\u003cp>كان يعرف ما سيحدث، فقد قرأ العبارة قبل شهر. لكن حين ظهرت الحروف الزرقاء في زاوية عينه، شعر بشيء يتقلب في صدره.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — مكتمل]\u003c/strong>\u003c/div>\u003cdiv>أول أصل منتج: شغّل الطاحونة قبل تجمد النهر ✓\u003c/div>\u003cdiv>المكافأة: التخطيط الصناعي — المستوى 1 (مفتوح)\u003c/div>\u003cdiv>مؤشر الحضارة: +3 (أصل منتج، وعمل جماعي، وتحسين معيشة)\u003c/div>\u003cdiv>\u003cstrong>التكامل: 4%\u003c/strong>\u003c/div>\u003c/div>\u003cp>وبعد لحظة:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخطيط الصناعي — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>يمكنك الآن تخطيط سلسلة إنتاج من ثلاث مراحل، مع تقدير للمدخلات والمخرجات والوقت.\u003c/div>\u003cdiv>لا يشمل تحليل الاختناقات. لا يحل محل القياس الميداني.\u003c/div>\u003c/div>\u003cp>قرأ السطر الأخير مرتين. ابتسم.\u003c/p>\u003cp>جرب الأداة الجديدة فوراً، لأنه لم يستطع مقاومة ذلك. فتح اللوحة البيضاء، وكتب فيها كلمة «طحن»، ثم أضاف الخطوات: حبوب إلى الطاحونة، ومن الطاحونة إلى دقيق، ومن الدقيق إلى النزل. وأدخل الأرقام التي رآها.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تخطيط صناعي — أولي]\u003c/strong>\u003c/div>\u003cdiv>الإنتاجية التقديرية للحجر الواحد: حوالي 10 أكياس في اليوم\u003c/div>\u003cdiv>أجر الطحن (جزء من عشرين): حوالي نصف كيس في اليوم\u003c/div>\u003cdiv>الثقة: 61%\u003c/div>\u003cdiv>ملاحظة: بيانات ناقصة عن حجم الطلب في الشتاء.\u003c/div>\u003c/div>\u003cp>نصف كيس في اليوم. كان يعرف أنه ليس كثيراً. لكنه كان رقماً لم يكن قبل أسبوع، ورقماً يتكرر كل يوم.\u003c/p>\u003cp>قالت شين يان، دون أن تلتفت: «ما الذي تقوله؟»\u003c/p>\u003cp>«مكتمل.»\u003c/p>\u003cp>«كلها؟»\u003c/p>\u003cp>«كلها. الأصل المنتج. والتكامل صار أربعة.»\u003c/p>\u003cp>«وماذا أيضاً؟»\u003c/p>\u003cp>«تخطيط صناعي.» رفع كتفيه. «مرحلة واحدة. ثلاث خطوات.»\u003c/p>\u003cp>«ثلاث.» هزت رأسها ببطء. «كان يمكن أن تكون أكثر.»\u003c/p>\u003cp>«الأرقام ليست طموحاً.»\u003c/p>\u003cp>«لا.» التفتت أخيراً، ورأى في عينيها الشيء الذي لم يره منذ المختبر: ضوء ذلك الفرح الصغير الذي يأتي من النجاح الذي يعرف أنه صدفة سعيدة، وأنه قد يتكرر إن عمل لأجله. «لكنها بداية.»\u003c/p>\u003cp>مدّ يده فأمسكت بها، وكان كفها دافئاً هذه المرة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان تشانغ واقفاً عند طرف الغرفة الحجرية، منفرداً، ذراعاه مطويتان.\u003c/p>\u003cp>لم يقل شيئاً طوال الصباح. بقي هناك، يتأمل المحور الذي يدور، والأطواق الحديدية الأربعة تدور حوله في الماء، سوداء لامعة، تقطر الماء، وتلتف ببطء حول الخشب الذي ثبتته. كانت عيناه تتبعان كل دورة، وكان فكه ينبض.\u003c/p>\u003cp>اقترب لين منه بحذر.\u003c/p>\u003cp>«المحور.»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>«صمد.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>استدار تشانغ نحوه ببطء. في عينيه، رأى لين شيئاً كان قد رآه في الليل مرة واحدة فقط: رجل اعتاد أن يصنع ما يكسره غيره، ويرى الآن قطعه تعمل.\u003c/p>\u003cp>قال تشانغ، وكأن الكلمة تخرج من حديد قديم:\u003c/p>\u003cp>«جيد.»\u003c/p>\u003cp>لم يقل غيرها.\u003c/p>\u003cp>وأدار وجهه نحو الماء، وبقي هناك. ثم قال بعد صمت طويل، دون أن يلتفت، كأنه يتحدث إلى النهر:\u003c/p>\u003cp>«حسبت في الليل. السكك المكسورة التي مرت على يدي هذه السنة وحدها. أكثر من ثمانين.» ضرب بإصبعه على المحور مرة واحدة. «ثمانون سكة في قرية واحدة. هل تعرف كم يعني هذا؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«قلت لك أن حديدي سيئ. لم أقل لك كم.»\u003c/p>\u003cp>وبقي لين صامتاً أمامه. ثم أومأ. كان السؤال الذي طرحه عند الورشة قد جاءه جوابه، وجاءه معه الشيء الذي لم يكن يريده: أن هذا الجواب كبير، وأنه ليس لهذه الطاحونة وحدها.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وبعد الظهر، حين تفرق الناس بأكياسهم الصغيرة، وبقي في الطاحونة لين وشين يان والعجوز يانغ ولاو دونغ وتشيو، وقف على الطريق أعلى الضفة فارس على حصان أسود.\u003c/p>\u003cp>كان الوكيل.\u003c/p>\u003cp>نظر إلى الدولاب الذي يدور، وإلى الدقيق الأصفر الذي يتراكم عند فم القناة، وإلى رجال القرية الذين يحملون الأكياس. وأعطى لجام حصانه حركة قصيرة.\u003c/p>\u003cp>كان خادمه يقف خلفه على بغل. التفت الوكيل إليه، وقال بصوت هادئ لم يسمعه لين ولا شين يان، لكن الريح حملته إلى العجوز يانغ، الذي كان قريباً من الطريق:\u003c/p>\u003cp>«دعهم يعملون. الشتاء طويل.»\u003c/p>\u003cp>ثم مضى.\u003c/p>\u003cp>وعلى الجهة الأخرى من الوادي، على التل الذي يطل على القرية، وقف رجل على بغل أبيض في معطف أسود لامع، يتدثر به من الريح. من هناك لا يُرى من الطاحونة إلا ظل أسود صغير، ومن الطاحونة لا يُرى من الرجل إلا ظل أصغر. لكنه لم يكن ينظر، فالعين لا تعدّ. كان يعدّ.\u003c/p>\u003cp>كان يعرف عدد القرى في المقاطعة، وعدد البيوت في كل قرية، وعدد الأكياس التي يطحنها كل بيت في الشتاء. ولم يكن عنده شيء من ذلك مكتوباً، فكله في رأسه. حسب عدد الأكياس. وعدد من خرجوا من الطاحونة، وعدد من دخلوا. وحسب في رأسه، بابتسامة ثابتة على وجهه كالمسمار، الأرقام التي سيقولها ليلاً لمن يستمعون إليه.\u003c/p>\u003cp>ثم سقطت على كم معطفه الأسود أول ندفة ثلج.\u003c/p>"}],"arcs":[[1,40,"المرحلة الأولى: البداية والبقاء"],[41,100,"المرحلة الثانية: الاقتصاد والإنتاج"],[101,180,"المرحلة الثالثة: النفوذ المحلي"],[181,250,"المرحلة الرابعة: صراعات توحيد الإقليم"],[251,300,"المرحلة الخامسة: توحيد الإقليم وتثبيت الحكم"]]}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var C=D.chapters, root=document.documentElement, main=document.getElementById('main');
  root.setAttribute('dir','rtl'); root.setAttribute('lang','ar');
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var t=get('theme'); if(t) root.dataset.theme=t;
  var f=get('fs'); if(f) root.style.setProperty('--fs',f+'px');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function short(t){return t.replace(/^الفصل [^:]+:\s*/,'')}
  function index(){
    var last=parseInt(get('last')||'0',10), lc=C.filter(function(c){return c.n===last})[0];
    var h='<section class="hero"><h1>نظام السيادة الحضارية</h1><p>رواية · '+C.length+' فصلاً منشوراً</p></section>';
    h+= lc ? '<a class="resume" href="#c'+lc.n+'">أكمل القراءة: الفصل '+lc.n+'</a>' : '<a class="resume" href="#c'+C[0].n+'">ابدأ القراءة</a>';
    D.arcs.forEach(function(a){
      var l=C.filter(function(c){return c.n>=a[0]&&c.n<=a[1]}); if(!l.length) return;
      h+='<h2 class="arc">'+a[2]+'</h2><ul class="toc">'+l.map(function(c){return '<li><a href="#c'+c.n+'"><span class="n">'+c.n+'</span><span>'+esc(short(c.t))+'</span></a></li>'}).join('')+'</ul>';
    });
    main.innerHTML=h; document.title='نظام السيادة الحضارية';
  }
  function chapter(i){
    var c=C[i], p=C[i-1], n=C[i+1];
    main.innerHTML='<article class="chapter"><h1>'+esc(c.t)+'</h1>'+c.b+'</article>'+
      '<nav class="nav">'+(n?'<a href="#c'+n.n+'">الفصل التالي ←</a>':'<span>لا يوجد فصل تالٍ بعد</span>')+
      '<a href="#">الفهرس</a>'+(p?'<a href="#c'+p.n+'">→ الفصل السابق</a>':'<span>البداية</span>')+'</nav>';
    set('last',String(c.n)); window.scrollTo(0,0);
  }
  function route(){
    var m=/^#c(\d+)$/.exec(location.hash||''), i=-1;
    if(m){var k=parseInt(m[1],10); for(var j=0;j<C.length;j++) if(C[j].n===k) i=j;}
    if(i>=0) chapter(i); else index();
  }
  document.getElementById('home').onclick=function(){location.hash='';index();window.scrollTo(0,0)};
  function fsz(d){var c=parseFloat(getComputedStyle(root).getPropertyValue('--fs'))||20,v=Math.min(30,Math.max(15,c+d));root.style.setProperty('--fs',v+'px');set('fs',v)}
  document.getElementById('fs-down').onclick=function(){fsz(-1)};
  document.getElementById('fs-up').onclick=function(){fsz(1)};
  document.getElementById('theme').onclick=function(){
    var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark'; set('theme',root.dataset.theme);
  };
  window.addEventListener('hashchange',route); route();
})();
</script>
