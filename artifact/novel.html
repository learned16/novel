 لا يقرؤه، وسيعود إليه.\u003c/p>\u003cp>استلقى أخيراً، وأغمض عينيه.\u003c/p>\u003cp>ثم سمع الصوت.\u003c/p>\u003cp>لم يكن عالياً. جاء عبر الجدار الدافئ من المطبخ، من داخل الموقد نفسه: طقطقة جافة، كأن أحداً يكسر عوداً يابساً بين أصابعه. ثم صمت. ثم طقطقة ثانية أطول، تنتهي بحشرجة خفيفة.\u003c/p>\u003cp>جلس لين.\u003c/p>\u003cp>كانت النار قد خفتت منذ ساعة وبقي الجمر. وشم رائحة لم تكن موجودة في الصباح: دخان خفيف حاد، رمادي، يعرفه جيداً.\u003c/p>\u003cp>نهض بحذر كي لا يوقظها، وفتح باب المخزن. وفي المطبخ المظلم كان الدخان يتسلل من الجدار الأحمر، خيطاً رفيعاً بعد خيط، من شقوق لم تكن هناك عند الظهيرة.\u003c/p>\u003cp>اقترب. مد كفه المتشققة نحو الجدار دون أن يلمسه، فشعر بالحرارة الخفيفة الباقية فيه. ثم لمسه. كان الطين الذي ضغطته شين يان بقطعة الخشب في الأمس صلباً كالحجر في مكان، ومتفتتاً تحت إصبعه في مكان آخر، يسقط حبيبات حمراء عند أخف ضغط. وعلى الأرض، تحت الشق الأطول، كومة صغيرة من الغبار الأحمر كانت تكبر وهو واقف، وصوت الطقطقة يعود من الداخل كل بضع أنفاس.\u003c/p>\u003cp>لم يرفع عينيه عن الرقم الذي ما زال معلقاً في زاوية الهواء.\u003c/p>"},{"n":6,"t":"الفصل السادس: الخسارة المحسوبة","b":"\u003cp>حين خرجت القافلة من الساحة في صباح اليوم السابع، كان كثير من رجالها يسعلون.\u003c/p>\u003cp>انهار الموقد الجديد مع الفجر، وعاد الدخان إلى المطبخ ثم إلى الغرفة الكبيرة. أمضى الرجال ليلتهم الأخيرة يتقلبون في الهواء الخانق، بعد ثلاث ليالٍ ناموا فيها من دون سعال.\u003c/p>\u003cp>وقفت هو سانيانغ في وسط الساحة، وذراعاها مطويتان، وصوتها يعلو فوق ضجيج البغال وهي تُحمَّل:\u003c/p>\u003cp>«كنت أظنه سينجح.» لم تقلها لأحد بعينه. «كنت أظن أن عندي في بيتي شيئاً جديداً، وكانت القافلة كلها ستحكي عنه في المدن.»\u003c/p>\u003cp>مر بها أحد رجال القافلة وهو يربط صندوقاً على ظهر بغل، فحدق في الأرض ولم يقل شيئاً. وتجنبها آخر.\u003c/p>\u003cp>كان لين واقفاً على بعد خطوتين، وشين يان خلفه. شعر أن عيون الساحة كلها عليه، الباعة الذين يعرضون سلعهم على الرحيل، وزوجة الجزار على بابها، وشياو دو مختبئاً خلف عمود الحظيرة. كان يعرف ما سيقوله، لأنه قرره قبل الفجر، حين وقف أمام الجدار المتشقق وحده.\u003c/p>\u003cp>قال بصوت مسموع: «أخطأت.»\u003c/p>\u003cp>التفتت هو سانيانغ.\u003c/p>\u003cp>«كنت أعرف أن الخلطة غير مضمونة. حظها في الصمود لا يزيد كثيراً على النصف. وكنت أعلم أن هذا أقل مما ينبغي، وبنيت عليه، لأن الوقت ضاق.» تنفس. «لو قلت لك ذلك من البداية، لجرّبنا أكثر من خلطة قبل البناء. أنا من أخفاه. ليس شين يان، وليس شياو دو.»\u003c/p>\u003cp>سمع خلفه حركة صغيرة. شين يان لم تقل شيئاً، لكنه عرف أنها سمعت.\u003c/p>\u003cp>قالت هو سانيانغ ببطء: «النصف.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«وكنت تعرف.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>ظلت تنظر إليه، وفي وجهها مزيج من غضب وشيء آخر لم يستطع تسميته. ثم مسحت يديها بمريلتها ببطء، كمن يحسب شيئاً في رأسه ويتأكد من حسابه.\u003c/p>\u003cp>قالت: «تدفع ثمن الطين والفحم الذي ضاع. ويُضاف إلى الدين.» ثم التفتت إلى لاو ما، الذي كان يتبع القافلة الأخيرة بخطوات متمهلة. «لا تحملوا عنا إلى السوق كلاماً أكثر مما رأيتم. أخطأنا وسنصلح. ومن أراد أن يعود، يعود.»\u003c/p>\u003cp>لم يرد لاو ما. وحين وصل إلى جانب لين تباطأ، ثم قال دون أن ينظر إليه، بصوت لا يسمعه غيره:\u003c/p>\u003cp>«أول خلطة تفشل لا تهمني. المهم هل يكرر صاحبها الخطأ.» ثم أضاف: «قلتها بصوت عالٍ. هذه نصف المسافة.»\u003c/p>\u003cp>ومضى.\u003c/p>\u003cp>حين خرجت آخر عربة من البوابة، وانقشع الغبار الذي رفعته الحوافر، بقيت هو سانيانغ واقفة في الساحة الفارغة. كان الهواء ما زال فيه رائحة روث البغال وبقايا الدخان.\u003c/p>\u003cp>قالت دون أن تلتفت: «ادخلا. أريد المطبخ نظيفاً قبل الظهر.»\u003c/p>\u003cp>وحين دخلوا، وجدوا أنها كانت قد بدأت. كانت تنقل الركام بيديها إلى سلة، قطعة بعد قطعة، ببطء فيه عناد. لم يقل أحد شيئاً. وانحنى لين بجانبها وبدأ ينقل الفتات.\u003c/p>\u003cp>قالت بعد دقائق، وعيناها على الركام: «زوجي الراحل كان يقول: الخطأ الذي يُعترف به أمام الناس يُدفع نصف ثمنه.»\u003c/p>\u003cp>لم يدرِ لين ماذا يرد. كانت المرة الأولى التي تذكر فيها زوجها.\u003c/p>\u003cp>«لم أقل إنني سامحت.» رفعت سلة الركام ووضعتها عند الباب. «قلت فقط ما كان يقوله.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم تتكلم شين يان حتى أصبحا وحدهما في المخزن، والباب مغلق.\u003c/p>\u003cp>قالت بلغتهما، بصوت منخفض لم تحاول أن تلطفه: «لا تخفِ عني رقماً مرة أخرى.»\u003c/p>\u003cp>«يان...»\u003c/p>\u003cp>«لا. اسمعني.» جلست على القش، وعدّلت يدها على بطنها دون أن تنتبه. «أعرف لماذا فعلت. كان الوقت ضيقاً، وأنت تريد أن تنجح، ولم تُرد أن تخيفني. هذه كلها أسباب. أنا أفهمها.» رفعت عينيها. «لكنك لا تملك أن تقرر ما أتحمله. هذا الرقم كان لي كما هو لك. لو عرفته، لطلبت أن ننتظر ونجرب. ربما فشل أيضاً، لكننا ما كنا سنبني ونحن لا نعرف ما نضعه في موقدها.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«تعرف الآن.» ثم أنزلت صوتها. «أنا غاضبة منك. كنا نعمل معاً، وأنت تركتني أبني على معلومة ناقصة.»\u003c/p>\u003cp>تذكر ما قالته في الليلة الثالثة: الكذبة التي تتركها تكبر وحدها. لم يكن بينهما حاجة إلى تذكير.\u003c/p>\u003cp>قال: «ثمانية وخمسون. اليوم وكل يوم. كل رقم أراه، تعرفينه.»\u003c/p>\u003cp>«كل رقم.»\u003c/p>\u003cp>«كل رقم.»\u003c/p>\u003cp>أومأت. لم تبتسم، لكن كتفيها هبطتا قليلاً. ثم قالت بنبرتها العملية: «والآن أريد أن أعرف لماذا تشقق الطين.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقف لين أمام الموقد المحطم وركز على الجدار.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: بطانة طين متشققة، موقد جديد\u003c/div>\u003cdiv>التشخيص: الطين المحلي (طين نهر تشينغشي) عالي المحتوى بمعدن ينتفخ بالماء وينكمش بقوة عند الجفاف. نسبة الرمل المقترحة (25%) غير كافية لتقييد الانكماش.\u003c/div>\u003cdiv>الثقة: 77%\u003c/div>\u003cdiv>ملاحظة: لا توجد بيانات محلية مسجلة لهذا الطين. التشخيص مبني على سلوك التشقق المرصود.\u003c/div>\u003cdiv>طاقة التكامل: 91%\u003c/div>\u003c/div>\u003cp>قرأ التشخيص لشين يان بلغتهما. أبقى صوته منخفضاً حتى لا يسمعه من يمر في الباب.\u003c/p>\u003cp>«إذن هو الطين نفسه.»\u003c/p>\u003cp>«الطين الأحمر الذي جاء به شياو دو.»\u003c/p>\u003cp>«منعطف النهر.» نظرت شين يان إلى الركام، ثم إلى الدلو الفارغ في الزاوية، حيث بقيت رواسب حمراء رطبة. «ماذا يقول عن الحل؟»\u003c/p>\u003cp>«لا يقول. يقول إن الانكماش عالٍ. أما كم من الرمل، وكم من القش، فلا يعرف.»\u003c/p>\u003cp>«لأنه لا يملك بيانات محلية.»\u003c/p>\u003cp>«لأنه لا يملك بيانات محلية.»\u003c/p>\u003cp>أخذت الدفتر من حضنها، وفتحت صفحة بيضاء، وبدأت ترسم مستطيلات صغيرة متجاورة.\u003c/p>\u003cp>قال: «ماذا ستفعلين؟»\u003c/p>\u003cp>«ما يفعله من لا يملك بيانات.» لم تتوقف عن الرسم. «أصنعها.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>خرجت إلى الساحة خلف النزل ومعها شياو دو وجرة وقطعة خيش. سارا من هناك إلى منعطف النهر، وملآ دلوين بالطين الأحمر. حملهما الصبي، وعادت شين يان إلى جانبه تمسك الجرة والحبل. جلست على حجر مسطح مغطى بقماش، وفي حضنها لوح خشب تجمع عليه الخلطات. وقفت أمامها ستة قوالب صغيرة صنعها لها شياو دو من أعواد الحطب، كل واحد بحجم الكف.\u003c/p>\u003cp>قالت: «ست بلاطات. كل واحدة بنسبة مختلفة. سأكتب النسب بنفسي، وأنت تعدّ لي بالأكواب.»\u003c/p>\u003cp>«أنا؟»\u003c/p>\u003cp>«أنت تقيس الأكواب، وأنا أقرر.» التفتت إلى لين، الذي كان يقف على مسافة عشر خطوات يتظاهر أنه يقطع حطباً. «اترك الخلطات لي. لا نريد أن نكرر الوصفة نفسها ونحن نظن أننا نختبر غيرها.»\u003c/p>\u003cp>ابتعد لين، ولم يعترض.\u003c/p>\u003cp>استعملت الكوب نفسه لكل مقدار، وسوّت حافته قبل أن تفرغ ما فيه. الأولى: طين وقش فقط. الثانية: طين ورمل بنسبة أكبر. الثالثة: طين ورماد خشب. الرابعة: رمل أكثر من الثانية، مع رماد وقش. الخامسة: الرابعة نفسها بنسبة أقل من الماء. السادسة: خلطة النظام نفسها، الثمانية والخمسين، للمقارنة.\u003c/p>\u003cp>«لماذا السادسة؟» سأل شياو دو.\u003c/p>\u003cp>«لنقارن. إن تشققت وحدها، نعرف ما الذي حسّن الباقي. وإن تشقق الجميع، نبحث عن سبب آخر.»\u003c/p>\u003cp>وضعت البلاطات على لوح كبير، متباعدة بالقدر نفسه، في ركن مظلل من الغرفة الكبيرة. كان يصل إليه دفء النار من غير أن يلامسه لهب أو تيار هواء قوي.\u003c/p>\u003cp>سأل شياو دو: «ألا تجف أسرع قرب الموقد؟»\u003c/p>\u003cp>«تجف أسرع، لكننا نريد أن نعرف أي خلطة تصمد. لو غيرنا مكان كل واحدة فلن نعرف: أهو الرمل أم الحرارة؟»\u003c/p>\u003cp>سوّت اللوح ووضعته بعيداً عن المارة. كتبت مقدار الماء مع كل خلطة، وأبقت التجفيف بطيئاً للجميع. أما البطانة السميكة فستحتاج وقتاً أطول من هذه القطع الصغيرة.\u003c/p>\u003cp>ضغطت بجانب كل بلاطة علامة لا تمحى إن تحركت من مكانها، وكتبت سماكتها. ثم غسلت أصابعها وجلست قرب اللوح. كان في وسعها أن تسرّع التجفيف، لكنها أبعدت اللوح قليلاً عن النار.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الانتظار طويلاً.\u003c/p>\u003cp>مرت الظهيرة بنسيم بارد وغيوم رمادية. جلس لين قرب الحظيرة يقطع الحطب بيدين تحرقانه، وحل شياو دو محلها حارساً على البلاطات، يتفقدها كل بضع دقائق ويعود يخبرهم، فتهز شين يان رأسها دون كلمة.\u003c/p>\u003cp>«الأولى تتقعر.»\u003c/p>\u003cp>«اكتب.»\u003c/p>\u003cp>«الثانية بدأ فيها شق صغير.»\u003c/p>\u003cp>«اكتب.»\u003c/p>\u003cp>«الثالثة...»\u003c/p>\u003cp>«اكتب.»\u003c/p>\u003cp>أخذ يقلد صوتها وهو يعود، ثم يضحك، ثم يعتذر. وقف قرب لين مرة وهمس: «تريد أن تعرف؟ الأولى انتهت. الثانية انتهت. الثالثة والخامسة والسادسة تتشقق. والرابعة...»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«ما زالت تجف. ببطء. لم يتحرك فيها شيء.»\u003c/p>\u003cp>مرت هو سانيانغ بالغرفة الكبيرة وهي تحمل دلو ماء، وتوقفت عند اللوح تتفحص صف البلاطات. لم تسأل. نظرت إلى العلامات الغريبة التي كتبتها شين يان بجانب كل واحدة، وهي لا تفهم منها شيئاً ولا تعترف بذلك، ثم رفعت حاجبها الأيسر قليلاً وانصرفت.\u003c/p>\u003cp>لم يجب لين. أراد أن يقوم ويرى بنفسه، لكنه تذكر أن شين يان طلبت منه ألا يقترب. فبقي على جذعه، يقطع قطعة أخرى، ويقاوم رغبته في استخدام النظام.\u003c/p>\u003cp>قرب العصر، رأى لين من باب الغرفة شين يان جالسة قرب لوح البلاطات، تغمض عينيها وتضغط بكفها على فمها. وضع الفأس ودخل إليها مسرعاً.\u003c/p>\u003cp>«لا.» رفعت يدها الأخرى. «لا تقترب. لا أريدك أن تراني.»\u003c/p>\u003cp>«يان...»\u003c/p>\u003cp>«موجة. ستمر.» تنفست من أنفها ببطء، ثلاث مرات، وفتحت عينيها. «اجلب لي ماء دافئاً من المطبخ. وكسرة خبز، لا شيء آخر.»\u003c/p>\u003cp>أحضرهما في دقيقتين. أخذتهما منه دون أن تشكره، وأكلت الخبز لقمة صغيرة صغيرة، وعيناها على البلاطات. وحين انتهت، قالت بصوت أقوى:\u003c/p>\u003cp>«لو ظللت واقفاً هكذا، سأتركك تحرس البلاطات بدلاً من شياو دو.»\u003c/p>\u003cp>عاد إلى جذعه. نظر إليها قبل أن يلتقط الفأس. كانت قد أسندت ظهرها إلى الجدار وأبقت الخبز في يدها، فأبطأ خطاه وترك الماء قريباً منها.\u003c/p>\u003cp>وفي المساء، حين مالت الشمس، رفعت شين يان البلاطة الرابعة بين أصابعها.\u003c/p>\u003cp>كانت مستقيمة. بلا شق ولا تقعر. خشنة قليلاً، لكنها ساكنة. ضربتها على الحجر بخفة، فأعطت صوتاً مكتوماً صلباً.\u003c/p>\u003cp>قالت: «رمل أكثر ورماد خشب. نجحت مع التجفيف البطيء. لا نضعها غداً في نار قوية ونقول إننا جربناها.» ثم نظرت إلى الباقيات: ثلاث مكسورة، واثنتان فيهما شقوق دقيقة. «الطين لا يكذب. نحن الذين استعجلنا الحكم.»\u003c/p>\u003cp>نظرت إلى لين.\u003c/p>\u003cp>«حللها.»\u003c/p>\u003cp>ركز على البلاطة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحديث قاعدة البيانات المحلية]\u003c/strong>\u003c/div>\u003cdiv>المادة: طين نهر تشينغشي\u003c/div>\u003cdiv>نتيجة تجريبية: خلطة (طين 50% + رمل 35% + رماد خشب 8% + قش 7%) مجففة ببطء — لا تشقق.\u003c/div>\u003cdiv>تمت إضافة البيانات إلى القاعدة المحلية.\u003c/div>\u003cdiv>الثقة في هذه الخلطة: 91%\u003c/div>\u003cdiv>طاقة التكامل: 84%\u003c/div>\u003c/div>\u003cp>أطلق لين نفساً طويلاً.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري — مكتمل]\u003c/strong>\u003c/div>\u003cdiv>إيجاد خلطة بطانة صالحة ✓\u003c/div>\u003cdiv>المكافأة: أداة التخطيط البسيط (مفتوحة)\u003c/div>\u003cdiv>سعة التخزين الحالية: 0.1 م³\u003c/div>\u003c/div>\u003cp>وجد أن أحد معاني «أداة التخطيط البسيط» ظهر مباشرة في ذهنه: لوحة بيضاء ممتدة في الهواء، فيها خطوط ومربعات وأسهم، يمكن أن يضع عليها مراحل العمل وموادها وتواريخها. أغلقها بالتفكير، قبل أن يفتنه ما فيها.\u003c/p>\u003cp>قال: «يمكننا ترتيب إعادة البناء عليها.»\u003c/p>\u003cp>وضعت البلاطة على ركبتيه. «رتبها. وأول ما تكتبه: لا نار قوية قبل أن تجف.»\u003c/p>\u003cp>فتحها لين مرة ثانية، وهو يمشي معها نحو النزل. على اللوح الأبيض كتب بالفكر كلمة «موقد»، فتفرعت تحتها خطوات بسيطة بخطوط رمادية: هدم الركام، تحضير الخلطة، البطانة، التجفيف، الإشعال التدريجي. وإلى جانب كل خطوة رقم صغير: اليوم، والمادة، ومن يحتاج إليه.\u003c/p>\u003cp>قالت شين يان وهو يصف لها ما يراه: «التجفيف يومان، وليس يوماً.»\u003c/p>\u003cp>«اللوحة تقول يوماً ونصف.»\u003c/p>\u003cp>«اللوحة تقدر ببيانات الطين الجديد، وأنا قدرت بيدي. يومان.»\u003c/p>\u003cp>غيّر الرقم. ظهرت أمامه عبارة قصيرة، بنبرة محايدة: «تم قبول التعديل اليدوي.» لم يكن فيها اعتراض ولا اعتراف، وفهم أن الأداة لا تنتصر في الجدال، فهي لا تجادل. هي ترسم ما يُقال لها.\u003c/p>\u003cp>أعاد ترتيب الخطوات، وجعل اختبار النار بعد التجفيف. هذه المرة لن يسمح لقرب الموعد بأن ينقلها إلى ما قبله.\u003c/p>\u003cp>كان شياو دو يسير خلفهما، يحمل ما بقي من الطين على كتفه، ويغني بصوت خافت لحناً من الأعراس، ثم قال فجأة: «العمة ستضع الرقم في كتابها. أنا أعرف. يوم أمس كتبت اسمي بجانب \"الطين\". قالت إنه مصروف.»\u003c/p>\u003cp>«أنت لست مصروفاً.»\u003c/p>\u003cp>«قلت لها ذلك. قالت: تأكل ثلاث مرات في اليوم، وتحسب هذا لك.» ثم عض شفته. «لكنها لم تطردني.»\u003c/p>\u003cp>وضحك الثلاثة رغم أنفسهم، ضحكة قصيرة متعبة، هي أول مرة منذ الفجر.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عادا إلى المطبخ مع حلول المساء، والبلاطة في يد لين كأنها رغيف ثمين. وجدا هو سانيانغ جالسة أمام الموقد المحطم، وكتاب حساباتها مفتوح على ركبتيها. كانت تكتب.\u003c/p>\u003cp>لم ترفع رأسها.\u003c/p>\u003cp>قالت: «ثمن الطين الذي ضاع، وأربع سلال من الحطب الجاف احترقت في الاختبار، ويومان من وقت شياو دو.» رفعت عينيها أخيراً. «ثماني عشرة نحاسة.»\u003c/p>\u003cp>لم يقل أحد شيئاً.\u003c/p>\u003cp>«والوجبة الأولى تظل ديناً أيضاً.» أغلقت الكتاب. «لكن هذا ليس الرقم الذي يهمني.»\u003c/p>\u003cp>ثم قالت: «بعد غد يأتي الكاتب وو. يوم السوق. كل بيت ستدخله أسماء الغرباء في دفتر الحكومة. وكفالتكما أمام الحكومة مئة وأربعون نحاسة. سأدفعها من مال النزل، فلا يبقى لي ما أصلح به موقداً ثالثاً.»\u003c/p>\u003cp>نظرت إلى البلاطة في يد لين.\u003c/p>\u003cp>«فإذا أردتما أن تبقيا، فالأفضل أن يكون هذا الطين صالحاً قبل أن تتكلم الحكومة.»\u003c/p>\u003cp>قالت شين يان: «سيكون.»\u003c/p>\u003cp>«بعد غد.»\u003c/p>\u003cp>«سنبدأ الليلة.» وأخذت من يد لين البلاطة ووضعتها على الرف فوق موقد الغرفة الكبيرة، بين مغرفة خشبية وجرة ملح مشققة. «كي يراها كل من يدخل.»\u003c/p>\u003cp>مدت هو سانيانغ يدها، وتحسست حافة البلاطة بإبهامها، ببطء، كما تتحسس تاجرة قطعة قماش. ثم سحبتها دون كلمة، وانصرفت إلى القدور.\u003c/p>\u003cp>لكن لين رأى أنها لم تضع الكتاب على الرف كعادتها. أخذته معها إلى غرفتها، مفتوحاً على صفحة اليوم.\u003c/p>\u003cp>وفي الخارج، كان الليل قد هبط على القرية، وخلف البوابة طريق خالٍ. في مطبخ النزل حمل شياو دو أول دلو من الخلطة الجديدة، ينتظر أن يفتح له لين الباب.\u003c/p>"},{"n":7,"t":"الفصل السابع: الكاتب وو","b":"\u003cp>مرّ يومان من إعادة البناء، وكانت البطانة الجديدة ما زالت تجف.\u003c/p>\u003cp>في صباح اليوم التاسع، وقفت شين يان أمام الموقد تتفقد البطانة بظهر كفها. كان الخيش الذي علّقته ليبطئ جفافها مطوياً عند الباب، والنار الصغيرة مشتعلة منذ المساء. لا شقوق عند الزاوية، ولا غبار أحمر تحتها. تحسست الجدار مرة أخيرة، ثم أفسحت لشياو دو ليرفع القدر.\u003c/p>\u003cp>قالت هو سانيانغ، وهي تغلق باب المطبخ: «لا أحد يقول كلمة عنه الآن. إذا قلتم إنه نجح فسيفشل.»\u003c/p>\u003cp>كان أهل القرية قد بدأوا يتجهون إلى السوق منذ الفجر.\u003c/p>\u003cp>مشى لين في الطريق بين شين يان وشياو دو، يحمل على ظهره سلة من الحطب الجاف أصرّت هو سانيانغ أن يبيعاها ليدفعا ثمن الوقوف في السوق. كانت الأرض مبتلة من ندى الفجر، ورائحة الشواء والتراب المبلل تأتي من بعيد. وكان الناس يمرّون بهم في جماعات: نساء يحملن سلالاً على رؤوسهن، ورجال يجرّون بغالاً محملة، وأطفال يركضون على حواف الطريق. وكل من مرّ نظر إلى شين يان، ثم إلى لين، ثم همس.\u003c/p>\u003cp>قالت شين يان بلغتهما: «يعرفون.»\u003c/p>\u003cp>«يعرفون ماذا؟»\u003c/p>\u003cp>«أنك الرجل الذي أصلح مدخنة النزل، وفشل في الموقد، وأعلن فشله في الساحة.» مشت خطوات. «سيسألون اليوم أي رجل أنت.»\u003c/p>\u003cp>«الذي أخطأ ثم أصلح.»\u003c/p>\u003cp>«قل هذا إن سألوك عن الموقد. أما غيره فلا ترتجل جواباً.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>السوق ساحة واسعة قرب النهر، تحيط بها صفوف الباعة على حصائر مفروشة. ملح في أكوام بيضاء رمادية، وفخار أحمر مكدس بعناية، وأقمشة معلقة على حبال كأنها رايات، وقدور نحاسية، وحزم عشب جاف، ولحم معلق من خطاطيف يلمع بالدهن. وفي الطرف الجنوبي صفوف من الحديد: سكك محاريث ومناجل ومسامير وقضبان طويلة موضوعة على رفوف خشبية. وفوق الجميع صخب أصوات كثيرة تنادي على البضاعة، وتساوم، وتشتم، وتضحك.\u003c/p>\u003cp>توقف لين أمام بائع الحديد.\u003c/p>\u003cp>رجل ممتلئ مبتسم، يجلس على كرسي مريح خلف طاولته، وعلى كتفيه معطف من الفرو الأسود المصقول. وجهه لامع بنضارة من لم يعرف الجوع، ويداه ناعمتان عليهما خواتم نحاسية. وعند طرف الطاولة رجلان يزنان القضبان على ميزان.\u003c/p>\u003cp>على لوح خلف التاجر سطور من الأسماء والأثمان. عرف لين شكل بعض الأرقام، لكنه لم يستطع وصل كل ثمن بما يخصه. أشار إلى القضبان، ثم إلى سكك المحاريث، وطلب من شياو دو أن يقرأ له.\u003c/p>\u003cp>قال شياو دو بجانبه، مخفضاً صوته: «هذا السيد تشيان. كل حداد في المقاطعة يشتري منه.»\u003c/p>\u003cp>«كم ثمن القضيب؟»\u003c/p>\u003cp>«ضعف السكة.»\u003c/p>\u003cp>«ضعف سكة المحراث كلها؟»\u003c/p>\u003cp>«نعم. لأن السكة يشتريها الفلاح، والقضيب يحتاجه الحداد.»\u003c/p>\u003cp>قال لين لنفسه: القضيب الخام أغلى من المنتج النهائي. من يشتري هذا القضيب لن يستطيع بيع ما يصنعه بأجر يناسب عمله. كيف يقبل الحدادون؟\u003c/p>\u003cp>في تلك اللحظة رفع التاجر رأسه، وكأنه سمع، وابتسم.\u003c/p>\u003cp>«أنت النازح الذي أصلح مدخنة هو.» أشار بيد ممتلئة. «تعال. تعال. أنا تشيان. سمعت عنك. وسمعت أن الموقد الجديد وفّر في ثلاث ليال تسعاً وعشرين سلة حطب، كما يقولون.»\u003c/p>\u003cp>«لا أعرف من قال لك هذه الأرقام.»\u003c/p>\u003cp>«الأرقام تُسمع.» ابتسم أكثر. «في هذا السوق، يا سيدي، لا شيء يتكلم أعلى من رقم. اثنتان وعشرون سلة في اليوم، ثم اثنتا عشرة. هذا نصف.»\u003c/p>\u003cp>لم يكن الرقم صحيحاً، لكنه لم يصحح. وكانت شين يان قد وقفت خلفه بصمت، وعيناها على يدي التاجر.\u003c/p>\u003cp>قال تشيان: «إذا بنيت موقداً لي، أدفع بسخاء. تذكر أنني أبيع الحديد منذ عشر سنوات، وأحمل نصف ما في هذا السوق.»\u003c/p>\u003cp>«سأفكر.»\u003c/p>\u003cp>«فكر. التفكير بلا ثمن.» ضحك. «أما الحديد فله ثمن.»\u003c/p>\u003cp>انصرف لين، لكن شين يان بقيت لحظة. أخرجت الدفتر والقلم الرصاص من جيب سترتها، ونظرت إلى لوح الأسعار، ثم إلى القضبان، ثم كتبت. سطراً بعد سطر، بخط صغير: قضيب، سكة، منجل، مسمار. وحين رفعت رأسها وجدت تشيان ينظر إلى الدفتر بابتسامته نفسها، لكن عينيه تبدلتا قليلاً.\u003c/p>\u003cp>قال: «ما هذه الحروف يا سيدتي؟»\u003c/p>\u003cp>«أرقام.»\u003c/p>\u003cp>«أرقام من أين؟»\u003c/p>\u003cp>«هذه طريقتي في كتابة الأعداد.» أغلقت الدفتر. «كتبت الأسعار حتى لا أنساها.»\u003c/p>\u003cp>ولم تقل للين، حتى وصلا إلى حافة الساحة، إلا ثلاث كلمات: «ضعف وعُشر.» أي أن الفرق بين ثمن القضيب وثمن السكة الكاملة، كما حسبته، أكبر مما قال شياو دو.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الكاتب وو يجلس في ظل شجرة كبيرة عارية الأغصان، عند حافة الساحة، إلى طاولة منخفضة عليها دفتر ضخم مغلق بشريط أحمر، وحجر حبر، وثلاث فرش للكتابة. وعلى جانبيه حارسان بمعطفين رماديين، يقفان وأيديهما خلف ظهريهما.\u003c/p>\u003cp>لم يكن كما تخيله لين. توقع رجلاً صارماً بلحية وعمامة. لكن الكاتب شاب في أواخر الثلاثينات، نحيل، ذو وجه مستدير أنيق، وعينين واسعتين تبدوان ناعستين وهما ليستا كذلك. وعلى كتفيه معطف أزرق نظيف، وفي أصابعه فرشاة بيضاء الشعر.\u003c/p>\u003cp>لحقت بهم هو سانيانغ من طرف السوق، تحمل كيس الكفالة داخل مريلتها. أشارت إلى شياو دو أن يبقى عند سلة الحطب، وتقدمت بهم إلى الشجرة. كان في الطابور أمامهم أربع عائلات. تقدمت واحدة بعد أخرى، وتكلم الكاتب مع كل منها بصوت خفيض مهذب جداً، كأنه يعتذر، وكتب. وحين جاء دورهم وقف ثلاثتهم صفاً، هو سانيانغ في المقدمة بوجه حجري، ولين خلفها، وشين يان إلى جانبه.\u003c/p>\u003cp>قال الكاتب وو: «السيدة هو. أهلاً بك. أرجو أن تغفري لي أن أجعلك تنتظرين.»\u003c/p>\u003cp>«لم أنتظر.»\u003c/p>\u003cp>«الحمد لله.» ابتسم وانحنى قليلاً. «وهذان، إذن، الضيفان.»\u003c/p>\u003cp>«أنا أكفلهما.»\u003c/p>\u003cp>«تكفلينهما.» كررها وهو يفتح الدفتر. «هذا حسن.» قلّب الدفتر وأخذ فرشاة جديدة وغمسها. «سأسأل فقط أسئلة بسيطة. لأن القانون كما تعلمين... ضيق قليلاً في الأسئلة.»\u003c/p>\u003cp>نظر إلى لين.\u003c/p>\u003cp>«اسمك الكامل؟»\u003c/p>\u003cp>«لين شياو.»\u003c/p>\u003cp>«واسم أبيك؟»\u003c/p>\u003cp>فتح لين فمه ولم يجد ما يقوله. كان اسم أبيه في عالم آخر، وأي اسم يقوله هنا سيكون كذبة تكبر وحدها.\u003c/p>\u003cp>«أبي...»\u003c/p>\u003cp>«توفي؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«إذن اسمه. للسجل فقط.»\u003c/p>\u003cp>«كان...» لم يجد كلمة. «لقب العائلة لين.»\u003c/p>\u003cp>كتب الكاتب. لم يرفع رأسه. «ومن أي قرية في الجنوب؟»\u003c/p>\u003cp>ساد صمت قصير.\u003c/p>\u003cp>لمح لين هو سانيانغ بطرف عينه، وقد جمدت. كان فمها مطبقاً، ويدها ثابتة على كيس الكفالة.\u003c/p>\u003cp>«من قرية...»\u003c/p>\u003cp>«من قرية لم يعد لها اسم.»\u003c/p>\u003cp>قالتها شين يان بصوت هادئ، بلهجتها الأخف، وعيناها مباشرتان في عيني الكاتب.\u003c/p>\u003cp>رفع وو رأسه.\u003c/p>\u003cp>«لم يعد لها اسم؟»\u003c/p>\u003cp>«أخذها الماء. تفرق أهلها، وتركناها من غير أن نعرف من بقي فيها.» قبضت على حافة كمها. «لم يبق لنا هناك بيت نعود إليه.»\u003c/p>\u003cp>أبقى لين عينيه على الطاولة. لو سأل الكاتب عن قرية مجاورة أو طريق يعرفه أهل الجنوب، فلن يجدا جواباً. ظلت الفرشاة معلقة فوق الورق لحظة.\u003c/p>\u003cp>قال بصوت ودود: «أفهم.» وكتب. «وهل كان الفيضان في الشهر الثامن أم التاسع؟»\u003c/p>\u003cp>«في الشهر التاسع.» قالت هو سانيانغ بسرعة، قبل أن يجيب أحد. «هذا ما أخبرتني به.»\u003c/p>\u003cp>نظر وو إليها طويلاً، ثم عاد إلى الدفتر.\u003c/p>\u003cp>«حسن.» ثم، وهو يكتب بيد، رفع نظره إلى يدي لين المعلقتين على جانبيه. بقي ينظر إليهما لحظة. لم يكن في نظرته شيء يهدد، لكنه كان فاحصاً كنظرة طبيب.\u003c/p>\u003cp>قال: «يدا رجل يعمل. لكنهما ليستا يدي فلاح.»\u003c/p>\u003cp>لم يجب لين.\u003c/p>\u003cp>«ولا يدي حداد.» أضاف الكاتب بلطف شديد. «ولا يدي كاتب. أتساءل فقط... ما عملك يا سيد لين؟»\u003c/p>\u003cp>قال لين، وكانت الكلمة تخرج منه قبل أن يفكر: «أصلح الأشياء.»\u003c/p>\u003cp>«أصلح الأشياء.» ابتسم وو. «كم هذا نادر.» وكتب جملة واحدة، قصيرة جداً، ثم أغلق الدفتر ببطء. «هذا يكفي لليوم. السيدة هو، الكفالة. مئة وأربعون.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>دفعت هو سانيانغ المبلغ بنفسها. أخرجت من جيب أسفل مريلتها كيساً صغيراً من القماش المخيط، وعدّت القطع على الطاولة، قطعة بعد قطعة، بصوت رنين نحاسي ثقيل. كان الكيس يفرغ ببطء، ولم ترفع هو سانيانغ عينيها عنه. لم يقل أحد شيئاً. وعدّت شين يان في رأسها معها.\u003c/p>\u003cp>حين وصلت إلى الأربعين، كتب الكاتب شيئاً. وحين وصلت إلى المئة، توقفت لحظة. وحين أنهت المئة والأربعين، أعادت الكيس الفارغ إلى جيبها بحركة بطيئة.\u003c/p>\u003cp>قال وو: «تم.»\u003c/p>\u003cp>أخذت هو سانيانغ نفساً. ثم قالت للين وشين يان دون أن تنظر إليهما: «مئة وأربعون، وثماني عشرة من قبل. مئة وثمانية وخمسون نحاسة. اكتباها حيث تكتبان.»\u003c/p>\u003cp>عرف لين، دون أن يحتاج إلى النظام، أن الرقم لن يُنسى.\u003c/p>\u003cp>مرت هو سانيانغ بينهما كالعاصفة الصغيرة، ولم تنظر إلى أحد. ثم توقفت بعد خطوات، ووضعت يدها على كتف شياو دو الذي كان يتبعها.\u003c/p>\u003cp>«اذهب مع لين وشين يان. لا تتركهما يشتريان شيئاً غبياً.»\u003c/p>\u003cp>«أي شيء غبي؟»\u003c/p>\u003cp>«كل شيء.» ومضت نحو بائع الملح.\u003c/p>\u003cp>نظر الصبي إلى لين بعينين متسعتين، وهمس: «العمة لا تقول هذا إلا لمن تثق بهم.»\u003c/p>\u003cp>«تثق بنا؟»\u003c/p>\u003cp>«تثق بأنكما ستشتريان شيئاً غبياً.» وانفجر ضاحكاً، ثم وضع يده على فمه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقفا في طرف السوق، بعيداً عن ازدحام الحديد، حيث الباعة المتجولون.\u003c/p>\u003cp>لم يكن لين يبحث عن شيء. كان فقط يمشي، وكان رأسه ممتلئاً بالرقم، مئة وثمانية وخمسون، ويفكر كم يوماً يلزمه ليسدده إن لم يحدث شيء آخر. وحين وصل إلى آخر الصف، رأى بساطاً مفروشاً على الأرض عليه خردة: مسامير ملتوية، وأزرار عظمية، وإبر، وفي المنتصف حجر صغير.\u003c/p>\u003cp>حجر أسود محمر، بحجم بيضة، سطحه مسامي مثل خبث الفحم.\u003c/p>\u003cp>توقف.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: خام حديدي نادر (مركب غير معروف)\u003c/div>\u003cdiv>تطابق جزئي مع \"المكوّن المجهول\" في التخزين: 0.3%\u003c/div>\u003cdiv>الثقة: 63%\u003c/div>\u003cdiv>ملاحظة: التطابق ضعيف جداً، وقد يكون صدفة في التركيب.\u003c/div>\u003cdiv>طاقة التكامل: 88%\u003c/div>\u003c/div>\u003cp>قال بصوت منخفض: «يان.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«النظام يقول إن هذا الحجر يتطابق مع المكوّن بنسبة ثلاثة أعشار في المئة.»\u003c/p>\u003cp>لم ترد فوراً. اقتربت. نظرت إلى الحجر الصغير، ثم إلى لين. «ثلاثة أعشار.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«أقل من واحد.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ومع ذلك أنت تفكر في شرائه.»\u003c/p>\u003cp>لم ينكر.\u003c/p>\u003cp>سأل البائع، رجل نحيل بلحية متفرقة وعينين ضيقتين: «بكم هذا؟»\u003c/p>\u003cp>«خمس عشرة نحاسة.»\u003c/p>\u003cp>«خمس عشرة؟ هذا حجر.»\u003c/p>\u003cp>«حجر من الشمال البعيد. لا يوجد في هذه المقاطعة.» رفع كتفيه. «وإن لم يكن عندك نحاس، أصلح لي عجلة العربة.» أشار بذقنه إلى عربة صغيرة ذات عجلتين مركونة على حافة السوق. إحدى عجلتيها مكسورة، وبعض مسامير المحور ملتوية.\u003c/p>\u003cp>وفي اللحظة نفسها، شعر لين بيد تلمس كمه. التفت. فلاح عجوز بوجه محروق من الشمس، قال بصوت حذر: «أنت الرجل الذي يصلح؟ هل تستطيع أن تصلح عجلة عربتي؟ مثل تلك. اثنتا عشرة نحاسة.»\u003c/p>\u003cp>اثنتا عشرة نحاسة. من الدين.\u003c/p>\u003cp>نظر لين إلى الحجر. ثم إلى الفلاح. ثم إلى شين يان.\u003c/p>\u003cp>كانت تعرف تماماً ما يجري. قالت بصوت عادي، لا تهديد فيه ولا رجاء: «اثنتا عشرة نحاسة من الدين، أو حجر؟»\u003c/p>\u003cp>«الحجر قد يكون...»\u003c/p>\u003cp>«ثلاثة أعشار في المئة.»\u003c/p>\u003cp>«قد يكون الخيط الوحيد.»\u003c/p>\u003cp>«وقد يكون حجراً.» أنزلت عينيها. «أنت تعرف الأرقام يا لين. لن أكرر عليك ما تعرفه.»\u003c/p>\u003cp>طوت شين يان صفحة الأسعار وأغلقت الدفتر. انتظر لين اعتراضاً آخر، لكنها سحبت يدها من قرب الحجر، وتركت له مكاناً أمام البائع.\u003c/p>\u003cp>مد يده وأخذ الحجر.\u003c/p>\u003cp>همس شياو دو من خلفه بصوت مذعور: «قالت العمة: شيئاً غبياً. قالت لك!» ثم أطبق شفتيه حين نظرت إليه شين يان نظرة واحدة.\u003c/p>\u003cp>«سأصلح العجلة.»\u003c/p>\u003cp>قال الفلاح، وقد انسحبت ابتسامته: «ولي؟»\u003c/p>\u003cp>«بعد أن أنتهي منه. إن كان عندك وقت.»\u003c/p>\u003cp>أومأ الفلاح ببطء، ومشى، ولم يقل شيئاً.\u003c/p>\u003cp>أصلح لين العجلة في ساعة، بمطرقة استعارها من حداد قريب، وأوتاد جديدة قطعها من خشب البلوط، وعصب قديم لف به المحور. عمل بيدين متشققتين، والبائع يراقبه بعيني من يعرف أن الثمن قد دفع، وشين يان جالسة على صندوق خشبي بعيداً قليلاً، لا تنظر إليه.\u003c/p>\u003cp>لم تكلمه حتى المساء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في المخزن ليلاً، وضع لين الحجر على القش بين يديه، ثم سحبه إلى التخزين.\u003c/p>\u003cp>ظهرت القائمة:\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[التخزين — 0.1 م³]\u003c/strong>\u003c/div>\u003cdiv>أداة متعددة، دفتر، قلم رصاص، هاتف (0%)\u003c/div>\u003cdiv>مكوّن مجهول ×1\u003c/div>\u003cdiv>خام حديدي نادر ×1\u003c/div>\u003c/div>\u003cp>نظر إلى السطرين المتجاورين. لم يحدث شيء. لا رعشة، ولا توهج، ولا همس. حجران صامتان في مكان لا حجم له.\u003c/p>\u003cp>أخرج الحجر مرة أخرى وقلبه بين أصابعه. بقي سطحه بارداً وخشناً، كما كان على بساط البائع. أعاده، ثم أغلق القائمة قبل أن يعيد الفحص بلا سبب.\u003c/p>\u003cp>قال: «لا شيء.»\u003c/p>\u003cp>كانت شين يان مستلقية على ظهرها، تنظر إلى السقف المنخفض، وكتفاها مشدودان. أنفاسها هادئة جداً.\u003c/p>\u003cp>قال: «يان، أنا...»\u003c/p>\u003cp>«لا تعتذر.»\u003c/p>\u003cp>«لم أكن سأعتذر.»\u003c/p>\u003cp>«كنت.» لم تتحرك. «لا أريد اعتذارك. أريد أن أفهم.»\u003c/p>\u003cp>انتظر.\u003c/p>\u003cp>قالت بعد صمت: «إذا كان يساوي شيئاً، أريد أن أعرف أنا أيضاً متى.»\u003c/p>"},{"n":8,"t":"الفصل الثامن: الطاحونة المهجورة","b":"\u003cp>في فجر اليوم العاشر، جاء الفلاح العجوز قبل أن يبدأ العمل في المطبخ.\u003c/p>\u003cp>وقف عند باب المخزن في ظلام رمادي، يعصر قبعته المصنوعة من القش بين كفيه، ولم يقل شيئاً حتى خرج لين. كان خلفه حمار صغير يجر عربة، إحدى عجلاتها غائرة في الوحل.\u003c/p>\u003cp>«قلت بعد أن تنتهي من الآخر.»\u003c/p>\u003cp>«انتهيت من الآخر.»\u003c/p>\u003cp>«الآخر دفع خمس عشرة، وأنا لا أملك إلا اثنتي عشرة.» رفع الرجل رأسه. «لكنها اثنتا عشرة كاملة.»\u003c/p>\u003cp>لم يكن لين قد نام جيداً. تأمل العجلة المائلة، ثم نظر إلى الحمار الذي وقف مطأطئ الرأس. وقال: «أرني.»\u003c/p>\u003cp>استغرق الإصلاح أقل من ساعة، لأن العلة كانت أبسط مما بدت: محور مائل وطوق خشبي متآكل، لا كسر. شدّ الطوق بوتد جديد وألان المحور بالشحم، وشين يان تقف خلفه بصمت تحمل المصباح، وتراقب بعيني من يعدّ كل حركة.\u003c/p>\u003cp>دفع الفلاح القطع النحاسية في كفه واحدة بعد أخرى، ثم انحنى انحناءة قصيرة ومضى.\u003c/p>\u003cp>عدّ لين القطع في كفه. اثنتا عشرة كاملة، كما وعد الرجل. مسح عنها الشحم بطرف الخرقة قبل أن يناولها لشين يان.\u003c/p>\u003cp>قالت شين يان: «أعطني.»\u003c/p>\u003cp>أعطاها.\u003c/p>\u003cp>عدّتها مرتين بإصبعها، ثم دسّتها في كيس صغير علّقته في حزامها، ولم تقل شيئاً. لكنها قالت وهي تمشي نحو المطبخ، دون أن تلتفت: «ستذهب إلى هو سانيانغ وتقول لها: اثنتا عشرة من الدين.»\u003c/p>\u003cp>«وأنت؟»\u003c/p>\u003cp>«وأنا سأكتب في دفتري أن الحجر كلّفنا اثنتي عشرة نحاسة.» لم تلتفت. «لأن هذا ثمنه حقاً. لا أريد أن يصير شيئاً مجانياً في رأسك.»\u003c/p>\u003cp>قال لين: «لكننا أخذنا أجر الفلاح أيضاً.»\u003c/p>\u003cp>«اليوم، بعد أن جاء يبحث عنا. بالأمس اخترت الحجر وتركت الرجل ينتظر.»\u003c/p>\u003cp>لم يجادلها. لو مضى الفلاح إلى غيره لضاعت النحاسات، وما كان الحجر ليعوضها. سار معها إلى المطبخ، وأبقى المصباح بعيداً عن كيسها حتى لا يصيبه الشحم.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت هو سانيانغ تحصي الدقيق حين دخلا المطبخ.\u003c/p>\u003cp>قال لها لين: «اثنتا عشرة من الدين. من الفلاح صاحب العجلة.»\u003c/p>\u003cp>رفعت رأسها، ونظرت إلى القطع في كف شين يان، ثم كتبت في كتابها دون كلمة، وشطبت رقماً وكتبت تحته غيره. مئة وستة وأربعون. ثم دفعت الوعاء الخشبي بعيداً.\u003c/p>\u003cp>«تعالا واسمعا.»\u003c/p>\u003cp>كانت الغرفة الكبيرة صامتة، لكن صوتاً منتظماً كان يأتي من خارج النزل، صوت حجر يطحن حجراً، بطيئاً خشناً. جر. جر. جر. يأتي من بيت، ثم يجيبه صوت آخر من خلف الجدار.\u003c/p>\u003cp>«هذه الرحى.» قالت وهي تشير إلى النافذة. «النساء يطحنّ الدخن يدوياً منذ ما قبل الفجر. حجر في كل بيت. ثلاث ساعات في اليوم لعائلة من خمسة. وإذا أردن أن يحملن حبوبهن إلى طاحونة ليو...»\u003c/p>\u003cp>«طاحونة ليو؟»\u003c/p>\u003cp>«عند النهر الكبير، شرق البلدة. ملك عائلة ليو، التي تملك نصف الأرض هنا.» لوّحت بيدها. «يأخذون جزءاً من كل عشرة من الحبوب أجراً للطحن. لا يهم كم تحمل. جزء من عشرة، دائماً. حتى لو جئت بكيس واحد.»\u003c/p>\u003cp>قالت شين يان: «عُشر.»\u003c/p>\u003cp>«عُشر. وإن لم تدفعه، لا يُطحن شيء.» ثم سكتت لحظة. «والذي لا يملك قوة في ذراعيه أو لا يملك ما يتحمل خسارة العشر، يطحن في بيته ويفقد النهار كله.»\u003c/p>\u003cp>نظر لين إلى شين يان. تبادلا النظرة نفسها. العُشر في الأجر، وثلاث ساعات يومياً في كل بيت، في قرية فيها مئة بيت.\u003c/p>\u003cp>«هل في المنطقة طاحونة غير ليو؟» سأل.\u003c/p>\u003cp>قالت هو سانيانغ: «كان هناك واحدة. قبل خمس سنوات. على منعطف النهر.»\u003c/p>\u003cp>سمع صوتاً وراءه. كان شياو دو واقفاً في الباب، يحمل سلة. قال بحماس:\u003c/p>\u003cp>«أنا أعرفها! أنا أعرف مكانها!»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>سبقهم شياو دو بعشر خطوات طوال الطريق، يمشي أحياناً إلى الوراء ليتكلم، ويتعثر بالحجارة، ولا يتوقف عن الكلام.\u003c/p>\u003cp>كان الطريق إلى منعطف النهر يمر عبر حقول محصودة مغطاة بالصقيع الأبيض، ثم بسياج من الأعشاب الجافة، ثم بمنحدر يؤدي إلى ضفة موحلة. وكان البرد يشتد كلما اقتربوا من الماء، برد رطب يدخل في الثياب ويلتصق بالجلد، فيه رائحة الطين العفن والأوراق الميتة وشيء يشبه المعدن.\u003c/p>\u003cp>قال شياو دو: «كانت طاحونة العم جياو. كان الجميع يطحنون عنده، وكان لا يأخذ إلا جزءاً من عشرين. ثم جاء الفيضان في الربيع قبل خمس سنوات. أخذ الدولاب. ودخل البيت. ومات العم جياو.»\u003c/p>\u003cp>«مات؟»\u003c/p>\u003cp>«غرق. وجدوه في الصباح عند الحقل.» خفض صوته للمرة الأولى. «يقولون إنه حاول أن ينقذ الحجرين.»\u003c/p>\u003cp>وصلوا.\u003c/p>\u003cp>في منعطف النهر، حيث يتسع المجرى ثم يضيق ثم ينحني نحو الشرق، كانت هناك بقايا بيت حجري صغير نصفه مدفون في الطين. جدار واحد قائم، والباقي ركام. وبجانبه، على جدول أضيق منحرف عن المجرى الرئيسي، دولاب ماء مكسور، نصفه في الماء ونصفه معلق في الهواء. ريشاته مهشمة، وإطاره ملتوٍ، وقد نبتت عليه طحالب سوداء.\u003c/p>\u003cp>وقف لين أمامه.\u003c/p>\u003cp>وضع يده على الخشب البارد، وتحسس طرف ريشة مكسورة.\u003c/p>\u003cp>لم يسبق له أن أصلح دولاب ماء. كان مهندساً كهربائياً، تعامل مع دوائر وجهود وترددات. لكن أي رجل يرى هذا يعرف ما كان: آلة. آلة قديمة بسيطة، لكنها آلة. أول آلة حقيقية رآها منذ وصل.\u003c/p>\u003cp>قال شياو دو: «المحور هناك.»\u003c/p>\u003cp>وضع لين يده على محور الدولاب، جذع خشبي ضخم أسود من الرطوبة. ركز.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: محور دولاب ماء (خشب بلوط)\u003c/div>\u003cdiv>الحالة: جزؤه الأوسط سليم نسبياً (حوالي 60%). طرفاه متعفنان.\u003c/div>\u003cdiv>الأطراف تحتاج إلى استبدال أو تقوية بأطواق حديدية.\u003c/div>\u003cdiv>الثقة: 79%\u003c/div>\u003cdiv>طاقة التكامل: 92%\u003c/div>\u003c/div>\u003cp>قال بصوت مسموع: «الوسط سليم. الطرفان يحتاجان إلى استبدال.»\u003c/p>\u003cp>قال أحدهم من خلفه: «والحجران تحت الطمي.»\u003c/p>\u003cp>التفت.\u003c/p>\u003cp>على حافة الجدول، جالس على صخرة مسطحة، عجوز نحيل ملتف بمعطف بلا لون، يمسك قصبة صيد طويلة، وخيطها في الماء. لم يلتفت إليهم. ولم يبدُ عليه أنه فوجئ بهم.\u003c/p>\u003cp>قال شياو دو: «العم شو.»\u003c/p>\u003cp>وأضاف الصبي: «يصطاد هنا كل يوم.»\u003c/p>\u003cp>«السمك لا يعض في هذا البرد.» قال العجوز دون أن يلتفت. «لكني أحب أن أنظر إلى الدولاب. كان جياو صديقي.»\u003c/p>\u003cp>لم يعرف أحد ما يقول. وبعد صمت، استأنف العجوز كلامه ببطء، وعيناه على الخيط:\u003c/p>\u003cp>«الطمي فوق الحجرين بمقدار ذراع. لا يحتاج إلا إلى معول وأيدٍ. الحجران لم ينكسرا.» ثم، بعد لحظة: «أنتم من يتحدثون عن مدخنة هو.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«يقولون إنها لا تدخّن.»\u003c/p>\u003cp>«لا تدخّن.»\u003c/p>\u003cp>«حسن.» لم يضف شيئاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخرجت شين يان دفترها.\u003c/p>\u003cp>كانت قد جاءت بحبل معقود كل شبر، وعود طويل، وكيس صغير من الحصى. وقفت على الضفة، ثم نظرت إلى لين.\u003c/p>\u003cp>«سأقيس الماء.»\u003c/p>\u003cp>«النظام يستطيع...»\u003c/p>\u003cp>«أعرف.» ابتسمت ابتسامة صغيرة. «لكنني أريد أن أرى كيف يتحرك.»\u003c/p>\u003cp>رمت العود في المجرى عند نقطة معينة، وبدأت تعدّ أنفاسها. واحد. اثنان. ثلاثة. وكان العود يطفو ويدور في الماء الرمادي، ببطء ثم أسرع عند الانحناء. حين وصل إلى علامة وضعتها على الضفة، أوقفت العد ودونت الرقم. ثم أعادت التجربة ثلاث مرات. ثم أنزلت الحبل المعقود في المجرى لتقيس العمق عند ثلاثة مواضع، مبللة كمّها حتى المرفق، وأصابعها زرقاء من الماء. ثم مدت الحبل بين حافتي المجرى عند الموضع الضيق. ساعدها لين من الطرف الآخر، فشدته وعدّت العقد وكتبت العرض.\u003c/p>\u003cp>سألها شياو دو: «لماذا تعدّين أنفاسك؟»\u003c/p>\u003cp>«لأنني لا أملك ساعة.»\u003c/p>\u003cp>«وما الساعة؟»\u003c/p>\u003cp>«شيء يعدّ لي الأنفاس.»\u003c/p>\u003cp>حدّق الصبي فيها كمن سمع نكتة لا يفهمها.\u003c/p>\u003cp>ثم نظرت إلى لين.\u003c/p>\u003cp>«الآن.»\u003c/p>\u003cp>ركز. استحضر الأبعاد التي قرأتها عليه، وأدخلها في التقدير. ظهرت الأرقام في زاوية عينه، فراجع العمق والعرض معها قبل أن يكمل.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تقدير الطاقة المائية — أولي]\u003c/strong>\u003c/div>\u003cdiv>سرعة التيار: 0.6 م/ث تقريباً\u003c/div>\u003cdiv>العمق عند الدولاب: 0.7 م\u003c/div>\u003cdiv>العرض: 3.2 م\u003c/div>\u003cdiv>الطاقة المتاحة بدولاب سفلي التغذية: تكفي لحجر طحن واحد (رحى قطرها 90 سم تقريباً)\u003c/div>\u003cdiv>الثقة: 68%\u003c/div>\u003cdiv>ملاحظة: القياسات اليدوية مدخلة. هامش الخطأ كبير.\u003c/div>\u003cdiv>طاقة التكامل: 85%\u003c/div>\u003c/div>\u003cp>قرأه بصوت عالٍ.\u003c/p>\u003cp>كانت شين يان قد حسبت قبله. ظهر ذلك في وجهها، في الطريقة التي أومأت بها قبل أن يكمل. أرته الدفتر: عمود من الأرقام، وفي أسفله خط ثقيل تحت رقم، وبجانبه كلمتان بلغتهما: «حجر واحد.»\u003c/p>\u003cp>«وأنا حصلت على التقدير نفسه.»\u003c/p>\u003cp>«بقلم رصاص.»\u003c/p>\u003cp>«وبدون نظام.» نظرت إليه. «هذا يعني أنه يعمل. ويعني أننا نعمل أيضاً.»\u003c/p>\u003cp>كاد يضحك. مدت إليه القلم ليضيف تقدير النظام إلى حسابها. جلست إلى جانبه هذه المرة، ولم تترك بينهما الدفتر.\u003c/p>\u003cp>مشت شين يان على الضفة بحذاء رياضي أبيض صار بلون الطين، وتوقفت عند مجرى صغير مردوم بالطمي على بعد عشرين خطوة، يمر قرب الجدار القائم. انحنت، وأزاحت الحصى بيدها، فظهر تحته حجر مسطح مصفوف بعناية.\u003c/p>\u003cp>«ليس الدولاب وحده.» نادته. «انظر. هذا حاجز قديم. بنوا حجراً على حجر ليحصروا الماء في هذا المجرى الضيق.» تتبعت الصف بإصبعها. «العم جياو كان يعرف ما يفعل. الماء يضيق هنا، فيسرع، فتقوى الدفعة على الدولاب.»\u003c/p>\u003cp>«وهل ما زال سليماً؟»\u003c/p>\u003cp>«نصفه. والنصف الآخر يحتاج إلى نقل حجارة. لا إلى بناء.» رفعت رأسها. «هذا يوفر علينا أسبوعاً.»\u003c/p>\u003cp>وقف شياو دو يحدق في الحجارة، ثم قال بدهشة صادقة: «لم أكن أعرف. كنت ألعب هنا وأنا صغير، وما كنت أعرف أن الحجارة تعني شيئاً.»\u003c/p>\u003cp>ابتسمت شين يان. «اتبع الصف. هل ترى كيف يعبر الماء من جانبه؟ لم توضع هنا مصادفة.»\u003c/p>\u003cp>قال لين: «إذن نحتاج إلى دولاب جديد، وتقوية للمحور. وأجزاء حديد.»\u003c/p>\u003cp>«كم؟»\u003c/p>\u003cp>حسبا معاً، بصوت منخفض، كل جزء. محور معدني صغير في كل طرف. وأطواق تثبت الريشات. ومسامير وأوتاد من الحديد لا من الخشب. كانت القائمة قصيرة، لكن في هذه القرية لا يوجد حديد إلا عند رجل يبيع القضيب بضعف السكة.\u003c/p>\u003cp>قالت شين يان: «تشانغ.»\u003c/p>\u003cp>«تشانغ لا يملك حديداً جيداً.»\u003c/p>\u003cp>«تشانغ يملك ما يملكه تشيان.» رفعت حاجبها. «وهذا ما يزعجني.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>سأل لين شياو دو: «لمن هذه الأرض؟»\u003c/p>\u003cp>تردد الصبي. نظر إلى العجوز الصياد، الذي ما زال جالساً على صخرته. ثم قال: «لا أعرف.»\u003c/p>\u003cp>«تعرف.»\u003c/p>\u003cp>«يقولون إن القرية.» نظر إلى قدميه. «ويقولون إن عائلة ليو. أبي كان يقول إنها كانت للعم جياو، وهو استأجرها من القرية، ثم جاء رجال ليو بعد موته وقالوا إنها لهم بصك قديم.»\u003c/p>\u003cp>«ومن يملك الصك؟»\u003c/p>\u003cp>«ليو.»\u003c/p>\u003cp>قال العجوز شو من مكانه، بصوت هادئ: «ولا أحد يعرف أين الصك. لكن لا أحد يجرؤ أن يطلبه.»\u003c/p>\u003cp>صمت لين.\u003c/p>\u003cp>كان يفهم ما يعني هذا. إن بنوا هنا، فهم يبنون على أرض متنازع عليها بين قرية ضعيفة وعائلة قوية. وإن بنوا، فسيراهم ليو. لكن إن لم يبنوا، فلا طاحونة، ولا دخل، ولا ما يدفعون به المئة وستة وأربعين.\u003c/p>\u003cp>أعاد الحساب: مئة وثمانية وخمسون، ناقص اثنتي عشرة. مئة وستة وأربعون.\u003c/p>\u003cp>نظر إلى الماء الرمادي يمر من بين الحجارة. كان المكان يصلح للعمل، لكن ليس لهم أن يدخلوا إليه بمعاولهم قبل معرفة من سيطالبهم به.\u003c/p>\u003cp>قال العجوز شو، ويداه ما زالتا على القصبة: «النهر يتجمد بعد أربعين يوماً. أو أقل.»\u003c/p>\u003cp>«أقل؟»\u003c/p>\u003cp>«هذه السنة بدأ البرد مبكراً.» رفع القصبة قليلاً وأنزلها. «في سنوات أبي، كان يتجمد في الشهر العاشر. هذه السنة أرى أنه سيكون قبله.»\u003c/p>\u003cp>لم يكن على لين أن يسأل ماذا يعني هذا. أربعون يوماً تعني أن عليهم جمع الخشب والحديد والعمال قريباً، وترك أيام لاختبار الدولاب وإصلاح ما يفشل فيه.\u003c/p>\u003cp>قالت شين يان بلغتهما، همساً: «أربعون يوماً.»\u003c/p>\u003cp>«أو أقل.»\u003c/p>\u003cp>«ولا حديد ولا إذن.»\u003c/p>\u003cp>«ولا إذن.»\u003c/p>\u003cp>نظرت إلى الدولاب المكسور، ثم إلى السماء الرمادية التي لا تعد بشيء.\u003c/p>\u003cp>قالت: «إذن نطلب الإذن أولاً. لا أنقل حجراً ثم أسمع أنه ليس لنا.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين أدار لين ظهره ليغادر، قال العجوز شو، دون أن يرفع عينيه عن الخيط:\u003c/p>\u003cp>«كان جياو يصلح هذا الحاجز كل ربيع. يقول إن الماء لا يبقى على حال، فلا تترك له حجراً مفككاً.»\u003c/p>\u003cp>توقف لين. «هل رأيت الفيضان؟»\u003c/p>\u003cp>«رأيته من فوق.» أشار العجوز إلى المرتفع خلفهم. «ناديته ليلحق بي. كان يريد تثبيت الحجر قبل أن يصعد.»\u003c/p>\u003cp>شد الخيط، فأخرج من الماء غصناً صغيراً، ونزعه عن السنارة. لم يسأله لين شيئاً آخر.\u003c/p>\u003cp>كانوا يتجهون عائدين على الطريق الترابي حين سمعوا الحوافر.\u003c/p>\u003cp>جاء الفارس من خلفهم، على حصان أسود لامع، رجل في الخمسين بمعطف ثقيل مبطن بفرو أبيض عند العنق، ووجهه نحيل صارم لا يتحرك فيه إلا عيناه. خلفه خادم على بغل يحمل لفافة. تباطأ الحصان حتى أصبح على مستوى لين، ثم توقف.\u003c/p>\u003cp>ولم يقل أحد شيئاً.\u003c/p>\u003cp>نظر الفارس إلى لين، ثم إلى شين يان، ثم إلى دفترها المرفوع في يدها، ثم إلى الاتجاه الذي جاءوا منه، نحو منعطف النهر. نظر إلى الدولاب المكسور من بعيد، بعينين لا تقولان شيئاً. وبقي هكذا زمناً طويلاً.\u003c/p>\u003cp>همس شياو دو: «وكيل ليو.»\u003c/p>\u003cp>ثم حرك الرجل لجام حصانه ببطء، ومضى دون كلمة.\u003c/p>"},{"n":9,"t":"الفصل التاسع: اتفاق بثلاثة أختام","b":"\u003cp>في اليوم الحادي عشر، أحضرت هو سانيانغ كتابها إلى الطاولة، وفتحته على صفحة مليئة بخطوط عمودية، وقالت دون مقدمة: «انظرا.»\u003c/p>\u003cp>كانت قد قسمت الصفحة إلى ثلاثة أعمدة. الأول: سلال الحطب في الشتاء الماضي. الثاني: سلال الحطب هذه الأيام. والثالث: الفرق. وتحت الأعمدة رقم واحد محاط بدائرة ثقيلة من الفحم.\u003c/p>\u003cp>«ثلث.» قالت. «أقل بقليل من الثلث، وأكثر بقليل من الربع. الموقد الجديد وحده، والآخر ما زال قديماً. ولم تأتِ قافلة جديدة بعد.»\u003c/p>\u003cp>قالت شين يان: «إذن إذا بنينا الثاني...»\u003c/p>\u003cp>«سيكون أكثر. أعرف. أنا أحسب مثلك.» أغلقت الكتاب. «والآن قولا لي ما تريدان. لا تحسّنا الكلام. أنتما لا تأتيان لتقولا شيئاً إلا وفي رأسكما طلب.»\u003c/p>\u003cp>نظر لين إلى شين يان. كانا قد تدربا على هذه الجملة في الليل، لكنها بدت الآن ثقيلة في فمه.\u003c/p>\u003cp>«نريد أن نصلح طاحونة جياو.»\u003c/p>\u003cp>رفعت هو سانيانغ حاجبها. «طاحونة جياو ماتت مع جياو.»\u003c/p>\u003cp>«الماء ما زال هناك. والحجران. والمحور سليم في وسطه.» فتحت شين يان الدفتر على الطاولة، وأدارته نحوها. «حجر واحد. لكنه يكفي. الطحن بجزء من عشرين، كما كان جياو يأخذ. بدلاً من جزء من عشرة عند ليو.»\u003c/p>\u003cp>«عشرة وعشرون.» قالت هو سانيانغ بصوت منخفض. ثم ضحكت ضحكة قصيرة بلا مرح. «أنتما مجنونان. هذه أرض ليو.»\u003c/p>\u003cp>«ليست أرض ليو.»\u003c/p>\u003cp>«ومن سيقول لهم هذا؟»\u003c/p>\u003cp>قالت شين يان: «لا أحد يعرف أين الصك. لكننا لن ندخلها بلا اتفاق مكتوب.»\u003c/p>\u003cp>«جيد. لأن الحارس لن يطلب الصك من ليو حين يطردكم منها.»\u003c/p>\u003cp>سكتت هو سانيانغ طويلاً. كان الموقد خلفها يتنفس بهدوء، وصوت الرحى اليدوية ما زال يأتي من الخارج. مسحت الطاولة بالخرقة، ثم فتحت كتابها من جديد. تتبعت سطر الحطب بإصبعها، وقلبت إلى نفقات الطعام. انتظر لين حتى رفعت عينيها عنه.\u003c/p>\u003cp>«ماذا تريدان مني؟»\u003c/p>\u003cp>«الخشب لقطع الدولاب. والطعام للعمال، عشرة رجال لثلاثة أسابيع. وأنت ترين أنني لا أملك قطعة نحاس.»\u003c/p>\u003cp>«وأنا أملك فقط ما يكفي للنزل.»\u003c/p>\u003cp>«نعم. ولهذا لا نطلب مالاً. نطلب الخشب والطعام الآن، وتستردين ثمنهما من حصتك في أجر الطحن. وما توفرينه من الحطب يساعد على النفقة حتى يبدأ العمل.»\u003c/p>\u003cp>«وماذا أحصل؟»\u003c/p>\u003cp>قال لين: «حصة في الطاحونة. جزء من عشرة من أجر الطحن، لسنوات.»\u003c/p>\u003cp>«جزءان.»\u003c/p>\u003cp>«جزء ونصف.»\u003c/p>\u003cp>«جزءان.» لم يرتفع صوتها. «أنا أضع نزلي وسمعتي أمام ليو. لو فشلتما، أنا التي ستدفع. جزءان.»\u003c/p>\u003cp>كان لين على وشك أن يتفاوض، لكن شين يان وضعت يدها على ذراعه بخفة.\u003c/p>\u003cp>«موافقة.»\u003c/p>\u003cp>وقفت هو سانيانغ، وأخذت كوب الشاي، وقالت وهي تمضي نحو الباب: «ولن أحمل الخشب بنفسي.»\u003c/p>\u003cp>لم يدرِ لين إن كانت تمزح.\u003c/p>\u003cp>وحين خرجا إلى الساحة وجدا شياو دو واقفاً وراء الباب، يتظاهر بأنه ينظف دلواً فارغاً منذ ساعة.\u003c/p>\u003cp>«سمعت.»\u003c/p>\u003cp>«كل شيء؟»\u003c/p>\u003cp>«كل شيء.» ترك الدلو من يده ووقف مستعداً للخروج معهم. «سأكون العامل الأول. سأنقل الحجارة وأحمل الخشب، ولن أطلب نحاساً.»\u003c/p>\u003cp>«ستطلب طعاماً.»\u003c/p>\u003cp>«الطعام ليس نحاساً.» ثم قلّد صوت هو سانيانغ بدقة مفزعة: «\"جزءان! لن أحمل الخشب بنفسي!\"»\u003c/p>\u003cp>التفتا خلفهما بسرعة. كان الباب مغلقاً، والمطبخ ساكناً. ضحك الصبي، ثم اعتذر، ثم ضحك.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان تشانغ يضرب قطعة حمراء حين وصلا إلى الورشة، والعرق يلمع على ذراعيه بين آثار الحروق القديمة.\u003c/p>\u003cp>لم يتوقف.\u003c/p>\u003cp>قال لين: «نريد أن نصلح طاحونة جياو.»\u003c/p>\u003cp>ضرب تشانغ ثلاث ضربات متتابعة، ثم ثلاثاً أخرى. «جياو مات.»\u003c/p>\u003cp>«سمعت.»\u003c/p>\u003cp>«غرق وهو يحاول إنقاذ الحجرين.» رفع المطرقة. «لا أريد أن أرى أحداً آخر يغرق هناك.»\u003c/p>\u003cp>«نحتاج إلى محور صغير وأطواق ومسامير.»\u003c/p>\u003cp>«عند تشيان.»\u003c/p>\u003cp>«ونريدها منك.»\u003c/p>\u003cp>هذه المرة توقفت المطرقة في الهواء. التفت، وعيناه ضيقتان.\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«لماذا؟»\u003c/p>\u003cp>«لأنني لا أصنع الحديد. أصنع من الحديد الذي يبيعونه لي. وأنت رأيت ماذا يبيعون.»\u003c/p>\u003cp>«رأيته.» اقترب لين خطوة. «وأعرف أنك تعرف أنه رديء. حديدي سيئ، لا تسألني لماذا. هذا ما قلته.»\u003c/p>\u003cp>لم يرد الحداد.\u003c/p>\u003cp>«أنا أسألك الآن.»\u003c/p>\u003cp>صمت. ثم قال تشانغ بصوت منخفض خشن: «ولماذا أخبرك؟»\u003c/p>\u003cp>«لا تخبرني. أنا من سيخبرك.»\u003c/p>\u003cp>رفع تشانغ حاجبه.\u003c/p>\u003cp>«حين يأتي الحديد، سأفحصه أمامك. وأريك ما فيه وأين يضعف. ولن تكون بحاجة إلى أن تصدقني. ستراه بعينيك.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«كما رأيت المنفاخ.»\u003c/p>\u003cp>قبض تشانغ على المطرقة. مسح بإبهامه أثر حرق على مقبض المطرقة، ثم نظر إلى القضبان المكدسة عند الجدار.\u003c/p>\u003cp>«وأحصل على ماذا؟»\u003c/p>\u003cp>قالت شين يان: «جزء من عشرة من أجر الطحن. وتصنع بنفسك كل ما تحتاجه الطاحونة من حديد في السنوات القادمة. بسعر عادل.»\u003c/p>\u003cp>«سعر عادل.» كرر تشانغ ببطء. «ومن يقرر ما هو عادل؟»\u003c/p>\u003cp>«أنت.»\u003c/p>\u003cp>نظر إليها. لم يكن أحد قد قال له ذلك على الأرجح منذ سنوات طويلة.\u003c/p>\u003cp>عاد إلى النار، وأخرج القطعة الحمراء، وضربها مرة واحدة.\u003c/p>\u003cp>«جرّب.»\u003c/p>\u003cp>لم يكن لين متأكداً إن كان يقصد: جرّبوا أنتم، أم جرّب أنا. لكنه فهم أنها موافقة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في ظهر اليوم الثالث عشر، جاء رسول وكيل ليو. كان لين وشين يان قد أمضيا اليومين السابقين يسألان عن الخشب والرجال، ووصلهما الآن طلب الحضور الذي كانا ينتظرانه.\u003c/p>\u003cp>لم يكن هذا غريباً. فمنذ أن رأى الوكيل الدولاب المكسور من فوق حصانه، كان لين يعرف أن الأمر لن يمر دون كلمة. جاء رجل شاب بمعطف أخضر إلى النزل وقال، بنبرة من لا ينتظر جواباً: «السيد يريد أصحاب الشراكة جميعاً: الغريبين، والست هو، والحداد.»\u003c/p>\u003cp>خرجا مع الرسول من النزل، وسلكوا الطريق الشرقي حتى آخر البيوت. هناك صعدوا تلاً قصيراً إلى بيت عائلة ليو، الذي يطل من وراء جداره على الحقول والطريق.\u003c/p>\u003cp>لم يكن لين قد رأى بيتاً كهذا منذ وصل. جدران عالية من الحجر المنحوت وقرميد أسود لامع، وبوابة خشبية ضخمة مزدانة بمسامير نحاسية، وعلى جانبيها أسدان حجريان. وفي الساحة الداخلية بركة صغيرة، حوافها مرصوفة، وفيها سمك أحمر يسبح تحت الجليد الرقيق. وخدم كثيرون، يمشون بخطوات هادئة في رواقات مسقوفة، يحملون صواني، ويخفضون رؤوسهم.\u003c/p>\u003cp>وجدا هو سانيانغ وتشانغ ينتظران عند البوابة.\u003c/p>\u003cp>كانت هو سانيانغ قد لبست سترتها الزرقاء الجيدة، وسرّحت شعرها بدبوس جديد، ووقفت منتصبة، لا تسند ظهرها إلى البوابة. أما تشانغ فجاء كما هو، بثيابه السوداء من السخام وذراعيه العاريتين رغم البرد، ينظر من الأسدين إلى المسامير اللامعة في خشب البوابة.\u003c/p>\u003cp>همس: «مسامير نحاس. ليست حديداً.»\u003c/p>\u003cp>«لا تقل هذا أمامهم.»\u003c/p>\u003cp>«قلته لك أنت.»\u003c/p>\u003cp>همست شين يان: «حتى ممر الخدم مسقوف.»\u003c/p>\u003cp>نظر لين إلى نعالهما الموحلة. «ونحن سنترك فيه أثراً حتى الباب.»\u003c/p>\u003cp>«فليمسحوه. لا تنحنِ وأنت تمشي.»\u003c/p>\u003cp>قادهم الشاب إلى غرفة واسعة دافئة ببخور خفيف، حيث جلس الوكيل، الرجل نفسه الذي رأوه على الحصان، خلف طاولة منخفضة من خشب داكن. على الطاولة كوب وإبريق وكتاب مفتوح. ولم ينهض.\u003c/p>\u003cp>قال: «تفضلوا.»\u003c/p>\u003cp>جلست هو سانيانغ على طرف الوسادة، وأبقت ركبتيها متقاربتين. أما تشانغ فرفض الجلوس، ووقف قرب الباب وذراعاه مطويتان، ولم يطلب منه الوكيل ذلك مرة ثانية. وجلس لين على الوسادة المقابلة، وجلست شين يان بجواره، ووضعت يدها على بطنها، فلاحظ الوكيل ذلك بنظرة سريعة دون أن يعلق.\u003c/p>\u003cp>قال: «أنت وزوجتك من يسمونكما الغريبين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«سمعت أنكما تريدان استئجار أرض.»\u003c/p>\u003cp>«منعطف النهر.»\u003c/p>\u003cp>«أرض عائلة ليو.»\u003c/p>\u003cp>لم يقل لين شيئاً. كان قد قرر أن يترك الوكيل يأخذ الجملة إلى حيث يريد.\u003c/p>\u003cp>«لماذا تريدان طاحونة؟» سأل الوكيل ببطء. «هناك طاحونة. عند النهر الكبير. تعمل منذ عشرين عاماً.»\u003c/p>\u003cp>«تأخذ عُشراً.»\u003c/p>\u003cp>«هذا أجر عادل.»\u003c/p>\u003cp>«ونحن سنأخذ جزءاً من عشرين.»\u003c/p>\u003cp>ابتسم الوكيل. ابتسامة صغيرة هادئة، فيها شفقة. «تفلسان في موسمين. نصف الأجر، والصيانة لا تنقص إلى النصف. من يدفع ثمن محور جديد إن انكسر؟»\u003c/p>\u003cp>«ربما.»\u003c/p>\u003cp>«وحين تتوقفان عن دفع الإيجار، تعود الطاحونة إلى ليو، بدولاب جديد وحجرين نظيفين ومحور سليم.» رفع كوبه. «لا مانع عندي.»\u003c/p>\u003cp>كانت هذه هي الجملة التي انتظرها لين. نظر إلى شين يان. كانت مطرقة قليلاً، عيناها على الطاولة، وجهها بلا تعبير.\u003c/p>\u003cp>قال الوكيل: «الإيجار اثنا عشر كيساً من الدخن عند الحصاد. وشرط واحد: لا تبنيا جداراً ولا تحفرا قناة جديدة دون إذن.»\u003c/p>\u003cp>«موافقان.»\u003c/p>\u003cp>«والأرض والبناء في الأخير لعائلة ليو. كما هو الحال دائماً.»\u003c/p>\u003cp>رفعت شين يان رأسها.\u003c/p>\u003cp>«سيدي الوكيل.» كان صوتها هادئاً جداً، ومهذباً، بلهجتها الخفيفة. «أنا لا أقرأ بعد. هل لي أن أطلب أن يُقرأ لي ما يُكتب؟»\u003c/p>\u003cp>نظر إليها الوكيل. «بالطبع.»\u003c/p>\u003cp>أشار إلى كاتب جالس في الزاوية لم ينتبه لين لوجوده. جاء الشاب بفرشاة وورقة، وبدأ يكتب بعد أن أملى عليه الوكيل البنود بصوت رتيب، وقرأه عليها بعدها بنبرة مملة.\u003c/p>\u003cp>حين انتهى، قالت: «أريد أن أضيف بنداً.»\u003c/p>\u003cp>«أي بند؟»\u003c/p>\u003cp>«ما يُصلح أو يُبنى على الأرض يبقى بيد المستأجرين ثلاث سنوات، ولا يُسترد قبلها إلا بدفع ثمنه.»\u003c/p>\u003cp>ساد صمت.\u003c/p>\u003cp>ثم ضحك الوكيل. ضحك طويلاً، صافياً، بصدق، كمن سمع نكتة. «أنتما حقاً غريبان.»\u003c/p>\u003cp>«هل هذا رفض؟»\u003c/p>\u003cp>«لا.» مسح عينيه بإصبعه. «أقبله. ثلاث سنوات، ما دمتم تدفعون الإيجار ولا تخالفون ما اتفقنا عليه. أما إن اشتغلتم ثلاثة أشهر فسنرى.» أشار إلى الكاتب. «اكتب.»\u003c/p>\u003cp>كتب الكاتب. وقرأ على شين يان البند مرتين. مرة بصوت عادي، ومرة ببطء أكثر. سألته عن كلمة واحدة، فشرحها. ثم أومأت.\u003c/p>\u003cp>طلبت شين يان أن يعيد القراءة من أول الورقة حتى آخرها. لم تتعجل، على الرغم من أن الوكيل وضع كوبه مرتين قبل أن تنتهي. وحين سمعت بند السنوات الثلاث مرة أخرى، قالت: «الآن نوقّع.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقعوا بثلاثة أختام.\u003c/p>\u003cp>ختم الوكيل، حجر أحمر في مربع نحاسي، ضغطه على الورقة بقوة. وختم هو سانيانغ، صغير مستدير من العظم، أخرجته من كمها وضغطته على الحبر بإبهام صلب. وختم تشانغ، قطعة حديد مصقولة نقش عليها حرف واحد، وضعها على الورقة بلمسة حذرة كمن يضع مطرقته على سندان ثمين.\u003c/p>\u003cp>أما لين فلم يكن عنده ختم.\u003c/p>\u003cp>مد الكاتب إليه الحبر الأسود. «يكفي بصمة.»\u003c/p>\u003cp>وضع لين إصبعه على الحبر ثم على الورقة، بجانب الأختام الثلاثة. رفع إصبعه، فبقيت بصمة خشنة بجانب الأختام. انتظر الكاتب حتى جف الحبر قبل أن يطوي الورقة.\u003c/p>\u003cp>وفي زاوية عينه ظهرت الحروف الزرقاء.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[هدف اختياري]\u003c/strong>\u003c/div>\u003cdiv>أول أصل منتج: شغّل الطاحونة قبل تجمد النهر\u003c/div>\u003cdiv>المكافأة: التخطيط الصناعي — المستوى 1\u003c/div>\u003cdiv>هذا الهدف اختياري. لا توجد عقوبة على تجاهله.\u003c/div>\u003c/div>\u003cp>لم يقل لأحد. عرف أن شين يان ستسأله لاحقاً، وأنه سيقول لها الرقم والكلمات كلها، دون أن يحذف شيئاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>مشوا عائدين في الغسق الأزرق، الأربعة، في صف غير منتظم على الطريق المتجمد. لم يتكلم أحد حتى ابتعدوا عن البوابة بما يكفي ليختفي الأسدان الحجريان خلف المنعطف.\u003c/p>\u003cp>ثم قالت هو سانيانغ، دون أن تلتفت إلى أحد: «البند.»\u003c/p>\u003cp>قالت شين يان: «ماذا به؟»\u003c/p>\u003cp>«لماذا وضعتِه؟»\u003c/p>\u003cp>«لأن الوكيل مقتنع أننا سنفشل.» مشت خطوتين. «والرجل المقتنع بأن غيره سيفشل يوقع على أي شيء. وإذا نجحنا، فسيرى غداً أن الدولاب والحاجز والمحور صارت قيمتها أكبر من قيمة الأرض، ويريد استردادها. والبند يقول: ادفع ثمنها أولاً.»\u003c/p>\u003cp>«وما ثمنها؟»\u003c/p>\u003cp>«ثمن ما وضعناه فيها. نسجل الخشب والحديد والعمل، ونحتفظ بحسابها. البند وحده لا يكفي إن لم نعرف بماذا نطالب.»\u003c/p>\u003cp>سكتت هو سانيانغ طويلاً. ثم أخرجت من كمها الختم العظمي الصغير وقلبته في يدها.\u003c/p>\u003cp>«قال لي زوجي الراحل ذات مرة: الذي لا يقرأ، يوقع. والذي يقرأ، يسأل. والذي يسأل، يكتب البند.»\u003c/p>\u003cp>قال تشانغ بصوته الخشن، وهو ينظر إلى الطريق: «ما قاله جيد.»\u003c/p>\u003cp>ردت هو سانيانغ الختم إلى كمها، وأسرعت لتلحق بشين يان.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الليل، في المخزن، أضاءت الشمعة قليلاً، وجلست شين يان على القش ويدها على بطنها.\u003c/p>\u003cp>قال لين: «الهدف. اختياري. التخطيط الصناعي، المستوى الأول.»\u003c/p>\u003cp>«قبل أن يتجمد النهر.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ولا عقوبة.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«وتريد أن تحاول بكل قوتك رغم ذلك.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«لماذا؟»\u003c/p>\u003cp>فكر لين. «لأن التخطيط الصناعي يعني أن أرى العمل كله على لوحة واحدة، فلا أضيع في التفاصيل. ولأن كل ما سنحتاجه بعد هذه الطاحونة، من حديد وعمال وورشة، سيحتاج إلى ما يحتاجه هذا.»\u003c/p>\u003cp>«هذا سبب.»\u003c/p>\u003cp>«وسبب آخر.»\u003c/p>\u003cp>«أي سبب؟»\u003c/p>\u003cp>«أن النهر سيتجمد.»\u003c/p>\u003cp>نظرت إليه. «هذا ليس سبباً. هذا موعد.»\u003c/p>\u003cp>ابتسمت. ثم، دون مقدمة، أمسكت يده، ووضعتها على بطنها، تحت السترة الثقيلة.\u003c/p>\u003cp>«ماذا...»\u003c/p>\u003cp>«اصمت.»\u003c/p>\u003cp>كان البطن دافئاً، مسطحاً، تحت راحته المتشققة. لا شيء. لا نبضة ولا حركة. فقط حرارتها، وأنفاسها المنتظمة.\u003c/p>\u003cp>«لا شيء.»\u003c/p>\u003cp>«مبكر.» همست. «قالت لي هو سانيانغ إنه مبكر.»\u003c/p>\u003cp>«لماذا تضعين يدي إذن؟»\u003c/p>\u003cp>«لأنني أريد أن...»\u003c/p>\u003cp>توقفت.\u003c/p>\u003cp>أحس تحت يده بشيء خفيف. انتظر من غير أن يحرك كفه، لكنه لم يتكرر. ربما نبض شين يان، أو حركة يدها تحت يده.\u003c/p>\u003cp>رفعا رأسيهما معاً ونظرا إلى بعضهما.\u003c/p>\u003cp>ثم ضحكا. ضحكة قصيرة مكتومة، خشية أن يسمعهما أحد، كطفلين.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وفي بلدة بعيدة، تحت ضوء مصباح زيت، غمس رجل نحيل بمعطف أزرق فرشاته في الحبر وفتح دفتراً صغيراً بغلاف جلدي بلا عنوان. كتب فيه سطراً واحداً بخط أنيق:\u003c/p>\u003cp>«النازحان اللذان لا يشبهان النازحين.»\u003c/p>"},{"n":10,"t":"الفصل العاشر: خشب الدولاب","b":"\u003cp>في اليوم العاشر من العمل، خرج آخر حمل من الطمي من أرض الطاحونة، وانكشف الحجران أخيراً.\u003c/p>\u003cp>وقف لين على حافة الحفرة ينظر إليهما. كانا مستديرين، رماديين، فيهما نقش حلزوني قديم أكله الماء، وأحدهما يحمل شقاً قصيراً لا يؤثر في العمل. بقي الطمي في أخاديدهما، فتناوب رجلان على كشطه بعصوين خشبيتين. كانت الريح تحمل رائحة الطين الرطب المقلوب، وفي فمه طعم معدني بارد، وتحت كفيه المتورمتين رعشة خفيفة من الإرهاق لا يريد أن يعترف بها أمام الرجال.\u003c/p>\u003cp>كان عند الحفرة رجال، يصعد بعضهم منها على سلم من جذوع، وجباههم تلمع بالعرق رغم أن الهواء يلسع. والمعاول مكدسة على الضفة، وعلى صخرة قرب الجدول جلست شين يان أمام لوح خشبي رتبت عليه عيداناً صغيرة، لكل عامل عود.\u003c/p>\u003cp>«ثلاثة عشر عوداً.» قالت دون أن ترفع رأسها. «أين الرجل الذي قال إنه سيأتي اليوم؟»\u003c/p>\u003cp>«يشتكي من بطنه.»\u003c/p>\u003cp>«قبل ساعة؟»\u003c/p>\u003cp>«ربما هو مريض فعلاً.»\u003c/p>\u003cp>حرّكت عوداً إلى الخارج من الصف. «سنراه عند الظهر.»\u003c/p>\u003cp>كان هذا نظامها. أعواد وصفوف وخطوط بالفحم على اللوح، وكل رجل يأتي في الفجر يأخذ عوداً من كوم على الصخرة ويضعه في صف العمل، وحين يمضي يعيده. لا يحتاج أحد إلى أن يقرأ. من لم يضع عوده لم يعمل، ولا طحن مجاني في الشتاء لمن لا عود له.\u003c/p>\u003cp>كانت الأيام العشرة قد علّمت لين أشياء لم تعلمها له جامعة.\u003c/p>\u003cp>علّمته أن عشرة رجال يختلفون عن ثلاثة. أن من يقف في الأسفل لا يسمع من يقف في الأعلى. أن الرجل الذي يحمل حجراً ثقيلاً لا يسمع الأوامر. وأن الأمر الواضح في الرأس يصير غامضاً حين يخرج من الفم. في اليوم الأول كاد ينهار الجدار القائم لأنه قال «ارفعوا» من غير أن يقول متى. وفي اليوم الثالث ضاع نصف نهار لأنه وزّع العمل حسب قوة الأجساد، فتعب الأقوياء وتركوا العمل، وانتظر الضعفاء من يحمل لهم.\u003c/p>\u003cp>رفع صوته لينادي رجال الحفرة، ثم انتظر حتى وضعوا حملهم. تعلم هذه المرة أن ينتظر قبل أن يشرح ما يريده.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حدث الشجار في الصباح.\u003c/p>\u003cp>كان رجلان يحملان جذع بلوط من الضفة إلى مكان النشر: لاو دونغ، رجل قصير عريض يشبه برميلاً، وتشيو، شاب نحيف سريع الغضب. سقط الجذع بينهما فجأة بعد أن أفلت أحدهما، وانزلقت يد تشيو تحته، وصرخ.\u003c/p>\u003cp>لم يتضح من الذي أفلت. صرخ لاو دونغ: «أنت من تركته!» وصرخ تشيو: «لأنك لا تعرف أن تمشي في الخطوة!» ثم رمى الشاب القبعة على الأرض ودفع لاو دونغ بصدره.\u003c/p>\u003cp>كان لين على بعد عشرين خطوة. اندفع نحوهما، لكن حين وصل كان الرجلان يتصارعان على الأرض ويتدحرجان، والعمال الآخرون يتجمعون حولهما بشغف من يرى وجبة مجانية.\u003c/p>\u003cp>صاح: «توقفا!»\u003c/p>\u003cp>ضاعت صرخته وسط صياح الرجلين، ولم يلتفت إليه المتفرجون.\u003c/p>\u003cp>حاول أن يفصل بينهما بيديه فصدمه كوع في خده. تراجع، يتحسس الجرح. ثم رأى شياو دو يركض نحو الجدول بدلو، ويعود، ويفرغه على الاثنين دفعة واحدة. صرخ لاو دونغ من البرد، وصرخ تشيو، وانفصلا كأن أحداً ضربهما بمطرقة.\u003c/p>\u003cp>قال الصبي بتواضع: «العمة تفعل هذا مع الكلاب.»\u003c/p>\u003cp>نظر لين إلى الرجلين اللذين يرتجفان على الأرض، مبللين من الرأس إلى القدمين، ثم إلى العمال الواقفين حولهما. تردد. ماذا يفعل؟ يعاقب أحدهما؟ يطردهما؟ كان يعرف أن أي قرار الآن ستراقبه عيون كثيرة.\u003c/p>\u003cp>قال: «من أفلت الجذع؟»\u003c/p>\u003cp>سكت الجميع.\u003c/p>\u003cp>«لن أعاقب أحداً. أريد أن أعرف فقط.»\u003c/p>\u003cp>رفع تشيو يده المصابة ببطء. «أنا.» ثم أضاف بمرارة: «لكن لأنه لا يمشي بالخطوة. خطوته أقصر من خطوتي، والجذع يشدني إلى أسفل. صرخت كي يتوقف فلم يتوقف.»\u003c/p>\u003cp>صمت لين لحظة.\u003c/p>\u003cp>كان على حق. رجل طويل وآخر قصير يحملان حملاً واحداً، فيميل الحمل نحو القصير. فكرة بسيطة، كان يجب أن يراها بنفسه.\u003c/p>\u003cp>قال: «بعد اليوم، يحمل كل جذع رجلان متقاربان في الطول. شين يان، سجلي هذا.»\u003c/p>\u003cp>رفعت يدها من عند الصخرة وقالت: «سمعت.» وكتبت. ثم أشارت إلى النار ليذهب الرجلان ويجففا ثيابهما قبل العودة إلى العمل.\u003c/p>\u003cp>لم يهدأ الأمر تماماً. كان لاو دونغ يلعن بصوت منخفض، وتشيو يحدق في الأرض، لكنهما عادا إلى الجذع، كلٌّ مع رجل آخر. ولاحظ لين أن العمال تبادلوا نظرات، وأن أحدهم، وهو يمر، ربت على كتفه بخفة، ثم مضى كأنه لم يفعل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أما العجوز يانغ فكان قصة أخرى.\u003c/p>\u003cp>كان في السبعين، نحيلاً ظهره مقوس، لكن يداه كالجذور. يعرف الشجر منذ كان طفلاً، ويعرف مواضع البلوط الجيد في هذا الوادي. لم يأتِ للعمل. جاء ليراقب. جلس على جذع قرب النشارة منذ اليوم الثاني، وذراعاه على ركبتيه، وعيناه الصغيرتان تتبعان كل جذع يُنشر.\u003c/p>\u003cp>في ذلك الصباح، تقدم لين نحو الجذع المنشور، وقال لتشيو وهو يشير بإصبعه: «اقطعه هنا. على هذا الخط.»\u003c/p>\u003cp>قال العجوز يانغ من مكانه: «لا.»\u003c/p>\u003cp>التفت لين.\u003c/p>\u003cp>«ليس هنا.»\u003c/p>\u003cp>«حسبت الخط. الجذع يعطي أطول لوح هنا...»\u003c/p>\u003cp>«يعطي أطول لوح، وأضعفه.» لم يتحرك العجوز. «انظر إلى عقدة الخشب. هنا، وهنا. إن قطعتها على خطك، تخرج العقدة في منتصف اللوح. وأي لوح تخرج العقدة في منتصفه ينكسر عند أول دفعة ماء.»\u003c/p>\u003cp>نظر لين إلى الجذع. لم يكن يرى العقدة. ركز.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: جذع بلوط محلي\u003c/div>\u003cdiv>العقدة: تقع عند 40 سم من الطرف السفلي، قطرها 6 سم\u003c/div>\u003cdiv>الخط المقترح يمر بالعقدة: يضعف اللوح الناتج بنسبة قد تصل إلى 35%\u003c/div>\u003cdiv>الثقة: 71%\u003c/div>\u003cdiv>ملاحظة: تقدير مبني على قوانين عامة لتوزيع الإجهاد في الأخشاب. لا بيانات محلية لهذا النوع.\u003c/div>\u003cdiv>طاقة التكامل: 88%\u003c/div>\u003c/div>\u003cp>كان النظام يقول الشيء نفسه، لكن بثقة أقل مما قاله الرجل العجوز.\u003c/p>\u003cp>قال لين: «معك حق.»\u003c/p>\u003cp>لم يتغير وجه العجوز. «بالطبع.»\u003c/p>\u003cp>«ما الخط الصحيح؟»\u003c/p>\u003cp>«لا يوجد خط صحيح.» ضحك العجوز بجفاف. «يوجد أقل ضرراً. هنا.» أشار بعصا من حطب. «بعد العقدة بإصبعين. ويخرج لوح أقصر، لكنه سليم.»\u003c/p>\u003cp>«لكننا نحتاج إلى لوح طويل للريشات.»\u003c/p>\u003cp>«إذن اجمع لوحين.»\u003c/p>\u003cp>«أجمع؟»\u003c/p>\u003cp>«بمسمار خشب وقفل. كما كان جياو يفعل.» نظر إليه العجوز ببرود. «هل تريد لوحاً طويلاً، أم لوحاً يبقى بعد أول يوم؟»\u003c/p>\u003cp>لم يعرف لين ما يقول. ثم قال: «لا أعرف كيف كان جياو يفعل.»\u003c/p>\u003cp>«سأريك.»\u003c/p>\u003cp>قام العجوز يانغ ببطء، يسند يده على ركبته، وأخذ أدوات من كيسه: إزميلاً صغيراً ومطرقة خشبية وقطعة خيط مبلل. وفي نصف ساعة، قطع نتوءاً متداخلاً في طرفي لوحين وركّب أحدهما في الآخر بدقة غريبة، ثم دقّ وتداً من خشب جاف، ومرر يده على الوصلة.\u003c/p>\u003cp>لم يتحرك أحد اللوحين حين شد لين الآخر.\u003c/p>\u003cp>لم يقل لين شيئاً. مرر أصابعه على الوصلة، ثم قلب اللوحين ليرى موضع الوتد من الجانب الآخر. فهم كيف يقاوم التداخل شد الماء. لكن قطع الخشب بهذه الدقة يحتاج إلى يد العجوز، لا إلى رسم على ورقة.\u003c/p>\u003cp>قال: «شكراً.»\u003c/p>\u003cp>«أنا لا أعمل لك.» ردّ العجوز وهو يعود إلى جذعه. «أنا أصحح أخطاء الأولاد.»\u003c/p>\u003cp>وبقي هناك، يعلّم شياو دو كيف يميّز البلوط الجاف من الرطب بصوت الضرب عليه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وصلت هو سانيانغ عند الظهيرة تحمل سلة ضخمة على ذراعها، ويتبعها صبي يحمل قدراً.\u003c/p>\u003cp>وضعت السلة على الصخرة، وبدأت توزع الخبز واللحم المقدد والبصل المخلل على العمال، رجلاً رجلاً، دون أن تقول كلمة. وكل واحد منهم يمد يده بصمت، ويأخذ، ويبتعد خطوات ليأكل.\u003c/p>\u003cp>قدّمت لشين يان وعاءً، فيه مرق ساخن وقطعة لحم. نظرت شين يان إليها.\u003c/p>\u003cp>«أنا لا أحب الدسم الآن.»\u003c/p>\u003cp>«تأكلين.»\u003c/p>\u003cp>«لا...»\u003c/p>\u003cp>«تأكلين.» لم ترفع هو سانيانغ صوتها. «كل يوم تقول لي لا أحب، وفي اليوم التالي تفرغين الوعاء. هذا الذي في بطنك لا يعرف أنك لا تحبين.»\u003c/p>\u003cp>فتحت شين يان فمها لترد، ثم أغلقته. وأخذت الوعاء.\u003c/p>\u003cp>بعد أن أنهى الجميع أكلهم، دعت هو سانيانغ لين بإصبعها، وابتعدت به إلى حافة الجدول حيث لا يسمعهما أحد.\u003c/p>\u003cp>كان في يدها كتاب الحسابات.\u003c/p>\u003cp>«انتهى القياس.»\u003c/p>\u003cp>«أي قياس؟»\u003c/p>\u003cp>«قياس الاتفاق.» فتحت الكتاب على صفحة. «الموقد المعدل ضد الموقد القديم. عشرة أيام متتالية. أنا أعدّ بنفسي كل سلة.»\u003c/p>\u003cp>انتظر لين. كان قلبه يخفق أسرع مما ينبغي.\u003c/p>\u003cp>«أقل بنحو الثلث.»\u003c/p>\u003cp>لم يقل شيئاً.\u003c/p>\u003cp>«ثلث.» كررت. «ليس ما قلتماه، خمسة وعشرين، ولا الثلاثون. قريب من الثلث في مجموع الأيام العشرة. حسبت الحطب كله، لا أفضل يوم عندكما.» أغلقت الكتاب. «إذن أنتما باقيان حتى الربيع. هذا ما اتفقنا عليه.»\u003c/p>\u003cp>لم تبتسم. كانت عيناها على النهر.\u003c/p>\u003cp>قال لين: «شكراً.»\u003c/p>\u003cp>«لا تشكرني.» ثم أضافت بصوت منخفض: «لقد عشت عشرين شتاءً في هذا النزل، ولم يحدث أن توفر لي شيء. عشرون شتاءً.» هزت رأسها. «لا أعرف ماذا أفعل بشيء يتوفر.»\u003c/p>\u003cp>ثم مضت إلى السلة، وقالت للعمال بصوت قاسٍ: «من لم يأكل فليأكل. لن أعود مرة ثانية.»\u003c/p>\u003cp>والتقت عيناه بعيني شين يان من بعيد. رفعت حاجبها قليلاً، ولم تقل شيئاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بعد انصراف هو سانيانغ، تقدم إلى الضفة صف من الرجال يحمل كل منهم حزمة من الأوتاد الخشبية لتثبيت الحاجز. كان بعد الحزم حزمة أكبر وحدها، ملقاة قرب الصخرة المسطحة.\u003c/p>\u003cp>مدت شين يان يدها إليها.\u003c/p>\u003cp>لم يرها لين إلا حين رفعتها فعلاً عن الأرض، وانحنى ظهرها قليلاً تحت وزنها. كان بينهما عشر خطوات. قطعها في ثلاث.\u003c/p>\u003cp>«ضعيها.»\u003c/p>\u003cp>«إنها حزمة أوتاد.»\u003c/p>\u003cp>«ضعيها.»\u003c/p>\u003cp>«ليست ثقيلة.»\u003c/p>\u003cp>«أعطيني إياها. أنقلها ثم أعود.»\u003c/p>\u003cp>مدت إليه الحزمة، وأبقت يدها تحتها حتى أمسكها. أخذها لين. كان فيها وزن أكثر مما قالت.\u003c/p>\u003cp>«كان بيدي أن أحملها.»\u003c/p>\u003cp>«كان يمكن أن تنادي أحد الرجال.»\u003c/p>\u003cp>«كان يمكنك أن تطلبها، لا أن تأمرني أمامهم.»\u003c/p>\u003cp>«نعم. رفعتها ورأيتك تنحنين تحتها.»\u003c/p>\u003cp>لم يقل أحد شيئاً. العمال حولهما انشغلوا فجأة بأدواتهم. ثم قالت شين يان، بصوت بارد جداً، وهي تعود إلى صخرتها: «أنا لست مريضة يا لين. أنا حامل.»\u003c/p>\u003cp>«أعرف. لكن الحزمة أثقل مما تقولين.»\u003c/p>\u003cp>«لا. أنت تعرف ما يمكن أن يحدث.»\u003c/p>\u003cp>ولم يكن عنده ما يرد به. عاد إلى الحزمة وحملها إلى الجدول، ودق الأوتاد بيديه المتشققتين، وبقي ظهره إليها حتى انصرف العمال.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في المساء، حين غاب الرجال ولم يبقَ على الضفة إلا لين وشين يان وشياو دو، جلسوا على الصخرة المسطحة، والشفق الرمادي يلف الماء.\u003c/p>\u003cp>قال لين وهو يبعد النشارة عن مقعدها: «كان علي أن أخفض صوتي.»\u003c/p>\u003cp>جلست شين يان. «وأن تسأل قبل أن تأمر.»\u003c/p>\u003cp>«في المرة القادمة أسأل.»\u003c/p>\u003cp>«وأنا أناديك إن كان الحمل ثقيلاً.»\u003c/p>\u003cp>دفعت الدفتر بينهما، وبقيت أصابعها عند طرفه حتى أمسكه. ثم فتحاه على رسم الدولاب.\u003c/p>\u003cp>استدعى لين الأداة الجديدة.\u003c/p>\u003cp>ظهرت أمامه اللوحة البيضاء، خطوط رمادية خفيفة ونقاط، وفي وسطها صورة بسيطة لدولاب: عمود في الوسط، وريشات، وإطار. ثم بدأ يملأ الخطوات، بقوله وبتفكيره: قطر الدولاب، وعدد الريشات، وأطوالها، والأجزاء الحديدية. ورسم النظام الباقي: مخطط خطي نظيف، بلا ظلال ولا تفاصيل.\u003c/p>\u003cp>قال: «ثماني عشرة ريشة، وقطر ثلاثة أمتار. سأرسمه لك على الأرض بالعصا.»\u003c/p>\u003cp>لكن شين يان كانت قد التقطت الدفتر، وعيناها على الرسم الذي يصفه.\u003c/p>\u003cp>قالت: «خشب البلوط هنا أضعف.»\u003c/p>\u003cp>«حسب العجوز يانغ، نعم. الألواح المركبة.»\u003c/p>\u003cp>«نعم، وهذا يعني أن الريشات الطويلة ستنثني تحت الماء. حسابك للريشات صحيح لخشب أقوى.» سحبت العصا من يده، وخطت على التراب. «انظر. إن قصّرنا كل ريشة ثلاثة أصابع، وزدنا العدد من ثماني عشرة إلى أربع وعشرين، يتوزع الحمل على ريشات أكثر. نخسر قليلاً من الدفعة، ونكسب عمراً أطول.»\u003c/p>\u003cp>حدق لين في الخطوط على التراب. تتبع بالقلم موضع الوصلة في الريشة الطويلة. تقصيرها سيبعد الوصلة عن أشد مواضع الضغط، وزيادة العدد توزع دفعات الماء على أجزاء أكثر.\u003c/p>\u003cp>كتب التعديل في اللوحة. استقرت الأرقام الجديدة في أماكنها بهدوء.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[أداة التخطيط البسيط]\u003c/strong>\u003c/div>\u003cdiv>تم قبول التعديل اليدوي: عدد الريشات 24، الطول المخفض.\u003c/div>\u003cdiv>الحديد المطلوب: محور معدني ×2، أطواق ×4، مسامير ×60\u003c/div>\u003cdiv>المدة التقديرية للتجميع: 9 أيام\u003c/div>\u003c/div>\u003cp>قرأ لين السطر الأخير مرتين.\u003c/p>\u003cp>تسعة أيام. وكانت الأيام التي تفصلهم عن تجمد النهر تتناقص كل مساء، وتذكر قول العجوز شو: أربعون يوماً من يوم زيارتهم الأولى، أو أقل. مضى منها ما يكفي لتنظيف المكان، وما زال الحديد خارج أيديهم.\u003c/p>\u003cp>نظر إلى الحديد.\u003c/p>\u003cp>قالت شين يان، كأنها تقرأ فكرته: «أطواق. أربعة.»\u003c/p>\u003cp>«ومحوران.»\u003c/p>\u003cp>«وستين مسماراً.»\u003c/p>\u003cp>«من تشانغ.»\u003c/p>\u003cp>«وتشانغ ليس عنده حديد.» رفعت عينيها إلى الدولاب الذي رسمته العصا على التراب. «الحديد الذي يبيعه تشيان.»\u003c/p>\u003cp>مدت يدها في العتمة، ووضعت قطعة من الخبز في كفه دون أن تنظر إليه، ثم عادت إلى الرسم على التراب.\u003c/p>\u003cp>كان الظلام قد هبط. وأخذ الصبي يجمع الأعواد من على اللوح ويعدها ببطء، وهو يهمهم لحناً من الأعراس، ثم دسّها في الكيس وأحكم ربطه. ستعود إلى الصف صباحاً، ومع كل عود وعد بطحن لم يدُر له حجر بعد.\u003c/p>"},{"n":11,"t":"الفصل الحادي عشر: الحديد المغشوش","b":"\u003cp>في صباح اليوم السابع والعشرين، خرج لين مع تشانغ إلى السوق ليسألا عن الحديد. مرّ يومان على رسالة التأجيل الأولى التي حملها خادم تشيان إلى الورشة. قال فيها إن سبعة وعشرين قضيباً وصلت من أصل مئتين، وإن الباقي عالق على طريق النهر بسبب المطر. طلب ثلاثة أيام أو أربعة، واعتذر عن التأخير.\u003c/p>\u003cp>كان التاجر قد طلب ثلاثة أيام أو أربعة، لكن العمل ينتظر، ولم يعد تشانغ يريد وعداً ينقله خادم. عبر الرجلان الساحة بين حاملي الحبوب، واتجها إلى مخزن الحديد عند طرف السوق.\u003c/p>\u003cp>كان تشيان في مكانه المعتاد خلف الطاولة، يلبس معطفه الأسود المصقول ويبتسم للفلاح الواقف أمامه. ومن خلفه، في مخزن مسقوف نصف مفتوح، أكوام من القضبان الرمادية مصفوفة بعناية.\u003c/p>\u003cp>قال لين لنفسه: يعرض الحديد الذي يقول إنه ليس عنده.\u003c/p>\u003cp>لم يقل ذلك بصوت مسموع. وقف بجانب تشانغ، وعيناه على القضبان المصفوفة في المخزن.\u003c/p>\u003cp>كان فلاح واقفاً أمام الطاولة قبلهما، يمسك بين يديه سكة محراث صغيرة ويتفحصها بقلق. قال بصوت متردد: «كانت بعشرين في الربيع الماضي.»\u003c/p>\u003cp>«الحديد أغلى يا عزيزي.» ابتسم تشيان. «ثلاثة وعشرون الآن. ثلاث نحاسات فقط. وما هذا بجانب الأرض التي ستحرثها؟»\u003c/p>\u003cp>«ثلاث نحاسات هي ما أطعم به أولادي أسبوعاً.»\u003c/p>\u003cp>«وأنا أعرف ذلك. ولهذا...» خفض صوته كمن يهمس بسر. «خذها باثنتين وعشرين. فقط لأنك صديق.» ودفعها إليه برفق، وأخذ النحاسات، وقد نسي الفلاح أنه لم يجادل في شيء.\u003c/p>\u003cp>لاحظ لين أن الرجل خرج وهو يشكره.\u003c/p>\u003cp>قال تشيان بدفء: «تشانغ العزيز! وصديقنا الذي يصلح الأشياء. ما أسعدني. تفضلا.»\u003c/p>\u003cp>«نريد ثمانية قضبان.» قال تشانغ دون مقدمة.\u003c/p>\u003cp>«ثمانية.» هز تشيان رأسه ببطء، كمن يزن الرقم. «ثمانية قضبان. نحسبها بالسعر الذي تعرفه. ولو أخذتما ثمانية دفعة واحدة، أخصم من المجموع عُشراً.» رفع إصبعاً. «لأن علاقتنا طويلة يا تشانغ، وأنا أعرف أن ورشتك تستحق الدعم.»\u003c/p>\u003cp>«الحديد موجود؟»\u003c/p>\u003cp>«بالطبع، بالطبع.» ثم، بتردد مصطنع: «لكن...»\u003c/p>\u003cp>«لكن؟»\u003c/p>\u003cp>«لكن الثمانية ليست هنا الآن.» أشار بيده الممتلئة إلى المخزن خلفه. «هذه محجوزة لعميل آخر. ولا أستطيع أن أخلف وعداً. أتفهم؟ لكني أعدك. بعد يومين، ثلاثة على الأكثر.»\u003c/p>\u003cp>«وصلتني رسالتك أول أمس. أريد موعداً لا يتغير.»\u003c/p>\u003cp>«والمطر يا صديقي، المطر.» ضحك. «لا أحد يتحكم في المطر. لكني أتحكم في ما أستطيع، ولذلك سأعطيك اليوم ثلاثة قضبان من المحجوزة، على أن...»\u003c/p>\u003cp>«ثمانية.»\u003c/p>\u003cp>«أخبرتك أن...»\u003c/p>\u003cp>«ثمانية.» كرر تشانغ بصوت أخفض. «أو لا شيء.»\u003c/p>\u003cp>نظر تشيان إليه لحظة. لم تتحرك ابتسامته، وأدار خاتمه مرة حول إصبعه قبل أن يجيب. ثم هز كتفيه بسعة صدر.\u003c/p>\u003cp>«حسناً. ثمانية. بعد غد. وأنا الذي سأرسلها بنفسي.» ثم التفت إلى لين فجأة. «والموقد الجديد في نزل الصفصافة؟ سمعت أنه...»\u003c/p>\u003cp>«يعمل.»\u003c/p>\u003cp>«ثلث الحطب.»\u003c/p>\u003cp>«حسب الرقم الذي سمعته.»\u003c/p>\u003cp>«الرقم الذي سمعته يا سيدي هو ثلاثة وثلاثون في المئة تقريباً.» ابتسم أوسع. «أنا أسمع الأرقام. إنها هدية من الله لمن يعرف كيف يصغي.»\u003c/p>\u003cp>«وسمعت أيضاً أنكما استأجرتما أرض جياو، بثلاثة أختام.» أضاف بلطف شديد. «أنا لا أسمع الأرقام وحدها. أسمع الاتفاقات أيضاً. وأتمنى لكما النجاح، بصدق، فالطاحونة تحتاج إلى حديد.»\u003c/p>\u003cp>لم يقل لين شيئاً. وشعر تشانغ بجانبه يشد قبضته.\u003c/p>\u003cp>في الطريق إلى القرية، بعد أن غادروا المخزن، مشى تشانغ خطوتين خلف لين دون كلمة. ثم قال بصوت يكاد لا يسمع:\u003c/p>\u003cp>«الابتسامة.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«ابتسامته. هل رأيت أنها لا تتحرك أبداً؟»\u003c/p>\u003cp>«رأيت.»\u003c/p>\u003cp>«منذ عشر سنوات وأنا أنظر إليها.» ركل حجراً صغيراً عن الطريق. «في أول سنة ظننتها ودّاً.»\u003c/p>\u003cp>لم يعلق لين. وعند بوابة القرية، حين انعطف تشانغ جنوباً نحو ورشته، قال شيئاً آخر دون أن يلتفت:\u003c/p>\u003cp>«إذا جاءت القضبان وكانت رديئة، فلا تحللها أمامي إلا إذا كنت مستعداً لتسمع جوابي.»\u003c/p>\u003cp>وهذه المرة لم يرد لين، لأنه لم يكن متأكداً أنه مستعد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في صباح اليوم التاسع والعشرين، وصلت القضبان كما وعد. وكان لين وشين يان قد سارا إلى الورشة بعد الإفطار، وأبعدا مع تشانغ جذعين عن السندان ليفرغا مكاناً للحمولة.\u003c/p>\u003cp>حملها خادمان على كتفيهما في لفافة من خيش، ووضعاها أمام الورشة على الأرض بصوت معدني ثقيل، ثم انصرفا دون كلمة. ثمانية قضبان رمادية سوداء، طول كل منها ذراع تقريباً، سطحها خشن تغطيه قشرة سوداء.\u003c/p>\u003cp>وقف تشانغ يحدق فيها بصمت.\u003c/p>\u003cp>وضعت شين يان دفترها جانباً، وقد سجلت فيه عدد سلال الحطب التي طلبت هو سانيانغ أن تحصيها. وقفت على الجانب، ودفترها مفتوح، وبعد لحظة ركعت بجانب القضبان، وأخذت واحداً منها ووزنته بيديها، ثم وضعته، ثم أخذ آخر.\u003c/p>\u003cp>قالت: «أخف مما يجب.»\u003c/p>\u003cp>«كيف؟»\u003c/p>\u003cp>«الحجم متساوٍ تقريباً. لكن الوزن...» حركت يدها اليمنى ثم اليسرى. «هذا أثقل من هذا. وهذا أخف من ذاك. القضبان المتشابهة الحجم لا تختلف هكذا في الوزن، إلا إذا كان بداخلها فراغ، أو شيء ليس حديداً.»\u003c/p>\u003cp>نظر إليها تشانغ باهتمام، ثم إلى لين.\u003c/p>\u003cp>قال لين: «يمكنني أن أحللها.»\u003c/p>\u003cp>كانت الجملة الوحيدة التي قالها، وانتظر.\u003c/p>\u003cp>تشانغ لم يقل شيئاً. لكنه تراجع نصف خطوة، وأفسح له الطريق.\u003c/p>\u003cp>ركز لين على القضيب الأول.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: قضيب حديد مطروق (1 من 8)\u003c/div>\u003cdiv>الخبث المحبوس: حوالي 11% من الحجم، موزع على شكل خطوط طولية\u003c/div>\u003cdiv>الكربون: غير متجانس. مناطق 0.2% ومناطق 0.9%\u003c/div>\u003cdiv>الحكم: ضعيف تحت الانحناء المتكرر. يتوقع الكسر عند خطوط الخبث\u003c/div>\u003cdiv>الثقة: 82%\u003c/div>\u003cdiv>طاقة التكامل: 94%\u003c/div>\u003c/div>\u003cp>أعاد القضيب الأول إلى الأرض، وانتقل إلى الثاني ثم الثالث والرابع. كلفه كل تحليل ستة في المئة، فبقيت الطاقة عند ستة وسبعين. وضع يده على الخامس ثم سحبها. لم يختلف ما عرفه عن العيوب كثيراً بين القضبان الأربعة.\u003c/p>\u003cp>قال: «الطاقة.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>خفض صوته وانتقل إلى لغتهما: «كل قضيب يأخذ ستة في المئة. أستطيع إكمالها، لكنني لا أريد صرف المزيد على النتيجة نفسها.»\u003c/p>\u003cp>أجابته بلغتهما: «إذن توقف. عرفت نوع العيب، وبقي أن نرى أيها يصلح.» ثم التفتت إلى تشانغ وقالت باللغة التي يفهمها: «هل نختبرها بالثني؟»\u003c/p>\u003cp>قال تشانغ: «أي ثني؟»\u003c/p>\u003cp>«نرى إن كانت تنثني أم تنكسر.»\u003c/p>\u003cp>رفعت قضيباً، ووضعت طرفيه على جذعين قصيرين من الخشب، ثم نظرت إلى تشانغ. «هل لي؟»\u003c/p>\u003cp>نظر الحداد إلى المسافة بين الجذعين، ثم أومأ.\u003c/p>\u003cp>وضعت القضيب على الجذعين وثبتت طرفه بقطعة خشب. مد لين يده ليساعدها، لكن تشانغ أشار إليهما أن يبتعدا، وأعاد تثبيته بنفسه. وقف الثلاثة بعيداً عن طرفيه، ثم رفع الحداد المطرقة وضرب وسطه ضربة قوية.\u003c/p>\u003cp>انكسر القضيب.\u003c/p>\u003cp>لم ينثن. انفصل إلى نصفين بصوت حاد، وقفزت شظية إلى قرب الباب.\u003c/p>\u003cp>لم يتحرك أحد.\u003c/p>\u003cp>انحنى تشانغ ببطء. التقط القطعة ذات النهاية المكسورة، وقربها من عينيه. كانت المنطقة المكسورة رمادية خشنة، وفيها خطوط سوداء لامعة، كأنها عروق في حجر.\u003c/p>\u003cp>قال لين بصوت منخفض: «هذا الخبث. هذه الخطوط السوداء. هذه بقايا الصهر العالقة داخل الحديد. لم تخرج عند الطرق، فبقيت تفصل طبقاته بعضها عن بعض. وعند الحمل تنفصل هذه الطبقات أكثر.»\u003c/p>\u003cp>«أعرف أنه خبث.»\u003c/p>\u003cp>«وأنا أقول لك السبب.»\u003c/p>\u003cp>لم يرد تشانغ فوراً. فتح كفه ببطء ونظر إلى القطعة.\u003c/p>\u003cp>قالت شين يان: «نجرب الباقي.»\u003c/p>\u003cp>ثانية وثالثة ورابعة. في كل مرة تضع قضيباً، ويضرب تشانغ بصمت. انكسر الثاني. وانحنى الثالث انحناء كبيراً ثم انكسر عند ضربة ثانية. وصمد الرابع. صمد الخامس. وصمد السادس تماماً، ثم أعاده تشانغ إلى الأرض بحذر. أما السابع فانكسر. والثامن صمد.\u003c/p>\u003cp>على الأرض: أربعة مكسورة، وأربعة سليمة.\u003c/p>\u003cp>قالت شين يان: «نصفها.»\u003c/p>\u003cp>«أربعة من ثمانية.» قال لين. «لا نستطيع أن نضع المكسور منها في محور أو طوق.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أخذ تشانغ القضبان المكسورة وجمعها في الزاوية ببطء، قطعة قطعة، بيدين لا ترتجفان، وبوجه لا يكشف شيئاً.\u003c/p>\u003cp>ثم جلس على السندان.\u003c/p>\u003cp>كان صوته خشناً حين تكلم، ولم يرفع نظره عن الأرض.\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>لم يقل لين شيئاً.\u003c/p>\u003cp>«أعرف منذ سنوات.» أخذ نفساً. «عشر سنوات كنت أشتري منه. السنوات السبع الأولى كان الحديد جيداً. ليس ممتازاً، لكنه جيد. ثم أغلق حداد القرية الغربية ورشته. كان ينافسني، وكان يشتري من تاجر آخر. رحل إلى المدينة. وبعد ذلك بشهر...» توقف. «بدأ حديد تشيان يأتي هكذا.»\u003c/p>\u003cp>قالت شين يان بهدوء: «تقول إنه غشك.»\u003c/p>\u003cp>«لا أقول شيئاً.»\u003c/p>\u003cp>«قلت إن الحديد صار هكذا بعد أن رحل المنافس.»\u003c/p>\u003cp>«قلت ما حدث. لا أقول ما نوى أحد.» رفع عينيه أخيراً. «لا أعرف إن كان تشيان يغش، أم أن مورده تغيّر، أم أن الله أراد. لا أعرف.» ثم ضرب بقبضته على فخذه ضربة خفيفة. «لكني أعرف أنني لو اشتكيت له، لن يبيعني بعد ذلك شيئاً. هو المورد الوحيد في ثلاثة مراكز. ومن يشتكي لا يجد حديداً. رأيت ما حدث لمن جرب.»\u003c/p>\u003cp>«من؟»\u003c/p>\u003cp>«حداد آخر في القرية الشمالية، منذ سنوات. اشتكى لتشيان من جودة قضيب. عاد بعد شهر بلا ورشة.» ثم أضاف، بنبرة من يلقي حجراً في بئر عميقة: «هو الآن يكنس السوق.»\u003c/p>\u003cp>كتبت شين يان عدد القضبان المكسورة والسليمة، ثم تركت القلم على الدفتر. التفت تشانغ إلى الصفحة المفتوحة قربه، فرأى حساب الحديد فقط. أعاد القطعة المكسورة إلى الأرض وأسند ساعديه على ركبتيه.\u003c/p>\u003cp>صمت الجميع.\u003c/p>\u003cp>لم يكن لين قد أراد شيئاً من هذا. كان يريد أن يفعل ما وعد به: يحلل الحديد، ويشرح السبب. لكنه رأى الآن أن السبب ليس في الحديد وحده. وأن النظام الذي في رأسه يعرف ما في القضيب، ولا يعرف ما في التاجر. لن يقول له إن تشيان يغش عمداً، أو يتجاهل. لا يقرأ النوايا. هذا الجزء كان عليه أن يستنتجه، كما يستنتجه كل رجل في السوق.\u003c/p>\u003cp>قال: «أنت لم تتوقف عن الشراء.»\u003c/p>\u003cp>«لا أملك أن أتوقف.»\u003c/p>\u003cp>«ولم تخبر أحداً.»\u003c/p>\u003cp>«من أخبر؟» نظر تشانغ إلى يديه. «القرية تأكل من سكتي. والفلاح الذي تنكسر سكة محراثه في الأرض، يظن أن الحديد قدر. أنا من أصنعها، وأنا من أعرف.»\u003c/p>\u003cp>قلب القطعة حتى صارت الخطوط السوداء إلى أسفل. وعندما رفع عينيه إلى لين، أعادهما سريعاً إلى يديه.\u003c/p>\u003cp>قال لين: «هل تعرف كيف تنقّي الحديد؟»\u003c/p>\u003cp>«أعرف.» رفع تشانغ كتفيه. «أسخّنه إلى الاحمرار وأطرقه وأطويه وأطرقه، مرة بعد مرة، حتى يخرج الخبث مع الشرر. لكن كل مرة ينقص وزن القضيب. أحياناً أدفع ثمن قضيب كامل ولا يبقى لي إلا نصفه. كيف أعوض الفرق؟»\u003c/p>\u003cp>«أنت.»\u003c/p>\u003cp>«أنا.» ضحك ضحكة جافة. «ولهذا حديدي سيئ. ليس لأنني لا أعرف. لأنني لا أملك الوقت والفحم لأنقّي كل قضيب أشتريه.»\u003c/p>\u003cp>حسب لين الفحم الذي يلزم لإعادة تسخين ثمانية قضبان وطرقها، ثم ما سيضيع من الحديد في كل مرة. الأجر الذي يطلبه تشانغ من الفلاح لا يغطي عملاً كهذا. وإن رفعه، اشترى الفلاح سكة أرخص من السوق.\u003c/p>\u003cp>قال: «لن أقول لك إنك مخطئ.»\u003c/p>\u003cp>«لا تقل.»\u003c/p>\u003cp>«سأقول فقط إنك لست وحدك.»\u003c/p>\u003cp>رفع تشانغ رأسه ببطء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>بقوا في الورشة حتى المساء، ثلاثتهم، دون أن يقولوا الكثير.\u003c/p>\u003cp>فحص لين القضبان الأربعة التي صمدت، مستعيناً بالتحليل حيث لم يكن قد فحص القضيب من قبل. لم يجد فيها خبثاً يتجاوز أربعة في المئة. هذه تكفي لمحور واحد وبعض الأطواق، لكنها لا تكفي لما يحتاجه الدولاب كله.\u003c/p>\u003cp>حسب: المحور الثاني. الأطواق الأربعة. الستون مسماراً. وهي كلها تحتاج إلى حديد ممتاز، لا إلى قضبان يشك فيها.\u003c/p>\u003cp>قالت شين يان، وهي تجمع القطع المكسورة في كيس خيش: «لو دفعنا ثمن الثمانية كاملة، فقد دفعنا ضعف ما يساوي الحديد السليم.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>مرّرت شين يان قطعة قماش فوق كل كسر قبل أن تضعه في الكيس، لتبعد الشظايا عن أصابع من سيحمله. بقيت قطعة صغيرة فوق الطاولة، فقربتها من القضيب السليم وقارنت الحافتين.\u003c/p>\u003cp>«ولو اشتكينا...»\u003c/p>\u003cp>«فلا حديد.»\u003c/p>\u003cp>«ولو لم نشتكِ...»\u003c/p>\u003cp>«يستمر.»\u003c/p>\u003cp>مرّ شياو دو بالورشة قرب الغروب، وهو يحمل حزمة حطب لهو سانيانغ، فتوقف عند الباب. نظر إلى القضبان المكسورة، وإلى الوجوه، وفتح فمه ليقول شيئاً. ثم أغلقه، وفهم، على خلاف عادته، أن هذه ليست اللحظة.\u003c/p>\u003cp>وفي الخارج بدأ النهار يتحول إلى ظلام مبكر، ومن الطريق مر رجل يحمل سكة محراث مكسورة. نظر إلى الورشة المزدحمة، ثم أكمل سيره، يؤجل إصلاحها إلى صباح آخر.\u003c/p>\u003cp>جلس لين على جذع، ينظر إلى القطعة ذات الخطوط السوداء، وإلى النار الخافتة التي تتنفس في موقد تشانغ.\u003c/p>\u003cp>كان يفكر في الدولاب الذي ينتظر، وفي النهر الذي يتجمد، وفي ستين مسماراً لا وجود لها بعد. لكنه كان يفكر أيضاً في شيء آخر. في الصنعة التي رآها هنا: رجل يصنع كل ما يحتاجه الناس من حديد، ولا يملك حديداً. وقرية كاملة تتكل على هذا الرجل، وتنتظر مع حدادها ما يسمح التاجر بخروجه من المخزن.\u003c/p>\u003cp>سأل، وكان صوته هادئاً:\u003c/p>\u003cp>«كم سكة محراث مكسورة في هذه القرية؟»\u003c/p>"},{"n":12,"t":"الفصل الثاني عشر: الحديد القديم","b":"\u003cp>في صباح اليوم الثلاثين، مدّت عجوز قدراً مثقوباً إلى كف شياو دو؛ وبه بدأ جمع الحديد القديم.\u003c/p>\u003cp>وقفت المرأة عند باب بيتها، يدها ترتجف قليلاً، وضمت مقبض القدر لحظة قبل أن تتركه. كان أسود من الخارج، مصقولاً من الداخل بسنوات من الطبخ، وفي قاعه ثقب بحجم عملة نحاسية.\u003c/p>\u003cp>«أمي أعطتني إياه يوم زواجي.»\u003c/p>\u003cp>قال شياو دو بجدية لا تشبهه: «سنعيده لك في الشتاء. بشكل آخر.»\u003c/p>\u003cp>«قدراً؟»\u003c/p>\u003cp>«ربما حلقات في دولاب. وربما خبزاً.»\u003c/p>\u003cp>لم تفهم. أخذت منه الرقعة الطينية الصغيرة التي أعطاه إياها حسب تعليمات شين يان، ونظرت إليها. رقعة مستديرة بحجم الإبهام، عليها علامة منقورة: دائرة وخط تحتها. ثم ضمتها إلى صدرها.\u003c/p>\u003cp>كانت هذه فكرة شين يان.\u003c/p>\u003cp>كانت تحمل الميزان معهم: عصا معلقة بحبل، وكفتان من الخشب، وحصى اختارتها وقارنت أوزانها عند بائع الحبوب. وضعت القدر في كفة، وراحت تضيف الحصى إلى الأخرى حتى استوتا.\u003c/p>\u003cp>سأل لين: «هل يكفي هذا الميزان؟»\u003c/p>\u003cp>«ليس دقيقاً كميزان البائع. لكنه واحد لكل الناس.» وضعت الحصى اللازمة لهذا القدر في كيس مستقل. «نستعمل المقدار نفسه، ولا نغيره من بيت إلى بيت.»\u003c/p>\u003cp>أرته رقعة من الطين الجاف، بحجم الإبهام. سمتها «رقعة طحن»؛ كل واحدة تساوي كيساً من الحبوب يُطحن مجاناً في الشتاء، وتعطى لقاء مقدار معلوم من الحديد. لم يكن في وسعهما دفع نحاس، أما عمل الطاحونة فكان ما يقدران على الوعد به.\u003c/p>\u003cp>مشى شياو دو من بيت إلى بيت، وخلفه لين يجر عربة هو سانيانغ القديمة بمحور يصر، وفيها بالفعل بعد ساعة سكتان مكسورتان، وثلاثة قدور، وحزمة مسامير ملتوية، وإطار نافذة حديدي، وفأس بلا ذراع، وسلسلة صدئة أخرجها رجل من تحت سريره وقال إنها كانت لجده.\u003c/p>\u003cp>كان الناس يعطون بحذر. ليس خوفاً من السرقة، بل لأن القدر والفأس والسلسلة تُحفظ وتُصلح، ثم يرثها الأبناء. وحين رأوا الرقعة الصغيرة، ش
