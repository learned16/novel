 تشيان حاجبيه. «أعطيك أربعاً. هذا أقل ما يستحقه دقيق ناعم.»\u003c/p>\u003cp>«الثمن ثلاث ونصف.»\u003c/p>\u003cp>«رجل شريف.» التفت إلى الجمع. «لا يبدل الثمن من أجل نصف نحاسة.» ثم عدّ أربع نحاسات ووضعها قرب الميزان قبل أن يستطيع لين رد الزيادة.\u003c/p>\u003cp>كان الناس يتجمعون. أخذ تشيان نصف الكيس، وتركه على الأرض أمام الجميع، وقال بنبرة خطيب: «أنا أول زبائنكم يا سيدي. ليشهد الجميع.»\u003c/p>\u003cp>انحنى لين قليلاً، ووضع النحاس في كيس منفصل ليراجعه مع شين يان. وحين حمل خادمه الكيس وابتعد التاجر بخطوات واسعة، سمع لين امرأة تقول لجارتها: «تشيان يشتري من الغريب. لا بد أنه لا بأس به.»\u003c/p>\u003cp>نظر إلى موضع البغل بين الحصائر. كان تشيان قد أخذ نصف الكيس، لكن صوته ظل في السوق بعده.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند الغروب رأى الرجلين.\u003c/p>\u003cp>كان واقفاً ليحزم الدقيق الباقي، وقد ثقل الكيس على كتفه وأصابعه تتجمد، حين التقطت عيناه شيئاً عند طرف الساحة. اثنان ملتفان في الظل خلف عربة فارغة، يتحدثان إلى حلقة صغيرة من الناس. رجل في سترة خضراء مبطنة، وآخر في سترة بنية.\u003c/p>\u003cp>عرف السترة الأولى: الأخضر الداكن الذي رآه على رجلي القياس عند المنعطف. خادم من بيت ليو.\u003c/p>\u003cp>كان يتحدث بصوت منخفض إلى امرأتين ورجل عجوز، وإحدى النساء تضع يدها على فمها.\u003c/p>\u003cp>«...ولا أوراق. ولا قرية. وحين سأل الكاتب أين أهلهما...»\u003c/p>\u003cp>«أي كاتب؟»\u003c/p>\u003cp>«الكاتب وو. قال له إن قريتهما لم يعد لها اسم.» ضحك. «ولم يعد لها اسم! هل سمعتم حكاية كهذه؟»\u003c/p>\u003cp>«ونزلت عند هو؟»\u003c/p>\u003cp>«وكفلتهما هو.» تنهد بتصنع. «امرأة طيبة، لكنها وحيدة. وتقع في مثل هذا.»\u003c/p>\u003cp>«ويقولون إن...»\u003c/p>\u003cp>«ويقولون ما يقولون.» ثم خفض صوته أكثر: «وأن المرأة تكتب. بحروف لا يعرفها أحد. ليست حروف الدولة، ولا حروف المعابد. حروف... أخرى.»\u003c/p>\u003cp>شهقت إحدى النساء.\u003c/p>\u003cp>«حروف الشياطين؟»\u003c/p>\u003cp>«لا أقول. أنا أنقل.» رفع يده. «لكن من يكتب بحروف لا يقرؤها أحد، يكتب لمن لا يراه أحد.»\u003c/p>\u003cp>وقف لين ثابتاً. حبل الكيس يحز كتفه.\u003c/p>\u003cp>لم يكن خادم ليو وحده. على بعد خطوات منه، يقف الآخر ذو السترة البنية مستنداً إلى عمود، وقد أمسك بكوب شاي، وظل صامتاً. في أواخر العشرين، وجهه عادي، لكن سترته المبطنة دافئة جيدة، من نوع لا يلبسه من يعمل في العربات.\u003c/p>\u003cp>ورأى لين قدميه.\u003c/p>\u003cp>كان ينتعل حذاءً جلدياً أسود لامعاً، حتى الركبة تقريباً، وفي الثلج الذي على الأرض بصماته: مستديرة الطرف، مربعة الكعب. وعلى النعل، أثر خطين رفيعين متوازيين.\u003c/p>\u003cp>تذكر لين الرسم.\u003c/p>\u003cp>رأى الورقة في ذهنه، كما رسمتها شين يان في فجر عند الورشة: الطرف المستدير، والكعب المربع، والخطان. وتذكر الجملة، «لا نحكم. نسجل.»\u003c/p>\u003cp>وكان هذا الرجل، ذو السترة البنية، يعمل عند تشيان.\u003c/p>\u003cp>عرفه من قبل: خادم تشيان الذي أتى بقضبان الحديد المغشوشة قبل شهرين. لم يقل كلمة، لم يتدخل، لم يشارك. بقي يشرب الشاي، وحين ضحك خادم ليو لم يضحك معه، ولم يبتعد عنه.\u003c/p>\u003cp>أحس لين بيديه ترتجفان.\u003c/p>\u003cp>كان يمكنه أن يتقدم. أن يقول: أنا لين. أنا من تتحدثون عنه. هل لك دليل؟ يمكنه أن يمسك بياقة الخادم الأخضر، وأن يشير إلى الرجل ذي الحذاء الجلدي ويقول: من أرسلك؟\u003c/p>\u003cp>ولم يفعل.\u003c/p>\u003cp>رفع يده عن حبل الكيس، ثم أعادها. لم تكن معه ورقة ولا شاهد على ما يخشاه. لو هجم عليهما الآن، لرآه الناس يضرب رجلين لأنهما تحدثا عنه.\u003c/p>\u003cp>أخذ الكيس على كتفه، وانصرف.\u003c/p>\u003cp>شق طريقه بين الحصائر، يتنحى عن الأيدي الممتدة وعن نار صغيرة أوشكت أن تطفأ.\u003c/p>\u003cp>تشيان اشترى منه قبل ساعة علناً، وبالزيادة، أمام الجميع. وخادم تشيان يقف الآن في طرف الساحة يستمع إلى من يقتل اسمه. لم يسمع لين اتفاقاً بين الرجلين. لكنه سمع اسم سيد الأول، وعرف خادم الثاني. شد الحبل حول الكيس حتى ابيضت مفاصله.\u003c/p>\u003cp>وأما خادم ليو، فالأمر أوضح. السترة الخضراء، والحبل المعقود عند المنعطف، والوكيل الذي راقبهم يوم دار الحجر.\u003c/p>\u003cp>لم يكن لدى لين دليل واحد يصلح أمام كاتب أو قاضٍ. أثر حذاء، وخادم يقف قريباً من خادم آخر. أما الكلام، فكل من يردده ينسبه إلى غيره.\u003c/p>\u003cp>التفت مرة أخيرة. كان خادم ليو قد وجد ثلاثة مستمعين جدد، وخادم تشيان ما يزال قرب العمود.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت شين يان تنتظره عند الجهة الغربية، قرب شجرة الكاتب العارية، ومعها شياو دو.\u003c/p>\u003cp>جاءت متأخرة لتساعده في الحزم، وقد ربطت ثيابها بحزام عريض يخفي انتفاخ بطنها قليلاً، ولكن مشيتها أبطأ مما كانت قبل أسبوعين، وأنفاسها قصيرة.\u003c/p>\u003cp>قالت وهي تأخذ الكيس الصغير من يده: «كم؟»\u003c/p>\u003cp>«ستة وعشرون.»\u003c/p>\u003cp>«من ثلاثة أكياس؟»\u003c/p>\u003cp>«من ثلاثة أكياس تقريباً. وزدت من الكيس الاحتياطي، وبقي نصفه.» وأخبرها بالأرقام، وبالنساء اللواتي اشترين، وبالرجال الذين مروا دون أن يشتروا. ولم يخبرها بالباقي.\u003c/p>\u003cp>لاحظت أنه لم يقل كل شيء. لكنها لم تسأل.\u003c/p>\u003cp>مشوا نحو القرية في ضوء الغسق، بين صفوف من البيوت الطينية المنخفضة، ودخان المداخن الأبيض الرفيع يتصاعد إلى سماء لونها لون الرماد. كان البرد قد انخفض، وبدأت أولى ندف الثلج الصغيرة تسقط ببطء على أكمامهم.\u003c/p>\u003cp>عند منعطف الزقاق الثالث، توقفت شين يان.\u003c/p>\u003cp>كانت تنظر إلى بيت صغير على الجانب الأيمن، سقفه من القش المبتل، ومدخنته الطينية القصيرة تدخن دخاناً رمادياً متقطعاً، ثقيلاً، يلتف حول نفسه قبل أن يرتفع.\u003c/p>\u003cp>قالت: «سحبها مخنوق.»\u003c/p>\u003cp>التفت لين. «ماذا؟»\u003c/p>\u003cp>«المدخنة.» أشارت بذقنها. «عند الكوع. السحب مخنوق من الداخل. الدخان يدور هناك ولا يجد مخرجاً.»\u003c/p>\u003cp>«كيف تعرفين؟»\u003c/p>\u003cp>«لا أعرف.» قالت ببساطة. «أراه فقط.»\u003c/p>\u003cp>كان الدخان، حقاً، يلتف ثم يتسرب في خيوط مرتبكة. وكان لين قد رآه من قبل ولم ينتبه.\u003c/p>\u003cp>ركز على المدخنة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: مدخنة طينية، بيت سكني\u003c/div>\u003cdiv>العيب: انسداد جزئي عند الكوع الداخلي (انحناء حاد بزاوية قريبة من 90°). تراكم سخام يضيق المجرى بنسبة تقارب 40%\u003c/div>\u003cdiv>التأثير: دخان مرتد، وهدر في الحرارة\u003c/div>\u003cdiv>الثقة: 74%\u003c/div>\u003cdiv>طاقة التكامل: 90%\u003c/div>\u003c/div>\u003cp>نظر إلى السطر الأخير ثم إلى شين يان.\u003c/p>\u003cp>«صحيح.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أظهر كلامك نفسه. عند الانحناء. انسداد.» وجد نفسه يبتسم، بشيء من التعب. «أنتِ أسرع من النظام.»\u003c/p>\u003cp>لم تضحك.\u003c/p>\u003cp>كانت واقفة في الثلج الهابط، تنظر إلى المدخنة، وعلى وجهها تعبير لم يعرف له اسماً. لم يكن خوفاً. كان بين الدهشة والإنصات، كمن يسمع صوتاً بعيداً لا يعرف إن كان حقيقياً.\u003c/p>\u003cp>قالت: «لم أحسب شيئاً.»\u003c/p>\u003cp>«قلتِ ما رأيتِ.»\u003c/p>\u003cp>«رأيت.» كررت. ثم هزت رأسها كمن يطرد شيئاً. «هيا. الجو بارد.»\u003c/p>\u003cp>مشيا. ومشى شياو دو خلفهما صامتاً، على غير عادته. ثم قال فجأة، بصوت أخفض من أن يسمعه غيرهما:\u003c/p>\u003cp>«سمعتها.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«الإشاعة. قبل يومين.» كان يحدق في الأرض. «سمعتها من ابن الجزار. قال لي: أبي يقول إنكما جاسوسان. أخبرته أنه كاذب. فقال: أنا لا أكذب، أنا أنقل.» رفع رأسه بعينين حمراوين. «لم أقل لكم. لم أرد أن...»\u003c/p>\u003cp>«ليس عيباً.» قالت شين يان.\u003c/p>\u003cp>«كان عيباً. العمة تقول إن الذي يعرف ولا يقول شريك.»\u003c/p>\u003cp>«والعمة هي التي علمتك هذا؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>نظرت شين يان إلى الثلج على كتفه. «ليس كل صمت مشاركة.» ثم قالت: «أخبرتنا الآن. في المرة المقبلة تعال إلينا من أول مرة.»\u003c/p>\u003cp>ولم يقل أحد شيئاً بعد ذلك حتى بلغوا الزقاق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان الثلج يزداد كثافة حين وصلوا الساحة الصغيرة أمام النزل.\u003c/p>\u003cp>وقفت امرأة عند باب أحد البيوت تنفض الغطاء، وبجانبها طفل في الخامسة ينظر إلى الثلج بعينين واسعتين. حين اقترب الثلاثة، رفع الطفل رأسه. نظر إلى لين، ثم إلى شين يان.\u003c/p>\u003cp>ثم رفع إصبعه الصغير وأشار إليها. وقال بصوت واضح:\u003c/p>\u003cp>«هذه التي تكتب بحروف الشياطين.»\u003c/p>\u003cp>شهقت المرأة. اندفعت إلى الطفل، وسحبته من ذراعه، ولم تنظر إليهم. ثم ركض الطفل داخل البيت، وأُغلق الباب بعنف.\u003c/p>\u003cp>وبقيت شين يان واقفة، في الثلج، ويدها على بطنها.\u003c/p>"},{"n":25,"t":"الفصل الخامس والعشرون: الطاحونة الفارغة","b":"\u003cp>بعد سبعة أيام من يوم السوق، لم يجد العم تيان حبوباً يصبها بين الحجرين.\u003c/p>\u003cp>لم يأتِ أحد في الأيام العادية. ربط زاو إلى الذراع الطويلة كما اعتاد كل صباح، وغطى عينيه بالخرقة السوداء. تركه يدور دورة واحدة ليفحص لين المحور، ثم أوقفه وفك الرباط. حملت أخاديد الحجر بقية دقيق قديم، ولم يكن في الغرفة كيس واحد ينتظر الطحن.\u003c/p>\u003cp>لم يأتِ إلا أصحاب الرقع في أيام الوعد. يومان من ستة: يأتون صامتين، يضعون الأكياس، ويحملونها مطحونة، ويمضون بلا كلمة وبلا نظرة طويلة. والباقي أيام فراغ.\u003c/p>\u003cp>أحصت شين يان الأمر في دفترها على لوح الصخرة.\u003c/p>\u003cp>صفر، صفر، صفر، ثلاثة أنصاف أكياس، صفر. «الدخل» كلمة لم تعد تعني شيئاً. والدين، في الأعلى، مئة وأربع وعشرون.\u003c/p>\u003cp>لم يقل لين شيئاً. كان يعمل. انحنى على وتد بدأ يتشقق، ووضعه أمام يانغ، ثم بحث عن قطعة خشب تصلح بدلاً منه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء لاو دونغ عند الظهر.\u003c/p>\u003cp>وقف عند باب الغرفة الحجرية، قبعته في يده، ينظر إلى الأرض. كان قد غاب يومين عن العمل، وحين وصل لم يقترب من الترس. قال دون أن يرفع رأسه:\u003c/p>\u003cp>«زوجتي.»\u003c/p>\u003cp>«نعم؟»\u003c/p>\u003cp>«قالت لي لا أعود.»\u003c/p>\u003cp>لم يجب لين.\u003c/p>\u003cp>«لم تقل لماذا. أعرف لماذا.» حرك القبعة في يده. «أنا لا أصدق ما يقولون. لا أصدق أنكما جاسوسان. رأيت أيديكما على الخشب. لكنها تقول: سيأتي الحرس يوماً. وسيأخذون كل من كان عندكم. وأنا عندي ثلاثة أولاد.»\u003c/p>\u003cp>«ولا ألومك.»\u003c/p>\u003cp>«أنا ألوم نفسي.» رفع رأسه أخيراً، وعيناه حمراوان. «لكنني خائف.»\u003c/p>\u003cp>جاء صوت من خلفه، قصير حاد:\u003c/p>\u003cp>«وأنا لست خائفاً.»\u003c/p>\u003cp>كان تشيو واقفاً عند العتبة، ويده تقبض على المطرقة، ووجهه شاحب ومضطرب. كان قد جاء من خلف الحظيرة وسمع آخر الكلام.\u003c/p>\u003cp>«تشيو...»\u003c/p>\u003cp>«لا.» دخل. «أنت ستذهب لأن زوجتك قالت. وأنا سأبقى لأن أحداً لم يقل لي شيئاً.» كان صوته يرتفع. «ولأنني رأيت الماء. أنا الذي أمسكت الحبل يا لاو دونغ. وأنت أمسكت به خلفي. أم نسيت؟»\u003c/p>\u003cp>«لم أنسَ.»\u003c/p>\u003cp>«إذن لا تقل إنهما جاسوسان.»\u003c/p>\u003cp>«لم أقل.»\u003c/p>\u003cp>«قلتها في الساحة.»\u003c/p>\u003cp>صمت. التفت لين نحو لاو دونغ. كان الرجل يحدق في الأرض، وفي وجهه شيء ينكسر.\u003c/p>\u003cp>«قلت ما سمعت. لم أقل ما أعتقد.»\u003c/p>\u003cp>«وما الفرق؟»\u003c/p>\u003cp>أراد لين أن يتدخل. لكن شين يان، الجالسة عند الباب، أوقفته بنظرة.\u003c/p>\u003cp>خرج لاو دونغ بعد لحظة، ظهره منحنٍ، وبقي تشيو واقفاً، ويداه ترتجفان على المطرقة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حدث ما حدث في الساحة بعد يومين.\u003c/p>\u003cp>لم يكن لين هناك. عرف به من شياو دو الذي جاء يركض، يتنفس بصعوبة، وعيناه متسعتان:\u003c/p>\u003cp>«تشيو! تشيو في الساحة!»\u003c/p>\u003cp>حين وصل لين كان الناس قد تحلقوا. كان تشيو واقفاً وسط الحلقة، يده ممسكة بياقة رجل قصير ممتلئ من القرية الشمالية، وهو يهزه، وصوته يصل إلى أعلى الأسطح:\u003c/p>\u003cp>«أعد ما قلته! أعد!»\u003c/p>\u003cp>«أقول ما يقوله الناس!»\u003c/p>\u003cp>«الناس! أي ناس؟ سمّهم! قل لي اسماً واحداً!»\u003c/p>\u003cp>فتح الرجل فمه ثم أغلقه. أخذ ينظر إلى من حوله، يبحث عمن يتدخل. ثم دفعه تشيو فسقط على الثلج، وأحس الجميع بأن الأمر انتقل من الكلام إلى شيء آخر.\u003c/p>\u003cp>«لا تلمسوا الرجل!» صاح أحدهم.\u003c/p>\u003cp>«هو الذي لمسني!»\u003c/p>\u003cp>«لا يهم! هؤلاء الغريبان...»\u003c/p>\u003cp>وصل صوت هو سانيانغ من خلف الحلقة.\u003c/p>\u003cp>لم تكن في الساحة حين بدأ الشجار. كانت عائدة من دكان الجزار، بسلتها على ذراعها، وسمعت الصياح. اخترقت الحلقة بكتفيها العريضتين، ووقفت بين تشيو والرجل الساقط، ويدها ممدودة نحو الشاب.\u003c/p>\u003cp>لم تنظر إلى لين. لم تنظر إلى شين يان التي وصلت بعده بخطوات ثقيلة.\u003c/p>\u003cp>قالت بصوت بلغ البيوت في آخر الساحة:\u003c/p>\u003cp>«أنتِ يا زوجة العجوز وانغ. وأنت يا ابن الجزار. وأنتم جميعاً. كفلت الغريبين أمام الكاتب وو. باسمي وختمي. في دفتر الحكومة.»\u003c/p>\u003cp>لم يتكلم أحد.\u003c/p>\u003cp>«ومن عنده دليل، يأخذه إلى الكاتب. غداً. ويقول: كفيلة جاسوسين. وأنا هنا. في النزل. لا أهرب.» أدارت رأسها ببطء إلى كل جهة. «ومن ليس عنده دليل، يسكت.»\u003c/p>\u003cp>أنزلت زوجة وانغ عينيها. تراجع ابن الجزار حتى وقف خلف رجل أطول منه.\u003c/p>\u003cp>ثم أمسكت تشيو من ذراعه، بقوة، وقالت بنبرة منخفضة وعادية: «تعال. يداك تنزفان.»\u003c/p>\u003cp>أخذته. ولم تنظر خلفها.\u003c/p>\u003cp>وفي الليل، حين عادا إلى النزل، لم تقل لهما كلمة. وُضع الطعام على الطاولة كما في الأيام الماضية، بلا حديث. لكن لين لاحظ أنه كان أكثر قليلاً.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقع الأمر بعد خمسة أيام، ليلة اليوم الخامس والتسعين.\u003c/p>\u003cp>كان لين قد بقي في الطاحونة متأخراً، يراقب الترس مع العجوز يانغ، ويدهن القطعة الحديدية عند المحور بالشحم، وزاو ينام في زاويته بالخرقة السوداء فوق عينيه. حين خرج كان القمر عالياً ونصف مكتمل، والثلج على الدرب يلمع كقطعة معدن.\u003c/p>\u003cp>لم تتحرك أغصان الصفصاف، وغابت أصوات الكلاب التي اعتاد سماعها عند هذا المنعطف.\u003c/p>\u003cp>مشى نحو النزل، ومعه المصباح الزيتي الصغير، وعلى كتفه سترته المبطنة. ولم يكن قد قطع نصف الدرب حين سمع الصوت.\u003c/p>\u003cp>كان بعيداً، من جهة الجسر الصغير عند الطريق الخلفي للطاحونة. صوت مكتوم رطب، ثم آخر. ثم أنين.\u003c/p>\u003cp>توقف.\u003c/p>\u003cp>لم يكن صراخاً. كان يشبه نفساً مقطوعاً يخرج من حلق ضغط عليه شيء. فكر لحظة. ثم أطفأ المصباح، وترك الظلام يمتصه، وسار بحذر على الثلج، ملتصقاً بحافة الدرب.\u003c/p>\u003cp>عند الجسر انخفض الدرب، فرأى حركات فوق بياض الثلج.\u003c/p>\u003cp>ثلاثة رجال بملابس داكنة، وجوههم مغطاة بخرق سوداء، يقفون في دائرة صغيرة وسط الدرب. ورابع على الأرض، ملتف على نفسه، ويداه على رأسه، وجسده يرتجف تحت ضربات متتابعة من عصي قصيرة. قدم تهوي في خاصرته، وعصا على ظهره، وأخرى على ذراعيه. كانت الضربات تتعاقب. يتنحى أحدهم ليمد الآخر عصاه، ولا يصرخون ولا يتجادلون.\u003c/p>\u003cp>ثم رفع أحدهم الرجل الملقى من شعره، وصوّب إلى وجهه ضربة قوية بمقبض العصا.\u003c/p>\u003cp>سمع لين الصوت.\u003c/p>\u003cp>طقة جافة تحت صدمة العصا، أعقبها صوت الرجل وهو يختنق بدمه.\u003c/p>\u003cp>صرخ الرجل صرخة قصيرة، ثم سقط وجهه في الثلج. وضحك أحد الملثمين ضحكة قصيرة. وقال بصوت مبحوح مخنوق من خلف الخرقة:\u003c/p>\u003cp>«هذا ليكتب بحروف الشياطين.»\u003c/p>\u003cp>أخذ لين يتنفس بصعوبة. كان قلبه يدق في أذنيه كمطرقة، وراحتا يديه مبللتان بالعرق رغم البرد. لم يكن يحمل سوى مصباح مطفأ. في جيبه سكين صغيرة للخشب، لا تصلح لشيء.\u003c/p>\u003cp>وعرف أنهم إن رأوه، فسيكون الثاني.\u003c/p>\u003cp>صاح بأعلى صوته، صوتاً لم يعرفه:\u003c/p>\u003cp>«من هناك؟! يا أهل القرية! النار! النار!»\u003c/p>\u003cp>لم يكن عنده شيء آخر. لم يكن في الدرب أحد. لكن الصوت ارتد في الوادي الساكن، وتردد فوق الثلج، وبدا كأنه آتٍ من عشرة أماكن. وفي تلك اللحظة، رفع أحد الملثمين رأسه إلى المنعطف.\u003c/p>\u003cp>«هناك أحد.»\u003c/p>\u003cp>«فلنذهب.»\u003c/p>\u003cp>ركضوا. ثلاثة ظلال داكنة تقفز فوق الثلج نحو الجسر، وتختفي خلف الحقول. وفي ضوء القمر، عند ركض أحدهم، لمح لين نعلاً لامعاً.\u003c/p>\u003cp>نعل جلد.\u003c/p>\u003cp>لم يتبعهم. ركض إلى الجسد الملقى.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان تشيو.\u003c/p>\u003cp>قلبه لين على ظهره بحذر. الوجه مغطى بالدم، لزج أسود في ضوء القمر، يغطي الفم والذقن والرقبة، وينزف من أنف مائل بزاوية لا يمكن أن تكون طبيعية. جلد الحاجب الأيسر ممزق، ويفتح فجوة في الجلد حتى العظم. وعند الفم، شفتاه متورمتان، والدم يسيل من بينهما بفقاعات صغيرة مع كل نفس.\u003c/p>\u003cp>ثم رأى الأسنان. اثنان من الأمام مكسوران، وآخر مقتلع من جذره، يلمع أبيض صغيراً في الثلج بجانب رأسه.\u003c/p>\u003cp>«تشيو.» همس. «تشيو، أسمعني؟»\u003c/p>\u003cp>انفتحت عينه اليمنى، وظلت تتحرك بين وجه لين والطريق خلفه.\u003c/p>\u003cp>«لا... لا تتركني.» خرج الكلام مشوهاً، بين شفتين منتفختين.\u003c/p>\u003cp>«لن أتركك.»\u003c/p>\u003cp>«أمي... لا تقل لأمي.»\u003c/p>\u003cp>«لن أقول.»\u003c/p>\u003cp>«كانوا... ثلاثة.» اختنق، وسعل، ورش الدم على صدر لين. «لم أرَ... وجوههم.»\u003c/p>\u003cp>«لا تتكلم.»\u003c/p>\u003cp>لكنه تكلم. قال بصوت شبه مفقود، وعيناه تتجهان إلى السماء السوداء:\u003c/p>\u003cp>«نعال جلد.»\u003c/p>\u003cp>ثم غاب وعيه.\u003c/p>\u003cp>حمله لين. كان الشاب خفيفاً، أخف مما توقع، وجسده يرتجف ببرودة العرق والدم. مشى به نحو النزل. كل بضع خطوات كان يعدل ذراعه تحت ركبتي الشاب، ويقول له اسمه. سال الدم من كم تشيو على الثلج، وعلق بعضه بلحية لين حين أسند وجهه إلى كتفه.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت الشمعة الوحيدة في المطبخ.\u003c/p>\u003cp>وضعوه على الطاولة الطويلة التي يأكل عليها النزلاء في الصباح، بعد أن مسحتها شين يان بقماش مبلل في ثوانٍ.\u003c/p>\u003cp>بقيت ذراع لين تحت رأسه لحظة، لا يعرف كيف يسحبها من غير أن يؤلمه. مدت شين يان قطعة قماش مطوية تحت العنق، ورفعت الرأس معه ببطء. حين سحب ذراعه رأى الكم مشبعاً بالدم حتى المرفق.\u003c/p>\u003cp>همس شياو دو: «هو تكلم معي هذا الصباح.»\u003c/p>\u003cp>لم يجبه أحد.\u003c/p>\u003cp>«كان يريد مسمارين. قال إنه سيصلح الباب عند أمه.»\u003c/p>\u003cp>وضعت شين يان كفها فوق يدي الصبي. كان يضغط القدر إلى صدره حتى انغرست حافته في ثوبه.\u003c/p>\u003cp>«ضعه هنا. ثم افتح الطريق إلى الموقد.»\u003c/p>\u003cp>أطاعها، وبقي واقفاً حتى أخذت منه الخرقة الملتفة حول المقبض. نظرت إلى لين وأشارت إلى الباب الخارجي. ذهب فأغلقه ووضع المزلاج في حلقته. بقي يستمع لحظة إلى الخارج؛ وقع قدم واحدة، ثم صوت امرأة تسأل من خلف باب قريب إن كانت ثمة نار.\u003c/p>\u003cp>قال من غير أن يفتح: «لا نار. عودوا إلى بيوتكم.»\u003c/p>\u003cp>ولما رجع إلى الطاولة، كان تشيو يحرك شفتيه. انحنى لين ليسمعه، فلم يجد إلا صفير نفس يمر بين الأسنان المكسورة. وضع يده قرب كتفه وقال له إنهم في النزل، وإن الباب مغلق. وقف شياو دو في الزاوية، يفرك أصابعه الفارغة. جاءت هو سانيانغ من غرفتها بقميص نومها وشعرها منسدل، وعيناها تفحصان الجسد دون كلمة.\u003c/p>\u003cp>قالت: «ماء ساخن.»\u003c/p>\u003cp>«يغلي.» ردت شين يان.\u003c/p>\u003cp>«وإبرة من صندوقي. الغليظة. وخيط الحرير.»\u003c/p>\u003cp>ركض شياو دو.\u003c/p>\u003cp>وقفت هو سانيانغ فوق الشاب، وأمسكت وجهه بين يديها، ومالت عليه. فحصت الأنف، ثم الحاجب، ثم الفم، وأصبعها يتحسس العظام. لم يرمش لها جفن.\u003c/p>\u003cp>«الأنف مكسور. الحاجب مشقوق. ثلاثة أسنان. وضلع أو اثنان على الأقل.» ثم رفعت رأسها. «شين يان. أمسكي الشمعة. أقربيها.»\u003c/p>\u003cp>كانت تلك أول مرة تناديها باسمها منذ أيام.\u003c/p>\u003cp>أمسكت شين يان الشمعة بيد ثابتة، وضغطت كوعها إلى جانبها كيلا تهتز، وقربتها من وجه تشيو. وفي الضوء الأصفر، رأى لين الجرح المفتوح فوق الحاجب، بعمق عقدة إصبع، والعظم الأبيض يلمع تحته.\u003c/p>\u003cp>قربت الإبرة من الجرح.\u003c/p>\u003cp>غسلوا الجرح أولاً وأوقفوا ما استطاعوا من نزفه. وحين دخلت الإبرة في جلده الممزق، أنّ تشيو وحرك رأسه، فأمسكه لين برفق. كان الخيط الحريري الأسود يتبع الإبرة، غرزة بعد غرزة صغيرة، وتوقفت كلما تحرك الشاب حتى يمسك لين برأسه من جديد. وفي كل غرزة، كان خيط دم رفيع ينزلق إلى صدغه ويسقط على الخشب.\u003c/p>\u003cp>مرت ثماني غرز. ثم عشر.\u003c/p>\u003cp>وحين انتهت، قطعت الخيط بأسنانها.\u003c/p>\u003cp>قالت دون أن تلتفت: «عدّل الأنف يا لين.»\u003c/p>\u003cp>«أنا؟»\u003c/p>\u003cp>«أنت. أمسك الأنف بإصبعين، هنا، وشدّه إلى اليمين وإلى الأعلى. بقوة. كما يعدل الخشب.»\u003c/p>\u003cp>«سأؤلمه.»\u003c/p>\u003cp>«سيؤلمه أكثر إن تُرك.»\u003c/p>\u003cp>أمسك لين الأنف.\u003c/p>\u003cp>كان العظم الصغير تحت أصابعه لزجاً ودافئاً، وفي داخله شيء يتحرك. شد. سمع فرقعة صغيرة، كغصن جاف، وفتح تشيو عينيه فجأة وأطلق صرخة حادة، ثم ارتخى رأسه من جديد.\u003c/p>\u003cp>«جيد.» قالت هو سانيانغ. ولأول مرة منذ أيام لم يكن في صوتها حدة. «جيد جداً.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>أفاق تشيو بعد ساعة.\u003c/p>\u003cp>كان الفجر قد قارب، وشياو دو نائم على الأرض بجانب الطاولة، والنار في الموقد تتنفس. جلست شين يان على كرسي قرب رأس الشاب، تمسح الدم المتجمد عن رقبته بقطعة قماش مبللة.\u003c/p>\u003cp>فتح عينه اليمنى. حدق في السقف لحظة، ثم حركها نحو لين، الواقف عند الباب.\u003c/p>\u003cp>قال بصوت منخفض مبحوح، بفم متورم:\u003c/p>\u003cp>«نعال... جلد.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«قلت لك.»\u003c/p>\u003cp>«سمعتك.»\u003c/p>\u003cp>«لا تنسَ.» ثم ابتسم، أو حاول أن يبتسم، بشفتين متورمتين. «لم أتراجع.»\u003c/p>\u003cp>ثم أغمض عينيه.\u003c/p>\u003cp>قالت شين يان بصوت خافت، دون أن ترفع عينيها عن القماش: «أمه.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«ماذا نقول لأمه؟»\u003c/p>\u003cp>نظرت هو سانيانغ إليها. كانت واقفة قرب الموقد تغسل يديها في وعاء أحمر، ودمه يلتف في الماء كخيوط حرير.\u003c/p>\u003cp>«لا تقولين شيئاً.» قالت. «أذهب أنا. في الفجر.» ثم أضافت دون أن ترفع صوتها: «هذا بيتي. وهو شاب جاء إلى بيتي ينزف. والأمهات لا يُخبرن بالأخبار من غرباء.»\u003c/p>\u003cp>سحبت شين يان مقعداً لها قرب النار. جلست هو سانيانغ عليه من غير أن تقول شيئاً، وراحت تجفف أصابعها في خرقة نظيفة.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقف لين عند باب المطبخ قبيل الفجر، بعد أن مضت ساعات على منتصف الليل.\u003c/p>\u003cp>كان في الخارج هواء رمادي قبل الفجر، ثلج يتساقط ساكناً، وأول ديك يتململ. ويداه، حين رفعهما أمامه، ما زال عليهما دم تشيو، تحت الأظافر وفي المفاصل، قد تجمد بنياً في البرد. حاول أن يغسله بالثلج. لم يتغير لونه.\u003c/p>\u003cp>كان يعرف ما سيقوله الناس: أن الغريبين يجلبان العنف. وأن الشاب الذي دافع عنهما قد دفع الثمن. نظر إلى تشيو من خلال شق الباب. ارتفع الغطاء فوق صدره ثم هبط ببطء.\u003c/p>\u003cp>وكان يعرف ما يريده قلبه: أن يمشي في الظلام إلى بيت ليو، أو إلى بيت تشيان، أو إلى حيث ينام الرجل ذو الحذاء الجلدي، ويفعل ما لا يعرف كيف يفعله.\u003c/p>\u003cp>فرك الدم تحت ظفره حتى جرح الجلد. لم يكن يعرف من ضرب تشيو، ولم يكن الغضب دليلاً يأخذه إلى الكاتب. أعاد يده إلى كمه، وقرر ألا يترك نفسه وصحبه تحت رحمة الكلام وحده.\u003c/p>\u003cp>لكن لأول مرة منذ أن وصل إلى هذا العالم، بعد أن وجد تشيو مضروباً على الطريق، ولم يكن في يديه ما يدفع به المعتدين، وجد نفسه يفكر في شيء آخر.\u003c/p>\u003cp>أن يحمل شيئاً حين يمشي ليلاً.\u003c/p>"},{"n":26,"t":"الفصل السادس والعشرون: الأفعال","b":"\u003cp>«الكلام لا يوقف عصياً.»\u003c/p>\u003cp>قالها لين في صباح اليوم السابع والتسعين، واقفاً في المخزن بين الأغطية، يشد الحزام على سترته. وكانت شين يان جالسة على القش تلف قدميها بالخرق قبل الحذاء، ويدها ترتجف قليلاً من البرد، ولا تنظر إليه.\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«إذن ماذا نفعل؟»\u003c/p>\u003cp>«نبدأ بالعمل الذي وعدنا به الناس.»\u003c/p>\u003cp>رفع رأسه.\u003c/p>\u003cp>أنهت لف الخرقة وربطت العقدة. «قضينا الليل نفكر فيمن قال ومن صدق. لن نعرفهم جميعاً. لكن ثمة بيوتاً ما زال دخانها يدخل على أطفالها، ونحن نعرف كيف نصلحها.»\u003c/p>\u003cp>«وأي عمل نبدأ به؟»\u003c/p>\u003cp>«بيت المرأة التي عرضت الدجاجتين. نذهب إليه اليوم.»\u003c/p>\u003cp>وفتحت الدفتر على ركبتيها.\u003c/p>\u003cp>كانت قد كتبت في الليل قائمة. ثلاثة أسطر قصيرة بأرقامها وحروفها المختلطة: بيت امرأة الدجاجتين، والأرامل الثلاث، وشيء ثالث لم يفهمه لين لأنه مكتوب بحروف لا يعرفها بعد.\u003c/p>\u003cp>«ما الثالث؟»\u003c/p>\u003cp>«سيأتي.» أغلقت الدفتر. «هيا. البيت الأول بعيد.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>تذكر لين وعده لامرأة الدجاجتين.\u003c/p>\u003cp>قالت هو سانيانغ يومها: لا قبل ثلاثة أيام، ولا قبل أن يمر الكاتب. ثم مر الكاتب، وشغلتهما الطاحونة والصقيع، وبقي البيت كما كان. لم تعد المرأة إلى المطبخ لتسأل. شد لين حبل سلة الأدوات، ولم يبحث لنفسه عن عذر.\u003c/p>\u003cp>خرج لين من النزل ومعه شياو دو، يحمل سلة فيها دلو طين، وقطعة حديد صغيرة من تشانغ، وأداة لفرد الطين، وعصا طويلة. ولحق بهما يانغ عند الحظيرة، يحمل لوحين قصيرين وحزمة أوتاد. مشت شين يان بجانب لين، تتكئ على ذراعه في المنحدرات.\u003c/p>\u003cp>كان البيت في الطرف الغربي، بين حظيرة مهجورة وسور حجري منهار. بيت طين من غرفة واحدة، سقفه من القش الأسود، وعلى بابه ستارة من خيش ملطخ بالسخام. حين اقتربوا، شموا الدخان قبل أن يروا البيت: رائحة حادة، مرة، فيها خشب رطب وقش محروق وشيء آخر حامض يدخل الحلق.\u003c/p>\u003cp>وسمعوا السعال.\u003c/p>\u003cp>لم يكن سعالاً واحداً. كان متعدداً، متناوباً، متقطعاً، يخرج من داخل الجدران كأن البيت نفسه يختنق. سعال طفل صغير، رفيع جاف، ثم سعال أكبر، أجش، ثم سعال امرأة بين الاثنين تنهي سلسلة قصيرة منهما وتبدأ سلسلة أخرى.\u003c/p>\u003cp>رفع شياو دو الستارة بإصبعين.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كانت المرأة جالسة على الأرض أمام الموقد، وفي حضنها طفل ملفوف بالخرق، وعيناها حمراوان. ولم تقم حين رأتهم.\u003c/p>\u003cp>«أنت.» قالت ببطء، وهي تنظر إلى لين.\u003c/p>\u003cp>«جئت من أجل الموقد. أتذكرين الدجاجتين...»\u003c/p>\u003cp>«ماتتا.» قالت. «في أول الشتاء.» ثم، بصوت فيه ما يشبه الاعتذار: «لم أعد أملك ما أعطيه.»\u003c/p>\u003cp>«لم آتِ لأجلهما.»\u003c/p>\u003cp>لم تفهم. سحبت الغطاء فوق رأس الرضيع، وحدقت في سلة أدواته.\u003c/p>\u003cp>كان البيت شديد الظلمة. سُدّت النافذة بقطعة جلد مرقعة، والموقد في الركن مبني من حجارة مجمعة بطين خام، يتصاعد منه دخان أسود لا يخرج من المدخنة، بل يتجمع تحت السقف ثم يهبط ببطء ليغطي الغرفة بضباب رمادي. وعلى الحصير طفلان: صبي في الثامنة، جالس وركبتاه إلى صدره، وفتاة أصغر مستلقية تتنفس بفم مفتوح. أما الرضيع الثالث، فكان في حضن أمه، وفي كل نفس يخرج من صدره صوت أجش واهن.\u003c/p>\u003cp>أحس لين بشيء ثقيل يهبط في صدره.\u003c/p>\u003cp>ركز على المدخنة.\u003c/p>\u003cdiv class=\"sys\">\u003cdiv>\u003cstrong>[تحليل المواد — المستوى 1]\u003c/strong>\u003c/div>\u003cdiv>الهدف: مدخنة وموقد (بيت من غرفة واحدة)\u003c/div>\u003cdiv>العيوب: لا فتحة هواء سفلية. المدخنة قصيرة جداً (نحو 60 سم فوق السقف). فتحة المدخنة مسدودة جزئياً بسخام (نحو 50%)\u003c/div>\u003cdiv>النتيجة: دخان مرتد، حرارة ضائعة، احتمال تراكم أول أكسيد الكربون بسبب الاحتراق الناقص\u003c/div>\u003cdiv>الثقة: 78%\u003c/div>\u003cdiv>طاقة التكامل: 92%\u003c/div>\u003c/div>\u003cp>«أخرجوا الأطفال.» قال بصوت منخفض. «إلى الخارج. في الهواء.»\u003c/p>\u003cp>لم تتحرك المرأة.\u003c/p>\u003cp>قالت شين يان: «سيدتي.» وجثت، بحذر، على الأرض الرطبة. «اسمي شين يان. رأيتك عند النزل في الخريف. هل تسمحين لي بحمل الرضيع؟»\u003c/p>\u003cp>نظرت إليها المرأة. إلى بطنها المنتفخ. إلى عينيها.\u003c/p>\u003cp>ثم مدت الطفل.\u003c/p>\u003cp>فتحت شين يان طرف الغطاء عن وجهه، وتراجعت نحو الباب. مد الصبي الأكبر يده إلى أخته وساعدها على النهوض. كانت ساقاها لا تحملانها جيداً، فركع يانغ ووضع ذراعه تحت إبطيها.\u003c/p>\u003cp>«معي. خطوة فقط.»\u003c/p>\u003cp>خرج بها إلى الضوء، ثم أجلسها مع أمها عند الجارة، على اللوح الذي حمله معه. جلست الأم قربها، تسند ظهرها، وبقي الصبي واقفاً عند الستارة.\u003c/p>\u003cp>سأله لين: «هل يؤلمك رأسك؟»\u003c/p>\u003cp>أومأ.\u003c/p>\u003cp>«كل صباح؟»\u003c/p>\u003cp>«حين نغلق الباب ليلاً. أمي تقول من البرد.»\u003c/p>\u003cp>رفع لين الستارة وربط زاويتها فوق الباب. فتح النافذة أيضاً، ثم عاد إلى الموقد وأزاح الحطب المشتعل إلى مكان لا يطؤه أحد. لم يبدأ الهدم حتى انخفض الدخان وبانت حجارة الركن.\u003c/p>\u003cp>قالت الأم من الخارج: «إذا أطفأتم النار فلن تدفأ الغرفة قبل الليل.»\u003c/p>\u003cp>«سنعيدها قبل أن يشتد البرد.»\u003c/p>\u003cp>جلس يانغ عند المدخل، ووضع يده على الخشب الذي يحيط بفتحة المدخنة. ضغط عليه بإبهامه، فانفتت طرفه. أشار إلى لين أن يأتي ويراه. كان لا بد من تغيير القطعة قبل أن يحملها أحد وزن طين جديد. فتحا سلة الأدوات، وقاس العجوز اللوحين فوق ركبتيه، بينما أخذ لين ينزع الطين من حول الموقد.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>استغرق إصلاح البيت اليوم كله.\u003c/p>\u003cp>كان العمل شاقاً؛ فالبيت ضيق، ولين لم يعتد العمل وسط الدخان. أزال الطين المفكك من واجهة الموقد، وأبقى حجارة غرفة النار القديمة. نظف المجرى وفتح مدخلاً للهواء تحت النار، فيما جلب شياو دو من المنعطف طيناً ورملاً ورماداً. سد لين بالخلطة الفجوات الخارجية وثبّت الصفيحة التي تنظم سحب الدخان. لم يضع طيناً رطباً فوق النار؛ بقي الإصلاح الجديد خارج حجارة غرفة الاحتراق. وأعد يانغ لوحين يثبتان المدخنة إلى خشب السقف، ثم ناولهما إلى لين، وسنده وهو يرفع المجرى إلى أكثر من مثلي ارتفاعه القديم. سدا ثقوب القش، وتركا مكان الجلد المرقع ورقاً دهنياً يسمح بدخول الضوء.\u003c/p>\u003cp>كانت شين يان جالسة في بيت الجارة قرب موقدها، تحت لحاف، والرضيع بين ذراعيها ملفوف بغطائه، وقد سحبت طرف لحافها فوقه. والطفلان الآخران بجانبها، يشربان من وعاء ماء دافئ. وكانت تتحدث مع الأم بهدوء، بعيداً عن مسمع لين، تسألها عن الحطب وعن وقت اشتداد سعال الأطفال، وتصغي حين تتردد المرأة قبل الإجابة.\u003c/p>\u003cp>قرب الغروب مسح لين ذراعه، ونظر إلى يانغ. فحص العجوز وتدي المدخنة، ثم أومأ ليشعل النار.\u003c/p>\u003cp>أشعل الموقد بنفسه، بحفنة من القش وقطعتين رقيقتين، وأوصى المرأة ألا تزيد النار تلك الليلة حتى تجف مواضع الإصلاح.\u003c/p>\u003cp>ارتفع الدخان إلى أعلى. ارتفع كعمود رفيع مستقيم، ذهب مباشرة إلى فم المدخنة، وخرج. فتحوا الباب ليخرج الدخان القديم. وبعد قليل استطاع لين رؤية القش في السقف من موضعه عند الموقد، وبدأت حجارة الجدار تدفأ تحت كفه.\u003c/p>\u003cp>وقفت المرأة عند الباب. نظرت إلى النار. ثم إلى السقف الصافي.\u003c/p>\u003cp>وضعت يدها على فمها.\u003c/p>\u003cp>لم تقل شيئاً لدقيقة. ثم قالت بصوت يكاد لا يسمع:\u003c/p>\u003cp>«لا يوجد دخان.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«أنتم... كل هذا؟»\u003c/p>\u003cp>«كل هذا.»\u003c/p>\u003cp>«سأعطيك...» بحثت عن شيء. ثم، لأنه لم يكن عندها شيء، بدأت تخلع قرطها، قطعة صغيرة من النحاس، من أذنها.\u003c/p>\u003cp>رفع لين كفه. «دعيه في أذنك.»\u003c/p>\u003cp>«أنا لا أعرف...»\u003c/p>\u003cp>«لا أريد شيئاً.» قال. «أريد طلباً واحداً.»\u003c/p>\u003cp>حدقت فيه.\u003c/p>\u003cp>«حين يسألك أحد عنا، قولي ما رأيت. فقط ما رأيت. لا تزيدي ولا تنقصي.»\u003c/p>\u003cp>ارتعشت شفتاها. «وماذا رأيت؟»\u003c/p>\u003cp>لم يجب. نظر إلى الضوء في عينيها.\u003c/p>\u003cp>«رأيت...» قالت ببطء، وصوتها يتماسك. «رأيت رجلاً يخرج من الدخان ولا يطلب شيئاً.» ثم مسحت وجهها بكمها. «سأقول هذا.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في الصباح الباكر من اليوم التالي، قبل أن يفتح الطاحونة، مر لين بالنزل ليرى تشيو.\u003c/p>\u003cp>كان الشاب ممدداً على فراش في زاوية المطبخ قرب الموقد، ووجهه مغطى بقماش مبلل، وأنفه منتفخ كحبة بنجر، وعيناه محاطتان بدائرتين أرجوانيتين تميلان إلى الاخضرار. حين جلس لين على الأرض بجانبه، فتح عينه اليمنى.\u003c/p>\u003cp>«جئت تتفقدني.»\u003c/p>\u003cp>«جئت لأرى كم بقي من أسنانك.»\u003c/p>\u003cp>«ثلاثة أقل.» قال بصوت مغلق من الأنف المكسور، وفتح فمه ليريه الفجوات السوداء. «سيقول الناس إنني أفضل حالاً من قبل.»\u003c/p>\u003cp>لم يضحك لين. جلس صامتاً. «أمك؟»\u003c/p>\u003cp>«جاءت بالأمس.» أغمض عينه. «هي والعمة هو جلستا ساعة بلا كلام. ثم صفعتني.»\u003c/p>\u003cp>«صفعتك؟»\u003c/p>\u003cp>«على الخد السليم.» حاول أن يبتسم فتألم. «قالت: كان يجب أن تموت من أجل شيء أكبر.» ثم صمت. «ثم بكت.»\u003c/p>\u003cp>ولم يعرف لين ما يقول.\u003c/p>\u003cp>كان في حزامه شيء جديد. لم يكن قد رآه تشيو، لكنه رآه الصبي شياو دو في الصباح وسكت. مطرقة قصيرة من خشب البلوط الصلب، بطول الساعد، صنعها له العجوز يانغ البارحة دون أن يسأل لماذا. لها رأس عريض قصير، ومقبض لفه بخرقة كيلا ينزلق.\u003c/p>\u003cp>رأته شين يان حين خرج. نظرت إلى الحزام ثم إلى وجهه، ولم تعلق.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ثم ذهب إلى الأرامل.\u003c/p>\u003cp>كن ثلاثاً. الأولى صاحبة القدر المثقوب، العجوز النحيلة التي ضمت كيسها إلى صدرها يوم افتتاح الطاحونة. والثانية امرأة في الخمسين، ضخمة ضعيفة البصر، تعيش مع ابنتها العرجاء. والثالثة امرأة أقل منهما بخمس عشرة سنة، لها عينان لا تنظران إلى أحد.\u003c/p>\u003cp>وجدهن مجتمعات عند بئر القرية، يملأن الدلاء، ويتبادلن الكلام بأصوات خافتة. حين رأينه توقف الحديث.\u003c/p>\u003cp>قال: «أحمل لكن خبراً.»\u003c/p>\u003cp>لم يتحركن.\u003c/p>\u003cp>«بدءاً من هذا اليوم، وحتى آخر الشتاء، تطحن لكن الطاحونة بجزء من أربعين. نصف الأجر. حين تأتين كل واحدة بكيس، يؤخذ منه نصف الجزء الذي يؤخذ من غيركن.»\u003c/p>\u003cp>نظرت العجوز صاحبة القدر إليه.\u003c/p>\u003cp>«لماذا؟»\u003c/p>\u003cp>«لأن الشتاء قاسٍ.»\u003c/p>\u003cp>«وسيأخذ الناس هذا ويقولون: لماذا لهن؟»\u003c/p>\u003cp>«سيقولون.»\u003c/p>\u003cp>«وأنت تعرف.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>لم تقل شيئاً. تبادلت نظرة مع رفيقتيها، ثم قالت ببطء، بصوت حاد جاف: «ليست صدقة.»\u003c/p>\u003cp>«ليست صدقة.»\u003c/p>\u003cp>«أنا لا أقبل الصدقة.»\u003c/p>\u003cp>«أعرف. هو أجر مخفض. مثل أن يخفض صاحب الدكان لأقدم زبائنه.»\u003c/p>\u003cp>«وأنا أقدم زبائنك؟»\u003c/p>\u003cp>«كيسك أول كيس طحناه.»\u003c/p>\u003cp>ارتعشت شفتاها. ثم قالت: «حسن.» وعادت إلى دلوها. لكنها، حين مر لين، همست دون أن تلتفت: «يا بني. القدر الذي أعطيتكم. هل صنعتم به شيئاً؟»\u003c/p>\u003cp>«أطواق. في الدولاب.»\u003c/p>\u003cp>«أطواق.» كررت. «إذن هو يدور.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وقف العجوز يانغ في الساحة في اليوم التالي، وكان يوم وعد، والبرد يعضّ الأصابع.\u003c/p>\u003cp>لم يدعُ أحداً. كان الناس يأتون بأكياسهم إلى الطاحونة، فحاولت شين يان أن تقف عند الباب لتنظيم الدور، ورأى لين، من داخل الغرفة الحجرية، الجمع يتباطأ عند المدخل ويتهامس.\u003c/p>\u003cp>ثم سمع صوتاً، وكان لين واقفاً عند الترس يزيته، فتوقفت يده في الهواء.\u003c/p>\u003cp>كان صوتاً هرماً، مبحوحاً، جافاً كغصن، لا يشبه أحداً. صوت العجوز يانغ الذي لم يرفعه مرة منذ بدأ العمل:\u003c/p>\u003cp>«اسمعوا.»\u003c/p>\u003cp>التفت الناس.\u003c/p>\u003cp>وقف على جذع مقطوع قرب الباب، متكئاً على عصاه، وظهره مقوس، وقبضته مشدودة حول العصا.\u003c/p>\u003cp>«سمعت ما تقولون.» لم يرفع نبرته أكثر. «في الساحة. على الطرقات. في بيوتكم، حول المواقد.» نظر إلى كل واحد منهم، واحداً واحداً، كأنه يعد. «أنا نجار. أعمل بالخشب منذ ستين سنة. أعرف الأيدي.»\u003c/p>\u003cp>لم يتحرك أحد.\u003c/p>\u003cp>«رأيت أيديهما على الخشب أربعين يوماً. بنفسي. رأيت هذا الرجل في الماء المتجمد حتى خصره، يسحب وتد المحور بأصابع زرقاء. وكانت زوجته على الصخرة، تصرخ الأرقام، وهي حامل، وحذاؤها مبلل.» رفع عصاه قليلاً. «ومن رأيته يحمل جذوع البلوط في الماء المتجمد لا أتهمه بكلمة سمعتها عند البئر.»\u003c/p>\u003cp>خيم الصمت.\u003c/p>\u003cp>«إن رأى أحدكم رسالة أو سلاحاً أو رجلاً جاءهما في الخفاء، فليقل ما رأى.» أنزل العصا. «أما أنا فرأيتهما يحملان الأكياس والأوتاد. ورأيتهما يخرجان أطفالاً من بيت يخنقه الدخان.»\u003c/p>\u003cp>قالت امرأة من الصف الخلفي، بصوت غير واضح: «وماذا عن الحروف؟»\u003c/p>\u003cp>«أي حروف؟»\u003c/p>\u003cp>«التي تكتبها.»\u003c/p>\u003cp>نظر العجوز يانغ إليها طويلاً.\u003c/p>\u003cp>«أنا لا أقرأ.» قال. «ولا أنتِ. ولا أحد في هذه الساحة تقريباً. ومع ذلك أعرف أن من يكتب ما لا نعرف قد يكتب ما ننتفع به.» ثم، بصوت أقل حدة: «من منكم يعرف أن قيد الدين المكتوب يقول ما قُرئ عليه؟»\u003c/p>\u003cp>صمت.\u003c/p>\u003cp>«هذا ما أقوله. ومن أراد أن يختلف، فأنا هنا. في الطاحونة. كل يوم.»\u003c/p>\u003cp>ونزل عن الجذع بحذر، ومشى بين الناس الذين أفسحوا له طريقاً، ودخل الغرفة الحجرية، وجلس على كرسيه المعتاد، وأمسك بسكينه وخشبة صغيرة.\u003c/p>\u003cp>لم ينظر إلى لين. لكنه قال، بعد دقائق، دون أن يرفع رأسه:\u003c/p>\u003cp>«لا تشكرني. أنا أصحح أخطاء الأولاد فقط.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>وفي المساء، بعد أن انصرف الجميع، جلس لين وشين يان على الحجر المسطح قرب الدولاب المتجمد، يتقاسمان قطعة خبز.\u003c/p>\u003cp>قال: «الأرامل.»\u003c/p>\u003cp>«الأرامل.»\u003c/p>\u003cp>«قلت لك فكرتي.»\u003c/p>\u003cp>«قلتها. نصف الأجر.» حركت يدها على بطنها. «جزء من أربعين. طوال الشتاء.»\u003c/p>\u003cp>«ليس كرماً.»\u003c/p>\u003cp>«لا.» أخذت لقمة. «لكنهن يستطعن الآن أن يطحنّ قبل أن ينفد ما في بيوتهن. وستبقى لهن حبوب أكثر.»\u003c/p>\u003cp>«هل تظنين أن هذا يكفي؟»\u003c/p>\u003cp>«لا.» ابتسمت ابتسامة صغيرة متعبة. «لكنه عمل نقدر عليه. تركنا بيتاً بلا دخان في صدور أطفاله.»\u003c/p>\u003cp>«وإن بقي الكلام؟»\u003c/p>\u003cp>«نبقي الدقيق جيداً، والميزان صحيحاً.» نظرت إلى يديه المتشققتين. «أما أن يصدقنا الجميع غداً، فلا أعدك به.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ومنذ ليلة اليوم الثامن والتسعين، صار الأطفال الثلاثة في بيت الطرف الغربي ينامون من غير أن يوقظهم السعال.\u003c/p>\u003cp>لم يعرف لين بذلك إلا صباح اليوم المئة، حين وقف شياو دو عند باب الطاحونة وهو يتنفس بحماس:\u003c/p>\u003cp>«المرأة! المرأة صاحبة الدجاجتين! جاءت قبل الفجر إلى النزل!»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«قالت للعمة هو...» توقف ليلتقط نفسه. «قالت إنها استيقظت في منتصف الليل لأنها لم تسمع سعالاً. ثلاث مرات استيقظت لأنه لا يوجد سعال. وفي الثالثة، بكت.» ثم هز رأسه. «لا من الحزن. هكذا قالت. من الصمت.»\u003c/p>\u003cp>ولم يعلق لين.\u003c/p>\u003cp>في ذلك الصباح، حين فتح العم تيان باب الطاحونة وغطى عيني زاو، دخل رجل ضخم بحاجبين أبيضين، يحمل كيس دخن على كتفه بلا رقعة.\u003c/p>\u003cp>وانغ الأكبر. الرجل الذي أعطى سكتين وقدراً، وجاء إلى الطابور في أول يوم.\u003c/p>\u003cp>وضع الكيس عند الفتحة.\u003c/p>\u003cp>«أجر.» قال، وهو ينظر إلى الجدار. «جزء من عشرين. بالميزان.»\u003c/p>\u003cp>وقفت شين يان.\u003c/p>\u003cp>كانت يدها على قلبها لحظة، ثم أنزلتها، وأخرجت الميزان الخشبي من تحت المقعد.\u003c/p>"},{"n":27,"t":"الفصل السابع والعشرون: ثلاثة أفراد","b":"\u003cp>في اليوم التاسع بعد المئة، أحصت شين يان الأكياس عند الباب مرتين. منذ عودة وانغ الأكبر أخذ آخرون يأتون، يتوقفون قليلاً على العتبة، ثم يضعون أكياسهم قرب الحجر. وفي صباح اليوم السابق جاءت امرأتان من القرية الشمالية، لم يسبق لهما أن دخلتا الطاحونة، ووقفتا عند الباب تنظران إلى الترس الدوار وتسألان عن وقت الفراغ من الطحن، ثم دفعتا الأجر كاملاً بالنحاس. وسمع لين رنين النحاس في كف شين يان فرفع عينيه عن المحور وتبادل معها نظرة سريعة.\u003c/p>\u003cp>لم يعتذر أحد عما قيل، ولم يسأل لين أحداً عنه.\u003c/p>\u003cp>وفي ظهيرة اليوم التاسع بعد المئة، وقف تشيو عند باب الغرفة الحجرية لأول مرة منذ الاعتداء عليه، متكئاً على ذراع شياو دو، ووجهه ما زال بنفسجياً أصفر، وعلى زاوية فمه بقية دم جاف، لكنه ابتسم حين رأى الترس. قال وهو يحاول أن يعد دورات الأوتاد: «ما زال يدور. حسبته سيتوقف بدوني.»\u003c/p>\u003cp>«توقف يومين.» قال العجوز يانغ دون أن يرفع عينيه عن الإزميل.\u003c/p>\u003cp>«كذاب.»\u003c/p>\u003cp>«أنت المصاب. أنا لا أكذب على المصابين.» ثم رفع رأسه ونظر إلى الشاب نظرة طويلة، وأضاف: «تعال. أمسك هذا الوتد.»\u003c/p>\u003cp>أمسك تشيو الوتد بيد مرتجفة، وأخذ يصقله ببطء، وشياو دو يهمس له بنكتة، ولاو دونغ، الذي عاد قبل يومين دون أن يقول شيئاً، يقطع الحطب خلفهم بصمت. كلما رفع تشيو عينيه مال لاو دونغ إلى الحطب، وحين احتاج إلى قطعة أخرى مدها إليه من غير أن يطلب.\u003c/p>\u003cp>أحصت شين يان في دفترها ثمانية أكياس طُحنت بالأجر في ثلاثة أيام، وإحدى عشرة نحاسة من أجور دُفعت مقدماً ومن بيع الدقيق المدخر، ورقعتين ليوم وعد. لم يكن ذلك كثيراً. لكنه كان رقماً يرتفع، وأخذت تكتبه بخط واضح، وتسطر تحته.\u003c/p>\u003cp>وفي الليلة التاسعة بعد المئة، خلت الغرفة من النزلاء، وخفّ صوت الثلج على السقف. جلس لين وشين يان في المخزن على القش، وتحت الأغطية، في الظلام الأزرق الذي يتسلل من شق الباب، وعلى الصندوق شمعة لم يشعلاها؛ بقي من طولها أقل من إصبعين.\u003c/p>\u003cp>كانت تتحدث عن أرقام اليوم، عن الأكياس التي طُحنت والنحاسات الأربع، وكانت يدها تلعب بأزرار سترته من دون وعي. ثم توقفت في منتصف جملة. رفعت رأسها وقبلته، ببطء، قبلة طويلة دافئة بطعم الشاي، وضحكت في فمه ضحكة صغيرة لأن أنفاسه ارتفعت، وقالت: «لين. أنا ثقيلة.»\u003c/p>\u003cp>«أنتِ لستِ ثقيلة.»\u003c/p>\u003cp>«أنا كبيرة، وأحمل شيئاً في داخلي لا أعرف كيف أتحرك حوله.» لمست وجهه بأصابعها. «لكنني أشتاق.»\u003c/p>\u003cp>لم يسأل. أمسك وجهها، وقبّل جبينها، ثم عنقها حيث ينبض العرق الصغير تحت الأذن، ثم كتفها حين انزلق عنه ثوب الصوف. كانت أنفاسها تتقطع وهو يتحرك بحذر، بكفين متشققتين تتعلمان كيف تلمسان جسداً تغيّر، وكان الجلد تحتهما يتورد من البرد ومن غيره، وصدرها ثقيل ممتلئ بطريقة جديدة جعلها تشهق حين لمسه، فتجمد، فقالت: «لا. لا تتوقف. كان... كان جميلاً.»\u003c/p>\u003cp>لم يعد في المخزن برد. الأغطية فوقهما كخيمة، وحرارة جسديهما تتصاعد في الهواء الأزرق، وأصابعها في شعره، وهمسها بكلمات من لغتهما لا يفهمها أحد سواهما. قربها إليه برفق، وأرشدته بيدها حين احتاجت إلى أن يغير موضعه. ثم أخفت وجهها عند عنقه، وانسحب الغطاء فوق كتفيهما.\u003c/p>\u003cp>حين هدأ جسداهما، استلقت على جنبها ورأسها على ذراعه. أسندت بطنها إلى طرف الغطاء المطوي، وسحبت ركبتيها قليلاً كي تستريح. بقيا متلاصقين تحت الغطاء. كان قلبه يضرب قرب ظهرها، ثم أخذ إيقاعه يستقر مع أنفاسها.\u003c/p>\u003cp>قالت في العتمة: «لين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ضع يدك هنا.»\u003c/p>\u003cp>«أين؟»\u003c/p>\u003cp>أخذت يده وسحبتها ببطء تحت الأغطية، تحت السترة الصوفية، إلى جلدها. كان جلد بطنها دافئاً مشدوداً. بسط أصابعه برفق، ثم نظر إلى وجهها ينتظر أن تدله. وضعتها على الجانب الأيسر، قرب الأسفل.\u003c/p>\u003cp>«انتظر.»\u003c/p>\u003cp>انتظر.\u003c/p>\u003cp>مرت لحظات. سمع أنفاسها، وصوت الريح الخفيف على السقف، ونبضه هو في أذنيه. أوشك أن يسأل إن كانت الحركة قد انتهت، لكنها ضغطت على معصمه: انتظر.\u003c/p>\u003cp>دفعة.\u003c/p>\u003cp>لم تكن ارتجافة ولا رفرفة. كانت دفعة صغيرة قوية، حقيقية، من الداخل، ضغطت على وسط راحته من الجهة الأخرى، ثم سكنت.\u003c/p>\u003cp>انقطع نفسه.\u003c/p>\u003cp>«يان...»\u003c/p>\u003cp>«أحسست؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«قل لي إنك أحسست.»\u003c/p>\u003cp>«أحسست.» وجد صوته يرتجف. «أحسست يا يان. هذه...»\u003c/p>\u003cp>«حركة.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«لا شك فيها.» كان في صوتها ضحك مبحوح ودمع، لا تعرف أيهما يغلب. «ليست الأمعاء. ولا سمكة. ولا قصة نتخيلها. هذا هو.»\u003c/p>\u003cp>دفعة أخرى، أقوى، قرب أصابعه.\u003c/p>\u003cp>بسط كفيه فوق بطنها من غير أن يضغط، ودموعه تسيل من دون أن يعرف متى بدأت. حاول أن يقول شيئاً فاختنق صوته. أخفى وجهه عند كتفها، وأبقى راحته مبسوطة فوق الموضع نفسه.\u003c/p>\u003cp>ضحكت، وأمسكت رأسه بيديها وقبّلت شعره.\u003c/p>\u003cp>قالت: «يشبه أباه. لا يعرف ما يفعل.»\u003c/p>\u003cp>«وأمه تعرف؟»\u003c/p>\u003cp>«أمه تعرف أنها خائفة جداً.» همست. «لكنها سعيدة أكثر.»\u003c/p>\u003cp>بقيا هكذا، لا يعرفان كم، والحركة تعود كل دقيقة أو دقيقتين، خفيفة أحياناً، قوية أحياناً. وحين انتهت، وسكن الداخل كأن طفلاً نام بعد لعب، بقيت يده على بطنها لا تتحرك.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>هدأت حركة الطفل، وبقي لين مستيقظاً.\u003c/p>\u003cp>مررت شين يان إبهامها فوق يده ثم أغمضت عينيها. تذكر وعده القديم عند حديثهما عن النظام: كل رقم يعرفه، تعرفه هي أيضاً.\u003c/p>\u003cp>وكان قد أبقى سطراً.\u003c/p>\u003cp>فتح فمه، وأغلقه. ثم قال بصوت خفيض:\u003c/p>\u003cp>«يان.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أريد أن أقول شيئاً.»\u003c/p>\u003cp>شعر بها تتصلب، ببطء، تحت ذراعه. «شيء سيئ؟»\u003c/p>\u003cp>«لا أعرف.»\u003c/p>\u003cp>«أخبرني.»\u003c/p>\u003cp>أخذ نفساً. ثم أبعد يده عن بطنها، وجلس، وأسند ظهره إلى الجدار، ونظر إلى الظلام.\u003c/p>\u003cp>«في اليوم الأول. حين ظهر النظام لأول مرة.» توقف. «أخبرتك بكل ما قرأته. بالكلمات والنسب والأهداف. أعدت لك كل جملة. إلا واحدة.»\u003c/p>\u003cp>لم تقل شيئاً.\u003c/p>\u003cp>«قرأت لك: الوحدة الحضارية المسجلة، وبعدها لم أقل ماذا.»\u003c/p>\u003cp>«لم تقل.»\u003c/p>\u003cp>«قال: ثلاثة أفراد.»\u003c/p>\u003cp>مرت لحظة صمت طويلة.\u003c/p>\u003cp>«ثلاثة.»\u003c/p>\u003cp>«ثلاثة أفراد. الوحدة الحضارية المسجلة: ثلاثة أفراد.»\u003c/p>\u003cp>سمع حفيف الأغطية. كانت تجلس. أحس ببطء حركتها، وحذرها بسبب البطن، ثم بوجودها بجانبه في الظلام، جالسة، لا تلمسه.\u003c/p>\u003cp>«منذ اليوم الأول.»\u003c/p>\u003cp>«منذ اللحظة الأولى. في الحقل.»\u003c/p>\u003cp>«ثلاثة أشهر ونصف.»\u003c/p>\u003cp>«أكثر. مئة وتسعة أيام.»\u003c/p>\u003cp>«وكتمتها.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«كل يوم.»\u003c/p>\u003cp>سحبت شين يان طرف الغطاء من تحته، فانتبه إلى أنه كان يجلس عليه. تحرك ليفسح لها، لكنها لم تعد إلى مكانها. بقيت بينهما مساحة لا تكاد تسع كفاً، ورآها لين أوضح من كل ما في الغرفة.\u003c/p>\u003cp>قال: «ظننت أنني سأخبرك حين أعرف أكثر.»\u003c/p>\u003cp>«ومتى كان سيأتي ذلك اليوم؟»\u003c/p>\u003cp>لم يجب.\u003c/p>\u003cp>«قبل الولادة؟ بعدها؟ حين يختفي الرقم؟»\u003c/p>\u003cp>وضع يديه على ركبتيه. كانت تشققات جلده تحك الصوف، فقبض أصابعه حتى توقف الصوت.\u003c/p>\u003cp>قالت: «كان يمكن أن تقرأه وتقول: لا أفهم. أجلس معك، ولا نفهم معاً. هذا كل ما كنت أريده.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«لا تقل نعم بسرعة. اسمعني أولاً.»\u003c/p>\u003cp>رفع رأسه نحوها. خرج من خلف الجدار سعال نائم، ثم احتك حذاء بالأرض في الممر. انتظرت شين يان حتى ابتعد الصوت، وأكملت بلغتهما الأصلية، أخفض من قبل.\u003c/p>\u003cp>«حين تحدثني عن شيء لا أراه، ليس عندي إلا كلامك. لا أستطيع أن أقلب الصفحة أو أنظر من فوق كتفك. هل تفهم؟»\u003c/p>\u003cp>بقي ينظر إليها، ثم أومأ ببطء هذه المرة. لم يمد يده إليها، مع أنه كان يريد ذلك أكثر من أي جواب يستطيع أن يقوله.\u003c/p>\u003cp>«كل يوم.»\u003c/p>\u003cp>«حتى بعدما اتفقنا؟ بعدما قلت: كل رقم؟»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>ثم لم تتكلم لمدة طويلة، وأعمق ما كان في ذلك الصمت هو أنها لم تكن تتنفس بصوت.\u003c/p>\u003cp>قال: «يان...»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«دعيني أشرح...»\u003c/p>\u003cp>«شرحت.» كان صوتها هادئاً بشكل مخيف. «قلت لي: كل رقم تعرفه، أعرفه. وسألتك بعدها مراراً: هل هناك شيء آخر؟ وكنت تقول: لا.»\u003c/p>\u003cp>فتح فمه، فأوقفته بحركة من يدها. أخذت نفساً حاداً. «ولم أقل لك: الأرقام وحدها. قلت: كل شيء. كل رقم يعني كل شيء.»\u003c/p>\u003cp>«لم أكن أعرف ماذا يعني.»\u003c/p>\u003cp>«أنت لا تعرف ماذا تعني نصف ما يقوله لك. هل كنت تخبرني فقط بما تفهمه؟»\u003c/p>\u003cp>لم يرد.\u003c/p>\u003cp>«أنا غاضبة.» قالتها ببطء، وكفها على الغطاء بينهما. «غاضبة حقاً. لا أريد أن أنام بجانبك وأتظاهر بأن شيئاً لم يحدث. هذا السطر يؤلمني، وإخفاؤك إياه أكثر.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«لا تعرف.» ثم صمتت لحظة. «ليس لأنه سطر. لأنك اخترت. أنت جلست في اليوم الأول، وأنا أمامك أرتجف من البرد، وقلت لنفسك: أخفي هذا عنها. اخترت أن تحميني من شيء. ولم تسأل إن كنت أريد أن أُحمى.»\u003c/p>\u003cp>أطرق في الظلام.\u003c/p>\u003cp>«كنت خائفاً.»\u003c/p>\u003cp>«من ماذا؟»\u003c/p>\u003cp>«من أن يعني ما أخشاه.»\u003c/p>\u003cp>«وما هو؟»\u003c/p>\u003cp>لم يستطع أن يقول. تلعثم، وبحث عن كلمات، وفي النهاية خرج الجواب أصغر من السؤال:\u003c/p>\u003cp>«أن يكون النظام يعدّه.»\u003c/p>\u003cp>وتذكر ما رآه في تلك اللحظة في الحقل المحصود: يدها على بطنها قبل أن تقول شيئاً، وهي تحاول أن تطمئن إلى أن جسدها لم يصبه شيء. وتذكر أنه رأى السطر ثم رآها، وجمع الاثنين في رأسه، وأحس بشيء يتجمد في صدره لا علاقة له بالبرد. كانت في الشهر الثالث. ولم تكن تعرف بعد إن كان الجنين قد سلم من الانتقال. والنظام قال: ثلاثة.\u003c/p>\u003cp>مد يده نحوها، ثم تركها تسقط فوق الغطاء. منذ الحقل كان يؤجل الحديث إلى يوم يفهم فيه السطر. ومضى يوم وراء يوم، وكلما سألته صار قول الحقيقة أصعب.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم تتحرك.\u003c/p>\u003cp>اتسعت عيناه في العتمة، وبان له طرف خدها قرب شق الباب. رأى ظلها الجالس، رأسها المنحني قليلاً، يداها على بطنها.\u003c/p>\u003cp>«يعدّه.»\u003c/p>\u003cp>«الوحدة الحضارية. ثلاثة أفراد. أنا وأنتِ.» أخذ نفساً. «ولم يكن الحمل مرئياً حينها. ولا حتى بعد شهر. لا أحد في القرية عرف حتى أخبرتهم. ومع ذلك، منذ اللحظة التي ظهر فيها النظام، قال: ثلاثة.»\u003c/p>\u003cp>«ماذا يعني هذا؟»\u003c/p>\u003cp>«لا أعرف.»\u003c/p>\u003cp>«ماذا قال النظام حين سألته؟»\u003c/p>\u003cp>«لم أسأله.»\u003c/p>\u003cp>«لم تسأله؟»\u003c/p>\u003cp>«لم أجد في الرسائل التي يعرضها ما يفسره. ولم أعرف كيف أسأله.» رفع يديه، ثم أنزلهما. «وفي اليوم الذي يولد فيه، لا أعرف. ربما يتغير الرقم.»\u003c/p>\u003cp>«أو لا يتغير.»\u003c/p>\u003cp>«أو لا يتغير.»\u003c/p>\u003cp>صمتت. ثم قالت ببطء، كأنها تتحسس حافة شيء في الظلام:\u003c/p>\u003cp>«ماذا يعني أن يرى النظام ما لا نراه؟»\u003c/p>\u003cp>«ربما لا شيء.»\u003c/p>\u003cp>«أو يعني أنه عرف من البداية.» توقفت. «كل شيء. في اللحظة التي ابتلعنا فيها الضوء. أن في الغرفة ثلاثة.»\u003c/p>\u003cp>لم يقل شيئاً.\u003c/p>\u003cp>«أرجوك قل شيئاً.»\u003c/p>\u003cp>«لا أعرف.»\u003c/p>\u003cp>كانت تتنفس بعمق الآن، بطيئاً، كمن يدرب نفسه. وأخذ لين ينتظر، ويداه ترتجفان في حجره، بلا أن يجرؤ على لمسها.\u003c/p>\u003cp>ثم قالت:\u003c/p>\u003cp>«هل هناك غيره؟»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«سطور أخرى. هل هناك شيء آخر لم تخبرني به؟»\u003c/p>\u003cp>فكر. لم يكن يكذب حين فكر. مرّ في ذهنه كل ما رآه في الأشهر الماضية: الطاقة، والتكامل، والمؤشر، والتخزين، والأهداف. المكوّن. الحجر. أرقام وأرقام.\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«تقسم؟»\u003c/p>\u003cp>«أقسم.»\u003c/p>\u003cp>مدّت يدها في الظلام، وأمسكت معصمه. كانت أصابعها باردة، وقبضتها قوية.\u003c/p>\u003cp>«سأصدقك.» قالت. «لأنني لا أستطيع إلا أن أصدقك. لكن اسمعني جيداً.»\u003c/p>\u003cp>«أسمعك.»\u003c/p>\u003cp>«لن أسامحك الليلة. ولن أنام وأنا أتظاهر بأنني فعلت.» ضغطت على معصمه. «قد أسامح غداً. لا أعرف. لكنني لن أخدع نفسي لأن الحقيقة سيئة.»\u003c/p>\u003cp>«لا أطلب أن...»\u003c/p>\u003cp>«أنا أطلب.» نبرة مختلفة، أقل حدة. «أنا أطلب ألا يتكرر. أن تأتيني بالسطر حين تراه، قبل أن تفهمه، لا بعد أن تفهمه.» أخذت نفساً. «أنا لست امرأة تحتاج إلى حماية من الأرقام. أنا من يقرأ الأرقام.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«إذن قلها.»\u003c/p>\u003cp>«كل سطر.»\u003c/p>\u003cp>صمتت.\u003c/p>\u003cp>ثم قالت بصوت أهدأ، ولأول مرة منذ بدأ الحديث ينكسر قليلاً:\u003c/p>\u003cp>«يعني أنه كان معنا منذ اللحظة الأولى.»\u003c/p>\u003cp>«من؟»\u003c/p>\u003cp>«هو.» وضعت يدها على بطنها. «لم ننتظره حتى يولد. كان في الحقل. كان في الظلام الذي ابتلعنا. كان في الرقم قبل أن نعرف أن هناك رقماً.» ابتسمت، ولم يكن في ابتسامتها فرح خالص، بل شيء أعمق. «والنظام عرف.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«ولم يقل لنا ماذا يعني ذلك.»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«إذن علينا أن نفترض أن النظام يرى أشياء لا نراها.» فكرت. «وأن هذا ليس بالضرورة خيراً. ولا بالضرورة شراً.»\u003c/p>\u003cp>«لا بالضرورة.»\u003c/p>\u003cp>«هل هو الآن أمامك؟ السطر؟»\u003c/p>\u003cp>«في الزاوية.» لم يركز على شيء. «يظل هناك، حتى حين لا أطلب تحليلاً.»\u003c/p>\u003cp>«اقرأه لي.»\u003c/p>\u003cp>قرأه، كلمة كلمة، ببطء، وهو ينظر إلى الموضع الذي تظهر فيه الكلمات: «الوحدة الحضارية المسجلة: ثلاثة أفراد.»\u003c/p>\u003cp>«ثلاثة.» رددتها بهدوء. «ثلاثة.» ثم قالت: «لا تحلل شيئاً الليلة.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«لا تفتح النظام. لا تسأله. لا تركز على شيء.» ضغطت على يده. «أريد فقط أن أجلس هنا. ومعي يداك. ومعي هذا.» وأشارت إلى بطنها. «ثم نفكر غداً.»\u003c/p>\u003cp>وبقيا جالسين في العتمة، دون كلمة، حتى أحست شين يان بحركة صغيرة تحت كفها. تناولت يد لين من فوق الغطاء.\u003c/p>\u003cp>وضعت هي يده على بطنها مرة ثانية.\u003c/p>\u003cp>قالت، وهي تنظر إلى الظلام الأزرق كأن أمامها كتابة لا يراها أحد:\u003c/p>\u003cp>«من الآن، كل سطر. لا كل رقم فقط.»\u003c/p>\u003cp>«كل سطر.»\u003c/p>"},{"n":28,"t":"الفصل الثامن والعشرون: الشتاء طويل","b":"\u003cp>في صباح اليوم العاشر بعد المئة، استيقظت شين يان قبله، وظلت تراقب وجهه حتى فتح عينيه.\u003c/p>\u003cp>وحين فتح عينيه قالت، دون تحية: «سامحتك.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«فكرت طوال الليل.» كان شعرها منفوشاً على كتفيها، ووجهها منتفخ قليلاً من قلة النوم. «غضبي لم يذهب. لكنني لا أريد أن أعيش بجانب غضب يكبر. أريد أن أضعه على الطاولة، حيث يمكن أن أراه.» أخذت يده ووضعتها على بطنها. «سامحتك. وإن أخفيت سطراً آخر، فلن أسامح.»\u003c/p>\u003cp>«لن أخفي.»\u003c/p>\u003cp>«أعرف.» ابتسمت ابتسامة متعبة. «لهذا سامحت.»\u003c/p>\u003cp>تحرك الطفل تحت كفه دفعة صغيرة، فسكتا لحظة. لم تنزع يدها من يده حين جلست. جمع لين الغطاء عند قدميها وأبعد عنها حذاءه، ثم صب آخر الماء في الكوب. ناولها إياه وانتظر حتى شربت.\u003c/p>\u003cp>قال: «لن أعيد الكلام الذي قلته ليلاً. سأنقل لك ما يظهر كما هو.»\u003c/p>\u003cp>«وإن رأيت ما يخيفك؟»\u003c/p>\u003cp>«أخبرك أنني خائف، وأقرأه لك.»\u003c/p>\u003cp>أعادت الكوب إلى الصندوق، وتنفست ببطء. ثم سحبت الوشاح من تحته ولفته حول رقبتها. كانت لا تزال تتعب عند الانحناء، فناولها لين الخرق التي تلف بها قدميها.\u003c/p>\u003cp>«اليوم تراجع معي حساب الأمس»، قالت.\u003c/p>\u003cp>«أظن أنك راجعته مرتين.»\u003c/p>\u003cp>«ستراجعه أنت هذه المرة.»\u003c/p>\u003cp>أومأ، وفهم أنها لا تتحدث عن الجمع وحده. جلس إلى جوارها، وأمسك طرف الخيط حتى ربطت الخرقة حول كاحلها. وحين وقفت، أعطاها ذراعه إلى الباب، ثم خرجا إلى المطبخ معاً.\u003c/p>\u003cp>خلال الأيام الخمسة التالية، أخذت الطاحونة تستعيد زبائنها.\u003c/p>\u003cp>لم يعد الصمت صمت الحجر الفارغ. صار في الغرفة الحجرية في الصباح طابور قصير أمام الفتحة: رجال ونساء بأكياسهم، يتبادلون أخبار الطقس والحمير، ويتجنبون النظر إلى الغريبين. ولم يتجنبوا دفع الأجر. جزء من عشرين بالميزان، أمام أعينهم، ثم يغادرون وفي أكياسهم دقيق ناعم مغربل.\u003c/p>\u003cp>أحصت شين يان في الدفتر: أربعة أكياس في اليوم الأول، وأربعة ونصفاً في الثاني، وفي اليوم الثالث رفضت أن تطحن أكثر لأن الحمار تعب، وعاد الناس في الغد. وكان معظم الأجر نحاساً مقبوضاً بدلاً من الحبوب، بعد أن صار بعضهم، مثل الجزار، يفضل دفع النحاس والاحتفاظ بحبوبه.\u003c/p>\u003cp>والإشاعة لم تمت.\u003c/p>\u003cp>كان لين يسمعها أحياناً في الأزقة، بصوت أخفض وأكثر تردداً، كنار تحت رماد. «لكن الأيدي...» «ومن أين جاءت المعرفة؟» «هل تعرف أنها تكتب حتى الآن؟» لكن الجمل كانت تنتهي الآن بسكوت، لا بحكم. وحين مرت امرأة بباب الطاحونة ونظرت إلى شين يان الجالسة على مقعدها بدفترها، لم تشر إليها. فقط أومأت برأسها إيماءة قصيرة، وأسرعت.\u003c/p>\u003cp>كان ذلك أكثر مما توقعاه.\u003c/p>\u003cp>وفي ظهيرة اليوم الخامس عشر بعد المئة، جاء رجل لا يحمل كيساً.\u003c/p>\u003cp>وقف عند باب الغرفة الحجرية، في الضوء، متكئاً على الإطار. كان في أواخر العشرين، وجهه عادي، سترته المبطنة بنية جيدة. نظر إلى الترس، وإلى زاو الذي يدور في الخارج، وإلى العجوز يانغ جالساً بسكينه، ثم إلى لين.\u003c/p>\u003cp>«السيد لين.»\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«أرسلني السيد تشيان.» ابتسم، ثم انتظر حتى التفت إليه يانغ وشياو دو. «يسأل كم تطحنون في اليوم. فهو يحب أن يعرف الأرقام.»\u003c/p>\u003cp>لم يرد لين. كان ينظر إلى قدميه.\u003c/p>\u003cp>الحذاء جلد أسود، مصقول. وفي الثلج الذي ذاب على العتبة قليلاً، ترك الكعب أثراً: مربع.\u003c/p>\u003cp>«أربعة أكياس ونصف في اليوم.» قال.\u003c/p>\u003cp>«في أحسن الأيام؟»\u003c/p>\u003cp>«إذا لم يتعطل شيء. وفي يوم الوعد نطحن منها ما وعدنا به بلا أجر.»\u003c/p>\u003cp>«حسن.» أومأ الرجل. «سأبلغه.» ثم أضاف، وهو يرفع عينيه إلى الحزام: «لك مطرقة جديدة.»\u003c/p>\u003cp>وضع لين يده على المقبض الخشبي، ببطء.\u003c/p>\u003cp>«نعم.»\u003c/p>\u003cp>«جميلة.» وخفض عينيه إلى المقبض مرة أخرى. «الشتاء طويل ويصعب أن يعرف المرء لماذا يحتاج إليها.»\u003c/p>\u003cp>ثم انحنى، ومضى. بقي لين واقفاً حتى اختفى صوت الحذاء على الجليد. لم يرفع يده عن المقبض، ولم يلحق بالرجل.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء تشانغ بعد الظهر.\u003c/p>\u003cp>ولم يكن وحده. كان يحمل على كتفه حزمة ملفوفة بجلد قديم، وخلفه شياو دو يحمل حزمة أخرى، وعلى وجه الصبي تعبير من يعرف شيئاً مهماً ولا يستطيع أن يقوله.\u003c/p>\u003cp>وضع تشانغ الحزمة على الصخرة المسطحة قرب الدولاب المتجمد، وفكّ الجلد. ظهرت تحته سكة محراث.\u003c/p>\u003cp>لم تكن سكة عادية. أثقل وأعرض، سوداء لامعة، وحافتها السفلى بيضاء من التجليخ. وعلى طرفها حرف صغير منقوش.\u003c/p>\u003cp>قال: «من الحديد القديم.»\u003c/p>\u003cp>أمسكها لين. كانت ثقيلة، متوازنة، لا تهتز في اليد. دق عليها بظفره فأعطت رنيناً صافياً طويلاً، ليس كصوت قضبان تشيان المكسورة.\u003c/p>\u003cp>«كم أخذت من الوقت؟»\u003c/p>\u003cp>«أربعة أيام.» رفع كتفيه. «من أربع سكك مكسورة. واحدة جيدة.»\u003c/p>\u003cp>«واحدة.»\u003c/p>\u003cp>«الباقي ذهب في التنقية.» حك أذنه الصماء. «لكنها جيدة.»\u003c/p>\u003cp>سأل لين: «وكم سكة مكسورة في القرية؟»\u003c/p>\u003cp>«ثمانون. ربما تسعون.» نظر إلى الأرض. «تنتظر الربيع. عند الأرض اللينة، يخرج الفلاحون سككهم المكسورة، ويأتون إلي. وأنا أصنع واحدة في أربعة أيام.»\u003c/p>\u003cp>حسب لين: الثمانون المكسورة لا تعطي بهذه الطريقة إلا عشرين سكة جيدة. وإذا احتاج الفلاحون إلى ثمانين جديدة، فذلك ثلاثمئة وعشرون يوماً من العمل، وحديد أكثر مما جمعوه. ولم يبق للربيع إلا نحو شهرين.\u003c/p>\u003cp>لم يقل ذلك. لكن تشانغ راقب وجهه، فقال: «أعرف.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«أعرف أنني لا أستطيع وحدي. لم أكن أستطيع. لهذا يخرج بعض عملي دون ما أريده.» نظر إليه. «لا يهم. سأبدأ.»\u003c/p>\u003cp>ثم أضاف، وكأنه يتخلص من وزن: «الصبي يقول إنك تعرف عمالاً.»\u003c/p>\u003cp>نظر لين إلى شياو دو. ابتسم الصبي ابتسامة مسروقة.\u003c/p>\u003cp>«سنتكلم.» قال لين. «لكن لا الآن. الآن نحتاج إلى الربيع كي يأتي. وإلى حطب.»\u003c/p>\u003cp>«وما علاقة الحطب؟»\u003c/p>\u003cp>«الحديد يأكل الحطب كما تأكل القرية الخبز.» تذكر كومة الفحم الصغيرة قرب سندان تشانغ، وكيف كان الحداد يجمع فتاتها بيديه. «لن تصنع ثمانين سكة بحطب هو سانيانغ.»\u003c/p>\u003cp>سكت تشانغ. ثم قال ببطء: «أعرف رجلاً في الجبال.»\u003c/p>\u003cp>«أي رجل؟»\u003c/p>\u003cp>«يحرق الفحم. من خشب البلوط والزان. يبيع الفحم لتشيان.» مرر إبهامه على السكة. «ثم يبيعه تشيان لنا بضعف ما دفع.»\u003c/p>\u003cp>نظر لين إلى شياو دو، ثم أعاد السكة إلى جلدها. إذا احتاجوا إلى فحم أكثر فسيمر ثمنه من يد تشيان، مثل ثمن الحديد المغشوش. سأل الحداد عن الطريق، لكنه هز رأسه: الجبل ينتظر حتى يخف الثلج.\u003c/p>\u003cp>«حين تريد.» ثم حمل الحزمة الأخرى ووضعها على الصخرة. «هذه لك. لا شكر.»\u003c/p>\u003cp>فتح لين الجلد. ظهرت مطرقة صغيرة، في آخر مقبضها ثقب يمر منه رباط، ورأسها مدور ثقيل.\u003c/p>\u003cp>كان حديدها مقسّى مصقولاً، وطولها نحو ساعده. قلبها في يده، وأدخل إبهامه تحت رباطها. كانت أثقل كثيراً من مطرقة يانغ الخشبية.\u003c/p>\u003cp>نظر إلى تشانغ.\u003c/p>\u003cp>«الأولاد يقولون إن طريق الجسر مظلم بالليل.» قال الحداد دون أن ينظر إليه. «والبلوط يتشقق.»\u003c/p>\u003cp>ثم مضى.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في مساء ذلك اليوم نفسه، طلبت هو سانيانغ أن تتحدث إليهما.\u003c/p>\u003cp>وقفت عند باب المخزن بعد العشاء، وفي يدها مصباح زيت، وقالت بصوت جاف: «في المطبخ.» ثم مضت.\u003c/p>\u003cp>دخلا خلفها. كان المطبخ ساخناً كعادته، والنار في الموقد منخفضة، وشياو دو غائب. جلست هو سانيانغ على كرسيها المعتاد قرب النار، وقدماها على الحجر الدافئ، وأمامها الطاولة، وعليها لا كتاب ولا شيء.\u003c/p>\u003cp>لم تدعُهما إلى الجلوس. وقفا.\u003c/p>\u003cp>قالت: «الوكيل.»\u003c/p>\u003cp>أحس لين بشين يان تتصلب بجانبه.\u003c/p>\u003cp>«جاءني أمس.» كان صوتها هادئاً، منتظماً، وهي تتابع بصرها الشق في حجر الموقد. «في الظهيرة. جاء إلى النزل نفسه. جلس هناك.» أشارت بذقنها إلى الكرسي الذي يجلس عليه التجار. «طلب شاياً. شربه كله.»\u003c/p>\u003cp>«ماذا قال؟»\u003c/p>\u003cp>«قال إنه يعرف أنني كفيلة لكما.» لم تتحرك. «وقال إن الكفالة، في هذا الشتاء، قد تكلفني أكثر مما أظن.»\u003c/p>\u003cp>لم يتكلم أحد.\u003c/p>\u003cp>«لم يقل ماذا يعني ذلك.» أضافت. «ولم يهددني. هو لا يهدد. هو يخبر.» أغمضت عينيها لحظة وفتحتهما. «لكنني فهمت.»\u003c/p>\u003cp>نظرت شين يان إلى يد هو سانيانغ، ثم إلى الرف الذي كانت تضع عليه كتاب الحسابات.\u003c/p>\u003cp>قالت: «الدين.»\u003c/p>\u003cp>لم ترد هو سانيانغ.\u003c/p>\u003cp>«هو الذي يقصده.» همست شين يان. «الدين القديم. الذي...»\u003c/p>\u003cp>«لا تقولي.» قالت هو سانيانغ بنبرة لم تكن حادة، لكنها كانت مغلقة كباب. «لا تقولي الكلمة. ليس في هذه الغرفة.»\u003c/p>\u003cp>سكتت شين يان.\u003c/p>\u003cp>قال لين، بعد صمت: «وماذا قلتِ له؟»\u003c/p>\u003cp>التفتت هو سانيانغ إليه. وبقيت يدها على حافة الطاولة.\u003c/p>\u003cp>«قلت له إن كفالتي في دفتر الحكومة.» رفعت ذقنها. «لا في دفتره.»\u003c/p>\u003cp>ظل الصمت.\u003c/p>\u003cp>«وقلت له إن النزل نزلي. وإن الباب مفتوح لمن أشاء.» أخذت نفساً. «وإنني لم أدعه إلى الجلوس. هو جلس.»\u003c/p>\u003cp>«وهل رحل؟»\u003c/p>\u003cp>«رحل. بعد أن دفع ثمن الشاي.» ضحكت ضحكة قصيرة لا تحمل شيئاً. «بنحاس كامل.»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>ثم نهضت.\u003c/p>\u003cp>لم يتوقع لين ما فعلته. نهضت ببطء، كأنها تحمل شيئاً ثقيلاً، ودارت حول الطاولة نحو الموقد. أخذت من الرف وعاءين خشبيين كبيرين. وضعتهما على الطاولة، واحداً بجانب الآخر، ثم أخذت المغرفة الكبيرة ومضت إلى القدر على النار.\u003c/p>\u003cp>ملأت الوعاء الأول بعصيدة الدخن الساخنة، وعليها قطع من لحم مقدد ثخينة، وملعقة من البصل المقلي. ثم الثاني. ثم وضعت قطعتين من الخبز الطازج بجانب كل وعاء، بلا تعليق.\u003c/p>\u003cp>لم تقل شيئاً. لم تنظر إليهما.\u003c/p>\u003cp>كانت عيناها على يديها وهي تضع الملاعق. وحين انتهت، وقفت خلف الطاولة، ويداها على حافتها، ونظرت إلى الأمام، إلى الجدار الأبيض.\u003c/p>\u003cp>وقالت بصوت منخفض:\u003c/p>\u003cp>«كُلا.»\u003c/p>\u003cp>لم يتحرك أحد.\u003c/p>\u003cp>دفع البخار وجه لين حين انحنى فوق وعائه. قربت هو سانيانغ طبق البصل من شين يان، ثم رجعت إلى النار من غير أن تنتظر جواباً.\u003c/p>\u003cp>جلست شين يان أولاً. أخذت الملعقة بيد ترتجف، وبدأت تأكل.\u003c/p>\u003cp>وجلس لين.\u003c/p>\u003cp>كانت العصيدة حارة، ثقيلة، بنكهة لم يتذوقها منذ الخريف، حين كانت البداية. وقف أمامه الموقد يتنفس خلف هو سانيانغ، ولم يسمع في المطبخ إلا احتكاك الملاعق بأطراف الوعاءين.\u003c/p>\u003cp>حين انتهت شين يان، رفعت رأسها. قالت، بصوت خافت:\u003c/p>\u003cp>«هو سانيانغ. أنا...»\u003c/p>\u003cp>«لا.»\u003c/p>\u003cp>«لم أنهِ.»\u003c/p>\u003cp>«لا حاجة.» لم ترفع هو سانيانغ عينيها عن النار. «خذي الوعاء إلى الخارج حين تنتهين. شياو دو ينام.»\u003c/p>\u003cp>لكن لين رأى أن زاوية فمها، لحظة، تحركت.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>في صباح اليوم السادس عشر بعد المئة، غطى ثلج خفيف الدرب إلى الطاحونة.\u003c/p>\u003cp>كان لين على الطريق إلى الطاحونة، يحمل المطرقة الجديدة في حزامه، ويفكر في السكك الثمانين، حين سمع الأصوات من جهة بوابة القرية.\u003c/p>\u003cp>لم تكن أصواتاً عادية. أصوات منخفضة، مبحوحة، متداخلة. وبكاء طفل. وأنين.\u003c/p>\u003cp>توقف، ثم سار نحو البوابة.\u003c/p>\u003cp>كانت بوابة القرية الخشبية، التي رآها يوم وصل، مفتوحة على اتساعها، والكلاب الثلاثة النحيلة الصفراء واقفة أمامها لا تنبح. وعلى الدرب الذي يؤدي إلى الجنوب، في الثلج، جماعة من البشر.\u003c/p>\u003cp>كانوا عشرين تقريباً، لا أكثر. رجال ونساء وأطفال، بثياب ممزقة لا تتناسب مع البرد، ملفوفين بخرق وأغطية وأكياس خيش. وجوههم رمادية من الجوع، وعيونهم غائرة، وأيديهم متشققة حتى النزف. وبعضهم حافي القدمين، وأقدامهم ملفوفة بخرق مبللة، ملطخة بالدم الأسود.\u003c/p>\u003cp>وقف في المقدمة رجل نحيل طويل، بلحية مغبرة، يحمل بين ذراعيه طفلاً ملفوفاً بقماش أزرق.\u003c/p>\u003cp>لم يكن ما يحمله ثقيلاً. كان يحمله كما يحمل الناس ما لا يستطيعون أن يتركوه.\u003c/p>\u003cp>حين رآه لين، رأى القماش ينفرج قليلاً عند الأعلى، ويظهر منه وجه صغير. عينان مغمضتان، وشفتان زرقاوان، وبشرة بلون الشمع.\u003c/p>\u003cp>طفل. ميت.\u003c/p>\u003cp>كان الرجل يحدق في الأرض أمامه، لا في أحد. ولما رفع رأسه، توقفت عيناه على دخان أول بيت، ثم انخفضتا إلى الطفل في ذراعيه.\u003c/p>\u003cp>«نريد مأوى.» قال بصوت مبحوح، جاف، بلهجة غريبة. «أي مأوى. حظيرة. أي شيء.» أخذ نفساً. «لم نستطع... لم نستطع أن ندفنه. الأرض...» ولم يكمل.\u003c/p>\u003cp>وخلفه امرأة أخرى رفعت ذراعها المقيدة بقماش متسخ. تحته جرح عميق أسود على الساعد، منتفخ، تسيل منه رطوبة صفراء، وتفوح منه رائحة حلوة مقززة تعرفها كل غرفة جرحى. قالت بصوت واهن: «قطاع طرق. على الطريق، قبل أسبوع. أرسلوا رجلين... ثلاثة...»\u003c/p>\u003cp>وتحرك رجل آخر من الجماعة، شاب أنحف، يتكئ على عصا. نظر إلى القرية، إلى الأسقف، إلى الدخان الأبيض. وقال بصوت مرتجف:\u003c/p>\u003cp>«هل هنا أحد من قرى النهر الكبير؟»\u003c/p>\u003cp>لم يجبه أحد. كان الجميع واقفين، صامتين.\u003c/p>\u003cp>وفي تلك اللحظة، سمع لين وقع خطوات صغيرة سريعة تأتي من خلفه، وصوت أنفاس لاهثة. وجاء شياو دو، يركض من اتجاه النزل، يبحث عن شيء، ووجهه مضيء بفرح بريء لم يرَ الدم ولا الطفل الملفوف.\u003c/p>\u003cp>لم ينتبه إلى وجوه الناس. سمع فقط ما سُئل. وصاح قبل أن ينظر إلى ما يحمله الرجل:\u003c/p>\u003cp>«عندنا اثنان!»\u003c/p>\u003cp>ورفع الشاب المتكئ على العصا رأسه ببطء.\u003c/p>\u003cp>لم يكن في عينيه فرح بعد. تحرك بصره من شياو دو إلى وجوه الواقفين، وتقدم خطوة مستنداً إلى عصاه.\u003c/p>\u003cp>وسمع لين خلفه خطوات ثقيلة بطيئة على الثلج، وأنفاساً قصيرة معروفة. لم يلتفت. عرف من يقف خلفه.\u003c/p>\u003cp>شد لين أصابعه على حزامه. خلفه كانت شين يان قد توقفت عن المشي. الجنوب الذي قالا إنهما جاءا منه يقف الآن أمامهما، ويسأل عن أهله.\u003c/p>"},{"n":29,"t":"الفصل التاسع والعشرون: أسماء الجنوب","b":"\u003cp>ظل شياو دو رافعًا يده في صباح اليوم السادس عشر بعد المئة، يشير إلى لين كأنه يدل مسافرًا على بيت يعرفه. ثم رأى ما بين ذراعي الرجل الطويل، فانخفضت يده.\u003c/p>\u003cp>قال الشاب المتكئ على العصا: «أنت من هناك؟»\u003c/p>\u003cp>كان الثلج يذوب على وجهه ولا يمسحه. له شارب خفيف، وجرح في شفته السفلى، ويرفع كعب قدمه المصابة عن الأرض.\u003c/p>\u003cp>قال لين: «وصلنا قبل الشتاء.»\u003c/p>\u003cp>«من أي قرية؟ أنا سون لي. من قرى النهر الكبير، قرب معبر الصفصاف.» انتظر لحظة، ثم تقدم خطوة. «هل مررت بقرية شوان؟ أمي أرسلت أخي إليها.»\u003c/p>\u003cp>لم يتحرك الاسم في رأس لين. لم يجد وراءه طريقًا ولا ماء ولا بيتًا. وجد شياو دو ينظر إليه، والرجل الذي يحمل طفله يحدق بينهما كأنه ينتظر جوابًا عن شيء آخر.\u003c/p>\u003cp>«لا أعرفها.»\u003c/p>\u003cp>انطفأ بعض ما في وجه سون لي. قال: «ربما تسمونها باسم قديم. وراء تل صغير، وعندها—»\u003c/p>\u003cp>«ساعد هذه المرأة أولًا.»\u003c/p>\u003cp>خرج صوت شين يان من خلف لين. تجاوزته بخطوة قصيرة، ووقفت أمام المرأة ذات الساعد الملفوف. لم تلمس القماش. انحنت لتكون عيناها في مستوى عينيها.\u003c/p>\u003cp>«هل تستطيعين المشي إلى النزل؟»\u003c/p>\u003cp>أومأت المرأة، ثم ترنحت. وضع لين ذراعها السليمة على كتفه. كانت أخف مما توقع، وكانت رائحة الجرح أقرب الآن، حادة تحت رائحة الثياب المبتلة.\u003c/p>\u003cp>قال سون لي: «نحتاج أن نعرف إن وصل أحد قبلنا.»\u003c/p>\u003cp>قالت شين يان: «سنسأل. لكن الواقفة أمامك ستقع.»\u003c/p>\u003cp>أزاح عصاه عن الطريق فورًا. لم يكن في وجهه اتهام، وهذا جعل لين يجد صعوبة أكبر في النظر إليه.\u003c/p>\u003cp>جاءت هو سانيانغ من ناحية النزل، تلف رأسها بشال صوفي. أحصت الوجوه بعينيها، ثم مدت يدها إلى شياو دو وأمسكت كتفه قبل أن ينطق.\u003c/p>\u003cp>«اركض. أبعد الحطب عن النصف الجاف من الحظيرة. لا تفرشه في الثلج.»\u003c/p>\u003cp>«كلهم؟»\u003c/p>\u003cp>«أولًا أبعد الحطب. ثم عد واسأل.»\u003c/p>\u003cp>ركض. أشارت هي إلى رجلين من أهل القرية عند البوابة.\u003c/p>\u003cp>«أحدكما يأتي بالماء. والآخر يحمل من لا يمشي.»\u003c/p>\u003cp>لم يتحرك أحدهما إلا بعد أن نظر إلى الآخر. عندها تناولت هو سانيانغ حزمة من يد عجوز، وحملتها بنفسها، فسار خلفها الرجلان.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>قطعوا الطريق إلى النزل ببطء. لم تكن المسافة طويلة، لكن كل عتبة وكل بقعة جليد أوقفت شخصًا. امرأة تسند أمها، وصبي لا يبكي إلا حين تحاول أمه إنزاله عن ظهرها، وعجوز يحمل قدرًا مشروخًا بكلتا يديه.\u003c/p>\u003cp>قالت المرأة التي يستند إليها لين: «اسمي آن.»\u003c/p>\u003cp>«هل جُرح الساعد وحده؟»\u003c/p>\u003cp>«ضربني حين أمسكت الكيس.»\u003c/p>\u003cp>كانت أنفاسها قصيرة قرب أذنه. أراد أن يسأل عن الحمى، ثم أحس أن السؤال لن يغير ما يستطيع فعله في الطريق. رفع ذراعها قليلًا حين اعترضت قدمها حجرًا.\u003c/p>\u003cp>عند النزل، توقف الأب أمام الباب الضيق. ضغط الطفل إلى صدره وأدار كتفه كيلا يصطدم رأسه بالخشب.\u003c/p>\u003cp>قالت هو سانيانغ: «من هنا.»\u003c/p>\u003cp>فتحت باب الحظيرة. خرجت رائحة القش والحطب القديم. في الطرف القريب من الجدار نقل شياو دو رصتين من الخشب، ووقف يلهث فوق مساحة لا تكفي إلا نصف القادمين.\u003c/p>\u003cp>قال: «سأفرش القش.»\u003c/p>\u003cp>أمسكت شين يان حفنة منه، فعصرتها بين أصابعها. تناثر غبار رطب.\u003c/p>\u003cp>«ليس هذا. الأسفل مبتل.»\u003c/p>\u003cp>«هذا كل ما وجدته هنا.»\u003c/p>\u003cp>نظرت إلى هو سانيانغ. قالت صاحبة النزل: «فوق مخزن الشعير حزمة جافة. واحدة. لا أكثر.»\u003c/p>\u003cp>«والحبال؟»\u003c/p>\u003cp>«في المسمار عند الباب.»\u003c/p>\u003cp>ربطت شين يان حبلًا بين عمودين، وعلقت عليه عباءتين قديمتين جلبتهما امرأة من المطبخ. صار في آخر الحظيرة موضع مستور. أخذت حصيرتين إلى الطرف الأقرب من الباب.\u003c/p>\u003cp>«الجرح هنا. لا نغسل فوق مكان النوم.»\u003c/p>\u003cp>قالت آن: «أستطيع أن أجلس مع البقية.»\u003c/p>\u003cp>«أعرف. لكن الماء الوسخ لا يعرف.»\u003c/p>\u003cp>أخرجت من جيبها قطعة قماش جافة، ومسحت بها المقعد قبل أن تجلس المرأة. ثم دعت لين بإشارة، وأشارت إلى الدلو.\u003c/p>\u003cp>«الماء أولًا. لا القدر الذي شرب منه الجميع.»\u003c/p>\u003cp>مضى إلى البئر. خلفه سمع هو سانيانغ تمنع رجلًا من جر برميل نحو وسط الحظيرة.\u003c/p>\u003cp>«لا نار مفتوحة هنا. تريدون سقفًا أم رمادًا؟»\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين عاد لين، كانت آن تجلس وساعدها على قطعة خشب. ركعت أمامها امرأة من رفقائها، تقص طرف اللفافة بسكين صغير. التصق القماش بالجرح، فصدر من آن صوت حاد ثم أطبقت فمها على طرف شالها.\u003c/p>\u003cp>وضع لين الدلو. طلبت شين يان ماءً مغليًا يبرد في وعاء نظيف، ثم جلست على صندوق بدل أن تبقى منحنية.\u003c/p>\u003cp>قال لها: «اذهبي إلى الداخل. سأكمل.»\u003c/p>\u003cp>رفعت عينيها. «أي جزء ستكمل؟»\u003c/p>\u003cp>لم يجب.\u003c/p>\u003cp>«إذن ناولني الوعاء. وإذا احتجت إلى رفعها، طلبت منك ذلك.»\u003c/p>\u003cp>لم تكن تمزح تمامًا. أبعد الصندوق عن تيار الباب، ثم عاد بالماء. بللت المرأة طرف اللفافة، وانتظروا حتى لان. ظهر الجرح بطول إصبع، وحوله جلد أحمر منتفخ. عند حافته شيء رمادي لم يعرف لين إن كان وسخًا أم لحمًا ميتًا.\u003c/p>\u003cp>مد يده نحو الساعد ثم أوقفها. كان يعرف آلات تسخن وأسلاكًا تحترق. هذا ليس آلة.\u003c/p>\u003cp>قال: «هل في القرية من يرى الجروح؟»\u003c/p>\u003cp>أجابت هو سانيانغ من الباب: «أرسلت صبيًا. يأتي إذا وجدناه في بيته.»\u003c/p>\u003cp>«لا نفتح ما لا نعرفه.» قالت شين يان ذلك لرفيقة آن قبل أن تقرب سكينها. «نزيل الوسخ الظاهر بالماء، ثم نغطيه بقماش نظيف. والذي يفهم الجرح ينظر فيه.»\u003c/p>\u003cp>قالت آن من وراء الشال: «لا تقطعوا يدي.»\u003c/p>\u003cp>توقفت الأصابع كلها.\u003c/p>\u003cp>اقتربت هو سانيانغ. وضعت كوبًا في يد المرأة السليمة وقالت: «لم يأت أحد ليقطع يدك الآن. اشربي قليلًا.»\u003c/p>\u003cp>أبقت الكوب في يدها حتى شربت، ثم ابتعدت.\u003c/p>\u003cp>في الطرف الآخر أخذ طفل يضرب وعاءه الفارغ بالملعقة. صاح أبوه عليه، فشهق الطفل. نظرت شين يان إلى هو سانيانغ، لكن صاحبة النزل كانت قد التفتت إلى المطبخ.\u003c/p>\u003cp>«العصيدة خفيفة. من يأخذ أول وعاء لا يعود قبل أن يأخذ آخر واحد.»\u003c/p>\u003cp>نهضت شين يان لتشرف على القماش. أخذت ثوبين ممزقين من امرأة كانت تفك حزامها لتقدمه، وأعادت إليها الحزام.\u003c/p>\u003cp>«هذا يمسك ثوبك. نحتاج أطرافًا جافة، لا أن تتعري من البرد.»\u003c/p>\u003cp>أرسلت الحواف السليمة لتُغلى، ثم قسمت ما جف من القماش النظيف بين قدمين نازفتين وساعد آن. أبقت أصغر قطعة في يدها، ونظرت إلى الباقين، ثم شقتها نصفين.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>لم يدخل الأب في الطابور.\u003c/p>\u003cp>جلس خلف العباءتين والطفل على ركبتيه. كانت يداه كبيرتين بالنسبة إلى الوجه الذي بينهما. كلما مال الغطاء أصلحه بظفره، بحذر لا يحتاج إليه من تحته.\u003c/p>\u003cp>جثا لين قربه. حمل وعاء عصيدة ولم يعرف أين يضعه. الأرض قش، والصندوق منخفض، وركبتا الرجل مشغولتان.\u003c/p>\u003cp>قال الأب: «لا يأكل.»\u003c/p>\u003cp>أحس لين بحرارة الوعاء في راحتيه.\u003c/p>\u003cp>«هذا لك.»\u003c/p>\u003cp>«لا يأكل منذ قبل التل.»\u003c/p>\u003cp>ترك لين الوعاء على الصندوق. لم يقل إنه يفهم، ولم يمد يده إلى الطفل.\u003c/p>\u003cp>بعد وقت قال: «ما اسمه؟»\u003c/p>\u003cp>رفع الرجل وجهه. تشقق جلده عند جانب فمه حين حرك شفتيه.\u003c/p>\u003cp>«يون. كان يقول إن اسمه قصير، وإنه يريد اسمًا فيه ثلاث كلمات مثل رجال المدينة.» نظر إلى القماش الأزرق. «لم يبلغ الخامسة.»\u003c/p>\u003cp>جلس لين على عقبيه. خلف العباءة سمع احتكاك الأوعية، وسعالًا جافًا، وصوت هو سانيانغ تعد الملاعق.\u003c/p>\u003cp>قال الرجل: «كانت قدماه باردتين. وضعتهما هنا.» أشار إلى صدره. «مشى معنا أول الطريق. قلت له إذا بلغنا دخان البيوت أعطيته خبزًا. رأى الدخان أمس، لكنه لم يكن دخان بيوت.»\u003c/p>\u003cp>انقطعت الجملة. بقي فمه مفتوحًا قليلًا، بلا صوت.\u003c/p>\u003cp>مد لين الوعاء مرة أخرى. هذه المرة أخذه الرجل، لكنه لم يستطع رفعه، فوضع لين يده تحته حتى وصل إلى شفتيه.\u003c/p>\u003cp>دخلت هو سانيانغ ولم تتجاوز طرف العباءة. قالت: «عندي مكان أبرد خلف المخزن. بعيد عن الفئران. والباب يغلق.»\u003c/p>\u003cp>ضم الرجل الطفل بقوة.\u003c/p>\u003cp>«لن آخذه منك.» قالت. «حين تريد.»\u003c/p>\u003cp>قال: «الأرض حجر.»\u003c/p>\u003cp>«أعرف.»\u003c/p>\u003cp>«جربت بعصاي.»\u003c/p>\u003cp>هزت رأسها. لم تعرض حطبًا لا تملكه، ولم تتحدث عن الربيع. نزعت غطاء صوف قصيرًا عن ذراعها ووضعته على الصندوق.\u003c/p>\u003cp>«هذا للفّ. إن أردت.»\u003c/p>\u003cp>خرجت، وبقي طرف الغطاء فوق خشب الصندوق، قريبًا من يد الأب. مسه الرجل بأصابعه. وبعد قليل وضع الوعاء في يد لين، وبدأ يفرده.\u003c/p>\u003cp>ساعده لين في رفع يون. لم يكن وزن الطفل هو الذي جعله يحبس أنفاسه. كانت طريقة استقامة الذراع الصغيرة حين تحرك القماش. أدار الأب رأسه لحظة ثم أعاده، وثبت الغطاء تحت الذقن.\u003c/p>\u003cp>مشى لين إلى الغرفة الخلفية وهو يحمل المصباح. تبعه الأب، خطوة وراء خطوة. رفعت هو سانيانغ لوحًا عن صندوقين فارغين، وفرشت فوقه قطعة جافة. لم يضع الأب ابنه إلا بعدما مرر كفه على الخشب كله.\u003c/p>\u003cp>ثم طلب المصباح ليبقى قليلًا.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>حين عاد لين إلى الحظيرة، كان ضوء النهار قد خفت خلف الغيوم. جلس شياو دو عند الباب يربط خرقة حول قدم صبي. شد العقدة ثم فكها حين صرخ الصغير.\u003c/p>\u003cp>قال لين: «أرخها. لا يحتاج أن يركض بها.»\u003c/p>\u003cp>أرخاها معًا. كانت أصابع الصبي دافئة قليلًا الآن، لكن الجلد عند الكعب تشقق حتى ظهر تحته لون أحمر نيئ.\u003c/p>\u003cp>همس شياو دو: «لم أعرف.»\u003c/p>\u003cp>«ماذا؟»\u003c/p>\u003cp>«حين قلت عندنا اثنان. لم أرَ...» نظر ناحية المخزن، ثم إلى العصابة في يده. «ظننته يريد أن يرى أهله.»\u003c/p>\u003cp>قال لين: «كان يريد.»\u003c/p>\u003cp>«إذن لماذا لم تقل من أي قرية؟»\u003c/p>\u003cp>جاءت شين يان بخرقة أخرى، فناولتها للصبي. قالت: «ضع هذه تحت العقدة. جلدها قاسٍ.»\u003c/p>\u003cp>لم تكن إجابة. عرف لين ذلك، وعرف أن الصبي عرف أيضًا. التقت عيناه بعيني زوجته، ولم يجد فيهما مخرجًا تقترحه.\u003c/p>\u003cp>عند الحبل المعلق كانت امرأتان تنشران اللفافات الرطبة. طلبت شين يان أن تبعداها عن الطعام، ثم دعت شياو دو لمساعدتها في تبديل الماء. ترك الصبي العقدة للين ونهض.\u003c/p>\u003cp>خرج لين إلى الساحة ليصب الماء الوسخ في الحفرة البعيدة عن البئر. تلطخت حافة الدلو بشيء أصفر، فغسلها بحفنة ثلج ولم يطمئن، وعاد بها إلى المطبخ.\u003c/p>\u003cp>وقفت هو سانيانغ أمام رف الأوعية. أزاحت ثلاثة أكواب إلى الطرف، ثم أخرجت جرة صغيرة وفتحتها. لم يبق فيها من الدخن إلا ما يغطي قاعها بأصبعين.\u003c/p>\u003cp>قالت: «هذا للعشاء.»\u003c/p>\u003cp>«كم يبقى بعده؟»\u003c/p>\u003cp>«إذا أكل عابر سبيل هنا، يدفع. هؤلاء لا يدفعون. إذا بقيوا غدًا، يجب أن يعرفوا أن القدر لا يمتلئ بالنظر إليه.»\u003c/p>\u003cp>وضع الدلو مقلوبًا قرب النار، بعيدًا عن قدور الطبخ. «سنسأل أهل القرية عمّا يستطيعون تقديمه.»\u003c/p>\u003cp>«اسأل. لا تعد باسمي.» رفعت الجرة لتصب آخرها في المكيال. «واليوم ضاع من الطاحونة.»\u003c/p>\u003cp>نظر إلى النافذة. كان يستطيع بلوغها وتشغيل الحمار حتى الظلمة. تخيل الطريق، ثم تذكر الأب والمصباح الذي بقي عنده.\u003c/p>\u003cp>«أذهب ساعة؟»\u003c/p>\u003cp>أعادت المكيال إلى الرف. «الحجر لا يمشي، سيبقى مكانه. ابحث أولًا عن بطانية أخرى. العجوز عند الباب ما زالت ترتجف.»\u003c/p>\u003cp>وجد شياو دو في المخزن، ينتقي خرقًا لا ثقوب فيها. أخذا معه كيس خيش واسعًا، وحشواه بالقش الجاف الباقي. لم يصنعا منه بطانية، لكنه أبعد قدمَي العجوز عن الأرض. جلست شين يان قربها واختبرت ثوبها من الخلف؛ كان رطبًا عند الكتفين. طلبت من إحدى رفيقاتها أن تساعدها في تبديله وراء العباءة.\u003c/p>\u003cp>وقف لين ممسكًا بالكيس حتى فرغتا، ثم وضعه تحت قدميها. رفعت العجوز يدها كأنها ستقول شيئًا، لكن سعالها سبقها. أبقى يده وراء ظهرها حتى هدأت، ورأى سون لي يراقبه من قرب العمود.\u003c/p>\u003cp>كان سون لي يضع عصاه بين ركبتيه، ويتناول نصف رغيف ببطء، كأنه يخشى أن ينتهي بسرعة. وبجواره وقف يانغ، الذي جاء بلوحين لإسناد باب الحظيرة من الداخل.\u003c/p>\u003cp>قال سون: «حملتمونا في وقت صعب. لا أملك الآن ما أدفعه.»\u003c/p>\u003cp>قال لين: «ارتَح.»\u003c/p>\u003cp>«لكن إن كان عندكم خبر عن القرى...» مسح فمه بظهر يده. «من دخل الشمال قبلي قد يعرف ما حدث بعد رحيلنا.»\u003c/p>\u003cp>كان يانغ يجرب موضع اللوح، وظل وجهه نحو الباب. أما لين فظل واقفًا، يحمل خرقة لم يعد يحتاج إليها.\u003c/p>\u003cp>قال: «ليس عندي خبر عن أهلك.»\u003c/p>\u003cp>أومأ سون لي، مطأطئًا. ثم رفع رأسه مرة أخرى.\u003c/p>\u003cp>«حسنًا. سؤال واحد. المعبر القديم عند قرية شوان، هل عبرته قبل الجسر الحجري أم بعده؟ إن جئت من هناك ستعرف. أريد أن أعرف أي طريق أخذ الماء.»\u003c/p>\u003cp>سمع لين ضربة اللوح تتوقف عند الباب. لم يكن السؤال عن نسب ولا ختم ولا اسم غريب. جسر ومعبر؛ شيء يستطيع طفل من المكان أن يجيب عنه.\u003c/p>\u003cp>شد الخرقة بين أصابعه. على الطرف الآخر كانت شين يان تعيد الإناء إلى الأرض. لم تتدخل.\u003c/p>\u003cp>قال لين: «لا أعرف.»\u003c/p>\u003cp>ظل سون ينظر إليه. «لا تتذكر؟»\u003c/p>\u003cp>«لا أعرف المعبر، ولا أين يقع الجسر.»\u003c/p>\u003cp>خفض يانغ اللوح ببطء، ولم تصدر عنه ضربة هذه المرة.\u003c/p>"},{"n":30,"t":"الفصل الثلاثون: خريطة على الرماد","b":"\u003cp>في صباح اليوم السابع عشر بعد المئة، وجد لين سون لي يجلس عند طرف موقد النزل، يرسم بإصبعه على الرماد البارد الذي سقط فوق حجر الأرض.\u003c/p>\u003cp>كان قد وضع عصاه بمحاذاة ساقه الممدودة. أخذ ثلاث حصيات صغيرة من شق في الجدار، وحاول أن يثبت واحدة منها على الرماد. تدحرجت، فلحقها بيده ثم توقف حين رأى لين.\u003c/p>\u003cp>«هل أفسدت المكان؟»\u003c/p>\u003cp>«لا.» جثا لين على بعد ذراع منه. «ماذا ترسم؟»\u003c/p>\u003cp>«الطريق. العجوز التي كانت معنا لا تتذكر أين تركت حذاء ابنها. تظن أننا نعود إليه اليوم.»\u003c/p>\u003cp>رسم خطًا متعرجًا. لم يكن يشبه نهرًا من خرائط لين، لكنه ترك حوله فراغًا عريضًا.\u003c/p>\u003cp>«هذا الماء قبل الفيضان. وهذا التل. هنا كنا.» وضع حصاة. «وقرية شوان وراءه. إذا وقف الرجل على الجسر، رأى سقف بيت الحارس.»\u003c/p>\u003cp>لم يقل لين إنه يعرف. راقب الإصبع وهو يعبر خط النهر ثم يمسحه، ويعيده أبعد قليلًا.\u003c/p>\u003cp>دخلت شين يان تحمل كوبين من الماء الدافئ. أعطت سون أحدهما ووضعت الآخر قرب لين، ثم جلست على المقعد المنخفض. كانت تحرص على ألّا تدوس كومة الرماد.\u003c/p>\u003cp>قالت: «والطريق الذي جئتم منه إلى هنا؟»\u003c/p>\u003cp>حرّك سون الحصاة الثانية. «بقينا على الأرض العالية. حين وجدنا الطريق مقطوعًا، عدنا. ثم سرنا قرب الغابة. لهذا تأخرنا.»\u003c/p>\u003cp>توقف إصبعه عند نقطة صغيرة، وبقي هناك.\u003c/p>\u003cp>«هنا ماتت امرأة. لم تكن من قريتنا. كانت تخبئ شيئًا في كمها، وظن الرجل الذي أوقفنا أنه فضة.»\u003c/p>\u003cp>صعد من المطبخ صوت القدر على الحجارة. أحاط سون الكوب براحتَيه، من غير أن يشرب.\u003c/p>\u003cp>قال لين: «هل ضربوا آن هناك؟»\u003c/p>\u003cp>«قبل ذلك. هؤلاء آخرون.» شرب رشفة وأبعد الكوب عن فمه. «لا أعرف إن كانوا جماعة واحدة. آخرهم لم يحملوا علامات.»\u003c/p>\u003cp>حرّك الحصاة الثالثة نحو طرف الرسم. قال: «من هنا سلكنا درب الملح. بعده رأينا دخانكم.»\u003c/p>\u003cp>كان يقول: من الجنوب، فينتهي السؤال. على الرماد أمامه صار للجنوب قرى وجسور وقتلى يعرفهم هذا الرجل.\u003c/p>\u003cp>أبعد يده عن ركبته. لم يشأ أن تقترب من الرسم.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>جاء شياو دو بقطعة خبز، وانحنى بينهما قبل أن ينتبه إلى صمتهما.\u003c/p>\u003cp>«رسمت الجنوب؟»\u003c/p>\u003cp>أومأ سون.\u003c/p>\u003cp>أخذ الصبي الخبز بين أسنانه ليحرر يديه، ثم مد إصبعه فوق خط النهر.\u003c/p>\u003cp>قال سون: «لا تمسحه.»\u003c/p>\u003cp>رفع الصبي يده بسرعة. ابتلع لقمة كبيرة وقال: «كنت أريد أن أسأل. ربما جاء لين من الجهة الأخرى. من وراء التل، لا من الجسر.»\u003c/p>\u003cp>نظر لين إليه. «دو.»\u003c/p>\u003cp>لكن شياو دو كان قد وجد حلًا، واندفع إليه كما يندفع إلى باب مفتوح.\u003c/p>\u003cp>«الجنوب واسع. لاو ما يقول إن الرجل يسير فيه عشرين يومًا ولا يبلغ آخره. ويمكن أن يكون اسم القرية مختلفًا عند كل ناس. مثل طاحونة جياو. بعض الصغار يسمونها طاحونة لين وهي ليست—»\u003c/p>\u003cp>«هل جئت من الجهة الأخرى؟» سأل سون لين.\u003c/p>\u003cp>«لم أقل ذلك.»\u003c/p>\u003cp>ضاقت المسافة حول الموقد. عند الباب وقف رجل جاء يسأل عن حزام دابته، وبقي الحزام في يده. كانت هو سانيانغ ترفع الغطاء عن قدرها، ثم أعادته من غير أن تقلب ما فيه.\u003c/p>\u003cp>قال شياو دو، أهدأ قليلًا: «أنا أقصد ربما.»\u003c/p>\u003cp>قالت شين يان: «إذا لم نعرف، نترك المكان فارغًا.»\u003c/p>\u003cp>«لكنني أحاول أن—»\u003c/p>\u003cp>«أعرف ما تحاول.»\u003c/p>\u003cp>نظر إلى إصبعه المعلق فوق الرماد، وأعاده إلى جنبه. تحرك الرجل عند الباب ومضى بحزامه. تابعته عينا الصبي حتى اختفى، ثم عاد إلى سون.\u003c/p>\u003cp>«أنا لا أعرف الجنوب. لم أخرج أبعد من السوق.»\u003c/p>\u003cp>قال سون: «ولا طلبت منك شهادة.»\u003c/p>\u003cp>كان في صوته تعب أكثر مما فيه قسوة. مع ذلك احمر وجه شياو دو. وضع الخبز قرب الكوب، كأنه صار يثقل يده، ونهض.\u003c/p>\u003cp>نادته شين يان، لكنه قال: «أبدل الماء في الحظيرة.»\u003c/p>\u003cp>خرج. بقيت قطعة الخبز مكانه، حافتها المعضوضة بيضاء.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>عند الظهر خرج لين إلى الحظيرة بعد أن جلب حزمة حطب صغيرة من المخزن. كان أهل النزل قد تبرعوا بأردية قديمة وحصيرتين؛ أُلقيت الأشياء في كومة عند الباب، فصار الدخول أصعب من قبل.\u003c/p>\u003cp>وقفت شين يان وسط الكومة، تعطي كل قطعة لمن يحتاج إليها. أرسلت الثوب الأوسع إلى امرأة تحمل رضيعًا، وردت ملاءة مثقوبة إلى صاحبتها وطلبت منها أن تقص طرفها السليم للجراح. لم تكن تجمع الناس صفًا؛ كانت تنادي من مكانها وتنتظر أن يُسلَّم الشيء فعلًا قبل أن تأخذ غيره.\u003c/p>\u003cp>قال لين: «نحتاج أن نبعد هذه الكومة.»\u003c/p>\u003cp>«أجل. وهذا الطفل ينام فوق خرقة مبللة منذ ساعة لأن أباه ينتظر البطانية الكبيرة.»\u003c/p>\u003cp>أخذ لين الكومة إلى خارج الباب قطعة قطعة. أعطى الصبي غطاءً قصيرًا، وساعده على لفه حول ركبتيه. سكن الطفل تحت الغطاء، فتردد لين قبل أن يقرب وجهه. انتظر حتى رأى صدره يرتفع، ثم عدل القماش عند عنقه.\u003c/p>\u003cp>من وراء العباءة جاء صوت آن. طلبت ماء، فحمل إليها كوبًا. كان الذي يعرف معالجة الجروح قد مر في الصباح، وغسل الساعد وأعاد لفه، لكنه لم يعد بشفاء. على القماش الجديد بقعة رطبة بحجم ظفر.\u003c/p>\u003cp>سألها لين: «هل الألم أقل؟»\u003c/p>\u003cp>«حين لا أحركه.»\u003c/p>\u003cp>«والحرارة؟»\u003c/p>\u003cp>هزت كتفها السليمة. «لا أعرف. غطائي سميك الآن.»\u003c/p>\u003cp>لم يسألها عن الطريق. أعاد الكوب إلى يدها وبقي حتى شربت.\u003c/p>\u003cp>عند خروجه وجد الأب جالسًا عند الباب الخلفي. المصباح مطفأ إلى جواره، ويداه فارغتان. وقف لين لحظة ثم جلس على طرف الدرجة، تاركًا بينهما مكان شخص.\u003c/p>\u003cp>قال الأب: «سأل رجل القرية هذا الصباح عن اسمه، لعل له قريباً هنا.»\u003c/p>\u003cp>«يون؟»\u003c/p>\u003cp>أومأ. «أردت أن أقوله مرة أخرى قبل أن يكتبوه خطأ.»\u003c/p>\u003cp>قال لين الاسم بصوت منخفض. هز الرجل رأسه، ثم مسح عينيه بكمه كأنه ينزع غبارًا.\u003c/p>\u003cp>لم يطل لين الجلوس. حين قام، أبقى نصف الحطب قرب الباب الخلفي، وسار بالبقية إلى المطبخ.\u003c/p>\u003cdiv class=\"break\" aria-hidden=\"true\">✦ ✦ ✦\u003c/div>\u003cp>كان شياو دو واقفًا أمام عمته، ويداه وراء ظهره.\u003c/p>\u003cp>لم يتعمد لين الاستماع. دخل بالحطب، فرأى الصبي يرفع رأسه وينظر إليه. توقف كلامه لحظة، ثم استأنفه.\u003c/p>\u003cp>«سون قال إنه من عند معبر الصفصاف. وسأل عن قرية شوان. ولين قال إنه لا يعرف.»\u003c/p>\u003cp>وضعت هو سانيانغ السكين على اللوح. «قال لا يعرف القرية أم لا يعرف الرجل؟»\u003c/p>\u003cp>«القرية. والجسر. كنت هناك حين رسمها.»\u003c/p>\u003cp>«وكان يانغ هناك بالأمس؟»\u003c/p>\u003cp>«عند الباب. أنا لم أسمع كل كلام أمس.» حرك قدمه على الأرض. «واليوم قلت ربما جاءا من الجهة الثانية. هذا كلامي أنا. لم يقله لين.»\u003c/p>\u003cp>لم تنظر هو سانيانغ إلى الحطب الذي بين يدي لين. قالت للصبي: «ولماذا قلتَه؟»\u003c/p>\u003cp>«لأن الرجل كان ينظر إليه. والناس ينظرون. أردت أن ينتهوا.»\u003c/p>\u003cp>«فزادوا سؤالًا.»\u003c/p>\u003cp>أومأ شياو دو. أخذ نفسًا قصيرًا، ثم قال: «سأقول للرجل صاحب الحزام إنني لا أعرف. إذا رأيته في السوق.»\u003c/p>\u003cp>«قل ما سمعت فقط. ولا تبحث عن ناس لتروي لهم القصة.»\u003c/p>\u003cp>عاد الصبي إلى القدور. حمل قدرًا أكبر من ذراعيه، وأعاده حين اصطدم بحافة الحوض. هذه المرة لم يقل إنه يستطيع وحده؛ تناول لين المقبض الآخر، فرفعاه معًا.\u003c/p>\u003cp>حين وضعاه، همس شياو دو: «أنت غاضب؟»\u003c/p>\u003cp>قال لين: «لا.»\u003c/p>\u003cp>«لأنني قلت لها؟»\u003c/p>\u003cp>«كان عليّ أن أخبر عمتك بنفسي.»\u003c/p>\u003cp>نظر الصبي إلى الماء. جاءت من ورائهما ضربة السكين على البصل، واحدة بعد أخرى، بالمسافة نفسها.\u003c/p>\u003cp>عاد شياو دو إلى الحوض بعد أن ترك لي
